    cards: [
      { t: "Diarreia aguda", q: "Qual a base do tratamento da diarreia aguda e como hidratar o adulto conforme a volemia?", a: "<p class=\"lead\"><strong>Reidratação, de preferência oral.</strong> O antibiótico fica para casos selecionados.</p><ul><li><strong>Sem hipovolemia:</strong> SRO após cada evacuação (até 2 L/dia), manter a alimentação, reavaliar em 6 h.</li><li><strong>Alguma hipovolemia:</strong> SRO 2,2–4 L nas primeiras 4 h (ou 50–100 mL/kg em 3–4 h) + reposição das perdas.</li><li><strong>Grave:</strong> IV com Ringer lactato 30 mL/kg em 30 min, depois mais lento; meta de 200 mL/kg em 24 h. Trocar para SRO quando consciente e estável.</li><li>Cuidado com infusão rápida em cardiopatas.</li><li>Bebida esportiva, refrigerante e suco não são SRO.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Como é o Plano C do Ministério da Saúde para adulto com desidratação grave?", a: "<p class=\"lead\"><strong>Acima de 5 anos (inclui adultos):</strong></p><ul><li>SF 0,9% 30 mL/kg em 30 min.</li><li>Depois Ringer lactato 70 mL/kg em 2 h 30 min.</li><li>Manutenção com SG 5% + SF 0,9% (4:1), reposição 1:1 e KCl 10%.</li><li>Alternativa: Ringer lactato ou solução de cólera desde o início (SF só se faltar), mirando 200 mL/kg em 24 h.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Quando dar antibiótico empírico na diarreia aguda e qual a primeira escolha?", a: "<p class=\"lead\"><strong>Indicação:</strong> gravidade (febre ≥ 38,5 °C, hipovolemia, ≥ 6 evacuações/dia, dor intensa), características inflamatórias (sangue, muco) ou hospedeiro de risco.</p><ul><li><strong>Azitromicina 500 mg VO 1×/dia por 3 dias</strong> (ou 1 g em dose única): preferida com febre ou disenteria e risco de resistência a quinolona.</li><li>Alternativa: <strong>ciprofloxacino 500 mg 12/12 h por 3 dias</strong>.</li><li>Aquosa sem gravidade: <strong>não</strong> dar antibiótico.</li><li>Suspeita de STEC (sangue sem febre): reter o antibiótico até o teste.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Qual o esquema do MS para adulto com diarreia com sangue?", a: "<ul><li><strong>Ciprofloxacino 500 mg VO 12/12 h por 3 dias.</strong></li><li>Sangue persistente após 48 h com bom estado geral: <strong>ceftriaxona 2 g IM 1×/dia por 2–5 dias</strong>.</li><li>Mau estado geral: hospital.</li><li>Trofozoítos com hemácias: tratar amebíase (metronidazol 500–750 mg 3×/dia por 7–10 dias + agente intraluminal).</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Quando a loperamida pode e quando não pode ser usada na diarreia aguda?", a: "<p class=\"lead\"><strong>Dose:</strong> 4 mg, depois 2 mg após cada evacuação não formada (máximo 16 mg/dia, por &lt; 2 dias).</p><ul><li><strong>Pode:</strong> diarreia sem sangue e sem febre (ou febre baixa).</li><li><strong>Evitar:</strong> disenteria (a não ser associada a antibiótico) e suspeita de C. difficile.</li><li>Mascara a perda de volume; risco de íleo, megacólon e torsades em doses altas.</li><li>Alternativas: subsalicilato de bismuto (cuidado com gestante); racecadotril 100 mg 3×/dia.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Quais orientações de dieta, antiemético e alta na diarreia aguda?", a: "<ul><li><strong>Dieta:</strong> manter a alimentação, fracionada; amidos e cereais cozidos, banana, sopas; evitar gordura e lácteos (exceto iogurte) por semanas.</li><li>Probióticos não têm benefício comprovado em adultos.</li><li><strong>Antiemético:</strong> ondansetrona 4–8 mg VO; iniciar a SRO 15 min depois, em pequenos volumes.</li><li><strong>Retorno se:</strong> febre persistente, sangue, vômitos incoercíveis, oligúria ou dor intensa. Reavaliar o antibiótico em 48 h.</li><li>Controle de cultura não é indicado em imunocompetentes; notificar surtos.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Quando tratar salmonelose não tifoide e por quanto tempo?", a: "<p class=\"lead\"><strong>Imunocompetente de 12 meses a 50 anos com quadro leve: não tratar.</strong></p><ul><li><strong>Tratar:</strong> quadro grave (&gt; 9–10 evacuações/dia, febre alta, internação) ou alto risco (&lt; 12 meses, &gt; 50 anos com doença vascular, prótese, imunossupressão, HIV).</li><li>Duração: 3–7 dias no grave sem bacteremia; ≥ 14 dias no imunocomprometido; 2–6 semanas se CD4 &lt; 200.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Mulher pós-colecistectomia com diarreia por ácidos biliares. Qual a prescrição?", a: "<ul><li><strong>Colestiramina 2 g VO 1–2×/dia, dissolvida em líquido, titulando</strong> (ou 4 g 1–2×/dia, máximo 24 g/dia).</li><li>Tomar os outros medicamentos ≥ 1 h antes ou 4–6 h depois da resina.</li><li>Evitar sorbitol e excesso de cafeína e álcool.</li><li>Retorno em 4–6 semanas; sem resposta ou com alarme, colonoscopia e gastroenterologista.</li><li>Muitos melhoram sozinhos em semanas a meses.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Quais terapias empíricas são aceitáveis na diarreia crônica?", a: "<ul><li><strong>Ácidos biliares</strong> (colecistectomia, ressecção ileal &lt; 100 cm, radiação): resina.</li><li><strong>Suspeita de lactose:</strong> restrição temporária, que também funciona como teste.</li><li><strong>SIBO recorrente</strong> com fator predisponente: antibiótico empírico.</li><li><strong>Agente osmótico identificável:</strong> retirar.</li><li><strong>Sintomático:</strong> loperamida, fibras, resinas (contraindicadas na colite pseudomembranosa).</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Quando encaminhar o paciente com diarreia crônica ao gastroenterologista?", a: "<ul><li>Sinais de alarme ou diarreia grave.</li><li>Suspeita de DII.</li><li>Diagnóstico inconclusivo após a avaliação inicial.</li><li>Falha da terapia empírica.</li><li>Manejo de longo prazo (DII, pancreatite crônica).</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Quais medidas gerais para todo paciente com CDI?", a: "<ul><li><strong>Suspender o antibiótico desencadeante</strong> (forte; antibiótico concomitante aumenta falha e recorrência).</li><li><strong>Precauções de contato:</strong> quarto privativo com banheiro, luvas e avental, <strong>lavar as mãos com água e sabão</strong> (álcool não mata esporo); manter ≥ 48 h após cessar a diarreia.</li><li>Hidratação e eletrólitos; dieta livre.</li><li>Evitar antimotilidade (só se a perda for difícil de repor, já tratando e sem íleo).</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Qual o tratamento do 1º episódio de CDI (não grave ou grave)?", a: "<ul><li><strong>Fidaxomicina 200 mg VO 12/12 h por 10 dias</strong> (preferida).</li><li>Ou <strong>vancomicina 125 mg VO 6/6 h por 10 dias.</strong></li><li><strong>Metronidazol 500 mg VO 8/8 h por 10–14 dias</strong> só se as anteriores não estiverem disponíveis e a doença não for grave.</li><li>Estender a 14 dias se a resposta for lenta ou houver DII.</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Qual o tratamento da CDI fulminante?", a: "<ul><li><strong>Vancomicina 500 mg VO ou por SNG 6/6 h + metronidazol 500 mg IV 8/8 h.</strong></li><li>Íleo: <strong>vancomicina retal</strong> (500 mg em 100 mL de SF, enema de retenção 6/6 h).</li><li>Fidaxomicina não é usada.</li><li>Internar; avaliação cirúrgica precoce; reavaliar em 24–48 h.</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Quando indicar cirurgia na CDI e qual cirurgia fazer?", a: "<p class=\"lead\"><strong>Consulta cirúrgica precoce com qualquer um:</strong> hipotensão, febre ≥ 38,5 °C, íleo ou distensão importante, peritonite, alteração mental, leucócitos ≥ 20.000, lactato &gt; 2,2, UTI, falência de órgão, ou falta de melhora em 3–5 dias de tratamento máximo.</p><ul><li>Cirurgia: <strong>colectomia subtotal com preservação do reto</strong>.</li><li>Alternativa: ileostomia em alça com lavagem e vancomicina anterógrada.</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Como tratar as recorrências de CDI?", a: "<ul><li><strong>1ª recorrência:</strong> se tratou com vancomicina, fidaxomicina (10 dias ou esquema estendido). Se tratou com fidaxomicina, vancomicina em desmame (125 mg 6/6 h por 10–14 dias, depois 12/12 h, 1×/dia e a cada 2–3 dias).</li><li><strong>2ª recorrência:</strong> fidaxomicina, desmame de vancomicina ou vancomicina seguida de rifaximina, + produto de microbiota fecal.</li><li><strong>≥ 3ª:</strong> esquema prolongado + transplante de microbiota fecal; se não for possível, vancomicina supressiva 125 mg/dia.</li><li>Probióticos: não usar.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Crise adrenal no PS (adulto, Addison conhecido, gastroenterite). Qual a prescrição?", a: "<ul><li><strong>Hidrocortisona 100 mg IV em bolus agora</strong>, antes de qualquer resultado.</li><li>Depois <strong>50 mg IV 6/6 h</strong> (ou 200 mg/24 h em infusão).</li><li><strong>SF 0,9% 1.000 mL na 1ª hora</strong>, depois SG 5% em SF; 2–3 L em 12–24 h. Nada hipotônico.</li><li>Glicemia capilar 2/2 h; glicose 50% se &lt; 55 mg/dL com sintomas.</li><li>Na⁺, K⁺ e creatinina a cada 4–6 h; monitor se K⁺ alto.</li><li>Investigar e tratar o desencadeante (culturas, antiemético).</li><li>Dia 2: HC 50 mg 12/12 h, com desmame em 1–3 dias.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Por que não dar fludrocortisona na crise adrenal? E se só houver dexametasona?", a: "<ul><li>Hidrocortisona ≥ 40 mg/dia já tem efeito mineralocorticoide (~0,1 mg de fludrocortisona), e a fludrocortisona leva dias para agir.</li><li>Retomar <strong>fludrocortisona 0,1 mg VO pela manhã</strong> quando a HC cair abaixo de 40 mg/dia.</li><li><strong>Dexametasona</strong> (4–6 mg IV/dia) não tem ação mineralocorticoide: o volume é obrigatório e, na primária, fludrocortisona 0,2 mg.</li><li>A dexametasona não interfere no ensaio de cortisol, por isso permite tratar enquanto se investiga.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Qual a reposição crônica na doença de Addison?", a: "<ul><li><strong>Hidrocortisona 15–25 mg/dia em 2–3 tomadas</strong>, com a maior dose ao acordar (por exemplo, 10 mg às 7 h + 5 mg às 12 h + 2,5 mg às 16 h).</li><li>Alternativas: <strong>prednisolona 3–5 mg/dia</strong> ou <strong>prednisona 5 mg/dia</strong> (as mais usadas no Brasil, porque a HC oral só existe manipulada).</li><li>Evitar dexametasona.</li><li><strong>Fludrocortisona 0,05–0,1 mg/dia pela manhã:</strong> 0,05 mg com HC, 0,1 mg com prednisona ou prednisolona.</li><li>Sal à vontade. DHEA 25–50 mg só em mulheres selecionadas.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Quais são as \"regras do dia doente\" na insuficiência adrenal?", a: "<ul><li><strong>Doença febril leve ou moderada:</strong> dobrar ou triplicar a dose por 3 dias (\"regra 3×3\"); triplicar se febre &gt; 38,9 °C.</li><li><strong>Vômitos ou diarreia sem tolerar VO:</strong> HC 100 mg IM ou SC em casa e ir à urgência.</li><li><strong>Internação não UTI:</strong> HC 50–75 mg/dia fracionada.</li><li><strong>Doença crítica, trauma maior ou parto:</strong> HC 100 mg + 200 mg/dia.</li><li>Cirurgia grande: 100 mg antes e 150–200 mg/dia por 2–3 dias.</li><li>Não alterar o mineralocorticoide; estresse psicológico e exercício moderado não exigem aumento.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Quais orientações e qual educação dar ao paciente com Addison na alta?", a: "<ul><li>Paciente e um familiar devem saber as doses, quando aumentá-las e como aplicar a injeção.</li><li><strong>Cartão ou bracelete de identificação.</strong></li><li><strong>Kit de emergência:</strong> HC 100 mg + seringa (\"na dúvida, aplique\").</li><li>Sal à vontade; aumentar a fludrocortisona em 50–100% (ou mais sódio) no calor.</li><li>Avisar médico, dentista e anestesista.</li><li>Jejum religioso: trocar por prednisolona 5 mg antes do jejum.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Como ajustar a dose no seguimento do Addison?", a: "<p class=\"lead\"><strong>Intervalos:</strong> a cada 3 meses no início, depois anual. Meta: assintomático, com peso, PA (inclusive postural) e eletrólitos normais e renina no limite superior.</p><ul><li><strong>Edema, HAS, hipocalemia, renina baixa:</strong> excesso de fludrocortisona (reduzir, não suspender).</li><li><strong>Ganho de peso e insônia:</strong> excesso de glicocorticoide.</li><li><strong>Desejo de sal, K⁺ alto, renina alta:</strong> falta de mineralocorticoide.</li><li><strong>Anorexia e perda de peso:</strong> falta de glicocorticoide.</li><li>Rastrear anualmente DM1, tireoide, celíaca, B12 e falência ovariana na forma autoimune.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Quais interações e situações especiais mudam a dose de glicocorticoide no Addison?", a: "<ul><li><strong>Indutores do CYP3A4</strong> (rifampicina, fenitoína, barbitúricos, mitotano) exigem dose maior. Atenção à rifampicina na TB adrenal.</li><li><strong>Inibidores</strong> (claritromicina, azólicos, ritonavir, diltiazem, verapamil, toranja) exigem dose menor.</li><li><strong>Hipotireoidismo associado:</strong> corticoide primeiro, levotiroxina depois (senão precipita crise).</li><li><strong>Gestação:</strong> preferir HC; aumentar 20–40% no 3º trimestre; dose de estresse no parto.</li><li>Hipertensão em uso de fludrocortisona: IECA ou BRA; espironolactona é contraindicada.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Qual a conduta inicial na suspeita de SJS/NET?", a: "<ul><li><strong>Suspender o fármaco culpado imediatamente</strong>, pelo ALDEN e pela latência (cada dia de antecedência reduz a mortalidade).</li><li>Avaliação hospitalar; estimar a SC destacada (regra dos nove) e o <strong>SCORTEN em 24 h</strong>.</li><li><strong>Transferir para centro de queimados, dermatologia ou UTI</strong> se SC ≥ 10%, progressão rápida ou piora orgânica (o atraso aumenta a mortalidade).</li><li>O suporte multidisciplinar é a base do tratamento.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Como fazer fluidos, temperatura, nutrição e dor na SJS/NET?", a: "<ul><li><strong>Fluidos:</strong> 2 mL/kg × % de SC nas primeiras 24 h (cerca de um terço a menos que em queimados), titulando pela diurese de 0,5–1 mL/kg/h.</li><li><strong>Ambiente</strong> a 28–32 °C.</li><li><strong>Nutrição precoce:</strong> 20–25 kcal/kg/dia na fase catabólica; SNG se necessário.</li><li><strong>Dor:</strong> paracetamol na leve; opioide (morfina IV) na moderada a grave; doses extras antes dos curativos.</li><li><strong>Feridas:</strong> conservadora (epiderme deixada como curativo biológico, curativos não aderentes, colchão de ar).</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Como prevenir e tratar infecção na SJS/NET?", a: "<ul><li><strong>Antibiótico profilático não é recomendado.</strong></li><li>Manuseio estéril e antissepsia (clorexidina, polihexanida, nitrato de prata).</li><li><strong>Evitar sulfadiazina de prata</strong> se o culpado for uma sulfonamida.</li><li>Culturas de pele, sangue, urina e cateteres a cada ~48 h.</li><li>Tratar ao primeiro sinal (hipotermia, confusão, hipotensão, oligúria) com antibiótico guiado por cultura (S. aureus, Pseudomonas).</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Quais cuidados com olho, mucosas e via aérea na SJS/NET?", a: "<ul><li><strong>Olho:</strong> exame oftalmológico diário com fluoresceína; lubrificante; corticoide + antibiótico tópico (grau 1); separar aderências; <strong>membrana amniótica</strong> nos graus 2–3.</li><li><strong>Urogenital:</strong> exame precoce, corticoide tópico, cremes de barreira, sonda vesical; dilatador vaginal se houver acometimento.</li><li><strong>Oral:</strong> lidocaína viscosa.</li><li><strong>Pulmão:</strong> radiografia e gasometria; sintomas respiratórios levam à UTI. <strong>VNI contraindicada.</strong></li><li>Também: IBP se não houver dieta enteral, profilaxia de TVP, controle glicêmico.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Existe terapia farmacológica específica para SJS/NET?", a: "<p class=\"lead\"><strong>Nenhuma é comprovada.</strong> O suporte é a base.</p><ul><li><strong>Ciclosporina 3–5 mg/kg/dia VO</strong>, iniciada em 24–48 h: sugerida.</li><li><strong>Etanercepte 50 mg SC:</strong> alternativa se a ciclosporina for contraindicada.</li><li>Corticoide sistêmico de rotina: não recomendado (papel incerto).</li><li><strong>IVIG isolada: não usar</strong>.</li><li><strong>Talidomida: contraindicada</strong>, aumentou a mortalidade.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Quais sequelas acompanhar e quais orientações dar após a SJS/NET?", a: "<ul><li>Sequelas oculares crônicas (20–75%), cicatrizes e discromias, estenoses e aderências genitais e esofágicas, alterações ungueais e capilares, impacto psicológico.</li><li>Seguimento com oftalmologia, dermatologia e ginecologia.</li><li><strong>Nunca mais usar o fármaco culpado</strong> nem os de reação cruzada; registrar como alergia, levar cartão ou bracelete e avisar familiares (risco genético).</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Quais as medidas iniciais na OCA ou IAMCSST (os \"4 As\")?", a: "<ul><li>Sala de emergência, monitorização, 2 acessos, <strong>O₂ só se SpO₂ &lt; 90%</strong>.</li><li><strong>A</strong>AS 300 mg mastigado, depois 100 mg/dia.</li><li>Inibidor de P2Y12.</li><li><strong>A</strong>nticoagulação.</li><li><strong>A</strong>brir a artéria (reperfusão).</li><li>Não esperar troponina.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Como escolher entre angioplastia primária e fibrinólise?", a: "<ul><li><strong>ICP primária</strong> (preferida) se feita em até <strong>90 min</strong> no serviço com hemodinâmica, ou <strong>120 min</strong> com transferência.</li><li><strong>Fibrinólise em até 30 min</strong> da chegada se a ICP não for possível em 120 min. Benefício até 12 h de dor (maior nas primeiras 3 h).</li><li>Preferir ICP: choque, Killip ≥ 3, contraindicação ao trombolítico, apresentação tardia (&gt; 3 h), dúvida diagnóstica.</li><li>Na realidade brasileira, sem hemodinâmica, a fibrinólise costuma ser a opção.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Prescrição para IAMCSST indo à angioplastia primária.", a: "<ul><li>Jejum e monitorização; O₂ se SpO₂ &lt; 90%.</li><li><strong>AAS 300 mg VO.</strong></li><li><strong>Clopidogrel 600 mg</strong> (depois 150 mg/dia por 1 semana) <strong>ou ticagrelor 180 mg</strong> (depois 90 mg 12/12 h).</li><li><strong>Atorvastatina 80 mg.</strong></li><li>Dipirona 1 g IV; dinitrato de isossorbida 5 mg SL se não houver contraindicação.</li><li>HNF durante o procedimento.</li><li>Prasugrel 60 mg só com anatomia conhecida (contraindicado se AVC/AIT, ≥ 75 anos, &lt; 60 kg).</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Prescrição para IAMCSST que vai receber fibrinólise.", a: "<ul><li><strong>AAS 300 mg + clopidogrel 300 mg</strong> (≥ 75 anos: 75 mg, sem ataque).</li><li><strong>Tenecteplase (dose por peso, em bolus único) ou alteplase IV.</strong></li><li><strong>Enoxaparina 30 mg IV + 1 mg/kg SC 12/12 h</strong> (≥ 75 anos: sem bolus e 0,75 mg/kg), por até 8 dias ou até a alta.</li><li>Estatina de alta potência.</li><li>ECG a cada 30 min; UTI.</li><li>Não usar nitroglicerina junto com alteplase (reduz a eficácia).</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Quais as contraindicações absolutas aos fibrinolíticos?", a: "<ul><li>AVC hemorrágico prévio em qualquer tempo; AVC isquêmico ou AIT em 3 meses.</li><li>Neoplasia intracraniana ou malformação arteriovenosa.</li><li>Sangramento ativo (exceto menstruação).</li><li><strong>Suspeita de dissecção de aorta.</strong></li><li>TCE ou trauma facial importante, ou cirurgia de grande porte (intracraniana ou medular), em 3 meses.</li><li>Relativas: PA &gt; 180/110, gestação, RCP prolongada, uso de anticoagulante.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Depois da fibrinólise, o que fazer?", a: "<p class=\"lead\"><strong>Avaliar os critérios de reperfusão:</strong> alívio da dor, redução do supra de ST &gt; 50% e arritmia de reperfusão (RIVA).</p><ul><li><strong>Reperfundiu:</strong> estratégia fármaco-invasiva, com cateterismo entre 3 e 24 h.</li><li><strong>Não reperfundiu</strong> (dor e supra persistem em 60–90 min): <strong>angioplastia de resgate em até 2 h.</strong></li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Quais as contraindicações de betabloqueador e nitrato no IAM?", a: "<ul><li><strong>Betabloqueador:</strong> FC &lt; 60, BAV de 2º ou 3º grau ou PR &gt; 240 ms, PAS &lt; 90, choque, sinais de IC, asma ou DPOC grave. Risco de choque se &gt; 70 anos, PAS &lt; 120 ou FC &gt; 110 (COMMIT). Dar VO nas primeiras 24 h quando estável.</li><li><strong>Nitrato:</strong> infarto de VD, PAS &lt; 90, inibidor de PDE-5 em 24–48 h, estenose aórtica grave, FC &lt; 50 ou &gt; 100.</li><li><strong>Morfina:</strong> só na dor refratária (aumenta a mortalidade e reduz a absorção do clopidogrel).</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Choque cardiogênico no IAM: qual a conduta de reperfusão?", a: "<p class=\"lead\"><strong>Angioplastia primária é a escolha</strong>, mesmo com demora um pouco acima de 90 min; a trombólise é pouco eficaz.</p><ul><li><strong>CULPRIT-SHOCK:</strong> tratar apenas a lesão culpada (mortalidade menor que a revascularização completa).</li><li>Complicação mecânica: suporte (inotrópico, balão intra-aórtico, nitroprussiato) + <strong>cirurgia de emergência</strong>; pericardiocentese no tamponamento.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Qual a prescrição de alta após IAM (prevenção secundária)?", a: "<ul><li><strong>AAS 100 mg/dia</strong> indefinidamente.</li><li><strong>Segundo antiplaquetário</strong> (clopidogrel 75 mg ou ticagrelor 90 mg 12/12 h) por <strong>≥ 12 meses</strong>.</li><li><strong>Estatina de alta potência</strong> (atorva 80, rosuva 20 ou sinva 40), meta de LDL &lt; 50 mg/dL.</li><li><strong>Betabloqueador</strong> se FE &lt; 40%.</li><li><strong>IECA</strong> se IC, DM, HAS, DRC ou FE &lt; 40% (BRA se intolerância).</li><li><strong>Antagonista mineralocorticoide</strong> se FE &lt; 40% com DM ou IC.</li><li>Parar de fumar, reabilitação; IBP se dupla antiagregação com risco de sangramento.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Prescrição na sala de emergência para IAM sem supra de alto risco com cateterismo < 24 h.", a: "<ul><li>Jejum, monitorização, ECG seriado se dor; O₂ só se SpO₂ &lt; 90%.</li><li><strong>AAS 300 mg mastigado</strong>, depois 100 mg/dia.</li><li><strong>Segundo antiagregante:</strong> aguardar a anatomia (ticagrelor ou prasugrel na sala de hemodinâmica); se o cateterismo passar de 24 h, clopidogrel 300 mg ou ticagrelor 180 mg.</li><li><strong>Enoxaparina 1 mg/kg SC 12/12 h</strong> até o cateterismo.</li><li><strong>Atorvastatina 80 mg.</strong></li><li>Nitrato SL para dor (IV se persistir).</li><li>Metoprolol VO após estabilização; dipirona; morfina só se refratária.</li><li><strong>Não trombolisar.</strong></li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Como fazer a anticoagulação na SCASSST?", a: "<ul><li><strong>Enoxaparina 1 mg/kg SC 12/12 h</strong> (&gt; 75 anos: 0,75 mg/kg; ClCr &lt; 30: 1 mg/kg 1×/dia).</li><li><strong>HNF</strong> 60–70 UI/kg (máximo 5.000) + 12–15 UI/kg/h, com TTPa 1,5–2,5×.</li><li><strong>Fondaparinux 2,5 mg SC 1×/dia</strong> (menos sangramento; contraindicado se ClCr &lt; 20; exige bolus de HNF na ICP).</li><li>Não trocar entre heparinas.</li><li>Suspender após a ICP, salvo outra indicação.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Como escolher o inibidor de P2Y12 na SCA?", a: "<ul><li><strong>Ticagrelor 180 mg depois 90 mg 12/12 h:</strong> todo o espectro (clínico, ICP ou CRM); causa dispneia e pausas.</li><li><strong>Prasugrel 60 mg depois 10 mg/dia:</strong> só com anatomia conhecida e ICP. Contraindicado se AVC ou AIT; 5 mg se ≥ 75 anos ou &lt; 60 kg. Pré-tratamento é III.</li><li><strong>Clopidogrel 300 mg (600 na ICP) depois 75 mg/dia:</strong> se usa anticoagulante oral, tem alto risco de sangramento ou não há os outros. Evitar omeprazol.</li><li>Dupla antiagregação por 12 meses. Suspender 5 dias antes de cirurgia (prasugrel, 7).</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Paciente com SCASSST de muito alto risco: dor refratária, hipotensão, IC aguda. Qual a conduta?", a: "<p class=\"lead\"><strong>Cateterismo imediato (&lt; 2 h)</strong>, sem pré-tratamento com P2Y12 (dar na sala).</p><ul><li>Unidade coronária; VNI se houver congestão importante.</li><li>Se surgir padrão oclusivo no ECG, conduzir como OCA.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Como fazer nefroproteção antes do cateterismo em idoso, diabético ou com DRC?", a: "<ul><li><strong>SF 0,9% 1 mL/kg/h por 12–24 h antes e 12–24 h depois</strong>, com cuidado na disfunção de VE.</li><li>Se precisar ser precoce ou houver restrição hídrica: bicarbonato de sódio 8,4% 150 mL + água destilada 850 mL, a 3 mL/kg/h por 1 h antes e a 1 mL/kg/h por 6 h depois.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "CRM ou angioplastia na SCA multiarterial?", a: "<ul><li><strong>Tronco:</strong> CRM.</li><li><strong>Triarterial:</strong> CRM (sobretudo com SYNTAX &gt; 22).</li><li><strong>Diabético multiarterial:</strong> CRM (FREEDOM reduziu IAM e mortalidade).</li><li><strong>1 vaso sem DA proximal:</strong> ICP.</li><li>Casos complexos: Heart Team.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Quais orientações dar na alta após SCASSST?", a: "<ul><li>Não interromper a dupla antiagregação nos 12 meses, nem antes de procedimentos sem falar com o cardiologista.</li><li>Retornar se a dor voltar, durar &gt; 20 min, ocorrer em repouso, ou se surgir dispneia súbita.</li><li>Não usar sildenafila ou tadalafila se estiver em uso de nitrato.</li><li>Estatina de alta dose por toda a vida, com LDL &lt; 50 (ezetimiba e depois iPCSK9 se não atingir).</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Quais os dois pilares do tratamento da DAC crônica?", a: "<p class=\"lead\"><strong>1) Prevenir eventos</strong> (morte, IAM, AVC): estilo de vida, antitrombótico, hipolipemiante, PA e glicemia.</p><p class=\"\"><strong>2) Aliviar a angina:</strong> antianginosos e, se indicada, revascularização.</p><ul><li>Antianginosos melhoram o sintoma, não o prognóstico.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Qual o tratamento para prevenir eventos na DAC crônica?", a: "<ul><li><strong>AAS 75–100 mg/dia</strong> (clopidogrel 75 mg como alternativa).</li><li><strong>Estatina de alta potência</strong> com LDL &lt; 50 mg/dL; depois + ezetimiba; depois iPCSK9 ou inclisirana.</li><li><strong>IECA</strong> se HAS, DM, FE ≤ 40% ou DRC; PA &lt; 130/80.</li><li>DM2: iSGLT2 ou aGLP-1. Colchicina 0,5 mg. Vacina de influenza anual.</li><li><strong>Estilo de vida:</strong> dieta mediterrânea, ≥ 150 min/semana de exercício + resistido, reabilitação, parar de fumar (vareniclina), perder 5–10% do peso.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Como tratar a angina na DAC crônica?", a: "<ul><li><strong>Nitrato SL para todos</strong>, nas crises e antes de esforços.</li><li><strong>Começar por betabloqueador ou BCC</strong>; associar outro se a resposta for insuficiente.</li><li><strong>Betabloqueador:</strong> FC alta, pós-IAM, FE reduzida.</li><li><strong>BCC:</strong> asma ou DPOC, vasoespasmo. Verapamil e diltiazem são contraindicados na FE reduzida.</li><li><strong>PA baixa:</strong> ranolazina, trimetazidina; ivabradina se FE ≤ 40% em ritmo sinusal.</li><li><strong>Bradicardia:</strong> di-hidropiridínico, nitrato, ranolazina.</li><li>Nitrato de longa ação exige intervalo livre (tolerância).</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "O que NÃO fazer na DAC crônica?", a: "<ul><li>Associar clopidogrel ao AAS sem SCA ou ICP recente.</li><li>AINE crônico.</li><li>Suplementos (ômega-3 comum, vitaminas); terapia hormonal sistêmica pós-menopausa.</li><li>Testes de isquemia ou cateterismo periódicos sem mudança clínica.</li><li>Ivabradina com FE &gt; 40% sem IC.</li><li>Betabloqueador para todos: pós-IAM com FE ≥ 50% não tem benefício (REDUCE-AMI, REBOOT); reavaliar após 1 ano.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Quando revascularizar na DAC crônica?", a: "<ul><li><strong>Para melhorar o prognóstico:</strong> lesão de tronco; triarterial; 1–2 vasos incluindo a DA proximal; multiarterial com FE ≤ 35% (CRM, STICH); isquemia extensa.</li><li><strong>Para aliviar sintomas:</strong> angina limitante apesar do tratamento otimizado (ORBITA-2).</li><li>ISCHEMIA: em isquemia moderada a grave, a estratégia invasiva não reduziu morte nem IAM, mas melhorou a angina.</li><li><strong>Multiarterial com DM:</strong> CRM.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Como orientar o exercício na DAC crônica?", a: "<ul><li><strong>Aeróbico ≥ 150 min/semana</strong> de intensidade moderada (FC-alvo 70–85% da FC máxima do teste; se houve isquemia, ~10 bpm abaixo do limiar).</li><li><strong>Resistido 2–3×/semana</strong> (1–3 séries de 8–15 repetições).</li><li><strong>Reabilitação cardíaca:</strong> reduz mortalidade cardiovascular e internações. Encaminhar!</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Como fazer o seguimento da DAC crônica?", a: "<p class=\"lead\"><strong>Em cada consulta:</strong> sintomas (CCS), adesão, metas (LDL, PA, HbA1c, peso, tabagismo), atividade física e revisão de cada medicação.</p><ul><li><strong>Repetir exames só se a clínica mudar:</strong> piora da angina pede imagem funcional ou cateterismo; suspeita de queda da FE pede eco.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "FA instável (hipotensão, EAP, isquemia). Qual a conduta?", a: "<p class=\"lead\"><strong>Cardioversão elétrica sincronizada imediata, 200 J bifásico</strong>, iniciando a anticoagulação o mais rápido possível.</p><ul><li>Depois, anticoagulação por ≥ 4 semanas em todos, e daí em diante conforme o CHA₂DS₂-VA.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "FA estável com alta resposta: como controlar a FC no PS?", a: "<ul><li>Afastar causas secundárias (desidratação, sangramento, infecção, tireoide).</li><li><strong>Betabloqueador IV primeiro:</strong> metoprolol 2,5–5 mg IV (até 4 doses) ou esmolol.</li><li><strong>Diltiazem ou verapamil IV:</strong> alternativa, se FE &gt; 40%.</li><li>Sem controle: deslanosídeo IV; por último, <strong>amiodarona IV</strong> (300 mg em 30–60 min). <strong>Sulfato de magnésio</strong> 4,5 g ajuda.</li><li>Meta crônica: FC &lt; 80 em repouso (ou &lt; 110 no controle leniente).</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Como anticoagular para cardioverter conforme o tempo de FA?", a: "<ul><li><strong>&lt; 24 h:</strong> anticoagular (ACOD, enoxaparina 1 mg/kg ou HNF) e cardioverter.</li><li><strong>≥ 24 h ou desconhecido</strong> (ou alto risco embólico): <strong>ETE</strong>. Sem trombo, cardioverter; sem ETE ou com trombo, <strong>3 semanas de anticoagulação</strong> antes.</li><li><strong>Após qualquer cardioversão: ≥ 4 semanas</strong> de anticoagulação para todos, depois conforme o escore.</li><li>AAS não serve.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Qual o anticoagulante e a dose na FA não valvar?", a: "<p class=\"lead\"><strong>ACOD é preferível à varfarina.</strong></p><ul><li><strong>Apixabana 5 mg 12/12 h</strong> (2,5 mg se ≥ 2 de: idade ≥ 80, peso ≤ 60 kg, Cr ≥ 1,5).</li><li><strong>Rivaroxabana 20 mg/dia</strong> (15 mg se ClCr 15–49).</li><li><strong>Edoxabana 60 mg/dia</strong> (30 mg se TFG 15–50, peso ≤ 60 kg ou interação).</li><li><strong>Dabigatrana 150 mg 12/12 h</strong> (110 mg se ≥ 80 anos, verapamil ou risco de sangramento).</li><li><strong>Varfarina (RNI 2–3):</strong> estenose mitral moderada ou grave e prótese mecânica.</li><li>Idoso, DRC ou risco de sangramento GI: apixabana.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Qual estratégia de ritmo e quais antiarrítmicos escolher na FA?", a: "<ul><li><strong>O controle precoce do ritmo é preferencial (EAST-AFNET 4).</strong></li><li><strong>Coração normal:</strong> propafenona (1ª linha).</li><li><strong>Cardiopatia estrutural ou IC:</strong> amiodarona (a mais eficaz) ou sotalol (FE &gt; 40%).</li><li><strong>Propafenona é contraindicada</strong> em DAC, IC, HVE importante e Brugada.</li><li><strong>Ablação por cateter:</strong> FA sintomática refratária a ≥ 1 antiarrítmico, 1ª linha por escolha do paciente, e 1ª linha na taquicardiomiopatia ou ICFEr.</li><li>Amiodarona crônica: monitorar tireoide, fígado, pulmão e olhos.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Como usar a estratégia \"pill-in-the-pocket\"?", a: "<p class=\"lead\"><strong>Crises infrequentes em coração estruturalmente normal.</strong></p><ul><li><strong>Propafenona 600 mg VO em dose única</strong> (450 mg se &lt; 70 kg).</li><li><strong>Antes, dar betabloqueador ou BCC</strong> para evitar flutter com condução 1:1.</li><li>A 1ª vez deve ser no hospital.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Paciente em ACOD com sangramento grave (por exemplo, hemorragia intracraniana). Qual a conduta?", a: "<ul><li>Interromper o anticoagulante; avaliar sítio, horário da última dose, função renal e hemograma.</li><li><strong>Dabigatrana:</strong> idarucizumabe (é dialisável).</li><li><strong>Inibidores do Xa:</strong> andexanete alfa.</li><li>Sem resposta: concentrado de complexo protrombínico. Carvão ativado se a última dose foi &lt; 4 h (exceto hemorragia digestiva).</li><li>Após HIC: decisão multidisciplinar; reiniciar ACOD após ≥ 4 semanas ou fazer oclusão do apêndice atrial.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "FA com angioplastia ou SCA: qual o esquema antitrombótico?", a: "<ul><li><strong>Tripla terapia</strong> (ACOD + clopidogrel + AAS) por ~1 semana (até 1 mês se alto risco trombótico).</li><li>Depois <strong>dupla (ACOD + clopidogrel):</strong> 6 meses após ICP eletiva, 12 meses após SCA.</li><li>Depois <strong>ACOD isolado</strong>.</li><li>Clopidogrel é o P2Y12 preferido; IBP na terapia dupla.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Quais medidas de estilo de vida reduzem a recorrência da FA?", a: "<ul><li><strong>Perder ≥ 10% do peso</strong> (LEGACY).</li><li>Controle rigoroso da PA; tratar IC, DM e DRGE.</li><li><strong>Álcool &lt; 30 g/semana.</strong></li><li>Atividade física regular (não extenuante); parar de fumar; investigar apneia do sono.</li><li>Café não precisa ser suspenso.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Como fazer o seguimento do paciente anticoagulado com FA?", a: "<ul><li><strong>Em toda visita:</strong> adesão (o efeito do ACOD cai em 12–24 h), sangramento, interações, fatores modificáveis (PA, AINE, álcool), dose adequada.</li><li><strong>Função renal e hemograma:</strong> se ClCr &lt; 60, a cada ClCr/10 meses (ClCr 30 = a cada 3 meses); 4/4 meses em &gt; 75 anos ou frágil; anual nos demais.</li><li>Pós-ablação: anticoagular por ≥ 2 meses; vigiar fístula atrioesofágica (febre, dor torácica, AVC em 2–3 semanas).</li></ul>", h: true },
      { t: "Bradicardias", q: "Bradicardia instável (BAVT, PA 78/44, síncope). Qual a sequência de conduta?", a: "<ul><li>Monitorização, <strong>pás de marca-passo posicionadas</strong>, acesso venoso, O₂ se necessário.</li><li><strong>Atropina 1 mg IV a cada 3–5 min (máximo 3 mg).</strong></li><li>Sem resposta: <strong>marca-passo transcutâneo</strong> ou <strong>adrenalina 2–10 µg/min</strong> (ou dopamina 5–20 µg/kg/min).</li><li>Depois, <strong>marca-passo transvenoso</strong> e internação monitorizada com a cardiologia.</li><li>Escape infranodal (QRS largo, FC &lt; 40): a atropina provavelmente falha, então ter o marca-passo pronto antes.</li></ul>", h: true },
      { t: "Bradicardias", q: "Em quem a atropina não deve ser usada ou tende a falhar?", a: "<ul><li><strong>Não usar no transplantado cardíaco</strong> (coração desnervado).</li><li><strong>Tende a falhar</strong> no bloqueio infranodal (Mobitz II, BAVT com QRS largo, alto grau).</li><li>Insistir só atrasa o marca-passo.</li></ul>", h: true },
      { t: "Bradicardias", q: "Bradicardia estável: quem internar e quem observar?", a: "<ul><li><strong>Sinusal, juncional, BAV de 1º grau, Mobitz I:</strong> retirar as causas reversíveis e observar; investigar ambulatorialmente (Holter) se houver sintomas.</li><li><strong>Mobitz II, BAV de alto grau e BAVT:</strong> internação monitorizada + cardiologista.</li><li>Marca-passo transvenoso se o escape for &lt; 30 bpm com QRS ≥ 120 ms ou houver sintomas.</li><li><strong>Disfunção do nó sinusal sintomática:</strong> marca-passo definitivo.</li><li><strong>Atleta assintomático:</strong> tranquilizar, não investigar.</li></ul>", h: true },
      { t: "Bradicardias", q: "Bradicardia por intoxicação por BCC, betabloqueador ou digoxina: qual o antídoto?", a: "<ul><li><strong>BCC:</strong> gluconato ou cloreto de cálcio IV; insulina em alta dose se persistir (1 U/kg + 0,5 U/kg/h, com glicose e K⁺).</li><li><strong>Betabloqueador:</strong> glucagon 3–10 mg IV + 3–5 mg/h; insulina em alta dose.</li><li><strong>Digoxina:</strong> fragmento de anticorpo antidigoxina (1 ampola neutraliza 0,5 mg; empírico: 20 frascos na intoxicação aguda, 6 na crônica).</li><li>Com sintomas graves, preparar o marca-passo ao mesmo tempo.</li></ul>", h: true },
      { t: "Bradicardias", q: "BAV de 2º ou 3º grau no IAM, sem instabilidade. Qual a conduta específica?", a: "<p class=\"lead\"><strong>Aminofilina 250 mg IV em bolus</strong> (antagoniza a adenosina).</p><ul><li>No IAM inferior (Bezold-Jarisch), o BAV costuma ser transitório e responder à atropina.</li><li>No IAM anterior, pensar em marca-passo.</li></ul>", h: true },
      { t: "Bradicardias", q: "Quais medidas não farmacológicas e qual educação na bradicardia?", a: "<ul><li>Retirar ou ajustar o fármaco cronotrópico negativo.</li><li>Corrigir K⁺, Ca²⁺, Mg²⁺, hipóxia e hipotermia.</li><li><strong>Reflexo vagal:</strong> evitar gatilhos (refeição copiosa, compressão carotídea) e orientar sobre os pródromos.</li><li>Explicar o marca-passo (temporário ou definitivo) quando indicado.</li></ul>", h: true },
      { t: "Tireoide", q: "Como tratar o hipotireoidismo por Hashimoto?", a: "<p class=\"lead\"><strong>Não há tratamento que interrompa a autoimunidade: tratar o hipotireoidismo.</strong></p><ul><li><strong>Levotiroxina em dose plena de ~1,6 µg/kg/dia</strong> (faixa da aula: 1,0–1,7 µg/kg), em jejum.</li><li>Idoso e cardiopata: começar com dose baixa e titular.</li><li>Seguimento pelo TSH (repetir em 6–8 semanas após cada ajuste).</li><li>Se houver insuficiência adrenal associada: corticoide antes da levotiroxina.</li></ul>", h: true },
      { t: "Tireoide", q: "Como tratar a doença de Graves com antitireoidianos?", a: "<ul><li><strong>Metimazol (tiamazol) 10–30 mg/dia</strong> (1ª escolha); pode causar aplasia cútis se usado no 1º trimestre.</li><li><strong>Propiltiouracil 100 mg 8/8 h:</strong> bloqueia também a desiodase 1; indicado no <strong>1º trimestre da gestação</strong> e na <strong>crise tireotóxica</strong>.</li><li><strong>Efeitos adversos:</strong> agranulocitose (febre ou dor de garganta exigem hemograma e suspensão) e hepatotoxicidade (mais com PTU).</li><li>Betabloqueador para os sintomas adrenérgicos.</li><li>Alternativas definitivas: <strong>iodo radioativo</strong> ou <strong>tireoidectomia total</strong>.</li></ul>", h: true },
      { t: "Tireoide", q: "Como tratar a oftalmopatia de Graves?", a: "<ul><li><strong>Parar de fumar</strong>, o mais importante.</li><li>Controlar o hipertireoidismo.</li><li><strong>Leve:</strong> colírios e pomadas lubrificantes, óculos escuros, dormir com a cabeceira elevada.</li><li><strong>Moderada a grave ou ativa:</strong> <strong>corticoide</strong> (pulso IV); imunossupressores nos resistentes.</li><li><strong>Compressão do nervo óptico:</strong> descompressão orbitária.</li><li>Cuidado: o iodo radioativo pode piorar a oftalmopatia (fazer cobertura com corticoide).</li></ul>", h: true },
      { t: "Tireoide", q: "Qual o tratamento do adenoma tóxico (Plummer) e do bócio multinodular tóxico?", a: "<ul><li><strong>Plummer:</strong> <strong>iodo radioativo</strong> (ou cirurgia em nódulos volumosos).</li><li><strong>BMN tóxico:</strong> <strong>tireoidectomia total</strong> (sobretudo bócio volumoso ou compressivo) ou iodo radioativo.</li><li>Antitireoidiano para preparar ou controlar; a doença não remite com ele.</li></ul>", h: true },
      { t: "Obesidade", q: "Qual a meta inicial de perda de peso e quais benefícios esperar?", a: "<p class=\"lead\"><strong>Perda inicial e sustentada de 5–10% do peso em 6 meses</strong>.</p><ul><li>Cada 1% de peso perdido reduz ~1 mmHg da PAS e ~2 mmHg da PAD.</li><li>5–10% melhoram a glicemia e reduzem a necessidade de antidiabéticos.</li><li>Na dieta, perda esperada de ~2–4 kg/mês.</li></ul>", h: true },
      { t: "Obesidade", q: "Como deve ser a orientação nutricional na obesidade?", a: "<ul><li><strong>Déficit de 500–1.000 kcal/dia</strong>; dietas de maior adesão têm ~1.000–1.200 kcal.</li><li><strong>O que mais importa é a quantidade de calorias e a adesão a longo prazo</strong>, mais do que o tipo de dieta.</li><li>Dietas da moda (low carb, jejum intermitente, sem glúten, sem lactose): não recomendadas.</li><li>Educação alimentar para toda a vida (50% recuperam o peso em 1 ano).</li><li>Combinar com atividade física e terapia cognitivo-comportamental.</li></ul>", h: true },
      { t: "Obesidade", q: "Quando indicar tratamento farmacológico da obesidade e como avaliar o sucesso?", a: "<p class=\"lead\"><strong>Indicações:</strong> IMC ≥ 30, IMC ≥ 25 com comorbidades, ou falha do tratamento não farmacológico.</p><ul><li>Sempre associado a mudança de estilo de vida.</li><li><strong>Boa resposta:</strong> perda de ~2 kg no 1º mês.</li><li><strong>Sucesso:</strong> perda sustentada de 10% em 1 ano.</li><li><strong>Falha em 3 meses:</strong> associar um 2º agente; se persistir, off label com especialista.</li></ul>", h: true },
      { t: "Obesidade", q: "Cite os fármacos para obesidade, com dose e principal efeito adverso.", a: "<ul><li><strong>Semaglutida</strong> 0,25–1 mg SC/semana (até 2,4 mg) ou VO: náusea, vômito, colelitíase.</li><li><strong>Liraglutida</strong> 0,6–3 mg SC/dia: náusea, pancreatite.</li><li><strong>Tirzepatida</strong> (agonista GIP/GLP-1).</li><li><strong>Sibutramina</strong> 10–15 mg/dia: eleva PA e FC; aumenta IAM e AVC em quem tem DCV. Evitar em cardiopatas; receita B2.</li><li><strong>Orlistate</strong> 120 mg 3×/dia: esteatorreia, urgência fecal; perfil CV seguro.</li><li><strong>Bupropiona/naltrexona:</strong> fenótipo de compulsão e recompensa (álcool, cigarro).</li></ul>", h: true },
      { t: "Obesidade", q: "Como escolher o fármaco pelo fenótipo alimentar?", a: "<ul><li><strong>Saciedade por distensão gástrica</strong> (come volume): <strong>aGLP-1</strong> (semaglutida).</li><li><strong>Desejo por açúcar ou doces</strong> (via serotonina): <strong>sibutramina</strong>.</li><li><strong>Recompensa</strong> (álcool, cigarro, churrasco; via dopamina): <strong>bupropiona/naltrexona</strong>.</li><li><strong>Diabético obeso:</strong> metformina, aGLP-1 ou iSGLT2.</li><li>Com aGLP-1, garantir proteína, exercício resistido e acompanhamento nutricional (preservar a massa magra).</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Quais os pilares do manejo da bronquiectasia estável?", a: "<ul><li><strong>Fisioterapia respiratória e higiene brônquica</strong> (base).</li><li>Tratar a causa (imunodeficiência, ABPA, DRGE etc.).</li><li>Broncodilatador se houver obstrução; vacinação (influenza, pneumococo).</li><li><strong>Macrolídeo prolongado</strong> (azitromicina) se houver exacerbações frequentes (em geral ≥ 3/ano).</li><li><strong>Antibiótico inalatório</strong> na infecção crônica por Pseudomonas.</li><li>Doença avançada: O₂ domiciliar, VNI se hipercápnico (BiPAP), reabilitação, transplante.</li><li><strong>Cirurgia:</strong> só na doença localizada refratária ao tratamento clínico (ou hemoptise).</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Como tratar a primoinfecção e a infecção crônica por Pseudomonas na bronquiectasia?", a: "<ul><li><strong>Primoinfecção:</strong> tentar erradicar com antibiótico <strong>anti-pseudomonas sistêmico + inalatório</strong>; cultura de controle 1–4 semanas depois.</li><li><strong>Infecção brônquica crônica:</strong> <strong>antibiótico inalatório prolongado</strong> (por exemplo, tobramicina ou colistina).</li><li>Não usar antibiótico inalatório de rotina para tratar a exacerbação.</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Como tratar a exacerbação da bronquiectasia?", a: "<ul><li><strong>Antibiótico por 14 dias</strong> (14–21 dias nos quadros graves), guiado pela cultura prévia; colher escarro antes de iniciar.</li><li>Com Pseudomonas conhecida: cobertura anti-pseudomonas (por exemplo, ciprofloxacino VO no leve, ou betalactâmico anti-pseudomonas IV no grave).</li><li>Intensificar a fisioterapia e a higiene brônquica.</li><li><strong>Corticoide sistêmico</strong> só se houver asma ou DPOC associada.</li><li>Broncodilatador se houver dispneia importante.</li><li>Internar se houver sinais de gravidade (FR ≥ 25, hipoxemia, sepse, hemoptise &gt; 25 mL).</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Quais os ajustes iniciais do ventilador após a intubação?", a: "<ul><li><strong>Modo A/C</strong> (volume ou pressão controlados).</li><li><strong>FiO₂ 100%</strong>, reduzindo para SpO₂ 92–96%.</li><li><strong>VC 6–8 mL/kg de peso predito.</strong></li><li><strong>FR 12–16 irpm.</strong></li><li><strong>PEEP 5 cmH₂O.</strong></li><li><strong>Tempo inspiratório 0,8–1,2 s</strong> (tempo expiratório 2,5–4 s).</li><li><strong>Sensibilidade 1–2 cmH₂O.</strong></li><li>Alarmes configurados.</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Diferencie a ventilação controlada a volume (VCV) da controlada a pressão (PCV).", a: "<ul><li><strong>VCV:</strong> o operador fixa VC, FR, fluxo inspiratório, FiO₂, PEEP e sensibilidade. O <strong>VC é garantido</strong>; a pressão varia (monitorar pico e platô).</li><li><strong>PCV:</strong> o operador fixa o delta de pressão acima da PEEP, FR, tempo inspiratório, FiO₂, PEEP, sensibilidade e rise time. A <strong>pressão é limitada</strong> e o VC é livre (varia com a complacência; vigiar volume e volume-minuto).</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Como programar CPAP e BiPAP na VNI?", a: "<ul><li><strong>EAP cardiogênico:</strong> <strong>CPAP ~10 cmH₂O</strong> (PEEP 8–10).</li><li><strong>IR hipercápnica (DPOC):</strong> <strong>BiPAP com IPAP 15–20 e EPAP ~5 cmH₂O</strong> (delta de 10–15).</li><li>Monitorar à beira-leito por 30 min a 2 h; sem melhora, intubar.</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Quais as complicações da ventilação mecânica?", a: "<ul><li><strong>Lesão pulmonar induzida pela ventilação</strong> (volutrauma, barotrauma, pneumotórax): limitar platô &lt; 28 e driving &lt; 15.</li><li><strong>Pneumonia associada à VM.</strong></li><li><strong>Auto-PEEP</strong>, assincronias.</li><li>Instabilidade hemodinâmica.</li><li>Disfunção de múltiplos órgãos.</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Quando e como iniciar a retirada (desmame) da VM?", a: "<p class=\"lead\"><strong>Pré-requisitos:</strong> resolução ou melhora da condição que levou à intubação, estabilidade hemodinâmica, oxigenação adequada (FiO₂ e PEEP baixas), drive e consciência adequados.</p><ul><li><strong>Teste de respiração espontânea</strong> (por exemplo, PSV baixa ou tubo T por 30–120 min).</li><li>Passou: extubar. Em alto risco de reintubação, considerar <strong>VNI preventiva pós-extubação</strong>.</li></ul>", h: true }
    ]
  }

  /*ECG-REV*/
  {
    id: "ecg-inter",
    name: "ECG para inter",
    rev: true,
    cards: [
      { q: "Idosa com síncope. O que o Holter mostra?", a: "<p><b>Parada (pausa) sinusal: doença do nó sinusal</b></p><ul><li>Ausência prolongada de ondas P e QRS (> 3 s)</li><li>Sem escape durante a pausa</li></ul><p>Doença do nó sinusal com pausa sintomática: marca-passo definitivo.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-parada-sinusal.jpg" },
      { q: "IAM inferior; o eletrodo V4 foi colocado em V4R (circulado). O que esse traçado mostra?", a: "<p><b>IAM inferior com infarto de VD</b></p><ul><li>Supra de ST em DII, DIII e aVF</li><li>Supra de ST em V4R</li></ul><p>Reperfusão. Evitar nitrato e diurético; na hipotensão, volume.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-iam-vd-v4r.jpg" },
      { q: "Dor torácica há 30 minutos. O que chama atenção em V2–V3?", a: "<p><b>Ondas T hiperagudas (fase inicial de oclusão da DA)</b></p><ul><li>T alargadas na base, volumosas e desproporcionais ao QRS</li><li>Ainda sem supra de ST franco</li></ul><p>Tratar como oclusão coronariana aguda; ECG seriado a cada 15–30 min; acionar hemodinâmica.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-t-hiperaguda.jpg" },
      { q: "Palpitação e pulso irregular. Qual o ritmo?", a: "<p><b>Fibrilação atrial</b></p><ul><li>RR irregularmente irregular</li><li>Sem ondas P; linha de base com ondas f</li></ul><p>Diagnóstico exige registro ≥ 30 s. Calcular CHA₂DS₂-VA para anticoagulação; decidir controle de FC ou ritmo.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-fa.jpg" },
      { q: "Bradicardia regular de QRS estreito; compare P e QRS ao longo do traçado. Qual o diagnóstico?", a: "<p><b>BAV total com escape juncional (QRS estreito)</b></p><ul><li>Frequência atrial ~85 bpm e ventricular ~42 bpm</li><li>P sem relação fixa com o QRS</li><li>QRS estreito</li></ul><p>Escape alto, mais rápido e estável que o ventricular; ainda assim internar e avaliar marca-passo.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-bavt-juncional.jpg" },
      { q: "Dor torácica com sudorese. Qual o diagnóstico e a artéria provável?", a: "<p><b>IAM com supra de ST inferior (provável coronária direita)</b></p><ul><li>Supra de ST em DII, DIII e aVF, com DIII > DII</li><li>Infra recíproco em aVL e DI</li><li>Ondas Q em formação</li></ul><p>Reperfusão imediata. Fazer V3R/V4R (VD) e V7–V9; se houver infarto de VD, evitar nitrato.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-iam-inferior.jpg" },
      { q: "Renal crônico com bradicardia. Qual a alteração?", a: "<p><b>Hipercalemia</b></p><ul><li>Ondas T altas, apiculadas e simétricas, difusas</li><li>Alteração sem respeitar território coronariano</li></ul><p>Causa reversível de bradicardia: gluconato de cálcio IV e medidas para baixar o potássio.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-hipercalemia.jpg" },
      { q: "Dor torácica típica, sem supra de ST. Qual o padrão?", a: "<p><b>Padrão de de Winter (oclusão aguda da DA proximal)</b></p><ul><li>Infra de ST ascendente ≥ 1 mm no ponto J nas precordiais</li><li>Ondas T altas, proeminentes e simétricas</li><li>Sem supra precordial; supra discreto (0,5–1 mm) em aVR</li></ul><p>Equivalente de IAMCSST: reperfusão imediata.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-de-winter.jpg" },
      { q: "ECG feito durante a dor torácica; sem supra. Qual o diagnóstico?", a: "<p><b>SCA sem supra de ST (infra de ST dinâmico)</b></p><ul><li>Infra de ST em DI, DII e V5–V6 (círculos) durante a dor</li><li>Melhora após o tratamento = alteração dinâmica</li></ul><p>Troponina seriada, estratificação de risco, antitrombóticos e estratégia invasiva conforme o risco.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-scasst-dor.jpg" },
      { q: "RR irregular. É FA?", a: "<p><b>Flutter atrial com bloqueio AV variável</b></p><ul><li>Ondas F negativas em DII, DIII e aVF, ~300/min</li><li>F positivas em V1, parecendo P</li><li>Bloqueio variando de 2:1 a 4:1 (RR irregular)</li></ul><p>A irregularidade imita FA; procure as ondas F regulares nas inferiores.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-flutter-variavel.jpg" },
      { q: "Paciente assintomático, ECG de rotina. O que representam as alterações inferiores?", a: "<p><b>Área inativa inferior (infarto antigo)</b></p><ul><li>Ondas Q largas e profundas em DII, DIII e aVF</li><li>ST isoelétrico, T invertidas</li><li>aVL sem Q</li></ul><p>Onda Q = zona eletricamente inativa (necrose).</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-q-inferior-antiga.jpg" },
      { q: "Ritmo regular e lento; observe a onda P nesta derivação inferior. Qual o ritmo?", a: "<p><b>Ritmo atrial ectópico (baixo)</b></p><ul><li>Cada QRS precedido de P</li><li>P negativa na derivação inferior (ativação de baixo para cima)</li></ul><p>Ritmo regular 1:1, mas não sinusal.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-ritmo-atrial-ectopico.jpg" },
      { q: "Dor torácica típica há 2 horas. Qual o diagnóstico?", a: "<p><b>IAM com supra de ST anterior (oclusão da DA)</b></p><ul><li>Supra de ST em V1–V4</li><li>Ondas Q/QS em formação nas precordiais</li><li>Infra discreto em DIII e aVF (espelho)</li></ul><p>Reperfusão imediata: angioplastia primária; trombolítico se a angioplastia não for possível a tempo.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-iam-anterior-evolucao.jpg" },
      { q: "Idoso com síncope, FC 27 bpm. Qual o diagnóstico?", a: "<p><b>BAV total com escape ventricular (QRS largo)</b></p><ul><li>P e QRS sem relação (dissociação completa)</li><li>Frequência atrial ~60 bpm > ventricular ~27 bpm</li><li>QRS largo</li></ul><p>Escape infra-hissiano, não responde a atropina: marca-passo transcutâneo ou transvenoso, depois definitivo.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-bavt-largo.jpg" },
      { q: "Dor torácica e BRE. O supra em V1–V3 indica infarto?", a: "<p><b>BRE sem critério de infarto (discordância apropriada)</b></p><ul><li>Supra de ST em V1–V3, onde o QRS é negativo</li><li>Infra em DI, aVL e V5–V6, onde o QRS é positivo</li><li>Alteração discordante e proporcional ao QRS</li></ul><p>BRE novo não é critério confiável de IAM: aplicar Sgarbossa modificado; seguir com troponina e ECG seriado.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-bre-st.jpg" },
      { q: "Infarto anterior há 2 meses, sem dor agora. Por que o supra persiste?", a: "<p><b>Aneurisma de VE</b></p><ul><li>Ondas Q profundas em V1–V3</li><li>Supra de ST persistente (≥ 2 semanas após o IAM)</li><li>T invertidas; T pequena em relação ao QRS</li></ul><p>Não é novo infarto. Relação T/QRS > 0,36 favoreceria oclusão aguda; comparar com ECG prévio.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-aneurisma-ve.jpg" },
      { q: "Encontrado inconsciente no frio, bradicárdico. Qual o diagnóstico?", a: "<p><b>Hipotermia (ondas J de Osborn)</b></p><ul><li>Ondas J de Osborn no fim do QRS</li><li>Bradicardia e QT longo</li></ul><p>Causa reversível de bradicardia: reaquecimento.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-hipotermia-osborn.jpg" },
      { q: "Linha de base quase plana. Qual o ritmo?", a: "<p><b>Fibrilação atrial com ondas f finas</b></p><ul><li>RR irregular</li><li>Sem ondas P; ondas f finas em V1</li></ul><p>Quando as ondas f quase somem, o diagnóstico vem do RR irregular sem P.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-fa-fina.jpg" },
      { q: "FC de 38 bpm. Observe o fim de cada onda T. Qual o bloqueio?", a: "<p><b>BAV de 2º grau 2:1</b></p><ul><li>Frequência atrial ~75 bpm e ventricular ~38 bpm</li><li>Uma P não conduzida (no fim da T) para cada P conduzida</li></ul><p>Sem dois PR seguidos, não dá para dizer se é Mobitz I ou II: na dúvida, conduzir como o mais grave.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-bav-2-1.jpg" },
      { q: "Paciente com FA crônica em uso de medicação. O que mais o ECG mostra?", a: "<p><b>FA com efeito digitálico</b></p><ul><li>RR irregular, sem P, ondas f grosseiras em V1</li><li>Infra de ST “em colher” em V6, DII, DIII e aVF</li></ul><p>Efeito digitálico não é, por si, intoxicação; não confundir com isquemia.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-fa-digoxina.jpg" },
      { q: "Tontura. O que acontece nas setas?", a: "<p><b>BAV de 2º grau Mobitz II</b></p><ul><li>P bloqueadas de forma súbita (setas)</li><li>PR constante antes e depois da P bloqueada</li><li>P em intervalos regulares</li></ul><p>Bloqueio infra-hissiano, pode evoluir para BAVT: internar monitorizado e indicar marca-passo.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-mobitz2.jpg" },
      { q: "Dor torácica típica, sem supra em DII e aVF. Qual o padrão?", a: "<p><b>Padrão de Aslanger (IAM inferior com doença multiarterial)</b></p><ul><li>Supra de ST isolado em DIII</li><li>Infra de ST em V4–V6</li><li>ST em V1 acima do de V2</li></ul><p>Oclusão coronariana aguda sem supra clássico: cateterismo de urgência.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-aslanger.png" },
      { q: "Paciente com BRE prévio e dor torácica típica. Há infarto?", a: "<p><b>IAM em vigência de BRE (Sgarbossa positivo)</b></p><ul><li>BRE</li><li>Supra de ST concordante ≥ 1 mm em aVL (QRS positivo; o esperado seria infra)</li></ul><p>Equivalente de IAMCSST: reperfusão.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-sgarbossa-positivo.jpg" },
      { q: "Adolescente com anorexia nervosa, FC 35 bpm. Qual o ritmo?", a: "<p><b>Bradicardia sinusal</b></p><ul><li>P sinusal (positiva em DI e DII) antes de cada QRS</li><li>PR constante; FC < 50 bpm</li><li>Ondas U proeminentes</li></ul><p>Procurar causa reversível; tratar se houver sintomas ou instabilidade.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-bradi-sinusal.jpg" },
      { q: "ECG de rotina, paciente assintomático. Qual a alteração?", a: "<p><b>BAV de 1º grau</b></p><ul><li>PR > 200 ms (~260 ms), constante</li><li>Toda P é seguida de QRS</li></ul><p>Atraso no nó AV, sem bloqueio de batimentos; em geral só observação.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-bav1.jpg" },
      { q: "Homem jovem, assintomático, ECG de rotina. Qual o diagnóstico?", a: "<p><b>Repolarização precoce</b></p><ul><li>Supra de ST discreto e côncavo nas precordiais e inferiores</li><li>Entalhe no ponto J (“anzol”)</li><li>Sem infra recíproco, sem Q, sem dinamismo</li></ul><p>Variante do normal; improvável acima de 50 anos ou com dor isquêmica.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-repolarizacao-precoce.jpg" },
      { q: "Palpitações alternando com tontura e pré-síncope. Qual o diagnóstico?", a: "<p><b>Síndrome taqui-bradi (doença do nó sinusal)</b></p><ul><li>Surtos de taquicardia intercalados com pausas sinusais longas</li><li>Ritmo sinusal muito lento entre os surtos</li></ul><p>Marca-passo, que também permite usar drogas para controlar a taquicardia.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-rev-taqui-bradi.jpg" },
      { q: "Dor torácica em aperto. Qual parede está infartando?", a: "<p><b>IAM com supra de ST lateral</b></p><ul><li>Supra de ST em DI e aVL (e laterais)</li><li>Infra recíproco em DIII e aVF</li></ul><p>Reperfusão imediata (artéria circunflexa ou diagonal).</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-espelho-lateral.jpg" },
      { q: "Bradicardia regular de QRS estreito. Qual o ritmo?", a: "<p><b>Ritmo juncional</b></p><ul><li>P retrógradas (invertidas) logo antes do QRS, com PR curto</li><li>QRS estreito</li></ul><p>Escape juncional costuma ter FC de 40–60 bpm.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-ritmo-juncional.jpg" },
      { q: "Dor torácica em repouso, ECG sem supra. O que o ECG mostra?", a: "<p><b>Isquemia: T invertidas simétricas na parede inferior (SCA sem supra)</b></p><ul><li>T invertidas e simétricas em DII, DIII e aVF</li><li>Restritas a um território coronariano</li></ul><p>ECG seriado e troponina; estratificar risco.</p><span class=\"src\">Imagem: LITFL · CC BY-NC-SA 4.0</span>", h: true, img: "assets/ecg/litfl-t-isquemia-inferior.jpg" },

const state = {
  currentDeck: null,
  index: 0,
  flipped: false,
  order: [],
  results: {},   // { cardIdx: 'ok' | 'err' }
  finished: false,
  mode: 'normal', // 'normal' | 'erros' (revisando só os cards errados)

};
