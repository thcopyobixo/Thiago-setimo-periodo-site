/* -------- Sons (Web Audio API, sem arquivos) -------- */
let audioCtx = null;
let masterGain = null;
const MASTER_VOL = 0.45; // volume geral do site
function getAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = MASTER_VOL;
      masterGain.connect(audioCtx.destination);
    } catch {}
  }
  return audioCtx;
}
function playTone(freqs, duration = 0.2, type = 'sine', gainStart = 0.15) {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  freqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f.freq, now + (f.at || 0));
    if (f.slideTo) osc.frequency.exponentialRampToValueAtTime(f.slideTo, now + (f.at || 0) + duration);
    gain.gain.setValueAtTime(0, now + (f.at || 0));
    gain.gain.linearRampToValueAtTime(gainStart, now + (f.at || 0) + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (f.at || 0) + duration);
    osc.connect(gain).connect(masterGain);
    osc.start(now + (f.at || 0));
    osc.stop(now + (f.at || 0) + duration + 0.02);
  });
}
function makeNoiseBurst(ctx, at, duration, freqStart, freqEnd, peakGain, filterType = 'bandpass', Q = 3) {
  const bufSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.setValueAtTime(freqStart, at);
  filter.frequency.exponentialRampToValueAtTime(freqEnd, at + duration);
  filter.Q.value = Q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(peakGain, at + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, at + duration);
  src.connect(filter).connect(g).connect(masterGain);
  src.start(at);
  src.stop(at + duration + 0.02);
}
function soundOk() {
  // acorde ascendente: C5, E5, G5 (523, 659, 784)
  playTone([
    { freq: 523.25, at: 0 },
    { freq: 659.25, at: 0.08 },
    { freq: 783.99, at: 0.16 }
  ], 0.35, 'triangle', 0.14);
}
function soundErr() {
  // descendente grave
  playTone([
    { freq: 220, slideTo: 110, at: 0 }
  ], 0.35, 'sawtooth', 0.12);
}
function soundEnd() {
  playTone([
    { freq: 523.25, at: 0 },
    { freq: 659.25, at: 0.12 },
    { freq: 783.99, at: 0.24 },
    { freq: 1046.50, at: 0.36 }
  ], 0.4, 'triangle', 0.12);
}
function soundFlip() {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Swoosh: ruído bandpass varrendo 2000 → 500 Hz
  makeNoiseBurst(ctx, now, 0.18, 2000, 500, 0.22, 'bandpass', 3);
  // Estalo curto no final (carta pousando)
  const clickAt = now + 0.12;
  const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.04), ctx.sampleRate);
  const cd = clickBuf.getChannelData(0);
  for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / cd.length);
  const click = ctx.createBufferSource();
  click.buffer = clickBuf;
  const clickHp = ctx.createBiquadFilter();
  clickHp.type = 'highpass';
  clickHp.frequency.value = 1500;
  const clickGain = ctx.createGain();
  clickGain.gain.setValueAtTime(0.28, clickAt);
  clickGain.gain.exponentialRampToValueAtTime(0.001, clickAt + 0.05);
  click.connect(clickHp).connect(clickGain).connect(masterGain);
  click.start(clickAt);
  click.stop(clickAt + 0.05);
}
function soundSlide(direction = 'right') {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Whoosh mais suave e curto que o flip — sem estalo
  // direção altera o "pitch" do filtro (esquerda = pitch mais alto)
  const startF = direction === 'left' ? 2400 : 1800;
  const endF   = direction === 'left' ? 700  : 400;
  makeNoiseBurst(ctx, now, 0.22, startF, endF, 0.18, 'bandpass', 2);
}
function soundShuffle() {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Riffle: 7 estalos curtos com variação (som de baralho embaralhando)
  const N = 7;
  for (let i = 0; i < N; i++) {
    const at = now + i * 0.055 + (Math.random() * 0.015);
    // pequeno swoosh
    makeNoiseBurst(ctx, at, 0.06, 2600 + Math.random() * 1500, 900, 0.14, 'bandpass', 4);
    // estalo curto
    const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.025), ctx.sampleRate);
    const cd = clickBuf.getChannelData(0);
    for (let j = 0; j < cd.length; j++) cd[j] = (Math.random() * 2 - 1) * (1 - j / cd.length);
    const click = ctx.createBufferSource();
    click.buffer = clickBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2500 + Math.random() * 1500;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14 + Math.random() * 0.06, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.035);
    click.connect(hp).connect(g).connect(masterGain);
    click.start(at + 0.02);
    click.stop(at + 0.05);
  }
}

const PROG_PREFIX = "ac3_";

/* -------- Cards errados: lista e revisão -------- */
function errKey(id) { return PROG_PREFIX + id + "_erros"; }
function loadErros(id) {
  try { const a = JSON.parse(localStorage.getItem(errKey(id)) || "[]"); return Array.isArray(a) ? a : []; } catch { return []; }
}
function saveErros(id, arr) {
  try { localStorage.setItem(errKey(id), JSON.stringify(arr)); } catch (e) {}
}
function registrarErro(cardIdx, kind) {
  const deck = state.currentDeck; if (!deck) return;
  const set = new Set(loadErros(deck.id));
  if (kind === 'err') set.add(cardIdx); else set.delete(cardIdx);
  saveErros(deck.id, [...set].filter(i => i < deck.cards.length).sort((a, b) => a - b));
}
function answerHtml(card) { return card.h ? card.a : escapeHtml(card.a); }

function showErros() {
  state.view = 'erros';
  const deck = state.currentDeck;
  const erros = loadErros(deck.id).filter(i => i < deck.cards.length);
  $main.innerHTML = `
    <div class="err-view">
      <button class="btn" onclick="closeErros()">← Voltar</button>
      <h2>Cards que você errou</h2>
      <div class="err-sub">${escapeHtml(deck.name)} · ${erros.length} ${erros.length === 1 ? 'card' : 'cards'}. Um card sai da lista quando você acerta ele de novo.</div>
      ${erros.length ? `
      <div class="err-actions">
        <button class="btn primary" onclick="startReviewErros()">Revisar em modo flashcard</button>
        <button class="btn" onclick="clearErros()">Limpar lista</button>
      </div>
      <div class="err-list">
        ${erros.map((i, k) => `
          <details class="err-item">
            <summary><span class="err-n">${k + 1}</span><span>${escapeHtml(deck.cards[i].q)}</span></summary>
            <div class="err-a">${answerHtml(deck.cards[i])}</div>
          </details>`).join('')}
      </div>` : `<div class="err-empty">Nenhum card errado neste tema por enquanto.</div>`}
    </div>`;
}
function closeErros() { state.view = null; render(); }
function clearErros() {
  if (!confirm("Limpar a lista de cards errados deste tema?")) return;
  saveErros(state.currentDeck.id, []);
  showErros();
}
function startReviewErros(lista) {
  const deck = state.currentDeck;
  const erros = (lista || loadErros(deck.id)).filter(i => i < deck.cards.length);
  if (!erros.length) { showErros(); return; }
  state.view = null;
  state.mode = 'erros';
  state.order = erros.slice();
  state.index = 0;
  state.results = {};
  state.finished = false;
  state.flipped = false;
  state.enterDir = 'up';
  soundShuffle();
  render();
}
function exitReview() {
  state.mode = 'normal';
  selectDeck(state.currentDeck);
}

function saveProgress() {
  if (!state.currentDeck || state.mode === 'erros') return;
  localStorage.setItem("ac3_" + state.currentDeck.id, JSON.stringify({
    index: state.index,
    order: state.order,
    results: state.results,
    finished: state.finished
  }));
}

function loadProgress(deckId) {
  try {
    const raw = localStorage.getItem("ac3_" + deckId);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return {
      index: p.index || 0,
      order: p.order || null,
      results: p.results || {},
      finished: !!p.finished
    };
  } catch { return null; }
}

function renderTabs() {
  $tabs.innerHTML = "";
  DECKS.forEach((deck, i) => {
    if (deck.rev && !(DECKS[i - 1] && DECKS[i - 1].rev)) {
      const lbl = document.createElement("div");
      lbl.className = "tabs-label rev-label";
      lbl.textContent = "Revisão final";
      $tabs.appendChild(lbl);
    }
    const btn = document.createElement("button");
    btn.className = "tab" + (deck.rev ? " rev" : "") + (state.currentDeck && state.currentDeck.id === deck.id ? " active" : "");
    btn.innerHTML = '<span>' + escapeHtml(deck.name) + '</span><span class="count">' + deck.cards.length + '</span>';
    btn.onclick = () => selectDeck(deck);
    $tabs.appendChild(btn);
  });
}

function selectDeck(deck) {
  state.currentDeck = deck;
  state.mode = 'normal';
  state.view = null;
  document.documentElement.classList.toggle('theme-red', !!deck.rev);
  state.flipped = false;
  state.enterDir = 'up';
  const saved = loadProgress(deck.id);
  if (saved && saved.order && saved.order.length === deck.cards.length) {
    state.index = saved.index;
    state.order = saved.order;
    state.results = saved.results;
    state.finished = saved.finished;
  } else {
    state.index = 0;
    state.order = deck.cards.map((_, i) => i);
    state.results = {};
    state.finished = false;
  }
  renderTabs();
  render();
}

function shuffle() {
  soundShuffle();
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.index = 0;
  state.flipped = false;
  state.results = {};
  state.finished = false;
  state.enterDir = 'up';
  saveProgress();
  render();
}

function resetDeck() {
  if (!confirm("Reiniciar progresso deste tema?")) return;
  state.index = 0;
  state.order = state.currentDeck.cards.map((_, i) => i);
  state.results = {};
  state.finished = false;
  state.flipped = false;
  saveProgress();
  render();
}

function animateExit(exitClass, cb) {
  const wrap = document.querySelector('.card-anim');
  if (!wrap || state.animating) { cb(); return; }
  state.animating = true;
  wrap.classList.remove('enter-right','enter-left','enter-up');
  wrap.classList.add(exitClass);
  setTimeout(() => {
    state.animating = false;
    cb();
  }, 320);
}

function next() {
  if (state.finished || state.animating) return;
  if (state.index < state.order.length - 1) {
    soundSlide('left');
    animateExit('exit-left', () => {
      state.index++;
      state.flipped = false;
      state.enterDir = 'right';
      saveProgress();
      render();
    });
  }
}

function prev() {
  if (state.animating) return;
  if (state.finished) {
    soundSlide('right');
    state.finished = false;
    state.index = state.order.length - 1;
    state.flipped = false;
    state.enterDir = 'left';
    saveProgress();
    render();
    return;
  }
  if (state.index > 0) {
    soundSlide('right');
    animateExit('exit-right', () => {
      state.index--;
      state.flipped = false;
      state.enterDir = 'left';
      saveProgress();
      render();
    });
  }
}

function flip() {
  if (state.animating) return;
  const cardEl = document.querySelector('.card');
  if (!cardEl) return;
  if (cardEl.classList.contains('blinking')) return;

  const wasFlipped = state.flipped;
  state.flipped = !wasFlipped;
  saveProgress();
  soundFlip();

  cardEl.classList.add('blinking');

  // Troca a face no meio (quando o card está invisível)
  setTimeout(() => {
    if (wasFlipped) cardEl.classList.remove('flipped');
    else cardEl.classList.add('flipped');
  }, 190);

  setTimeout(() => {
    cardEl.classList.remove('blinking');
  }, 410);
}

function mark(kind) {
  if (state.finished || state.animating) return;
  const cardIdx = state.order[state.index];
  state.results[cardIdx] = kind;
  registrarErro(cardIdx, kind);

  // som
  if (kind === 'ok') soundOk(); else soundErr();

  // botão pulsa
  const keyBtn = document.querySelector(`.key.${kind === 'ok' ? 'ok' : 'err'}`);
  if (keyBtn) { keyBtn.classList.add('pressed'); setTimeout(() => keyBtn.classList.remove('pressed'), 400); }

  // flash overlay
  const container = document.querySelector('.card-container');
  if (container) {
    const flash = document.createElement('div');
    flash.className = 'flash-overlay ' + kind;
    container.appendChild(flash);
    setTimeout(() => flash.remove(), 600);
  }

  animateExit(kind === 'ok' ? 'exit-up' : 'exit-down', () => {
    state.flipped = false;
    if (state.index < state.order.length - 1) {
      state.index++;
      state.enterDir = 'up';
    } else {
      state.finished = true;
      soundEnd();
    }
    saveProgress();
    render();
  });
}

function countResults() {
  let correct = 0, wrong = 0;
  Object.values(state.results).forEach(v => {
    if (v === 'ok') correct++;
    else if (v === 'err') wrong++;
  });
  return { correct, wrong };
}

function classify(pct) {
  if (pct >= 90) return { key: 'excelente', label: 'Excelente' };
  if (pct >= 75) return { key: 'otimo', label: 'Ótimo' };
  if (pct >= 60) return { key: 'regular', label: 'Regular' };
  return { key: 'melhorar', label: 'Precisa Melhorar' };
}

function render() {
  const deck = state.currentDeck;
  if (!deck) { renderEmpty(); return; }
  if (state.view === 'erros') { showErros(); return; }
  if (state.finished) { renderEnd(); return; }
  renderDeck();
}

function renderDeck() {
  const deck = state.currentDeck;
  const total = state.order.length;
  const nErros = loadErros(deck.id).length;
  const revisando = state.mode === 'erros';
  const cardIdx = state.order[state.index];
  const card = deck.cards[cardIdx];
  const progress = ((state.index + 1) / total) * 100;
  const atFirst = state.index === 0;

  $main.innerHTML = `
    <div class="toolbar">
      <div>
        <div class="deck-title">${escapeHtml(deck.name)}${revisando ? '<span class="review-tag">Revisando erros</span>' : ''}</div>
        <div class="deck-progress-num"><span class="curr">${state.index + 1}</span> de ${total}</div>
      </div>
      <div class="actions">
        ${revisando ? `<button class="btn" onclick="exitReview()">Sair da revisão</button>` : `
        ${nErros ? `<button class="btn err-btn" onclick="showErros()">Errados<b>${nErros}</b></button>` : ''}
        <button class="btn" onclick="shuffle()">Embaralhar</button>
        <button class="btn" onclick="resetDeck()">Reiniciar</button>`}
      </div>
    </div>

    <div class="progress-bar"><div class="fill" style="width:${progress}%"></div></div>

    <div class="card-container">
      <div class="card-anim ${state.enterDir ? 'enter-' + state.enterDir : ''}">
        <div class="card ${state.flipped ? 'flipped' : ''}" onclick="flip()">
          <div class="face front">
            <div class="label">Pergunta</div>
            <div class="content">${escapeHtml(card.q)}</div>
            <div class="hint">clique ou espaço</div>
          </div>
          <div class="face back">
            <div class="label">Resposta</div>
            <div class="content${card.h ? ' rich' : ''}">${card.h ? card.a : escapeHtml(card.a)}</div>
            <div class="hint">clique ou espaço</div>
          </div>
        </div>
      </div>
    </div>

    <div class="keymap">
      <button class="key ${atFirst ? 'disabled' : ''}" onclick="prev()" ${atFirst ? 'disabled' : ''}>
        <span class="icon">←</span><span>Anterior</span>
      </button>
      <button class="key err" onclick="mark('err')">
        <span class="icon">↓</span><span>Errei</span>
      </button>
      <button class="key ok" onclick="mark('ok')">
        <span class="icon">↑</span><span>Acertei</span>
      </button>
      <button class="key" onclick="next()">
        <span class="icon">→</span><span>Próximo</span>
      </button>
    </div>
  `;
  // Clear entry direction after render so flipping doesn't retrigger animation
  state.enterDir = null;
}

function renderEnd() {
  const deck = state.currentDeck;
  const total = state.order.length;
  const revisando = state.mode === 'erros';
  const erradosRodada = state.order.filter(i => state.results[i] === 'err');
  const { correct, wrong } = countResults();
  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  const cls = classify(pct);

  // donut math
  const r = 100;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  const colorFor = {
    excelente: 'var(--ok)',
    otimo: 'var(--accent)',
    regular: 'var(--warn)',
    melhorar: 'var(--err)'
  }[cls.key];

  $main.innerHTML = `
    <div class="end-screen">
      <h2>${revisando ? 'Revisão dos Erros Concluída' : 'Sessão Concluída'}</h2>
      <div class="subtitle">${escapeHtml(deck.name)} · ${total} flashcards${revisando ? ' revisados' : ''}</div>

      <div class="donut">
        <svg viewBox="0 0 240 240">
          <circle class="track" cx="120" cy="120" r="${r}"></circle>
          <circle class="fill-arc" cx="120" cy="120" r="${r}"
                  stroke="${colorFor}"
                  stroke-dasharray="${circ}"
                  stroke-dashoffset="${circ}"
                  id="arc"></circle>
        </svg>
        <div class="center">
          <div class="pct">${pct}%</div>
          <div class="pct-label">Acertos</div>
        </div>
      </div>

      <div class="badge ${cls.key}">${cls.label}</div>

      <div class="end-stats">
        <div class="end-stat correct">
          <div class="val">${correct}</div>
          <div class="lbl">Acertos</div>
        </div>
        <div class="end-stat wrong">
          <div class="val">${wrong}</div>
          <div class="lbl">Erros</div>
        </div>
        <div class="end-stat">
          <div class="val">${answered}/${total}</div>
          <div class="lbl">Respondidos</div>
        </div>
      </div>

      ${erradosRodada.length ? `
      <div class="end-errors">
        <div class="end-errors-title">${revisando ? 'Ainda errou' : 'Você errou'} ${erradosRodada.length} ${erradosRodada.length === 1 ? 'card' : 'cards'}</div>
        <div class="err-list">
          ${erradosRodada.map((i, k) => `
            <details class="err-item">
              <summary><span class="err-n">${k + 1}</span><span>${escapeHtml(deck.cards[i].q)}</span></summary>
              <div class="err-a">${answerHtml(deck.cards[i])}</div>
            </details>`).join('')}
        </div>
      </div>` : ''}

      <div class="end-actions">
        ${erradosRodada.length ? `<button class="btn primary" onclick="startReviewErros([${erradosRodada.join(',')}])">${erradosRodada.length === 1 ? 'Revisar o card que errei' : 'Revisar os ' + erradosRodada.length + ' que errei'}</button>` : ''}
        ${revisando ? `<button class="btn" onclick="exitReview()">Voltar ao tema completo</button>` : `
        <button class="btn" onclick="prev()">Voltar ao último</button>
        <button class="btn ${erradosRodada.length ? '' : 'primary'}" onclick="resetDeck()">Recomeçar</button>
        <button class="btn" onclick="shuffle()">Embaralhar</button>
        ${loadErros(deck.id).length ? `<button class="btn err-btn" onclick="showErros()">Todos os errados<b>${loadErros(deck.id).length}</b></button>` : ''}`}
      </div>
    </div>
  `;

  // Animate donut fill
  requestAnimationFrame(() => {
    const arc = document.getElementById('arc');
    if (arc) arc.style.strokeDashoffset = offset;
  });
}

function renderEmpty() {
  $main.innerHTML = `
    <div class="empty">
      <h2>Selecione um tema</h2>
      <p>Escolha um tema na barra lateral para começar.</p>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document.addEventListener("keydown", (e) => {
  if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = e.target; const tag = (t && t.tagName || '').toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && !(t && t.isContentEditable)) {
      toggleSidebar(); return;
    }
  }
  if (!state.currentDeck) return;
  if (state.view === 'erros') return;
  if (state.finished) {
    if (e.key === "ArrowLeft") prev();
    return;
  }
  if (e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowUp") { e.preventDefault(); mark('ok'); }
  else if (e.key === "ArrowDown") { e.preventDefault(); mark('err'); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});

renderTabs();
if (DECKS.length > 0) selectDeck(DECKS[0]);
</script>
