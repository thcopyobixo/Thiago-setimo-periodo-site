  {
    id: "sca-noca",
    name: "SCA sem Supra de ST (NOCA)",
    cards: [
      { q: "Qual a diferença entre a classificação SCASSST e a classificação OCA × NOCA?", a: "SCASSST é definida pelo ECG (ausência de supra de ST); OCA × NOCA, pela fisiopatologia (presença ou não de oclusão coronária aguda). Um IAM “sem supra” pode ser OCA — e aí precisa de reperfusão imediata." },
      { q: "Um IAM laudado como “sem supra” pode ser, na verdade, uma oclusão coronária?", a: "Sim — parte dos IAM sem supra são oclusões não reconhecidas. Por isso a pergunta passou a ser “há oclusão ou padrão pré-oclusivo?”, não só “há supra?”." },
      { q: "Dentro da SCASSST, qual fração evolui com necrose?", a: "Cerca de 70% (IAM sem supra); o restante é angina instável." },
      { q: "Quais os dois mecanismos de instabilização da placa na SCASSST e suas proporções?", a: "Ruptura/fissura com trombose não oclusiva (~2/3) e erosão (~1/3). Ambos geram limitação significativa, porém parcial, do fluxo." },
      { q: "Por que a SCASSST tipicamente causa infra de ST (e não supra)?", a: "Com fluxo parcialmente preservado, a isquemia fica restrita ao subendocárdio; isquemia subendocárdica é incompatível com oclusão. O supra persistente reflete lesão transmural (oclusão)." },
      { q: "Como um paciente pode ter oclusão completa e mesmo assim não necrosar (ainda)?", a: "Circulação colateral suficiente para a demanda evita a necrose, ainda que temporariamente." },
      { q: "Por que a dispneia é o equivalente isquêmico mais comum?", a: "A isquemia aguda eleva a pressão diastólica final do VE → congestão pulmonar e hipoxemia, que ainda amplia a isquemia." },
      { q: "Qual o mecanismo dos padrões de Wellens?", a: "Reperfusão espontânea de uma oclusão intermitente, em geral da DA proximal; a artéria tem alto risco de reocluir." },
      { q: "O que diferencia a dor da SCASSST da angina estável?", a: "Ocorre em repouso ou ao mínimo esforço (ou é nova/crescente)." },
      { q: "Em quais grupos a apresentação “atípica” é mais frequente e quais queixas valorizar?", a: "Idosos (principalmente), mulheres e diabéticos: epigastralgia, indigestão, dor pleurítica, dispneia — mesmo sem dor torácica." },
      { q: "Braunwald: o que é classe III? E classe A?", a: "III = angina de repouso nas últimas 48 h. A = angina secundária (anemia, febre, hipotensão, HAS não controlada, arritmias, tireotoxicose, hipoxemia, estenose aórtica)." },
      { q: "Na classificação de risco de Braunwald, quantas características de alto risco bastam?", a: "Uma única (ex.: infra de ST ≥ 0,5 mm, dor > 20 min em repouso, idade > 75, EAP)." },
      { q: "Quais as 7 variáveis do escore TIMI?", a: "Idade ≥ 65; ≥ 3 FR; lesão ≥ 50%; AAS < 7 dias; ≥ 2 crises de angina em 24 h; desvio de ST ≥ 0,5 mm; marcador positivo. 0–2 baixo, 3–4 intermediário, 5–7 alto." },
      { q: "Faixas do GRACE para óbito hospitalar?", a: "≤ 108 baixo; 109–140 intermediário; > 140 alto. GRACE > 140 = cateterismo < 24 h." },
      { q: "Cite 5 critérios de muito alto risco (cateterismo < 2 h).", a: "Instabilidade hemodinâmica/choque; angina refratária; arritmia ventricular maligna/PCR; complicação mecânica; IC aguda/EAP; alterações dinâmicas recorrentes de ST/T; Wellens e infra difuso + supra em aVR." },
      { q: "Quais achados de exame físico classificam como alto risco?", a: "Edema pulmonar, estertores novos, B3, sopro de regurgitação mitral novo/piora, hipotensão, bradi ou taquicardia." },
      { q: "Exame físico normal afasta lesão grave?", a: "Não: pode ser normal mesmo em lesão de tronco ou multiarterial." },
      { q: "Qual o primeiro exame e em quanto tempo?", a: "ECG de 12 derivações em até 10 min da chegada." },
      { q: "Para que servem V7–V9 e V3R–V4R?", a: "V7–V9: oclusão de circunflexa; V3R–V4R: infarto de VD." },
      { q: "ECG normal exclui SCASSST? O que fazer?", a: "Não. Repetir com frequência (ex.: a cada 15 min na primeira hora) e sempre que a dor recorrer." },
      { q: "Qual o significado de infra de ST difuso com supra em aVR em contexto de SCA?", a: "Isquemia subendocárdica difusa por lesão de tronco, DA proximal ou triarterial; cateterismo em até 2 h. Supra em aVR > 1 mm aumenta especificidade." },
      { q: "Cite 4 condições não coronarianas que reproduzem infra difuso + supra em aVR.", a: "Taquiarritmias, dissecção de aorta, TEP maciço, anemia grave." },
      { q: "Descreva Wellens A e B.", a: "A: T bifásica em V2–V3 (até V5), oclusão muito recente. B: T invertida profunda e simétrica nas mesmas derivações. Aparecem sem dor." },
      { q: "Qual a definição de IAM pela 4ª definição universal?", a: "Troponina > p99 + ≥ 1: sintomas, Q nova, alteração nova de ST/T ou BRE novo, perda de miocárdio viável/alteração segmentar nova em imagem, trombo em angiografia/necropsia." },
      { q: "Por quanto tempo a troponina permanece elevada após o IAM?", a: "Até 7 dias — mais que a CK-MB." },
      { q: "Sensibilidade da troponina US × CK-MB?", a: "98,7% × 90%." },
      { q: "Mioglobina tem lugar na SCASSST?", a: "Não — não deve ser usada." },
      { q: "CK-MB positiva com troponina negativa: o que pensar?", a: "Falso-positivo (~4% dos pacientes). Medir CK-MB massa, não atividade." },
      { q: "Algoritmo 0/1 h (Roche): critérios de rule-out?", a: "Dor > 3 h e 0 h < 5 ng/L; ou 0 h < 12 ng/L e Δ1h < 3 ng/L." },
      { q: "Algoritmo 0/1 h (Roche): critérios de rule-in?", a: "0 h ≥ 52 ng/L ou Δ1h ≥ 5 ng/L." },
      { q: "O que fazer quando o paciente cai na zona de observação do algoritmo 0/1 h?", a: "A chance de IAM ainda é relevante: colher terceira troponina e considerar eco ou estratificação não invasiva." },
      { q: "Nos algoritmos de troponina US, usa-se a variação de 20% da 4ª definição?", a: "Não. Usam-se os cortes absolutos de cada fabricante." },
      { q: "Qual a limitação da troponina point-of-care?", a: "Menor sensibilidade, acurácia e VPN que o ensaio laboratorial." },
      { q: "HEART: componentes e faixas de MACE em 6 semanas.", a: "História, ECG, Idade, Risco, Troponina (0–2 cada). 0–3: 0,9–1,7%; 4–6: 12–16,6%; 7–10: 50–65%." },
      { q: "Paciente com rule-out por troponina US e ECG não isquêmico precisa de escore ou teste não invasivo?", a: "Não: pode ter alta." },
      { q: "Quando o teste ergométrico pode ser feito no baixo risco?", a: "Após 9 h (ideal ~12 h) sem dor, com ECG e marcadores normais." },
      { q: "Angio-TC de coronárias: requisitos e critério de positividade?", a: "FC idealmente < 60 bpm; positiva se estenose ≥ 50%; alta sensibilidade para excluir DAC." },
      { q: "No alto risco, quando NÃO fazer estratificação não invasiva?", a: "Antes de 48 h." },
      { q: "Atrito pericárdico, pulso paradoxal, MV diminuído e assimetria de pulsos sugerem, respectivamente…", a: "Pericardite, tamponamento, pneumotórax, dissecção de aorta." },
      { q: "Troponina elevada e estável, sem curva, em paciente com DRC terminal: o que é?", a: "Provável injúria miocárdica crônica; o que define evento agudo é ascensão/queda." },
      { q: "Quando dar oxigênio?", a: "Só se SpO₂ < 90%, cianose ou desconforto respiratório; rotina sem hipoxemia não traz benefício." },
      { q: "Por que a morfina deixou de ser rotina na SCASSST?", a: "Retarda a absorção de fármacos orais, inclusive inibidores de P2Y12, reduzindo o efeito antiplaquetário. Usar só se dor refratária." },
      { q: "Contraindicações do nitrato?", a: "PAS < 100 mmHg, infarto de VD, sildenafila < 24 h ou tadalafila < 48 h." },
      { q: "Como titular a nitroglicerina IV?", a: "10 µg/min, +10 µg a cada 5 min até alívio, queda de PAS ≤ 20 mmHg (PAS ≥ 110) ou FC +10%." },
      { q: "O nitrato reduz mortalidade na SCASSST?", a: "Não; o benefício é sintomático (alívio da dor isquêmica)." },
      { q: "Quais fatores aumentam o risco de choque com betabloqueador na fase aguda?", a: "Idade > 70, PAS < 120, FC > 110, apresentação tardia, sinais de IC." },
      { q: "Quando usar antagonista de cálcio na SCASSST?", a: "Refratário a BB + nitrato; Prinzmetal; não di-hidropiridínico se BB contraindicado." },
      { q: "Por que evitar nifedipina de ação curta?", a: "Vasodilatação intensa com taquicardia reflexa." },
      { q: "Dose do AAS na SCASSST?", a: "Ataque 162–300 mg mastigado; manutenção 81–100 mg/dia indefinidamente; ≤ 100 mg com ticagrelor." },
      { q: "Paciente alérgico a AAS: qual antiplaquetário?", a: "Monoterapia inicial com inibidor de P2Y12, de preferência ticagrelor ou prasugrel." },
      { q: "Contraindicação absoluta do prasugrel e quando reduzir a dose?", a: "AVC/AIT prévio. 5 mg/dia se < 60 kg ou ≥ 75 anos." },
      { q: "Prasugrel pode ser usado como pré-tratamento?", a: "Não — só com anatomia conhecida e ICP programada." },
      { q: "Efeitos adversos próprios do ticagrelor?", a: "Dispneia (efeito adenosina), pausas ventriculares nos primeiros 7 dias, ↑ creatinina e ácido úrico." },
      { q: "Que interação reduz o efeito do clopidogrel?", a: "IBP (sobretudo omeprazol) via CYP2C19; e o alelo CYP2C19*2." },
      { q: "Tempo de suspensão antes de cirurgia: clopidogrel, ticagrelor, prasugrel?", a: "5, 5 e 7 dias." },
      { q: "Cateterismo previsto < 2 h: dar o 2º antiagregante no PS?", a: "Não; dar na sala de hemodinâmica, com anatomia conhecida." },
      { q: "Cateterismo > 24 h ou tratamento conservador?", a: "Pré-tratamento de rotina (ticagrelor 180 mg ou clopidogrel 300 mg)." },
      { q: "Por que esperar a anatomia para o 2º antiagregante quando o cateterismo é < 24 h?", a: "Benefício concentra-se em quem recebe stent, e o fármaco pode atrasar uma CRM." },
      { q: "iGP IIb/IIIa de rotina antes do cateterismo?", a: "Não. Considerar na ICP com alta carga trombótica e baixo risco hemorrágico." },
      { q: "Dose de enoxaparina e ajustes?", a: "1 mg/kg SC 12/12 h; > 75 anos 0,75 mg/kg; ClCr < 30: 1 mg/kg 1×/dia." },
      { q: "Paciente em enoxaparina vai ao cateterismo 10 h após a última dose. O que fazer?", a: "0,3 mg/kg IV de enoxaparina (> 8 h); se < 8 h, nada adicional." },
      { q: "Qual a vantagem e o problema do fondaparinux?", a: "Menos sangramento que a enoxaparina; mais trombose de cateter → bolus de HNF obrigatório na ICP. Contraindicado se ClCr < 20." },
      { q: "Pode trocar HNF por enoxaparina durante a internação?", a: "Não." },
      { q: "Meta de LDL e sequência se não atingida?", a: "LDL < 50 mg/dL no muito alto risco; estatina em dose alta → ezetimiba → iPCSK9." },
      { q: "Tempos do cateterismo por risco?", a: "Muito alto < 2 h; alto < 24 h; intermediário < 72 h." },
      { q: "Nefroproteção para cateterismo urgente com restrição hídrica?", a: "Bicarbonato de sódio 8,4% 150 mL + AD 850 mL: 3 mL/kg/h 1 h antes e 1 mL/kg/h por 6 h depois." },
      { q: "Quem se beneficia mais de CRM que de ICP?", a: "SYNTAX > 22 e diabéticos multiarteriais." },
      { q: "Prescrição de alta na SCASSST?", a: "AAS 100 mg; clopidogrel 75 mg se stent; estatina de alta potência; BB se FE ≤ 40%; IECA se IC, DM, HAS ou DRC; ARM se FE ≤ 40% + DM ou IC." },
      { q: "Quais achados no ECG de chegada indicam pior prognóstico?", a: "BRE, seguido de desvio de ST ≥ 1 mm." },
      { q: "Sangramento muda o prognóstico?", a: "Sim — associa-se a pior prognóstico; por isso CRUSADE e Mehran." },
      { q: "Mulher, 58 anos, diabética, refere “má digestão” e cansaço há 3 h. ECG normal. Tn-US (Roche) 0 h = 8 ng/L; 1 h = 15 ng/L. Hipótese e próximo passo?", a: "Δ1h = 7 ng/L (≥ 5) → rule-in: IAM sem supra. Apresentação atípica típica de mulher diabética. Alto risco → cateterismo < 24 h, AAS, anticoagulação; 2º antiagregante após anatomia." },
      { q: "Homem, 52 anos, teve dor intensa ontem; hoje está sem dor. ECG: T invertidas profundas e simétricas de V2 a V4. Troponina discretamente elevada. Conduta?", a: "Wellens tipo B: DA proximal que reperfundiu e pode reocluir. Não fazer teste de esforço nem trombólise; cateterismo precoce (< 24 h; < 2 h se dor recorrer)." },
      { q: "Homem, 70 anos, dor há 1 h, PA 85/50, estertores em 2/3 dos campos, ECG com infra difuso e supra de 1,5 mm em aVR. Próximo passo?", a: "Muito alto risco (choque, EAP, padrão aVR): cateterismo imediato < 2 h; sem pré-tratamento com P2Y12; não trombolisar." },
      { q: "Homem, 45 anos, dor há 5 h, já sem dor, ECG normal, Tn-US (Roche) 0 h = 3 ng/L. Conduta?", a: "Rule-out com uma única dosagem (dor > 3 h e < 5 ng/L). Com ECG não isquêmico, alta sem escores nem testes adicionais." },
      { q: "Homem, 62 anos, IAM sem supra; usou sildenafila há 12 h; PA 130/80; dor 6/10. Que fármaco evitar e qual alternativa?", a: "Nitrato contraindicado (PDE-5 < 24 h). Usar betabloqueador se sem sinais de IC; analgesia; morfina só se refratária." },
      { q: "Mulher, 78 anos, 55 kg, AIT há 1 ano, IAM sem supra com cateterismo em 48 h. Qual inibidor de P2Y12 e qual anticoagulante?", a: "Prasugrel contraindicado (AIT). Pré-tratamento (CATE > 24 h) com ticagrelor 180 mg ou clopidogrel 300 mg. Enoxaparina 0,75 mg/kg 12/12 h (> 75 anos), ajustar se ClCr < 30." },
      { q: "Homem, 68 anos, em uso de varfarina por FA, SCASSST. Qual P2Y12 preferir?", a: "Clopidogrel — preferencial com anticoagulação oral concomitante." },
      { q: "Paciente com taquicardia supraventricular a 190 bpm, dor torácica, infra de ST difuso e supra em aVR; Hb normal. Qual a armadilha?", a: "O padrão pode ser só desbalanço oferta/demanda pela taquiarritmia (IAM tipo 2 / angina secundária). Tratar a arritmia e reavaliar; o padrão indica cateterismo quando o contexto é SCA." }
    ]
  },
  {
    id: "fibrilacao-atrial",
    name: "Fibrilação Atrial",
    cards: [
      { q: "Qual escore de risco tromboembólico a diretriz 2025 adota e o que mudou?", a: "CHA₂DS₂-VA: o sexo feminino deixou de pontuar (é modificador de risco, não muda a recomendação e o escore fica inclusivo). Anticoagular se ≥ 2." },
      { q: "Qual a estratégia antiarrítmica preferencial segundo a diretriz 2025?", a: "Controle do ritmo. Controle da FC fica para assintomáticos ou com baixa probabilidade de manter RS." },
      { q: "Qual é o novo ponto de corte de duração da FA que orienta a cardioversão?", a: "24 horas (não mais 48 h): < 24 h → anticoagular e cardioverter; ≥ 24 h ou desconhecida → ETE ou 3 semanas de anticoagulação antes." },
      { q: "Qual é, em nível populacional, o fator de risco mais importante para FA?", a: "HAS: quanto maior a PAS, maior o risco de FA; o controle pressórico rigoroso reduz a incidência de FA." },
      { q: "Paciente obeso com FA pergunta quanto peso precisa perder para fazer diferença.", a: "Pelo menos 10% do peso; perda mantida > 10% aumenta muito a chance de ficar livre de arritmia." },
      { q: "Paciente com FA pergunta se deve parar de tomar café.", a: "Não é necessário: consumo moderado (1–3 xícaras/dia) não é prejudicial." },
      { q: "Qual o limite de álcool recomendado para reduzir recorrência de FA?", a: "< 30 g/semana; a abstinência reduz a recorrência." },
      { q: "Homem jovem, maratonista, alto, com FA paroxística e bradicardia sinusal de repouso. Qual mecanismo e por que o tratamento é difícil?", a: "FA do atleta (curva em “U”): dilatação atrial, alterações vagais e adrenérgicas, fibrose. A bradicardia sinusal limita drogas → ablação costuma ser preferível." },
      { q: "Por que as veias pulmonares são o alvo principal da ablação?", a: "A maioria dos focos ectópicos que deflagram a FA nasce nelas: prolongamentos de miócitos do AE com fibras desorganizadas, pouco acoplamento lateral, fibrose e anormalidades do cálcio. Isolá-las elimina o gatilho." },
      { q: "O que mantém a FA depois que ela começa?", a: "Múltiplas ondas de reentrada simultâneas sobre um substrato atrial dilatado, fibrosado e com refratariedade encurtada, modulado pelo tônus autonômico." },
      { q: "Por que a FA é chamada de doença progressiva e o que isso implica?", a: "Remodelamento elétrico/estrutural pela própria FA e exposição contínua a fatores de risco (paroxística → persistente). Implica intervir cedo: controle precoce do ritmo, ablação precoce, tratar fatores de risco." },
      { q: "O que é cardiomiopatia atrial e como suspeitá-la sem biópsia?", a: "Alterações estruturais/contráteis/elétricas dos átrios capazes de gerar FA e trombose. Pistas: bloqueio interatrial e P prolongada no ECG, AE aumentado no eco, realce tardio atrial na RM, baixa voltagem no mapeamento. Aumenta risco embólico mesmo sem FA documentada." },
      { q: "Por que o paciente pode ter poliúria logo após reverter a FA?", a: "Liberação de peptídeo natriurético atrial." },
      { q: "FA com 10 dias de duração, revertida com amiodarona. Como classificar?", a: "Persistente (> 7 dias e < 1 ano), independentemente da forma de reversão." },
      { q: "O que define FA permanente?", a: "Decisão conjunta de médico e paciente de não tentar restaurar o RS — não é critério de tempo. Se o controle do ritmo for reconsiderado, passa a persistente de longa duração." },
      { q: "Por que a FA assintomática tem pior prognóstico que a sintomática?", a: "Porque é diagnosticada tarde: sem sintomas, não se inicia anticoagulação nem controle da FC. O risco de AVC não depende dos sintomas." },
      { q: "Por que a FA causa dispneia e intolerância ao esforço?", a: "Perda da contração atrial e RR irregular reduzem o enchimento e o débito; ao esforço, a facilitação adrenérgica da condução AV eleva a FC desproporcionalmente." },
      { q: "Paciente com FA paroxística tem síncope ao término das crises. Qual o diagnóstico e qual opção evita marca-passo?", a: "Síndrome taqui-bradi (pausas prolongadas pós-FA, doença do nó sinusal). A ablação da FA pode evitar o marca-passo." },
      { q: "Quais achados na FA indicam cardioversão elétrica imediata?", a: "Instabilidade hemodinâmica atribuível à FA (hipotensão/choque, congestão aguda, isquemia, rebaixamento) → CVE sincronizada 200 J bifásico." },
      { q: "Idoso com FA de baixa resposta, sem palpitações. Que sintomas esperar e o que dificulta o diagnóstico?", a: "Sintomas sutis (fadiga, dispneia, piora funcional) ou nenhum; comorbidades e remédios mascaram; difícil distinguir de taquicardia atrial. Extrassístoles atriais ≥ 30/h no Holter sugerem cardiomiopatia atrial." },
      { q: "Quais são os critérios eletrocardiográficos de FA clínica?", a: "RR irregular (com condução AV preservada), ausência de ondas P discerníveis com ondas f, registro ≥ 30 s em ECG de 12 derivações ou derivação única, validado por médico." },
      { q: "Quais exames todo paciente com FA recém-diagnosticada deve fazer?", a: "ECG de 12 derivações; glicemia, função renal, perfil lipídico, eletrólitos, hormônios tireoidianos, hemograma com plaquetas; ecocardiograma transtorácico." },
      { q: "Para que serve o ecocardiograma transtorácico na FA, na prática?", a: "Definir cardiopatia estrutural (função do VE, hipertrofia, valvopatia — sobretudo estenose mitral) e tamanho/volume atrial: muda a escolha do anticoagulante (varfarina na EM moderada/grave) e do antiarrítmico (propafenona proibida na cardiopatia estrutural)." },
      { q: "Após AVC criptogênico, Holter de 24 h normal afasta FA? Qual estratégia?", a: "Não. Monitorização prolongada (loop externo ou implantável). Achar FA troca antiagregação por anticoagulação." },
      { q: "Qual a acurácia da palpação de pulso para FA e o que isso implica?", a: "Sensibilidade alta (87–97%), especificidade moderada (70–81%). Boa para triagem; todo pulso irregular precisa de ECG confirmatório." },
      { q: "Como se define FA subclínica?", a: "Paciente assintomático com ritmo atrial acelerado em DCEI (em geral ≥ 175 bpm, ≥ 5 min), validado por especialista, ou registro sugestivo em monitor implantável/vestível." },
      { q: "Como distinguir taquicardiomiopatia induzida pela FA de IC primária com FA?", a: "Taquicardiomiopatia: FEVE normaliza após controle da FC/reversão, BNP menos elevado, pouca fibrose (ausência de realce tardio prediz recuperação). IC primária: BNP mais elevado, FEVE não recupera." },
      { q: "Calcule o CHA₂DS₂-VA: mulher, 70 anos, hipertensa, sem outras doenças.", a: "2 (HAS 1 + idade 65–74 anos 1; sexo não pontua) → anticoagulação oral." },
      { q: "Calcule o CHA₂DS₂-VA: homem, 77 anos, diabético, com AIT prévio.", a: "5 (idade ≥ 75 = 2; DM = 1; AIT = 2) → anticoagular." },
      { q: "HAS-BLED de 4 contraindica anticoagulação?", a: "Não. Indica alto risco de sangramento: corrigir fatores modificáveis (PA, AINE/AAS, álcool, trocar varfarina por ACOD). O risco de sangramento não deve ser usado para decidir não anticoagular." },
      { q: "Idoso com FA e histórico de quedas: suspender o anticoagulante?", a: "Não. Quedas não são preditor independente de sangramento com ACOD; o benefício da anticoagulação supera o risco. ACOD protege mais que varfarina em quem cai." },
      { q: "Jovem de 28 anos com FA sem cardiopatia estrutural e história familiar de morte súbita. Qual raciocínio e qual cuidado terapêutico?", a: "Pensar em canalopatia (Brugada, QT curto, QT longo, TVPC) ou cardiomiopatia hereditária; considerar teste genético (< 60 anos; SCN5A, LMNA, KCNQ1, MYL4, TTN). No Brugada, propafenona (classe I) é contraindicada — nada de pill-in-the-pocket." },
      { q: "FA estável com FC 150 no PS. Qual a primeira classe de droga e qual opção se há risco de hipotensão?", a: "Betabloqueador IV; esmolol pela meia-vida curta (500 µg/kg em 1 min; 10–40 µg/kg/min). Sequência se falha: + digital IV → amiodarona IV. MgSO₄ como adjuvante." },
      { q: "Antes de controlar a FC no PS, o que precisa ser afastado?", a: "Causas secundárias da taquicardia/instabilidade: desidratação, sangramento, anemia, infecção (e hipertireoidismo, catecolaminas, pré-excitação elevam a resposta)." },
      { q: "FA de início há 10 h, estável, quer cardioverter. Precisa de ETE?", a: "Não necessariamente: < 24 h → anticoagular (ACOD, enoxaparina 1 mg/kg SC ou HNF 60–70 U/kg IV) e cardioverter. Exceção: alto risco (EM grave, prótese mecânica, embolia prévia; ou escore ≥ 2 em homem/≥ 3 em mulher com FA de 12–24 h) → tratar como ≥ 24 h." },
      { q: "FA de duração desconhecida, estável. Quais as duas formas de cardioverter com segurança?", a: "(1) ETE sem trombo → heparina/ACOD e cardioversão; (2) anticoagulação por 3 semanas antes. Com varfarina, contar a partir do 1º RNI terapêutico." },
      { q: "Por quanto tempo anticoagular após uma cardioversão e depois?", a: "≥ 4 semanas para TODOS, mesmo com escore 0; depois, indefinido se CHA₂DS₂-VA ≥ 2, suspender se 0, individualizar se 1. AAS nesse contexto: contraindicado." },
      { q: "Qual a dose e o cuidado obrigatório no esquema pill-in-the-pocket?", a: "Propafenona 600 mg VO dose única (450 mg se < 70 kg), precedida de betabloqueador ou bloqueador de cálcio (evita flutter 1:1); primeira vez em ambiente hospitalar; só em coração estruturalmente normal." },
      { q: "Por que a propafenona pode piorar a FC ventricular?", a: "Lentifica a atividade atrial e pode converter a FA em “flutter IC” lento, que o nó AV conduz 1:1 → FC ventricular muito alta." },
      { q: "Quais drogas fazem cardioversão química no Brasil e qual serve na cardiopatia estrutural?", a: "Amiodarona e propafenona; só a amiodarona na cardiopatia estrutural." },
      { q: "CHA₂DS₂-VA = 1. Anticoagula?", a: "Pode ser instituída, individualizando benefício, risco de sangramento, forma da FA e preferência." },
      { q: "Quais condições exigem anticoagulação independentemente do CHA₂DS₂-VA?", a: "Miocardiopatia hipertrófica, amiloidose cardíaca e hipertireoidismo — e, na congênita do adulto, cirurgia intracardíaca prévia, cianose, Fontan ou VD sistêmico." },
      { q: "Em quais valvopatias a varfarina é obrigatória e em quais o ACOD é preferido?", a: "Varfarina: estenose mitral moderada/grave (reumática) e prótese mecânica (ACOD contraindicado). ACOD: regurgitação mitral, estenose e regurgitação aórtica, bioprótese mitral e TAVI." },
      { q: "ACOD pode ser usado em prótese valvar mecânica?", a: "Não — causam mais eventos tromboembólicos e mais sangramento que a varfarina. Usar varfarina." },
      { q: "Em relação à varfarina, o que os ACOD reduzem e o que aumentam?", a: "Reduzem AVC/embolia, AVC hemorrágico, mortalidade, sangramento maior e intracraniano; aumentam o sangramento gastrointestinal." },
      { q: "Critérios de redução da apixabana para 2,5 mg 2×/dia.", a: "Pelo menos 2 de 3: idade ≥ 80 anos, peso ≤ 60 kg, creatinina ≥ 1,5 mg/dL." },
      { q: "Quando reduzir rivaroxabana e edoxabana?", a: "Rivaroxabana 20 → 15 mg se ClCr 15–49. Edoxabana 60 → 30 mg se TFG 15–50, peso ≤ 60 kg ou dronedarona, ciclosporina, eritromicina ou cetoconazol." },
      { q: "A dabigatrana 110 mg 2×/dia é a dose “de ajuste renal”?", a: "Não. É uma dose reduzida, usada se ≥ 80 anos, uso de verapamil ou risco aumentado de sangramento." },
      { q: "Qual ACOD preferir no alto risco de sangramento gastrointestinal? E para quem quer 1 comprimido/dia?", a: "Apixabana. Edoxabana ou rivaroxabana (1×/dia)." },
      { q: "Paciente em diálise com FA e CHA₂DS₂-VA 4. Qual a posição da diretriz?", a: "Benefício da anticoagulação incerto (varfarina sem eficácia comprovada e com mais sangramento). Se optar por anticoagular, apixabana parece razoável." },
      { q: "FA subclínica detectada em marca-passo: anticoagular?", a: "Considerar apixabana ou edoxabana: reduzem AVC/embolia, à custa de mais sangramento maior." },
      { q: "FA anticoagulada submetida a angioplastia eletiva. Esquema antitrombótico?", a: "Tripla (ACOD + clopidogrel + AAS) por 1 semana, depois dupla (ACOD + clopidogrel) até 6 meses, depois ACOD isolado. Na SCA, dupla até 1 ano. IBP em toda terapia dupla." },
      { q: "Paciente em ACOD chega com IAM com supra de ST. Trombólise ou angioplastia? Anticoagulante parenteral?", a: "Angioplastia primária (ACOD é contraindicação relativa à trombólise), via radial, evitar prasugrel/ticagrelor; dar dose usual de anticoagulante parenteral (HNF 60 UI/kg ou enoxaparina 0,5 mg/kg), independentemente da última dose." },
      { q: "Paciente em ACOD vai fazer ablação de FA. Suspender?", a: "Não: anticoagulação ininterrupta; ponte com heparina aumenta sangramento. Após ablação, ACO ≥ 2 meses para todos e indefinidamente no alto risco." },
      { q: "Quanto tempo suspender ACOD antes de cirurgia cardíaca eletiva?", a: "≥ 48 h; 72–96 h em idosos/DRC. Dabigatrana: ≥ 72 h se ClCr 50–79 e ≥ 96 h se 30–49. Varfarina: ~5 dias, operar com RNI < 1,5." },
      { q: "Quando usar antídoto em sangramento por ACOD?", a: "Risco de morte (SNC, incontrolável), órgão/cavidade crítica (intraespinal, intraocular, pericárdio, retroperitônio, síndrome compartimental), sangramento maior refratário à hemostasia local, cirurgia de emergência de alto risco." },
      { q: "Qual o antídoto da dabigatrana e qual sua dose? E dos inibidores do Xa?", a: "Idarucizumabe 5 g IV (2 × 2,5 g). Inibidores do Xa: andexanete alfa; alternativa: complexo protrombínico de 4 fatores." },
      { q: "Carvão ativado em paciente com sangramento digestivo em uso de rivaroxabana tomada há 2 h?", a: "Não: carvão ativado é contraindicado na hemorragia digestiva. Ele é opção (1 g/kg) em sangramento moderado/grave de outro sítio se última dose < 2–4 h." },
      { q: "Qual ACOD é removido por hemodiálise?", a: "Dabigatrana (baixa ligação proteica). Rivaroxabana e apixabana não." },
      { q: "Após hemorragia intracraniana em uso de anticoagulante, quando e com o que reintroduzir?", a: "Decisão multidisciplinar com neuroimagem; após a fase aguda (em geral ≥ 4 semanas), preferindo ACOD. Se causa irreversível/alto risco de recorrência: oclusão do AAE." },
      { q: "Quem é candidato à oclusão percutânea do AAE?", a: "FA de alto risco tromboembólico com contraindicação absoluta ou falha da anticoagulação." },
      { q: "Paciente com FA vai fazer troca valvar aórtica. O que fazer com o AAE e com o anticoagulante depois?", a: "Oclusão cirúrgica do AAE concomitante (reduz AVC isquêmico, somada à anticoagulação). Manter a anticoagulação conforme o CHA₂DS₂-VA." },
      { q: "Pode-se usar AAS para prevenir AVC em FA de baixo risco “só para garantir”?", a: "Não. Antiplaquetários isolados ou combinados não são recomendados para prevenção de AVC na FA." },
      { q: "Qual a meta de FC no controle de frequência?", a: "< 80 bpm em repouso; controle leniente (< 110 bpm) é aceitável em assintomáticos. Holter 24 h para verificar a FC média." },
      { q: "Paciente com FA e FEVE 30%. Quais drogas para controle de FC são proibidas e quais usar?", a: "Proibidos: verapamil e diltiazem (inotrópicos negativos, FEVE < 40%). Usar betabloqueador de IC (succinato de metoprolol, carvedilol, bisoprolol), digoxina; amiodarona se necessário." },
      { q: "Por que a digoxina isolada é ruim para o jovem ativo?", a: "Perde efeito em alta carga adrenérgica (exercício). Uso como 2ª linha/associação; cuidado: mortalidade aumenta com nível > 1,2 ng/mL; evitar na DRC avançada." },
      { q: "Asmático com FA e resposta alta: qual droga de controle de FC?", a: "Verapamil ou diltiazem (se FEVE ≥ 40%) — opção preferencial em broncopatas; ou betabloqueador altamente seletivo (bisoprolol)." },
      { q: "Quando priorizar controle do ritmo?", a: "Jovem (< 65 anos), remodelamento discreto/moderado, sintomático, FC difícil de controlar, taquicardiomiopatia, IC, alto risco tromboembólico. Frequência: muito idoso ou assintomático com função normal." },
      { q: "Qual DAA para manter RS em: (a) coração normal; (b) coronariopata com FEVE 50%; (c) ICFEr?", a: "(a) Propafenona (ou sotalol/amiodarona); (b) sotalol (FEVE > 40%) ou amiodarona — propafenona proibida; (c) amiodarona — sotalol e propafenona proibidos." },
      { q: "Quais exames monitorar em uso crônico de amiodarona e por quê?", a: "TSH (hipo/hipertireoidismo), função hepática (hepatotoxicidade), RX de tórax (fibrose pulmonar ~3%), oftalmológico (depósito corneano), função renal. Usar ≤ 200 mg/dia para reduzir efeitos." },
      { q: "Quais as contraindicações do sotalol?", a: "ClCr < 40 mL/min (reduzir se < 60), ICFEr, hipertrofia importante. Monitorar QT e K⁺ (TdP; mais risco em mulheres, bradicardia, DRC, HVE)." },
      { q: "Quando a ablação é primeira linha?", a: "FA paroxística sintomática por escolha do paciente; suspeita de taquicardiomiopatia com ICFEr, independentemente de sintomas; persistente sintomática por escolha; ICFEr para ↓ morte/internação." },
      { q: "Após ablação do nó AV com marca-passo, qual a FC de estimulação inicial e por quê?", a: "80–90 bpm nas primeiras semanas, para reduzir risco de TV polimórfica/morte súbita." },
      { q: "Febre, dor torácica e AVC 3 semanas após ablação de FA. Hipótese, exame e o que não fazer?", a: "Fístula atrioesofágica. TC ou RM; NÃO fazer endoscopia (embolia gasosa). Tratamento imediato (cirurgia ou stent); mortalidade > 50%." },
      { q: "Hipotensão súbita durante ablação de FA. Principal hipótese?", a: "Tamponamento cardíaco por perfuração: eco intracardíaco/transtorácico, drenagem subxifoide, reversão da anticoagulação." },
      { q: "Gestante de 20 semanas com FA sintomática e FEVE normal. Opções de controle?", a: "FC: betabloqueador exceto atenolol; digoxina se falha. Ritmo a partir do 2º trimestre: propafenona ou sotalol. CVE se instável (com monitorização fetal). Amiodarona contraindicada." },
      { q: "Gestante com estenose mitral reumática e FA: anticoagulante por trimestre?", a: "1º trimestre: HBPM; 2º trimestre até 36ª semana: varfarina com relativa segurança; periparto: HBPM. ACOD contraindicado." },
      { q: "Betabloqueador profilático antes de colectomia para prevenir FA pós-operatória?", a: "Não: em cirurgia não cardíaca causa mais risco que benefício (mais mortalidade e AVC). Em cirurgia cardíaca, a profilaxia recomendada é amiodarona." },
      { q: "FA no pós-operatório de cirurgia cardíaca que reverteu antes da alta: é benigna?", a: "Não: > 95% saem em RS, mas há mais AVC, IAM, IC e mortalidade em 12 meses e maior risco de FA futura." },
      { q: "Paciente com ClCr 40 mL/min em ACOD: de quanto em quanto tempo checar a função renal?", a: "A cada ClCr/10 = 4 meses. Se > 75 anos ou frágil: a cada 4 meses; sem essas condições e ClCr ≥ 60: anual." },
      { q: "Por que a adesão ao ACOD é crítica?", a: "O efeito cai em 12–24 h após a última dose — não há “reserva” como na varfarina. Descontinuação maior em jovens, DRC, álcool, escore baixo e custo alto." },
      { q: "Quem deve ser triado para FA e como?", a: "> 65 anos: triagem oportunista por palpação de pulso ou ECG; sistemática individualizada; todos os portadores de DCEI." },
      { q: "Qual a relação entre FA e demência e o que pode reduzir esse risco?", a: "FA é fator de risco independente para declínio cognitivo e demência (vascular, Alzheimer, inclusive precoce), mesmo sem AVC. Anticoagulação parece reduzir; ACOD superiores à varfarina (TTR < 75% → mais demência)." },
      { q: "Qual intervenção não farmacológica melhora a prevenção de AVC na FA?", a: "Educação de pacientes e profissionais: aumenta o uso adequado de anticoagulantes e reduz eventos tromboembólicos sem aumentar sangramento." },
      { q: "Mulher, 66 anos, hipertensa, FA paroxística descoberta no relógio inteligente, assintomática. O traçado do relógio mostra 20 s de RR irregular sem onda P. Ela pede para começar anticoagulante. Próximo passo?", a: "Confirmar o diagnóstico: exige registro ≥ 30 s validado por médico (ECG ou monitorização, ex.: Holter/loop). Se confirmada: CHA₂DS₂-VA = 2 (HAS + 65–74) → ACOD. Atenção: o sexo feminino não pontua mais, e 20 s não fecha diagnóstico." },
      { q: "Homem, 58 anos, palpitações há 3 dias, FC 130, PA 120/80, eco com estenose mitral reumática moderada. Quer “choque” hoje. Conduta?", a: "FA > 24 h + alto risco: ETE (sem trombo → heparina e CVE) ou 3 semanas de anticoagulação antes. Anticoagulante crônico: varfarina (RNI 2–3), não ACOD. Controle da FC enquanto isso. Atenção: estar estável não autoriza cardioversão imediata." },
      { q: "Mulher, 45 anos, FA paroxística sintomática, coração normal ao eco, crises a cada 2 meses que a levam ao PS. Qual estratégia reduz idas ao PS e qual cuidado na primeira vez?", a: "Pill-in-the-pocket com propafenona 600 mg (450 mg se < 70 kg), precedida de betabloqueador/BCC, primeira dose em ambiente hospitalar. Alternativa: ablação como 1ª linha por escolha." },
      { q: "Homem, 70 anos, FA persistente, dispneia progressiva, FEVE 30%, FC média 125 no Holter, sem coronariopatia. Hipótese e conduta de ritmo?", a: "Taquicardiomiopatia provável. Ablação por cateter como 1ª linha, com Heart Team; enquanto isso, betabloqueador de IC/digoxina para FC e amiodarona se DAA (propafenona e sotalol proibidos; verapamil/diltiazem também). Anticoagular (CHA₂DS₂-VA ≥ 2: IC + idade)." },
      { q: "Mulher, 82 anos, 55 kg, Cr 1,3 mg/dL, FA permanente em apixabana 2,5 mg 2×/dia. Está correta a dose?", a: "Sim. A redução exige ≥ 2 de 3 critérios: ela tem idade ≥ 80 e peso ≤ 60 kg. (Atenção: a creatinina < 1,5 não impede, porque bastam 2 de 3.)" },
      { q: "Homem, 74 anos, FA em rivaroxabana, chega com melena e PA 85/50, última dose há 3 h. Carvão ativado?", a: "Não — hemorragia digestiva contraindica carvão. Suspender ACOD, ressuscitação/transfusão, endoscopia para o sítio; sangramento grave com risco de morte → andexanete ou complexo protrombínico." },
      { q: "Paciente em apixabana fez angioplastia por IAM sem supra. Recebeu AAS + clopidogrel + apixabana. No 10º dia, o residente sugere manter os três por 1 ano. Correto?", a: "Não. Tripla por 1 semana (estendível até 1 mês só se alto risco trombótico), depois apixabana + clopidogrel até 1 ano (SCA), depois apixabana isolada. IBP durante a dupla." },
      { q: "Homem, 30 anos, FA paroxística, irmão falecido subitamente aos 35 anos e pai com diagnóstico de síndrome de Brugada. Plano de levar propafenona no bolso?", a: "Não: suspeita de síndrome de Brugada familiar — drogas classe I são contraindicadas. Investigar canalopatia (avaliação genética) antes de definir a terapia." },
      { q: "Idosa, 80 anos, FA, CHA₂DS₂-VA 5, HAS-BLED 3 (PA 170, uso de AINE para artrose). A família pede para não anticoagular pelo risco de sangrar. Conduta?", a: "Anticoagular (ACOD; apixabana ou edoxabana sugeridas no idoso/alto risco de sangramento) e corrigir fatores modificáveis: controlar PA e suspender AINE. HAS-BLED alto não contraindica anticoagulação." }
    ]
  },
  {
    id: "bradicardias",
    name: "Bradicardias",
    cards: [
      { q: "Por que, quanto mais baixa a lesão no sistema de condução, mais lenta a FC de escape?", a: "Porque o automatismo diminui do NSA em direção ao His-Purkinje. Quando uma região falha, quem assume é a imediatamente a jusante, que tem automatismo menor." },
      { q: "Por que o escape do His-Purkinje tem QRS > 120 ms, e o escape juncional costuma ter QRS estreito?", a: "O escape juncional ainda usa a via rápida His-Purkinje para despolarizar os ventrículos. O escape ventricular baixo se propaga célula a célula, fora dessa via, por isso o QRS alarga." },
      { q: "O que define a bradicardia relativa? Dê um exemplo.", a: "FC inapropriada para a demanda de débito. Exemplo: ~60 bpm no choque séptico ou hipovolêmico. O débito é FC × volume sistólico; sem taquicardia compensatória, o débito não sobe." },
      { q: "Qual é o substrato anatômico da doença do nó sinusal e quais são as duas consequências funcionais?", a: "Substituição das células do NSA por tecido fibroso e/ou gorduroso. Consequências: FC basal baixa e incapacidade de aumentar a FC conforme a necessidade (incompetência cronotrópica)." },
      { q: "O que é o reflexo de Bezold-Jarisch?", a: "Aumento transitório do tônus vagal na isquemia miocárdica, que causa bradicardia e pode vir com hipotensão transitória." },
      { q: "Por que a atropina falha no Mobitz II e no BAVT infranodal?", a: "A atropina remove o freio vagal, que atua sobre o NSA e o NAV. No bloqueio abaixo do His o problema não é vagal, então não há o que reverter." },
      { q: "Bradicardia, hipertensão e arritmia respiratória num paciente com HSA. Qual a hipótese?", a: "Tríade de Cushing por hipertensão intracraniana rapidamente progressiva. A bradicardia (em geral sinusal) é sinal de alerta de PIC muito elevada." },
      { q: "Abaixo de qual FC a bradicardia costuma dar sintomas? Esse limiar é confiável?", a: "Em geral abaixo de 40 bpm, mas a correlação é fraca: há pacientes com sintomas abaixo de 55 bpm e outros só abaixo de 30 bpm." },
      { q: "Quais achados definem bradicardia instável?", a: "Rebaixamento do nível de consciência, angina, hipotensão, síncope ou sinais de choque. Todos expressam baixo débito para cérebro, coronárias ou periferia." },
      { q: "Paciente estável com BAVT. Precisa internar?", a: "Sim. Mobitz II e BAVT exigem internação com monitorização cardíaca e avaliação do cardiologista, mesmo estáveis, porque o escape infranodal é frágil." },
      { q: "Quais são os cinco itens obrigatórios do exame físico do bradicárdico?", a: "Palpação de pulsos, medida da PA, avaliação da perfusão periférica, ausculta cardíaca e exame neurológico sumário." },
      { q: "Atleta com FC de 42 bpm e BAV de 1º grau, assintomático. O que fazer?", a: "Nada além de tranquilizar. No atleta, investiga-se só se houver sintomas (síncope, pré-síncope, tontura)." },
      { q: "Qual é o exame de eleição inicial na bradicardia e por quê?", a: "ECG de 12 derivações. É rápido, de baixa complexidade e acessível, e identifica logo um BAV avançado." },
      { q: "Como diferenciar Mobitz I de Mobitz II no ECG?", a: "No Mobitz I o PR aumenta até a P ser bloqueada, e o PR antes do bloqueio é maior que o PR depois dele. No Mobitz II o PR é constante e a P é bloqueada de repente." },
      { q: "Por que o aumento do PR no Wenckebach é uma armadilha?", a: "O aumento não é linear: em alguns batimentos o PR fica igual. Comparar o PR imediatamente antes e depois da P bloqueada é mais confiável que procurar um aumento progressivo." },
      { q: "BAV 2:1: é Mobitz I ou II?", a: "Não dá para saber pelo ECG, porque não há dois PR conduzidos seguidos para comparar. Na dúvida, maneje como potencialmente infranodal." },
      { q: "Qual é o único bloqueio sinoatrial suspeitável no ECG de superfície?", a: "O de 2º grau tipo II: pausa súbita após PP regulares, igual ao dobro (ou múltiplos) do PP prévio. Os de 1º grau, 3º grau e 2º grau tipo I só aparecem no estudo eletrofisiológico." },
      { q: "Fibrilação atrial com QRS regulares e FC de 38 bpm. Qual o diagnóstico?", a: "FA com BAVT. Na FA a condução é irregular; um ritmo ventricular regular indica que nenhum impulso atrial passa e um escape assumiu (FA com BAVT é um ritmo regular)." },
      { q: "Átrios e ventrículos independentes. Como separar BAVT de dissociação AV?", a: "Se a frequência atrial é maior que a ventricular, é BAVT. Se é menor, trata-se de dissociação AV: o escape do NAV ou de um ponto mais baixo ficou mais rápido que o NSA." },
      { q: "Como fazer e interpretar o teste da atropina na bradicardia estável?", a: "Atropina 0,04 mg/kg em bolus (máx. 2 mg) com ECG contínuo. Reversão, mesmo transitória, indica efeito supranodal ou nodal (talvez medicamentoso). Sem resposta, pense em bloqueio infranodal." },
      { q: "Bradicardia estável, mas com sintomas suspeitos. Que exames ambulatoriais pedir?", a: "Holter, monitor de eventos, teste ergométrico, tilt-test e estudo eletrofisiológico." },
      { q: "Que exames laboratoriais pedir na emergência para buscar a causa?", a: "Eletrólitos, Hb/Ht, função renal, gasometria, troponina, função tireoidiana, ecocardiograma e dosagem de antiarrítmicos ou digoxina, conforme a suspeita." },
      { q: "Bradicardia atrial vs sinusal: o que olhar?", a: "A orientação da onda P. A sinusal tem eixo de +30º a +90º e é positiva em DI, DII, DIII e aVF. Um foco atrial ectópico próximo ao NSA dá uma P quase igual, então a diferença exige atenção." },
      { q: "Quais distúrbios eletrolíticos causam bradicardia e qual íon corrigir junto?", a: "Hipercalemia e hipercalcemia acentuadas. Corrija também a hipomagnesemia associada, porque o magnésio é essencial para a estabilidade da membrana miocárdica." },
      { q: "IAM inferior vs anterior: por que cada um dá bradicardia?", a: "No inferior, a coronária direita irriga o sistema de condução e causa isquemia direta dele. No anterior extenso, a causa é o acometimento miocárdico extenso." },
      { q: "Quais procedimentos podem causar BAVT por lesão mecânica?", a: "Cirurgia cardíaca, TAVI com prótese autoexpansível e ablação no estudo eletrofisiológico. A endocardite com abscesso perivalvar faz o mesmo por destruição local." },
      { q: "Bradicardia instável no PS. Qual a sequência inicial?", a: "Via aérea e ventilação, O₂ se necessário, monitorização, acesso venoso e ECG de 12 derivações. Dê atropina IV enquanto providencia o marca-passo transcutâneo (ou adrenalina/dopamina em infusão). Depois do transcutâneo, passe o transvenoso." },
      { q: "Bradicardia estável: qual é a pergunta central?", a: "O bloqueio é avançado? Se não for, trate as causas reversíveis e observe. Mobitz II ou BAVT: internação monitorizada e cardiologista." },
      { q: "Quando considerar marca-passo transvenoso no paciente estável?", a: "Escape ventricular < 30 bpm com QRS ≥ 120 ms, ou sintomas secundários à bradicardia." },
      { q: "Intoxicação por medicação com sintomas graves: o que muda no preparo do marca-passo?", a: "O preparo do marca-passo é simultâneo ao tratamento farmacológico, sem esperar a resposta ao antídoto." },
      { q: "Bradicardia sintomática persiste após tratar a intoxicação. Paciente estável, com IAM e BAV. Qual droga usar?", a: "Aminofilina 250 mg EV em bolus. A indicação é IAM com BAV de 2º ou 3º grau sem instabilidade nem sintomas graves." },
      { q: "Hipoxemia como causa de bradicardia: qual o alvo do tratamento?", a: "Corrigir a insuficiência respiratória. A bradicardia é consequência e melhora com ela." },
      { q: "Qual a dose de atropina na bradicardia instável?", a: "1 mg IV, repetida a cada 3–5 min até o total de 3 mg." },
      { q: "Em quem a atropina não deve ser usada?", a: "No transplantado cardíaco. O coração desnervado não tem tônus vagal a bloquear." },
      { q: "Adrenalina vs dopamina na bradicardia: doses e qual eleva mais a FC?", a: "Adrenalina 2–10 µg/min, com ação α e β e potência superior para elevar a FC. Dopamina 5–20 µg/kg/min, por agonismo β1." },
      { q: "Intoxicação por BCC: quais as opções de cálcio EV?", a: "Gluconato de cálcio 10%: 3–6 g a cada 10–20 min ou infusão contínua. Cloreto de cálcio: 1–2 g a cada 10–20 min ou infusão. O cloreto é vesicante e tem cerca de 3× mais cálcio elementar, por isso prefira acesso central." },
      { q: "Intoxicação por betabloqueador: qual o antídoto e a dose?", a: "Glucagon 3–10 mg EV, seguido de 3–5 mg/h. Efeitos limitantes: vômitos (proteger a via aérea), hiperglicemia, hipocalemia e efeito curto, de 10–15 min." },
      { q: "Insulina em alta dose: posologia e o que associar.", a: "Bolus de 1 U/kg + infusão de 0,5 U/kg/h, sempre com glicose e potássio. Monitore glicemia e potássio de perto." },
      { q: "Anticorpo antidigoxina: como dosar e administrar?", a: "Pela digoxinemia ou pela quantidade ingerida; cada ampola neutraliza 0,5 mg de digoxina. Infundir em pelo menos 30 min; pode repetir. Sem dosagem e com ingestão aguda desconhecida: 20 frascos." },
      { q: "Cite cinco classes de fármacos que causam bradicardia.", a: "Betabloqueadores, BCC não di-hidropiridínicos (diltiazem, verapamil), digoxina, antiarrítmicos (ivabradina, amiodarona, propafenona, procainamida), tricíclicos e lítio. Também clonidina, simpatolíticos e fenitoína." },
      { q: "Qual o tratamento usual da doença do nó sinusal?", a: "Implante de marca-passo definitivo." },
      { q: "Por que o Mobitz II preocupa mais que o Mobitz I, mesmo em paciente estável?", a: "O Mobitz II é bloqueio baixo e pode evoluir para BAVT. O Mobitz I é alto e não gera repercussão hemodinâmica. No Mobitz II, busque causas reversíveis: isquemia, eletrólitos, medicação cronotrópica negativa." },

      { q: "Qual o objetivo primordial da ventilação mecânica?", a: "Servir de bomba ventilatória, favorecendo a troca gasosa do modo mais seguro possível e, idealmente, a recuperação da autonomia respiratória do paciente." },
      { q: "O que é a ventilação mecânica (VM)?", a: "Oferta de suporte parcial ou total dos músculos respiratórios para manter a ventilação alveolar." },
      { q: "Qual a condição necessária para que ocorra a troca gasosa?", a: "Ventilação alveolar, ou seja, a captação de oxigênio para o sangue arterial e a remoção de gás carbônico." },
      { q: "Cite indicações de intubação e VM por proteção das vias aéreas.", a: "Rebaixamento do nível de consciência com escala de Glasgow menor ou igual a 8." },
      { q: "Cite indicações de VM por controle de procedimentos ou choque.", a: "Cirurgia com anestesia geral, parada cardiorrespiratória, choque e controle da pressão intracraniana." },
      { q: "Quais são os sinais clínicos de insuficiência respiratória que indicam VM?", a: "Dispneia intensa e diaforese, frequência acima de 30 a 35 irpm ou abaixo de 8, uso de musculatura acessória, respiração paradoxal e sinais de fadiga muscular." },
      { q: "Quais achados gasométricos indicam VM?", a: "pH menor que 7,30 com PaCO2 maior que 50 mmHg, ou PaO2 menor que 60 mmHg e SpO2 menor que 90% com oxigenoterapia." },
      { q: "Quais são os objetivos da VM?", a: "Alívio do desconforto respiratório, correção da acidose e da hipoxemia, redução do trabalho muscular e reversão da fadiga muscular." },
      { q: "Como a VM ajuda a prevenir atelectasias?", a: "Ao reverter e prevenir atelectasias pelo suporte ventilatório." },
      { q: "Como a VM ajuda no choque circulatório?", a: "Aumenta a oferta de oxigênio aos tecidos pela redução do consumo muscular respiratório." },
      { q: "Qual o efeito da VM na hipertensão intracraniana?", a: "Diminui a pressão intracraniana no traumatismo craniano." },
      { q: "Como se define a fase de disparo do ciclo ventilatório?", a: "Forma como se inicia a fase inspiratória: pelo ventilador (controlado) ou pelo paciente (assistido)." },
      { q: "O que é o disparo pneumático por fluxo?", a: "Inspiração gerada pelo paciente, detectada por sensor de fluxo." },
      { q: "O que é o disparo pneumático por pressão?", a: "Pressão negativa gerada pelo paciente, detectada por sensor de pressão." },
      { q: "O que define a ciclagem em VM?", a: "O momento em que termina a fase inspiratória e se inicia a expiração." },
      { q: "Qual a ciclagem da ventilação controlada a volume?", a: "Ciclagem a volume: o ventilador cicla ao entregar o volume corrente pré-determinado." },
      { q: "Qual a ciclagem da ventilação controlada a pressão?", a: "Ciclagem a tempo: o ventilador cicla após o tempo inspiratório pré-determinado." },
      { q: "Qual a ciclagem da pressão de suporte (PSV)?", a: "Ciclagem a fluxo: o ventilador cicla quando o fluxo inspiratório cai a um valor pré-determinado." },
      { q: "Qual a diretiva primária da ventilação controlada a volume (VCV)?", a: "Garantir o volume corrente durante o ciclo." },
      { q: "Qual a principal desvantagem da VCV?", a: "A pressão não é controlada: nem a pressão de pico nem a de platô." },
      { q: "Qual a diretiva primária da ventilação controlada a pressão (PCV)?", a: "Manter a pressão nas vias aéreas no nível inspiratório pré-determinado." },
      { q: "Qual a principal desvantagem da PCV?", a: "O volume corrente não é garantido, pois depende da complacência e da resistência." },
      { q: "Qual é a diretiva primária da PSV?", a: "Manter a pressão de suporte, com o fluxo decrescente até um valor pré-determinado." },
      { q: "Qual modo ventilatório é classificado como espontâneo?", a: "A pressão de suporte (PSV), pois toda a frequência respiratória é realizada pelo paciente." },
      { q: "Qual a principal desvantagem da PSV?", a: "O volume corrente não é garantido." },
      { q: "O que é a ventilação assistida-controlada?", a: "Modo em que o paciente pode disparar o ventilador, mas existe uma frequência mínima garantida." },
      { q: "Quais são os ajustes iniciais típicos de VM em VCV?", a: "FiO2 de 60 a 100%, volume corrente de 6 a 8 mL/kg, frequência respiratória de 12 a 16 irpm e PEEP de 5 cmH2O." },
      { q: "Qual a faixa de volume corrente recomendada inicialmente?", a: "6 a 8 mL/kg, ajustado ao peso predito." },
      { q: "Qual a faixa de tempo inspiratório inicial?", a: "Cerca de 0,8 a 1,2 segundo." },
      { q: "Qual a sensibilidade inicial usada no disparo?", a: "1 a 2 cmH2O." },
      { q: "Quais são as metas de troca gasosa?", a: "SpO2 de 92 a 96%, PaO2 de 65 a 90 mmHg e pH de 7,34 a 7,43 (PaCO2 ajustada ao pH)." },
      { q: "Quais são as metas de mecânica pulmonar?", a: "Pressão máxima menor que 40 a 45 cmH2O, pressão de platô menor que 28 cmH2O e driving pressure menor que 15 cmH2O." },
      { q: "O que é driving pressure?", a: "Diferença entre a pressão de platô e a PEEP (ΔP = Pplatô − PEEP)." },
      { q: "Qual a meta de auto-PEEP?", a: "Zero ou o menor valor possível." },
      { q: "Quais parâmetros devem ser definidos em VCV?", a: "Volume corrente, frequência respiratória, fluxo inspiratório, FiO2, PEEP e sensibilidade." },
      { q: "Quais parâmetros devem ser definidos em PCV?", a: "Delta de pressão acima da PEEP, frequência respiratória, tempo inspiratório, FiO2, PEEP, sensibilidade e rise time." },
      { q: "Quais são as principais complicações da VM?", a: "Trauma de vias aéreas, barotrauma, comprometimento hemodinâmico, lesão pulmonar e muscular induzida pelo ventilador, pneumonia associada à VM e assincronias." },
      { q: "Como se faz a retirada da VM?", a: "Com redução gradual da PSV e teste de respiração espontânea de cerca de 30 a 45 minutos." },
      { q: "O que é a VNI?", a: "Ventilação não invasiva, por meio de interface nasal ou facial, fornecendo pressão positiva nas vias aéreas." },
      { q: "O que é IPAP e EPAP na VNI?", a: "IPAP é a pressão inspiratória para ventilar o paciente; EPAP é a pressão expiratória que mantém vias aéreas e alvéolos abertos." },
      { q: "O que é a PEEP e qual sua função?", a: "Pressão positiva no final da expiração, que mantém as vias aéreas e os alvéolos abertos e melhora a oxigenação." },
      { q: "Quais são as vantagens da VNI em relação à VMI?", a: "Mantém a via aérea intacta, preserva mecanismos de defesa, reduz pneumonia nosocomial, permite alimentação e fala, e tem custo inferior." },
      { q: "Quais são as desvantagens da VNI?", a: "Claustrofobia e desconforto da máscara, úlceras de pressão, via aérea não protegida, risco de aspiração e tempo de uso exigido." },
      { q: "Quais são as contraindicações à VNI?", a: "Incapacidade de cooperar, de proteger a via aérea ou de expectorar, rebaixamento do nível de consciência e alto risco de aspiração." },
      { q: "Quando há contraindicação absoluta de VNI por rebaixamento do nível de consciência?", a: "Glasgow menor que 8, exceto em DPOC, hipercapnia e narcose." },
      { q: "Quais são as indicações clássicas de VNI?", a: "DPOC agudizada, edema agudo de pulmão, insuficiência respiratória hipoxêmica aguda, desmame e doenças neuromusculares." },
      { q: "Qual programação inicial de CPAP na insuficiência hipoxêmica?", a: "CPAP em torno de 10 cmH2O, com PEEP de 8 a 10." },
      { q: "Qual programação inicial de BiPAP na insuficiência hipercápnica?", a: "IPAP de 15 a 20 cmH2O, EPAP de 5 cmH2O e delta de pressão (pressão de suporte) de 10 a 15 cmH2O." },
      { q: "Qual modalidade é preferida na DPOC?", a: "BIPAP (pressão em dois níveis)." },
      { q: "Qual modalidade é indicada no edema agudo de pulmão?", a: "CPAP (pressão positiva contínua)." },
      { q: "Qual a fórmula da pressão de suporte (PS) no BIPAP?", a: "PS = IPAP − EPAP." },
      { q: "Quais são as interfaces usadas na VNI?", a: "Máscara nasal, máscara facial e helmet (capacete), este último com menos pontos de contato na face." },
      { q: "Qual a desvantagem de risco do helmet na VNI?", a: "Risco de reinalação de CO2, em especial com helmet-VNI." },
      { q: "Por quanto tempo a VNI deve ser monitorada à beira do leito?", a: "No mínimo 30 minutos e no máximo 2 horas, por profissional da saúde." }
    ]
  },
  {

    cards: [
      { q: "Hipotireoidismo e hipertireoidismo são doenças ou status?", a: "Status do eixo tireoidiano, que resultam de várias doenças diferentes." },
      { q: "Qual o eixo hormonal que controla a tireoide?", a: "Hipotálamo (TRH), hipófise (TSH) e tireoide (T4 e T3)." },
      { q: "O que é TSH e de onde é produzido?", a: "Hormônio estimulante da tireoide, produzido pelas células basófilas da adeno-hipófise; é composto por subunidade alfa comum e beta específica." },
      { q: "Qual a característica da secreção pulsátil do TSH?", a: "Um pulso a cada cerca de 2 horas." },
      { q: "Qual a ingestão diária recomendada de iodo pela OMS?", a: "150 mcg/dia." },
      { q: "Como o iodo chega à tireoide?", a: "É absorvido no trato gastrointestinal (praticamente 100%) e concentrado pela tireoide, que faz a homeostase do iodo." },
      { q: "O que é o efeito Wolff-Chaikoff?", a: "Sobrecarga de iodo bloqueia a atividade da TPO e causa hipotireoidismo, sobretudo em tireoides expostas a altos níveis de iodo." },
      { q: "O que é o efeito Jod-Basedow?", a: "Em tireoides expostas cronicamente a baixos níveis de iodo, qualquer sobrecarga de iodo causa hipertireoidismo." },
      { q: "Quais fontes podem causar sobrecarga de iodo?", a: "Excesso de sal e frutos do mar, polivitamínicos, contrastes iodados, amiodarona, tintura de cabelo e xaropes." },
      { q: "Qual a estrutura química dos hormônios tireoidianos?", a: "São derivados de tirosina, formados por iodotironinas: T3 (triiodotironina) e T4 (tiroxina)." },
      { q: "Qual hormônio é mais potente, T3 ou T4?", a: "T3, cerca de quatro vezes mais potente que T4, mas presente em menor quantidade e com menor meia-vida." },
      { q: "Como o T4 se torna ativo?", a: "Pela ação das desiodases, que convertem T4 em T3 nos tecidos periféricos." },
      { q: "Qual a função da desiodase tipo 3?", a: "Inativa o T3 e gera rT3 (T3 reverso)." },
      { q: "Como os hormônios tireoidianos circulam no sangue?", a: "Ligados a proteínas carreadoras como TBG, transtirretina e albumina." },
      { q: "Por que a dosagem de T4 livre é preferida à de T4 total?", a: "Porque os valores totais dependem das proteínas carreadoras, enquanto o T4 livre reflete melhor o status do eixo." },
      { q: "Qual a causa mais comum de hipotireoidismo primário?", a: "Tireoidite de Hashimoto." },
      { q: "Qual o hipotireoidismo secundário e terciário?", a: "Secundário: hipopituitarismo; terciário: diminuição da secreção hipotalâmica de TRH (raro)." },
      { q: "Qual o padrão laboratorial do hipotireoidismo primário?", a: "TSH alto e T4 livre baixo." },
      { q: "Qual o padrão laboratorial do hipotireoidismo central (secundário)?", a: "TSH normal ou baixo com T4 livre baixo." },
      { q: "O que é o hipotireoidismo subclínico?", a: "TSH discretamente elevado com T4 livre normal." },
      { q: "Qual a causa mais comum de hipertireoidismo primário?", a: "Doença de Graves." },
      { q: "Qual a causa de hipertireoidismo secundário?", a: "TSHoma (adenoma hipofisário secretor de TSH)." },
      { q: "O que é tireotoxicose?", a: "Estado de excesso de hormônios tireoidianos circulantes sem aumento da síntese, como ocorre em tireoidites ou ingestão exógena." },
      { q: "Cite causas de tireotoxicose sem aumento da síntese hormonal.", a: "Ingestão de hormônio tireoidiano (tireotoxicose factícia), tireoidites, tecido tireoidiano ectópico e struma ovarii." },
      { q: "Qual a fisiopatologia da doença de Graves?", a: "Autoanticorpos (TRAb) ligam-se ao receptor de TSH e estimulam a síntese de hormônios tireoidianos, causando bócio com hipertireoidismo." },
      { q: "Quais são as manifestações específicas da doença de Graves?", a: "Bócio difuso, oftalmopatia infiltrativa (exoftalmia) e, raramente, dermopatia (mixedema pré-tibial)." },
      { q: "Qual o padrão laboratorial inicial da doença de Graves?", a: "TSH suprimido com T3 e T4 normais (hipertireoidismo subclínico)." },
      { q: "Qual o padrão laboratorial do hipertireoidismo clínico?", a: "TSH suprimido com T3 e T4 elevados." },
      { q: "Qual o diagnóstico laboratorial de Graves?", a: "Presença de TRAb positivo e quadro laboratorial de hipertireoidismo." },
      { q: "Qual exame de imagem diferencia Graves de tireotoxicose factícia ou tireoidite subaguda?", a: "Cintilografia: captação aumentada na doença de Graves e diminuída na tireotoxicose factícia e tireoidite subaguda." },
      { q: "O que é a doença de Plummer?", a: "Adenoma tóxico (nódulo único hiperfuncionante), com TSH suprimido e anticorpos negativos." },
      { q: "Qual o achado da cintilografia na doença de Plummer?", a: "Nódulo único captante com restante da glândula suprimido." },
      { q: "Qual o tratamento da doença de Plummer?", a: "Iodo radioativo." },
      { q: "Qual o perfil do bócio multinodular tóxico?", a: "Bócio de longa duração, mais comum em idosos, com hipertireoidismo mais leve, sem oftalmopatia e com anticorpos negativos." },
      { q: "Qual o tratamento cirúrgico do bócio multinodular tóxico?", a: "Tireoidectomia total." },
      { q: "Qual a doença tireoidiana autoimune mais comum?", a: "Tireoidite de Hashimoto, que pode cursar com hipo ou hipertireoidismo." },
      { q: "Qual a patogenia da tireoidite de Hashimoto?", a: "Quebra da autotolerância, infiltração linfocítica, depleção progressiva dos tireócitos com fibrose e apoptose." },
      { q: "Quais autoanticorpos são característicos da tireoidite de Hashimoto?", a: "Anti-TPO (antitireoperoxidase), mais sensível e presente em cerca de 95% dos casos, e anti-TG (antitireoglobulina)." },
      { q: "Qual o padrão de hipotireoidismo no curso da tireoidite de Hashimoto?", a: "Desenvolve-se gradualmente e lentamente, podendo ser precedido por tireotoxicose transitória (hashitoxicose)." },
      { q: "Há tratamento específico que interrompa o processo autoimune de Hashimoto?", a: "Não; trata-se apenas a fase de hipotireoidismo com reposição de levotiroxina." },
      { q: "Qual a dose plena de levotiroxina em adultos?", a: "Aproximadamente 1,0 a 1,7 mcg/kg/dia." },
      { q: "Qual o melhor parâmetro para guiar a reposição de levotiroxina?", a: "O TSH sérico." },
      { q: "Quando reavaliar o TSH após início ou ajuste da levotiroxina?", a: "Após cerca de 6 semanas, com incrementos de 25 a 50 mcg." },
      { q: "Qual a dose inicial de levotiroxina em idosos ou cardiopatas?", a: "25 mcg/dia, com aumentos de 25 mcg por mês." },
      { q: "Quais sinais e sintomas caracterizam o hipotireoidismo no adulto?", a: "Pele seca, constipação, intolerância ao frio, bradicardia, lentificação do reflexo aquileu, edema e fadiga." },
      { q: "Quais sinais e sintomas caracterizam o hipertireoidismo?", a: "Perda de peso, taquicardia, tremor, sudorese, intolerância ao calor, fibrilação atrial e diarreia." },
      { q: "O que é o sinal de lid lag?", a: "Borda visível da esclera entre a pálpebra superior e a íris ao olhar para baixo, típico da doença de Graves." },
      { q: "Como é a oftalmopatia de Graves?", a: "Inflamação mononuclear retro-orbitária com edema dos músculos extraoculares e acúmulo de matriz, causando proptose." },
      { q: "Qual a fase da oftalmopatia em que os corticoides são úteis?", a: "Na fase inflamatória da doença." },
      { q: "Qual a fase em que a descompressão orbitária é indicada?", a: "Na fase fibrótica, principalmente com compressão do nervo óptico." },
      { q: "Quais medidas gerais ajudam a oftalmopatia leve?", a: "Colírios e pomadas lubrificantes, elevar a cabeceira para reduzir edema palpebral e parar de fumar." },
      { q: "Qual o papel da radioterapia orbitária?", a: "Aplicada em baixa dose na região retrobulbar para reduzir a proptose." },
      { q: "Quais são as drogas antitireoidianas (ADT) e seu mecanismo?", a: "Metimazol e propiltiouracil, que bloqueiam a TPO; o PTU também bloqueia a desiodase tipo 1." },
      { q: "Quais efeitos adversos graves das ADT devem ser monitorados?", a: "Agranulocitose e hepatotoxicidade." },
      { q: "Qual indicação preferencial do propiltiouracil?", a: "Crise tireotóxica e gestantes." },
      { q: "Quais são as opções de tratamento definitivo da doença de Graves?", a: "Iodo radioativo ou tireoidectomia total." },
      { q: "Qual a contraindicação do iodo radioativo em grupos especiais?", a: "Gestantes e, em geral, mulheres em amamentação." },
      { q: "Qual o tratamento do bócio endêmico no Brasil?", a: "Iodação obrigatória do sal de cozinha, instituída por lei a partir de 1953." },
      { q: "Qual a faixa de iodação do sal de cozinha no Brasil?", a: "Entre 15 e 45 mg de iodo por quilo de sal." },
      { q: "O que caracteriza o bócio?", a: "Aumento do tamanho da tireoide, que pode ocorrer no hipo, no hipertireoidismo e em outras doenças." },
      { q: "Qual a função do exoftalmômetro de Hertel?", a: "Medir a proptose (exoftalmia) na oftalmopatia de Graves." }
    ]
  },
  {

      { q: "Como se define a síndrome coronariana crônica (SCC)?", a: "Apresentações clínicas decorrentes de alterações estruturais e/ou funcionais das artérias coronárias e/ou da microcirculação." },

      { q: "Quais os critérios da angina atípica?", a: "Dois de três critérios." },

      { q: "Quais são os diferenciais pulmonares da dor torácica?", a: "TEP, pneumotórax, pneumonia, pleurite e hipertensão pulmonar." },
      { q: "Quais são as causas de dor torácica com demanda aumentada?", a: "Anemia, tireotoxicose, taquiarritmias e hipertrofia ventricular esquerda." },
      { q: "Quais são os exames iniciais no consultório de um paciente com suspeita de DAC?", a: "ECG de repouso em todos, laboratório (perfil lipídico, glicemia, HbA1c, função renal, TSH) e ecocardiograma." },
      { q: "Em quais casos dosar ApoB e Lp(a)?", a: "Em muito alto risco ou história familiar precoce de DAC." },
      { q: "Qual a pergunta de exame anatômico?", a: "Existe placa e quanto ela estreita a artéria?" },

      { q: "Quando indicar escore de cálcio em um paciente assintomático?", a: "Hipercolesterolemia familiar com LDL maior ou igual a 190 mg/dL, história familiar precoce ou risco intermediário com dúvida sobre estatina." },
