    cards: [
      { q: "No Brasil, qual causa de doença de Addison pode superar a autoimune em regiões endêmicas, e em que perfil de paciente?", a: "Paracoccidioidomicose: em regiões endêmicas pode superar a autoimune. Típica de homem > 30 anos, trabalhador rural do Sul, Sudeste ou Centro-Oeste." },
      { q: "Qual a causa mais comum de doença de Addison em países desenvolvidos e qual percentual?", a: "Adrenalite autoimune, 68–94%; a TB responde por 7–20%." },
      { q: "Qual tipo de IA é mais frequente: primária ou secundária?", a: "Secundária (150–280/milhão vs 100–140/milhão na primária)." },
      { q: "Por que a doença de Addison causa hipercalemia e a IA central não?", a: "Porque a zona glomerulosa (aldosterona) é destruída na primária; na central o sistema renina-angiotensina está intacto e mantém a aldosterona — o ACTH tem efeito mínimo sobre ela." },
      { q: "Por que o paciente com Addison fica com a pele escura?", a: "Sem cortisol não há feedback negativo → ↑ CRH e ↑ POMC → ↑ ACTH e α-MSH, que ativam o MC1R dos melanócitos → ↑ melanina." },
      { q: "Por que há hiponatremia mesmo na IA central, sem falta de aldosterona?", a: "Falta de cortisol aumenta a secreção de ADH (vasopressina) → retenção de água livre (hiponatremia dilucional)." },
      { q: "Por que a hipotensão da crise pode não responder só a volume?", a: "Cortisol é necessário para a resposta vascular às catecolaminas e à angiotensina II (β-adrenérgicos, tônus vascular); sem ele, volume isolado não basta." },
      { q: "Por que pacientes com IA têm taquicardia postural exagerada?", a: "O cortisol é necessário para sintetizar epinefrina na medula; a epinefrina cai e a norepinefrina sobe compensatoriamente." },
      { q: "Qual o primeiro achado laboratorial da adrenalite autoimune e qual o melhor preditor de progressão em portadores de anticorpo?", a: "Renina elevada com aldosterona normal/baixa (glomerulosa cai primeiro). O melhor preditor de progressão para IA franca é o ACTH elevado." },
      { q: "Quanto do córtex precisa ser destruído para haver clínica e qual a consequência para metástases adrenais?", a: "≥ 90%. Por isso metástases são comuns em necropsia, mas IA clínica é rara, salvo lesão bilateral extensa (20–35% das bilaterais têm IA ao menos parcial)." },
      { q: "Por que fármacos inibidores da esteroidogênese (cetoconazol, etomidato) raramente causam IA em pessoas normais?", a: "O bloqueio enzimático é incompleto e o ACTH aumentado vence o bloqueio; só causam IA com dose alta ou reserva reduzida." },
      { q: "Fadiga, anorexia, perda de peso, tontura ao levantar, desejo de sal e escurecimento de gengiva. Hipótese?", a: "Insuficiência adrenal primária (doença de Addison): avidez por sal, hipotensão postural e hiperpigmentação são específicas da primária." },
      { q: "Onde pesquisar hiperpigmentação de Addison além das áreas expostas ao sol?", a: "Áreas de atrito (cotovelos, joelhos, dedos, cintura, ombros), pregas palmares, aréolas, axilas, períneo, umbigo, mucosa oral na linha de oclusão, língua, gengiva, palato, unhas e cicatrizes recentes." },
      { q: "Uma cicatriz antiga (anterior à doença) fica pigmentada no Addison?", a: "Não. Só as cicatrizes formadas com a doença ativa e não tratada; essas não clareiam com o tratamento (melanina presa no tecido fibroso)." },
      { q: "Que achado cutâneo, presente em 10–20% dos casos, sugere a etiologia autoimune?", a: "Vitiligo." },
      { q: "Diabético tipo 1 com hipoglicemias recorrentes e queda da necessidade de insulina. O que investigar?", a: "IA primária associada (SPA-2): perda do efeito gliconeogênico do cortisol e da epinefrina aumenta a sensibilidade à insulina." },
      { q: "Quais elementos definem crise adrenal (critérios Delphi)?", a: "≥ 1 critério A (IA conhecida/uso prévio de corticoide, Na⁺ < 132, hipercalemia) + ≥ 2 critérios B (astenia intensa, alteração de consciência, náuseas/vômitos, febre, PAS ≤ 100 mmHg)." },
      { q: "Por que dor abdominal com febre em paciente com Addison é um sinal perigoso?", a: "Pode ser crise adrenal simulando abdome agudo (22%); uma laparotomia nesse cenário pode ser catastrófica." },
      { q: "Paciente anticoagulado, na 1ª semana de heparina, com choque, dor em flanco, queda de Hb, Na⁺↓ e K⁺↑. Hipótese?", a: "Hemorragia adrenal bilateral (sem tempo para hiperpigmentar); anticoagulação, trombocitopenia por heparina e sepse são os principais fatores." },
      { q: "Febre, petéquias e choque com insuficiência adrenal aguda: qual síndrome?", a: "Waterhouse-Friderichsen (meningococcemia com hemorragia adrenal); petéquias em 50–60%." },
      { q: "Por que iniciar levotiroxina antes do glicocorticoide pode precipitar crise?", a: "O hormônio tireoidiano acelera o metabolismo do cortisol; em quem tem hipocortisolismo não tratado, a reserva não acompanha." },
      { q: "Que achados distinguem IA central da primária ao exame?", a: "Na central: sem hiperpigmentação (ACTH baixo), sem desidratação/hipercalemia, hipotensão menos proeminente, sintomas GI menos comuns; pode haver cefaleia, alteração visual e outros déficits hipofisários." },
      { q: "Qual o primeiro exame na suspeita de IA crônica e em que horário?", a: "Cortisol sérico até 3 h após acordar (6–9 h), com ACTH; se suspeita de primária, renina e aldosterona juntas." },
      { q: "Cortisol matinal ≤ 3 µg/dL com quadro típico: precisa de teste de estímulo?", a: "Não — é consistente com IA em qualquer ensaio (se CBG normal); o teste é necessário se clínica e laboratório forem discordantes." },
      { q: "Por que o corte para excluir IA é 13–14 µg/dL em alguns laboratórios e 18 em outros?", a: "Ensaios monoclonais e LC-MS/MS não têm reação cruzada com outros esteroides e leem 25–30% menos; 18 µg/dL vale para os imunoensaios policlonais antigos." },
      { q: "Como fazer e interpretar o teste de estímulo com cosintropina?", a: "250 µg IV/IM; cortisol 0, 30 e 60 min. Pico ≥ 18 µg/dL exclui (qualquer ensaio); < 14 IA provável; 14–18 depende do ensaio e da clínica (DHEAS ajuda). Usar só o valor absoluto do pico." },
      { q: "Por que não usar o incremento de cortisol no teste de cosintropina?", a: "Quem tem cortisol basal alto (ritmo, estresse) já está perto do teto; ~20% dos saudáveis com basal alto-normal quase não sobem." },
      { q: "Teste de cosintropina normal 2 semanas após cirurgia hipofisária exclui deficiência de ACTH?", a: "Não. A adrenal só atrofia após 4–6 semanas sem ACTH; o teste pode ser falsamente normal. Cobrir estresse e repetir após 4–6 semanas (ITT se não puder esperar)." },
      { q: "Após confirmar deficiência de cortisol, qual exame define primária vs central?", a: "ACTH plasmático matinal: > 2× LSN (até > 4.000 pg/mL) → primária; baixo ou inapropriadamente normal (< 10–30 pg/mL) → central; indeterminado → renina alta com aldosterona baixa indica primária." },
      { q: "Mulher em uso de anticoncepcional oral com cortisol matinal de 15 µg/dL: IA excluída?", a: "Não. Estrogênio oral eleva a CBG e o cortisol total (1,5–2,2×). Só ≤ 3 µg/dL tem valor; usar cortisol salivar ou suspender o ACO por 6–8 semanas e testar." },
      { q: "Qual a sensibilidade e a especificidade do anticorpo anti-21-hidroxilase?", a: "~90% e > 99% para adrenalite autoimune; ausente na IA central e raro nas granulomatosas." },
      { q: "Homem de 19 anos com IAP e anticorpo anti-21-OH negativo, sem sinais neurológicos. Qual exame?", a: "Ácidos graxos de cadeia muito longa (adrenoleucodistrofia ligada ao X) — elevados em 100% dos homens afetados, mesmo sem clínica neurológica." },
      { q: "O que a TC de adrenais mostra na autoimune vs TB/PCM?", a: "Autoimune: adrenais normais ou atróficas. TB/PCM/infiltração/hemorragia: aumentadas; calcificação em ~50% na TB." },
      { q: "Qual achado separa a pigmentação do Addison da hemocromatose?", a: "A hemocromatose não pigmenta mucosas; o Addison pigmenta mucosa oral, gengiva, língua." },
      { q: "Metais pesados (zinco, mercúrio) pigmentam a boca? Como diferenciar?", a: "Pigmentam a margem gengival, mas não a mucosa bucal (que o Addison pigmenta)." },
      { q: "Cortisol baixo, ACTH normal, paciente assintomático. Hipótese?", a: "Deficiência de CBG (congênita, por SERPINA6, ou adquirida na cirrose/síndrome nefrótica)." },
      { q: "Qual alteração eletrolítica só ocorre na IA primária?", a: "Hipercalemia (30–64%), por falta de aldosterona." },
      { q: "Paciente com IAP tem TSH 7 mUI/L. Iniciar levotiroxina?", a: "Não antes de repor glicocorticoide: TSH e prolactina levemente elevados são comuns na IAP e regridem com o cortisol; tireoxina antes pode precipitar crise." },
      { q: "Primeira medida na suspeita de crise adrenal?", a: "Acesso venoso, colher exames (cortisol, ACTH, eletrólitos, glicose) e, sem esperar resultados, hidrocortisona 100 mg IV + SF 0,9% ≥ 1 L na 1ª hora." },
      { q: "Esquema de hidrocortisona nas primeiras 48 h da crise?", a: "100 mg IV bolus → 50 mg IV 6/6 h (ou 200 mg/24 h em infusão) → no 2º dia 50 mg 12/12 h → desmame em 1–3 dias." },
      { q: "Precisa de fludrocortisona na crise se estiver usando hidrocortisona?", a: "Não: HC ≥ 40 mg/dia tem efeito mineralocorticoide ≈ 0,1 mg de fludrocortisona; além disso a fludrocortisona leva dias para agir. Retomar quando HC < 40 mg/dia." },
      { q: "Sem hidrocortisona, qual alternativa e o que acrescentar na IAP?", a: "Metilprednisolona 40 mg/dia IV ou dexametasona 4–6 mg IV; acrescentar fludrocortisona 0,2 mg VO (e SF), pois têm pouca ou nenhuma ação mineralocorticoide." },
      { q: "Por que evitar soro hipotônico na crise?", a: "Piora a hiponatremia." },
      { q: "Hipotensão e hipercalemia persistem após 6 h de HC e volume. O que pensar?", a: "Desencadeante não controlado ou outra causa de choque/hipercalemia — a crise adrenal responde em poucas horas." },
      { q: "Dose de manutenção de hidrocortisona e como distribuí-la?", a: "15–25 mg/dia em 2–3 tomadas, maior dose ao acordar e última 4–6 h antes de deitar (ex.: 10–5–2,5 mg às 7, 12 e 16 h)." },
      { q: "No Brasil, qual glicocorticoide é mais usado na reposição e por quê?", a: "Prednisona/prednisolona (ex.: 5 mg pela manhã), porque a HC oral só existe manipulada." },
      { q: "Por que evitar dexametasona na reposição crônica?", a: "Ação longa e variável entre pacientes, difícil titular → maior risco de Cushing exógeno; e não tem ação mineralocorticoide." },
      { q: "Dose inicial de fludrocortisona e como ajustar?", a: "0,05 mg/dia se em HC; 0,1 mg/dia se em prednis(ol)ona/dexa; ajustar em 0,05 mg pela PA (inclusive postural), K⁺, sal e APR (meta: limite superior da referência)." },
      { q: "Paciente com Addison em fludrocortisona desenvolve HAS. Quais anti-hipertensivos usar e evitar?", a: "Primeiro excluir excesso de reposição e reduzir a fludrocortisona (sem suspender). Usar IECA/BRA (1ª linha) ou BCC di-hidropiridínico; evitar diuréticos; espironolactona e eplerenona contraindicadas." },
      { q: "Edema e HAS em paciente com Addison: excesso de quê?", a: "Com hipocalemia/APR baixa → fludrocortisona; com ganho de peso, apetite e insônia → glicocorticoide (ACTH matinal suprimido reforça)." },
      { q: "Como se monitora a dose do glicocorticoide?", a: "Clinicamente (peso, PA, energia, apetite, sintomas de falta ou excesso); ACTH não guia a dose na IAP, pois fica alto mesmo com reposição adequada." },
      { q: "Quem deve receber DHEA e com qual dose?", a: "Mulheres com humor, libido ou energia ruins apesar de reposição otimizada: 25–50 mg/dia por até 6 meses; suspender se sem benefício. Não em homens.." },
      { q: "Paciente com Addison por TB inicia rifampicina. O que ajustar?", a: "Aumentar o glicocorticoide: a rifampicina induz o CYP3A4 e acelera o metabolismo do cortisol." },
      { q: "Paciente com IA e gripe com febre de 39,5 °C. Conduta domiciliar?", a: "Dobrar a triplicar a dose do glicocorticoide por ~3 dias (regra 3×3; triplicar com febre alta); fludrocortisona sem mudança; se vômitos, HC 100 mg IM/SC e urgência." },
      { q: "Dose de HC para cirurgia de grande porte?", a: "100 mg IV antes; 150–200 mg/dia (50 mg 6–8/8 h) por 2–3 dias; reduzir rapidamente ao basal a partir do 3º–4º PO se sem complicações." },
      { q: "Gestante com Addison no 3º trimestre: o que muda?", a: "Aumentar HC em 20–40% (2,5–10 mg/dia) a partir de 20–24 semanas; preferir HC (inativada pela placenta); no parto, dose de cirurgia grande." },
      { q: "Quais itens de segurança todo paciente deve ter?", a: "Bracelete/cartão de identificação, kit de HC 100 mg injetável com seringa (e diluente) e regras do dia doente por escrito — ensinados também a um familiar." },
      { q: "Qual o excesso de mortalidade na IA tratada e a que se atribui?", a: "≈ 2× a população geral, por causas CV, infecciosas e neoplásicas — atribuídas a doses suprafisiológicas, perfil diurno inadequado e resgate insuficiente." },
      { q: "O que rastrear anualmente na doença de Addison autoimune?", a: "DM1, tireoidopatia, falência ovariana precoce, doença celíaca e gastrite autoimune/deficiência de B12." },
      { q: "Mulher, 34 a, Hashimoto, emagreceu 8 kg em 6 meses, \"gastrite\" com náuseas, PA 92/60 deitada e 78/50 em pé, gengivas escuras. Na⁺ 128, K⁺ 5,9. Foi tratada com IBP e antidepressivo. Próximo passo?", a: "Cortisol matinal + ACTH + renina/aldosterona (hipótese: Addison autoimune, SPA-2). O erro comum é atribuir sintomas GI/humor a gastrite e depressão; hipercalemia e pigmentação mucosa não se explicam por elas." },
      { q: "Homem, 45 a, lavrador do interior de SP, tosse crônica, emagrecimento e pele escura. TC: adrenais aumentadas bilateralmente. Cortisol 2 µg/dL, ACTH 650 pg/mL. Etiologia mais provável e como confirmar?", a: "Paracoccidioidomicose adrenal (ou TB). Erro comum: atribuir tudo à doença pulmonar. Biópsia adrenal guiada por TC identifica o agente; tratar com reposição + antifúngico." },
      { q: "Mulher, 60 a, em PO de artroplastia com heparina há 5 dias, evolui com hipotensão, dor lombar, Hb de 11 para 8, Na⁺ 129, K⁺ 5,8. Sem hiperpigmentação. Conduta?", a: "Suspeitar hemorragia adrenal bilateral; colher cortisol/ACTH e dar HC 100 mg IV + SF imediatamente; TC de adrenais depois. Erro comum: a ausência de pigmentação (não deu tempo) e a dor atribuída à cirurgia." },
      { q: "Homem, 28 a, asma em uso irregular de prednisona há 1 ano, parou por conta própria há 10 dias; fraqueza, náuseas, hipotensão, Na⁺ 131, K⁺ 4,2, sem pigmentação. Nível do defeito?", a: "IA central por supressão do eixo (corticoide exógeno). K⁺ normal e pele não pigmentada afastam primária; renina/aldosterona preservadas." },
      { q: "Paciente com Addison conhecido, vômitos há 12 h por gastroenterite, não consegue reter o comprimido. Família ligou para orientação. O que fazer?", a: "Aplicar HC 100 mg IM ou SC (todo o frasco) e ir à urgência imediatamente (regra 2 do dia doente). Erro comum: \"é só uma virose\"." },
      { q: "Mulher, 26 a, em anticoncepcional oral, fadiga e perda de peso; cortisol 8h = 16 µg/dL (imunoensaio policlonal). O médico excluiu IA. Está certo?", a: "Não necessariamente: o estrogênio oral eleva a CBG e o cortisol total. Usar cortisol salivar ou suspender o ACO por 6–8 semanas e fazer o teste de cosintropina." }
    ]
  },
  {
    id: "sjs-net",
    name: "Síndrome de Stevens-Johnson e NET",
    cards: [
      { q: "Como se separam SJS, sobreposição e NET?", a: "Pela SC destacada: SJS <10%; sobreposição 10–30%; NET >30%. Eritema sem destacamento não entra na conta." },
      { q: "Cite as três comorbidades que mais aumentam o risco de SJS/NET.", a: "HIV (risco 12×), doença do tecido conectivo (2×, possivelmente superestimado pelo lúpus tipo NET) e câncer/radioterapia (risco 30–60×)." },
      { q: "Qual alelo deve ser pesquisado antes da carbamazepina e em quem?", a: "HLA-B*1502, em pessoas de ascendência asiática. É a única triagem formal recomendada e reduz os casos de SJS/NET. A ausência do alelo não elimina o risco." },
      { q: "Alopurinol: que alelo e que outros dois fatores aumentam o risco?", a: "HLA-B*5801; dose maior e disfunção renal." },
      { q: "Liste os fármacos de associação forte com SJS/NET.", a: "Alopurinol, lamotrigina, sulfametoxazol, carbamazepina, fenitoína, nevirapina, sulfassalazina e outras sulfonamidas, oxicams, fenobarbital, etoricoxibe." },
      { q: "Que proporção dos casos não tem fármaco identificado e qual o agente infeccioso mais citado?", a: "≥15%; Mycoplasma aparece em ≈30% desses. Em crianças, até 50% não têm fármaco-gatilho." },
      { q: "Qual é o mediador mais importante da morte do queratinócito na SJS/NET e de onde ele vem?", a: "Granulisina, proteína citolítica liberada por linfócitos T CD8+ citotóxicos e células NK específicos para o fármaco. A morte é sobretudo por apoptose (com contribuição de necroptose)." },
      { q: "Por que a necrólise epidérmica explica hipotermia, hipovolemia e sepse?", a: "A necrose é de espessura total: a derme fica exposta, há perda de água e calor e a barreira contra bactérias some — a “falência cutânea” se comporta como um grande queimado." },
      { q: "Explique o modelo de interação farmacológica (p-i).", a: "O fármaco liga-se direta e não covalentemente ao HLA ou ao TCR, sem processamento — exemplo: HLA-B*1502 e carbamazepina." },
      { q: "Adulto com febre há 2 dias, máculas vinhosas confluentes no tronco que doem mais do que parecem, alvos atípicos e erosões em lábios e conjuntiva. Hipótese?", a: "SJS/NET. A pista é a combinação dor cutânea + mucosite em ≥2 sítios + alvos atípicos (2 anéis) — não o exantema em si." },
      { q: "Como se pesquisa o sinal de Nikolsky e o que significa?", a: "Pressão lateral suave sobre a pele aparentemente íntegra perto da lesão; se a epiderme se destaca, é positivo e indica clivagem dermo-epidérmica." },
      { q: "Quanto dura a fase aguda progressiva e em quanto tempo a pele reepiteliza?", a: "Progressão de 7–9 dias desde os sintomas (o manejo cita 5–7 dias de piora, ≈8 até o destacamento máximo); reepitelização em 7–21 dias." },
      { q: "Que sinais de sepse você deve procurar no paciente com NET — e quais NÃO ajudam?", a: "Hipotermia, confusão, hipotensão e queda da diurese (e procalcitonina ≥1 mcg/L). Febre, leucocitose, VHS e PCR não são úteis, porque a própria doença já inflama." },
      { q: "Gradue o acometimento ocular agudo.", a: "0 nenhum; 1 hiperemia conjuntival; 2 defeito epitelial OU pseudomembrana; 3 defeito epitelial E pseudomembrana." },
      { q: "Um paciente tem SJS com 5% de SC. Pode-se adiar o exame oftalmológico?", a: "Não. A gravidade ocular aguda não acompanha a SC nem o SCORTEN e é o maior preditor de sequela crônica: exame diário em todos." },
      { q: "Qual janela temporal sugere que um fármaco é o culpado?", a: "Início 5–28 dias antes da reação (até ≈8 semanas). Fármaco iniciado no dia da reação ou depois é excluído no ALDEN (−3)." },
      { q: "O que é o viés protopático no contexto de SJS/NET?", a: "Culpar o remédio dado para tratar o pródromo (antigripal, antibiótico), quando o paciente já estava adoecendo — e manter o verdadeiro culpado." },
      { q: "Quais as faixas de interpretação do ALDEN?", a: "<0 muito improvável; 0–1 improvável; 2–3 possível; 4–5 provável; ≥6 muito provável (escala de −12 a 10)." },
      { q: "O que a biópsia de pele mostra e qual seu papel?", a: "Necrose epidérmica de espessura total com clivagem dermo-epidérmica, infiltrado discreto e IFD negativa. Apoia o diagnóstico e exclui imitadores, mas não é diagnóstica sozinha." },
      { q: "Quais exames todo paciente com suspeita deve fazer?", a: "Hemograma, coagulograma, perfil metabólico (incluindo glicose, ureia, bicarbonato, função hepática), VHS/PCR, radiografia de tórax e culturas seriadas; biópsia com IFD; Mycoplasma em crianças ou sem fármaco claro." },
      { q: "Qual achado separa eritema multiforme de SJS?", a: "Eritema multiforme: alvos típicos de 3 anéis, distribuição acral, sem descolamento em lençol. SJS: alvos atípicos planos em tronco/face, eritema vinhoso e bolhas flácidas." },
      { q: "Qual achado separa DRESS de SJS/NET?", a: "DRESS: edema facial, linfadenopatia, eosinofilia/linfócitos atípicos e órgãos internos, latência de 2–6 semanas, mucosa pouco acometida e NUNCA descolamento em lençol." },
      { q: "Pustulose exantemática generalizada aguda: qual a lesão e o fármaco típico?", a: "Pústulas puntiformes não foliculares sobre eritema (flexuras), em 1–11 dias, geralmente após beta-lactâmico; neutrofilia; sem mucosite nem Nikolsky." },
      { q: "Erupção fixa bolhosa generalizada: o que a distingue?", a: "Placas bem delimitadas vinhosas/marrons com pele íntegra entre elas, início em 1–5 dias (muitas vezes <24 h), olho nunca acometido e mucosa leve." },
      { q: "Criança de 9 anos com tosse há uma semana, erosões intensas em lábios, boca e conjuntiva e pouquíssimas lesões de pele; nenhuma medicação além de paracetamol. Hipótese mais provável?", a: "Mucosite induzida por infecção (RIME), provavelmente por Mycoplasma pneumoniae. O erro comum é o paracetamol: sem fármaco de alto risco e com pele limitada, pedir PCR/sorologia (início e 3 semanas)." },
      { q: "Mulher com lúpus em surto, lesões fotodistribuídas que evoluem há semanas para descolamento extenso, sem mucosite genital ou ocular. O que considerar e como confirmar?", a: "Lúpus cutâneo agudo tipo NET. Curso protraído, fotodistribuição e ausência de mucosite pesam contra NET; histologia (interface vacuolar, infiltrado periadnexal, mucina) decide." },
      { q: "Quais as três primeiras decisões na suspeita de SJS/NET?", a: "1) Avaliação hospitalar imediata; 2) identificar e suspender o fármaco culpado; 3) estimar SC e SCORTEN e transferir se indicado." },
      { q: "Por que retirar o fármaco culpado o mais cedo possível?", a: "Cada dia de antecedência na retirada reduz o risco de morte nos fármacos de meia-vida curta. Com meia-vida longa, o risco continua maior, porque o fármaco persiste no organismo." },
      { q: "Quando transferir para centro especializado?", a: "SC destacada ≥10%, doença rapidamente progressiva ou piora bioquímica/orgânica. Transferir tarde (>5 dias após o destacamento) aumenta mortalidade, bacteremia e necessidade de UTI." },
      { q: "Quais os 7 itens do SCORTEN?", a: "Idade ≥40; neoplasia; SC destacada ≥10%; FC ≥120; ureia >10 mmol/L; glicose >14 mmol/L; bicarbonato <20 mmol/L. Validado nos dias 1 e 3." },
      { q: "Qual a principal limitação do SCORTEN hoje?", a: "Pode superestimar a mortalidade em centros especializados." },
      { q: "O que o Re-SCORTEN acrescenta?", a: "+2 pontos se RDW/hemoglobina ≥1,2; melhora a predição do SCORTEN." },
      { q: "Calcule a reposição inicial para adulto de 80 kg com 30% de SC destacada.", a: "2 mL × 80 × 30 = 4.800 mL nas primeiras 24 h; depois titular para diurese de 0,5–1 mL/kg/h (40–80 mL/h). Volume ≈1/3 menor que o de queimados." },
      { q: "Qual a temperatura do quarto e por quê?", a: "28–32 °C, para evitar hipotermia e gasto calórico excessivo pela pele desnuda." },
      { q: "Meta calórica nas fases catabólica e anabólica?", a: "20–25 kcal/kg/dia na fase aguda; 25–30 kcal/kg/dia na recuperação. Sonda nasogástrica precoce se a boca impedir dieta." },
      { q: "O que é a abordagem “antishear”?", a: "Deixar a epiderme destacada como curativo biológico, limpar suavemente, drenar bolhas sem retirar o teto e usar curativos não aderentes. Resultados semelhantes ao desbridamento." },
      { q: "Qual a meta de dor e a escolha analgésica?", a: "Meta <2 na escala 0–10, reavaliada a cada 4 h. Dor <4: paracetamol/ibuprofeno; ≥4: opioide (IV na dor intensa), com doses extras antes de curativos." },
      { q: "Antibiótico profilático sistêmico na NET?", a: "Não. Prevenção com manuseio estéril, antissepsia e culturas a cada ≈48 h; antibiótico dirigido por cultura ao primeiro sinal de infecção." },
      { q: "Por que evitar sulfadiazina de prata em alguns pacientes com NET?", a: "Se o culpado suspeito for uma sulfonamida, seria reexposição. Nitrato de prata e gaze nanocristalina com prata são seguros." },
      { q: "Paciente com NET evolui com hipoxemia. Pode usar ventilação não invasiva?", a: "Não: é contraindicada pelas lesões cutâneas e pelo risco de obstrução laríngea. Encaminhar à UTI; a intubação pode ser difícil." },
      { q: "Quais medidas previnem sequelas vulvovaginais na fase aguda?", a: "Curativos não aderentes, corticoide tópico de potência média (potente intravaginal se acometimento vaginal), estrogênio tópico, dilatadores de silicone, supressão menstrual e sonda vesical." },
      { q: "Quando considerar transplante de membrana amniótica?", a: "Acometimento ocular graus 2 e 3 (pseudomembrana/defeito epitelial): melhora a acuidade visual e previne simbléfaro e opacidade." },
      { q: "Dose de lidocaína viscosa 2% no adulto?", a: "15 mL por dose, intervalo ≥3 h, máximo 8 doses em 24 h (≤4,5 mg/kg, ≤300 mg por dose)." },
      { q: "Qual a terapia adjunta sugerida, em que dose e janela?", a: "Ciclosporina 3–5 mg/kg/dia VO, nas primeiras 24–48 h dos sintomas, preferida às demais." },
      { q: "Por que a ciclosporina precisa ser iniciada cedo?", a: "Ela inibe a ativação T e a liberação de citocinas — a montante da granulisina. Depois da fase de progressão (≈8 dias), os queratinócitos já morreram e não há o que bloquear." },
      { q: "Alternativa quando a ciclosporina é contraindicada?", a: "Etanercepte (anti-TNF), dose única de 50 mg SC." },
      { q: "Qual a conduta sobre IVIG e corticoide sistêmico?", a: "IVIG isolada: não usar. Corticoide de rotina: não recomendado. IVIG + corticoide: sem papel definido." },
      { q: "Que fármaco é contraindicado na SJS/NET?", a: "Talidomida: aumenta a mortalidade." },
      { q: "Homem de 68 anos, NET 40%, 3º dia de sintomas, insuficiência renal crônica avançada. Residente propõe IVIG 2 g/kg “porque bloqueia a apoptose”. Qual sua resposta?", a: "IVIG isolada não é recomendada e tem risco renal/trombótico maior em idosos com doença renal. Priorizar suporte em centro especializado; adjuvante sugerido é ciclosporina (avaliar contraindicações) ou etanercepte." },
      { q: "Qual a mortalidade aproximada do espectro e por categoria?", a: "≈25% no geral; ≈10% no SJS e >30% na NET." },
      { q: "O que determina a mortalidade antes e depois de 90 dias?", a: "Até 90 dias, a extensão cutânea; depois, idade e comorbidades." },
      { q: "Paciente com SJS por sulfametoxazol pergunta se pode usar hidroclorotiazida e glibenclamida.", a: "Pode: diuréticos tiazídicos e sulfonilureias são sulfonamidas não anti-infecciosas, de risco provavelmente muito baixo. Evitar outras sulfonamidas anti-infecciosas (sulfadiazina, sulfapiridina)." },
      { q: "SJS por carbamazepina: que orientações dar ao paciente e à família?", a: "Evitar outros anticonvulsivantes aromáticos (fenitoína, fenobarbital) — paciente e familiares (associação HLA). Não aromáticos (valproato, gabapentina, benzodiazepínicos) têm risco provavelmente muito baixo." },
      { q: "Quais as sequelas mais frequentes e qual “não avisa”?", a: "Pele em até 80%, unhas até 70%, olhos em 50–90% dos que tiveram doença ocular aguda. A ocular pode surgir meses depois; a pulmonar (DLCO reduzida) pode existir sem dispneia." },
      { q: "Que sequelas psicológicas são relatadas?", a: "TEPT em 20% aos 6 meses; depressão/ansiedade em 30–50%; medo ou evitação de medicamentos em 68–75%; parte não consegue voltar a trabalhar." },
      { q: "Que medidas práticas garantem que o paciente não seja reexposto?", a: "Pulseira/colar de informação médica, atualização do prontuário eletrônico e cartões de alergia, aprender todos os nomes do culpado e dos relacionados e saber dizer “tive SJS/NET”." }
    ]

  {
    id: "oca-iamcsst",
    name: "OCA e IAM com Supra de ST",
    cards: [
      { q: "Por que dizer que OCA é \"um estado da artéria\" e não um padrão de ECG?", a: "Porque a OCA é a oclusão aguda ou suboclusão da artéria culpada com circulação colateral insuficiente, causando infarto transmural; o ECG é só uma forma (imperfeita) de enxergá-la. Pode haver OCA sem supraST." },
      { q: "Como a OCA é definida na angiografia?", a: "Fluxo TIMI 0–2 na artéria culpada, ou TIMI 3 com elevação significativa de biomarcadores (o vaso esteve ocluído e causou infarto)." },
      { q: "O supraST é sensível para detectar oclusão coronariana aguda?", a: "Não: mais da metade das OCA não tem supraST. Os critérios de OCA detectam bem mais oclusões que o supraST, com especificidade semelhante." },
      { q: "O que significam OCA e NOCA na nomenclatura brasileira?", a: "OCA = oclusão coronariana aguda (equivalente a OMI); NOCA = ausência de oclusão coronariana aguda (equivalente a NOMI)." },
      { q: "Quais são os dois mecanismos de instabilização da placa?", a: "Rotura da capa fibrótica (núcleo lipídico exposto → trombo vermelho) e erosão da placa (descamação da íntima expõe a camada média → trombo que cresce)." },
      { q: "Por que a oclusão incompleta deve ser tratada como lesão de alto risco?", a: "Gera hipofluxo prolongado e injúria miocárdica; no agudo se manifesta como angina instável com alto risco de evoluir para oclusão completa." },
      { q: "Por que o AAS é a primeira medida no IAM?", a: "Bloqueia a COX, inibindo tromboxano A2 (vasoconstritor e pró-agregante): reduz formação e crescimento do trombo plaquetário que ocluiu a artéria." },
      { q: "Por que o infarto inferior pode cursar com bradicardia e hipotensão?", a: "Reflexo de Bezold-Jarisch (QRS estreito, transitória, costuma responder à atropina). No infarto anterior a bradicardia vem de lesão das perfurantes septais (QRS largo, instável)." },
      { q: "Quando surge a onda Q e ela contraindica reperfusão?", a: "Surge em 1–12 h se a oclusão persiste; NÃO contraindica cateterismo/trombólise: ocorre também em miocárdio recuperável (até 50% dos IAM anteriores na 1ª hora, por isquemia do sistema de condução)." },
      { q: "Quais três achados da dor mais aumentam a probabilidade de SCA e com que razão de verossimilhança?", a: "Irradiação para ambos os braços (RV+ 2,6), dor semelhante à isquemia prévia (2,2) e mudança do padrão da dor nas últimas 24 h (2,0)." },
      { q: "A melhora com nitroglicerina ou antiácido ajuda a decidir?", a: "Não. A resposta à nitroglicerina tem RV próxima de 1,0; antiácido melhora até 25% dos IAM." },
      { q: "Em quem a apresentação atípica é mais frequente e quanto?", a: "Mulheres, diabéticos e idosos: até 33% das SCA sem dor típica (até 40% das mulheres; até 75% dos > 75 anos)." },
      { q: "Que descrição de dor reduz a probabilidade de IAM?", a: "Dor \"em facada\"; também dor totalmente reprodutível à palpação, pleurítica ou posicional." },
      { q: "Classes de Killip e mortalidade aproximada.", a: "I sem IC (~6%); II IC com estertores em até metade dos campos/S3 (17%); III edema agudo (~38%); IV choque cardiogênico (~81%)." },
      { q: "Hipotensão com estase jugular e campos limpos num IAM inferior: o que pensar?", a: "Infarto de ventrículo direito (também hipovolemia ou fármacos); pedir V3R–V4R e evitar nitrato." },
      { q: "Pulsos assimétricos num paciente com supraST: qual o risco?", a: "Dissecção aórtica: confirmar por imagem antes de fibrinolítico (suspeita de dissecção é contraindicação absoluta)." },
      { q: "Em quanto tempo fazer o ECG e como repetir?", a: "Em até 10 minutos da admissão; se a suspeita é alta e o ECG não é diagnóstico, repetir a cada 15 min." },
      { q: "Que derivações adicionais pedir e por quê?", a: "V7–V9 (parede posterior/lateral) e V3R–V4R (VD): aumentam a sensibilidade para oclusão de Cx e CD; ECG de 16 derivações no infarto inferior." },
      { q: "Critério de supraST do IAMCSST (4ª definição universal).", a: "≥ 1 mm em duas derivações contíguas; V2–V3: ≥ 2,5 mm em homens < 40 anos, ≥ 2 mm em homens ≥ 40, ≥ 1,5 mm em mulheres; V3R, V4R, V7, V8 ≥ 0,5 mm." },
      { q: "Qual a sensibilidade/especificidade do supraST em V3R/V4R para infarto de VD?", a: "Sensibilidade 100% e especificidade 87%; é transitório (raramente > 12 h)." },
      { q: "Por que uma troponina inicial normal não exclui OCA?", a: "A troponina sobe 4–6 h após o início da necrose; ~14% das OCA têm troponina inicial < p99. Com supraST, não aguardar o resultado para reperfundir." },
      { q: "CK-MB: cinética.", a: "Sobe em 4–6 h, pico em ~18 h, normaliza em 48–72 h; menos específica que a troponina." },
      { q: "Imagem espelho: qual a pista mais precoce no IAM inferior?", a: "Inversão da onda T em aVL, antes do supraST em DII, DIII e aVF." },
      { q: "Isso descarta OCA anterior: ausência de espelho inferior?", a: "Não: 40–60% das OCA anteriores não têm espelho inferior." },
      { q: "Como reconhecer onda T hiperaguda?", a: "T desproporcionalmente grande para o QRS (maior área, razão T/QRS e QTc), simétrica e de base larga; ou sinal do checkmark (retificação do ST)." },
      { q: "Quais os critérios do padrão de de Winter?", a: "T altas, proeminentes e simétricas nas precordiais; infraST ascendente ≥ 1 mm no ponto J; ausência de supraST precordial; supraST 0,5–1 mm em aVR. Indica oclusão da DA (~2%)." },
      { q: "Achados do infarto posterior sem supra.", a: "InfraST V1–V4, T positiva proeminente, R ampla em V1–V2 (R/S > 1), supraST > 0,5 mm em V7–V8. É o espelho do infarto septal/lateral." },
      { q: "Distorção terminal do QRS: definição e valor.", a: "Ausência da onda S ou da onda J terminal em V2 ou V3; muito específica para OCA (frequente na OCA anterior)." },
      { q: "Padrão de Aslanger.", a: "Supra isolado em DIII, infraST em V4–V6 com T positiva e ST em V1 maior que em V2; sugere OCA com doença triarterial." },
      { q: "Qual artéria ocluída no sinal da bandeira da África do Sul?", a: "Primeiro ramo diagonal (Dg1): supraST em DI, aVL e V2, com infraST em DIII/inferiores." },
      { q: "Quando o BRE sugere oclusão? Qual o critério?", a: "BRE novo isolado não é confiável; usar Sgarbossa modificado (supra ≥ 1 mm concordante; infra ≥ 1 mm em V1–V3; ST/S > 0,25): sens. 91%, esp. 90%. Barcelona: 93% e 94%." },
      { q: "Qual o risco do BRD durante IAM?", a: "Mais IC, choque cardiogênico (84%) e mortalidade hospitalar (18%); até 67% com oclusão total não têm critérios de supra." },
      { q: "Qual achado separa OCA anterior de aneurisma de VE?", a: "Relação T/QRS > 0,36 sugere OCA; aneurisma = supra persistente ≥ 2 semanas com onda Q." },
      { q: "Qual achado separa pericardite do IAM?", a: "Supra difuso com infraPR e recíproco em aVR; sinal de Spodick (TP descendente > 1 mm em ≥ 2 derivações; ~30% das pericardites e ~5% dos IAMCSST). Atenção: DA tipo IV pode simular pericardite." },
      { q: "Quando a repolarização precoce é improvável?", a: "Acima de 50 anos; padrão: supra difuso com infra recíproco em aVR e notch no ponto J (inferior)." },
      { q: "Que exame NÃO deve atrasar a reperfusão e quando se justifica imagem antes do fibrinolítico?", a: "Nenhum exame de imagem deve atrasar; justifica-se (RX, eco, TC ou RM) se há suspeita de dissecção aórtica. Obs.: IAMCSST por dissecção é raro (0,51%)." },
      { q: "Mnemônico dos \"4 As\".", a: "AAS, inibidor P2Y12 (antagonista do ADP), Anticoagulação, Abrir a artéria (reperfusão)." },
      { q: "Metas de tempo de reperfusão.", a: "ICP em até 90 min (até 120 min se transferência); trombólise em até 30 min da entrada." },
      { q: "ICP ou fibrinólise? Quando a ICP é claramente preferível?", a: "Apresentação tardia (> 3 h), IAM de alto risco (Killip ≥ 3), dúvida diagnóstica, pós-cirurgia de grande porte, choque cardiogênico, contraindicação à fibrinólise, centro com experiência e porta-balão < 90 min." },
      { q: "Quando a fibrinólise é tão boa quanto a ICP?", a: "Se reperfundir em ≤ 3 h de evolução. Benefício desaparece após 12 h." },
      { q: "Como saber se a fibrinólise funcionou e o que fazer depois?", a: "Melhora da dor, queda do supraST e arritmia de reperfusão (RIVA). Reperfundiu → ICP programada em até 24 h; não → ICP de resgate (até 2 h)." },
      { q: "Choque cardiogênico: qual reperfusão?", a: "Angioplastia primária (mortalidade ~80% no choque); trombólise é pouco eficaz (baixa pressão de perfusão). Tratar só a lesão culpada." },
      { q: "Primeira conduta de bradicardia no infarto inferior vs. anterior?", a: "Inferior: reflexo vagal, QRS estreito, responde à atropina. Anterior: lesão septal, QRS largo, pode exigir marca-passo." },
      { q: "Sopro novo, instabilidade e edema agudo 3–5 dias após IAM: próximo passo?", a: "Suspeitar de CIV ou ruptura de papilar; ecocardiograma e acionar o cirurgião cardíaco imediatamente (suporte com vasodilatador/BIA)." },
      { q: "Tamponamento por ruptura de parede livre: tratamento?", a: "Cirurgia; pericardiocentese de emergência (punção de Marfan) apenas em colapso iminente. Tríade de Beck: hipotensão, abafamento de bulhas, estase jugular." },
      { q: "CIV pós-IAM: por que operar logo, mesmo com mortalidade cirúrgica alta?", a: "Cirurgia 40–50% de mortalidade em 30 dias vs. ~80% no tratamento clínico; o defeito progride e há risco de colapso." },
      { q: "Dose de AAS na SCA.", a: "Ataque 300 mg e manutenção 100 mg/dia; manutenção 81–125 mg/dia após a alta. Contraindicado se alergia, sangramento ativo ou suspeita de dissecção." },
      { q: "Clopidogrel: doses e quando NÃO dar ataque.", a: "Com trombolítico: 300 mg (sem ataque em > 75 anos); ICP: 600 mg + 150 mg/dia na 1ª semana; manutenção 75 mg/dia." },
      { q: "Ticagrelor: dose e contraindicações.", a: "180 mg + 90 mg a cada 12 h; contra: alergia, hepatopatia moderada/grave, sangramento ativo, anticoagulante oral, hemorragia intracraniana prévia. Pode ser dado no PS antes do cateterismo." },
      { q: "Quando o prasugrel é contraindicado?", a: "AVC/AIT prévio, idade ≥ 75, peso < 60 kg, sangramento ativo, hepatopatia grave; só em ICP com anatomia conhecida, não no pronto-socorro." },
      { q: "Dose de enoxaparina com trombólise.", a: "30 mg IV em bolo + 1 mg/kg SC 12/12 h; ≥ 75 anos: sem bolo e 0,75 mg/kg 12/12 h. Dura 3–5 dias ou até 8 dias/alta." },
      { q: "Dose de HNF e alvo de TTPa.", a: "60 U/kg em bolo (máx. 4.000 U), depois 12 U/kg/h (máx. 1.000 U/h); TTPa 50–70 s, controle em 4–6 h." },
      { q: "Fondaparinux: quando evitar?", a: "Na ICP (mais trombose de cateter); útil com fibrinólise (2,5 mg IV, depois 2,5 mg SC/dia)." },
      { q: "Doses dos fibrinolíticos.", a: "SK 1,5 milhão U IV em 60 min; alteplase 15 mg bolus + 0,75 mg/kg (máx. 50 mg) em 30 min + 0,5 mg/kg (máx. 35 mg) em 60 min (total ≤ 100 mg); tenecteplase bolus único por peso: < 60 kg 30 mg... ≥ 90 kg 50 mg." },
      { q: "Contraindicações absolutas à fibrinólise.", a: "Sangramento ativo; suspeita de dissecção; neoplasia ou MAV intracraniana; AVC hemorrágico ou isquêmico/AIT < 3 meses; trauma craniano/facial ou cirurgia grande < 3 meses." },
      { q: "Nitrato: quando é proibido?", a: "Infarto de VD, PDE5 em 24–48 h (sildenafila), PAS < 90, FC < 50 ou > 100, estenose aórtica grave; não dar a quem recebe alteplase." },
      { q: "Contraindicações absolutas ao betabloqueador.", a: "FC < 60, BAV 2º/3º grau ou PR > 240 ms, PAS < 90, choque cardiogênico, asma grave/DPOC descompensada. Evitar se > 70 anos, PAS < 120 com FC alta ou IC (aumenta o risco de choque)." },
      { q: "Qual estatina e dose no IAM?", a: "Alta potência para todos: atorvastatina 40–80 mg ou rosuvastatina 20–40 mg; sinvastatina 40 mg é a mais disponível no Brasil. Meta de LDL-c < 50 mg/dL." },
      { q: "Quando prescrever IBP?", a: "Em dupla antiagregação com risco de sangramento (história GI/úlcera, anticoagulante, AINE/corticoide crônico, ou ≥ 2: idade > 65, dispepsia, DRGE, H. pylori, álcool)." },
      { q: "Quais anticoagulantes orais são deletérios na SCA?", a: "Apixabana e dabigatrana (mais sangramento); rivaroxabana em dose baixa reduz eventos, mas aumenta o sangramento maior." },
      { q: "Morfina: por que usar com cautela?", a: "Associada a maior mortalidade; reduz absorção do clopidogrel; mascara dor recorrente. Usar em refratários a nitrato, após decidir revascularização." },
      { q: "Prescrição de alta recomendada (ESC 2023).", a: "AAS 100 mg/dia; clopidogrel 75 mg por ≥ 1 ano; estatina de alta potência; betabloqueador se FE < 40%; IECA se IC, DM, HAS e/ou DRC; antagonista mineralocorticoide se FE < 40% e DM ou IC." },
      { q: "Por quanto tempo manter o betabloqueador?", a: "Indefinidamente se função de VE reduzida; ao menos 3 anos se função normal." },
      { q: "Por quanto tempo associar o segundo antiplaquetário ao AAS?", a: "Pelo menos 1 ano, independentemente da forma de revascularização." },
      { q: "O que prediz pior prognóstico na evolução do supraST?", a: "Supra persistente após 2 semanas (necrose extensa ou aneurisma de VE); mais derivações acometidas; BRD novo; complicações mecânicas (~60% de mortalidade em 30 dias)." },
      { q: "Para onde vai o paciente após a reperfusão?", a: "UTI, pelo risco de eventos adversos nas primeiras 24 h." },
      { q: "Mulher de 62 anos, diabética, com dor epigástrica e sudorese há 90 min. ECG: sem supraST; infraST e T positiva proeminente em V2–V3, R ampla em V2. Qual a hipótese e o próximo passo?", a: "Infarto posterior (oclusão de Cx ou CD): equivalente de OCA. Fazer V7–V9, ECG seriado, acionar reperfusão (cateterismo). Erro comum: \"ECG sem supra = SCA sem supra de baixo risco\"." },
      { q: "Homem de 58 anos, dor em aperto há 2 h; ECG: supra em DII, DIII e aVF, infra em V1–V3, supra em DIII > DII. PA 80/50, pulmões limpos, estase jugular. Que derivações pedir e o que evitar?", a: "Infarto inferior com VD (oclusão proximal de CD): V3R/V4R; evitar nitrato; volume e reperfusão. Erro comum: choque cardiogênico por IC esquerda (pulmões limpos)." },
      { q: "Homem de 55 anos, dor torácica; ECG com T muito ampla e simétrica em V2–V4, infraST ascendente em V2–V6 sem supra, supra de 0,7 mm em aVR. Hipótese e conduta?", a: "Padrão de de Winter = oclusão proximal da DA: tratar como OCA/IAMCSST, reperfusão imediata." },
      { q: "Mulher de 70 anos, BRE antigo, dor típica; Sgarbossa modificado com supraST de 2 mm concordante em V5. Qual a conduta?", a: "Critério positivo de OCA: cateterismo ou trombólise imediatos; BRE isolado não define o infarto, mas supra concordante sim." },
      { q: "Paciente de 65 anos, 4 dias após IAM anterior, desenvolve novo sopro holossistólico alto em borda esternal esquerda baixa, edema agudo e hipotensão. Qual o diagnóstico e o exame?", a: "CIV pós-infarto; ecocardiograma (shunt E→D; \"salto\" de saturação no cateter). Suporte (vasodilatadores, BIA) e cirurgia. Erro comum: ruptura de papilar (sopro mais suave, onda V gigante)." },
      { q: "Homem de 50 anos, dor há 4 h, supraST anterior, PA 190/115 mmHg, sem outras contraindicações; hospital sem hemodinâmica, transferência > 2 h. O que considerar?", a: "Fibrinólise é a opção indicada pela demora, mas PA ≥ 180/110 mmHg é contraindicação: controlar a pressão e pesar risco-benefício; se possível, ICP mesmo com a demora." }
    ]
