  {
    id: "rev-diag",
    name: "Diagnóstico",
    rev: true,
    cards: [
      { t: "Diarreia aguda", q: "Homem, 36 anos, 3 dias de diarreia com sangue e muco, 10 evacuações/dia, febre de 38,8 °C, tenesmo e tontura ao levantar. Qual é a síndrome, quanto ela é grave e o que você pede?", a: "<p class=\"lead\"><strong>Diarreia aguda inflamatória (disenteria) com critérios de gravidade</strong>: febre ≥ 38,5 °C, ≥ 6 evacuações/24 h e hipovolemia.</p><ul><li>Classificar a volemia à beira-leito: ortostase e FC 108 indicam \"alguma desidratação\".</li><li>Exames: coprocultura + painel molecular (confirmar o positivo com cultura), toxina Shiga, leucócitos/lactoferrina fecais, hemograma, creatinina, Na⁺ e K⁺; hemocultura se a febre persistir.</li><li>Armadilha: \"é só viral, dá loperamida\". Febre com sangue e muco não é viral.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Diarreia aguda é definida por quê? Quais critérios de gravidade ou de risco do hospedeiro mandam testar as fezes?", a: "<p class=\"lead\"><strong>≥ 3 evacuações líquidas em 24 h, com duração de até 14 dias.</strong></p><ul><li>Gravidade: febre ≥ 38,5 °C, sinais de hipovolemia, ≥ 6 evacuações/24 h, dor abdominal intensa.</li><li>Hospedeiro de risco: ≥ 70 anos, cardiopatia, imunossupressão, DII, gestação.</li><li>Também testar se: sintomas &gt; 1 semana, diarreia com sangue ou preocupação de saúde pública (manipulador de alimentos, creche).</li><li>Diarreia aquosa sem nenhum desses critérios: nem exame nem antibiótico.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Paciente vomita 2 h depois de comer doce com creme numa festa, e outros convidados têm o mesmo quadro. Sem febre. Qual o agente provável e por que a latência importa?", a: "<p class=\"lead\"><strong>Toxina pré-formada (S. aureus ou B. cereus).</strong></p><ul><li>Latência ≤ 6 h com náusea e vômito iniciais = toxina pré-formada.</li><li>8–16 h = C. perfringens (carnes, molhos).</li><li>&gt; 16 h = vírus ou bactéria (ETEC, STEC etc.).</li><li>O dado que discrimina é o intervalo curto entre a refeição e o início dos sintomas, e não há exame para pedir de rotina.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Paciente com diarreia com sangue visível, sem febre, depois de comer hambúrguer malpassado num surto. Qual hipótese e qual implicação imediata?", a: "<p class=\"lead\"><strong>E. coli produtora de toxina Shiga (STEC/O157:H7).</strong></p><ul><li>Pedir pesquisa de toxina Shiga (a cultura em sorbitol-MacConkey só detecta o O157).</li><li>Hemograma: plaquetopenia sugere SHU.</li><li>Implicação: <strong>não dar antibiótico</strong> até afastar STEC, porque ele não reduz sintomas e se associa a SHU (sobretudo os beta-lactâmicos).</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Fezes com sangue, mas sem leucócitos, em viajante ou HSH, com incubação de 1–3 semanas. Qual o diagnóstico e o que comprova?", a: "<p class=\"lead\"><strong>Amebíase (E. histolytica).</strong> A ameba destrói os leucócitos.</p><ul><li>Comprova: <strong>trofozoíto com hemácias fagocitadas</strong> à microscopia.</li><li>Cisto ou trofozoíto sem hemácias pode ser só colonização assintomática.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Paciente internado há 5 dias começa com diarreia. O residente pede coprocultura. Está certo?", a: "<p class=\"lead\"><strong>Não.</strong> Após ≥ 72 h de internação, a coprocultura de rotina tem pouco valor: <strong>o teste útil é o de C. difficile.</strong></p><ul><li>Antibiótico, internação ou quimioterapia nos últimos 3 meses (e IBP) = perfil de C. difficile.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Diarreia, febre, cefaleia e mialgia em gestante que comeu queijo mole e embutidos. O que não pode passar despercebido?", a: "<p class=\"lead\"><strong>Listeria monocytogenes</strong> (risco ~20× maior na gestação). No viajante, o mesmo quadro levanta febre tifoide.</p><ul><li>Pedir hemocultura; rigidez de nuca sugere neurolisteriose.</li><li>O antibiótico precisa ter atividade contra Listeria.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Como graduar a hipovolemia no adulto com diarreia?", a: "<p class=\"lead\"><strong>Leve (&lt; 5% do peso):</strong> alerta, sede aumentada, turgor normal.</p><ul><li><strong>Moderada (5–10%) = \"alguma desidratação\":</strong> inquieto, olhos fundos, boca seca, bebe avidamente, turgor lento, pulso rápido e fraco.</li><li><strong>Grave (&gt; 10%):</strong> letárgico ou inconsciente, não consegue beber, turgor muito lento, pulso muito fraco ou impalpável, anúria, hipotensão.</li><li>A grave pede hidratação IV imediata.</li></ul>", h: true },
      { t: "Diarreia aguda", q: "Quais complicações se associam a cada agente da diarreia infecciosa?", a: "<ul><li><strong>SHU:</strong> STEC e Shigella (toxina Shiga).</li><li><strong>Guillain-Barré:</strong> Campylobacter jejuni.</li><li><strong>Artrite reativa:</strong> Campylobacter, Salmonella, Shigella flexneri.</li><li><strong>Bacteremia e infecção endovascular:</strong> Salmonella não tifoide (&gt; 50 anos com aterosclerose, HIV).</li><li><strong>Hipovolemia grave:</strong> cólera (\"água de arroz\").</li><li><strong>Megacólon tóxico, convulsões, prolapso retal:</strong> Shigella.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Mulher, 48 anos, 5–6 evacuações aquosas por dia há 2 meses, sem sangue, que cessam no jejum; colecistectomia há 3 meses. Hemograma, TSH, sorologia para celíaca e calprotectina estão normais. Qual o diagnóstico?", a: "<p class=\"lead\"><strong>Diarreia por má absorção de ácidos biliares</strong> (pós-colecistectomia).</p><ul><li>Os sais biliares que chegam ao cólon causam secreção via AMPc.</li><li>Diarreia que cessa em jejum não é secretória clássica: pense em osmótica ou em ácidos biliares.</li><li>A confirmação prática é a resposta à resina (colestiramina); a fonte não informa teste diagnóstico específico.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Defina diarreia crônica e cite os sinais de alarme que obrigam a investigar doença orgânica (endoscopia).", a: "<p class=\"lead\"><strong>Bristol 5–7, &gt; 3 evacuações/dia, por ≥ 4 semanas.</strong></p><ul><li>Alarme: início após os 50 anos, sangramento retal ou melena, diarreia ou dor noturna, dor progressiva, perda de peso, febre, anemia ferropriva, PCR/VHS ou calprotectina elevadas, sangue oculto, parente de 1º grau com DII ou câncer colorretal.</li><li>Qualquer alarme leva à colonoscopia com biópsias. Dor como sintoma principal pede também imagem.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Quais exames de 1ª linha você pede para quase todo paciente com diarreia crônica?", a: "<ul><li><strong>Hemograma, TSH e T4 livre, sorologia para celíaca (antitransglutaminase), sangue oculto.</strong> Eletrólitos só se o quadro for grave ou houver desidratação.</li><li><strong>Calprotectina fecal</strong> (ou lactoferrina): normal torna DII improvável; elevada leva à ileocolonoscopia.</li><li>Giardia (antígeno ou NAAT) e C. difficile conforme o risco.</li><li>Leucócitos fecais não servem (S ~70%, E ~50%).</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Idosa com 4–9 evacuações aquosas por dia, curso intermitente. A colonoscopia é macroscopicamente normal. Qual o diagnóstico e o que o confirma?", a: "<p class=\"lead\"><strong>Colite microscópica.</strong></p><ul><li>Confirmação: <strong>biópsias do cólon inteiro</strong>, direito e esquerdo (a lesão é menos intensa no distal).</li><li>Armadilha: colonoscopia normal não exclui o diagnóstico.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Jovem com dor cólica em quadrante inferior que melhora ao evacuar, fezes pequenas durante a vigília, urgência e muco, piora com estresse. Sem alarme. Qual o diagnóstico e quais os critérios?", a: "<p class=\"lead\"><strong>SII com predomínio de diarreia.</strong></p><ul><li>Critério: dor abdominal recorrente ≥ 3 dias/mês nos últimos 3 meses, associada a mudança na frequência ou na forma das fezes e a melhora com a evacuação.</li><li>É diagnóstico clínico, com exames de exclusão limitados normais (hemograma, celíaca, calprotectina).</li><li>Início tardio, progressão ou persistência apesar do tratamento reabrem a investigação.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Paciente com anemia ferropriva isolada, flatos e distensão, com dermatite herpetiforme. Qual hipótese e como confirmar?", a: "<p class=\"lead\"><strong>Doença celíaca.</strong></p><ul><li>Antitransglutaminase seguida de <strong>endoscopia alta com biópsia duodenal</strong>.</li><li>A anemia ferropriva pode ser a única pista, e a má absorção leve imita SII.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "Como separar os tipos de diarreia crônica pela clínica?", a: "<ul><li><strong>Osmótica:</strong> cessa no jejum; laticínios, adoçantes (sorbitol), laxantes com Mg ou fosfato; gap osmótico fecal elevado (&gt; 75).</li><li><strong>Secretória:</strong> persiste no jejum e à noite (toxinas, ácidos biliares, endocrinopatias, tumores, fármacos).</li><li><strong>Inflamatória:</strong> sangue, febre, calprotectina alta (DII, infecção invasiva, isquemia).</li><li><strong>Gordurosa:</strong> fezes pálidas, volumosas, que flutuam (pâncreas, Crohn, SIBO, Whipple).</li><li>Volume grande sugere delgado; pequeno e frequente sugere cólon.</li></ul>", h: true },
      { t: "Diarreia crônica", q: "No exame físico de um paciente com diarreia crônica, o que sugerem hiperpigmentação com hipotensão postural, rubor com sibilância, e púrpura em pinça com macroglossia?", a: "<ul><li>Hiperpigmentação + hipotensão postural: <strong>insuficiência adrenal (Addison)</strong>.</li><li>Rubor + sopro + sibilância: <strong>síndrome carcinoide</strong> (pedir 5-HIAA urinário).</li><li>Púrpura em pinça + macroglossia: <strong>amiloidose</strong>.</li><li>Outros: dermatite herpetiforme = celíaca; eritema nodoso e pioderma = DII; tremor e retração palpebral = hipertireoidismo.</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Idosa de 72 anos, internada há 6 dias em uso de ciprofloxacino, com 6 evacuações líquidas/dia, leucócitos 18.000/µL e creatinina 1,3 mg/dL, sem hipotensão nem íleo. Qual o diagnóstico e qual a gravidade?", a: "<p class=\"lead\"><strong>Infecção por C. difficile (CDI), episódio GRAVE</strong> (leucócitos &gt; 15.000/µL).</p><ul><li>Não grave: leucócitos ≤ 15.000 e creatinina &lt; 1,5.</li><li>Grave: leucócitos &gt; 15.000 e/ou creatinina ≥ 1,5 (ou aumento ≥ 50%).</li><li>Fulminante: hipotensão ou choque, íleo ou megacólon.</li><li>Precauções de contato desde a suspeita.</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Como se faz o diagnóstico laboratorial da CDI?", a: "<p class=\"lead\"><strong>Teste em duas etapas, só em fezes líquidas (≥ 3 evacuações/24 h sem outra explicação).</strong></p><ul><li>1) Triagem sensível: <strong>NAAT/PCR</strong> (gene da toxina) ou <strong>GDH</strong>.</li><li>2) Confirmação: <strong>EIA de toxina A/B</strong> (toxina livre, produção ativa).</li><li>NAAT+ com toxina− = portador ou CDI com pouca toxina: decidir pela clínica.</li><li>GDH− com toxina+ = erro técnico, repetir.</li><li>Não testar fezes formadas nem assintomáticos, não repetir em 7 dias e não fazer teste de cura.</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "CDI em tratamento: a diarreia para, mas o abdome distende, com febre e leucócitos de 25.000. O que suspeitar e o que pedir?", a: "<p class=\"lead\"><strong>Megacólon tóxico / colite fulminante.</strong></p><ul><li>Radiografia com cólon &gt; 7 cm ou ceco &gt; 12 cm; o ideal é <strong>TC de abdome e pelve</strong>.</li><li>Também pedir lactato (&gt; 2,2 mmol/L é grave), creatinina e albumina.</li><li>Internar e pedir avaliação cirúrgica precoce.</li><li>Colonoscopia completa é contraindicada (risco de perfuração).</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Quais achados de endoscopia e de TC são característicos de CDI?", a: "<ul><li>Endoscopia: <strong>pseudomembranas</strong>, placas elevadas amarelo-esbranquiçadas de até 2 cm.</li><li>TC: <strong>sinal do acordeão</strong> (contraste preso entre haustrações espessadas), espessamento parietal, duplo halo.</li><li>Pseudomembrana não é exclusiva de CDI (uremia, isquemia) e sua ausência não exclui (doença leve, recorrência, DII).</li></ul>", h: true },
      { t: "Clostridioides difficile", q: "Paciente tratou CDI e segue com diarreia na 3ª semana; o NAAT continua positivo. É falha terapêutica?", a: "<p class=\"lead\"><strong>Provavelmente não.</strong></p><ul><li>NAAT e toxina podem seguir positivos por mais de 6 semanas, por isso não se faz teste de cura.</li><li>Diarreia que não melhora com tratamento adequado quase nunca é CDI refratária: procurar outra causa.</li><li>A SII pós-infecciosa ocorre em ~10%.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Mulher, 32 anos, com fadiga progressiva, perda de 8 kg, náuseas, desejo de comer sal e escurecimento de gengivas e cicatrizes. PA 96/60 com queda postural. Na⁺ 128 e K⁺ 5,6. Qual o diagnóstico e o que pedir primeiro?", a: "<p class=\"lead\"><strong>Insuficiência adrenal primária (doença de Addison).</strong></p><ul><li>Hiperpigmentação (↑ ACTH/α-MSH) e hipercalemia (falta de aldosterona) falam a favor da primária.</li><li>1º exame: <strong>cortisol sérico matinal + ACTH plasmático na mesma amostra</strong>, já com <strong>renina e aldosterona</strong>.</li><li>Cortisol ≤ 3 µg/dL com ACTH &gt; 2× o LSN confirma a primária.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Como interpretar o cortisol matinal na suspeita de insuficiência adrenal?", a: "<ul><li><strong>≤ 3 µg/dL:</strong> consistente com IA; se a clínica concorda, dispensa o teste de estímulo.</li><li><strong>Faixa intermediária</strong> (3 a &lt; 18 nos ensaios antigos; 3 a &lt; 13–14 nos monoclonais ou LC-MS/MS): fazer teste da cosintropina.</li><li><strong>≥ 18</strong> (ou ≥ 13–14 nos ensaios novos): IA improvável.</li><li>O ponto de corte depende do ensaio: aplicar 18 a um ensaio novo superdiagnostica IA.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Descreva o teste de estímulo com cosintropina e como lê-lo.", a: "<p class=\"lead\"><strong>Cosintropina 250 µg IV ou IM; dosar cortisol basal, aos 30 e aos 60 min.</strong></p><ul><li>Pico <strong>&lt; 14 µg/dL:</strong> IA provável.</li><li><strong>14 a &lt; 18:</strong> depende do ensaio e da clínica (DHEAS normal torna IA improvável).</li><li><strong>≥ 18:</strong> IA excluída.</li><li>Usar o valor absoluto do pico, nunca o incremento.</li><li>Armadilha: até 4–6 semanas após cirurgia hipofisária ou apoplexia o teste pode vir normal (a adrenal ainda não atrofiou).</li></ul>", h: true },
      { t: "Doença de Addison", q: "Como diferenciar insuficiência adrenal primária da central?", a: "<ul><li><strong>Primária:</strong> ACTH alto, renina alta e aldosterona baixa; hiperpigmentação, <strong>hipercalemia</strong>, avidez por sal, desidratação.</li><li><strong>Central:</strong> ACTH baixo ou inapropriadamente normal; renina e aldosterona normais; sem hiperpigmentação; K⁺ normal (a hiponatremia pode existir); outros déficits hipofisários; uso prévio de corticoide ou opioide.</li><li>Hiponatremia sem hipercalemia não afasta IA: é o padrão da central.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Addison confirmado. Como investigar a etiologia?", a: "<ul><li><strong>Anti-21-hidroxilase:</strong> positivo = adrenalite autoimune (S ~90%, E &gt; 99%); rastrear outras autoimunidades.</li><li>Negativo ou indisponível: <strong>TC de adrenais</strong>. Atróficas sugerem autoimune; aumentadas ou calcificadas sugerem TB, paracoccidioidomicose, metástase ou hemorragia (biópsia guiada por TC).</li><li><strong>Homem jovem com anticorpo negativo:</strong> dosar ácidos graxos de cadeia muito longa (adrenoleucodistrofia).</li><li>Criança: 17-OH-progesterona (HAC).</li></ul>", h: true },
      { t: "Doença de Addison", q: "Paciente com Addison conhecido chega com gastroenterite, vômitos, PA 70/40, confusão, febre e dor abdominal difusa. Na⁺ 126 e K⁺ 6,1. Qual o diagnóstico?", a: "<p class=\"lead\"><strong>Crise adrenal</strong> (insuficiência adrenal aguda).</p><ul><li>Critérios Delphi: ≥ 1 critério A (IA conhecida ou uso de corticoide, Na⁺ &lt; 132, hipercalemia) + ≥ 2 critérios B (fraqueza, alteração de consciência, náusea/vômito, febre, PAS ≤ 100).</li><li>Armadilha: pode simular abdome agudo, e a laparotomia nesse cenário pode ser catastrófica.</li><li>Não atrasar o tratamento por exames: colher cortisol e ACTH na punção e tratar.</li></ul>", h: true },
      { t: "Doença de Addison", q: "Quais situações fazem o cortisol total enganar?", a: "<ul><li><strong>CBG alta</strong> (estrogênio oral, gestação): o cortisol total sobe e mascara a IA. Só ≤ 3 tem valor; usar cortisol salivar ou suspender o anticoncepcional por 6–8 semanas.</li><li><strong>CBG baixa</strong> (cirrose, síndrome nefrótica, sepse): cortisol total baixo sem IA verdadeira.</li><li><strong>Uso de hidrocortisona ou prednisolona:</strong> interferem na dosagem; a dexametasona não interfere.</li><li><strong>TSH levemente alto</strong> na IA primária é reversível: não iniciar levotiroxina antes do corticoide.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Mulher, 45 anos, 2 semanas após iniciar alopurinol. Febre e odinofagia por 2 dias, depois máculas vinhosas confluentes dolorosas em face e tronco, alvos atípicos, bolhas flácidas, Nikolsky positivo e erosões oral e conjuntival. Qual o diagnóstico?", a: "<p class=\"lead\"><strong>SJS/NET induzida por fármaco.</strong></p><ul><li>Pistas: dor cutânea desproporcional, mucosite em ≥ 2 sítios, alvos atípicos (dois anéis), Nikolsky positivo, latência de 1–4 semanas e fármaco de alto risco.</li><li>Classificar pela superfície corporal destacada: <strong>SJS &lt; 10%</strong>, sobreposição 10–30%, <strong>NET &gt; 30%</strong>.</li><li>O diagnóstico é clínico, apoiado pela biópsia.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Na suspeita de SJS/NET, quais exames pedir e o que a biópsia mostra?", a: "<ul><li><strong>Todos:</strong> hemograma, coagulograma, glicose, eletrólitos, ureia, creatinina, bicarbonato, Ca, albumina, função hepática, VHS e PCR.</li><li><strong>Radiografia de tórax e culturas repetidas</strong> (sangue, pele, mucosas).</li><li><strong>Biópsia de pele + imunofluorescência direta:</strong> necrose epidérmica de espessura total com clivagem dermoepidérmica, infiltrado discreto e <strong>IFD negativa</strong>.</li><li>PCR ou sorologia para Mycoplasma em crianças ou sem fármaco suspeito.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Como diferenciar SJS/NET de eritema multiforme, DRESS e PEGA?", a: "<ul><li><strong>Eritema multiforme:</strong> alvos típicos (3 anéis) acrais, gatilho infeccioso (herpes), sem descolamento em lençol.</li><li><strong>DRESS:</strong> latência de 2–6 semanas, edema facial, linfadenopatia, eosinofilia, linfócitos atípicos, acometimento visceral; mucosa leve e nunca descolamento em lençol.</li><li><strong>PEGA:</strong> pústulas puntiformes sobre eritema intertriginoso em 1–11 dias, beta-lactâmico, neutrofilia.</li><li><strong>SJS/NET:</strong> dor, mucosite, Nikolsky positivo, necrólise.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Como se calcula o SCORTEN e quando usá-lo?", a: "<p class=\"lead\"><strong>Um ponto para cada item (máximo 7), nas primeiras 24 h e no dia 3.</strong></p><ul><li>Idade ≥ 40 anos.</li><li>Neoplasia maligna.</li><li>SC destacada ≥ 10%.</li><li>FC ≥ 120.</li><li>Ureia &gt; 10 mmol/L.</li><li>Glicose &gt; 14 mmol/L.</li><li>Bicarbonato &lt; 20 mmol/L.</li><li>Quanto maior, maior a mortalidade (sobrevida de 94% com 0–1 pontos e de 17% com ≥ 5).</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Quais fármacos têm associação forte com SJS/NET e qual triagem genética existe?", a: "<p class=\"lead\"><strong>Alopurinol, lamotrigina, carbamazepina, fenitoína, sulfametoxazol, sulfassalazina, nevirapina, oxicams.</strong></p><ul><li>HLA-B*1502 antes da carbamazepina em ascendência asiática.</li><li>HLA-B*5801 para alopurinol.</li><li>≥ 15% dos casos não têm fármaco; Mycoplasma responde por ~30% deles.</li><li>Cuidado com o viés protopático: não culpar o remédio dado para tratar o pródromo. O escore ALDEN ajuda a escolher o culpado.</li></ul>", h: true },
      { t: "Stevens-Johnson / NET", q: "Paciente com NET evolui com hipotermia, confusão, hipotensão e queda de diurese. Qual a principal hipótese?", a: "<p class=\"lead\"><strong>Bacteremia/sepse</strong>, a principal causa de morte (bacteremia em 30–50%), em geral por S. aureus e Pseudomonas.</p><ul><li>Febre, leucocitose e PCR não ajudam (a própria doença inflama).</li><li>Hipotermia e procalcitonina ≥ 1 predizem hemocultura positiva.</li><li>Colher culturas e iniciar antibiótico dirigido.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Homem, 58 anos, dor retroesternal em aperto há 1 h com sudorese. ECG com supra de ST de 3 mm em V1–V4 e infra em DII, DIII e aVF. Qual o diagnóstico, a parede e a artéria?", a: "<p class=\"lead\"><strong>IAM com supra de ST (OCA) anterior, artéria descendente anterior.</strong></p><ul><li>Infra inferior = imagem em espelho.</li><li>Critério: supra novo ≥ 1 mm em 2 derivações contíguas; em V2–V3, ≥ 2 mm em homens ≥ 40 anos, ≥ 2,5 mm em homens &lt; 40 anos e ≥ 1,5 mm em mulheres.</li><li>Não esperar troponina: ir direto à reperfusão.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Associe parede, derivações e artéria no infarto.", a: "<ul><li><strong>Septal (V1–V2) e anterior (V2–V4):</strong> DA.</li><li><strong>Anterior extensa (V1–V6 + DI e aVL):</strong> DA.</li><li><strong>Lateral alta (DI e aVL):</strong> circunflexa.</li><li><strong>Lateral baixa (V5–V6):</strong> circunflexa.</li><li><strong>Inferior (DII, DIII, aVF):</strong> CD (ou circunflexa).</li><li><strong>Posterior (V7–V9; espelho em V1–V3):</strong> circunflexa ou CD.</li><li><strong>VD (V3R–V4R):</strong> CD.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "IAM inferior com hipotensão e pulmões limpos, e supra de ST em DIII maior que em DII. O que você precisa fazer no ECG e qual o diagnóstico?", a: "<p class=\"lead\"><strong>Fazer derivações direitas (V3R–V4R): infarto de VD</strong> (CD proximal).</p><ul><li>Supra ≥ 0,5 mm em V3R/V4R tem S 100% e E 87%, e é transitório.</li><li>Todo infarto inferior deve ter ECG de 16 derivações.</li><li>Implicação: <strong>nitrato contraindicado</strong>; o tratamento da hipotensão é volume.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Dor típica com infra de ST de V1 a V4, ondas T positivas e altas, e R ampla em V1–V2. É SCA sem supra?", a: "<p class=\"lead\"><strong>Não: é infarto posterior (OCA de circunflexa ou CD).</strong></p><ul><li>Fazer V7–V9 (supra &gt; 0,5 mm).</li><li>É o espelho do septal: R ampla = Q, infra = supra.</li><li>Conduta: reperfusão, como IAMCSST.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Cite padrões de ECG de oclusão coronária aguda sem supra clássico.", a: "<ul><li><strong>T hiperaguda:</strong> ampla e simétrica, desproporcional ao QRS.</li><li><strong>De Winter:</strong> infra ascendente no ponto J nas precordiais, T altas simétricas, supra de 0,5–1 mm em aVR (DA proximal).</li><li><strong>Infarto posterior.</strong></li><li><strong>Distorção terminal do QRS:</strong> ausência de S ou J em V2–V3 (E 100%).</li><li><strong>Aslanger:</strong> supra isolado em DIII, infra em V4–V6 com T positiva, ST de V1 &gt; V2.</li><li><strong>Bandeira da África do Sul:</strong> supra em DI, aVL e V2 (1ª diagonal).</li><li>25–30% das OCA não têm supra.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Paciente com BRE prévio e dor torácica típica. Como saber se há oclusão?", a: "<p class=\"lead\"><strong>Critérios de Sgarbossa modificados</strong> (S 91%, E 90%); basta um, em qualquer derivação:</p><ul><li>Supra de ST ≥ 1 mm concordante com o QRS.</li><li>Infra de ST ≥ 1 mm em V1–V3.</li><li>Razão ST/S &gt; 0,25 (discordância excessiva).</li><li>BRE novo isolado não é mais critério de IAM.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Como diferenciar o supra de ST do IAM do da pericardite e da repolarização precoce?", a: "<ul><li><strong>IAM/OCA:</strong> supra territorial, imagem em espelho, ECG dinâmico (repetir a cada 15 min).</li><li><strong>Pericardite:</strong> supra e infra de PR difusos, sem território, recíproco só em aVR, sinal de Spodick.</li><li><strong>Repolarização precoce:</strong> jovem, supra difuso com entalhe no ponto J, estável, sem distorção terminal do QRS.</li><li><strong>Aneurisma de VE:</strong> supra persistente ≥ 2 semanas com onda Q; T/QRS &gt; 0,36 sugere OCA.</li><li>Cuidado: DA tipo IV causa supra difuso.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Classifique Killip e diga a mortalidade de cada classe.", a: "<ul><li><strong>I:</strong> sem IC (~6%).</li><li><strong>II:</strong> estertores em até metade dos campos, B3, turgência jugular (17%).</li><li><strong>III:</strong> edema agudo de pulmão (~38%).</li><li><strong>IV:</strong> choque cardiogênico, PAS &lt; 90 com hipoperfusão (~81%).</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "No 4º dia pós-IAM, o paciente piora subitamente: edema agudo, hipotensão e sopro holossistólico novo. Quais hipóteses e como confirmar?", a: "<p class=\"lead\"><strong>Complicação mecânica</strong>, confirmada por <strong>ecocardiograma de urgência</strong>:</p><ul><li><strong>CIV:</strong> sopro rude com frêmito na borda esternal esquerda baixa; salto de saturação de O₂ entre AD e VD.</li><li><strong>Ruptura de músculo papilar:</strong> sopro suave, às vezes ausente; IM aguda com onda V gigante (comum no IAM inferior).</li><li><strong>Ruptura de parede livre:</strong> tamponamento (tríade de Beck), AESP, morte súbita.</li><li>Pico entre o 3º e o 5º dia (a fibrinólise antecipa); mortalidade de ~60% em 30 dias.</li></ul>", h: true },
      { t: "OCA e IAM com supra de ST", q: "Paciente com dor torácica tem ECG inicial normal e troponina ultrassensível abaixo do p99. Pode receber alta?", a: "<p class=\"lead\"><strong>Não com um único traçado.</strong></p><ul><li>~14% das OCA têm troponina inicial &lt; p99, e o ECG é dinâmico.</li><li>Repetir o ECG a cada 15 min se a suspeita persistir, com V7–V9 e V3R–V4R.</li><li>Troponina seriada.</li><li>Resposta a nitrato ou antiácido não tem valor diagnóstico.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Homem, 64 anos, dor em repouso há 2 h, infra de ST de 1 mm em V4–V6, troponina ultrassensível com rule-in no 0/1 h, GRACE 125, sem IC. Qual o diagnóstico e o risco?", a: "<p class=\"lead\"><strong>IAM sem supra de ST (NOCA). Alto risco</strong>, porque tem troponina com curva.</p><ul><li>Alto risco: troponina positiva, alteração dinâmica de ST/T ou GRACE &gt; 140.</li><li>Cateterismo <strong>&lt; 24 h</strong>.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Qual a diferença entre angina instável, IAM sem supra e injúria miocárdica crônica?", a: "<ul><li><strong>Angina instável:</strong> isquemia sem necrose; troponina sem curva.</li><li><strong>IAM sem supra:</strong> troponina &gt; p99 com <strong>ascensão ou queda</strong> + sintoma, ECG isquêmico, imagem ou trombo.</li><li><strong>Injúria crônica</strong> (DRC, IC): troponina elevada <strong>estável</strong>, sem curva.</li><li>Troponina elevada não é sinônimo de infarto: miocardite, TEP, sepse, IC e DRC também elevam.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Explique o algoritmo 0/1 h de troponina ultrassensível (kit Roche).", a: "<ul><li><strong>Rule-out com 1 dosagem:</strong> dor há &gt; 3 h e troponina inicial &lt; 5 ng/L.</li><li><strong>Rule-out em 1 h:</strong> inicial &lt; 12 e variação &lt; 3 ng/L.</li><li><strong>Rule-in:</strong> inicial ≥ 52 ou variação ≥ 5 ng/L em 1 h.</li><li><strong>Zona de observação:</strong> prevalência de IAM de 18,6%; 3ª troponina e eco ou estratificação não invasiva.</li><li>Não se usa a variação de 20%: usam-se os cortes do fabricante.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Paciente sem dor no momento, com T bifásica (ou invertida, profunda e simétrica) em V2–V3 após angina intensa. Qual o padrão e qual o risco?", a: "<p class=\"lead\"><strong>Síndrome de Wellens</strong>, por lesão crítica da DA proximal (reperfundida e prestes a reocluir).</p><ul><li>Tipo A: T bifásica. Tipo B: T invertida e profunda.</li><li>Não é \"alteração antiga\".</li><li>Não fazer teste ergométrico. Cateterismo precoce (&lt; 2 h a &lt; 24 h, conforme a dor e a fonte).</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Infra de ST difuso com supra em aVR em paciente com dor típica. O que sugere?", a: "<p class=\"lead\"><strong>Isquemia subendocárdica circunferencial: lesão de tronco, DA proximal ou triarterial.</strong></p><ul><li>Supra em aVR &gt; 1 mm aumenta a especificidade.</li><li>Com quadro de SCA, cateterismo <strong>&lt; 2 h</strong> (não trombolisar).</li><li>O padrão não é exclusivo de SCA (taquiarritmia, dissecção, TEP maciço, anemia grave).</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Como se monta o escore HEART e o que ele define?", a: "<p class=\"lead\"><strong>História, ECG, idade, fatores de risco e troponina, de 0 a 2 pontos cada.</strong></p><ul><li>0–3: baixo risco (MACE 0,9–1,7%), alta com seguimento.</li><li>4–6: intermediário (12–16,6%), teste não invasivo.</li><li>7–10: alto (50–65%), estratificação invasiva.</li><li>Útil com troponina convencional; com rule-out por troponina ultrassensível, não precisa somar escore.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Quais critérios definem os tempos do cateterismo na SCASSST?", a: "<ul><li><strong>Muito alto risco (&lt; 2 h):</strong> instabilidade ou choque, angina refratária, arritmia ventricular maligna ou PCR, complicação mecânica, IC aguda, alterações dinâmicas recorrentes de ST/T.</li><li><strong>Alto (&lt; 24 h):</strong> troponina positiva, alteração dinâmica de ST/T, GRACE &gt; 140.</li><li><strong>Intermediário (&lt; 72 h):</strong> DM, IRC, FEVE &lt; 40%, angina pós-IAM, ICP ou CRM prévia, GRACE 109–140.</li></ul>", h: true },
      { t: "SCA sem supra de ST", q: "Paciente com angina e Hb 7 g/dL, ou angina com FA de alta resposta. Como classificar pela Braunwald e qual o raciocínio?", a: "<p class=\"lead\"><strong>Braunwald classe A: angina secundária</strong> (análoga ao IAM tipo 2).</p><ul><li>O problema é o desbalanço entre oferta e demanda (anemia, taquiarritmia, febre, tireotoxicose, hipotensão).</li><li>Tratar a causa; antitrombótico não resolve.</li><li>As outras classes: I (início recente ou acelerada), II (repouso nos últimos 30 dias, &gt; 48 h), III (repouso &lt; 48 h).</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Sr. Roberto, 55 anos: aperto retroesternal ao subir ladeira que cede em 3–5 min de repouso, há 2 meses, sem dor em repouso. HAS, tabagista, LDL 162, pai com IAM aos 52 anos. ECG e exame normais. Qual o diagnóstico e o próximo exame?", a: "<p class=\"lead\"><strong>Angina típica estável (síndrome coronariana crônica), CCS II.</strong> Seguir no ambulatório.</p><ul><li>Probabilidade pré-teste pelo RF-CL: moderada (15–50%).</li><li>Pedir <strong>teste não invasivo: angio-TC de coronárias ou imagem funcional de estresse.</strong></li><li>Cateterismo só se o teste for de alto risco ou a angina for refratária.</li><li>Já iniciar o tratamento clínico.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Como classificar a dor torácica crônica (típica, atípica, não anginosa)?", a: "<p class=\"lead\"><strong>Três critérios:</strong></p><ul><li>1) Desconforto retroesternal característico.</li><li>2) Provocado por esforço ou estresse.</li><li>3) Aliviado por repouso ou nitrato em minutos.</li><li><strong>Típica:</strong> 3 de 3. <strong>Atípica:</strong> 2 de 3. <strong>Não anginosa:</strong> 0 ou 1.</li><li>\"Atípica\" não quer dizer benigna (é mais comum em mulheres, idosos e diabéticos).</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Qual exame pedir conforme a probabilidade pré-teste de DAC obstrutiva?", a: "<ul><li><strong>≤ 5%:</strong> não testar; buscar outra causa.</li><li><strong>5–15%:</strong> anatômico (escore de cálcio ou angio-TC), para excluir.</li><li><strong>15–50%:</strong> angio-TC ou teste funcional.</li><li><strong>50–85%:</strong> teste funcional com imagem.</li><li><strong>&gt; 85%:</strong> cateterismo direto.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Quando ir direto ao cateterismo, sem teste não invasivo, na DAC crônica?", a: "<ul><li>Probabilidade &gt; 85% (por exemplo, com ondas Q, disfunção de VE, escore de cálcio muito alto).</li><li>Angina CCS III–IV ou refratária ao tratamento.</li><li>FE ≤ 35% com suspeita de DAC.</li><li>Arritmia ventricular grave ou morte súbita recuperada.</li><li>Depois de um teste não invasivo de alto risco.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Quais achados de alto risco nos testes não invasivos indicam cateterismo?", a: "<ul><li><strong>Teste ergométrico:</strong> escore de Duke &lt; −10.</li><li><strong>Cintilografia:</strong> isquemia ≥ 10% do VE.</li><li><strong>Eco de estresse:</strong> alteração induzida em ≥ 3 de 16 segmentos.</li><li><strong>RM de estresse:</strong> isquemia em ≥ 2 segmentos.</li><li><strong>Angio-TC:</strong> lesão de tronco, triarterial proximal ou DA proximal.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Paciente com BRE, marca-passo ou infra de ST basal > 1 mm, ou que não consegue andar. O teste ergométrico serve?", a: "<p class=\"lead\"><strong>Não.</strong> O ECG não é interpretável, ou o paciente não faz esforço.</p><ul><li>Usar exame com imagem: eco de estresse, cintilografia ou PET, ou RM.</li><li>Se não pode se exercitar, estresse farmacológico (dobutamina, dipiridamol).</li><li>Com DRC ou alergia a contraste, evitar a angio-TC.</li></ul>", h: true },
      { t: "DAC crônica e angina estável", q: "Mulher com angina típica e cateterismo sem lesão obstrutiva. Qual o diagnóstico e como confirmar?", a: "<p class=\"lead\"><strong>ANOCA/INOCA: disfunção microvascular ou vasoespasmo.</strong></p><ul><li>FFR &gt; 0,80 exclui obstrução.</li><li>Reserva de fluxo &lt; 2,0 ou IMR ≥ 25 = disfunção microvascular.</li><li>Teste com acetilcolina = espasmo.</li><li>Holter de ST se houver suspeita de vasoespasmo.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Homem, 68 anos, HAS e DM, palpitações há 6 h. PA 128/80, FC 142 irregular. ECG sem ondas P, com RR irregular. Qual o diagnóstico e o que pedir?", a: "<p class=\"lead\"><strong>Fibrilação atrial com alta resposta ventricular, estável, &lt; 24 h.</strong></p><ul><li>Critério: RR irregular, ausência de P (ondas f), registro ≥ 30 s.</li><li>Exames: hemograma, K⁺ e Mg²⁺, função renal (ClCr para a dose do ACOD), glicemia, TSH e T4 livre; troponina se houver dor.</li><li><strong>Ecocardiograma transtorácico</strong> em todos (AE, FEVE, valvopatia).</li><li>CHA₂DS₂-VA = 3 (HAS, DM, idade 65–74).</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Classifique a FA pela duração.", a: "<ul><li><strong>Paroxística:</strong> &lt; 7 dias, qualquer que seja a forma de reversão.</li><li><strong>Persistente:</strong> &gt; 7 dias e &lt; 1 ano.</li><li><strong>Persistente de longa duração:</strong> &gt; 1 ano, com estratégia de ritmo.</li><li><strong>Permanente:</strong> decisão de não tentar o ritmo sinusal (não é critério de tempo).</li><li><strong>Subclínica:</strong> em DCEI, ritmo atrial ≥ 175 bpm por ≥ 5 min.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Calcule o CHA₂DS₂-VA e diga o que cada faixa indica.", a: "<p class=\"lead\"><strong>C</strong> = IC ou disfunção de VE (1); <strong>H</strong> = HAS (1); <strong>A₂</strong> = idade ≥ 75 (2); <strong>D</strong> = DM (1); <strong>S₂</strong> = AVC, AIT ou embolia (2); <strong>V</strong> = doença vascular (1); <strong>A</strong> = 65–74 anos (1).</p><ul><li><strong>≥ 2:</strong> anticoagular.</li><li><strong>1:</strong> considerar.</li><li><strong>0:</strong> sem antitrombótico.</li><li>O sexo feminino saiu do escore.</li><li>Anticoagular sempre na miocardiopatia hipertrófica, na amiloidose e no hipertireoidismo, independentemente do escore.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "HAS-BLED de 4 contraindica anticoagular?", a: "<p class=\"lead\"><strong>Não.</strong> Usar o risco de sangramento para não anticoagular é um erro.</p><ul><li>HAS-BLED ≥ 3 = alto risco: corrigir o que é modificável (PA &gt; 160, AINE ou AAS, álcool, RNI lábil, trocar varfarina por ACOD).</li><li>Itens: HAS, função renal ou hepática alterada, AVC, sangramento, RNI lábil, idade &gt; 65, drogas ou álcool.</li><li>Quedas não são preditor independente de sangramento com ACOD.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "FA muito rápida, irregular e com QRS largo em jovem. O que pensar?", a: "<p class=\"lead\"><strong>FA pré-excitada (Wolff-Parkinson-White)</strong>: a via acessória eleva muito a resposta ventricular.</p><ul><li>Outros jovens sem cardiopatia: pensar em canalopatia (Brugada, QT curto ou longo).</li><li>No Brugada, propafenona é contraindicada.</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "FA com intervalos RR regulares e FC de 38 bpm. Qual o diagnóstico?", a: "<p class=\"lead\"><strong>FA com BAV total</strong> (escape regular), e não \"FA de baixa resposta\".</p><ul><li>Frequentemente por antiarrítmico ou degeneração do sistema de condução.</li><li>Conduta: tratar como bradicardia (BAVT).</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Quando pedir ecocardiograma transesofágico na FA?", a: "<p class=\"lead\"><strong>Antes da cardioversão quando a FA tem ≥ 24 h ou início desconhecido</strong> (ou alto risco embólico), como alternativa a 3 semanas de anticoagulação prévia.</p><ul><li>Exclui trombo no apêndice atrial esquerdo (&gt; 90% dos trombos na FA não valvar).</li><li>Também antes de ablação (ou angio-TC).</li></ul>", h: true },
      { t: "Fibrilação atrial", q: "Quais valvopatias exigem varfarina na FA?", a: "<p class=\"lead\"><strong>Só estenose mitral moderada ou grave (reumática) e prótese mecânica.</strong></p><ul><li>INVICTUS: rivaroxabana foi pior na EM reumática.</li><li>RE-ALIGN e PROACT-Xa: ACOD contraindicado em prótese mecânica.</li><li>IM, IAo, EAo, bioprótese e TAVI podem usar ACOD.</li></ul>", h: true },
      { t: "Bradicardias", q: "Mulher, 78 anos, síncope e confusão. FC 32, PA 78/44. ECG com ondas P regulares sem relação com QRS regulares e largos (140 ms). Qual o diagnóstico e o que mais pedir?", a: "<p class=\"lead\"><strong>BAV total com escape infranodal e bradicardia instável.</strong></p><ul><li>Frequência atrial maior que a ventricular, sem relação entre P e QRS. (Se a ventricular fosse maior que a atrial, seria dissociação AV.)</li><li>Exames: K⁺, Ca²⁺, Mg²⁺, função renal, gasometria, hemograma, troponina, TSH; digoxinemia e perfil toxicológico se houver uso de fármaco.</li><li>Hipercalemia e IAM são causas reversíveis que mudam a conduta.</li></ul>", h: true },
      { t: "Bradicardias", q: "Quais critérios definem a bradicardia como instável?", a: "<p class=\"lead\"><strong>Rebaixamento do nível de consciência, angina, hipotensão, síncope ou sinais de choque</strong> atribuíveis à bradicardia.</p><ul><li>Bradicardia absoluta: FC &lt; 60.</li><li>Bradicardia relativa: FC inapropriada à demanda (por exemplo, 60 no choque).</li><li>Os sintomas costumam aparecer com FC &lt; 40, mas a correlação é fraca.</li></ul>", h: true },
      { t: "Bradicardias", q: "Diferencie Mobitz I, Mobitz II e BAV 2:1 no ECG.", a: "<ul><li><strong>Mobitz I (Wenckebach):</strong> PR aumenta até uma P bloqueada; o PR pré-bloqueio é maior que o pós-bloqueio. Supra-hissiano, em geral benigno.</li><li><strong>Mobitz II:</strong> PR constante, com P bloqueada de forma súbita. Infra-hissiano; risco de BAVT; internar.</li><li><strong>2:1:</strong> não há dois PR consecutivos para comparar, então não se classifica. QRS largo e ausência de resposta à atropina sugerem bloqueio baixo; na dúvida, tratar como grave.</li></ul>", h: true },
      { t: "Bradicardias", q: "Para que serve o teste da atropina na bradicardia estável?", a: "<p class=\"lead\"><strong>Atropina 0,04 mg/kg (máximo 2 mg) com ECG contínuo.</strong></p><ul><li>Reversão, mesmo transitória, indica bloqueio supranodal ou nodal (muitas vezes efeito de fármaco).</li><li>Sem resposta, sugere <strong>bloqueio infranodal</strong> (Mobitz II, BAVT, alto grau).</li><li>A atropina que \"não funcionou\" é informação diagnóstica.</li></ul>", h: true },
      { t: "Bradicardias", q: "Bradicardia em paciente com TCE, com hipertensão e respiração irregular. O que é?", a: "<p class=\"lead\"><strong>Tríade de Cushing: hipertensão intracraniana grave.</strong></p><ul><li>Não é uma \"bradicardia boa\": a prioridade é a PIC.</li></ul>", h: true },
      { t: "Bradicardias", q: "BAV no infarto inferior e no infarto anterior: qual a diferença?", a: "<ul><li><strong>Inferior (CD):</strong> reflexo vagal (Bezold-Jarisch), QRS estreito, transitório; responde à atropina. Sem instabilidade, aminofilina 250 mg IV.</li><li><strong>Anterior (DA, perfurantes septais):</strong> QRS largo, instável; costuma exigir marca-passo.</li></ul>", h: true },
      { t: "Bradicardias", q: "Quais causas extrínsecas (reversíveis) de bradicardia você deve buscar?", a: "<ul><li><strong>Fármacos:</strong> betabloqueador, BCC (verapamil, diltiazem), digoxina, antiarrítmicos, lítio, tricíclicos, clonidina.</li><li><strong>Distúrbios metabólicos:</strong> hipercalemia, hipercalcemia, hipomagnesemia.</li><li><strong>Outras:</strong> hipotireoidismo, hipóxia, apneia do sono, hipotermia, HIC, tônus vagal (vômito, tosse, micção, seio carotídeo).</li><li>Intrínsecas: degenerativa, isquemia, Chagas, endocardite com abscesso, infiltrativas, pós-cirurgia, TAVI ou ablação.</li></ul>", h: true },
      { t: "Tireoide", q: "Mulher, 45 anos, com cansaço, intolerância ao frio, pele seca, constipação, ganho de peso, rouquidão e bradicardia. TSH 18 e T4 livre baixo. Qual o diagnóstico e qual exame define a etiologia?", a: "<p class=\"lead\"><strong>Hipotireoidismo primário, provavelmente por tireoidite de Hashimoto.</strong></p><ul><li>TSH alto com T4 livre baixo confirma o hipotireoidismo.</li><li><strong>Anti-TPO</strong> (presente em ~95%; o mais sensível) e anti-Tg.</li><li>Predomínio feminino de 10:1; associação com outras autoimunidades.</li><li>Hipotireoidismo secundário (hipófise): TSH baixo ou normal com T4 livre baixo.</li></ul>", h: true },
      { t: "Tireoide", q: "Mulher jovem com perda de peso, nervosismo, tremor, taquicardia, sudorese, bócio difuso e exoftalmia. TSH suprimido, T4 livre alto. Qual o diagnóstico e o que pedir?", a: "<p class=\"lead\"><strong>Doença de Graves.</strong></p><ul><li>Oftalmopatia (retração palpebral, lid lag, exoftalmia) é patognomônica.</li><li>Pedir <strong>TRAb</strong> (anticorpo contra o receptor de TSH).</li><li>Cintilografia só se houver dúvida: <strong>captação aumentada e difusa</strong>.</li></ul>", h: true },
      { t: "Tireoide", q: "Tireotoxicose com cintilografia de captação baixa. Quais hipóteses?", a: "<p class=\"lead\"><strong>Tireotoxicose sem hipertireoidismo</strong> (não há aumento de síntese):</p><ul><li><strong>Tireoidite</strong> (subaguda, indolor, pós-parto, \"hashitoxicose\").</li><li><strong>Tireotoxicose factícia</strong> (ingestão de hormônio).</li><li><strong>Sobrecarga de iodo</strong> (amiodarona, contraste).</li><li>Graves, Plummer e BMN tóxico têm captação aumentada.</li></ul>", h: true },
      { t: "Tireoide", q: "TSH suprimido com nódulo único \"quente\" à cintilografia (restante da glândula suprimido) e anticorpos negativos. Qual o diagnóstico?", a: "<p class=\"lead\"><strong>Adenoma tóxico (doença de Plummer).</strong></p><ul><li>USG com nódulo único; anticorpos antitireoidianos negativos.</li><li>TSH baixo com T3 e T4 normais = fase subclínica.</li><li>Diferencial: bócio multinodular tóxico (vários nódulos, T3 e T4 discretamente elevados, idoso).</li></ul>", h: true },
      { t: "Tireoide", q: "Explique os efeitos Wolff-Chaikoff e Jod-Basedow.", a: "<ul><li><strong>Wolff-Chaikoff:</strong> sobrecarga de iodo bloqueia a TPO e causa <strong>hipotireoidismo</strong> (mais em quem tem Hashimoto).</li><li><strong>Jod-Basedow:</strong> iodo em quem tem tireoide autônoma ou vem de baixa ingestão estimula a síntese e causa <strong>hipertireoidismo</strong> (Graves, BMN).</li><li>Fontes de iodo: amiodarona, contraste iodado, xaropes, frutos do mar, tintura de cabelo.</li></ul>", h: true },
      { t: "Obesidade", q: "Homem, 1,75 m, 102 kg, circunferência abdominal 108 cm, com HAS e esteatose. Como classificar?", a: "<p class=\"lead\"><strong>IMC = 102 / 1,75² ≈ 33,3 kg/m²: obesidade grau I.</strong></p><ul><li>Faixas: 18,5–24,9 normal; 25–29,9 sobrepeso; 30–34,9 grau I; 35–39,9 grau II; ≥ 40 grau III.</li><li><strong>Circunferência abdominal</strong> (gordura visceral), entre o rebordo costal e a crista ilíaca; corte de 80 cm para mulheres e 90 cm para homens sul-americanos.</li><li>Tem comorbidades: indicação farmacológica (IMC ≥ 30).</li></ul>", h: true },
      { t: "Obesidade", q: "Paciente chegou a IMC 45 e, com tratamento, está com IMC 38 (perda de 15,5%). Como classificar?", a: "<p class=\"lead\"><strong>Obesidade grau III controlada.</strong></p><ul><li>A classificação baseada no histórico de peso considera o <strong>maior IMC já atingido</strong>, e o paciente que perdeu peso (≥ 10–15%) passa a \"obesidade reduzida/controlada\".</li><li>Isso evita que o paciente seja \"rebaixado\" e tenha o tratamento suspenso.</li></ul>", h: true },
      { t: "Obesidade", q: "Quais limitações do IMC e o que avaliar além dele?", a: "<p class=\"lead\"><strong>O IMC não distingue gordura de músculo, osso ou água.</strong></p><ul><li>Superestima com hipertrofia muscular e edema; erra em deformidades esqueléticas (cifose).</li><li>Avaliar a <strong>distribuição</strong> (circunferência abdominal), a <strong>causa</strong> (exógena é a mais comum; endógena: Cushing, hipotireoidismo, SOP, hipotalâmica, deficiência de GH), as <strong>comorbidades</strong> e o fenótipo alimentar.</li></ul>", h: true },
      { t: "Obesidade", q: "Quais comorbidades rastrear no paciente obeso?", a: "<ul><li><strong>Metabólicas:</strong> DM2, dislipidemia, gota, esteatose e fibrose hepática.</li><li><strong>Cardiovasculares:</strong> HAS, DAC, IC, FA, TEV.</li><li><strong>Respiratórias:</strong> apneia obstrutiva do sono, hipoventilação.</li><li><strong>Outras:</strong> DRGE, colelitíase, osteoartrose, irregularidade menstrual e infertilidade (SOP), câncer (endométrio, mama, cólon, próstata), depressão, compulsão alimentar.</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Mulher, 40 anos, tosse produtiva diária há anos com escarro em 3 camadas, infecções respiratórias de repetição e episódios de hemoptise. Estertores grossos. Qual hipótese e qual exame confirma?", a: "<p class=\"lead\"><strong>Bronquiectasias.</strong></p><ul><li>O diagnóstico é <strong>clínico + radiológico</strong>: tosse produtiva crônica e/ou infecções de repetição + <strong>TC de alta resolução</strong> com dilatação brônquica irreversível.</li><li>Na TCAR: brônquio maior que a artéria (sinal do anel de sinete), ausência de afilamento, espessamento parietal, \"trilho de trem\", árvore em brotamento.</li><li>Na radiografia: trilho de trem, \"dedo de luva\".</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Bronquiectasia confirmada. Qual investigação etiológica inicial vale para TODOS os pacientes?", a: "<ul><li><strong>Sangue:</strong> hemograma, IgG, IgM, IgA, IgE total, alfa-1-antitripsina.</li><li><strong>Escarro:</strong> bactérias, fungos e micobactérias.</li><li><strong>Outros:</strong> cloro no suor (fibrose cística); espermograma em homem sem filhos.</li><li>Causa pós-infecciosa em 20–32% e desconhecida em 24–40%.</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Que pista clínica direciona qual exame etiológico na bronquiectasia?", a: "<ul><li><strong>Infecções recorrentes ou diarreia:</strong> imunodeficiência (imunoglobulinas, HIV).</li><li><strong>Asma, bronquiectasia central, IgE alta:</strong> IgE específica para Aspergillus (ABPA).</li><li><strong>Dextrocardia, otites, sinusites, infertilidade:</strong> discinesia ciliar primária (estudo genético).</li><li><strong>Bronquiectasia localizada:</strong> broncoscopia (corpo estranho, tumor).</li><li><strong>Tabagismo:</strong> espirometria (DPOC).</li><li>Também: doença do colágeno, DII, DRGE.</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Defina primoinfecção, infecção intermitente, infecção crônica e erradicação por micro-organismo potencialmente patogênico.", a: "<ul><li><strong>Primoinfecção:</strong> 1ª cultura positiva para um micro-organismo não isolado antes.</li><li><strong>Intermitente:</strong> culturas ora positivas, ora negativas (intervalo ≥ 1 mês).</li><li><strong>Crônica:</strong> ≥ 2 culturas positivas para o mesmo micro-organismo em 12 meses, com intervalo ≥ 3 meses.</li><li><strong>Erradicação:</strong> ≥ 2 culturas negativas consecutivas (intervalo ≥ 1 mês) em 6 meses.</li><li>Infecção crônica por Pseudomonas é marcador de pior prognóstico.</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Defina exacerbação de bronquiectasia e cite os sinais de gravidade.", a: "<p class=\"lead\"><strong>Piora de ≥ 3 dos seguintes por ≥ 48 h:</strong> tosse, volume ou viscosidade do escarro, purulência, dispneia ou intolerância ao esforço, fadiga, hemoptise.</p><ul><li>Gravidade: FR ≥ 25, uso de musculatura acessória, queda de SpO₂, cianose, T ≥ 38 °C ou critério de sepse, hemoptise &gt; 25 mL/24 h.</li><li>Sempre colher escarro antes do antibiótico.</li></ul>", h: true },
      { t: "Bronquiectasia", q: "Quais exames funcionais e quais escores usar no seguimento da bronquiectasia estável?", a: "<ul><li><strong>Espirometria com broncodilatador a cada 6 meses</strong> (padrão obstrutivo é o mais comum).</li><li>Volumes pulmonares anualmente; teste de caminhada de 6 min conforme critério.</li><li>Cultura de escarro periódica, incluindo micobactérias.</li><li><strong>Escores de gravidade</strong> (FACED, E-FACED, BSI) no diagnóstico e anualmente: VEF1, idade, colonização crônica por Pseudomonas, extensão na TC, dispneia e exacerbações.</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "DPOC exacerbado, FR 32, uso de musculatura acessória, gasometria com pH 7,28 e PaCO₂ 68, alerta e colaborativo. Qual a indicação ventilatória?", a: "<p class=\"lead\"><strong>VNI (BiPAP): insuficiência respiratória hipercápnica com acidose respiratória (pH &lt; 7,35).</strong></p><ul><li>Indicações clássicas de VNI: DPOC exacerbado, edema agudo de pulmão cardiogênico, imunossuprimido, pós-extubação de alto risco (preventiva).</li><li>Na DPOC, sonolência por hipercapnia (narcose) não contraindica a VNI.</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Quais as contraindicações à VNI?", a: "<ul><li>Incapacidade de cooperar, de proteger a via aérea ou de expectorar.</li><li>Rebaixamento (Glasgow &lt; 8), exceto a narcose hipercápnica da DPOC.</li><li>Alto risco de aspiração.</li><li>Cirurgia ou trauma facial ou neurológico; anastomose esofágica recente.</li><li>Pneumotórax não drenado.</li><li>Disfunções graves não respiratórias (choque, arritmia instável).</li><li>Indicação de intubação imediata.</li><li>Lesão de pele ou via aérea extensa (como na NET).</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Como avaliar se a VNI está funcionando e quando considerá-la falha?", a: "<p class=\"lead\"><strong>Reavaliar à beira-leito em 30 min a 2 h.</strong></p><ul><li>Sucesso: ↓ FR, ↑ volume corrente, melhora da consciência, ↓ uso de musculatura acessória, ↑ SpO₂, ↓ PaCO₂.</li><li><strong>Falha:</strong> piora clínica, SpO₂ caindo apesar de ↑ FiO₂, piora da acidose respiratória: intubar sem atrasar.</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Paciente em VCV com VC de 450 mL: pressão de pico 42 e de platô 32 cmH₂O, PEEP 8. Como interpretar a mecânica?", a: "<p class=\"lead\"><strong>Platô 32 &gt; 28 cmH₂O e driving pressure de 24 (platô − PEEP) &gt; 15: risco de lesão induzida pela ventilação.</strong></p><ul><li>Metas: pico &lt; 40–45, platô &lt; 28, driving &lt; 15, auto-PEEP zero.</li><li>Pico alto com platô normal sugere <strong>resistência</strong> (secreção, broncoespasmo, tubo).</li><li>Pico e platô altos sugerem <strong>complacência</strong> baixa (SDRA, edema, pneumotórax).</li><li>Conduta: reduzir o VC para 6 mL/kg de peso predito.</li></ul>", h: true },
      { t: "Ventilação mecânica", q: "Quais as metas gasométricas iniciais na ventilação mecânica?", a: "<ul><li><strong>SpO₂ 92–96%</strong> e <strong>PaO₂ 65–90 mmHg</strong>: titular a FiO₂ para baixo a partir de 100%.</li><li><strong>PaCO₂ ajustada para pH de ~7,34–7,43</strong>: ajustar pela FR ou pelo VC.</li><li>Também: controle do drive ventilatório, estabilidade hemodinâmica, ausência de assincronias.</li></ul>", h: true }
    ]
