<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provas por Matéria · AC2 · Sétimo Período</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #0f1420;
    --panel-2: #1a2333;
    --border: #1e2a44;
    --border-hover: #2d4166;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-3: #1d4ed8;
    --accent-glow: rgba(59,130,246,.35);
    --text: #f8fafc;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #10b981;
    --ok-glow: rgba(16,185,129,.3);
    --err: #ef4444;
    --err-glow: rgba(239,68,68,.3);
    --warn: #f59e0b;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(29,78,216,.06) 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
  }
  [hidden] { display: none !important; }

  aside.sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    background: linear-gradient(180deg, rgba(15,20,32,.6), rgba(0,0,0,.9));
    border-right: 1px solid var(--border);
    padding: 60px 20px 24px;
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0;
    overflow-y: auto;
    z-index: 50;
    backdrop-filter: blur(10px);
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden aside.sidebar { transform: translateX(-100%); }
  main {
    margin-left: var(--sidebar-w);
    transition: margin-left .35s cubic-bezier(.4,.2,.2,1);
    min-height: 100vh;
    padding: 48px 60px 80px;
  }
  body.sidebar-hidden main { margin-left: 0; }
  body.no-transition aside.sidebar,
  body.no-transition main { transition: none !important; }

  .sidebar-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 100;
    width: 36px; height: 36px;
    padding: 0;
    background: rgba(15,20,32,.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .sidebar-toggle:hover {
    color: var(--accent-2); border-color: var(--accent);
    background: rgba(59,130,246,.15);
  }
  .sidebar-toggle svg { transition: transform .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden .sidebar-toggle svg { transform: rotate(180deg); }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted-2); text-decoration: none;
    font-size: 12px; font-weight: 500; letter-spacing: .5px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid transparent;
    align-self: flex-start;
    transition: all .2s;
  }
  .back-link:hover { color: var(--accent-2); background: var(--panel); border-color: var(--border); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-2px); }

  .brand {
    text-align: center;
    padding: 20px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    margin: 0; font-family: 'Unbounded', sans-serif;
    font-size: 30px; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .brand .sub {
    color: var(--muted); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
    margin-top: 8px; font-weight: 500;
  }

  /* Overview of questions in sidebar */
  .q-list-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .q-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 0 4px 20px;
  }
  .q-cell {
    width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 12px; font-weight: 600;
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all .15s;
  }
  .q-cell:hover { border-color: var(--border-hover); color: var(--text); }
  .q-cell.current { background: linear-gradient(135deg, var(--accent-3), var(--accent)); color:#fff; border-color: transparent; box-shadow: 0 4px 12px var(--accent-glow); }
  .q-cell.correct { background: rgba(16,185,129,.15); color: var(--ok); border-color: var(--ok); }
  .q-cell.wrong { background: rgba(239,68,68,.15); color: var(--err); border-color: var(--err); }
  .q-cell.current.correct { background: var(--ok); color: #fff; box-shadow: 0 4px 12px var(--ok-glow); }
  .q-cell.current.wrong { background: var(--err); color: #fff; box-shadow: 0 4px 12px var(--err-glow); }

  /* Main content */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .crumb {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent-2);
    font-weight: 600;
  }
  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    font-family: inherit;
    transition: all .15s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--border-hover); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .progress-bar {
    height: 4px; background: var(--panel);
    border-radius: 999px; overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
    transition: width .3s ease;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .question-card {
    max-width: 820px;
    margin: 0 auto;
    animation: fadeUp .35s cubic-bezier(.34,1.2,.64,1) both;
  }
  .q-number {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.35);
    border-radius: 999px;
    font-family: 'Unbounded', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .q-enun {
    font-size: 17px;
    line-height: 1.7;
    color: #e2e8f0;
    margin-bottom: 28px;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 24px 28px;
    border-radius: 14px;
  }

  .alts { display: flex; flex-direction: column; gap: 10px; }
  .alt {
    display: flex; gap: 14px; align-items: flex-start;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    text-align: left;
    font-family: inherit;
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    width: 100%;
  }
  .alt:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(59,130,246,.15);
  }
  .alt:disabled { cursor: default; }
  .alt-key {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-2);
    transition: all .2s;
  }
  .alt:hover:not(:disabled) .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt-text { flex: 1; }
  .alt.selected { border-color: var(--accent); background: rgba(59,130,246,.08); }
  .alt.selected .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt.correct-alt {
    border-color: var(--ok);
    background: rgba(16,185,129,.1);
    box-shadow: 0 0 0 1px var(--ok), 0 8px 20px var(--ok-glow);
  }
  .alt.correct-alt .alt-key { background: var(--ok); color: #fff; border-color: transparent; }
  .alt.wrong-alt {
    border-color: var(--err);
    background: rgba(239,68,68,.08);
    box-shadow: 0 0 0 1px var(--err);
  }
  .alt.wrong-alt .alt-key { background: var(--err); color: #fff; border-color: transparent; }
  .alt-badge {
    margin-left: 8px;
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    letter-spacing: 1px; text-transform: uppercase;
    font-family: 'Unbounded', sans-serif;
  }
  .alt.correct-alt .alt-badge {
    background: var(--ok); color: #fff;
  }
  .alt.wrong-alt .alt-badge {
    background: var(--err); color: #fff;
  }

  .confirm-wrap {
    margin-top: 24px;
    display: flex; justify-content: center;
  }
  .btn-confirm {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff;
    border: 1px solid transparent;
    padding: 14px 32px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .3px;
    box-shadow: 0 10px 24px var(--accent-glow);
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    min-width: 260px;
  }
  .btn-confirm:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px var(--accent-glow);
  }
  .btn-confirm:active:not(:disabled) { transform: translateY(0); }
  .btn-confirm:disabled {
    background: var(--panel);
    color: var(--muted);
    border-color: var(--border);
    box-shadow: none;
    cursor: not-allowed;
  }

  .feedback-panel {
    margin-top: 24px;
    animation: slideDown .4s cubic-bezier(.34,1.2,.64,1) both;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .feedback-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-radius: 12px;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .5px;
  }
  .feedback-header.correct {
    background: rgba(16,185,129,.12);
    border: 1px solid var(--ok);
    color: var(--ok);
  }
  .feedback-header.wrong {
    background: rgba(239,68,68,.12);
    border: 1px solid var(--err);
    color: var(--err);
  }

  .gabarito-toggle {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .2s;
  }
  .gabarito-toggle:hover { border-color: var(--accent); color: var(--accent-2); }
  .gabarito-toggle svg { transition: transform .3s; }
  .gabarito-toggle.open svg { transform: rotate(90deg); }

  .gabarito-body {
    margin-top: 14px;
    padding: 20px 24px;
    background: linear-gradient(145deg, rgba(59,130,246,.06), rgba(59,130,246,.02));
    border: 1px solid rgba(59,130,246,.25);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    line-height: 1.7;
    font-size: 14.5px;
    color: #dbeafe;
    animation: slideDown .3s cubic-bezier(.34,1.2,.64,1) both;
  }
  .gabarito-body .gab-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-2);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .gabarito-body .gab-answer {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--ok); margin-bottom: 10px;
  }

  .nav-buttons {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 32px;
    max-width: 820px; margin-left: auto; margin-right: auto;
  }
  .nav-btn {
    flex: 1;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .2s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--border-hover); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .nav-btn.primary:hover:not(:disabled) { transform: translateY(-2px); }

  /* End screen */
  .end-screen {
    max-width: 640px; margin: 0 auto; text-align: center;
    padding-top: 40px;
    animation: fadeUp .5s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 34px; font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -.5px;
  }
  .end-screen .subtitle {
    color: var(--muted-2); font-size: 15px;
    margin-bottom: 40px;
  }
  .donut {
    width: 240px; height: 240px;
    margin: 0 auto 32px; position: relative;
  }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .track { fill: none; stroke: var(--panel); stroke-width: 14; }
  .donut .fill-arc {
    fill: none; stroke-width: 14; stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,.2,.2,1);
  }
  .donut .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut .pct {
    font-family: 'Unbounded', sans-serif;
    font-size: 56px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .donut .pct-label {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; font-weight: 600;
  }
  .badge {
    display: inline-flex; padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Unbounded', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 32px;
  }
  .badge.excelente { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid var(--ok); }
  .badge.otimo { background: rgba(59,130,246,.15); color: var(--accent-2); border: 1px solid var(--accent); }
  .badge.regular { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid var(--warn); }
  .badge.melhorar { background: rgba(239,68,68,.15); color: var(--err); border: 1px solid var(--err); }
  .end-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 32px;
  }
  .end-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
  }
  .end-stat .val {
    font-family: 'Unbounded', sans-serif;
    font-size: 28px; font-weight: 700; line-height: 1;
  }
  .end-stat.correct .val { color: var(--ok); }
  .end-stat.wrong .val { color: var(--err); }
  .end-stat .lbl {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 8px; font-weight: 600;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  @media (max-width: 900px) {
    aside.sidebar {
      width: 100%; height: auto;
      position: relative; top: auto; left: auto;
      padding: 60px 20px 20px;
      transform: none;
    }
    body.sidebar-hidden aside.sidebar { transform: none; display: none; }
    .brand h1 { font-size: 26px; }
    main { padding: 24px 16px 60px; margin-left: 0; }
    body.sidebar-hidden main { margin-left: 0; }
    .q-grid { grid-template-columns: repeat(10, 1fr); }
  }

  /* ==== Abas: Simulado geral / Provas por matéria ==== */
  .mode-switch {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin: 0 0 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(15, 20, 32, .7);
  }
  .mode-switch a {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 9px 6px 8px;
    border-radius: 9px;
    color: var(--muted-2);
    text-decoration: none;
    font-family: 'Unbounded', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .5px;
    text-align: center;
    line-height: 1.2;
    transition: color .25s, background .25s, box-shadow .25s, transform .15s;
  }
  .mode-switch a small {
    font-family: 'Albert Sans', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: .7;
  }
  .mode-switch a:hover { color: var(--text); background: rgba(59, 130, 246, .1); }
  .mode-switch a:active { transform: scale(.97); }
  .mode-switch a.active {
    color: #fff;
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    box-shadow: 0 6px 18px var(--accent-glow);
  }

  /* ==== Lista das provas na barra lateral ==== */
  .tabs-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .tabs { display: flex; flex-direction: column; gap: 3px; margin-bottom: 22px; }
  .tab {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: all .2s cubic-bezier(.4, .2, .2, 1);
  }
  .tab:hover { background: var(--panel); color: var(--text); border-color: var(--border); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .tab-num {
    flex: none;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 11px;
    padding: 2px 7px; border-radius: 6px;
    background: rgba(255, 255, 255, .06);
    color: var(--muted-2);
  }
  .tab.active .tab-num { background: rgba(255, 255, 255, .2); color: #fff; }
  .tab-name { flex: 1; min-width: 0; }
  .prova-kind {
    display: inline-block;
    font-style: normal;
    font-size: 9px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 1px 6px; margin-left: 2px;
    border-radius: 999px;
    background: rgba(245, 158, 11, .15); color: var(--warn);
    vertical-align: 1px;
  }
  .prova-score {
    flex: none;
    font-family: 'Unbounded', sans-serif;
    font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 999px;
    background: rgba(255, 255, 255, .08); color: var(--muted-2);
  }

<script>
const PROVAS = [{"id": "cirrose", "titulo": "Cirrose Hepática", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Homem, 58 anos, etilista crônico (>60 g/dia por 25 anos), procura o ambulatório para avaliação de rotina. Exame físico: spider angiomata em tronco, eritema palmar, contratura de Dupuytren. Laboratório: AST 98 U/L, ALT 42 U/L, plaquetas 118.000/µL, albumina 3,2 g/dL, INR 1,3. Elastografia hepática: 18,5 kPa. Sobre a relação AST/ALT e os achados descritos, assinale a alternativa CORRETA:", "alternativas": {"A": "A relação AST/ALT >2 é explicada pelo aumento da produção hepática de AST na etiologia alcoólica.", "B": "A trombocitopenia isolada exclui cirrose neste paciente, pois requer confirmação por biópsia.", "C": "A relação AST/ALT >2 resulta da combinação de deficiência de piridoxina (reduzindo ALT), liberação de fração mitocondrial de AST e menor depuração hepática de AST.", "D": "A elastografia de 18,5 kPa confirma hipertensão portal clinicamente significativa neste paciente.", "E": "O INR de 1,3 indica que este paciente tem risco hemorrágico elevado e necessita correção com plasma fresco antes de qualquer procedimento."}, "correta": "C", "explicacao": "A relação AST/ALT >2 na etiologia alcoólica envolve três mecanismos: (1) a ALT é mais dependente de piridoxina (vitamina B6), frequentemente deficiente no etilismo crônico, o que reduz a produção de ALT; (2) a AST inclui uma fração mitocondrial liberada na necrose hepatocitária profunda causada pelo álcool; (3) a depuração hepática da AST diminui progressivamente com a fibrose. A alternativa A erra ao dizer que há \"aumento da produção\" de AST — trata-se de liberação e menor depuração, não de produção aumentada. A alternativa B é incorreta: plaquetas <160.000/µL têm LR+ 6,3 para cirrose — a trombocitopenia é um dos melhores marcadores isolados. A alternativa D é incorreta: a elastografia >12-15 kPa sugere cirrose (AUROC >0,90), mas o limiar para CSPH é >20-25 kPa (critério Baveno VII). A alternativa E carrega a armadilha da coagulopatia na cirrose: o INR não reflete risco hemorrágico real porque há \"rebalanceamento hemostático\" — déficit simultâneo de fatores pró e anticoagulantes. Testes viscoelásticos (TEG/ROTEM) são mais adequados. Referência: seções Diagnóstico (AST/ALT, elastografia, armadilhas) e Complicações (coagulopatia)."}, {"n": 2, "enunciado": "Mulher, 52 anos, com cirrose por MASLD (Child-Pugh B8, MELD 16), é atendida no PS com aumento do volume abdominal progressivo há 2 semanas. Paracentese diagnóstica: proteínas totais 0,8 g/dL, GASA 1,8 g/dL, PMN 380/mm3, cultura em andamento. Está hemodinamicamente estável. Qual a conduta imediata E qual a razão fisiopatológica para a infusão de albumina neste cenário?", "alternativas": {"A": "Iniciar cefotaxima 2g IV 8/8h isoladamente; albumina é reservada apenas para pacientes com disfunção renal prévia.", "B": "Iniciar cefotaxima 2g IV 8/8h + albumina 1,5 g/kg no D1 e 1 g/kg no D3; a albumina atua como expansor plasmático oncótico, prevenindo a queda de volume arterial efetivo que a PBE agrava — o que reduz o risco de SHR.", "C": "Aguardar resultado da cultura antes de iniciar antibiótico, pois o diagnóstico de PBE requer cultura positiva.", "D": "Iniciar ciprofloxacino 400 mg IV 12/12h como primeira escolha, reservando cefalosporinas para falha terapêutica.", "E": "Iniciar cefotaxima + albumina + suspender diuréticos permanentemente, pois diuréticos são contraindicados após episódio de PBE."}, "correta": "B", "explicacao": "O diagnóstico de PBE é confirmado com PMN ≥250/mm3 no líquido ascítico, independentemente da cultura (a cultura é negativa em até 40% dos casos — \"bacterascite cultura-negativa\"). Portanto, aguardar cultura (alternativa C) é erro grave — o tratamento é emergencial. A cefotaxima é primeira escolha empírica (não ciprofloxacino — alternativa D), com cobertura para os patógenos mais comuns (E. coli, Klebsiella). A albumina é mandatória — o RCT de Sort et al. com 126 pacientes demonstrou que a infusão no esquema 1,5 g/kg D1 + 1 g/kg D3 reduziu a mortalidade hospitalar de 29% para 10% e a incidência de SHR de 33% para 10%. O mecanismo é fisiopatológico: a PBE causa vasodilatação esplâncnica adicional (mediada por citocinas inflamatórias), reduzindo o volume arterial efetivo já comprometido na cirrose. A albumina restaura parcialmente a pressão oncótica e o volume circulante, prevenindo a cascata SRAA→vasoconstricção renal→SHR. A alternativa A erra ao restringir albumina a pacientes com disfunção renal prévia — o benefício é demonstrado para TODOS os pacientes com PBE. A alternativa E erra ao suspender diuréticos permanentemente; eles são suspensos durante o episódio agudo e reintroduzidos após resolução, conforme tolerância hemodinâmica. Referência: seções Complicações (PBE — diagnóstico, tratamento, albumina) e Fisiopatologia (cascata da ascite)."}, {"n": 3, "enunciado": "Homem, 63 anos, com cirrose alcoólica compensada (Child-Pugh A5, sem varizes à EDA). Elastografia hepática: 28 kPa. Plaquetas: 132.000/µL. Sem ascite, sem encefalopatia. O médico assistente questiona se há indicação de iniciar betabloqueador não seletivo (BBNS) mesmo na ausência de varizes. Baseado na evidência disponível, qual a conduta mais apropriada e qual a principal limitação dessa recomendação?", "alternativas": {"A": "Não iniciar BBNS, pois a indicação clássica requer varizes de médio/grande calibre ou sangramento prévio.", "B": "Iniciar BBNS (carvedilol 6,25 mg/dia), pois os critérios de Baveno VII (elastografia >20-25 kPa + plaquetas <150.000) indicam CSPH provável; o PREDESCI demonstrou redução de descompensação (HR 0,51), porém com as limitações de tamanho amostral modesto (201 pacientes) e IC tangenciando 1,0.", "C": "Solicitar cateterismo hepático para medir o HVPG antes de qualquer decisão, pois os critérios não invasivos não são validados.", "D": "Iniciar propranolol 40 mg 12/12h como primeira escolha, reservando carvedilol para intolerância.", "E": "Iniciar BBNS apenas após realizar EDA de controle em 6 meses para verificar surgimento de varizes."}, "correta": "B", "explicacao": "Este paciente preenche os critérios de Baveno VII para CSPH provável: elastografia >20-25 kPa E plaquetas <150.000/µL. Pelo consenso, esses pacientes podem iniciar BBNS sem necessidade de EDA ou cateterismo hepático (alternativa C — o cateterismo é padrão-ouro, mas os critérios não invasivos foram validados justamente para evitá-lo na maioria dos casos). O PREDESCI (2019) é o único RCT que randomizou 201 pacientes com cirrose compensada e CSPH (HVPG ≥10 mmHg) para BBNS vs. placebo, demonstrando HR 0,51 (IC 95% 0,26-0,97) para o desfecho composto de descompensação ou morte — taxa absoluta 16% vs. 27%, NNT ~9. As limitações que devem ser citadas: (1) tamanho amostral modesto (201 pacientes), (2) IC 95% tangenciando 1,0 (significância limítrofe), (3) desfecho composto agrupando eventos de gravidade distinta, (4) é o único RCT disponível nesse cenário. O carvedilol é preferido ao propranolol (Grau 2C) pelo triplo bloqueio (β1+β2+α1) e maior redução do HVPG — a alternativa D inverte a recomendação. A alternativa A ignora a mudança de paradigma: a indicação de BBNS expandiu-se para prevenção de descompensação em CSPH, não apenas profilaxia de sangramento varicoso. Referência: seções Tratamento (BBNS, PREDESCI) e Diagnóstico (elastografia, Baveno VII)."}, {"n": 4, "enunciado": "Mulher, 67 anos, com cirrose por hepatite C tratada (RVS há 3 anos), é internada com ascite tensa refratária a diuréticos. Na admissão: creatinina basal 0,9 mg/dL. No 3º dia de internação, após paracentese de alívio sem reposição de albumina, a creatinina sobe para 1,7 mg/dL (aumento de 0,8 mg/dL em 48h). Não responde à expansão com albumina 1 g/kg/dia por 2 dias consecutivos. Qual o diagnóstico mais provável, qual a classificação atualizada e qual o mecanismo fisiopatológico subjacente?", "alternativas": {"A": "Necrose tubular aguda por nefrotoxicidade — os rins na cirrose têm maior suscetibilidade a lesão tubular direta.", "B": "SHR-NAKI (antigo tipo 2) — disfunção renal crônica associada à ascite refratária.", "C": "SHR-AKI (antigo tipo 1) — vasoconstrição renal funcional extrema mediada pela ativação máxima do SRAA/simpático, em resposta à redução do volume arterial efetivo causada pela paracentese sem albumina.", "D": "Nefropatia por IgA — complicação comum na cirrose por hepatite C.", "E": "Lesão renal pré-renal simples — responderá a aumento do volume de albumina para 2 g/kg/dia."}, "correta": "C", "explicacao": "O quadro clínico é de SHR-AKI (anteriormente denominado SHR tipo 1) pela classificação ICA-AKI: aumento de creatinina ≥0,3 mg/dL em 48h (aqui: +0,8 mg/dL), sem resposta à expansão com albumina por 2 dias consecutivos. O precipitante claro foi a paracentese de grande volume sem reposição de albumina, o que agravou a redução do volume arterial efetivo. O mecanismo: na cirrose descompensada, a vasodilatação esplâncnica (mediada pelo excesso de NO) já é intensa. A retirada de grande volume de ascite sem albumina causa queda adicional da pressão oncótica e do retorno venoso → ativação máxima do SRAA, sistema nervoso simpático e vasopressina → vasoconstrição renal extrema. Os rins são histologicamente normais — trata-se de disfunção puramente funcional. A alternativa B (SHR-NAKI) é a forma crônica (antes tipo 2), associada à ascite refratária, com progressão lenta e creatinina mais estável — não se apresenta com deterioração aguda pós-paracentese. A alternativa E erra por definição: a não-resposta à albumina por 2 dias já exclui pré-renal simples — é esse critério que diferencia SHR-AKI de hipovolemia reversível. O tratamento requer terlipressina + albumina; mortalidade >80% sem tratamento. Referência: seções Complicações (SHR — classificação ICA-AKI, fisiopatologia) e Fisiopatologia (circulação hiperdinâmica)."}, {"n": 5, "enunciado": "Homem, 55 anos, com cirrose Child-Pugh C11, é trazido ao PS com confusão mental, inversão do ciclo sono-vigília e asterixis (flapping). Familiares referem episódio de hematêmese há 2 dias, tratado com ligadura elástica. Amônia sérica: 185 µmol/L (VR <47). Após 72h de tratamento com lactulose e rifaximina, o paciente melhora clinicamente: orientado, sem asterixis. A amônia de controle é 92 µmol/L (ainda elevada). Como interpretar a persistência da amônia elevada e qual a avaliação adequada da resposta terapêutica?", "alternativas": {"A": "A amônia ainda elevada indica falha terapêutica — deve-se associar neomicina oral ao esquema.", "B": "A melhora clínica é o critério que importa; a amônia sérica tem baixa correlação com a gravidade da EH porque é apenas uma das neurotoxinas envolvidas, e o nível sérico não reflete a concentração cerebral. A avaliação é clínica (estado mental, asterixis, capacidade funcional).", "C": "Deve-se repetir a amônia em 24h; se não normalizar, trocar lactulose por PEG (polietilenoglicol).", "D": "A amônia elevada confirma encefalopatia hepática mínima residual, que requer manutenção de rifaximina por 6 meses.", "E": "A queda da amônia para 92 µmol/L confirma resolução parcial; o paciente pode receber alta com acompanhamento ambulatorial em 30 dias."}, "correta": "B", "explicacao": "Esta questão testa uma armadilha clínica comum: a tentação de \"tratar o número\". A amônia sérica, embora elevada na maioria dos pacientes com EH, tem baixa correlação com a gravidade clínica por múltiplas razões: (1) a amônia é apenas uma das neurotoxinas envolvidas — manganês, mercaptanos, ácidos graxos de cadeia curta e falsos neurotransmissores também contribuem; (2) o nível sérico não reflete fielmente a concentração cerebral (diferente sensibilidade da barreira hematoencefálica entre indivíduos); (3) fatores pré-analíticos frequentemente confundem o resultado (torniquete, temperatura, tempo de transporte). A melhora clínica — orientação, resolução do asterixis, retorno da capacidade funcional — é o critério definitivo de resposta. A alternativa A erra ao considerar falha terapêutica baseada apenas no valor numérico. A alternativa D faz uma inferência indevida: a EH mínima é diagnosticada por testes psicométricos/neurofisiológicos específicos, não por amônia elevada isoladamente. A hemorragia GI (ligadura 2 dias antes) foi o precipitante: a hemoglobina digerida no TGI é substrato para amoniagênese bacteriana. Identificar e tratar precipitantes é tão importante quanto a terapia direta. A profilaxia secundária com lactulose + rifaximina está indicada após resolução do episódio. Referência: seções Complicações (EH — classificação, precipitantes, tratamento) e Flashcard 26 (amônia sérica)."}, {"n": 6, "enunciado": "Paciente com cirrose descompensada (Child-Pugh C10, ascite grau 3) é incluído em um ensaio clínico multicêntrico, randomizado, duplo-cego, que avalia simvastatina 40 mg + rifaximina 1200 mg/dia versus placebo para prevenção de nova descompensação. Após 18 meses, o estudo (237 pacientes) demonstra ausência de benefício no desfecho primário composto (descompensação adicional ou morte). Um colega seu argumenta: \"A simvastatina melhora a função endotelial e reduz o HVPG — como pode não funcionar na descompensada?\" Qual a melhor explicação mecanística para o resultado negativo deste estudo (LIVERHOPE)?", "alternativas": {"A": "A simvastatina não é potente o suficiente; atorvastatina teria sido a escolha correta.", "B": "A dose de simvastatina (40 mg) estava abaixo da dose terapêutica necessária para efeito hepático.", "C": "Na cirrose descompensada, o dano estrutural irreversível e a cascata neuro-humoral já ativada superam o componente funcional sobre o qual a simvastatina age — confirmando mecanisticamente o conceito de \"ponto de não retorno\" da descompensação.", "D": "A rifaximina antagonizou o efeito da simvastatina por indução enzimática hepática.", "E": "O resultado negativo se deve exclusivamente ao tamanho amostral insuficiente (erro tipo II)."}, "correta": "C", "explicacao": "Esta questão integra conceitos de fisiopatologia com leitura crítica de evidência. A simvastatina atua melhorando a função endotelial sinusoidal (aumentando a biodisponibilidade de NO intra-hepático), reduzindo assim o componente funcional (~30%) da hipertensão portal. Na cirrose compensada, esse componente funcional é proporcionalmente mais relevante e potencialmente modificável. Porém, na cirrose descompensada — como no LIVERHOPE —, o dano estrutural é avançado (fibrose extensiva, nódulos regenerativos distorcendo a arquitetura), e a cascata neuro-humoral (SRAA, simpático, vasopressina, ADH) já está maximamente ativada. O componente estrutural (~70%) domina, e os mecanismos compensatórios tornaram-se maladaptativos. É por isso que intervenções sobre a função endotelial isoladamente são insuficientes — seria como tentar consertar a torneira quando o cano estourou. Este resultado é uma confirmação mecanística do conceito de \"ponto de não retorno\" da descompensação. A alternativa E (erro tipo II) é uma possibilidade estatística, mas 237 pacientes fornecem poder razoável para detectar diferença clinicamente relevante, e a ausência de tendência favorável torna essa hipótese menos provável. O estudo não foi desenhado para comparar estatinas entre si (alternativa A), e não há evidência de interação rifaximina-simvastatina (alternativa D). Referência: seções Tratamento (LIVERHOPE) e Fisiopatologia (componentes estrutural/funcional, descompensação)."}, {"n": 7, "enunciado": "Mulher, 45 anos, obesa (IMC 38), com diagnóstico de cirrose há 1 ano. Investigação etiológica: anti-HCV negativo, HBsAg negativo, ferritina normal, ceruloplasmina normal, autoanticorpos negativos (FAN, anti-músculo liso, anti-LKM, anti-mitocôndria), alfa-1 antitripsina normal, etilismo negado e confirmado por familiares. O hepatologista registra \"cirrose criptogênica\" no prontuário. Qual a etiologia mais provável e qual a evidência que sustenta essa hipótese?", "alternativas": {"A": "Doença de Wilson de apresentação tardia — a ceruloplasmina normal não exclui o diagnóstico.", "B": "Hepatite autoimune soronegativa — deveria ser realizada biópsia hepática para detecção de hepatite de interface.", "C": "MASLD (burn-out NASH) — em séries de explantes, NASH oculta é identificada em 30-70% dos casos \"criptogênicos\"; a esteatose desapareceu com a progressão da fibrose, mas o perfil metabólico (obesidade, IMC 38) é compatível.", "D": "Cirrose por deficiência de alfa-1 antitripsina — o teste de triagem sérico pode ser falsamente normal.", "E": "Esteato-hepatite alcoólica oculta — o relato de abstinência de familiares é insuficiente para excluir etilismo."}, "correta": "C", "explicacao": "A \"cirrose criptogênica\" corresponde a 10-15% dos casos onde a etiologia não é determinada mesmo após investigação completa. Contudo, a maioria desses casos provavelmente representa MASLD/NASH em fase avançada (burn-out NASH). A evidência: (1) séries de explantes hepáticos identificaram NASH oculta em 30-70% dos pacientes rotulados como criptogênicos; (2) esses pacientes têm perfil metabólico similar ao NASH (obesidade, diabetes, dislipidemia); (3) o fenômeno de \"burn-out\" — desaparecimento da esteatose e da inflamação com a progressão da fibrose — explica por que a biópsia (e mesmo o explante) pode não mostrar achados típicos de NASH. Nesta paciente, o IMC de 38 é fortemente sugestivo. A investigação etiológica descrita é completa e adequada — não há indicação de investigar Wilson (alternativa A) com ceruloplasmina normal em mulher de 45 anos (a doença de Wilson se manifesta antes dos 40 na grande maioria). A alfa-1 antitripsina sérica é um teste de triagem adequado (alternativa D). A hepatite autoimune soronegativa existe, mas é diagnóstico de exceção quando a investigação sorológica E histológica são negativas — não há indicação de biopsia apenas para esse motivo neste contexto (alternativa B). Referência: seções Diagnóstico (etiologia, cirrose criptogênica, armadilhas diagnósticas)."}, {"n": 8, "enunciado": "Homem, 71 anos, com cirrose Child-Pugh B7 e ascite grau 2 controlada com espironolactona 100 mg + furosemida 40 mg, apresenta dor lombar intensa. O ortopedista prescreve ibuprofeno 600 mg 8/8h. Após 5 dias, o paciente retorna ao hepatologista com piora da ascite, edema periférico novo, ganho de 4 kg e creatinina elevada (de 1,0 para 1,8 mg/dL). Explique a cascata fisiopatológica desencadeada pelo ibuprofeno neste paciente:", "alternativas": {"A": "O ibuprofeno causou hepatotoxicidade direta, agravando a função hepática e precipitando descompensação.", "B": "O ibuprofeno inibiu a COX, removendo a síntese de prostaglandinas renais vasodilatadoras (PGE2, prostaciclina) que compensavam a vasoconstrição renal mediada pelo SRAA/simpático → insuficiência renal aguda + perda do balanço natriurético → retenção de sódio e água → piora da ascite.", "C": "O ibuprofeno interagiu com a espironolactona, causando hipercalemia grave e disfunção renal tubular.", "D": "O ibuprofeno inibiu a agregação plaquetária, causando sangramento GI oculto que levou à hipovolemia e azotemia pré-renal.", "E": "O ibuprofeno causou nefrite intersticial aguda medicamentosa, comprovada pelo padrão de lesão renal."}, "correta": "B", "explicacao": "Na cirrose com hipertensão portal, a vasodilatação esplâncnica ativa compensatoriamente o SRAA e o sistema nervoso simpático, causando vasoconstrição renal. As prostaglandinas renais (PGE2, prostaciclina) atuam como \"escudo protetor\" dos rins — são vasodilatadores locais que contrabalançam a vasoconstrição mediada pela angiotensina II e norepinefrina. Os AINEs (incluindo COX-2 seletivos) bloqueiam a ciclo-oxigenase, removendo essa proteção. Sem as prostaglandinas, a vasoconstrição renal fica sem oposição → queda da taxa de filtração glomerular → insuficiência renal aguda. Simultaneamente, a perda das prostaglandinas renais reduz a excreção de sódio → retenção hídrica → piora da ascite. Além disso, AINEs aumentam o risco de sangramento GI (varizes + coagulopatia da cirrose). A consequência prática: AINEs são ABSOLUTAMENTE contraindicados na cirrose com ascite. O paracetamol (≤2 g/dia) é o analgésico de escolha. Note que a alternativa C tem parcialmente razão (AINEs + espironolactona aumentam risco de hipercalemia), mas o mecanismo principal é a perda da vasodilatação renal compensatória, não a interação medicamentosa isolada. Referência: seções Tratamento (medicamentos a evitar — AINEs) e Fisiopatologia (circulação hiperdinâmica, SRAA)."}, {"n": 9, "enunciado": "Um residente de gastroenterologia apresenta ao preceptor um estudo de banco de dados administrativo com >26.000 pacientes comparando carvedilol vs. propranolol na cirrose. O estudo encontra RR 0,80 para morte (IC 0,69-0,92) e RR 0,83 para descompensação (IC 0,75-0,92) favorecendo carvedilol. O residente conclui: \"Está provado que carvedilol é superior ao propranolol — devemos trocar todos os pacientes.\" Qual a principal limitação metodológica que impede essa conclusão e como você argumentaria?", "alternativas": {"A": "O IC 95% inclui 1,0, portanto o resultado não é estatisticamente significativo.", "B": "A principal limitação é o viés de indicação (channeling bias): em estudos observacionais, pacientes que recebem carvedilol podem diferir sistematicamente daqueles que recebem propranolol; apenas um RCT head-to-head eliminaria essa confusão.", "C": "O tamanho amostral de 26.000 é excessivo e inflaciona artificialmente a significância estatística.", "D": "Bancos de dados administrativos são sempre inválidos para decisões clínicas.", "E": "A análise de sobrevida neste tipo de estudo não pode ser ajustada por covariáveis."}, "correta": "B", "explicacao": "Esta questão testa raciocínio crítico sobre qualidade de evidência. O estudo tem tamanho amostral substancial e resultados estatisticamente significativos (os ICs NÃO incluem 1,0 — alternativa A é factualmente errada), e há consistência mecanística (o triplo bloqueio β1+β2+α1 do carvedilol produz maior redução do HVPG que o bloqueio β1+β2 do propranolol). Porém, trata-se de um estudo observacional (banco de dados), não de um RCT. A principal ameaça à validade é o viés de indicação (channeling bias): médicos que prescrevem carvedilol podem ser mais atualizados, atender em centros de referência, ou selecionar pacientes com características diferentes daqueles que recebem propranolol. Mesmo com ajuste por covariáveis (que é possível — alternativa E está errada), confundidores residuais não mensuráveis persistem. A alternativa C comete o erro inverso: grande tamanho amostral é uma vantagem metodológica (reduz erro tipo II), não uma limitação — mas não compensa a falta de randomização. Bancos de dados administrativos NÃO são \"sempre inválidos\" (alternativa D) — fornecem evidência complementar valiosa, mas são hierarquicamente inferiores a RCTs para estabelecer causalidade. A conclusão adequada: o estudo gera hipótese e reforça a plausibilidade da superioridade do carvedilol, mas NÃO a comprova — é necessário um RCT head-to-head que, até o momento, não existe. Referência: seções Tratamento (carvedilol vs. propranolol, estudo de banco de dados) e Raciocínio Crítico (vieses, hierarquia de evidência)."}, {"n": 10, "enunciado": "Mulher, 48 anos, com cirrose por hepatite B (em tratamento com entecavir), Child-Pugh B8, varizes de esôfago de pequeno calibre, sem sangramento prévio. MELD-Na: 18. Apresenta ascite grau 2, encefalopatia grau 1 (inversão do sono, asterixis sutil). Ultrassom: nódulo hepático de 2,5 cm, hipervascular na fase arterial com washout na fase portal à TC trifásica. Quais são os critérios para referência a centro de transplante e quais indicações esta paciente preenche?", "alternativas": {"A": "Apenas o MELD-Na ≥18 justifica referência; as outras complicações são manejáveis clinicamente.", "B": "Deve-se aguardar progressão para Child-Pugh C antes de referenciar, pois Child B tem sobrevida de 80% em 1 ano.", "C": "A paciente preenche múltiplas indicações: MELD ≥15 (ela tem 18), primeira descompensação (ascite + EH), e CHC dentro dos critérios de Milão (nódulo único ≤5 cm). A referência deve ser precoce — mesmo com MELD \"baixo\", a trajetória de descompensação indica prognóstico reservado.", "D": "O CHC de 2,5 cm contraindica o transplante, pois indica doença neoplásica avançada.", "E": "Deve-se esperar a resolução do HBV (carga viral indetectável por >12 meses) antes de avaliar transplante."}, "correta": "C", "explicacao": "Esta paciente preenche pelo menos três critérios de referência a centro de transplante: (1) MELD ≥15 (ela tem MELD-Na 18) — marco tradicional de benefício de sobrevida pós-transplante; (2) primeira descompensação — a presença de ascite E encefalopatia documenta a transição para cirrose descompensada, com sobrevida mediana de ~2 anos sem transplante; (3) CHC dentro dos critérios de Milão — nódulo único ≤5 cm (ela tem 2,5 cm) com padrão vascular típico (hipervascularização arterial + washout portal), que é indicação de transplante como tratamento curativo. A alternativa A subestima a gravidade: o MELD isolado é apenas um dos critérios; as complicações clínicas (ascite, EH) importam independentemente do número. A alternativa B comete o erro de esperar deterioração adicional — a referência deve ser PRECOCE, pois a avaliação pré-transplante leva meses e a janela de oportunidade pode fechar. A alternativa D está incorreta: um CHC de 2,5 cm está BEM dentro dos critérios de Milão (nódulo único ≤5 cm OU até 3 nódulos ≤3 cm cada) — é precisamente uma das melhores indicações de transplante. A alternativa E também está errada: a hepatite B em tratamento com entecavir NÃO contraindica transplante; pelo contrário, o transplante com profilaxia antiviral pós-operatória tem excelentes resultados na cirrose por HBV. Referência: seções Tratamento (transplante — indicações, critérios de Milão) e Seguimento (MELD, prognóstico, marcos). Prova elaborada a partir de: Goldberg E, Chopra S. Cirrhosis in adults. UpToDate 2025/2026."}]}, {"id": "cirrose-complicacoes", "titulo": "Complicações da Cirrose", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Um paciente de 58 anos com cirrose por álcool (Child-Pugh B8) é internado com aumento do volume abdominal. Realiza-se paracentese diagnóstica: albumina do líquido ascítico = 0,8 g/dL, albumina sérica = 3,0 g/dL, proteína total do LA = 1,2 g/dL, PMN = 80/mm³. São retirados 6 litros de líquido ascítico. Qual conduta é obrigatória após a paracentese e qual o racional fisiopatológico?", "alternativas": {"A": "Infusão de solução salina 0,9% para reposição volêmica, pois a retirada de líquido causa hipovolemia absoluta.", "B": "Infusão de albumina 6-8 g por litro removido (36-48 g), pois previne a disfunção circulatória pós-paracentese (DCPP) causada pela ativação do SRAA.", "C": "Infusão de coloide sintético (amido), pois é equivalente à albumina com menor custo.", "D": "Nenhuma reposição é necessária, pois o volume removido foi inferior a 8 litros."}, "correta": "B", "explicacao": "A reposição de albumina é obrigatória quando > 5 litros são retirados na PGV. O racional é a prevenção da disfunção circulatória pós-paracentese (DCPP): a remoção de grande volume causa redução do volume arterial efetivo → ativação reflexa do SRAA ~6 dias após → hiponatremia, IRA e risco de morte. A albumina, como expansor plasmático com efeito oncótico prolongado, mantém o volume intravascular de forma superior a cristaloides e coloides sintéticos (estudos com amidos e cristaloides não demonstraram o mesmo benefício). A dose de 6-8 g/L removido foi estabelecida empiricamente e é amplamente aceita. A alternativa A está errada porque SF 0,9% não previne adequadamente a DCPP; a C está errada porque coloides sintéticos são inferiores à albumina; e a D está errada porque o limiar é 5 litros, não 8. (Ver Resumo, seção 3.3 — Ascite grau 3.)"}, {"n": 2, "enunciado": "Paciente com cirrose e ascite é internado por piora clínica. A paracentese mostra PMN = 420/mm³, cultura pendente, proteína total do LA = 0,9 g/dL, glicose = 110 mg/dL. Qual diagnóstico e conduta imediata?", "alternativas": {"A": "Peritonite bacteriana secundária — solicitar TC de abdome e avaliação cirúrgica.", "B": "PBE — iniciar cefotaxima 2 g IV 8/8h + albumina 1,5 g/kg no dia 1. Solicitar paracentese de controle em 48h.", "C": "Bacterascite não neutrocítica — aguardar resultado da cultura antes de tratar.", "D": "PBE — iniciar ciprofloxacino VO e reavaliar em 72h com nova paracentese."}, "correta": "B", "explicacao": "PMN ≥ 250/mm³ = PBE, independentemente da cultura. O tratamento deve ser iniciado imediatamente. A proteína total baixa (0,9 g/dL) e a glicose normal (110 mg/dL) afastam peritonite secundária (que requer 2 de 3: proteína > 1 g/dL, glicose < 50, LDH elevada). A cefotaxima IV é primeira linha; a albumina no esquema Sort (1,5 g/kg D1 + 1 g/kg D3) reduz IRA e mortalidade (NNT ~5). A paracentese de controle em 48h avalia a queda de PMN (espera-se ≥25%). A alternativa A confunde PBE com secundária; a C confunde com bacterascite (que requer PMN < 250 + cultura positiva); a D usa ciprofloxacino VO, que é alternativa inferior à cefalosporina parenteral na PBE estabelecida. (Ver Resumo, seções 4.2 e 4.3.)"}, {"n": 3, "enunciado": "Paciente cirrótico com ascite grau 2 em uso de espironolactona 200 mg/dia e furosemida 80 mg/dia apresenta creatinina de 1,8 mg/dL (basal 0,9 mg/dL há 2 meses). Após suspensão de diuréticos e expansão com albumina 1 g/kg/dia por 2 dias, a creatinina permanece em 1,7 mg/dL. Não há uso de nefrotóxicos, sem choque, USG renal normal, proteinúria < 200 mg/dia. Qual o diagnóstico e a primeira linha terapêutica?", "alternativas": {"A": "Necrose tubular aguda — suporte e aguardar recuperação renal.", "B": "SHR-AKI — iniciar terlipressina 1 mg IV 4-6h + albumina 20-40 g/dia.", "C": "AKI pré-renal — dobrar a dose de albumina por mais 48h.", "D": "Nefropatia por IgA — solicitar biópsia renal."}, "correta": "B", "explicacao": "O paciente preenche critérios de SHR-AKI: cirrose com ascite + AKI (Cr 1,8 vs basal 0,9 = aumento de 100%, AKI estágio 2) + sem resposta à albumina em 48h + sem choque + sem nefrotóxicos + sem doença parenquimatosa (USG normal, proteinúria < 500 mg/dia). A SHR-AKI é diagnóstico de exclusão, e o teste terapêutico com albumina já foi realizado. A primeira linha é terlipressina (agonista V1 → vasoconstrição esplâncnica → redistribuição do fluxo para os rins) + albumina. O estudo CONFIRM (n=300) mostrou reversão em 32% vs 17% com placebo. A NTA seria possível se houvesse nefrotóxicos ou sepse, mas não há; AKI pré-renal foi excluída pela falta de resposta à albumina. (Ver Resumo, seções 5.2 e 5.3.)"}, {"n": 4, "enunciado": "Um residente afirma que pacientes com encefalopatia hepática devem receber dieta hipoproteica (0,5 g/kg/dia) para reduzir a produção de amônia. Qual é o erro nesse raciocínio e qual a recomendação atual?", "alternativas": {"A": "O raciocínio está correto — a restrição proteica é a base do tratamento da EH.", "B": "O raciocínio está errado: a restrição proteica piora a sarcopenia, e o músculo é sítio extrahepático de metabolismo da amônia. A recomendação é 1,2-1,5 g/kg/dia + lanche noturno.", "C": "O raciocínio está parcialmente correto — restringir proteínas animais e substituir por vegetais é adequado.", "D": "O raciocínio está errado porque a fonte de amônia é exclusivamente bacteriana, não dietética."}, "correta": "B", "explicacao": "Este é um mito persistente que causa dano real. O raciocínio intuitivo (menos proteína → menos amônia) ignora que o músculo esquelético é o principal sítio extrahepático de metabolismo da amônia via glutamina sintetase. A restrição proteica causa sarcopenia → perda de massa muscular → menor clearance de amônia → piora da EH. Dois RCTs demonstraram que dieta normoproteica é segura e superior à restrição. A EASL 2022 recomenda enfaticamente 1,2-1,5 g/kg/dia de proteína, distribuída ao longo do dia, com lanche noturno de 50 g de carboidrato complexo para prevenir catabolismo noturno. Os BCAA podem ser úteis nos raros casos de intolerância proteica. A alternativa D está errada porque a fonte de amônia inclui tanto metabolismo bacteriano quanto desaminação de aminoácidos dietéticos e endógenos. (Ver Resumo, seção 6.5 — Nutrição na EH.)"}, {"n": 5, "enunciado": "Paciente com cirrose compensada tem elastografia hepática com LSM = 22 kPa e plaquetas = 180.000/μL. Um colega afirma que se pode dispensar a endoscopia de rastreio pois as plaquetas são normais. Por que esse raciocínio está incorreto?", "alternativas": {"A": "Porque as plaquetas precisam estar acima de 200.000 para dispensar a endoscopia.", "B": "Porque o critério do Baveno VII exige AMBOS: LSM < 20 kPa E plaquetas > 150.000. No caso, o LSM é ≥ 20, portanto a endoscopia é indicada independentemente das plaquetas.", "C": "Porque a elastografia hepática não tem valor para avaliar hipertensão portal.", "D": "Porque plaquetas normais indicam ausência de cirrose, não de varizes."}, "correta": "B", "explicacao": "O critério do Baveno VII para dispensar endoscopia é conjuntivo (E, não OU): LSM < 20 kPa E plaquetas > 150.000/μL. Ambos devem ser satisfeitos simultaneamente. Neste caso, o LSM é 22 kPa (≥ 20), o que já indica endoscopia independentemente das plaquetas. O colega avaliou apenas um dos dois critérios. Note que LSM 20-25 indica alta probabilidade de CSPH. O VPN do critério combinado é > 98% para varizes de alto risco, validado em >30 estudos. A armadilha é interpretar plaquetas normais como proteção suficiente quando a rigidez hepática já ultrapassou o limiar. (Ver Resumo, seção 7.2 — Baveno VII.)"}, {"n": 6, "enunciado": "Paciente com cirrose (Child-Pugh C, 11 pontos) apresenta hematêmese volumosa. Na admissão, Hb = 6,2 g/dL. O plantonista inicia cristaloides e solicita 4 unidades de concentrado de hemácias para atingir Hb alvo de 10 g/dL. Simultaneamente, prescreve terlipressina 2 mg IV e ceftriaxona 1 g IV. A endoscopia está agendada para 10h (dentro de 12h). Qual elemento da conduta do plantonista está errado e por quê?", "alternativas": {"A": "A terlipressina deveria ser substituída por octreotide, pois é contraindicada no Child C.", "B": "O alvo de Hb deveria ser 7-8 g/dL (transfusão restritiva) — a hiper-transfusão para 10 g/dL pode aumentar a pressão portal e agravar o sangramento.", "C": "A ceftriaxona deveria ser administrada apenas após a endoscopia, pois a antibioticoprofilaxia é indicada somente se houver evidência de infecção.", "D": "A endoscopia deveria ser realizada em 24h, não em 12h."}, "correta": "B", "explicacao": "A terlipressina e a ceftriaxona estão corretas (devem ser iniciadas na admissão, antes da endoscopia). A endoscopia em <12h também está correta. O erro é o alvo transfusional de 10 g/dL. A estratégia deve ser restritiva: meta de Hb 7-8 g/dL. A hiper-transfusão causa expansão volêmica → aumento do fluxo esplâncnico → aumento da pressão portal → agravamento do sangramento varicoso. Isso é paradoxal mas bem estabelecido: transfundir menos é mais seguro. Ademais, este paciente é Child-Pugh C (11 pontos), candidato a TIPS pré-emptiva nas primeiras 72h (idealmente 24h) — esta seria outra medida a discutir, embora não esteja entre as alternativas. (Ver Resumo, seção 7.6 — HVA.)"}, {"n": 7, "enunciado": "Paciente de 62 anos com cirrose por HCV (RVS obtida há 18 meses com AADs) e história de ascite prévia. Atualmente sem ascite há 14 meses sem uso de diuréticos, sem episódios de EH ou sangramento varicoso. Albumina sérica 3,8 g/dL, bilirrubina 1,1 mg/dL, INR 1,2. Um colega diz que esse paciente ainda deve ser listado para transplante pois \"cirrose descompensada é irreversível\". Como você avalia essa afirmação à luz do Baveno VII?", "alternativas": {"A": "O colega está correto — descompensação é sempre irreversível na cirrose.", "B": "O paciente preenche critérios de recompensação do Baveno VII (remoção do fator etiológico + ≥12 meses sem descompensação sem fármacos + melhora da função hepática). A descompensação pode ser reversível, embora os critérios ainda aguardem validação prospectiva em grandes coortes.", "C": "O paciente não pode ser considerado recompensado pois faz menos de 24 meses de RVS.", "D": "A recompensação só se aplica a cirrose alcoólica, não a HCV."}, "correta": "B", "explicacao": "O Baveno VII formalizou o conceito de recompensação. Os três critérios estão presentes: 1) Remoção sustentada do fator etiológico (RVS por AADs há 18 meses); 2) Ausência de ascite, EH e sangramento por ≥12 meses sem tratamento farmacológico (14 meses sem diuréticos); 3) Melhora sustentada da função hepática (albumina 3,8, bilirrubina 1,1, INR 1,2 — todos em faixa favorável). A descompensação não é necessariamente um ponto de não retorno. Entretanto, é fundamental registrar a nota de leitura crítica: os critérios ainda precisam de validação prospectiva em grandes coortes. A maioria dos dados vem de HCV pós-RVS e hepatite alcoólica pós-abstinência. Não existe prazo mínimo de 24 meses; o critério é ≥12 meses. (Ver Resumo, seção 11 — Recompensação.)"}, {"n": 8, "enunciado": "Paciente com cirrose e ascite refratária (em PGV seriada) apresenta Na sérico de 118 mEq/L com confusão mental. Um residente propõe infusão de solução salina 0,9% para corrigir o sódio. Por que essa conduta é inadequada e qual a abordagem correta?", "alternativas": {"A": "A SF 0,9% é adequada — basta infundir lentamente para evitar mielinólise.", "B": "A hiponatremia do cirrótico é dilucional (excesso de ADH → excesso de água livre). O sódio corporal total está aumentado, não diminuído. SF 0,9% piora a ascite sem corrigir a diluição. Abordagem: restrição hídrica + considerar salina hipertônica 3% com cautela (correção máxima 8-10 mEq/L/24h) ± tolvaptan como ponte.", "C": "A hiponatremia é por perda renal de sódio — a conduta correta é suspender espironolactona e repor sódio.", "D": "A confusão mental é por EH, não por hiponatremia — tratar com lactulose sem corrigir o sódio."}, "correta": "B", "explicacao": "A hiponatremia do cirrótico é dilucional (hipervolêmica), causada pela secreção não osmótica de ADH em resposta ao subpreenchimento arterial. O sódio corporal total está aumentado (retido pelo SRAA). Administrar SF 0,9% adiciona sódio e água, mas o ADH retém a água → piora da diluição e da ascite. A abordagem é restrição hídrica (1-1,5 L/dia), ajuste de diuréticos (suspender furosemida, que pode exacerbar), e para Na < 120 com sintomas, considerar salina hipertônica 3% com correção lenta (máx 8-10 mEq/L/24h para evitar mielinólise pontina). Tolvaptan (antagonista V2) causa aquarese seletiva (excreção de água livre sem natriurese), mas não demonstrou impacto em desfechos duros e tem risco de hepatotoxicidade — uso restrito como ponte para transplante. A confusão pode ser mista (hiponatremia + EH), mas com Na 118, a hiponatremia é contribuinte relevante e precisa ser abordada. (Ver Resumo, seções 8.1 e 8.2.)"}, {"n": 9, "enunciado": "Paciente cirrótico com derrame pleural à direita volumoso é diagnosticado com hidrotórax hepático. O cirurgião torácico sugere drenagem torácica fechada para alívio. Qual o problema dessa conduta?", "alternativas": {"A": "A drenagem torácica é a conduta de primeira linha no hidrotórax hepático.", "B": "Dreno de tórax é contraindicado no hidrotórax hepático: risco de infecção, perda proteica contínua e fistulização. O manejo deve espelhar o da ascite (diuréticos, restrição de sódio, toracocentese terapêutica pontual) e TIPS em casos refratários.", "C": "A drenagem é adequada desde que associada a pleurodese.", "D": "O dreno é seguro, mas deve ser mantido por no máximo 24h."}, "correta": "B", "explicacao": "O dreno de tórax é formalmente contraindicado no hidrotórax hepático. Os microdefeitos diafragmáticos permitem fluxo contínuo de líquido ascítico para o tórax, e um dreno criaria drenagem ininterrupta → perda proteica maciça, desidratação, risco de infecção e fistulização (comunicação persistente pleurodérmica). O manejo correto é idêntico ao da ascite: diuréticos (espironolactona + furosemida, mesmas doses e mesma lógica), restrição de sódio, e toracocentese terapêutica pontual para alívio de dispneia. Se refratário, TIPS é a opção. A pleurodese também tem alta taxa de falha pelo mecanismo contínuo. O transplante hepático é o tratamento definitivo. Lembrar que pode ocorrer EBE (empiema bacteriano espontâneo) — toracocentese diagnóstica é obrigatória no primeiro episódio. (Ver Resumo, seção 9.)"}, {"n": 10, "enunciado": "Um paciente com cirrose compensada e CSPH confirmada por HVPG de 12 mmHg, sem varizes na EDA, é avaliado para profilaxia. Um colega sugere não iniciar nenhum tratamento pois \"sem varizes, não há indicação de betabloqueador\". Baseado no estudo PREDESCI, como você argumentaria?", "alternativas": {"A": "O colega está correto — BBNS só são indicados quando há varizes.", "B": "O estudo PREDESCI demonstrou que BBNS (carvedilol ou propranolol) reduziram o risco de primeira descompensação (HR 0,51) em pacientes com CSPH, mesmo sem varizes. O benefício foi mais marcante para prevenção de ascite. Portanto, a CSPH confirmada, e não a presença de varizes, é a indicação para iniciar carvedilol 6,25 mg/dia.", "C": "BBNS devem ser iniciados apenas se HVPG ≥ 16 mmHg.", "D": "BBNS estão contraindicados em pacientes sem varizes devido ao risco de hipotensão. \\pagebreak"}, "correta": "B", "explicacao": "Este é o conceito do PREDESCI (RCT, n=201): BBNS reduziram a primeira descompensação (HR 0,51; IC 95% 0,26-0,97) em pacientes com CSPH (HVPG ≥ 10), inclusive sem varizes. O benefício foi mais marcante para prevenção de ascite. Isso mudou o paradigma: a CSPH, não a presença de varizes, é o gatilho para intervenção farmacológica. O carvedilol é preferido (6,25 → 12,5 mg/dia) pelo efeito α1 adicional que promove vasodilatação intra-hepática. Limitações do PREDESCI: n modesto, seleção por HVPG (invasivo), não desenhado para mortalidade. Ainda assim, incorporado pelo Baveno VII e AASLD 2024. O Baveno VII também expandiu a avaliação não invasiva da CSPH (Regra dos Cinco), mas no caso do paciente já há HVPG invasivo confirmando CSPH. (Ver Resumo, seções 7.3 e 7.4.)"}]}, {"id": "tuberculose", "titulo": "Tuberculose", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Um homem de 45 anos, tabagista, apresenta tosse produtiva há 5 semanas, febre vespertina, sudorese noturna e perda de 6 kg. A radiografia de tórax mostra cavitação no lobo superior direito. A baciloscopia do escarro é positiva (++). Com base na fisiopatologia das populações bacilares, a cavidade pulmonar contém predominantemente:", "alternativas": {"A": "Bacilos da população B, em crescimento intermitente, com pH ácido intracavitário.", "B": "Bacilos da população C, no interior de macrófagos alveolares, em metabolismo latente.", "C": "Bacilos da população A, em multiplicação ativa (10⁷–10⁹), em pH neutro — o que explica a positividade da baciloscopia.", "D": "Bacilos \"dormentes\" (população D), metabolicamente inativos, inacessíveis aos fármacos atuais.", "E": "Uma mistura equitativa das três populações, sem predomínio de nenhuma."}, "correta": "C", "explicacao": "A cavidade pulmonar abriga predominantemente bacilos da população A — bacilos extracelulares em multiplicação geométrica rápida, em ambiente com pH neutro e alta tensão de oxigênio. Essa é a maior população bacilar (10⁷–10⁹ bacilos), responsável pela transmissibilidade e pela positividade da baciloscopia. A população B (caseosa/granuloma) está no interior do caseo, em pH ácido, com crescimento intermitente — responsável pelas recidivas. A população C (intramacrofágica) está dentro de macrófagos, em metabolismo lento. A distinção é clinicamente essencial: a isoniazida é o fármaco mais potente contra a população A (efeito bactericida precoce), enquanto a rifampicina e a pirazinamida são mais eficazes contra as populações B e C (efeito esterilizante). É por isso que a fase intensiva (2 meses com RHZE) visa negativar rapidamente o escarro (eliminar população A), enquanto a fase de manutenção (4 meses com RH) visa eliminar as populações B e C, prevenindo recidiva. (Ver Resumo, seção 3.4 — Três populações bacilares.)"}, {"n": 2, "enunciado": "Uma paciente de 32 anos, PVHIV com CD4 de 38 cél/mm³, é diagnosticada com TB pulmonar (TRM-TB positivo, sem resistência a rifampicina). O esquema de tratamento anti-TB é iniciado. Sobre o manejo da terapia antirretroviral (TARV), a conduta mais adequada é:", "alternativas": {"A": "Iniciar TARV imediatamente, no mesmo dia do início do tratamento da TB.", "B": "Aguardar 8 semanas para iniciar TARV, reduzindo o risco de SIR.", "C": "Iniciar TARV em até 2 semanas, apesar do risco aumentado de SIR, porque o risco de morte por imunossupressão não tratada supera o risco de SIR nesse nível de CD4.", "D": "Iniciar TARV somente após cultura negativa do escarro, confirmando resposta ao tratamento da TB.", "E": "Postergar TARV até completar a fase intensiva (2 meses) para evitar interações medicamentosas com pirazinamida."}, "correta": "C", "explicacao": "Em PVHIV com CD4 < 50 cél/mm³, o TARV deve ser iniciado em até 2 semanas após o início do tratamento da TB. A lógica é um balanceamento de riscos: nesse nível de imunossupressão, o risco de morte por infecções oportunistas (sem TARV) supera substancialmente o risco de SIR (com TARV precoce). A evidência vem de revisão sistemática (Uthman et al., 2015) demonstrando redução significativa de mortalidade com TARV precoce em CD4 < 50. O risco de SIR é real (8-43%), mas a SIR geralmente é manejável com corticoides e não justifica postergar o TARV. A alternativa B (aguardar 8 semanas) seria correta apenas se CD4 ≥ 50. A exceção importante é a TB meningoencefálica, na qual o TARV precoce NÃO reduz mortalidade e AUMENTA complicações neurológicas — nesse caso, aguardar 2 meses. (Ver Resumo, seções 5.2 — Coinfecção TB-HIV e 6.3 — SIR.)"}, {"n": 3, "enunciado": "Um paciente de 55 anos, sem comorbidades, está no 3º mês de tratamento com Esquema Básico (2RHZE/4RH) quando apresenta icterícia, náuseas intensas e astenia. O hepatograma mostra TGO = 420 U/L e TGP = 510 U/L (> 5× o LSN). A conduta correta e a sequência de reintrodução dos fármacos são:", "alternativas": {"A": "Suspender apenas isoniazida e pirazinamida (os hepatotóxicos) e manter RE.", "B": "Suspender todos os fármacos; após normalização, reintroduzir na ordem: RE → RE+H → RE+HZ, com intervalos de 3-7 dias.", "C": "Suspender todos e trocar por esquema alternativo sem hepatotóxicos permanentemente (5 Cm E Lfx / 7 E Lfx).", "D": "Manter esquema inalterado com monitorização quinzenal do hepatograma, pois elevação isolada de transaminases é esperada.", "E": "Suspender todos; reintroduzir na ordem: HZ → HZ+R → HZ+RE, priorizando os fármacos de maior atividade bactericida."}, "correta": "B", "explicacao": "Com TGO/TGP > 5× o LSN (mesmo sem sintomas — e aqui há sintomas), a conduta é suspender TODOS os fármacos, aguardar normalização das enzimas hepáticas, e reintroduzir sequencialmente na ordem: RE → RE+H → RE+HZ (intervalos de 3-7 dias). A lógica da sequência é iniciar pelos fármacos menos hepatotóxicos (rifampicina e etambutol) e acrescentar progressivamente os mais hepatotóxicos (isoniazida, depois pirazinamida — o principal hepatotóxico do esquema). A alternativa A está errada porque, embora H e Z sejam os principais hepatotóxicos, a suspensão parcial não é a conduta preconizada — R também pode ser hepatotóxica, e todos devem ser suspensos. A alternativa E está errada na ordem de reintrodução: reintroduzir HZ primeiro significaria reexpor o paciente imediatamente aos dois fármacos mais hepatotóxicos. Se houver intolerância na reintrodução de Z, mantém-se REH por 9 meses; se intolerância a H, substitui-se por levofloxacino. (Ver Resumo, seções 5.2 — Hepatopatia e 6.2 — Reações maiores.)"}, {"n": 4, "enunciado": "Uma criança de 4 anos, contato domiciliar de mãe com TB pulmonar bacilífera, é assintomática, com radiografia de tórax normal. A prova tuberculínica (PT) realizada 10 semanas após o diagnóstico materno mostra enduração de 12 mm. A conduta mais adequada é:", "alternativas": {"A": "Repetir a PT em 8 semanas, pois 12 mm pode ser efeito da BCG.", "B": "Iniciar Esquema Básico (2RHZ/4RH), pois a PT positiva confirma TB ativa.", "C": "Solicitar TRM-TB no escarro para confirmar TB antes de qualquer tratamento.", "D": "Iniciar tratamento de ILTB após exclusão de TB ativa, pois a criança é contato de caso bacilífero com PT ≥ 5 mm.", "E": "Observar clinicamente sem intervenção, pois 90% dos infectados não adoecem."}, "correta": "D", "explicacao": "A criança é contato domiciliar de caso bacilífero, assintomática, com radiografia normal e PT ≥ 5 mm. Isso configura ILTB (não TB ativa), e o limiar de 5 mm se aplica a contatos de TB bacilífera. A conduta é iniciar tratamento de ILTB (6H, 9H, 3HP ou 4R, conforme disponibilidade e contexto clínico). A alternativa A está errada: embora a BCG possa causar falso-positivo na PT, uma enduração de 12 mm em contato de caso bacilífero, 10 semanas após exposição, é muito mais provavelmente infecção verdadeira do que efeito vacinal — especialmente considerando que o limiar é apenas 5 mm para esse grupo de risco. A alternativa B está errada porque a criança é assintomática com Rx normal — não há TB ativa. A alternativa E é irresponsável: embora 90% dos infectados não adoeçam ao longo da vida, o risco é maior em crianças (especialmente < 5 anos), e o tratamento de ILTB reduz o risco de progressão em 60-90%. (Ver Resumo, seções 4.7 — Diagnóstico da ILTB e 5.3 — Tratamento da ILTB.)"}, {"n": 5, "enunciado": "Sobre o Teste Rápido Molecular (TRM-TB/GeneXpert), um colega afirma: \"Se o TRM-TB for negativo, podemos descartar TB e não precisamos solicitar cultura.\" Qual argumento você utilizaria para refutar essa afirmação?", "alternativas": {"A": "O TRM-TB tem especificidade de apenas 80%, gerando muitos falsos positivos — o problema é excesso de diagnóstico, não de subdiagnóstico.", "B": "A sensibilidade do TRM-TB é de ~90% em adultos, mas ~66% em crianças, e não substitui a cultura porque: (1) 10% dos adultos com TB terão TRM-TB negativo; (2) a cultura é o único método que fornece teste de sensibilidade completo a todos os fármacos; (3) em crianças, a amostra é frequentemente paucibacilar.", "C": "O TRM-TB detecta apenas resistência a isoniazida, não a rifampicina, e por isso a cultura é indispensável.", "D": "O TRM-TB é útil apenas para TB extrapulmonar e não deve ser usado como teste inicial em TB pulmonar.", "E": "A cultura é necessária apenas em retratamentos, não em casos novos com TRM-TB negativo."}, "correta": "B", "explicacao": "O TRM-TB tem sensibilidade de ~90% em adultos (ou seja, ~10% dos casos de TB terão TRM-TB negativo) e ~66% em crianças (onde a amostra é frequentemente paucibacilar). Além disso, o TRM-TB detecta resistência apenas à rifampicina (mutações em rpoB), não a outros fármacos — a cultura com teste de sensibilidade é indispensável para guiar esquemas em caso de resistência. A alternativa C inverte: o TRM-TB detecta resistência a rifampicina, não a isoniazida. O ponto essencial é que um resultado negativo no TRM-TB não exclui TB — daí a necessidade de sempre solicitar cultura (padrão-ouro) em conjunto, especialmente em populações de alto risco e em crianças. (Ver Resumo, seção 4.2 — Métodos bacteriológicos.)"}, {"n": 6, "enunciado": "Um paciente diabético em tratamento para TB pulmonar com Esquema Básico (2RHZE/4RH) apresenta descontrole glicêmico importante, apesar de estar usando metformina e glibenclamida. O mecanismo farmacológico que melhor explica esse descontrole é:", "alternativas": {"A": "A pirazinamida bloqueia diretamente a secreção pancreática de insulina.", "B": "A isoniazida causa resistência insulínica periférica por depleção de piridoxina.", "C": "A rifampicina, como potente indutora do CYP450, acelera o metabolismo hepático das sulfonilureias (glibenclamida), reduzindo seus níveis séricos e seu efeito hipoglicemiante.", "D": "O etambutol causa pancreatite medicamentosa, comprometendo a função endócrina pancreática.", "E": "A associação de múltiplos fármacos hepatotóxicos eleva a gliconeogênese hepática por estresse oxidativo."}, "correta": "C", "explicacao": "A rifampicina é um potente indutor do CYP450 (especialmente CYP3A4), acelerando o metabolismo hepático de diversos fármacos, incluindo as sulfonilureias (glibenclamida). O resultado é a redução dos níveis séricos da glibenclamida, com perda do efeito hipoglicemiante. A conduta recomendada é monitorizar glicemia de perto e considerar insulinoterapia durante o tratamento da TB, pois o efeito indutor da rifampicina persiste durante todo o período de uso. A metformina não é significativamente afetada pela rifampicina (é eliminada por via renal, não por metabolismo hepático CYP-dependente). (Ver Resumo, seções 5.2 — Diabetes mellitus e 6.4 — Interações medicamentosas da rifampicina.)"}, {"n": 7, "enunciado": "Um recém-nascido (RN) é filho de mãe com TB pulmonar bacilífera diagnosticada no momento do parto. O RN é assintomático, sem sinais de TB congênita. A conduta neonatal recomendada pelo Ministério da Saúde é:", "alternativas": {"A": "Administrar BCG imediatamente + isoniazida profilática por 6 meses.", "B": "Não administrar BCG → iniciar isoniazida (H) ou rifampicina (R) por 3 meses → realizar PT → se PT ≥ 5 mm, completar tratamento de ILTB e não vacinar BCG; se PT < 5 mm, suspender tratamento e vacinar BCG.", "C": "Isolar o RN da mãe e observar por 3 meses sem medicação.", "D": "Administrar BCG + iniciar Esquema Básico completo (2RHZ/4RH) até descarte de TB congênita.", "E": "Iniciar IGRA e, conforme resultado, decidir sobre tratamento preventivo."}, "correta": "B", "explicacao": "O protocolo brasileiro para RN coabitante de caso bacilífero é: (1) NÃO vacinar BCG ao nascimento; (2) iniciar quimioprofilaxia com H ou R por 3 meses; (3) realizar PT; (4) se PT ≥ 5 mm → completar tratamento de ILTB e não vacinar BCG (o bacilo vacinal pode causar doença disseminada se administrado em imunossuprimidos, e a PT positiva confirma resposta imune ao M. tuberculosis — a BCG seria redundante e poderia confundir futuras avaliações); (5) se PT < 5 mm → suspender tratamento e vacinar BCG (não houve infecção, e a criança precisa da proteção vacinal). A alternativa A está errada porque administrar BCG em contato de caso bacilífero pode resultar em BCGite disseminada se o lactente tiver ILTB, e vacina e tratamento simultâneos confundem a interpretação da PT posterior. (Ver Resumo, seção 5.3 — Quimioprofilaxia primária, e Figura 4.)"}, {"n": 8, "enunciado": "Um homem de 28 anos, previamente hígido, apresenta derrame pleural unilateral à direita. A toracocentese revela líquido exsudativo, linfocítico, com proteínas de 4,8 g/dL e ADA de 62 U/L. A baciloscopia do líquido pleural é negativa. A conduta diagnóstica mais adequada, considerando as limitações de cada método, é:", "alternativas": {"A": "Repetir a baciloscopia do líquido pleural em 48 horas, pois a sensibilidade é de 60-80%.", "B": "Iniciar tratamento empírico para pneumonia com macrolídeo e reavaliar em 7 dias.", "C": "Solicitar biópsia pleural (cultura + histopatológico), pois o ADA > 40 U/L com exsudato linfocítico tem sensibilidade de 93%/especificidade de 97% para TB pleural, e a baciloscopia do líquido pleural tem sensibilidade de apenas ~5%.", "D": "Solicitar TRM-TB sérico, pois a forma extrapulmonar exige diagnóstico molecular sistêmico.", "E": "Considerar sarcoidose como primeira hipótese, dado o ADA elevado e derrame linfocítico."}, "correta": "C", "explicacao": "O quadro é altamente sugestivo de TB pleural: adulto jovem + derrame pleural exsudativo + predomínio linfocítico + ADA > 40 U/L (sensibilidade de 93%, especificidade de 97%). A baciloscopia do líquido pleural é negativa, o que é esperado — sua sensibilidade nesse cenário é de apenas ~5%, porque a concentração bacilar no líquido pleural é muito baixa (a fisiopatologia é uma reação de hipersensibilidade tardia ao bacilo, não infecção direta do espaço pleural). A cultura do líquido tem sensibilidade de 30-40%. O método diagnóstico de maior rendimento é a biópsia pleural (granuloma caseoso em 70-80%), que combinada com cultura do fragmento ultrapassa 90% de sensibilidade diagnóstica. A alternativa A está errada porque repetir a baciloscopia não melhora a sensibilidade (~5%). A alternativa E está incorreta: na sarcoidose, o granuloma é NÃO caseoso, e o ADA tende a ser < 40 U/L. (Ver Resumo, seções 4.4 — TB extrapulmonar e 4.5 — TB pleural.)"}, {"n": 9, "enunciado": "Um paciente coinfectado TB-HIV está em tratamento com Esquema Básico e TARV baseado em TDF + 3TC + DTG. O infectologista questiona se deve substituir rifampicina por rifabutina. Em relação a essa decisão, considere as seguintes afirmativas: I. A rifampicina reduz os níveis séricos de dolutegravir em ~50% por indução do CYP3A4 e UGT1A1. II. A solução quando se mantém rifampicina é dobrar a dose de DTG para 50 mg 2×/dia. III. A rifabutina induz o CYP450 em menor grau que a rifampicina, permitindo manter DTG em dose padrão. IV. A principal desvantagem da rifabutina é a impossibilidade de dose fixa combinada, com potencial impacto na adesão. Estão corretas:", "alternativas": {"A": "Apenas I e III.", "B": "Apenas I, II e IV.", "C": "Apenas II e III.", "D": "I, II, III e IV.", "E": "Apenas II, III e IV."}, "correta": "D", "explicacao": "Todas as afirmativas estão corretas. (I) A rifampicina realmente reduz os níveis de DTG em ~50%, exigindo ajuste. (II) A solução com rifampicina é dobrar a dose de DTG para 50 mg 2×/dia — essa é a conduta preconizada quando se opta por manter R no esquema anti-TB. (III) A rifabutina é uma indutora menos potente do CYP450, permitindo manter DTG em dose padrão (50 mg 1×/dia). (IV) A principal desvantagem prática da rifabutina é que não existe em formulação de dose fixa combinada com HZE — o paci
