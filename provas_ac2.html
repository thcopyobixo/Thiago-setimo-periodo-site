6.4). Com instabilidade, a conduta é pericardiocentese guiada por imagem; na emergência, via subxifoide ou apical. C é errada: RMC e TC não são recomendadas de rotina para tamponamento — atrasariam a conduta num paciente instável. D confunde tamanho com repercussão: o tamponamento depende da velocidade de acúmulo e da reserva pericárdica (curva em \"J\", seção 3.1)."}, {"n": 6, "enunciado": "Homem de 29 anos com miocardite internado em hospital sem ECMO. No 2º dia, PA 82/50 mmHg, lactato 4,1 mmol/L, FEVE 25% com disfunção do VD; iniciada dobutamina, com melhora parcial da PA. Qual a conduta mais adequada?", "alternativas": {"A": "Manter dobutamina e observar 72 horas, pois a miocardite fulminante costuma recuperar melhor que as formas não fulminantes.", "B": "Associar ibuprofeno 800 mg 3×/dia para a dor torácica.", "C": "Transferir com urgência para centro de IC avançada com time de miocardite, com possibilidade de SCT (VA-ECMO ou suporte biventricular), BEM e imunossupressão conforme o histotipo.", "D": "Aguardar RMC para confirmar o diagnóstico antes de qualquer transferência."}, "correta": "C", "explicacao": "Hipotensão com necessidade de inotrópico define estágio D, com 27–35% de morte ou transplante em 6 meses (seção 6.1). A fonte é explícita: quem precisa de inotrópico deve ser transferido para centro de IC avançada, porque a deterioração pode ser rápida; como a miocardite costuma ser biventricular, VA-ECMO ou suporte biventricular é frequente, e a BEM orienta a imunossupressão (seção 7.5). A armadilha é A: a crença de que o fulminante \"recupera melhor\" foi contrariada por dados recentes (25,5% de morte/Tx intra-hospitalar no fulminante vs 0% nas formas menos graves). B é errada: AINE deve ser evitado no estágio D. D atrasa uma transferência que pode se tornar inviável."}, {"n": 7, "enunciado": "Mulher de 40 anos em uso de pembrolizumabe (inibidor de checkpoint) para melanoma, assintomática, com hs-cTnI subindo de 8 para 950 ng/L em exames de vigilância; ECG com BRD novo; coronárias normais. Classificação e conduta:", "alternativas": {"A": "Estágio A — apenas manter vigilância.", "B": "Estágio B — no contexto de ICI, a elevação aguda e acentuada de troponina sem DAC pode bastar para o diagnóstico; há indicação de BEM e de imunossupressão, com suspensão do ICI.", "C": "Estágio C — internar e iniciar apenas TMOD para IC.", "D": "Estágio B — sem indicação de BEM, pois está assintomática."}, "correta": "B", "explicacao": "Paciente assintomática, com fator de risco (ICI) e evidência de lesão = estágio B. No contexto de ICI, uma elevação aguda e acentuada de troponina, sem DAC, pode bastar para o diagnóstico (Figura 2); o BRD novo reforça o envolvimento do sistema de condução. O estágio B em uso de ICI é exatamente a exceção em que a BEM está indicada (seção 5.1), e a miocardite por ICI está na lista de consenso para imunossupressão, com suspensão do fármaco desencadeante (seção 7.5). A armadilha é D: \"assintomático = sem biópsia\" vale para o estágio B não relacionado a ICI. A ignora a evidência de lesão; C confunde os estágios (C exige sintomas)."}, {"n": 8, "enunciado": "Um colega lê o ensaio de rilonacepte (RHAPSODY), em que a recorrência foi muito baixa durante o tratamento, e conclui: \"o rilonacepte cura a pericardite recorrente; posso suspendê-lo após 6 meses em qualquer paciente, inclusive com PCR normal\". Que argumentos você usaria para corrigi-lo?", "alternativas": {"A": "Nenhum; a conclusão está correta.", "B": "Os ensaios incluíram pacientes com PCR > 1 mg/dL (fenótipo inflamatório); 50–75% recorrem ao suspender; a extensão de longo prazo apoia tratar além de 18 meses — o fármaco controla, não cura.", "C": "O rilonacepte foi testado apenas na pericardite aguda.", "D": "O problema é só o custo; a eficácia independe de fenótipo."}, "correta": "B", "explicacao": "Três argumentos de leitura crítica (seção 7.2): (1) validade externa — os ensaios de anti-IL-1 incluíram pacientes com PCR > 1 mg/dL, ou seja, fenótipo inflamatório; extrapolar para PCR normal não tem base; (2) desfecho durante o tratamento ≠ cura — 50–75% recorrem ao suspender, o que confirma mecanisticamente que a alça IL-1 continua armada; (3) a extensão de longo prazo do RHAPSODY apoia tratar além de 18 meses, e a duração ideal e a forma de suspender continuam indefinidas. Vale acrescentar o contexto de conflito de interesse dos autores com o fabricante (seção 1). C é falsa (o RHAPSODY é em recorrente), e D ignora a seleção dos ensaios."}, {"n": 9, "enunciado": "Rapaz de 19 anos, jogador de futebol, teve miocardite estágio C de baixo risco (FEVE normal, sem LGE) há 4 meses. Assintomático. Quer voltar a competir. Conduta adequada:", "alternativas": {"A": "Liberar sem exames, pois a FEVE era normal.", "B": "Eco, Holter de 24 h e teste de esforço máximo; se todos normais e assintomático, liberar; se houver anormalidade, manter abstinência e reavaliar em 3 meses.", "C": "Proibir esporte competitivo definitivamente.", "D": "Repetir biópsia endomiocárdica antes de liberar."}, "correta": "B", "explicacao": "O retorno a atividade extenuante é reavaliado em 3–6 meses, com sintomas resolvidos: eco no estágio C de baixo risco (RMC no D ou C de risco médio/alto), Holter de 24 h e teste de esforço máximo (Figura 10, seção 8.1). Tudo normal → liberar; qualquer anormalidade → manter abstinência e repetir em 3 meses. Atletas devem ser reavaliados periodicamente, sobretudo nos primeiros 2 anos. A armadilha é A: FEVE normal na fase aguda não dispensa a avaliação de arritmia induzida pelo esforço. C é excessiva; D não tem indicação."}, {"n": 10, "enunciado": "Mulher de 78 anos com mal-estar, febre baixa, PCR 12 mg/dL, derrame pericárdico novo e moderado ao eco e supradesnível de ST difuso com infra de PR, sem dor torácica. Como os critérios do ACC 2025 e da ESC 2025 classificam esse caso, e qual a implicação?", "alternativas": {"A": "Ambos classificam como pericardite definida.", "B": "Pelo ACC, que exige dor pleurítica ou equivalente, o diagnóstico não se fecha; a ESC aceita apresentação atípica sem dor com sinais objetivos — o risco é subdiagnosticar o idoso pelo critério do ACC.", "C": "Ambos excluem pericardite pela ausência de dor.", "D": "Pelo ACC é definida (3 achados); pela ESC é improvável."}, "correta": "B", "explicacao": "Pelo ACC 2025, a dor pleurítica ou apresentação equivalente é obrigatória; sem ela, a contagem de achados não se aplica (seção 5.2). A ESC 2025 aceita apresentações atípicas sem dor, como no idoso, quando há sinais objetivos (seção 10). A paciente tem três achados objetivos (PCR, derrame novo, ECG típico) — seria pericardite pelo raciocínio da ESC. A implicação crítica: como a incidência cai com a idade e a apresentação no idoso é menos típica, o critério do ACC pode subdiagnosticar justamente esse grupo. A armadilha é D: contar os achados sem checar o pré-requisito obrigatório. (Em casos assim, a fonte do ACC remete à expressão \"ou equivalente sugestivo\", o que deixa margem ao julgamento clínico.)"}]}, {"id": "hipoparatireoidismo", "titulo": "Hipoparatireoidismo", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Mulher de 44 anos, primeiro dia após tireoidectomia total por bócio multinodular. Refere formigamento perioral e nas mãos; ao aferir a pressão, a mão assume a postura de \"mão de parteiro\". Ca corrigido 7,2 mg/dL, Mg 1,9 mg/dL, K normal, QTc 490 ms. Não usa digoxina. A melhor conduta é:", "alternativas": {"A": "Carbonato de cálcio 1 g de Ca elementar VO 8/8 h, pois parestesias são sintomas leves e o Ca está próximo de 7,5 mg/dL.", "B": "Cloreto de cálcio 10% 10 mL em bolus de 1 a 2 minutos, seguido de reavaliação em 24 h.", "C": "Gluconato de cálcio 10% 1–2 g em 50–100 mL de SG 5% em 10–20 min, infusão contínua de cálcio e início simultâneo de calcitriol e carbonato de cálcio VO.", "D": "Colecalciferol 50.000 UI e aguardar o PTH para confirmar hipoparatireoidismo antes de tratar.", "E": "Observar por 48 h, já que 60–70% dos casos normalizam espontaneamente."}, "correta": "C", "explicacao": "A paciente tem sinais de hipocalcemia grave: Trousseau espontâneo e QT prolongado, ambos indicação de cálcio IV independentemente do valor numérico (seção 7.1.1). A alternativa A é a armadilha: parestesias isoladas seriam \"leves\", mas o QT longo e o espasmo carpopedal mudam a categoria — e o valor de 7,2 já está abaixo do limiar de 7,5 mg/dL para queda aguda. A prescrição correta é bolus de gluconato de cálcio em 10–20 min (infusão rápida pode causar assistolia, o que elimina B; o cloreto ainda tem mais risco de necrose), seguido de infusão contínua, porque o bolus sustenta o cálcio por só 2–3 h, e início imediato de calcitriol (age em horas) com carbonato, já que sem PTH o cálcio sozinho só funciona enquanto está entrando (seção 7.1.2 e 7.1.4). D erra duas vezes: o colecalciferol leva ≈ 10 dias e o tratamento da hipocalcemia sintomática não espera o PTH. E confunde prognóstico (60–70% normalizam em semanas) com conduta no sintomático (seção 4.1)."}, {"n": 2, "enunciado": "Homem de 58 anos, etilista, internado por diarreia e cãibras. Ca corrigido 7,0 mg/dL, P 3,8 mg/dL (normal), Mg 0,6 mg/dL, PTH 11 pg/mL, creatinina normal. O residente propõe diagnosticar hipoparatireoidismo e iniciar calcitriol de uso contínuo. A melhor resposta é:", "alternativas": {"A": "Concordar: PTH < 20 pg/mL com hipocalcemia fecha o diagnóstico.", "B": "Repor magnésio (sulfato de Mg IV) e redosar cálcio e PTH antes de qualquer diagnóstico de HPT.", "C": "Solicitar sequenciamento do CaSR, pois PTH baixo com hipocalcemia sugere HAD.", "D": "Iniciar hidroclorotiazida para reduzir a perda renal de cálcio.", "E": "Dosar 1,25(OH)₂D: se baixa, confirma HPT e indica calcitriol."}, "correta": "B", "explicacao": "O PTH baixo diante de hipocalcemia sugere hipoparatireoidismo, mas só pode ser interpretado com o magnésio corrigido: Mg de 0,6 mg/dL compromete a secreção e a ação do PTH, produzindo um hipoparatireoidismo funcional (seção 3.2). O fósforo normal reforça: no HPT verdadeiro ele estaria alto (seção 6.3). A armadilha da alternativa A é aplicar o critério diagnóstico (< 20 pg/mL) sem o pré-requisito de Mg normal (seção 6.4). A conduta é repor sulfato de Mg (2 g em 10–20 min, depois 1 g/h enquanto Mg < 1 mg/dL) e redosar: se a hipomagnesemia era a causa, o cálcio corrige em minutos a horas (seção 7.1.3). C e E pulam etapas; D não tem indicação (tiazídico trata hipercalciúria e ainda piora a hipomagnesemia)."}, {"n": 3, "enunciado": "Homem de 62 anos com cirrose descompensada, assintomático, Ca total 7,6 mg/dL e albumina 2,2 g/dL, internado em UTI por PBE. Sobre a conduta:", "alternativas": {"A": "Repor gluconato de cálcio IV, pois o Ca total é ≈ 7,5 mg/dL.", "B": "Calcular o Ca corrigido (≈ 9,0 mg/dL), concluir que é normal e não investigar mais nada.", "C": "Dosar cálcio iônico, porque a fórmula de correção é pouco acurada em doentes críticos.", "D": "Iniciar carbonato de cálcio e calcitriol por hipoparatireoidismo provável.", "E": "Dosar PTH: se normal, o diagnóstico é hipoparatireoidismo."}, "correta": "C", "explicacao": "Com albumina de 2,2 g/dL, o Ca total subestima o iônico. A fórmula daria ≈ 9,0 mg/dL (7,6 + 0,8 × 1,8), sugerindo pseudo-hipocalcemia, mas as fontes alertam que a acurácia da correção é ruim justamente em doentes críticos e na DRC avançada — e este paciente está na UTI (seção 6.1). Por isso a melhor conduta é o cálcio iônico, padrão-ouro. B é a armadilha: o cálculo está certo, mas a confiança nele não. A e D tratam um número possivelmente falso. E inverte a lógica: PTH normal só sugere HPT se a hipocalcemia for verdadeira. A ponte é com o material de Cirrose: a hipoalbuminemia baixa o Ca total sem baixar o iônico."}, {"n": 4, "enunciado": "Mulher de 50 anos com HPT pós-cirúrgico há 6 anos, em carbonato de cálcio (1,5 g de Ca elementar/dia) e calcitriol 0,5 µg 2×/dia. Assintomática. Ca 8,3 mg/dL (referência 8,5–10,2), P 4,4 mg/dL, Mg normal, creatinina normal, cálcio urinário 340 mg/24 h, sódio urinário 260 mmol/24 h. A melhor conduta é:", "alternativas": {"A": "Reduzir o calcitriol para 0,25 µg/dia até a calciúria normalizar.", "B": "Aumentar o calcitriol para trazer o Ca ao meio da faixa normal.", "C": "Restringir sódio na dieta e associar hidroclorotiazida, monitorando K e Mg.", "D": "Iniciar furosemida para aumentar o fluxo urinário e prevenir litíase.", "E": "Não mudar nada, pois a paciente está assintomática."}, "correta": "C", "explicacao": "A calciúria está acima do limite (340 > 250 mg/24 h para mulheres) com cálcio sérico no alvo (limite inferior ou até 0,5 mg/dL abaixo). Nessa situação, reduzir o calcitriol (A) traria a calcemia abaixo do alvo e sintomas; o caminho é aumentar a reabsorção tubular de cálcio com tiazídico e restrição de sódio — o sódio urinário de 260 mmol/dia (meta < 220) mostra natriurese que arrasta cálcio (seções 7.2.4 e 8, Figura do ajuste crônico). A armadilha é olhar só a calciúria: reduzir dose é a resposta certa quando o Ca sérico está acima do alvo. B piora a hipercalciúria (sem PTH, Ca sérico maior = mais Ca na urina; seção 3.1). D é o oposto do necessário: diurético de alça aumenta a calciúria (seção 7.4). E ignora que a complicação renal é silenciosa."}, {"n": 5, "enunciado": "Homem de 31 anos, assintomático, com Ca 7,8 mg/dL num exame admissional. PTH 14 pg/mL, P 4,8 mg/dL, Mg normal, cálcio urinário 290 mg/24 h. Mãe e irmã têm \"cálcio baixo\". Qual a interpretação e o principal cuidado?", "alternativas": {"A": "HPT autoimune; iniciar calcitriol e carbonato para Ca no meio da faixa normal.", "B": "Hipocalcemia autossômica dominante (CaSR ativador); evitar elevar o cálcio com Ca + vitamina D, que piora a calciúria e a nefrocalcinose.", "C": "Pseudo-hipoparatireoidismo; o PTH está inapropriado para a resistência renal.", "D": "Deficiência de vitamina D; repor 50.000 UI/semana.", "E": "DiGeorge; o tratamento é igual ao do HPT pós-cirúrgico."}, "correta": "B", "explicacao": "Hipocalcemia leve, assintomática, com PTH inapropriadamente baixo, fósforo alto e — o dado que destoa — calciúria quase no limite superior apesar da hipocalcemia, mais família afetada: é o perfil da hipocalcemia autossômica dominante por mutação ativadora do CaSR (seções 4.1 e 6.3). O receptor hiperativo no túbulo \"acha\" que o cálcio está normal e não o retém. A armadilha é tratar como HPT comum (A): subir o cálcio com Ca + vitamina D piora hipercalciúria, nefrocalcinose e função renal; a maioria precisa de pouco ou nenhum tratamento, e se necessário, PTH recombinante ou, no futuro, calcilíticos como o encaleret (seção 7.3.3). C exigiria PTH alto; D, PTH alto e fósforo baixo; E não explica a calciúria nem a história familiar."}, {"n": 6, "enunciado": "Mulher de 55 anos, 2º dia após paratireoidectomia por hiperparatireoidismo primário com doença óssea grave. Parestesias. Ca 7,3 mg/dL, P 1,9 mg/dL, Mg 1,3 mg/dL. Qual a hipótese mais provável e a implicação?", "alternativas": {"A": "Hipoparatireoidismo pós-cirúrgico; restringir fósforo na dieta.", "B": "Síndrome da fome óssea; fósforo e Mg baixos indicam captação óssea, não falta de PTH, e a necessidade de cálcio pode ser alta.", "C": "Pseudo-hipoparatireoidismo desmascarado pela cirurgia.", "D": "Hipocalcemia espúria por hemodiluição.", "E": "Pancreatite aguda pós-operatória."}, "correta": "B", "explicacao": "Hipocalcemia após paratireoidectomia por hiperparatireoidismo com doença óssea grave, com fósforo baixo e Mg baixo: é a síndrome da fome óssea — o osso desmineralizado capta cálcio, fósforo e magnésio (seção 6.6). A armadilha (A) é o reflexo \"pós-operatório cervical = hipoparatireoidismo\"; no HPT o fósforo estaria alto, porque falta o efeito fosfatúrico do PTH. A implicação prática é não restringir fósforo e esperar necessidades altas de cálcio. C, D e E não explicam a combinação com hipofosfatemia e o contexto."}, {"n": 7, "enunciado": "Mulher de 23 anos, baixa estatura, face arredondada, 4º e 5º metacarpos curtos, hipotireoidismo desde a infância. Ca 7,9 mg/dL, P 5,6 mg/dL, PTH 180 pg/mL, 25(OH)D 34 ng/mL, creatinina normal, Mg normal. Sobre o diagnóstico e o alvo terapêutico:", "alternativas": {"A": "Hipoparatireoidismo autoimune; alvo de Ca no limite inferior do normal.", "B": "Deficiência de vitamina D; alvo é normalizar a 25(OH)D.", "C": "Pseudo-hipoparatireoidismo (PHP1A provável); alvo de normocalcemia, porque a hipercalciúria é pouco frequente, e rastrear hipogonadismo.", "D": "DRC; tratar o fósforo com sevelâmer.", "E": "Pseudopseudo-hipoparatireoidismo; não requer tratamento."}, "correta": "C", "explicacao": "PTH alto com hipocalcemia e hiperfosfatemia, 25(OH)D e creatinina normais, mais fenótipo de Albright e hipotireoidismo: pseudo-hipoparatireoidismo, provavelmente PHP1A (resistência também ao TSH) (seções 4.2 e 6.3). A diferença terapêutica em relação ao HPT é o alvo: no PHP a hipercalciúria é pouco frequente (o túbulo distal responde ao PTH), então busca-se normocalcemia, com calcitriol 0,25 µg 2×/dia titulado semanalmente e 1–2 g/dia de cálcio, além de rastrear hipotireoidismo e hipogonadismo (seção 7.3.2). A armadilha (A) é aplicar o alvo do HPT — limite inferior — por reflexo. B exige 25(OH)D baixa e fósforo baixo; D exige creatinina alta; E não tem resistência ao PTH nem hipocalcemia."}, {"n": 8, "enunciado": "Gestante de 33 semanas com HPT pós-cirúrgico, em carbonato de cálcio, calcitriol 1 µg/dia e hidroclorotiazida 25 mg/dia (iniciada antes da gestação). Cãibras frequentes. Ca total 7,8 mg/dL, albumina 3,0 g/dL. A melhor conduta é:", "alternativas": {"A": "Manter as doses: o Ca corrigido é normal e as cãibras são da gestação.", "B": "Reduzir o calcitriol, pois a placenta produz calcitriol e PTHrP.", "C": "Dosar Ca iônico, suspender a hidroclorotiazida e, confirmada a hipocalcemia, aumentar cálcio e calcitriol, com controle a cada 2–3 semanas.", "D": "Trocar o calcitriol por teriparatida.", "E": "Prescrever cálcio IV semanal até o parto."}, "correta": "C", "explicacao": "Na gestação a hemodiluição reduz albumina e cálcio total, por isso o controle é pelo cálcio iônico, a cada 2–3 semanas (seção 7.3.1). No 3º trimestre a mineralização do esqueleto fetal aumenta a demanda e as doses de cálcio e calcitriol costumam subir (Ca até 2–3,2 g; calcitriol até 3 µg). O tiazídico deve ser suspenso — está contraindicado na gestação (seção 7.2.4). A armadilha está em B: a redução de doses vale no início da gestação (calcitriol e PTHrP placentários) e na lactação, não no 3º trimestre. A ignora sintomas e a hemodiluição; D (análogos de PTH) é contraindicado na gestação; E não tem base. A hipocalcemia materna leva a hiperparatireoidismo secundário fetal com desmineralização e fraturas; o supertratamento, a hipocalcemia neonatal."}, {"n": 9, "enunciado": "Um colega lê o estudo aberto de 16 semanas com hPTH (1-34) oral (0,75 mg 4×/dia), que reduziu em 42% a necessidade de cálcio oral e baixou o fósforo, e conclui: \"a reposição oral de PTH previne a doença renal do hipoparatireoidismo e deve substituir o calcitriol\". Que argumento você usaria?", "alternativas": {"A": "Concordo: menos cálcio oral significa necessariamente menos litíase.", "B": "O estudo usou desfechos substitutos, foi aberto e curto; não mostrou menos litíase, nefrocalcinose ou perda de TFG, que são os desfechos que justificariam a troca.", "C": "O estudo é inválido porque não foi feito em crianças.", "D": "A redução do fósforo é efeito adverso, não benefício.", "E": "PTH não tem racional mecanístico no hipoparatireoidismo."}, "correta": "B", "explicacao": "O racional mecanístico existe — o PTH devolve o efeito renal que o calcitriol não repõe, por isso E está errada —, mas o estudo mediu necessidade de cálcio oral e fósforo, que são desfechos substitutos. Para afirmar proteção renal, seria preciso mostrar menos litíase, nefrocalcinose ou perda de TFG, em seguimento longo; 16 semanas, desenho aberto e ausência de grupo-controle não permitem isso (seções 7.2.6 e 9). A armadilha (A) é supor que um biomarcador melhor se traduz automaticamente em benefício clínico. C confunde população; D inverte o sentido (baixar fósforo é desejável no HPT, seção 7.2.5)."}, {"n": 10, "enunciado": "Homem de 76 anos em uso de digoxina por FA, com tetania após esvaziamento cervical radical. O plantonista cita uma série de 23 pacientes em que cálcio IV não causou arritmias em intoxicados por digoxina e propõe fazer o bolus \"rápido, sem monitor, porque é seguro\". A melhor resposta é:", "alternativas": {"A": "Concordar: a evidência mostra que não há risco.", "B": "Contraindicar o cálcio IV em qualquer usuário de digoxina e usar só cálcio oral.", "C": "Fazer o cálcio IV indicado pela tetania, em 10–20 min (nunca rápido), com monitorização cardíaca, porque uma série retrospectiva pequena não prova segurança.", "D": "Trocar por cloreto de cálcio, que tem efeito mais rápido e menos interação.", "E": "Esperar o nível sérico de digoxina antes de qualquer reposição."}, "correta": "C", "explicacao": "A tetania indica cálcio IV, e a digoxina não o contraindica (B), mas exige monitorização, de preferência telemetria, pelo risco de toxicidade digitálica aguda (seção 7.1.2). A série citada é retrospectiva e de 23 pacientes: ausência de eventos numa amostra pequena não demonstra segurança, apenas não detectou dano (nota de leitura crítica da seção 7.1.2). A armadilha é usar a evidência para dispensar o cuidado (A). O bolus nunca deve ser rápido, em qualquer paciente, pelo risco de assistolia; o cloreto (D) tem mais risco de necrose e não muda a interação. E atrasa o tratamento de uma emergência."}]}, {"id": "drc-complicacoes", "titulo": "Complicações da DRC", "tipo": "discursiva", "questoes": [{"n": 1, "enunciado": "Homem, 66 anos, DRC G3b/A3 por nefropatia diabética, em uso de losartana 100 mg, empagliflozina 10 mg e hidroclorotiazida 25 mg. Exame de rotina: K⁺ 6,1 mmol/l; creatinina igual à basal; ECG normal; assintomático. O laudo menciona \"amostra levemente hemolisada\" e as plaquetas são 610.000/mm³. O residente propõe suspender a losartana. Qual é a conduta mais adequada e por quê?", "resposta": "A conduta é confirmar o resultado antes de qualquer mudança terapêutica: recoletar sem garrote apertado e sem cerrar o punho e dosar K⁺ plasmático (tubo heparinizado), porque a plaquetose (610.000) libera K⁺ durante a coagulação e a hemólise também eleva o valor sérico. O paciente está estável, sem LRA (creatinina basal) e com ECG normal; pela Tabela 28, um K⁺ 6,0–6,4 inesperado em paciente bem pede repetição em até 24 h, não intervenção imediata. Suspender a losartana seria um erro duplo: agiria sobre um valor possivelmente falso e retiraria um fármaco com benefício renal e CV. A armadilha é a associação automática \"K⁺ alto + IECA/BRA = suspender\", que parece prudente porque remove uma causa plausível. (Resumo, seções 4.2–4.4.)"}, {"n": 2, "enunciado": "O mesmo paciente: K⁺ plasmático em coleta adequada = 5,8 mmol/l. Faz uso de ibuprofeno para dor no joelho, está constipado e substituiu o sal de cozinha por \"sal light\". Bicarbonato 19 mmol/l. Organize o tratamento em ordem de prioridade, justificando onde entra a losartana.", "resposta": "Ordem do algoritmo (Figura 32): 1ª linha — corrigir fatores: suspender o ibuprofeno (AINE reduz renina/aldosterona e é nefrotóxico; trocar por paracetamol), tratar a constipação (o cólon é via importante de excreção de K⁺ na DRC avançada) e retirar o sal light (KCl com absorção ~90%), com orientação de nutricionista para cortar K⁺ biodisponível (ultraprocessados) sem proibir frutas e verduras. 2ª linha — medicamentos: a hidroclorotiazida já ajuda a caliurese (pode-se considerar diurético de alça se TFG baixa e volume permitir); corrigir a acidose — com bicarbonato 19 e hipercalemia, o álcali tem dupla utilidade; e, se persistir, quelante (SZC ou patirômero). 3ª linha — só se tudo falhar, reduzir a losartana; a suspensão se associa a mais eventos CV. A empagliflozina não contribui para o K⁺ e deve ser mantida. (Seções 4.1, 4.4, 5.3.)"}, {"n": 3, "enunciado": "Mulher, 58 anos, DRC G4, chega ao PS com fraqueza. K⁺ 7,1 mmol/l; ECG com ondas T apiculadas e QRS alargado. Prescreva a conduta inicial e explique por que, sem um passo específico, o K⁺ voltará a subir em poucas horas.", "resposta": "Monitorização contínua e: gluconato de cálcio 10% 30 ml IV em 5–10 min (repetir se o ECG não melhorar) — estabiliza a membrana mas não baixa o K⁺; insulina regular 10 UI + glicose 25 g IV e salbutamol 10–20 mg nebulizado — deslocam o K⁺ para dentro da célula em 15–30 min, com efeito de 4–6 h; glicemia capilar seriada (maior risco de hipoglicemia na DRC). O passo que evita o rebote é a remoção do K⁺ do corpo: quelante (SZC 10 g 3×/dia), diurético de alça se houver volume e, em G4 com K⁺ 7,1 e alterações de ECG, avaliar diálise se não houver resposta ou houver oligúria. Investigar a causa (fármacos, LRA, acidose). A armadilha é ver o K⁺ cair após insulina e considerar o problema resolvido — a redistribuição é transitória. (Seção 4.4; conduta de emergência de fonte externa, UKKA 2023.)"}, {"n": 4, "enunciado": "Homem, 72 anos, DRC G4 (TFGe 22), bicarbonato 20 mmol/l, sem hipercalemia, hipertenso de difícil controle e com edema de membros inferiores. Um colega quer prescrever bicarbonato de sódio \"para retardar a progressão, como mostram os estudos\". Que argumento você usaria e qual seria sua conduta?", "resposta": "O argumento é que os ECRs controlados por placebo não mostraram benefício: na metanálise de 15 ensaios (2.445 pacientes), o efeito sobre falência renal não foi significativo (HR 0,81; IC 0,54–1,22), e o BiCARB — exatamente a população do paciente (≥ 60 anos, G3–G4, HCO₃⁻ < 22) — não mostrou benefício renal (HR 0,97), funcional nem de qualidade de vida, com custo maior e pior EQ-5D. Os \"estudos\" do colega são o ECR pequeno e aberto de 2012 e dados observacionais; o bicarbonato melhora o substituto (HCO₃⁻), não o desfecho. Com HCO₃⁻ 20 (acima do limiar de 18), sem hipercalemia, e com HAS e edema — que pioram com a carga de sódio —, a conduta é não prescrever bicarbonato agora, orientar dieta mais vegetal e menos proteína animal e monitorar; tratar se cair abaixo de 18. (Seções 5.3 e 12.)"}, {"n": 5, "enunciado": "Mulher, 63 anos, DRC G3b (TFGe 35), Hb 9,6 g/dl, VCM 76 fl, ferritina 28 ng/ml, TSAT 9%, reticulócitos baixos. Usa AAS 100 mg. O residente quer iniciar eritropoetina porque \"é anemia da DRC\". O que está errado no raciocínio e qual é a sequência correta?", "resposta": "O erro é atribuir a anemia à DRC antes de excluir outras causas. Com TFGe 35 a deficiência de EPO costuma ser modesta, e o quadro é de ferropenia absoluta (ferritina 28 < 45, VCM 76 < 80, TSAT 9%) em usuária de AAS — o KDIGO 2026 manda procurar perda de sangue (endoscopia/colonoscopia) quando a ferritina é < 45 ou o VCM < 80. A anemia da DRC é diagnóstico de exclusão (normocítica, reticulócitos baixos, ferro adequado). Sequência: investigar sangramento; repor ferro (critério cumprido: ferritina < 100 com TSAT < 40%) — oral, ou IV se intolerância ou sem resposta em 1–3 meses; reavaliar a Hb; só considerar AEE se a anemia persistir com ferro repleto e Hb em geral 8,5–10. AEE com ferro depletado gera hiporresposta. A armadilha é o atalho \"paciente renal + anemia = eritropoetina\". (Seções 6.2–6.3.)"}, {"n": 6, "enunciado": "Homem, 60 anos, DRC G3b, Hb 9,2 g/dl após reposição adequada de ferro (ferritina 350, TSAT 32%). Inicia alfaepoetina; após 2 semanas, a Hb está em 10,6 g/dl; após mais 4 semanas, 12,3 g/dl. A família pede para \"deixar a Hb normal, 14\". Conduza e justifique com base em evidência.", "resposta": "Dois problemas. Primeiro, a velocidade: a Hb subiu 1,4 g/dl em 2 semanas (> ~1 g/dl), o que já pedia redução da dose em 25–50%. Segundo, o nível: 12,3 está acima do alvo (≤ 11,5); deve-se reduzir a dose em vez de suspender (suspender causa oscilação). Não se usa AEE para manter Hb ≥ 11,5, e mirar Hb ≥ 13 aumenta o risco CV — os ensaios que buscaram Hb normal (CHOIR, CREATE, TREAT, este com mais AVC) mostraram dano. Para a família: o objetivo do AEE é aliviar sintomas e evitar transfusão, não normalizar o exame. Monitorar Hb a cada 2–4 semanas após o ajuste e a PA. Exemplo de substituto cuja normalização piora o desfecho. (Seções 6.1, 6.3, 12.)"}, {"n": 7, "enunciado": "Mulher, 55 anos, DRC G4 (TFGe 24). Exames: Ca 8,6 mg/dl, P 5,9 mg/dl, PTH 210 pg/ml (subindo nas últimas três dosagens), 25(OH)D 14 ng/ml. A residente prescreve calcitriol 0,5 µg/dia e carbonato de cálcio 1 g três vezes ao dia em jejum. Aponte os erros e reescreva a conduta.", "resposta": "Erros: (1) calcitriol de rotina fora da diálise não é recomendado (2C) — o PTH ideal fora da diálise é desconhecido, e antes devem ser corrigidos os fatores modificáveis (fósforo alto, deficiência de vitamina D); calcitriol fica para HPT grave e progressivo apesar disso, e sobe Ca e P, podendo levar a doença adinâmica; (2) carbonato de cálcio em jejum não funciona como quelante — tem que ser tomado com as refeições para ligar o fósforo do alimento; em jejum só fornece cálcio; (3) a dose de cálcio de 3 g/dia é alta — a diretriz manda limitar o quelante à base de cálcio (calcificação vascular). Conduta: orientar dieta pobre em fósforo de aditivos; colecalciferol para a 25(OH)D de 14 (ex.: 50.000 UI/semana por 8 semanas); quelante junto às refeições — sevelamer 800 mg 3×/dia ou carbonato de cálcio em dose limitada; repetir Ca, P e PTH em 3 meses (G4: Ca/P a cada 3–6 meses) e avaliar a tendência; calcitriol apenas se o PTH continuar subindo de forma grave. (Seção 7; KDIGO DMO-DRC 2017, fonte externa.)"}, {"n": 8, "enunciado": "Homem, 68 anos, DRC G3b, urato 9,4 mg/dl, nunca teve gota. Colega cita estudos observacionais em que urato alto prevê perda de função renal e quer iniciar alopurinol. Seis meses depois, o paciente tem a primeira crise de gota no hálux, com urato 9,8. Discuta as duas situações e prescreva para a segunda.", "resposta": "Na primeira situação, não tratar (recomendação 2D): três ECRs com placebo em DRC — CKD-FIX (369 pacientes G3–G4, queda da TFGe 3,33 vs. 3,23 ml/min/ano), PERL e FEATHER — não mostraram benefício renal; a associação observacional não é causal (o urato é marcador de TFG baixa, síndrome metabólica e diuréticos). Na segunda, há gota sintomática → hipouricemiante é recomendado (1C), e na DRC considera-se iniciar já após a primeira crise, sobretudo com urato > 9. Prescrição: crise — colchicina 1 mg + 0,5 mg após 1 h (comprimidos brasileiros; equivalente a 1,2 + 0,6 mg) ou prednisolona 30 mg/dia por 3–5 dias; evitar AINE. Hipouricemiante — alopurinol 50–100 mg/dia (G3b: ≤ 100 mg), titulando 50–100 mg a cada 2–5 semanas até urato < 6, mantido indefinidamente; profilaxia com colchicina em dose baixa por 3–6 meses, porque o risco de crise sobe nos primeiros 3 meses. Pode ser iniciado durante a crise sem prolongá-la. Atenção ao HLA-B*5801 em pacientes de ascendência asiática ou africana. (Seção 8.)"}, {"n": 9, "enunciado": "Mulher, 81 anos, 56 kg, creatinina 1,6 mg/dl, TFGe (CKD-EPI) 31 ml/min/1,73 m², com FA não valvar, HAS e diabetes. Calcule mentalmente o CHA₂DS₂-VASc, escolha o anticoagulante e a dose, e explique a armadilha na escolha da estimativa de função renal.", "resposta": "CHA₂DS₂-VASc: idade ≥ 75 (2) + sexo feminino (1) + HAS (1) + diabetes (1) = 5 → anticoagulação indicada; na DRC, de qualquer forma, ela é quase sempre considerada. Escolha: DOAC em vez de varfarina (1C, G1–G4). A armadilha: a dose é definida pela ClCr de Cockcroft-Gault, não pela TFGe do CKD-EPI. Cockcroft-Gault: (140 − 81) × 56 × 0,85 / (72 × 1,6) ≈ 2.808 / 115 ≈ 24 ml/min — bem abaixo da TFGe de 31, porque a idosa magra tem pouca massa muscular. Com ClCr 24, a dabigatrana não deve ser usada; apixabana 2,5 mg 2×/dia é adequada (ela tem os três critérios de redução: idade ≥ 80, peso ≤ 60 kg e creatinina ≥ 1,5), lembrando que abaixo de 30 a dose se baseia em farmacocinética, sem ECR. Usar a TFGe de 31 levaria a classificá-la na faixa 31–50 e, para rivaroxabana ou edoxabana, a superdosagem. Associar IBP se houver antiagregante e reavaliar a função renal periodicamente. (Seção 9.5.)"}, {"n": 10, "enunciado": "Um colega lê o CARES (febuxostate vs. alopurinol em gota com DCV) e conclui: \"o desfecho primário foi não inferior, então os dois são equivalentes para meu paciente com DRC e IAM prévio\". Que argumento de leitura crítica você usaria?", "resposta": "O argumento é que não inferioridade no desfecho composto não equivale a equivalência em todos os desfechos: no CARES, a mortalidade total (HR 1,22; IC 1,01–1,47) e a cardiovascular (HR 1,34; IC 1,03–1,73) foram maiores com febuxostate, justamente na população com DCV estabelecida — o perfil do paciente em questão. Desfechos secundários não confirmam causalidade e há debate sobre perdas de seguimento, mas, quando o sinal é de morte e existe alternativa barata, segura (ALL-HEART sem sinal CV; sem aumento de reação cutânea ou hepatotoxicidade na revisão do KDIGO) e eficaz, o princípio de precaução favorece o alopurinol como primeira escolha. A armadilha é ler só o desfecho primário e ignorar sinais de dano consistentes. (Seção 8.2.)"}]}];

/* ============================================================
   PROVAS POR MATÉRIA (AC 2)
   Cada prova tem seu próprio progresso salvo neste navegador.
   QUESTIONS e state apontam sempre para a prova aberta.
   ============================================================ */
const STORE_KEY = 'provasAC2';
const $main = document.getElementById('quiz');
const $grid = document.getElementById('qGrid');
const $list = document.getElementById('tabs');

let store = { current: PROVAS[0].id, provas: {} };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}

function newState() { return { index: 0, answers: {}, pending: {}, showGabarito: {}, finished: false }; }
function provaById(id) { return PROVAS.find(p => p.id === id) || PROVAS[0]; }
function questionsOf(p) {
  // Discursivas: "correta" virtual = 'OK' (o aluno marca se acertou)
  return p.questoes.map(q => p.tipo === 'discursiva' ? Object.assign({ correta: 'OK' }, q) : q);
}

let PROVA = provaById(store.current);
let QUESTIONS = questionsOf(PROVA);
let state = store.provas[PROVA.id] || (store.provas[PROVA.id] = newState());

function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }

function toggleSidebar() {
  const hidden = document.body.classList.toggle('sidebar-hidden');
  try { localStorage.setItem('sidebarHidden', hidden ? '1' : '0'); } catch (e) {}
}
document.addEventListener('keydown', (e) => {
  if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = e.target; const tag = (t && t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
    toggleSidebar();
  }
});

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function scoreOf(p) {
  const st = store.provas[p.id];
  if (!st) return null;
  const qs = questionsOf(p);
  let ok = 0, done = 0;
  qs.forEach(q => { const a = st.answers[q.n]; if (!a) return; done++; if (a === q.correta) ok++; });
  return { ok, done, total: qs.length };
}

function renderList() {
  $list.innerHTML = '';
  PROVAS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (p.id === PROVA.id ? ' active' : '');
    const sc = scoreOf(p);
    let badge = '';
    if (sc && sc.done === sc.total) badge = '<span class="prova-score' + (sc.ok / sc.total >= .75 ? ' good' : sc.ok / sc.total < .6 ? ' low' : '') + '">' + sc.ok + '/' + sc.total + '</span>';
    else if (sc && sc.done > 0) badge = '<span class="prova-score partial">' + sc.done + '/' + sc.total + '</span>';
    b.innerHTML = '<span class="tab-num">' + String(i + 1).padStart(2, '0') + '</span><span class="tab-name">' + esc(p.titulo) +
      (p.tipo === 'discursiva' ? ' <em class="prova-kind">discursiva</em>' : '') + '</span>' + badge;
    b.onclick = () => selectProva(p.id);
    $list.appendChild(b);
  });
}

function selectProva(id) {
  PROVA = provaById(id);
  QUESTIONS = questionsOf(PROVA);
  state = store.provas[PROVA.id] || (store.provas[PROVA.id] = newState());
  store.current = PROVA.id;
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderGrid() {
  $grid.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const cell = document.createElement('button');
    cell.className = 'q-cell';
    cell.textContent = String(q.n).padStart(2, '0');
    if (i === state.index) cell.classList.add('current');
    const a = state.answers[q.n];
    if (a) cell.classList.add(a === q.correta ? 'correct' : 'wrong');
    cell.onclick = () => { state.index = i; state.finished = false; saveState(); render(); };
    $grid.appendChild(cell);
  });
}

function selectAlt(n, key) {
  if (state.answers[n]) return;
  state.pending[n] = key;
  saveState();
  render();
}

function confirmAnswer(n) {
  const sel = state.pending[n];
  if (!sel || state.answers[n]) return;
  state.answers[n] = sel;
  delete state.pending[n];
  saveState();
  render();
}

// Discursiva: mostrar a resposta e o aluno marca se acertou
function revealAnswer(n) { state.showGabarito[n] = true; saveState(); render(); }
function markSelf(n, ok) {
  if (state.answers[n]) return;
  state.answers[n] = ok ? 'OK' : 'X';
  saveState();
  render();
}

function toggleGab(n) {
  state.showGabarito[n] = !state.showGabarito[n];
  saveState();
  render();
}

function next() {
  if (state.index < QUESTIONS.length - 1) state.index++;
  else state.finished = true;
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function prev() {
  if (state.finished) { state.finished = false; saveState(); render(); return; }
  if (state.index > 0) { state.index--; saveState(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

function resetQuiz() {
  if (!confirm('Reiniciar a prova de ' + PROVA.titulo + '? Suas respostas desta prova serão apagadas.')) return;
  store.provas[PROVA.id] = state = newState();
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function classify(pct) {
  if (pct >= 90) return { key: 'excelente', label: 'Excelente' };
  if (pct >= 75) return { key: 'otimo', label: 'Ótimo' };
  if (pct >= 60) return { key: 'regular', label: 'Regular' };
  return { key: 'melhorar', label: 'Precisa Melhorar' };
}

function render() {
  renderList();
  renderGrid();
  document.getElementById('provaSub').textContent = 'AC 2 · ' + PROVA.titulo;
  if (state.finished) { renderEnd(); return; }
  renderQuestion();
}

const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>';

function renderQuestion() {
  const q = QUESTIONS[state.index];
  const answered = !!state.answers[q.n];
  const userAns = state.answers[q.n];
  const correct = userAns === q.correta;
  const progress = ((state.index + 1) / QUESTIONS.length) * 100;
  const gabOpen = !!state.showGabarito[q.n];
  let body = '';

  if (PROVA.tipo === 'discursiva') {
    if (!gabOpen && !answered) {
      body = '<div class="confirm-wrap"><button class="btn-confirm" onclick="revealAnswer(' + q.n + ')">Ver resposta comentada</button></div>' +
             '<div class="disc-hint">Pense na sua resposta (ou escreva num papel) antes de abrir o gabarito.</div>';
    } else {
      body = '<div class="feedback-panel">' +
        '<div class="gabarito-body"><div class="gab-title">Resposta comentada</div><div>' + esc(q.resposta) + '</div></div>' +
        (answered
          ? '<div class="feedback-header ' + (correct ? 'correct' : 'wrong') + '">' + (correct ? ICON_OK : ICON_ERR) +
            '<span>' + (correct ? 'Você marcou que acertou esta questão.' : 'Você marcou que errou esta questão. Vale revisar o comentário.') + '</span></div>'
          : '<div class="self-check"><span>Como foi a sua resposta?</span>' +
            '<button class="nav-btn self-ok" onclick="markSelf(' + q.n + ', true)">Acertei</button>' +
            '<button class="nav-btn self-err" onclick="markSelf(' + q.n + ', false)">Errei</button></div>') +
        '</div>';
    }
  } else {
    const pending = state.pending[q.n];
    const keys = Object.keys(q.alternativas);
    const alts = keys.map(k => {
      let cls = 'alt', badge = '';
      if (answered) {
        if (k === q.correta) { cls += ' correct-alt'; badge = '<span class="alt-badge">Correta</span>'; }
        else if (k === userAns) { cls += ' wrong-alt'; badge = '<span class="alt-badge">Sua resposta</span>'; }
      } else if (pending === k) cls += ' selected';
      return '<button class="' + cls + '" ' + (answered ? 'disabled' : '') + ' onclick="selectAlt(' + q.n + ', \'' + k + '\')">' +
        '<div class="alt-key">' + k + '</div><div class="alt-text">' + esc(q.alternativas[k]) + ' ' + badge + '</div></button>';
    }).join('');
    let confirmBtn = '';
    if (!answered) {
      confirmBtn = '<div class="confirm-wrap"><button class="btn-confirm" ' + (pending ? '' : 'disabled') + ' onclick="confirmAnswer(' + q.n + ')">' +
        (pending ? 'Confirmar resposta (' + pending + ')' : 'Selecione uma alternativa para responder') + '</button></div>';
    }
    let feedback = '';
    if (answered) {
      feedback = '<div class="feedback-panel">' +
        '<div class="feedback-header ' + (correct ? 'correct' : 'wrong') + '">' + (correct ? ICON_OK : ICON_ERR) +
        '<span>' + (correct ? 'Você acertou!' : 'Você errou. A resposta correta é ' + q.correta) + '</span></div>' +
        '<button class="gabarito-toggle ' + (gabOpen ? 'open' : '') + '" onclick="toggleGab(' + q.n + ')">' + CHEVRON +
        '<span>' + (gabOpen ? 'Ocultar gabarito comentado' : 'Ver gabarito comentado') + '</span></button>' +
        (gabOpen ? '<div class="gabarito-body"><div class="gab-title">Gabarito Comentado</div><div class="gab-answer">Resposta: ' + q.correta + '</div><div>' + esc(q.explicacao) + '</div></div>' : '') +
        '</div>';
    }
    body = '<div class="alts">' + alts + '</div>' + confirmBtn + feedback;
  }

  const answeredCount = Object.keys(state.answers).length;
  $main.innerHTML =
    '<div class="toolbar">' +
      '<div class="crumb">' + esc(PROVA.titulo) + ' · Questão ' + q.n + ' de ' + QUESTIONS.length + ' · Respondidas: ' + answeredCount + '</div>' +
      '<div class="actions"><button class="btn" onclick="resetQuiz()">Reiniciar</button></div>' +
    '</div>' +
    '<div class="progress-bar"><div class="fill" style="width:' + progress + '%"></div></div>' +
    '<div class="question-card">' +
      '<div class="q-number">Questão ' + String(q.n).padStart(2, '0') + (PROVA.tipo === 'discursiva' ? ' · discursiva' : '') + '</div>' +
      '<div class="q-enun">' + esc(q.enunciado) + '</div>' +
      body +
    '</div>' +
    '<div class="nav-buttons">' +
      '<button class="nav-btn" onclick="prev()" ' + (state.index === 0 ? 'disabled' : '') + '>← Anterior</button>' +
      '<button class="nav-btn primary" onclick="next()">' + (state.index === QUESTIONS.length - 1 ? 'Ver resultado' : 'Próxima →') + '</button>' +
    '</div>';
}

function renderEnd() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach(q => { const a = state.answers[q.n]; if (!a) return; if (a === q.correta) correct++; else wrong++; });
  const total = QUESTIONS.length;
  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  const cls = classify(pct);
  const r = 100, circ = 2 * Math.PI * r, offset = circ * (1 - pct / 100);
  const colorFor = { excelente: 'var(--ok)', otimo: 'var(--accent)', regular: 'var(--warn)', melhorar: 'var(--err)' }[cls.key];
  const idx = PROVAS.findIndex(p => p.id === PROVA.id);
  const nextProva = PROVAS[idx + 1];

  $main.innerHTML =
    '<div class="end-screen">' +
      '<h2>Prova Concluída</h2>' +
      '<div class="subtitle">' + esc(PROVA.titulo) + ' · ' + total + ' questões · AC 2</div>' +
      '<div class="donut"><svg viewBox="0 0 240 240">' +
        '<circle class="track" cx="120" cy="120" r="' + r + '"></circle>' +
        '<circle class="fill-arc" cx="120" cy="120" r="' + r + '" stroke="' + colorFor + '" stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ + '" id="arc"></circle>' +
      '</svg><div class="center"><div class="pct">' + pct + '%</div><div class="pct-label">Acertos</div></div></div>' +
      '<div class="badge ' + cls.key + '">' + cls.label + '</div>' +
      '<div class="end-stats">' +
        '<div class="end-stat correct"><div class="val">' + correct + '</div><div class="lbl">Acertos</div></div>' +
        '<div class="end-stat wrong"><div class="val">' + wrong + '</div><div class="lbl">Erros</div></div>' +
        '<div class="end-stat"><div class="val">' + answered + '/' + total + '</div><div class="lbl">Respondidas</div></div>' +
      '</div>' +
      '<div class="nav-buttons">' +
        '<button class="nav-btn" onclick="prev()">← Ver questões</button>' +
        '<button class="nav-btn" onclick="resetQuiz()">Refazer prova</button>' +
        (nextProva ? '<button class="nav-btn primary" onclick="selectProva(\'' + nextProva.id + '\')">Próxima prova →</button>' : '') +
      '</div>' +
    '</div>';
  requestAnimationFrame(() => { const arc = document.getElementById('arc'); if (arc) arc.style.strokeDashoffset = offset; });
}

render();
</script>
<script src="assets/efeitos.js"></script>
</body>
