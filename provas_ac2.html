ente toma mais comprimidos, o que pode comprometer a adesão, especialmente em contextos de tratamento prolongado. Na prática, a decisão entre manter R (com DTG dobrado) ou trocar por rifabutina depende da disponibilidade do fármaco, da complexidade do esquema e do risco de não-adesão. (Ver Resumo, seções 5.2 — Coinfecção TB-HIV e 6.4 — Interações medicamentosas.)"}, {"n": 10, "enunciado": "Durante uma sessão de estudo, um colega argumenta: \"O estudo SHINE provou que 4 meses de tratamento são suficientes para todas as crianças com TB, tornando o esquema de 6 meses obsoleto.\" Identifique os erros nesse raciocínio:", "alternativas": {"A": "O erro é apenas que o SHINE incluiu crianças de 0 a 16 anos — na verdade, incluiu de 3 meses a 16 anos.", "B": "Não há erros — o estudo SHINE foi um RCT multicêntrico robusto que demonstrou não-inferioridade de 4 vs. 6 meses para todas as formas de TB pediátrica.", "C": "Os erros são múltiplos: (1) o SHINE demonstrou não-inferioridade apenas para TB pulmonar não grave (sem cavitação, sem doença bilateral extensa, sem TB miliar, sem formas extrapulmonares graves); (2) a maioria dos participantes tinha < 5 anos — a representação de adolescentes foi baixa; (3) para adolescentes de 10-16 anos, o esquema encurtado se aplica apenas com baciloscopia/TRM-TB negativo ou não realizado e sem cavitação; (4) TB grave, extrapulmonar e formas com cavitação mantêm o esquema convencional.", "D": "O único erro é que o SHINE não incluiu crianças HIV-positivas, e portanto não se aplica a esse grupo.", "E": "O estudo SHINE não é um RCT — é uma coorte observacional, e por isso suas conclusões têm menor validade interna."}, "correta": "C", "explicacao": "O raciocínio do colega contém múltiplos erros de generalização. O estudo SHINE demonstrou não-inferioridade do esquema de 4 meses apenas para TB pulmonar não grave em crianças de 3 meses a 16 anos. \"Não grave\" é definido por critérios específicos: sem cavitação, sem doença bilateral extensa, sem TB miliar, sem formas extrapulmonares graves. A maioria dos participantes do SHINE tinha < 5 anos, com baixa representação de adolescentes. Para adolescentes de 10-16 anos, a Nota Informativa Nº 5/2024 restringe ainda mais: o esquema encurtado se aplica somente se não houver cavitação e a baciloscopia/TRM-TB for negativa ou não realizada. Casos com cavitação, baciloscopia positiva (em maiores de 10 anos), TB extrapulmonar ou TB grave mantêm o esquema convencional de 6 meses. A alternativa D está incorreta: o SHINE incluiu crianças HIV-positivas estáveis em TARV — a restrição é para formas graves, não para o status HIV. A alternativa E está errada: o SHINE é um RCT multicêntrico randomizado, não uma coorte observacional. (Ver Resumo, seções 5.1 — Esquema SHINE e 7.2 — Raciocínio crítico sobre o SHINE.)"}]}, {"id": "valvulopatias", "titulo": "Valvulopatias Esquerdas (SBC 2020)", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Paciente de 32 anos, feminina, com história de febre reumática na infância, apresenta dispneia progressiva (CF III NYHA). Ecocardiograma mostra AVM de 1,2 cm², gradiente diastólico médio de 12 mmHg, PSAP de 55 mmHg, escore de Wilkins-Block de 7 (calcificação = 2). Não há trombo em AE nem IM significativa. Qual a conduta mais adequada?", "alternativas": {"A": "Troca valvar mitral cirúrgica.", "B": "Valvuloplastia por balão mitral percutânea (VBMP).", "C": "Tratamento clínico com betabloqueador e diurético, reavaliação em 6 meses.", "D": "Comissurotomia cirúrgica aberta.", "E": "Valve-in-MAC transcateter."}, "correta": "B", "explicacao": "A paciente tem EM reumática grave (AVM < 1,5 cm², gradiente ≥ 10 mmHg), sintomática (CF III), com anatomia favorável para VBMP (Wilkins ≤ 8 com calcificação ≤ 2) e sem contraindicações (sem trombo em AE, sem IM significativa). A VBMP é o tratamento de escolha nessa situação (Classe I A — SBC, AHA, ESC). A cirurgia (a, d) seria indicada se houvesse contraindicação à VBMP (anatomia desfavorável, trombo, IM moderada/grave). O tratamento clínico isolado (c) não é adequado para EM grave sintomática CF III — os sintomas indicam intervenção. O valve-in-MAC (e) é para estenose degenerativa, não reumática, e ainda em fase de validação com mortalidade de 25% em 30 dias. Referência no resumo: Resumo: Seções 4.6 (Escore de Wilkins-Block), 4.7.1 (VBMP), Tabela 6."}, {"n": 2, "enunciado": "Homem de 78 anos com estenose mitral grave (AVM 1,0 cm²) por calcificação do anel mitral (MAC), em CF III NYHA, refratário ao tratamento clínico otimizado. Um colega sugere VBMP como opção menos invasiva que a cirurgia. Qual a falha no raciocínio do colega?", "alternativas": {"A": "A VBMP é contraindicada em pacientes acima de 75 anos.", "B": "A VBMP requer fusão comissural para ser efetiva — na MAC não há fusão comissural, apenas calcificação do anel.", "C": "A VBMP só pode ser realizada em pacientes em ritmo sinusal.", "D": "A VBMP é contraindicada quando há PSAP elevada.", "E": "A VBMP não existe mais como opção terapêutica desde a introdução da TAVI."}, "correta": "B", "explicacao": "A VBMP funciona separando comissuras fundidas — seu mecanismo exige fusão comissural, que ocorre na EM reumática. Na MAC, o mecanismo é calcificação do anel mitral restringindo mobilidade dos folhetos sem fusão comissural. O balão não resolve esse tipo de obstrução. A idade (a) não é contraindicação absoluta. FA (c) e HP (d) não contraindicam VBMP. A VBMP continua sendo o tratamento de escolha para EM reumática (e). A armadilha aqui é assumir que \"estenose mitral\" é uma entidade única — a etiologia (Passo 2 da abordagem SBC) modifica completamente a estratégia terapêutica. Referência no resumo: Resumo: Seções 4.1 (Fisiopatologia — diferença EM reumática vs. MAC), 4.3 (Etiologia), 4.7.1 (VBMP)."}, {"n": 3, "enunciado": "Paciente de 55 anos com insuficiência mitral primária grave por prolapso de P2 é assintomática. Ecocardiograma: FEVE 62%, DVSD 38 mm, PSAP 42 mmHg, volume de AE 55 mL/m². Ritmo sinusal. Qual a conduta?", "alternativas": {"A": "Reparo valvar mitral imediato, pois a FEVE já indica disfunção.", "B": "Troca valvar mitral, pois o prolapso impossibilita reparo.", "C": "Seguimento clínico e ecocardiográfico a cada 6-12 meses.", "D": "Reparo percutâneo (MitraClip), por ser menos invasivo.", "E": "Iniciar vasodilatador (IECA) para retardar progressão."}, "correta": "C", "explicacao": "A paciente é assintomática sem fatores prognósticos: FEVE > 60% (62%), DVSD < 40 mm (38 mm), PSAP < 50 mmHg (42 mmHg), volume de AE < 60 mL/m² (55 mL/m²), ritmo sinusal. Sem fatores prognósticos, a conduta é seguimento vigilante (Passo 4). A armadilha na alternativa (a) é confundir FEVE 62% com disfunção — embora na IM uma FEVE \"normal\" possa significar disfunção inicial, o limiar da diretriz é FEVE ≤ 60%, não 62%. O prolapso de P2 (b) é justamente a anatomia MAIS favorável para reparo. MitraClip (d) é para alto risco/contraindicação cirúrgica. IECA de rotina (e) não é recomendado na IM primária assintomática com VE compensado — pode mascarar progressão. Referência no resumo: Resumo: Seções 5.5 (Fatores prognósticos), 5.6 (Tratamento), Tabela 14."}, {"n": 4, "enunciado": "Um paciente com insuficiência mitral secundária isquêmica grave (EROA 0,35 cm²), FEVE 25%, DVSD 68 mm, CF III NYHA, em uso otimizado de IECA, betabloqueador e espironolactona, é discutido no Heart Team. Baseando-se nos critérios do estudo COAPT, este paciente seria candidato ideal ao reparo percutâneo. Um residente questiona: \"por que não simplesmente operar, já que a cirurgia resolve a IM de forma mais completa?\". Qual o melhor argumento para explicar a decisão do Heart Team?", "alternativas": {"A": "A cirurgia é contraindicada em todo paciente com FEVE < 30%.", "B": "Na IM secundária, a correção cirúrgica isolada tem alta mortalidade e alta recorrência, porque a doença de base (VE disfuncionante) persiste — o reparo percutâneo oferece benefício com menor risco operatório.", "C": "O MitraClip é superior à cirurgia em todos os cenários de IM secundária, conforme demonstrado no COAPT.", "D": "A cirurgia é preferida, mas o SUS não cobre troca valvar mitral em pacientes com IC.", "E": "A IM secundária não deve ser tratada — apenas o tratamento clínico da IC é eficaz."}, "correta": "B", "explicacao": "O princípio fundamental da IM secundária é que a correção isolada da IM sem tratar a doença de base tem resultados insatisfatórios. A cirurgia valvar mitral isolada em isquêmicos sem indicação de revascularização tem alta mortalidade e alta recorrência (IIb B). O reparo percutâneo, nos critérios COAPT (IM desproporcional à dilatação, FEVE ≥ 20%, DVSD < 70 mm), mostrou benefício com menor agressão. Este paciente atende aos critérios (EROA 0,35 cm² com VE não excessivamente dilatado — DVSD 68 mm < 70 mm, FEVE 25% ≥ 20%). A alternativa (a) é falsa — FEVE < 30% não contraindica cirurgia absolutamente. O COAPT não mostrou superioridade em TODOS os cenários (c) — o MITRA-FR não mostrou benefício em IM proporcional. A alternativa (e) ignora que há benefício seletivo do reparo percutâneo. Referência no resumo: Resumo: Seções 6.1 (Fisiopatologia), 6.3 (Tratamento), nota sobre COAPT vs. MITRA-FR, Tabela 21."}, {"n": 5, "enunciado": "Paciente de 82 anos com estenose aórtica grave (AVA 0,7 cm², gradiente médio 25 mmHg, FEVE 35%). Eco de estresse com dobutamina: aumento de 25% no volume sistólico, gradiente médio sobe para 38 mmHg, AVA permanece 0,8 cm². TC com escore de cálcio valvar de 2.500 AU. Qual a interpretação mais correta?", "alternativas": {"A": "Pseudo-EAo — o aumento do volume sistólico mostra que a valva abre normalmente. A causa dos sintomas é a disfunção ventricular.", "B": "EAo verdadeira grave — a reserva contrátil está presente, o aumento de AVA é insuficiente (< 0,3 cm²), e o escore de cálcio confirma gravidade. Indicar intervenção (TAVI pelo alto risco/idade).", "C": "Inconclusivo — o eco de estresse foi incompleto porque o gradiente não ultrapassou 40 mmHg.", "D": "Pseudo-EAo — o escore de cálcio é irrelevante neste cenário.", "E": "EAo moderada — a AVA de 0,8 cm² com dobutamina descarta gravidade."}, "correta": "B", "explicacao": "Este é o cenário clássico de EAo baixo fluxo/baixo gradiente (AVA ≤ 1,0 cm² + FEVE < 50% + gradiente < 40 mmHg). O eco de estresse mostra reserva contrátil (aumento ≥ 20% no volume sistólico). Com reserva contrátil presente, avalia-se se a AVA permanece < 1,0 cm²: a AVA subiu apenas de 0,7 para 0,8 cm² (aumento < 0,3 cm²), confirmando EAo verdadeira. O escore de cálcio de 2.500 AU (> 2.000 AU para homens) reforça a confirmação. O gradiente não precisa ultrapassar 40 mmHg (c) — o critério é a variação da AVA. Na pseudo-EAo (a, d), a AVA aumentaria significativamente (> 1,0 cm²) mostrando que a valva não é intrinsecamente estenosada. Referência no resumo: Resumo: Seções 7.2 (Baixo fluxo/baixo gradiente), Figura 6, Tabela 22."}, {"n": 6, "enunciado": "Paciente de 62 anos com EAo grave degenerativa, STS score 2,5%, assintomático, FEVE 58%, sem FA. Teste ergométrico normal. Um colega afirma: \"os últimos estudos mostram que TAVI é superior à cirurgia inclusive em baixo risco — devemos indicar TAVI\". Qual o argumento mais sólido para contestar essa indicação?", "alternativas": {"A": "TAVI não funciona em pacientes com etiologia degenerativa.", "B": "A TAVI só pode ser indicada após falha do tratamento clínico.", "C": "Os estudos de TAVI em baixo risco tinham idade média de 75 anos e seguimento de 1-2 anos. Um paciente de 62 anos precisa de durabilidade de prótese ≥ 20 anos — dado ainda indisponível para próteses transcateter.", "D": "A TAVI é contraindicada em EAo degenerativa por risco de embolia calcificada.", "E": "O paciente é assintomático, portanto nenhuma intervenção é indicada."}, "correta": "C", "explicacao": "A diretriz SBC classifica TAVI em baixo risco < 70 anos como IIb C (evitar). O argumento central é a ausência de dados de durabilidade: os estudos PARTNER 3 e Evolut Low Risk tinham idade média de 75,4 anos e seguimento de 1-2 anos na publicação original. A durabilidade de próteses transcateter além de 7-8 anos é desconhecida. Um paciente de 62 anos precisa de ≥ 20 anos de durabilidade. A alternativa (e) é parcialmente correta (assintomático sem fatores prognósticos = seguimento), mas o argumento contra TAVI especificamente é a durabilidade, não a assintomaticidade. A armadilha é extrapolar resultados de meta-análises com população idosa para jovens — viés de generalização. Referência no resumo: Resumo: Seções 7.8.2 (TAVI), nota de leitura crítica sobre durabilidade, 11.2 (Limitações)."}, {"n": 7, "enunciado": "Paciente de 28 anos com insuficiência aórtica crônica reumática grave, assintomático, FEVE 55%, DVDF 73 mm, DVSD 52 mm. Pela diretriz AHA (DVDF > 70 mm ou DVSD > 50 mm), há indicação de cirurgia. Pela diretriz SBC, qual seria a conduta?", "alternativas": {"A": "Cirurgia imediata — os critérios SBC são idênticos aos da AHA.", "B": "Seguimento — na IAo reumática, a SBC adota limiares maiores (DVDF > 75 mm e DVSD > 55 mm), e este paciente ainda não os atingiu.", "C": "TAVI, por ser menos invasivo em paciente jovem.", "D": "Cirurgia, porque FEVE < 60% já é critério independente para IAo.", "E": "Cirurgia, porque qualquer dilatação do VE na IAo indica intervenção."}, "correta": "B", "explicacao": "A SBC é a ÚNICA diretriz que distingue limiares de diâmetros ventriculares conforme etiologia da IAo. Para reumáticos: DVDF > 75 mm e DVSD > 55 mm. Para não-reumáticos: DVDF > 70 mm e DVSD > 50 mm (iguais a AHA/ESC). Este paciente reumático tem DVDF 73 mm e DVSD 52 mm — ambos abaixo dos limiares da SBC para reumáticos. A base é um estudo brasileiro (n=75) que mostrou sobrevida de 90,6% em 10 anos com esses limiares mais permissivos. A alternativa (d) está incorreta: o limiar de FEVE para indicar cirurgia na IAo é < 50%, não < 60% (diferente da IM primária). A armadilha clínica é aplicar os mesmos limiares de AHA/ESC a um paciente reumático brasileiro jovem. Referência no resumo: Resumo: Seções 8.5 (Fatores prognósticos — limiares SBC), 8.1 (Fisiopatologia), Tabela 34."}, {"n": 8, "enunciado": "Paciente de 70 anos com prótese mecânica mitral em uso de varfarina (INR 2,5-3,5) desenvolve FA. Um residente sugere trocar a varfarina por rivaroxabana, argumentando que \"os DOACs são mais práticos e têm menor risco de sangramento intracraniano que a varfarina\". Qual o erro do residente e qual a base de evidência?", "alternativas": {"A": "O residente está correto — rivaroxabana é preferida em próteses mecânicas com FA.", "B": "O erro é que DOACs são classe III em próteses mecânicas. O estudo RE-ALIGN (dabigatrana) foi interrompido por excesso de tromboembolismo e sangramento. Varfarina é obrigatória.", "C": "O erro é que apixabana deveria ser usada em vez de rivaroxabana.", "D": "O erro é apenas na dose — rivaroxabana em dose maior seria aceitável.", "E": "O erro é que nenhuma anticoagulação é necessária em próteses mecânicas com FA — apenas AAS."}, "correta": "B", "explicacao": "DOACs são CONTRAINDICADOS (Classe III B) em próteses mecânicas — SBC, AHA e ESC concordam. A evidência é o estudo RE-ALIGN, que testou dabigatrana em próteses mecânicas e foi interrompido precocemente por excesso de eventos tromboembólicos e sangramentos. A varfarina é obrigatória em TODAS as próteses mecânicas, com INR alvo de 2,5-3,5 para posição mitral. A praticidade e o menor risco de sangramento intracraniano dos DOACs, demonstrados em FA não-valvar, NÃO se aplicam a próteses mecânicas — o mecanismo trombogênico de superfícies sintéticas exige a ação anticoagulante específica da varfarina sobre os fatores vitamina K-dependentes. Nenhum outro DOAC (c, d) foi validado nessa indicação. Referência no resumo: Resumo: Seções 9.2 (Próteses Valvares), nota sobre RE-ALIGN, 11.2 (Limitações)."}, {"n": 9, "enunciado": "Um paciente com EM grave reumática e FA crônica é anticoagulado com varfarina. INR de controle retorna 5,3. O paciente está assintomático, sem sangramento. Qual a conduta quanto à anticoagulação?", "alternativas": {"A": "Suspender varfarina definitivamente e trocar para apixabana.", "B": "Manter mesma dose — INR 5,3 é aceitável em EM com FA.", "C": "Suspender varfarina até INR retornar a 2,0-3,0, depois retomar com redução de 15% da dose semanal.", "D": "Administrar vitamina K 10 mg IV e internar.", "E": "Administrar plasma fresco congelado imediatamente."}, "correta": "C", "explicacao": "Conforme a tabela de ajuste de varfarina da diretriz SBC: INR 5,0-8,99 → suspender até INR retornar a 2,0-3,0, retomar com redução de 15% da dose semanal. O paciente está assintomático e sem sangramento, portanto medidas agressivas (d, e) não são necessárias. A vitamina K IV em dose alta é reservada para INR ≥ 9,0 ou sangramento ativo. A alternativa (a) é incorreta porque DOACs são CONTRAINDICADOS em EM com FA (Classe III). O alvo de INR para EM com FA é 2,0-3,0 (não > 5,0), portanto (b) é incorreto. Referência no resumo: Resumo: Seções 9.1 (Valva nativa com FA — DOACs contraindicados em EM), 9.3 (Tabela de ajuste de varfarina — Tabela 62)."}, {"n": 10, "enunciado": "Um colega lê o abstract de um estudo que mostra \"redução de 40% na trombose subclínica de folhetos após TAVI com anticoagulação profilática com rivaroxabana\". Ele conclui que a rivaroxabana deveria ser usada rotineiramente pós-TAVI. Usando conceitos de leitura crítica de evidência, qual o principal argumento contra essa conclusão?", "alternativas": {"A": "A trombose subclínica de folhetos não é clinicamente relevante — tudo bem ignorá-la.", "B": "A trombose subclínica é um desfecho SUBSTITUTO. O estudo GALILEO, que testou rivaroxabana pós-TAVI, foi interrompido por AUMENTO de eventos clínicos (tromboembolismo e sangramento) apesar de melhora no desfecho substituto.", "C": "O colega deveria esperar estudos com apixabana antes de concluir.", "D": "A rivaroxabana é contraindicada em todos os pacientes cardíacos.", "E": "O estudo deveria ter usado AVK em vez de DOAC como comparador."}, "correta": "B", "explicacao": "Este é um exemplo clássico da dissociação entre desfecho substituto (trombose subclínica de folhetos — um achado de imagem) e desfecho clínico (mortalidade, AVC, sangramento). O estudo GALILEO mostrou que a rivaroxabana reduziu trombose subclínica (desfecho substituto) mas AUMENTOU eventos clínicos (desfecho que importa), sendo interrompido precocemente. Isso ensina que: (1) desfechos substitutos podem não se traduzir em benefício clínico — e podem até se associar a dano; (2) ler apenas abstracts e focar em desfechos substitutos leva a conclusões perigosas; (3) a interrupção precoce de um estudo por dano é a evidência mais forte contra uma intervenção. Referência no resumo: Resumo: Seções 9.2 (GALILEO), 11.2 (Limitações — GALILEO), 11.3 (desfechos substitutos vs. clínicos)."}]}, {"id": "pancreatite", "titulo": "Pancreatite Aguda", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Homem, 42 anos, etilista crônico, é admitido no PS com dor abdominal intensa em faixa há 8 horas, associada a vômitos e irradiação dorsal. Exames laboratoriais mostram lipase sérica de 1.850 U/L (VR < 60) e amilase sérica de 380 U/L (VR < 100). TC de abdome realizada na admissão mostra pâncreas com realce homogêneo ao contraste, sem coleções definidas. Após 24 horas, o paciente mantém FC = 105, FR = 22, T = 37,8 °C e leucócitos = 14.500. Após 72 horas, o paciente permanece com taquicardia (FC = 100) e FR = 20, porém com melhora da dor. Sobre a classificação de gravidade deste paciente, assinale a alternativa CORRETA:", "alternativas": {"A": "A TC normal na admissão exclui PA necrosante; portanto, este paciente tem PA edematosa intersticial leve.", "B": "A presença de SIRS na admissão que persiste em 48 horas classifica este caso como PA moderadamente grave, mesmo sem evidência de necrose na TC.", "C": "A presença de SIRS persistente em 48 horas é o melhor preditor de PA grave (falência orgânica persistente), e o escore de Marshall deve ser calculado para definir a classificação.", "D": "O BISAP deste paciente é ≥ 3, o que por si só define PA grave pela classificação de Atlanta revisada.", "E": "A lipase sérica > 30× o limite superior da normalidade é, por si só, marcador confiável de PA necrosante e indica necessidade de TC precoce repetida."}, "correta": "C", "explicacao": "O paciente apresenta SIRS (FC > 90, FR > 20, leucocitose > 12.000 e temperatura > 38 °C — pelo menos 2 critérios em 24h, mantidos em 48h). SIRS persistente em 48h é um dos melhores preditores de PA grave, com sensibilidade ~85%. Contudo, SIRS por si só não classifica a gravidade pela Classificação de Atlanta Revisada 2012 — é necessário calcular o escore de Marshall modificado (sistemas respiratório, renal e cardiovascular) para determinar se há falência orgânica (Marshall ≥ 2 em qualquer sistema). Se a falência orgânica persistir > 48h → PA grave; se resolver em < 48h → PA moderadamente grave. Por que as outras estão erradas: A) TC precoce (< 72h) subestima a necrose — a perfusão pancreática demora a definir-se, e a TC deve ser repetida após 72-96h se houver suspeita clínica. Uma TC normal na admissão não exclui necrose futura. B) PA moderadamente grave exige falência orgânica transitória (< 48h) OU complicações locais — SIRS por si só não define a classificação de Atlanta, que depende do escore de Marshall. D) BISAP é um escore de predição de gravidade, não faz parte da classificação de Atlanta revisada. BISAP ≥ 3 prediz maior mortalidade, mas a classificação formal requer Marshall ≥ 2 persistente > 48h. E) O nível absoluto de lipase não se correlaciona com gravidade da PA nem com presença de necrose — lipase muito elevada pode ocorrer em PA edematosa leve, e necrose pode ocorrer com lipase modestamente elevada. (Seção: Diagnóstico e Classificação/Gravidade do Resumo)"}, {"n": 2, "enunciado": "Mulher, 55 anos, IMC 34, admitida com PA biliar moderadamente grave (classificação de Atlanta). Está em 4 horas de internação. Sinais vitais estáveis, diurese 0,3 mL/kg/h nas últimas 2 horas. BUN = 28 mg/dL e hematócrito = 47%. A equipe de plantão discute a estratégia de ressuscitação volêmica. Sobre a ressuscitação volêmica neste caso, assinale a alternativa CORRETA:", "alternativas": {"A": "A ressuscitação agressiva (20 mL/kg em bolus + 3 mL/kg/h) é a estratégia com melhor evidência, conforme o ensaio clínico WATERFALL (de-Madeira, NEJM 2022).", "B": "O Ringer Lactato é preferido ao SF 0,9% porque seu pH e composição eletrolítica reduzem acidose hiperclorêmica e atenuam a resposta inflamatória via inibição de NF-κB.", "C": "A meta de BUN-alvo na ressuscitação da PA é < 10 mg/dL, conforme recomendação forte da ACG 2024.", "D": "Coloides (albumina) são superiores a cristaloides na ressuscitação da PA grave, conforme metanálises recentes.", "E": "A ressuscitação volêmica deve ser suspensa quando a diurese atingir > 1 mL/kg/h, independentemente de outros parâmetros."}, "correta": "B", "explicacao": "O Ringer Lactato é o cristaloide de escolha na ressuscitação da PA por dois mecanismos: (1) seu pH de 6,5 e composição eletrolítica fisiológica reduzem a acidose hiperclorêmica que o SF 0,9% provoca (Cl⁻ = 154 mEq/L no SF vs. 109 mEq/L no RL); (2) o lactato é metabolizado em bicarbonato no fígado, e a composição do RL modula a ativação de NF-κB, atenuando a cascata inflamatória. Um RCT (Wu et al., 2011) demonstrou menor SIRS e menor PCR em 24h com RL vs. SF. Por que as outras estão erradas: A) O estudo WATERFALL (de-Madeira, NEJM 2022) mostrou o OPOSTO: ressuscitação agressiva não foi superior à moderada (1,5 mL/kg/h) e foi associada a maior sobrecarga hídrica. O estudo foi interrompido precocemente por futilidade. A ACG 2024 agora recomenda ressuscitação 'goal-directed' moderada. C) A meta é BUN < 20 mg/dL (não < 10), que é um dos alvos de ressuscitação adequada, junto com diurese > 0,5 mL/kg/h e FC < 120. D) Não há evidência de superioridade de coloides sobre cristaloides na PA. A recomendação é para cristaloides (preferencialmente RL). E) A ressuscitação é guiada por múltiplos parâmetros (diurese, FC, BUN, hematócrito), não apenas pela diurese isolada. A meta de diurese é > 0,5 mL/kg/h (não > 1). (Seção: Tratamento do Resumo)"}, {"n": 3, "enunciado": "Homem, 38 anos, é internado com PA grave com SIRS persistente e Marshall respiratório = 3 (PaO₂/FiO₂ = 180). Na admissão, está em jejum e recebendo analgesia com dipirona IV e morfina SC conforme demanda. Um residente propõe iniciar nutrição parenteral total (NPT) porque 'o pâncreas precisa de repouso'. Outro residente sugere antibioticoterapia profilática com imipenem 'para prevenir infecção da necrose'. Sobre a conduta nutricional e antibiótica neste caso, assinale a alternativa CORRETA:", "alternativas": {"A": "A NPT é a via preferida na PA grave para garantir repouso pancreático, devendo ser iniciada nas primeiras 24 horas.", "B": "Antibioticoprofilaxia com carbapenêmico está indicada em toda PA grave para reduzir a mortalidade por necrose infectada.", "C": "A nutrição enteral via sonda nasojejunal deve ser iniciada em 24-48 horas e é superior à NPT na PA grave, pois reduz mortalidade (RR 0,50), falência orgânica e infecção — e a antibioticoprofilaxia não é recomendada.", "D": "A nutrição oral precoce deve ser tentada em todo paciente com PA grave, mesmo naqueles com íleo paralítico franco.", "E": "A NPT é equivalente à nutrição enteral em termos de mortalidade, mas preferida pelo menor custo e menor taxa de complicações metabólicas."}, "correta": "C", "explicacao": "A nutrição enteral (via sonda nasogástrica ou nasojejunal) é superior à NPT na PA grave: metanálise mostra RR de morte de 0,50 (IC 95%: 0,28-0,91), RR de falência de múltiplos órgãos de 0,55, e menor taxa de infecção. O mecanismo: a nutrição enteral mantém a integridade da barreira mucosa intestinal, prevenindo translocação bacteriana — principal via de infecção da necrose. Deve ser iniciada em 24-48h se a via oral não for tolerada. Quanto à antibioticoprofilaxia: RCTs e metanálises (incluindo o estudo multicêntrico holandês) não demonstraram redução de mortalidade ou infecção com antibióticos profiláticos na PA grave. ACG 2024: recomendação contra antibioticoprofilaxia (recomendação condicional, evidência baixa). Antibióticos devem ser reservados para infecção documentada ou fortemente suspeita. Por que as outras estão erradas: A) O conceito de 'repouso pancreático' com NPT está ultrapassado. A nutrição enteral estimula minimamente a secreção pancreática (especialmente via jejunal) e seus benefícios na barreira intestinal superam esse efeito. B) O estudo PROPATRIA mostrou que probióticos profiláticos aumentaram mortalidade; metanálises de antibioticoprofilaxia não demonstraram benefício. A recomendação atual é contra profilaxia. D) A via oral precoce é a preferência inicial, mas em pacientes com PA grave e íleo paralítico franco, a via oral não é viável — a sonda enteral é a alternativa, não a via oral forçada. E) NPT é inferior à enteral em mortalidade e complicações, além de mais cara e com mais complicações metabólicas e infecciosas (infecção de cateter). (Seção: Tratamento do Resumo)"}, {"n": 4, "enunciado": "Mulher, 48 anos, com PA biliar. USG na admissão mostra colelitíase com colédoco dilatado (10 mm) e bilirrubina total = 4,2 mg/dL. Após 48 horas, a paciente evolui com febre 39 °C, icterícia progressiva (BT = 8,5 mg/dL), taquicardia e calafrios. Lipase sérica mantém-se elevada. O plantonista considera CPRE urgente. Sobre a indicação de CPRE neste caso, assinale a alternativa CORRETA:", "alternativas": {"A": "A CPRE está indicada em toda PA biliar com coledocolitíase suspeitada, independentemente de sinais de colangite.", "B": "A paciente preenche critérios de Tokyo para colangite aguda (febre + icterícia + dilatação de via biliar), e a CPRE urgente (< 24 horas) está indicada, pois a colangite associada à PA tem mortalidade elevada sem descompressão.", "C": "A CPRE deve ser evitada porque pode agravar a pancreatite aguda; deve-se aguardar resolução completa da PA para realizar colangiografia.", "D": "A colangioressonância (CPRM) deve ser feita primeiro para confirmar coledocolitíase antes de qualquer decisão sobre CPRE.", "E": "A CPRE está indicada apenas se houver confirmação de cálculo no colédoco por ecoendoscopia, mesmo na vigência de colangite."}, "correta": "B", "explicacao": "A paciente apresenta a tríade de Charcot (febre com calafrios + icterícia + dor abdominal/dilatação de via biliar), preenchendo os critérios de Tokyo para colangite aguda. Na presença de colangite associada a PA biliar, a CPRE urgente (< 24 horas) é indicação inequívoca — esta é uma das poucas indicações ABSOLUTAS de CPRE na PA, com recomendação forte tanto pela ACG 2024 quanto pela diretriz AGA. A mortalidade da colangite não drenada pode chegar a 50%, e a CPRE com esfincterotomia e extração de cálculos resolve a obstrução e a fonte de infecção simultaneamente. Por que as outras estão erradas: A) A CPRE NÃO está indicada rotineiramente em toda PA biliar. Na ausência de colangite ou obstrução biliar persistente, a CPRE precoce não melhora desfechos (estudo APEC). Indicação apenas se: colangite, obstrução biliar persistente (BT em ascensão) ou cálculo impactado visível. C) A CPRE não agrava significativamente a PA já instalada. O risco de pancreatite pós-CPRE é uma complicação da CPRE em pacientes SEM PA prévia; não é motivo para adiar em caso de colangite. D) Na vigência de colangite, aguardar CPRM é perda de tempo desnecessária — o quadro clínico e laboratorial já são suficientes para indicar CPRE urgente. CPRM tem papel em casos de suspeita intermediária de coledocolitíase SEM colangite. E) Na colangite aguda, a CPRE é terapêutica e não exige confirmação por ecoendoscopia. A ecoendoscopia tem papel nos casos de suspeita intermediária de coledocolitíase sem colangite. (Seção: Tratamento — CPRE do Resumo)"}, {"n": 5, "enunciado": "Homem, 60 anos, PA necrosante grave, em UTI há 18 dias. Houve melhora clínica inicial, com resolução da falência orgânica no dia 10. No dia 16, porém, apresenta febre recorrente (38,8 °C), leucocitose em ascensão (19.000), e piora do estado geral. TC de abdome mostra coleção heterogênea de 12 cm na região peripancreática com presença de bolhas de gás no seu interior. Sobre o manejo deste paciente, assinale a alternativa CORRETA:", "alternativas": {"A": "A presença de gás na coleção é patognomônica de necrose infectada e indica necrosectomia aberta imediata como procedimento de escolha.", "B": "A conduta inicial recomendada é a abordagem step-up: iniciar antibioticoterapia (carbapenêmico) e drenagem percutânea ou endoscópica, reservando a necrosectomia minimamente invasiva apenas se a drenagem falhar.", "C": "A punção aspirativa por agulha fina (FNA) guiada por TC é obrigatória antes de iniciar antibióticos, para confirmar infecção e obter cultura com antibiograma.", "D": "A drenagem endoscópica transluminal está contraindicada porque a coleção é heterogênea com debris sólidos.", "E": "A intervenção deve ser realizada o mais precocemente possível, preferencialmente antes de 3 semanas do início da PA, para evitar sepse refratária."}, "correta": "B", "explicacao": "O cenário é clássico de necrose infectada: deterioração secundária após melhora inicial, no período de 2-4 semanas, com febre recorrente e gás na coleção na TC (patognomônico, mas presente em apenas 30-40% dos casos). A abordagem step-up é o padrão atual: (1) antibioticoterapia empírica com carbapenêmico (meropenem ou imipenem — boa penetração em tecido necrótico); (2) drenagem minimamente invasiva (percutânea ou endoscópica transluminal); (3) necrosectomia minimamente invasiva (VARD ou endoscópica) apenas se a drenagem falhar; (4) necrosectomia aberta como último recurso. O RCT PANTER demonstrou que 35-64% dos pacientes resolvem com drenagem apenas, sem necessidade de necrosectomia. Por que as outras estão erradas: A) Embora o gás na coleção seja patognomônico de infecção, a necrosectomia ABERTA não é o procedimento de escolha — foi substituída pela abordagem step-up. A cirurgia aberta tem maior morbidade (falência orgânica nova, diabetes, hernia incisional). C) A FNA guiada por TC era rotina anteriormente, mas a ACG 2024 não a recomenda mais como obrigatória. A decisão pode ser baseada em critérios clínico-radiológicos (como gás na coleção + deterioração clínica). Se feita, não deve adiar o início dos antibióticos. Procalcitonina > 3,8 ng/mL tem boa sensibilidade e pode auxiliar a decisão. D) A drenagem endoscópica transluminal é eficaz inclusive em coleções com debris (WON). O estudo TENSION demonstrou equivalência entre step-up endoscópico e cirúrgico, e stents metálicos tipo LAMS facilitam a necrosectomia endoscópica subsequente se necessária. E) O timing ideal para intervenção é preferencialmente APÓS 4 semanas, quando a coleção está encapsulada (WON) e a necrose mais demarcada, facilitando a drenagem e reduzindo complicações. Intervenção precoce (< 3 semanas) é reservada para sepse refratária a antibióticos. (Seção: Complicações e Tratamento do Resumo)"}, {"n": 6, "enunciado": "Mulher, 65 anos, é internada com primeiro episódio de PA biliar leve (sem falência orgânica, sem complicações locais). Evolui bem, com resolução da dor e tolerância à dieta oral em 48 horas. A equipe discute o melhor momento para a colecistectomia. Sobre o timing da colecistectomia neste caso, assinale a alternativa CORRETA:", "alternativas": {"A": "A colecistectomia deve ser realizada eletivamente em 6 semanas, após resolução completa do processo inflamatório.", "B": "A colecistectomia deve ser realizada na mesma internação (index cholecystectomy), idealmente quando a PA tiver resolvido clinicamente, pois adiar aumenta significativamente o risco de recorrência de PA biliar (até 25-30% em 6 semanas).", "C": "A colecistectomia pode ser substituída por esfincterotomia endoscópica em todos os pacientes com PA biliar, sem necessidade de cirurgia.", "D": "A colecistectomia na mesma internação é contraindicada pelo risco de pancreatite pós-operatória e deve ser sempre diferida.", "E": "A colecistectomia profilática só está indicada se houver mais de um cálculo na vesícula à ultrassonografia."}, "correta": "B", "explicacao": "A colecistectomia na mesma internação (index cholecystectomy) é fortemente recomendada para PA biliar leve pela ACG 2024 (recomendação forte, evidência moderada). O racional é que o risco de recorrência de evento biliar (PA recorrente, cólica biliar, colecistite, colangite) é de 25-30% em 6 semanas se a colecistectomia for diferida, com 40% de recorrência em 12 semanas. O RCT PONCHO demonstrou que a colecistectomia na mesma internação é segura e reduz significativamente a recorrência de eventos biliares (5% vs. 17%). O procedimento deve ser feito quando os marcadores inflamatórios estiverem em queda e a dor controlada — geralmente dia 3-5. Armadilha clínica: confundir PA biliar leve com PA biliar grave. Na PA grave com necrose, a colecistectomia é adiada para após resolução das complicações (6-8 semanas ou mais). Operar durante inflamação ativa grave aumenta risco de complicações cirúrgicas. Por que as outras estão erradas: A) Adiar 6 semanas expõe ao risco de 25-30% de recorrência desnecessária. C) A esfincterotomia endoscópica é uma alternativa à colecistectomia APENAS em pacientes com risco cirúrgico proibitivo (ASA ≥ 3, comorbidades graves). A vesícula permanece e pode causar colecistite ou outras complicações. D) Não há evidência de que a colecistectomia na mesma internação aumente pancreatite pós-operatória. O PONCHO mostrou segurança equivalente. E) A indicação de colecistectomia na PA biliar é independente do número de cálculos — a presença de litíase por si só é indicação. (Seção: Tratamento — Colecistectomia do Resumo)"}, {"n": 7, "enunciado": "Residente de clínica médica lê o resumo do estudo PROPATRIA sobre uso de probióticos na PA e comenta: 'Se o estudo falhou em mostrar benefício, então podemos concluir que a barreira intestinal não é relevante na fisiopatologia da infecção da necrose.' Sobre o raciocínio do residente e a interpretação do PROPATRIA, assinale a alternativa CORRETA:", "alternativas": {"A": "O raciocínio está correto: o PROPATRIA demonstrou que a translocação bacteriana não é relevante na PA.", "B": "O raciocínio está incorreto: o estudo PROPATRIA na verdade confirmou que probióticos previnem necrose infectada.", "C": "O raciocínio é falaciologicamente inválido: o fracasso de uma intervenção (probióticos) não refuta o mecanismo (translocação bacteriana). A barreira intestinal é central na fisiopatologia — o que o PROPATRIA mostrou é que probióticos não são o veículo adequado para protegê-la, e que podem inclusive causar dano (isquemia intestinal) na PA grave.", "D": "O PROPATRIA não pode ser interpretado porque foi um estudo observacional retrospectivo.", "E": "O PROPATRIA foi interrompido precocemente por futilidade, sem diferença em mortalidade."}, "correta": "C", "explicacao": "Este é um erro de raciocínio clínico comum e importante: confundir a falha de uma intervenção com a refutação do mecanismo que ela pretendia modular. O PROPATRIA foi um RCT multicêntrico holandês (n=298) que testou probióticos profiláticos na PA grave. Resultado: os probióticos NÃO reduziram infecção e, mais grave, AUMENTARAM mortalidade (16% vs. 6%, p=0,01), provavelmente por isquemia intestinal causada pelos próprios probióticos em pacientes com hipoperfusão mesentérica. A translocação bacteriana continua sendo o mecanismo central de infecção da necrose: bactérias entéricas (E. coli, Klebsiella, Enterococcus) são os patógenos mais comuns na necrose infectada, e a nutrição enteral — que protege a barreira intestinal por outro mecanismo (manutenção do trofismo mucoso e da motilidade) — de fato reduz infecção. O que o PROPATRIA ensina é que nem toda intervenção que visa um mecanismo válido será eficaz: a intervenção pode ser inadequada, danosa, ou insuficiente, sem que isso invalide o alvo terapêutico. Lição transferível: sempre que um estudo 'falha', pergunte: o mecanismo-alvo era inadequado, ou a intervenção era inadequada para modular o mecanismo? (Seção: Raciocínio Crítico do Resumo)"}, {"n": 8, "enunciado": "Homem, 35 anos, apresenta-se ao PS com dor abdominal epigástrica intensa de início súbito há 6 horas. Nega etilismo. Lipase sérica = 1.200 U/L, triglicerídeos = 2.800 mg/dL, amilase sérica = 95 U/L (VR < 100). USG abdominal sem cálculos biliares. Sobre este caso, assinale a alternativa CORRETA:", "alternativas": {"A": "A amilase normal exclui o diagnóstico de PA; a elevação isolada de lipase pode ser devida à hipertrigliceridemia sem pancreatite.", "B": "O diagnóstico de PA está estabelecido (lipase > 3× o limite superior + dor compatível), e a amilase pode ser falsamente normal na PA por hipertrigliceridemia por interferência laboratorial.", "C": "A amilase é mais específica que a lipase para o diagnóstico de PA; portanto, a amilase normal deve prevalecer.", "D": "É necessário TC de abdome para confirmar o diagnóstico de PA neste caso.", "E": "Triglicerídeos de 2.800 mg/dL não causam PA; o limite para PA por hipertrigliceridemia é > 5.000 mg/dL."}, "correta": "B", "explicacao": "O diagnóstico de PA requer 2 de 3 critérios: (1) dor abdominal compatível, (2) lipase ou amilase > 3× LSN, (3) achados de imagem. Este paciente preenche os dois primeiros. A lipase é o marcador preferido por maior sensibilidade e especificidade que a amilase. Na PA por hipertrigliceridemia, a amilase pode ser falsamente NORMAL por duas razões: (1) interferência laboratorial direta — triglicerídeos elevados inibem a detecção da amilase no ensaio (artefato técnico); (2) a hipertrigliceridemia pode causar pancreatite sem elevação significativa de amilase pela própria fisiopatologia. A etiologia (hipertrigliceridemia) é confirmada por TG > 1.000 mg/dL (o limiar clássico). O mecanismo: hidrólise de triglicerídeos pela lipase pancreática gera ácidos graxos livres em concentrações tóxicas para células acinares e capilares pancreáticos. Por que as outras estão erradas: A) A lipase elevada > 3× LSN com dor compatível é suficiente — a amilase normal não exclui PA. C) A lipase é MAIS sensível e MAIS específica que a amilase. A ACG 2024 recomenda lipase como marcador de escolha. D) TC não é necessária quando 2 de 3 critérios já estão preenchidos. TC precoce tem papel em diagnóstico diferencial ou avaliação de complicações, não para confirmar PA já diagnosticada. E) O limiar para PA por hipertrigliceridemia é > 1.000 mg/dL, não > 5.000 mg/dL. (Seção: Diagnóstico do Resumo)"}, {"n": 9, "enunciado": "Paciente com PA necrosante grave apresenta coleções peripancreáticas extensas após 5 semanas de internação. A equipe solicita TC com contraste e identifica necrose encapsulada (walled-off necrosis — WON) de 9 cm no corpo/cauda pancreática. O paciente está clinicamente estável, sem sinais de infecção, tolerando dieta enteral e sem falência orgânica. Um cirurgião sugere intervenção para 'limpar a necrose enquanto está estéril'. Sobre a conduta em relação a esta WON estéril, assinale a alternativa CORRETA:", "alternativas": {"A": "A necrosectomia profilática está indicada para prevenir infecção futura, especialmente em coleções > 6 cm.", "B": "A WON estéril deve ser manejada conservadoramente, pois a intervenção em necrose estéril NÃO melhora desfechos e aumenta o risco de infecção iatrogênica e complicações procedimentais.", "C": "A drenagem percutânea é indicada para toda WON > 6 cm, independentemente de sintomas ou infecção.", "D": "A CPRM deve ser feita antes de qualquer decisão para avaliar integridade do ducto pancreático principal.", "E": "Antibioticoprofilaxia deve ser mantida enquanto houver WON visível na imagem, para prevenir superinfecção."}, "correta": "B", "explicacao": "A necrose estéril NÃO é indicação de intervenção, independentemente do tamanho da coleção. A evidência é consistente: drenar ou operar necrose estéril introduz risco de infecção iatrogênica (a comunicação com o meio externo contamina a coleção), além dos riscos procedimentais (hemorragia, fístula, perfuração). A ACG 2024 enfatiza que a indicação de intervenção é necrose INFECTADA confirmada ou fortemente suspeita, NÃO necrose estéril. A WON estéril pode: (1) ser reabsorvida parcial ou totalmente ao longo de semanas/meses; (2) permanecer estável e assintomática; (3) causar sintomas compressivos (saciedade precoce, obstrução biliar ou duodenal) — neste último caso, a indicação é sintomática, não profilática. Este paciente está estável e tolerando dieta, sem indicação de intervenção. Armadilha clínica: o tamanho da coleção tenta o cirurgião, mas tamanho isolado não é indicação. A decisão de intervir é clínica (sintomas, infecção), não radiológica. Por que as outras estão erradas: A) Não existe conceito de 'necrosectomia profilática' baseado em evidência. C) Drenar WON estéril assintomática aumenta risco sem benefício demonstrado. D) CPRM pode ser útil para avaliar a síndrome do ducto desconectado, mas não é pré-requisito para decidir sobre intervenção na WON estéril assintomática. E) Antibioticoprofilaxia não está indicada — vide questão 3. (Seção: Complicações do Resumo)"}, {"n": 10, "enunciado": "Um colega de residência lê um estudo recente sobre um novo inibidor de protease na PA que mostra 'redução significativa da lipase sérica em 48 horas (p < 0,001) comparado ao placebo'. O colega comenta empolgado: 'Finalmente uma droga que funciona na PA! A lipase caiu pela metade!' Sobre a interpretação deste estudo, assinale a alternativa CORRETA:", "alternativas": {"A": "O entusiasmo é justificado: redução de lipase demonstra eficácia clínica do fármaco.", "B": "A redução de lipase é um desfecho substituto (surrogate endpoint) que não se traduz necessariamente em benefício clínico. É preciso avaliar se o estudo mediu desfechos clínicos (mortalidade, falência orgânica, infecção, tempo de internação) antes de concluir eficácia.", "C": "A lipase sérica é um desfecho clínico direto, pois reflete diretamente a atividade da doença pancreática.", "D": "O p-valor < 0,001 garante relevância clínica do resultado.", "E": "Inibidores de protease já demonstraram eficácia robusta em múltiplos RCTs na PA e são recomendados pela ACG 2024."}, "correta": "B", "explicacao": "Esta questão ilustra dois conceitos centrais do raciocínio crítico: a distinção entre desfechos substitutos e clínicos, e a diferença entre significância estatística e relevância clínica. A lipase sérica é um desfecho substituto (surrogate endpoint) — um biomarcador que reflete um processo biológico, mas não necessariamente se traduz em benefício clínico para o paciente. Desfechos clínicos relevantes na PA são: mortalidade, falência orgânica, infecção da necrose, necessidade de intervenção, e tempo de internação. Um fármaco pode reduzir lipase sem reduzir nenhum desses — isso NÃO é benefício clínico real. Adicionalmente, o p-valor < 0,001 indica apenas significância ESTATÍSTICA (a diferença provavelmente não é devida ao acaso), mas não informa sobre a MAGNITUDE ou RELEVÂNCIA CLÍNICA do efeito. Com um 'n' suficientemente grande, diferenças triviais atingem significância estatística. É preciso avaliar o tamanho do efeito (diferença absoluta, NNT, IC 95%). Por que as outras estão erradas: A) e C) Lipase é biomarcador, não desfecho clínico. D) P-valor não é sinônimo de relevância clínica — apenas descarta o acaso. E) Inibidores de protease (gabexato, nafamostat) falharam em múltiplos RCTs na PA e NÃO são recomendados. Este é um exemplo onde o paradoxo dos resultados negativos é didático: se inibir a autodigestão no momento da administração (horas após o início da cascata) não funciona, isso sugere que o dano já está feito quando o paciente chega ao hospital. (Seção: Raciocínio Crítico do Resumo)"}]}, {"id": "drc", "titulo": "Doença Renal Crônica (KDIGO 2024)", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Homem de 58 anos, hipertenso, faz check-up após uma churrascaria no almoço; coleta às 16 h. Creatinina 1,45 mg/dl (eGFRcr 54). Exames de 1 ano atrás: eGFRcr 78. RAC 12 mg/g, EAS normal. Qual a melhor conduta?", "alternativas": {"A": "Diagnosticar DRC G3a A1 e iniciar iSGLT2.", "B": "Repetir a creatinina após ≥ 12 h sem carne cozida, idealmente com cistatina C, antes de rotular DRC.", "C": "Encaminhar ao nefrologista por queda da TFG > 20%.", "D": "Solicitar TFG medida com iohexol."}, "correta": "B", "explicacao": "Antes de diagnosticar DRC é preciso excluir determinantes não-TFG da creatinina. Uma refeição com carne cozida eleva a creatinina em cerca de 0,23 mg/dl — o equivalente a ~20 ml/min a menos na eGFR —, com pico em 2 a 4 horas; a diretriz recomenda coletar após pelo menos 12 h sem carne ou peixe. Com RAC e EAS normais e exame prévio de 78, a probabilidade de DRC é baixa e o achado deve ser repetido (PP 1.1.1.2), de preferência com cistatina C, cujos determinantes não incluem a dieta. Armadilha: a alternativa 3 parece correta porque a queda é > 20%, mas o limiar de 20% significa \"avaliar\", e o primeiro passo da avaliação é repetir o exame em condições adequadas. A TFG medida (4) é desproporcional a essa altura. (Seções 5.4 e 6.1.)"}, {"n": 2, "enunciado": "Mulher de 81 anos, frágil, 44 kg, sarcopênica. Creatinina 0,8 mg/dl (eGFRcr 68). RAC 140 mg/g. Vai iniciar fármaco de eliminação renal com índice terapêutico estreito. Qual afirmação é correta?", "alternativas": {"A": "A TFG é normal; usar dose plena.", "B": "A RAC de 140 confirma A2 e não sofre influência da massa muscular.", "C": "A eGFRcr provavelmente superestima a TFG e a RAC pode estar falsamente elevada; estimar com cistatina C (ou medir a TFG) antes de dosar o fármaco.", "D": "A cistatina C não deve ser usada em idosos."}, "correta": "C", "explicacao": "Na sarcopenia, a pouca massa muscular reduz a geração de creatinina: a creatinina sérica fica \"normal\" e a eGFRcr superestima a TFG, o que leva a superdosagem. Ao mesmo tempo, a creatinina urinária baixa no denominador eleva falsamente a RAC. Para um fármaco de índice estreito, a diretriz manda usar eGFRcr-cys — ou TFG medida se a precisão necessária for maior —, e a Tabela 8 lista justamente a perda muscular entre as indicações de cistatina C. Armadilha: confiar numa creatinina \"normal\" em idosa de 44 kg; é um caso clássico de dois erros em sentidos opostos no mesmo paciente. (Seções 5.4, 5.5 e 8.15.)"}, {"n": 3, "enunciado": "Homem de 55 anos, sem diabetes, nefropatia por IgA, eGFR 48, RAC 620 mg/g, PA 138/86, K 4,6. Usa losartana 50 mg. Qual a conduta mais completa?", "alternativas": {"A": "Manter losartana e reavaliar em 1 ano.", "B": "Associar enalapril para duplo bloqueio do SRAA.", "C": "Titular losartana até a dose máxima tolerada, iniciar iSGLT2, estatina, buscar PAS < 120 e sódio < 2 g/dia.", "D": "Iniciar finerenona."}, "correta": "C", "explicacao": "Sem diabetes e com A3, IECA/BRA é recomendação 1B — na maior dose aprovada tolerada, porque foi nessas doses que os ensaios mostraram benefício. Com eGFR ≥ 20 e RAC ≥ 200, o iSGLT2 é 1A independentemente de diabetes. Com ≥ 50 anos e TFG < 60, estatina (ou estatina + ezetimiba) é 1A. A meta de PAS < 120 (2B) e o sódio < 2 g/dia completam a abordagem em camadas. O duplo bloqueio (2) é contraindicado (1B). A finerenona (4) foi estudada e é sugerida apenas no DM2. Com RAC > 700 mg/g, o paciente também deveria estar em seguimento nefrológico. (Seções 6.3, 8.1, 8.4–8.7 e 8.11.)"}, {"n": 4, "enunciado": "Diabética tipo 2 de 62 anos inicia ramipril. Basal: creatinina 1,30 mg/dl; 3 semanas depois: 1,52 mg/dl (+17%); K 5,1; PA 128/78. Qual a conduta?", "alternativas": {"A": "Suspender o IECA por piora da função renal.", "B": "Trocar o IECA por BRA.", "C": "Manter e titular o IECA; a elevação é esperada e menor que 30%.", "D": "Solicitar arteriografia renal."}, "correta": "C", "explicacao": "IECA/BRA reduzem a pressão intraglomerular e produzem uma queda hemodinâmica, reversível e esperada da TFG. A diretriz manda continuar a não ser que a creatinina suba mais de 30% em 4 semanas; um aumento de 17% com K 5,1 está dentro do esperado, e o próximo passo é titular até a dose máxima tolerada. Armadilha: interpretar o \"dip\" como nefrotoxicidade e suspender um fármaco nefroprotetor. A arteriografia (4) só entraria na investigação de uma queda ≥ 30%, que poderia sugerir estenose de artéria renal. Trocar por BRA (2) não muda o mecanismo. (Seções 3.2, 6.1 e 8.5.)"}, {"n": 5, "enunciado": "Homem de 70 anos, DRC G4 (eGFR 22), A3, em uso de iSGLT2, IECA em dose máxima e furosemida. K 5,9 mmol/l em exame de rotina; assintomático, ECG normal. Usa ibuprofeno para dor no joelho e tem constipação. Bicarbonato 17. Qual a sequência correta?", "alternativas": {"A": "Suspender imediatamente o IECA.", "B": "Suspender o ibuprofeno, tratar a constipação, rever dieta (processados, sal de KCl), corrigir a acidose e considerar quelante de K; reduzir o IECA apenas se tudo falhar.", "C": "Proibir frutas e vegetais e manter o restante.", "D": "Suspender o iSGLT2 porque eleva o potássio."}, "correta": "B", "explicacao": "K 5,9 em paciente assintomático e com ECG normal é hipercalemia não emergencial (> 5,5, abaixo de 6,0), e a diretriz propõe abordagem escalonada: primeiro corrigir fatores (AINE inibe prostaglandinas e renina; a constipação reduz a excreção intestinal de K, que ganha importância na DRC avançada; revisar processados e sais de KCl), depois medicamentos (diurético, correção da acidose — o bicarbonato de 17 está abaixo do limiar de 18 —, quelante de potássio) e só por último reduzir o iSRAA, porque a suspensão aumenta eventos cardiovasculares. Armadilha: a alternativa 1 é o reflexo mais comum. A 3 é errada porque o K vegetal é menos absorvido e frutas e vegetais não são o vilão; a 4 é errada porque iSGLT2 não aumentam o K e até reduzem hipercalemia grave. (Seções 7.1, 7.2 e 8.9.)"}, {"n": 6, "enunciado": "Mulher de 64 anos, DM2, eGFR 40, RAC 450 mg/g apesar de losartana na dose máxima e dapagliflozina; K 4,6. Qual o próximo passo de acordo com a diretriz?", "alternativas": {"A": "Espironolactona em dose plena.", "B": "Finerenona 10 mg/dia, com potássio em 1 mês e depois a cada 4 meses.", "C": "Finerenona 20 mg/dia.", "D": "Associar IECA à losartana."}, "correta": "B", "explicacao": "Ela cumpre todos os critérios da Rec. 3.8.1 (2A): DM2, eGFR > 25, K normal e albuminúria persistente apesar de BRA em dose máxima; a finerenona pode ser somada a BRA e iSGLT2. Como o K é ≤ 4,8 e a eGFR está entre 25 e 59, a dose inicial é de 10 mg/dia, com K em 1 mês e depois a cada 4 meses, subindo para 20 mg se o K se mantiver ≤ 4,8. A dose de 20 mg (3) é para eGFR ≥ 60. A espironolactona (1) é reservada a IC, hiperaldosteronismo ou HAS resistente com TFG ≥ 45 e não tem os ensaios de desfecho renal. A 4 é duplo bloqueio, contraindicado. (Seção 8.7.)"}, {"n": 7, "enunciado": "Homem de 59 anos, DRC G3b A2 sem diabetes, ácido úrico 9,4 mg/dl, nunca teve gota. Um colega propõe alopurinol \"para proteger o rim\", citando estudos que associam ácido úrico à progressão. Qual o melhor argumento?", "alternativas": {"A": "O colega está certo: a associação observacional é consistente.", "B": "Ensaios randomizados (CKD-FIX, PERL, FEATHER) não mostraram desacelerar a perda de TFG; a associação não é causal — não tratar hiperuricemia assintomática.", "C": "Deve-se usar febuxostato, que é mais potente.", "D": "Deve-se tratar se o ácido úrico for > 9 mg/dl."}, "correta": "B", "explicacao": "A diretriz sugere não tratar a hiperuricemia assintomática para retardar a DRC (2D). CKD-FIX (alopurinol, G3–G4, ácido úrico médio 8,2) mostrou declínio de TFG de 3,33 vs. 3,23 ml/min/ano; PERL e FEATHER também foram negativos, e a meta-análise teve RR 0,92 (IC 0,43–1,98). O resultado negativo é uma confirmação mecanística: o ácido úrico é marcador, não causa, da progressão. Armadilha: a alternativa 4 mistura o limiar de > 9 mg/dl, que a diretriz usa para decidir iniciar o hipouricemiante depois do primeiro episódio de gota — não na hiperuricemia assintomática. O febuxostato (3), além de não proteger o rim, teve maior mortalidade que o alopurinol no CARES. (Seções 3.4 e 8.10.)"}, {"n": 8, "enunciado": "Homem de 72 anos, DRC G3b, fibrilação atrial recém-diagnosticada, DepCr (Cockcroft-Gault) 40 ml/min, 78 kg, sem verapamil. CHA₂DS₂-VASc 3. Qual a prescrição adequada?", "alternativas": {"A": "AAS 100 mg/dia.", "B": "Varfarina com INR 2–3 como primeira escolha.", "C": "Rivaroxabana 15 mg/dia (ou outro DOAC com ajuste para DepCr 31–50).", "D": "Não anticoagular pela DRC."}, "correta": "C", "explicacao": "Na DRC G1–G4 com FA, a diretriz recomenda DOAC em vez de varfarina (1C): menos AVC/embolia (RR 0,81) e cerca de metade da hemorragia intracraniana, com benefício consistente em DepCr < 50. A dose deve ser ajustada pela depuração de Cockcroft-Gault: com DepCr 31–50, rivaroxabana 15 mg/dia ou edoxabana 30 mg/dia; a apixabana permanece 5 mg 12/12 h, salvo 2 de 3 critérios de redução. O AAS (1) não é tratamento antitrombótico adequado para FA. Não anticoagular (4) inverte a lógica: a DRC aumenta o risco tromboembólico (2,9%/ano vs. 0,2% mesmo com escore 0–1). (Seções 7.6 e 8.13.)"}, {"n": 9, "enunciado": "Paciente com DRC G4 (eGFR 18) refere fadiga leve, sem náusea, sem sinais de congestão, K 5,2, bicarbonato 20, Hb 10,8. KFRE em 2 anos: 46%. A família pede diálise \"para não piorar\". Qual a conduta?", "alternativas": {"A": "Iniciar hemodiálise já, pois a TFG está < 20.", "B": "Não iniciar diálise sem indicação clínica; planejar acesso/transplante preemptivo e discutir modalidades, incluindo cuidado conservador.", "C": "Aguardar a TFG < 10 para começar a conversar sobre TRS.", "D": "Suspender IECA e iSGLT2 para preparar a diálise."}, "correta": "B", "explicacao": "A diálise é iniciada por indicação clínica — sintomas urêmicos, pericardite, volemia ou PA incontroláveis, distúrbios refratários, deterioração nutricional ou cognitiva —, não por um valor de TFG. No IDEAL, o início precoce não melhorou sobrevida (HR 1,04). Por outro lado, com KFRE > 40% em 2 anos e TFG < 20, é o momento de planejar acesso vascular e transplante preemptivo e educar sobre as modalidades, incluindo o cuidado conservador abrangente. Armadilha: confundir \"preparar\" com \"iniciar\" (alternativa 1) ou deixar a preparação para tarde demais (3), o que leva a diálise por cateter. IECA e iSGLT2 devem ser mantidos (4 é erro). (Seções 6.2 e 9.)"}, {"n": 10, "enunciado": "Um residente lê o EMPA-KIDNEY e conclui: \"o benefício do iSGLT2 está provado com o mesmo peso em todos os níveis de albuminúria\". Qual argumento corrige essa leitura?", "alternativas": {"A": "Não há benefício algum com RAC < 200.", "B": "Houve interação com a albuminúria; no subgrupo A1, com poucos eventos, o benefício vem do slope da TFG (desfecho substituto) em seguimento curto — por isso a diretriz dá 1A para RAC ≥ 200 e 2B para TFG 20–45 com RAC < 200.", "C": "O estudo teve risco de viés alto por não ser cegado.", "D": "O benefício só existe em diabéticos."}, "correta": "B", "explicacao": "No EMPA-KIDNEY houve interação significativa entre o efeito e a albuminúria (P de tendência = 0,02): o efeito relativo foi maior com mais albuminúria. No subgrupo A1, a progressão lenta gerou poucos eventos e o desfecho primário ficou sem poder estatístico; a evidência nesse grupo vem da inclinação da TFG a longo prazo, um desfecho substituto, em ~2 anos de seguimento. Por isso a diretriz separa força e certeza: 1A para RAC ≥ 200 (ou IC, ou DM2) e 2B para TFG 20–45 com RAC < 200. A alternativa 1 exagera no sentido oposto (há benefício no slope); a 3 é falsa (o estudo foi duplo-cego, baixo risco de viés); a 4 é falsa (a meta-análise mostra benefício com e sem diabetes). (Seções 8.6 e 10.)"}]}, {"id": "histoplasmose", "titulo": "Histoplasmose Disseminada", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Homem de 38 anos, com HIV sem tratamento (CD4 = 42 células/µL), natural de região endêmica para histoplasmose, chega com 5 semanas de febre, sudorese noturna, perda de 9 kg e tosse seca. Exame: hepatoesplenomegalia e úlceras em palato. Hb 8,1 g/dL, leucócitos 2.100/µL, plaquetas 61.000/µL, fosfatase alcalina 4× o normal, AST/ALT 1,5× o normal, LDH 1.900 U/L, ferritina 9.800 ng/mL. Radiografia: infiltrado reticulonodular difuso. PA 96/60 mmHg, SpO2 91% em ar ambiente. Qual a conduta mais adequada?", "alternativas": {"A": "Iniciar esquema RIPE empírico e aguardar baciloscopia e cultura antes de investigar fungos.", "B": "Colher antígeno de Histoplasma em urina e soro, hemoculturas por lise-centrifugação e mielograma/biópsia de medula, e iniciar anfotericina B lipossomal 3 mg/kg/dia sem aguardar resultados, investigando tuberculose em paralelo.", "C": "Iniciar itraconazol 200 mg 3×/dia por 3 dias e depois 2×/dia, já que não há sinais de meningite.", "D": "Solicitar sorologia (fixação de complemento e imunodifusão) e iniciar tratamento apenas se reagente.", "E": "Iniciar TARV imediatamente e reavaliar em 2 semanas, pois o quadro deve melhorar com a recuperação imune."}, "correta": "B", "explicacao": "É a forma disseminada aguda do HIV avançado (CD4 ≤ 150, exposição em área endêmica, febre, perda de peso, hepatoesplenomegalia, pancitopenia, FA desproporcional às aminotransferases, LDH e ferritina muito altas, infiltrado reticulonodular, úlcera de mucosa). Hipotensão, hipoxemia e pancitopenia a classificam como moderadamente grave/grave, o que exige anfotericina lipossomal 3 mg/kg/dia — itraconazol (C) é fungistático e demora a atingir nível, além de limpar mais devagar a fungemia. A armadilha é a (A): a TB é o diferencial número 1 e pode coexistir, por isso deve ser investigada em paralelo, mas tratar só TB empiricamente deixa progredir uma doença que mata em semanas. A sorologia (D) é frequentemente negativa no imunossuprimido e demora até 2 semanas; TARV sozinha (E) não trata a infecção (deve ser iniciada logo, junto do antifúngico). Resumo: seções 4.2, 6.1, 6.6, 7.2 e 7.3."}, {"n": 2, "enunciado": "Mulher de 54 anos com doença de Crohn ileocecal \"refratária\", morou na infância no Vale do Mississippi. Usa infliximabe há 4 meses e há 3 semanas tem febre diária, perda de peso e diarreia. A colonoscopia mostra úlceras ileocecais. A equipe pensa em intensificar o anti-TNF. Assinale a alternativa correta.", "alternativas": {"A": "A ausência de granulomas na biópsia afasta histoplasmose, permitindo intensificar o infliximabe.", "B": "Como ela saiu da área endêmica há décadas, histoplasmose é improvável.", "C": "Deve-se pedir antígeno de Histoplasma em urina e soro e colorações para fungo (GMS/PAS) e cultura na biópsia antes de qualquer intensificação; confirmada a histoplasmose, suspender o infliximabe por pelo menos alguns meses.", "D": "Se o antígeno vier negativo, histoplasmose está excluída.", "E": "Sorologia negativa exclui histoplasmose em usuário de anti-TNF."}, "correta": "C", "explicacao": "Úlceras ileocecais que imitam Crohn, febre e perda de peso num usuário de anti-TNF que viveu em área endêmica são o cenário clássico de histoplasmose do TGI (reativação de foco latente; o anti-TNF bloqueia exatamente o eixo que ativa o macrófago). Antes de intensificar o imunossupressor, peça antígeno em urina e soro e colorações/cultura para fungo na biópsia. Armadilhas: granuloma ausente (A) é esperado na disseminada; o tempo fora da área endêmica (B) não importa por causa da reativação; antígeno (D) e sorologia (E) negativos não excluem — ensaios variam e sorologia falha no imunossuprimido (embora em anti-TNF seja positiva em 83%). Confirmada, a conduta é suspender o anti-TNF por pelo menos alguns meses. Seções 3.4, 5.1, 6.3, 6.6 e 7.7."}, {"n": 3, "enunciado": "Homem de 66 anos, sem imunossupressão conhecida, emagrecido há 4 meses, com úlcera dolorosa de bordas elevadas na língua (biópsia: leveduras de 2–4 µm à prata), hepatoesplenomegalia, PA 88/54 mmHg em pé, Na 126 mEq/L, K 5,9 mEq/L e glicemia de 58 mg/dL. TC: adrenais aumentadas bilateralmente. Qual o raciocínio correto?", "alternativas": {"A": "Distúrbios eletrolíticos são efeito adverso esperado da anfotericina; não há relação com a doença.", "B": "Forma disseminada crônica com insuficiência adrenal por perivasculite/infarto glandular; tratar o fungo e repor hidrocortisona, que provavelmente será vitalícia.", "C": "A insuficiência adrenal regride com o antifúngico, e a hidrocortisona pode ser suspensa ao fim do tratamento.", "D": "Úlcera oral com leveduras indica candidíase; a adrenal é achado incidental.", "E": "Como não há imunossupressão, a forma é pulmonar aguda e não precisa de tratamento."}, "correta": "B", "explicacao": "Idoso sem imunossupressão, doente há meses, com úlcera oral (leveduras de 2–4 µm à prata = Histoplasma, não Candida), hepatoesplenomegalia e adrenais aumentadas: forma disseminada crônica. Hipotensão postural, hiponatremia, hipercalemia e hipoglicemia indicam insuficiência adrenal, causada por perivasculite com trombose/infarto da glândula — por isso geralmente irreversível, exigindo hidrocortisona vitalícia e orientação sobre o perigo de suspendê-la (C está errada). O raciocínio errado plausível é atribuir os eletrólitos à anfotericina (A), mas o paciente nem começou o tratamento. A forma crônica também é fatal sem tratamento (E). Seções 3.3, 4.1, 5.2 e 7.7."}, {"n": 4, "enunciado": "Mulher de 42 anos com HIV, CD4 = 210, em TARV irregular, com 3 semanas de febre baixa, adenomegalia cervical e antígeno urinário de Histoplasma positivo. Estável, afebril no consultório, sem cefaleia, hemograma normal, sem fungemia. Qual a melhor conduta?", "alternativas": {"A": "Fluconazol 800 mg/dia por ser mais bem absorvido.", "B": "Anfotericina B desoxicolato 0,7 mg/kg/dia por 6 semanas.", "C": "Itraconazol 200 mg 3×/dia por 3 dias e depois 200 mg 2×/dia por no mínimo 12 meses, com nível sérico após ~2 semanas e reorganização da TARV.", "D": "Caspofungina IV por 14 dias.", "E": "Observar, pois CD4 > 150 indica doença autolimitada."}, "correta": "C", "explicacao": "Doença leve-moderada, sem SNC, sem fungemia, sem os marcadores de mau prognóstico (febre > 39,5 °C, Karnofsky < 60, FA > 5×, albumina < 3 g/dL): itraconazol com dose de ataque e duração ≥ 12 meses, nível sérico em ~2 semanas e TARV regular (Grau 1B). Fluconazol (A) é menos ativo e seleciona resistência; desoxicolato (B) é desnecessário e mais tóxico; equinocandinas (D) não agem no Histoplasma. Armadilha (E): CD4 > 150 sugere forma pulmonar autolimitada, mas aqui já há doença extrapulmonar (linfonodo cervical com antígeno positivo) — um único sítio extrapulmonar define disseminação, e toda disseminada é tratada. Seções 4.1, 4.2, 7.2, 7.3 e 7.5."}, {"n": 5, "enunciado": "Paciente da Questão 1 recebeu 9 dias de anfotericina lipossomal; está afebril há 3 dias, sem vasopressor, comendo. O residente quer suspender a anfotericina hoje e iniciar itraconazol amanhã, e prescrever omeprazol por dispepsia. O que você corrige?", "alternativas": {"A": "Nada — a transição está correta.", "B": "Iniciar o itraconazol nos últimos dias da anfotericina (com ataque 200 mg 3×/dia × 3 dias) para que o nível já esteja adequado; se usar cápsula, evitar o inibidor de bomba (ou usar solução em jejum) e dosar o nível em ~2 semanas.", "C": "Trocar por fluconazol, que não depende de acidez.", "D": "Manter anfotericina por 6 semanas obrigatoriamente.", "E": "Suspender todo antifúngico e manter só a TARV."}, "correta": "B", "explicacao": "A transição foi bem indicada (afebril, estável, tolerando VO), mas a sequência está errada: o itraconazol deve começar nos últimos dias da anfotericina, com ataque de 200 mg 3×/dia por 3 dias, porque leva dias a semanas para atingir nível — suspender a anfotericina antes deixa uma janela sem droga eficaz. O omeprazol reduz a absorção da cápsula (que depende de acidez); a saída é evitá-lo ou usar a solução em jejum, e dosar o nível em ~2 semanas (alvo 1–2 µg/mL; ≥ 1 no HIV). Fluconazol (C) não é alternativa equivalente; 6 semanas de anfotericina (D) é o esquema do SNC. Seções 7.3 e 7.6."}, {"n": 6, "enunciado": "Homem de 45 anos, transplantado renal, com histoplasmose disseminada e cefaleia há 10 dias. LCR: 180 células (85% mononucleares), glicose 30 mg/dL, proteína 95 mg/dL; coloração e cultura iniciais negativas. Assinale a alternativa correta.", "alternativas": {"A": "Cultura negativa do LCR exclui meningite por Histoplasma.", "B": "β-D-glucana positiva no LCR confirma a etiologia.", "C": "Pedir antígeno e anticorpos (FC/ID e EIA IgG/IgM) no LCR, antígeno em sangue e urina e repetir cultura com 10–20 mL de LCR; tratar com anfotericina B lipossomal 5 mg/kg/dia por 4–6 semanas, seguida de itraconazol por ≥ 1 ano até normalizar o LCR.", "D": "Tratar com anfotericina B lipossomal 3 mg/kg/dia por 1–2 semanas, como na forma sem SNC.", "E": "Associar fluconazol à anfotericina para melhorar a penetração no SNC."}, "correta": "C", "explicacao": "Meningite linfocítica com hipoglicorraquia num transplantado com histoplasmose: meningite por Histoplasma até prova em contrário. A cultura do LCR cresce em apenas 38% (A errada); o diagnóstico vem de antígeno + anticorpo no LCR (o EIA IgG/IgM rende mais que FC/ID), antígeno em sangue/urina e culturas de grande volume repetidas. β-D-glucana (B) tem sensibilidade 53% e especificidade 46% — só sugere fungo. O tratamento é o do SNC: lipossomal 5 mg/kg/dia por 4–6 semanas (maior concentração cerebral), não o de 3 mg/kg (D), seguida de itraconazol ≥ 1 ano até normalizar o LCR. Armadilha (E): fluconazol penetra bem no LCR, mas a associação com anfotericina foi pior que anfotericina isolada no modelo experimental. Seções 6.4 e 7.4."}, {"n": 7, "enunciado": "Paciente com HIV tratado há 14 meses para histoplasmose disseminada. Em TARV, carga viral indetectável há 8 meses; CD4 = 190 há 4 meses (antes, 110). Antígeno urinário próximo do limite inferior; hemoculturas negativas. Pode suspender o itraconazol?", "alternativas": {"A": "Sim — já completou mais de 1 ano.", "B": "Sim — o CD4 está acima de 150.", "C": "Não — falta o CD4 > 150 sustentado por ≥ 6 meses; manter e reavaliar.", "D": "Não — a manutenção é sempre vitalícia no HIV.", "E": "Sim, desde que troque para fluconazol 400 mg/dia."}, "correta": "C", "explicacao": "Os critérios são cumulativos: ≥ 1 ano de tratamento (ok), antígeno próximo do limite (ok), hemoculturas negativas (ok), carga viral suprimida ≥ 6 meses (ok) e CD4 > 150 por ≥ 6 meses (só 4 meses). Faltando um, o risco é a recidiva — 50–80% sem manutenção. A (B) é o erro plausível: olhar o CD4 do dia e não a sustentação. A manutenção não é obrigatoriamente vitalícia (D): só se não houver recuperação imune, doença do SNC/grave com indicação de supressão ou recidiva. Fluconazol (E) seleciona resistência e teve 1/3 de recidiva na manutenção. Seções 8.1 e 8.3."}, {"n": 8, "enunciado": "— leitura crítica Um colega afirma: \"O ECR de lipossomal vs desoxicolato prova que a formulação lipossomal é mais potente contra o Histoplasma — a resposta foi 88% vs 64%.\" Qual o melhor contra-argumento?", "alternativas": {"A": "O estudo não era randomizado.", "B": "O tempo de negativação das culturas foi igual nos dois braços e o desoxicolato foi usado na dose mais baixa (0,7 mg/kg); a vantagem parece vir mais de tolerabilidade (nefrotoxicidade 9% vs 37%, infusionais 25% vs 63%) do que de potência antifúngica.", "C": "A mortalidade foi maior com a lipossomal.", "D": "O estudo incluiu só imunocompetentes.", "E": "Resposta clínica não é desfecho relevante."}, "correta": "B", "explicacao": "O ECR (duplo-cego, 81 pacientes com AIDS) mostrou benefício clínico real (resposta 88% vs 64%, mortalidade 2% vs 13%), mas o tempo de negativação das culturas foi igual, o que não sustenta \"maior potência\". Somando a dose baixa do comparador (0,7 e não 1 mg/kg) e as diferenças grandes de nefrotoxicidade e reações infusionais, a interpretação mais coerente é que a lipossomal vence por tolerabilidade (o paciente consegue receber a droga). Isso não muda a conduta (lipossomal continua preferida), mas muda a leitura. Seções 7.3 e 9."}, {"n": 9, "enunciado": "— leitura crítica Em uma reunião, alguém propõe dar itraconazol profilático a todas as pessoas com HIV e CD4 ≤ 150 no ambulatório (região com incidência de 2 casos/100 pacientes-ano), citando o ECR em que a profilaxia \"funcionou\". Qual o melhor argumento?", "alternativas": {"A": "O ECR mostrou redução de mortalidade, então a proposta está correta.", "B": "O ECR reduziu a frequência de histoplasmose, mas não a mortalidade; a recomendação limita a profilaxia a áreas hiperendêmicas (> 10 casos/100 pacientes-ano), onde o número de casos evitados justifica custo, interações e toxicidade — fora disso, a prioridade é TARV e diagnóstico precoce.", "C": "Itraconazol não previne histoplasmose.", "D": "A profilaxia deveria ser com fluconazol.", "E": "A profilaxia deve ser mantida por toda a vida."}, "correta": "B", "explicacao": "A profilaxia melhorou um desfecho intermediário (incidência de histoplasmose), não o desfecho final (mortalidade). Na era da TARV, a maioria recupera CD4, e a histoplasmose diagnosticada a tempo é tratável; a profilaxia universal traria custo, interações (itraconazol × antirretrovirais) e toxicidade para poucos casos evitados numa região de 2/100 pacientes-ano. A recomendação a restringe a áreas hiperendêmicas (> 10/100 pacientes-ano), suspendendo com CD4 ≥ 150 por 6 meses. Seções 8.5 e 9."}, {"n": 10, "enunciado": "Paciente de 60 anos, portador de prótese aórtica mecânica há 6 anos, com 3 meses de febre baixa, perda de peso e um episódio embólico. Três pares de hemoculturas convencionais negativos; ecocardiograma com vegetação na prótese. Morou em área endêmica. Assinale a correta.", "alternativas": {"A": "Hemoculturas negativas afastam etiologia fúngica.", "B": "Endocardite por Histoplasma é típica de valva nativa tricúspide.", "C": "Endocardite por Histoplasma acomete sobretudo prótese aórtica, as hemoculturas frequentemente são negativas (6/14) e o antígeno sérico/urinário é positivo na maioria (11/14); a histologia pode mostrar leveduras e hifas.", "D": "O antígeno de Histoplasma não tem utilidade na endocardite.", "E": "Encontrar hifas na vegetação exclui Histoplasma."}, "correta": "C", "explicacao": "Prótese aórtica, sintomas por meses, embolia e hemoculturas negativas compõem o perfil da endocardite por Histoplasma: na série de 14 casos, 10 eram próteses aórticas, as hemoculturas foram positivas em só 6 e o antígeno em 11; na revisão de 61 casos, a aórtica predominou em nativas e próteses, e as embolias foram igualmente frequentes. Hemocultura negativa (A) não afasta — peça antígeno. A presença de hifas (E) não exclui: é justamente a particularidade histológica das lesões vasculares. Seção 5.4."}]}, {"id": "miocardite-pericardite", "titulo": "Miocardite e Pericardite", "tipo": "objetiva", "questoes": [{"n": 1, "enunciado": "Homem de 24 anos, há 5 dias com quadro gripal, procura o pronto-socorro com dor torácica opressiva há 6 horas. ECG com supradesnível de ST em parede inferolateral; hs-cTnT 480 ng/L; ecocardiograma com FEVE 58%, sem alteração segmentar evidente. Hemodinamicamente estável, sem arritmias. A coronariografia mostra coronárias normais. Qual é a conduta mais adequada a seguir?", "alternativas": {"A": "Realizar biópsia endomiocárdica imediatamente, pois só a histologia confirma miocardite.", "B": "Solicitar RMC com mapeamento T1 e T2 nos próximos dias e manter o paciente fora de centro de IC avançada.", "C": "Iniciar metilprednisolona 7–14 mg/kg/dia por 3 dias pela troponina muito elevada.", "D": "Dar alta, pois coronárias normais e FEVE preservada encerram a investigação."}, "correta": "B", "explicacao": "O paciente é estágio C de miocardite (sintomas + troponina elevada, coronárias normais) e de baixo risco: FEVE normal, estável, sem arritmia. A RMC com T1 e T2 (Lake Louise: ≥ 1 critério T2 + ≥ 1 T1) é o teste pivotal não invasivo, com melhor rendimento na 1ª–2ª semana; não há critério de encaminhamento a centro avançado (Figura 4). A armadilha é a alternativa A: a BEM é padrão-ouro, mas não está indicada no estágio C de baixo risco — o risco do procedimento supera o ganho (seção 5.1). C é errada porque imunossupressão não é dada pela magnitude da troponina, e sim por histotipo/contexto (eosinofílica, células gigantes, sarcoidose, ICI, autoimune; seção 7.5). D esquece que coronárias normais não encerram nada — a pergunta passa a ser \"é miocardite?\" — e que a miocardite exige seguimento (eco em 2–4 semanas e em 6 meses; seção 8.1)."}, {"n": 2, "enunciado": "Mulher de 31 anos com terceiro episódio de pericardite em 14 meses, já em ibuprofeno 800 mg 3×/dia e colchicina 0,6 mg 2×/dia. Apresenta febre de 38,6 °C, PCR de 9,8 mg/dL e derrame pleural bilateral. A RMC mostra LGE pericárdico em 3 cortes, ≥ 50% da circunferência, com espessura de 4 mm, e edema em T2-STIR. Pela orientação do ACC 2025, a melhor conduta é:", "alternativas": {"A": "Associar prednisona 1 mg/kg/dia com desmame rápido em 2 semanas.", "B": "Associar anti-IL-1 (anakinra ou rilonacepte) após rastrear hepatites, HIV e tuberculose.", "C": "Indicar pericardiectomia radical imediatamente.", "D": "Suspender a colchicina e trocar ibuprofeno por indometacina."}, "correta": "B", "explicacao": "É pericardite recorrente que falhou à primeira linha, com fenótipo inflamatório inequívoco: febre, PCR alta, derrame pleural e LGE pericárdico grave (≥ 50% em 3 cortes e > 3 mm; seção 5.2). Pelo ACC, o anti-IL-1 é a segunda linha preferida nesse fenótipo, por atuar exatamente na alça IL-1 que mantém a doença (seção 3.2), e exige rastreio prévio de hepatites, HIV e tuberculose (seção 7.2). A alternativa A erra duas vezes: a dose de corticoide da pericardite é 0,2–0,5 mg/kg/dia (1 mg/kg/dia é a dose da miocardite), e o desmame deve ser lento, ao longo de meses. C pula etapas — pericardiectomia é para refratários. D não tem racional mecanístico. Observação: a ESC colocaria o corticoide antes do anti-IL-1 por custo (seção 7.2, \"Onde ACC e ESC divergem\")."}, {"n": 3, "enunciado": "Um residente prescreve prednisona 40 mg/dia para um homem de 45 anos no primeiro episódio de pericardite viral, sem contraindicação a AINE, \"para resolver mais rápido\". Qual o principal argumento contra essa conduta?", "alternativas": {"A": "O corticoide não tem efeito anti-inflamatório no pericárdio.", "B": "O corticoide precoce aumenta o risco de recorrência, pois suprime de forma inespecífica sem desarmar a alça autoinflamatória de IL-1.", "C": "O corticoide só é eficaz se a PCR estiver normal.", "D": "O corticoide é contraindicado por causar tamponamento."}, "correta": "B", "explicacao": "O corticoide precoce é fator de risco de recorrência (seção 6.2). O mecanismo: ele suprime NF-κB e PLA2 de forma ampla, mas não desfaz a alça autoinflamatória IL-1 — ao desmamar, a cascata reacende, criando dependência (seção 3.2). Por isso as três fontes concordam em evitar corticoide precoce; ele fica para refratários/intolerantes, em dose baixa a média (seção 7.1). A armadilha é a intuição \"mais potente = melhor\": potência para apagar o sintoma hoje não equivale a controle da doença amanhã. A, C e D são falsas."}, {"n": 4, "enunciado": "Homem de 52 anos, 8 meses após revascularização miocárdica cirúrgica, com dispneia progressiva, edema de membros inferiores e ascite; FEVE 60%. Turgência jugular com sinal de Kussmaul e \"knock\" protodiastólico. No eco: septal shift inspiratório, e' medial 12 cm/s com e' lateral 8 cm/s, reversão diastólica expiratória na veia hepática com razão 0,9. A RMC mostra pericárdio de 3 mm com LGE intenso e edema em T2-STIR; PCR 4,2 mg/dL. Conduta inicial mais adequada:", "alternativas": {"A": "Pericardiectomia parcial anterior.", "B": "Pericardiectomia radical imediata, pois a constrição está confirmada.", "C": "Anti-inflamatório (AINE + colchicina por ≥ 3 meses, limiar baixo para anti-IL-1 ou corticoide), diurético se necessário e reavaliação clínica, de PCR e de imagem em 3–6 meses.", "D": "TMOD para IC com FE preservada e investigação de amiloidose."}, "correta": "C", "explicacao": "É constrição pós-cirurgia cardíaca com fenótipo inflamatório (LGE e edema pericárdicos, PCR alta) — ou seja, constrição transitória/subaguda, potencialmente reversível (seção 6.5). O eco confirma o padrão constritivo: septal shift, e' medial alto com annulus reversus e reversão hepática expiratória ≥ 0,8 — esse conjunto tem especificidade e VPP muito altos (Figura 7). A conduta é anti-inflamatória primeiro, com reavaliação em 3–6 meses (Figura 8): pode dispensar a cirurgia e, se ela continuar indicada, opera-se pericárdio menos inflamado (seção 7.3). A armadilha está em B: \"constrição confirmada = cirurgia\" vale para a forma crônica (LGE− e T2−). A pericardiectomia parcial (A) não é recomendada. D seria pensar em restrição, mas e' alto e LGE pericárdico apontam o contrário (seção 6.6). Note também que a espessura de 3 mm não afasta constrição (normal em 18% dos casos)."}, {"n": 5, "enunciado": "Mulher de 68 anos com derrame pericárdico, PA 84/60 mmHg, FC 122 bpm, pulso paradoxal. No eco: derrame de 2,2 cm, VCI 2,4 cm sem variação respiratória e colapso diastólico da parede livre do VD. Sobre o caso, é correto afirmar:", "alternativas": {"A": "A VCI dilatada é o sinal mais específico e confirma o tamponamento isoladamente.", "B": "O colapso diastólico do VD é o sinal mais específico; a conduta é pericardiocentese guiada por eco, preferencialmente por via subxifoide ou apical na emergência.", "C": "Deve-se solicitar RMC para confirmar o tamponamento antes de puncionar.", "D": "Como o derrame é apenas \"grande\" (e não \"muito grande\"), não pode haver tamponamento."}, "correta": "B", "explicacao": "O colapso diastólico do VD é o sinal ecocardiográfico mais específico de tamponamento; a VCI dilatada sem variação é sensível, útil para triar, mas não confirma (seção
