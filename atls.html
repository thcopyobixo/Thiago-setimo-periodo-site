<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLS Training · Sétimo Período</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #0f1420;
    --panel-2: #1a2333;
    --border: #1e2a44;
    --border-hover: #2d4166;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-3: #1d4ed8;
    --accent-glow: rgba(59,130,246,.35);
    --text: #f8fafc;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,.06) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(29,78,216,.04) 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
  }
  [hidden] { display: none !important; }

  aside.sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    background: linear-gradient(180deg, rgba(15,20,32,.6), rgba(0,0,0,.9));
    border-right: 1px solid var(--border);
    padding: 60px 20px 24px;
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0;
    overflow-y: auto;
    z-index: 50;
    backdrop-filter: blur(10px);
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden aside.sidebar { transform: translateX(-100%); }
  main {
    margin-left: var(--sidebar-w);
    transition: margin-left .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden main { margin-left: 0; }
  body.no-transition aside.sidebar,
  body.no-transition main { transition: none !important; }

  .sidebar-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 100;
    width: 36px; height: 36px;
    padding: 0;
    background: rgba(15,20,32,.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .sidebar-toggle:hover {
    color: var(--accent-2);
    border-color: var(--accent);
    background: rgba(59,130,246,.15);
  }
  .sidebar-toggle svg { transition: transform .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden .sidebar-toggle svg { transform: rotate(180deg); }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted-2); text-decoration: none;
    font-size: 12px; font-weight: 500; letter-spacing: .5px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid transparent;
    align-self: flex-start;
    transition: all .2s;
  }
  .back-link:hover { color: var(--accent-2); background: var(--panel); border-color: var(--border); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-2px); }
  .brand {
    text-align: center;
    padding: 20px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    margin: 0; font-family: 'Unbounded', sans-serif;
    font-size: 34px; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .brand .sub {
    color: var(--muted); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
    margin-top: 8px; font-weight: 500;
  }
  .tabs-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .tabs { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  #tabs { flex: 1 1 auto; min-height: 0; }
  #conf-tabs { flex: 0 0 auto; }
  .tabs-divider {
    height: 1px;
    background: var(--border);
    margin: 16px 8px 12px;
  }
  .tab {
    background: transparent; color: var(--muted-2);
    border: 1px solid transparent;
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    font-size: 13.5px; font-weight: 500; text-align: left;
    display: flex; align-items: center; gap: 12px;
    font-family: inherit;
    transition: all .2s cubic-bezier(.4,.2,.2,1);
    position: relative;
  }
  .tab:hover { background: var(--panel); color: var(--text); border-color: var(--border); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .tab.active::before {
    content: ''; position: absolute; left: -20px; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 24px;
    background: var(--accent-2); border-radius: 0 3px 3px 0;
  }
  .tab-num {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 12px;
    padding: 2px 8px; border-radius: 6px;
    background: rgba(255,255,255,.06);
    color: var(--muted-2);
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .tab.active .tab-num { background: rgba(255,255,255,.2); color: #fff; }
  .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main {
    padding: 48px 60px 80px;
    overflow-x: hidden;
    min-height: 100vh;
  }
  .tut-header {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    animation: fadeDown .5s cubic-bezier(.34,1.2,.64,1) both;
  }
  .tut-crumb {
    font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--accent-2);
    font-weight: 600; margin-bottom: 8px;
  }

  /* Botão de download do PDF original */
  .dl-btn {
    display: inline-flex; align-items: center; gap: 9px;
    margin-top: 16px; padding: 10px 16px;
    border-radius: 10px; text-decoration: none;
    background: linear-gradient(135deg, var(--accent-3, #1d4ed8), var(--accent, #3b82f6));
    color: #fff; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 22px var(--accent-glow, rgba(59,130,246,.35));
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  .dl-btn:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 12px 28px var(--accent-glow, rgba(59,130,246,.45)); }
  .dl-btn:active { transform: translateY(0) scale(.97); }
  .dl-btn svg { width: 17px; height: 17px; }
  .dl-btn small { font-weight: 500; opacity: .8; font-size: 12px; }
  .tut-title {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 700;
    margin: 0; letter-spacing: -.5px;
    background: linear-gradient(135deg, #f8fafc, #94a3b8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* PDF Viewer */
  .pdf-viewer {
    display: flex; flex-direction: column;
    gap: 24px;
    max-width: 920px;
    margin: 0 auto;
    animation: fadeUp .5s .1s cubic-bezier(.34,1.2,.64,1) both;
  }
  .pdf-page {
    margin: 0;
    position: relative;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(59,130,246,.06);
    transition: box-shadow .3s, transform .3s;
  }
  .pdf-page:hover {
    box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 30px rgba(59,130,246,.2);
    transform: translateY(-2px);
  }
  .pdf-page img {
    display: block;
    width: 100%;
    height: auto;
  }
  .pdf-page figcaption {
    position: absolute;
    top: 12px; right: 12px;
    padding: 4px 10px;
    background: rgba(0,0,0,.75);
    color: #f8fafc;
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(4px);
    pointer-events: none;
  }

  .tutoria-empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted-2);
    animation: fadeUp .5s cubic-bezier(.34,1.2,.64,1) both;
  }
  .empty-icon { color: var(--border-hover); margin-bottom: 20px; }
  .tutoria-empty h3 {
    font-family: 'Unbounded', sans-serif;
    color: var(--text); font-size: 22px; font-weight: 600;
    margin: 0 0 10px;
  }
  .tutoria-empty p { margin: 0; }

  /* Floating page navigator */
  .page-nav {
    position: fixed;
    right: 24px; bottom: 24px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 10;
  }
  .page-nav button {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 18px; font-weight: 700;
    transition: all .2s;
    box-shadow: 0 10px 24px rgba(0,0,0,.5);
  }
  .page-nav button:hover {
    background: var(--accent);
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 12px 28px var(--accent-glow);
  }

  @keyframes fadeUp   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  @media (max-width: 900px) {
    aside.sidebar {
      width: 100%; height: auto;
      position: relative; top: auto; left: auto;
      padding: 60px 20px 20px;
      transform: none;
    }
    body.sidebar-hidden aside.sidebar { transform: none; display: none; }
    .brand h1 { font-size: 28px; }
    .tabs { flex-direction: row; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
    .tabs-label { display: none; }
    .tab { flex-shrink: 0; }
    .tab.active::before { display: none; }
    main { padding: 24px 12px 60px; margin-left: 0; }
    body.sidebar-hidden main { margin-left: 0; }
    .page-nav { right: 12px; bottom: 12px; }
  }
</style>
<link rel="stylesheet" href="assets/efeitos.css">
<style>
  /* ===== ATLS Training ===== */
  .atls-wrap { max-width: 940px; margin: 0 auto; }
  .atls-kicker { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-2); font-weight: 700; }
  .atls-h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(24px, 3.4vw, 36px); margin: 8px 0 6px; line-height: 1.2; }
  .atls-sub { color: var(--muted-2); margin: 0 0 20px; line-height: 1.5; }
  .atls-card { background: rgba(15, 20, 32, .84); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; backdrop-filter: blur(4px); }
  .atls-card h3 { margin: 0 0 10px; font-size: 12.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted-2); }
  .atls-card p { margin: 0 0 10px; line-height: 1.65; font-size: 16px; }
  .atls-card p:last-child { margin-bottom: 0; }
  .atls-vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
  .atls-vital { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: rgba(8, 12, 24, .7); }
  .atls-vital span { display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-2); }
  .atls-vital b { font-size: 16px; }
  .atls-tasks { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
  .atls-tasks li { padding: 10px 14px; border-radius: 12px; background: rgba(59, 130, 246, .08); border: 1px solid rgba(96, 165, 250, .25); line-height: 1.5; }
  .atls-roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .atls-role { border: 1px solid var(--border); border-radius: 14px; padding: 16px; background: rgba(8, 12, 24, .7); }
  .atls-role b { display: block; font-family: 'Unbounded', sans-serif; font-size: 14px; margin-bottom: 6px; color: var(--accent-2); }
  .atls-role span { color: var(--muted-2); font-size: 14px; line-height: 1.5; }
  .atls-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px;
    padding: 12px 20px; border-radius: 12px; color: #fff; background: linear-gradient(135deg, var(--accent-3), var(--accent)); box-shadow: 0 10px 24px var(--accent-glow); }
  .atls-btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); box-shadow: none; }
  .atls-btn:hover { filter: brightness(1.08); }
  .atls-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 40px; }

  /* barra fixa da prova */
  .atls-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 16px; margin: -8px 0 18px; border-radius: 14px; background: rgba(8, 12, 24, .94); border: 1px solid var(--border); backdrop-filter: blur(8px); }
  .atls-bar .who { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #fbbf24; font-weight: 700; }
  .atls-timer { font-family: 'Unbounded', sans-serif; font-size: 20px; font-variant-numeric: tabular-nums; }
  .atls-live { font-family: 'Unbounded', sans-serif; font-size: 16px; color: #34d399; font-variant-numeric: tabular-nums; }
  .atls-bar .grow { flex: 1; }
  .atls-sec { font-family: 'Unbounded', sans-serif; font-size: 15px; margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
  .atls-sec small { font-family: 'Albert Sans', sans-serif; font-size: 13px; color: var(--muted-2); font-weight: 500; }

  /* roteiro passo a passo */
  .atls-steps { display: grid; gap: 8px; }
  .atls-stepr { display: grid; grid-template-columns: 58px 1fr; gap: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(15, 20, 32, .86); border: 1px solid var(--border); }
  .atls-stepr .lt { width: 52px; min-height: 40px; padding: 6px 4px; border-radius: 10px; display: grid; place-items: center; text-align: center;
    font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 13px; line-height: 1.15; color: #fff; background: linear-gradient(135deg, var(--accent-3), var(--accent)); word-break: break-word; }
  .atls-stepr .lt.big { font-size: 20px; }
  .atls-stepr .lt.x { background: linear-gradient(135deg, #b91c1c, #ef4444); }
  .atls-reveal { font-size: 15px; line-height: 1.5; }
  .atls-reveal b { display: block; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #fbbf24; margin-bottom: 2px; }
  .atls-stepr details { margin-top: 8px; }
  .atls-stepr summary { cursor: pointer; font-size: 12.5px; color: #34d399; font-weight: 700; list-style: none; }
  .atls-stepr summary::-webkit-details-marker { display: none; }
  .atls-stepr summary::before { content: '▸ '; }
  .atls-stepr details[open] summary::before { content: '▾ '; }
  .atls-stepr details p { margin: 6px 0 0; font-size: 14px; color: #cbd5e1; line-height: 1.55; }

  /* checklist */
  .atls-task { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 12px; background: rgba(15, 20, 32, .86); }
  .atls-task-h { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
  .atls-task-h span { margin-left: auto; color: var(--muted-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .atls-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid rgba(30, 42, 68, .55); }
  .atls-item:first-of-type { border-top: 0; }
  .atls-item .txt { line-height: 1.45; }
  .atls-item .val { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: rgba(59, 130, 246, .15); color: #bfdbfe; white-space: nowrap; }
  .atls-item .val.ess { background: rgba(251, 191, 36, .16); color: #fde68a; }
  .atls-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .atls-seg button { border: 0; background: transparent; color: var(--muted-2); font: inherit; font-size: 12.5px; font-weight: 700; padding: 8px 10px; cursor: pointer; }
  .atls-seg button + button { border-left: 1px solid var(--border); }
  .atls-seg button.on[data-v="1"] { background: rgba(16, 185, 129, .22); color: #34d399; }
  .atls-seg button.on[data-v="0.5"] { background: rgba(245, 158, 11, .22); color: #fbbf24; }
  .atls-seg button.on[data-v="0"] { background: rgba(239, 68, 68, .2); color: #f87171; }

  .atls-resp { margin: 12px 16px 6px; padding: 12px 14px; border-radius: 12px; background: rgba(251, 191, 36, .08); border: 1px solid rgba(251, 191, 36, .32); font-size: 15px; line-height: 1.55; }
  .atls-resp b { display: block; font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #fbbf24; margin-bottom: 3px; }
  .atls-task .atls-item:first-of-type { border-top: 1px solid rgba(30, 42, 68, .55); }
  .atls-caso p { font-size: 17px; line-height: 1.75; }
  /* erros graves */
  .atls-err { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 12px 16px; border-radius: 14px; margin-bottom: 8px;
    background: rgba(15, 20, 32, .86); border: 1px solid var(--border); cursor: pointer; }
  .atls-err input { width: 20px; height: 20px; margin-top: 2px; accent-color: #ef4444; cursor: pointer; }
  .atls-err .por { display: block; color: var(--muted-2); font-size: 13.5px; margin-top: 4px; line-height: 1.45; }
  .atls-err .pen { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: rgba(245, 158, 11, .16); color: #fbbf24; }
  .atls-err .pen.z { background: rgba(239, 68, 68, .2); color: #f87171; }
  .atls-err.on { border-color: #ef4444; background: rgba(239, 68, 68, .08); }

  /* resultado */
  .atls-score { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .atls-big { font-family: 'Unbounded', sans-serif; font-size: 58px; font-weight: 800; line-height: 1; }
  .atls-calc { color: var(--muted-2); font-size: 14px; line-height: 1.7; }
  .atls-zero { display: inline-block; padding: 6px 14px; border-radius: 99px; font-weight: 800; font-size: 13px; background: rgba(239, 68, 68, .18); color: #f87171; border: 1px solid #ef4444; }
  .atls-bars { display: grid; gap: 10px; }
  .atls-barrow { display: grid; grid-template-columns: minmax(0, 1fr) 160px 70px; gap: 12px; align-items: center; font-size: 14px; }
  .atls-barrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .atls-barrow .track { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; }
  .atls-barrow .fill { display: block; height: 100%; border-radius: inherit; background: #10b981; }
  .atls-barrow .fill.mid { background: #f59e0b; } .atls-barrow .fill.low { background: #ef4444; }
  .atls-barrow .n { text-align: right; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .atls-miss { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .atls-miss li { padding: 9px 12px; border-radius: 10px; background: rgba(255, 255, 255, .03); border-left: 3px solid var(--border); font-size: 14.5px; line-height: 1.45; }
  .atls-miss li.ess { background: rgba(239, 68, 68, .07); border-left-color: #ef4444; }
  .atls-miss li.par { border-left-color: #f59e0b; }
  .atls-miss li small { color: var(--muted-2); }
  .atls-bullets { margin: 0; padding-left: 20px; line-height: 1.6; }
  .atls-bullets li { margin: 4px 0; }
  .atls-hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .atls-hist li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, .03); }
  .tabs-label.atls-tema { margin-top: 14px; line-height: 1.35; }
  @media (max-width: 640px) {
    .atls-roles { grid-template-columns: 1fr; } .atls-big { font-size: 46px; }
    .atls-item { grid-template-columns: 1fr; } .atls-barrow { grid-template-columns: 1fr 90px 56px; }
  }
</style>
</head>
<body>
<script>
  try { if (localStorage.getItem('sidebarHidden') === '1') { document.body.classList.add('sidebar-hidden','no-transition'); requestAnimationFrame(() => document.body.classList.remove('no-transition')); } } catch (e) {}
</script>

<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Alternar barra lateral" title="Alternar barra lateral (B)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <line x1="9" y1="4" x2="9" y2="20"/>
  </svg>
</button>

<aside class="sidebar">
  <a href="index.html" class="back-link" title="Voltar ao Sétimo Período">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <span>Sétimo Período</span>
  </a>
  <div class="brand">
    <h1>ATLS</h1>
    <div class="sub">Treino xABCDE em dupla</div>
  </div>
  <div class="tabs-label">Casos clínicos</div>
  <nav class="tabs" id="tabs"></nav>
</aside>

<main id="main"><div class="atls-wrap" id="app"></div></main>

<script src="assets/atls-casos.js"></script>
<script>
  const CASOS = window.ATLS_CASOS || [];
  const HIST_KEY = 'atlsHistorico';
  const $app = document.getElementById('app');
  const S = { caso: null, fase: 'inicio', notas: {}, erros: new Set(), inicio: 0, decorrido: 0, rodando: false, timer: null };

  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const num = v => v.toFixed(2).replace('.', ',');
  const fmt = ms => { const t = Math.floor(ms / 1000); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
  const historico = () => { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; } };
  // rótulo neutro (sem diagnóstico): início da cena
  const rotulo = c => { const fr = c.cena.split(/(?<=[.!?])\s/); const t = (fr.find(x => !/^Você (é|assume)/.test(x)) || fr[0]).replace(/\.$/, ''); return t.length > 60 ? t.slice(0, 58).replace(/\s+\S*$/, '') + '…' : t; };
  const isLetra = e => /^[xXABCDE]$/.test(e) || /^[A-E] e [A-E]$/.test(e);

  // ---- menu lateral: casos agrupados por tema ----
  function renderTabs() {
    const nav = document.getElementById('tabs');
    let h = '', tema = null;
    CASOS.forEach((c, i) => {
      if (c.tema !== tema) { tema = c.tema; h += `<div class="tabs-label atls-tema">${esc(tema)}</div>`; }
      h += `<button class="tab${S.caso === c ? ' active' : ''}" onclick="abrir(${i})" title="${esc(rotulo(c))}"><span class="tab-num">${String(c.n).padStart(2, '0')}</span><span class="tab-name">${esc(rotulo(c))}</span></button>`;
    });
    nav.innerHTML = h;
  }

  function abrir(i) {
    if (S.fase === 'prova' && !confirm('Sair desta prova? O que foi marcado será perdido.')) return;
    pararTimer();
    S.caso = CASOS[i]; S.fase = 'leitura'; S.notas = {}; S.erros = new Set(); S.decorrido = 0;
    renderTabs(); render(); window.scrollTo({ top: 0, behavior: 'instant' });
  }
  function render() {
    if (!S.caso) return renderInicio();
    if (S.fase === 'leitura') return renderLeitura();
    if (S.fase === 'prova') return renderProva();
    return renderResultado();
  }

  const COMO = `<div class="atls-roles">
      <div class="atls-role"><b>🩺 Médico</b><span>Conduz o atendimento em voz alta, na ordem xABCDE: diz o que examina, o que pede e o que faz.</span></div>
      <div class="atls-role"><b>📋 Aplicador</b><span>Fica com o aparelho, revela os achados só quando o médico examinar ou pedir e marca o checklist.</span></div>
    </div>`;
  const REGRAS = `<div class="atls-card"><h3>Como a nota é calculada</h3>
      <p style="font-size:14.5px;color:#cbd5e1">Cada estação vale <b>6,0</b>. Itens valem 0,25, 0,50 ou 0,75 (★ essencial). <b>Adequado</b> = valor inteiro, <b>Parcial</b> = metade, <b>Inadequado</b> = zero.
      Erro grave <b>⚠</b> tira 3,0 pontos; erro <b>✖</b> (potencialmente fatal) zera a nota. A nota mínima é zero.</p></div>`;

  function renderInicio() {
    const h = historico().slice(0, 10);
    const temas = [...new Set(CASOS.map(c => c.tema))];
    $app.innerHTML = `<div class="atls-kicker">ATLS Training</div><h1 class="atls-h1">Treino do xABCDE em dupla</h1>
      <p class="atls-sub">${CASOS.length} casos em ${temas.length} temas. Escolha um caso na barra lateral: leiam juntos, um faz o médico e o outro aplica a prova com o checklist.</p>
      ${COMO}${REGRAS}
      ${h.length ? `<div class="atls-card"><h3>Últimas tentativas</h3><ul class="atls-hist">${h.map(x => `<li><span>${esc(x.titulo)} · ${esc(x.data)}</span><b style="color:${x.nota >= 4.2 ? '#34d399' : x.nota >= 3 ? '#fbbf24' : '#f87171'}">${num(x.nota)} / 6,0</b></li>`).join('')}</ul></div>` : ''}`;
  }

  function renderLeitura() {
    const c = S.caso;
    $app.innerHTML = `<div class="atls-kicker">${esc(c.tema)} · Caso ${c.n}</div>
      <h1 class="atls-h1">Caso ${c.n}</h1>
      <div class="atls-card atls-caso"><h3>Caso clínico</h3><p>${esc(c.cena)}</p></div>
      <div class="atls-card"><h3>Tarefa</h3><ul class="atls-tasks"><li>${esc(c.tarefas[0])}</li></ul></div>
      <div class="atls-actions"><button class="atls-btn" onclick="comecar()">Começar a prova →</button></div>`;
  }

  // ---- cronômetro ----
  function comecar() { S.fase = 'prova'; S.notas = {}; S.erros = new Set(); S.decorrido = 0; iniciarTimer(); render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
  function iniciarTimer() { S.inicio = Date.now() - S.decorrido; S.rodando = true; clearInterval(S.timer); S.timer = setInterval(tickTimer, 500); }
  function pararTimer() { if (S.rodando) S.decorrido = Date.now() - S.inicio; S.rodando = false; clearInterval(S.timer); }
  function alternarTimer() { S.rodando ? pararTimer() : iniciarTimer(); tickTimer(); }
  function tickTimer() {
    const el = document.getElementById('timer'); if (!el) return;
    el.textContent = fmt(S.rodando ? Date.now() - S.inicio : S.decorrido);
    const b = document.getElementById('timerBtn'); if (b) b.textContent = S.rodando ? 'Pausar' : 'Continuar';
  }

  // ---- cálculo da nota ----
  function calcular() {
    const c = S.caso;
    let soma = 0;
    const porBloco = c.blocos.map((b, bi) => {
      let f = 0, max = 0;
      b.itens.forEach((it, ii) => { max += it.v; const n = S.notas[bi + '-' + ii]; if (n) f += it.v * n; });
      soma += f;
      return { nome: b.titulo, f, max };
    }).filter(x => x.max > 0);
    const nAg = [...S.erros].filter(i => !c.erros[i].z).length;
    const fatal = [...S.erros].some(i => c.erros[i].z);
    const nota = fatal ? 0 : Math.max(0, soma - 3 * nAg);
    return { soma, nAg, fatal, nota, porBloco };
  }
  function atualizarLive() {
    const r = calcular(), el = document.getElementById('live');
    if (el) el.textContent = num(r.nota) + ' / 6,0';
    S.caso.blocos.forEach((b, bi) => {
      const e = document.getElementById('bp-' + bi); if (!e) return;
      const f = b.itens.reduce((s, it, ii) => s + it.v * (S.notas[bi + '-' + ii] || 0), 0);
      e.textContent = num(f) + ' / ' + num(b.itens.reduce((s, it) => s + it.v, 0));
    });
  }

  function renderProva() {
    const c = S.caso;
    $app.innerHTML = `<div class="atls-bar"><span class="who">Tela do aplicador</span><span class="atls-timer" id="timer">00:00</span>
        <button class="atls-btn ghost" id="timerBtn" onclick="alternarTimer()">Pausar</button><span class="grow"></span>
        <span class="atls-live" id="live">0,00 / 6,0</span>
        <button class="atls-btn" onclick="finalizar()">Finalizar e somar</button></div>
      <h1 class="atls-h1" style="font-size:22px">${esc(c.titulo)}</h1>
      <p class="atls-sub">Siga a ordem do aluno. Quando ele avaliar uma etapa, leia a <b style="color:#fbbf24">resposta</b> daquela etapa e marque os itens.</p>
      ${c.tarefas.length > 1 ? `<div class="atls-card"><h3>Tarefas da estação — anuncie cada uma quando a anterior terminar</h3><ul class="atls-tasks">${c.tarefas.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
      ${c.blocos.map((b, bi) => `<section class="atls-task">
        <div class="atls-task-h">${esc(b.titulo)}${b.itens.length ? `<span id="bp-${bi}">0,00 / ${num(b.itens.reduce((s, it) => s + it.v, 0))}</span>` : ''}</div>
        <div class="atls-resp"><b>Resposta ao aluno</b>${esc(b.resposta)}</div>
        ${b.itens.map((it, ii) => `<div class="atls-item"><span class="txt">${esc(it.t)}<span class="val${it.e ? ' ess' : ''}">${it.e ? '★ ' : ''}${num(it.v)}</span></span>
          <span class="atls-seg" data-k="${bi}-${ii}"><button data-v="1" onclick="nota(this)">Adequado</button><button data-v="0.5" onclick="nota(this)">Parcial</button><button data-v="0" onclick="nota(this)">Inadequado</button></span></div>`).join('')}
      </section>`).join('')}
      <div class="atls-sec">Erros graves <small>marque só se o aluno cometeu</small></div>
      ${c.erros.map((e, i) => `<label class="atls-err" id="er-${i}"><input type="checkbox" onchange="erro(${i}, this.checked)"><span>${esc(e.t)}<span class="por">${esc(e.por)}</span></span><span class="pen${e.z ? ' z' : ''}">${e.z ? '✖ zera' : '⚠ −3,0'}</span></label>`).join('')}
      <div class="atls-actions"><button class="atls-btn" onclick="finalizar()">Finalizar e somar →</button></div>`;
    tickTimer();
  }
  function nota(btn) {
    const seg = btn.parentElement, k = seg.dataset.k, v = +btn.dataset.v;
    const ja = btn.classList.contains('on');
    seg.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    if (ja) delete S.notas[k]; else { btn.classList.add('on'); S.notas[k] = v; }
    atualizarLive();
  }
  function erro(i, on) { on ? S.erros.add(i) : S.erros.delete(i); document.getElementById('er-' + i).classList.toggle('on', on); atualizarLive(); }

  function finalizar() {
    pararTimer();
    S.res = calcular(); S.res.tempo = S.decorrido;
    try {
      const h = historico();
      h.unshift({ titulo: S.caso.titulo, nota: S.res.nota, data: new Date().toLocaleDateString('pt-BR') });
      localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 50)));
    } catch (e) {}
    S.fase = 'resultado'; render(); window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function renderResultado() {
    const c = S.caso, r = S.res;
    const faltas = [];
    c.blocos.forEach((b, bi) => b.itens.forEach((it, ii) => {
      const n = S.notas[bi + '-' + ii];
      if (n !== 1) faltas.push({ it, etapa: b.titulo, parcial: n === 0.5 });
    }));
    const cometidos = [...S.erros].map(i => c.erros[i]);
    const cor = r.nota >= 4.2 ? '#34d399' : r.nota >= 3 ? '#fbbf24' : '#f87171';
    $app.innerHTML = `<div class="atls-kicker">Resultado · ${esc(c.tema)} · Caso ${c.n}</div>
      <h1 class="atls-h1">${esc(c.titulo)}</h1>
      <div class="atls-card"><div class="atls-score">
        <div class="atls-big" style="color:${cor}">${num(r.nota)}<span style="font-size:24px;color:var(--muted-2)"> / 6,0</span></div>
        <div class="atls-calc">Soma dos itens: <b>${num(r.soma)}</b><br>Erros ⚠: ${r.nAg} × 3,0 = −${num(3 * r.nAg)}${r.fatal ? '<br><span class="atls-zero">Erro ✖ potencialmente fatal: nota zerada</span>' : ''}<br>Tempo: ${fmt(r.tempo)}</div>
      </div></div>
      <div class="atls-card"><h3>Pontuação por etapa</h3><div class="atls-bars">${r.porBloco.map(x => { const p = x.f / x.max * 100;
        return `<div class="atls-barrow"><span class="nm" title="${esc(x.nome)}">${esc(x.nome)}</span><span class="track"><span class="fill ${p < 50 ? 'low' : p < 80 ? 'mid' : ''}" style="width:${p}%"></span></span><span class="n">${num(x.f)}/${num(x.max)}</span></div>`; }).join('')}</div></div>
      ${cometidos.length ? `<div class="atls-card"><h3 style="color:#f87171">Erros graves cometidos</h3><ul class="atls-miss">${cometidos.map(e => `<li class="ess"><b>${e.z ? '✖' : '⚠'}</b> ${esc(e.t)}<br><small>${esc(e.por)}</small></li>`).join('')}</ul></div>` : ''}
      ${faltas.length ? `<div class="atls-card"><h3>O que faltou ou ficou parcial</h3><ul class="atls-miss">${faltas.map(f => `<li class="${f.it.e ? 'ess' : f.parcial ? 'par' : ''}">${f.it.e ? '★ ' : ''}${esc(f.it.t)} <small>(${esc(f.etapa)} · ${f.parcial ? 'parcial' : 'não fez'} · ${num(f.it.v)})</small></li>`).join('')}</ul></div>` : ''}
      <div class="atls-card"><h3>Evolução e desfecho</h3>${c.evolucao.map(p => `<p>${esc(p)}</p>`).join('')}</div>
      ${c.banca.length ? `<div class="atls-card"><h3>O que a banca costuma cobrar</h3><ul class="atls-bullets">${c.banca.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>` : ''}
      <div class="atls-actions">
        <button class="atls-btn" onclick="trocar()">Trocar os papéis e refazer</button>
        <button class="atls-btn ghost" onclick="proximo()">Próximo caso →</button>
      </div>`;
  }

  function trocar() { S.fase = 'leitura'; S.notas = {}; S.erros = new Set(); S.decorrido = 0; render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
  function proximo() { const i = CASOS.indexOf(S.caso); S.fase = 'resultado'; abrir((i + 1) % CASOS.length); }

  function toggleSidebar() {
    const hidden = document.body.classList.toggle('sidebar-hidden');
    try { localStorage.setItem('sidebarHidden', hidden ? '1' : '0'); } catch (e) {}
  }
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const t = e.target; const tag = (t && t.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
      toggleSidebar();
    }
  });
  window.addEventListener('beforeunload', e => { if (S.fase === 'prova' && (Object.keys(S.notas).length || S.erros.size)) { e.preventDefault(); e.returnValue = ''; } });

  renderTabs(); render();
</script>

<script src="assets/efeitos.js"></script>
</body>
</html>
