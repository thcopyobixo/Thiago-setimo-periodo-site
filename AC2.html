      { q: "Quando tratar a hepatite B aguda e com quê?", a: "<ul><li><b>Regra:</b> a maioria só precisa de suporte (cura espontânea em &gt; 95% dos adultos).</li><li><b>Tratar se:</b> forma grave (INR &gt; 1,5), protraída (bilirrubina &gt; 10 mg/dL por &gt; 4 semanas), fulminante, imunossupressão, coinfecção HCV/HDV, hepatopatia prévia ou idoso.</li><li><b>Droga:</b> entecavir ou tenofovir. Evitar interferon.</li><li><b>Suspender:</b> após 2 HBsAg negativos com 4 semanas de intervalo.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da hepatite C aguda?", a: "<p>Tratar já na fase aguda, sem esperar o clareamento espontâneo. Sofosbuvir-velpatasvir por 12 semanas ou glecaprevir-pibrentasvir por 8 semanas (mesmos esquemas da forma crônica).</p>", h: 1 },
      { q: "Qual a profilaxia após exposição ao HBV e ao HAV?", a: "<ul><li><b>HAV:</b> vacina para os contatos (imunoglobulina em grupos selecionados).</li><li><b>HBV em não vacinado ou não respondedor:</b> vacina + imunoglobulina anti-hepatite B.</li><li><b>Recém-nascido de mãe HBsAg+:</b> vacina + imunoglobulina nas primeiras 12 h.</li></ul>", h: 1 },
      { q: "Como fazer a hidratação na pancreatite aguda?", a: "<ul><li><b>Fluido:</b> Ringer lactato (evitar na hipercalcemia).</li><li><b>Volume:</b> ressuscitação moderada, com bolus de 10 mL/kg se houver hipovolemia e depois 1,5 mL/kg/h.</li><li><b>Metas:</b> diurese &gt; 0,5 mL/kg/h, queda de hematócrito e ureia, FC &lt; 120 bpm, PAM &gt; 65 mmHg.</li><li><b>Evitar:</b> volumes fixos agressivos.</li></ul>", h: 1 },
      { q: "Como deve ser a nutrição na pancreatite aguda?", a: "<ul><li><b>Forma leve:</b> dieta oral precoce (&lt; 24 h), sólida e hipolipídica, sem esperar normalizar enzimas.</li><li><b>Forma grave:</b> nutrição enteral (sonda nasogástrica ou nasojejunal) em vez de parenteral, porque reduz mortalidade e falência orgânica.</li><li><b>Contraindicado:</b> probióticos (aumentam a mortalidade).</li><li><b>Analgesia:</b> opioides.</li></ul>", h: 1 },
      { q: "Quando usar antibiótico na pancreatite aguda?", a: "<ul><li><b>Profilaxia:</b> <b>não</b> usar, mesmo na forma necrosante.</li><li><b>Necrose infectada:</b> tratar quando houver piora após melhora inicial ou gás na coleção. Primeira escolha: carbapenêmico (meropenem 1 g de 8/8 h).</li><li><b>Alternativas:</b> piperacilina-tazobactam, cefepime + metronidazol, quinolona + metronidazol.</li><li><b>Punção aspirativa:</b> não é obrigatória.</li></ul>", h: 1 },
      { q: "Qual é a abordagem da necrose pancreática infectada?", a: "<p>Abordagem escalonada (<i>step-up</i>):</p><ol><li>Antibiótico.</li><li>Adiar a intervenção até a necrose estar encapsulada (≥ 4 semanas), se o paciente estiver estável.</li><li>Drenagem percutânea ou endoscópica.</li><li>Necrosectomia minimamente invasiva só se necessário.</li></ol><p>Necrosectomia aberta precoce aumenta a mortalidade.</p>", h: 1 },
      { q: "Quando indicar CPRE e colecistectomia na pancreatite biliar?", a: "<ul><li><b>CPRE urgente (&lt; 24 h):</b> só se houver colangite.</li><li><b>Obstrução persistente sem colangite:</b> confirmar com colangiorressonância ou ecoendoscopia antes de fazer CPRE.</li><li><b>Forma leve:</b> colecistectomia na mesma internação.</li><li><b>Forma necrosante ou com coleções:</b> adiar a colecistectomia até a resolução.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da pericardite aguda?", a: "<ul><li><b>Anti-inflamatório:</b> ibuprofeno 600 mg de 8/8 h ou AAS 1 g de 8/8 h, com IBP.</li><li><b>Colchicina:</b> 0,5 mg 1×/dia (&lt; 70 kg) ou de 12/12 h (≥ 70 kg). Ajustar se ClCr &lt; 30.</li><li><b>Atividade física:</b> restringir até a remissão (sem sintomas e com PCR normal).</li><li><b>Corticoide (0,2–0,5 mg/kg):</b> só se refratária, autoimune, tuberculosa ou pós-pericardiotomia, porque aumenta a recorrência.</li></ul>", h: 1 },
      { q: "Qual é a conduta na pericardite recorrente e na constritiva?", a: "<ul><li><b>Recorrente:</b> reiniciar AINE + colchicina por tempo prolongado (a suspensão precoce da colchicina é causa comum de recorrência). Se refratária, anti-IL-1 (anakinra, rilonacept). Pericardiectomia se refratária a tudo.</li><li><b>Constritiva crônica sintomática:</b> pericardiectomia.</li></ul>", h: 1 },
      { q: "Qual é a conduta no tamponamento cardíaco?", a: "<p>Pericardiocentese de urgência guiada por ultrassom (ou drenagem cirúrgica). Volume com cautela até a drenagem. <b>Evitar</b> diuréticos e vasodilatadores, que derrubam a pré-carga. Enviar o líquido para citologia, ADA e culturas.</p>", h: 1 },
      { q: "Qual é o tratamento da miocardite?", a: "<ul><li><b>IC:</b> tratamento padrão de IC (mantido por cerca de 1 ano).</li><li><b>Arritmias:</b> betabloqueador por pelo menos 6 meses.</li><li><b>AINE e colchicina:</b> só se houver pericardite associada.</li><li><b>Atividade física:</b> repouso até a remissão, com teste ergométrico e Holter antes de liberar.</li><li><b>Fulminante:</b> inotrópico ou vasopressor e suporte mecânico.</li><li><b>Imunossupressão:</b> na fulminante e nas formas não infecciosas (eosinofílica, células gigantes, autoimune).</li></ul>", h: 1 },
      { q: "Como calcular a insulinização plena no DM1 recém-diagnosticado?", a: "<ul><li><b>Dose total:</b> 0,5–1,0 UI/kg/dia, sendo 50% basal e 50% bolus.</li><li><b>Exemplo com 40 kg:</b> 20 UI, sendo 10 UI basal e 10 UI bolus.</li><li><b>Com análogos:</b> glargina ou degludeca 1×/dia + lispro, asparte ou glulisina divididas antes das refeições (3–4–3 UI).</li></ul>", h: 1 },
      { q: "Como prescrever insulinização plena com NPH e regular?", a: "<ul><li><b>NPH (basal):</b> 2/3 pela manhã e 1/3 ao deitar.</li><li><b>Regular (bolus):</b> dividida em 3 doses, 30 minutos antes das refeições.</li><li><b>Exemplo com 10 UI basal e 10 UI bolus:</b> NPH 7 UI pela manhã e 3 UI ao deitar; regular 3–4–3 UI.</li></ul>", h: 1 },
      { q: "Como ajustar a insulina por glicemia pós-prandial?", a: "<ul><li><b>Regra:</b> 1 UI reduz cerca de 50 mg/dL; 15 g de carboidrato elevam cerca de 50 mg/dL.</li><li><b>Exemplo:</b> pós-almoço de 340 mg/dL. 340 − 180 = 160 → acrescentar 3 UI de regular antes do almoço, ou reduzir o carboidrato da refeição.</li></ul>", h: 1 },
      { q: "Como fazer a insulinização parcial no DM2?", a: "<p>Hiperglicemia de jejum apesar dos orais: insulina basal ao deitar (<i>bedtime</i>), 0,1 UI/kg. Exemplo com 70 kg: NPH 7 UI ao deitar, mantendo os orais. Ao associar insulina, reavaliar a sulfonilureia pelo risco de hipoglicemia.</p>", h: 1 },
      { q: "Qual droga escolher no DM2 com DCV, IC ou DRC, independentemente da HbA1c (ADA 2026)?", a: "<table><tr><th>Condição</th><th>Escolha</th></tr><tr><td>Doença cardiovascular aterosclerótica ou alto risco</td><td>AR GLP-1 e/ou iSGLT2 com benefício comprovado</td></tr><tr><td>IC (FE reduzida ou preservada)</td><td>iSGLT2</td></tr><tr><td>DRC com TFG 20–60 e/ou RAC ≥ 30</td><td>iSGLT2 (iniciar se TFG ≥ 20) ou AR GLP-1</td></tr><tr><td>TFG &lt; 30 ou diálise</td><td>AR GLP-1 preferido</td></tr></table><p>Evitar pioglitazona na IC.</p>", h: 1 },
      { q: "Como tratar a hipoglicemia?", a: "<ul><li><b>Glicemia ≤ 70 mg/dL:</b> 15 g de carboidrato rápido, rechecar em 15 minutos e repetir se necessário (regra dos 15). Depois, fazer um lanche.</li><li><b>Em uso de acarbose:</b> usar glicose pura.</li><li><b>Inconsciente:</b> glucagon (nasal ou injetável) ou glicose IV. Nada por via oral.</li><li><b>Após hipoglicemia nível 2 ou 3:</b> reavaliar e desintensificar o esquema.</li></ul>", h: 1 },
      { q: "O que suspender no \"dia de doença\" no paciente diabético?", a: "<table><tr><th>Fármaco</th><th>Quando suspender</th><th>Risco</th></tr><tr><td>iSGLT2</td><td>Jejum, desidratação</td><td>Cetoacidose euglicêmica</td></tr><tr><td>Metformina</td><td>Risco de LRA</td><td>Acidose lática</td></tr><tr><td>AR GLP-1</td><td>Sintomas gastrointestinais</td><td>—</td></tr><tr><td>IECA, BRA, diurético, AINE</td><td>Hipovolemia</td><td>LRA</td></tr></table><p><b>Nunca</b> suspender a insulina basal. Medir cetonas se a glicemia passar de 200 mg/dL.</p>", h: 1 },
      { q: "Qual é a profilaxia primária de sangramento varicoso?", a: "<ul><li><b>Indicação:</b> varizes de médio ou grande calibre, ou pequenas com sinais vermelhos ou Child C.</li><li><b>Opções:</b> betabloqueador não seletivo ou ligadura elástica.</li><li><b>Betabloqueador de escolha:</b> carvedilol 6,25 → 12,5 mg/dia (previne descompensação).</li><li><b>CSPH sem varizes:</b> o betabloqueador também pode ser considerado.</li></ul>", h: 1 },
      { q: "Qual é o tratamento etiológico e geral da cirrose?", a: "<ul><li><b>Etiologia:</b> tratar a causa (abstinência alcoólica, antivirais para HBV/HCV, perda de peso na esteatose).</li><li><b>Nutrição:</b> proteína 1,2–1,5 g/kg/dia, sem restrição, e lanche noturno.</li><li><b>Vacinas:</b> hepatites A e B, pneumococo, influenza.</li><li><b>Evitar:</b> AINE.</li><li><b>Encaminhar para transplante:</b> MELD ≥ 15 ou descompensação.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da ascite no cirrótico?", a: "<ul><li><b>Sal:</b> 2 g de sódio/dia.</li><li><b>Diuréticos:</b> espironolactona 100 mg (até 400 mg) ± furosemida 40 mg (até 160 mg), na proporção 100:40.</li><li><b>Meta de perda de peso:</b> 0,5 kg/dia, ou 1 kg/dia se houver edema.</li><li><b>Restrição hídrica:</b> só com Na &lt; 125 mEq/L.</li><li><b>Suspender:</b> AINE e IECA/BRA.</li><li><b>Ascite tensa:</b> paracentese de grande volume com albumina 6–8 g por litro retirado (se &gt; 5 L).</li><li><b>Ascite refratária:</b> paracenteses seriadas ou TIPS.</li></ul>", h: 1 },
      { q: "Qual é o tratamento e a profilaxia da PBE?", a: "<ul><li><b>Tratamento:</b> cefotaxima 2 g de 8/8 h ou ceftriaxona 2 g/dia por 5 dias, com albumina 1,5 g/kg no dia 1 e 1 g/kg no dia 3.</li><li><b>Profilaxia secundária:</b> norfloxacino 400 mg/dia contínuo.</li><li><b>Profilaxia primária:</b> proteína do líquido &lt; 1,5 g/dL com disfunção hepática ou renal.</li><li><b>Hemorragia digestiva:</b> ceftriaxona 1 g/dia por 7 dias.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da síndrome hepatorrenal (SHR-AKI)?", a: "<ul><li><b>Primeiro:</b> suspender diuréticos e nefrotóxicos, tratar o precipitante e dar albumina 1 g/kg/dia por 2 dias.</li><li><b>Sem resposta:</b> terlipressina (1 mg de 4/4–6/6 h, até 12 mg/dia) com albumina 20–40 g/dia.</li><li><b>Alternativas:</b> noradrenalina em UTI; midodrina + octreotida.</li><li><b>Definitivo:</b> transplante hepático.</li></ul>", h: 1 },
      { q: "Qual é a conduta na hemorragia digestiva varicosa aguda?", a: "<ul><li><b>Transfusão restritiva:</b> alvo de Hb 7–8 g/dL.</li><li><b>Vasoativo:</b> terlipressina 2 mg e depois 1–2 mg de 4/4 h, ou octreotida 50 µg + 50 µg/h, por 2–5 dias.</li><li><b>Antibiótico:</b> ceftriaxona 1 g/dia por 7 dias.</li><li><b>Endoscopia:</b> em até 12 h com ligadura elástica.</li><li><b>Alto risco (Child C 10–13 ou Child B com sangramento ativo):</b> TIPS precoce.</li><li><b>Sangramento refratário:</b> balão como ponte.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da encefalopatia hepática?", a: "<ol><li>Tratar o precipitante.</li><li>Lactulose como primeira linha (oral ou enema), titulada para 2–3 evacuações pastosas por dia.</li><li>Associar rifaximina 550 mg de 12/12 h se recorrente ou sem resposta.</li></ol><p><b>Não</b> restringir proteína.</p>", h: 1 },
      { q: "Como é o tratamento em camadas da DRC (KDIGO 2024)?", a: "<ul><li><b>Base:</b> estilo de vida, estatina e meta de PAS &lt; 120 mmHg (se tolerada).</li><li><b>Albuminúria:</b> IECA ou BRA em dose máxima tolerada.</li><li><b>iSGLT2:</b> DM2 com TFG ≥ 20, DRC com RAC ≥ 200 com ou sem diabetes, ou IC. Manter mesmo com TFG &lt; 20.</li><li><b>DM2 com albuminúria:</b> acrescentar finerenona.</li><li><b>Nunca:</b> associar IECA + BRA.</li></ul>", h: 1 },
      { q: "Quando manter ou suspender IECA/BRA na DRC?", a: "<ul><li><b>Manter:</b> se a creatinina subir até 30% (é o \"dip\" hemodinâmico). Também manter com TFG &lt; 30.</li><li><b>Investigar (sem suspender automaticamente):</b> aumento &gt; 30%. Procurar hipovolemia, AINE ou estenose de artéria renal.</li><li><b>Hipercalemia:</b> tratar o K antes de reduzir a dose.</li><li><b>Suspender:</b> só com hipotensão sintomática, K incontrolável ou uremia em G5.</li></ul>", h: 1 },
      { q: "Quais são os ajustes de dieta e de dose de medicamentos na DRC?", a: "<ul><li><b>Proteína:</b> 0,8 g/kg/dia em G3–G5 (evitar &gt; 1,3 g/kg/dia).</li><li><b>Sódio:</b> &lt; 2 g/dia.</li><li><b>Metformina:</b> reduzir a dose com TFG &lt; 45 e suspender com TFG &lt; 30.</li><li><b>Contraste:</b> hidratar e evitar nefrotóxicos.</li></ul>", h: 1 },
      { q: "Qual é o tratamento emergencial da hipercalemia?", a: "<ol><li>Monitorizar e fazer ECG.</li><li><b>Se houver alteração no ECG:</b> gluconato de cálcio 10%, 30 mL IV em 5–10 minutos.</li><li><b>Redistribuir o K:</b> insulina regular 10 UI + glicose 25 g; salbutamol 10–20 mg nebulizado.</li><li><b>Remover o K:</b> ciclossilicato de zircônio sódico 10 g de 8/8 h; furosemida se houver hipervolemia; diálise se refratária.</li><li>Tratar a causa.</li></ol>", h: 1 },
      { q: "Como tratar a acidose metabólica da DRC?", a: "<p>HCO₃⁻ &lt; 18 mmol/L: bicarbonato de sódio oral, com dieta de menor carga ácida (menos proteína animal, mais frutas e vegetais). Ter cautela com a sobrecarga de sódio e com o potássio quando aumentar os vegetais.</p>", h: 1 },
      { q: "Como tratar a anemia da DRC?", a: "<ol><li><b>Ferro primeiro:</b> no paciente não dialítico, se ferritina &lt; 100 e TSAT &lt; 40%. Oral ou IV.</li><li><b>Agente estimulador da eritropoese (AEE):</b> após repor ferro e corrigir causas reversíveis.</li><li><b>Alvo de Hb:</b> ≤ 11,5 g/dL (cerca de 10–11,5). Não buscar ≥ 13 (mais AVC e eventos).</li><li><b>Transfusão:</b> só em anemia aguda grave ou falha das outras terapias.</li></ol>", h: 1 },
      { q: "Qual é o tratamento do distúrbio mineral e ósseo na DRC?", a: "<ul><li><b>Fósforo:</b> reduzir o fósforo elevado em direção ao normal com dieta e quelantes. Limitar quelantes à base de cálcio.</li><li><b>Cálcio:</b> evitar hipercalcemia. Hipocalcemia leve assintomática não precisa ser corrigida.</li><li><b>PTH progressivamente elevado:</b> corrigir fósforo e vitamina D antes de usar calcitriol ou análogos.</li></ul>", h: 1 },
      { q: "Como tratar a hipocalcemia aguda sintomática?", a: "<ol><li><b>Bolus:</b> gluconato de cálcio 10%, 1–2 g em 50–100 mL de SG 5% ou SF, em 10–20 minutos.</li><li><b>Infusão contínua:</b> cerca de 1 mg/mL, de 0,5–1,5 mg/kg/h de cálcio elementar.</li><li><b>Repor magnésio</b> e monitorizar.</li><li><b>Iniciar já:</b> calcitriol 0,25–0,5 µg 2×/dia + carbonato de cálcio.</li></ol><p>Não infundir na mesma via que bicarbonato ou fosfato. Cálcio sérico a cada 4–6 h.</p>", h: 1 },
      { q: "Quando dar cálcio IV na hipocalcemia?", a: "<ul><li><b>Indicações:</b> sintomas graves (tetania, laringoespasmo, broncoespasmo, convulsão, QT longo, IC); queda aguda para ≤ 7,5 mg/dL mesmo sem sintomas; impossibilidade de usar a via oral.</li><li><b>Não dar de rotina:</b> na DRC assintomática ou na hiperfosfatemia por lise sem sintomas, porque precipita fosfato de cálcio.</li></ul>", h: 1 },
      { q: "Como tratar hipocalcemia associada a hipomagnesemia?", a: "<p>Corrigir o magnésio primeiro, porque sem ele o PTH não é secretado nem age. Sulfato de magnésio 2 g IV em 10–20 minutos e depois 1 g/h enquanto o Mg estiver &lt; 1 mg/dL. Reduzir a dose à metade na insuficiência renal.</p>", h: 1 },
      { q: "Qual é o tratamento crônico do hipoparatireoidismo?", a: "<ul><li><b>Medicamentos:</b> carbonato de cálcio 1–2 g/dia de cálcio elementar com as refeições + calcitriol 0,25–2 µg/dia. Colecalciferol para manter 25(OH)D &gt; 30 ng/mL.</li><li><b>Dieta:</b> pobre em fósforo e em sódio.</li><li><b>Alvo:</b> Ca no limite inferior do normal (cerca de 8,0–8,5 mg/dL), produto Ca × P &lt; 55 e calciúria &lt; 300 mg/24 h.</li><li><b>Hipercalciúria:</b> tiazídico.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da histoplasmose disseminada grave (sem SNC)?", a: "<ol><li><b>Indução:</b> anfotericina B lipossomal 3 mg/kg/dia por 1–2 semanas.</li><li><b>Transição:</b> quando o paciente estiver afebril, estável e tolerando via oral, iniciar itraconazol 200 mg de 8/8 h por 3 dias e depois 200 mg de 12/12 h.</li><li><b>Duração total:</b> ≥ 12 meses.</li></ol><p>Junto com isso: TARV precoce no HIV e reduzir ou suspender a imunossupressão.</p>", h: 1 },
      { q: "Qual é o tratamento da histoplasmose leve a moderada e da forma no SNC?", a: "<ul><li><b>Leve a moderada:</b> itraconazol isolado (ataque de 200 mg de 8/8 h por 3 dias, depois 200 mg de 12/12 h) por ≥ 12 meses.</li><li><b>SNC:</b> anfotericina B lipossomal 5 mg/kg/dia por 4–6 semanas, depois itraconazol 200 mg 2–3×/dia por ≥ 1 ano e até normalizar o LCR.</li></ul>", h: 1 },
      { q: "Quais drogas evitar e quais cuidados ter com o itraconazol na histoplasmose?", a: "<ul><li><b>Não usar:</b> equinocandinas (inativas contra o Histoplasma). Fluconazol só em último caso (menos eficaz e seleciona resistência).</li><li><b>Itraconazol cápsula:</b> tomar com refeição e evitar IBP e antiácidos. A solução oral é tomada em jejum.</li><li><b>Nível sérico:</b> dosar após cerca de 2 semanas.</li><li><b>Alternativa preferida fora do SNC:</b> posaconazol.</li></ul>", h: 1 },
      { q: "Qual é a conduta na insuficiência adrenal por histoplasmose?", a: "<p>Reposição de hidrocortisona, geralmente por toda a vida, porque o infarto adrenal é irreversível. Orientar sobre o risco de interromper. Pensar nesse quadro se houver Na baixo, K alto, hipotensão ortostática ou hipoglicemia.</p>", h: 1 },
      { q: "Qual é o esquema de tratamento da tuberculose sensível?", a: "<ul><li><b>Adultos e ≥ 10 anos:</b> 2RHZE/4RH em dose fixa combinada por peso. Fase intensiva com ≥ 60 doses, manutenção com ≥ 120 doses.</li><li><b>&lt; 10 anos:</b> 2RHZ/4RH.</li><li><b>Forma meningoencefálica e osteoarticular:</b> 2RHZE/10RH, com corticoide na forma meníngea.</li><li><b>Gestante:</b> mesmo esquema + piridoxina 50 mg/dia.</li></ul>", h: 1 },
      { q: "Quando iniciar a TARV na coinfecção TB-HIV?", a: "<table><tr><th>Situação</th><th>Início da TARV</th></tr><tr><td>CD4 &lt; 50 ou imunodepressão grave</td><td>Em até 2 semanas após o RHZE</td></tr><tr><td>CD4 ≥ 50</td><td>Na 8ª semana</td></tr><tr><td>TB meningoencefálica</td><td>Somente após 2 meses</td></tr></table><p>O esquema de TB é o mesmo e tem a mesma duração.</p>", h: 1 },
      { q: "Qual é a conduta na hepatotoxicidade pelo esquema RHZE?", a: "<ul><li><b>TGO/TGP &lt; 3× sem sintomas:</b> manter e monitorizar.</li><li><b>≥ 3× com sintomas ou ≥ 5× sem sintomas:</b> suspender <b>tudo</b>.</li><li><b>Reintrodução após normalizar:</b> RE → depois H (3–7 dias) → depois Z (3–7 dias).</li><li><b>Intolerância à Z:</b> REH por 9 meses.</li><li><b>Intolerância à H:</b> trocar por levofloxacino.</li></ul>", h: 1 },
      { q: "Quais são os esquemas de tratamento da tuberculose latente (ILTB)?", a: "<table><tr><th>Esquema</th><th>Duração</th></tr><tr><td>6H ou 9H (isoniazida 5–10 mg/kg, máx. 300 mg)</td><td>6–9 meses</td></tr><tr><td>4R (rifampicina 10 mg/kg, máx. 600 mg)</td><td>4 meses</td></tr><tr><td>3HP (rifapentina + isoniazida semanal)</td><td>12 doses</td></tr></table><p>Antes de tratar, excluir TB ativa. A rifampicina interage com inibidores de protease e dolutegravir.</p>", h: 1 },
      { q: "Qual é a conduta na estenose mitral reumática importante sintomática?", a: "<ul><li><b>Escolha:</b> valvuloplastia mitral percutânea por balão se Wilkins ≤ 8, sem trombo no AE e com insuficiência mitral no máximo leve. A FA não contraindica.</li><li><b>Se houver contraindicação:</b> comissurotomia ou troca cirúrgica.</li><li><b>EM moderada ou grave com FA:</b> anticoagular com varfarina (DOAC não indicado).</li><li><b>Controle de FC:</b> betabloqueador.</li></ul>", h: 1 },
      { q: "Quando intervir na estenose aórtica e quando escolher TAVI ou cirurgia?", a: "<ul><li><b>Indicações:</b> EAo grave sintomática ou FE &lt; 50%.</li><li><b>Cirurgia:</b> &lt; 70 anos com risco baixo.</li><li><b>TAVI transfemoral:</b> inoperável, frágil ou alto risco; risco intermediário; baixo risco com &gt; 70 anos.</li><li><b>Decisão:</b> sempre pelo Heart Team.</li><li><b>Valvuloplastia por balão:</b> apenas como ponte.</li></ul>", h: 1 },
      { q: "Qual é a indicação de cirurgia na insuficiência aórtica e na mitral primária crônicas?", a: "<ul><li><b>IAo:</b> troca valvar se sintomática, FE &lt; 50% ou VE dilatado (diâmetro sistólico &gt; 50 mm; &gt; 55 mm em reumáticos). O TAVI é exceção.</li><li><b>IM primária:</b> intervenção se sintomática, FE ≤ 60% ou diâmetro sistólico ≥ 40 mm. Plastia é preferível à troca.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da necrose tubular aguda e a prevenção da nefropatia por contraste?", a: "<ul><li><b>NTA:</b> suporte. Manter euvolemia, evitar novos insultos, ajustar a dose de nefrotóxicos e corrigir distúrbios eletrolíticos. Na rabdomiólise, hidratação vigorosa.</li><li><b>Contraste:</b> SF 0,9% 1 mL/kg/h por 12 h antes e depois, menor dose possível, evitar exposições repetidas e suspender nefrotóxicos.</li></ul>", h: 1 },
      { q: "Qual é o tratamento da nefrite intersticial aguda?", a: "<p>Suspender o fármaco causador (antibiótico, IBP ou AINE). Se não houver melhora rápida, prednisona 1 mg/kg/dia por 2–4 semanas com redução progressiva. A recuperação da função renal pode levar cerca de 1,5 mês.</p>", h: 1 },
      { q: "Qual é a conduta na cetoacidose diabética euglicêmica por iSGLT2?", a: "<p>Suspender o iSGLT2 e tratar como CAD: hidratação, insulina IV com glicose (para manter a insulina, já que a glicemia está baixa) e reposição de potássio. A cetoacidose leve pode ser ambulatorial se o paciente estiver estável. O estado hiperglicêmico hiperosmolar sempre exige internação.</p>", h: 1 }
    ]
  },
  {
    id: "rf-diagnostico",
    name: "Diagnóstico, risco e investigação",
    rev: 1,
    cards: [
      { q: "Como se define síncope?", a: "<p>Perda transitória da consciência e do tônus postural, de início súbito, autolimitada e de curta duração, causada por hipofluxo cerebral transitório. A recuperação é espontânea e completa.</p>", h: 1 },
      { q: "Quais achados da anamnese sugerem síncope reflexa (vasovagal)?", a: "<p>Gatilhos típicos (dor, medo, ortostase prolongada, calor, micção, tosse, pós-exercício), pródromos longos (tontura, turvação visual, sudorese fria), ausência de trauma grave e recuperação rápida. Exame físico e ECG são normais.</p>", h: 1 },
      { q: "Quais são os critérios de hipotensão ortostática e como medir?", a: "<p>Medir a PA após repouso adequado em decúbito dorsal e depois com 1 e 3 minutos em pé. Queda de PAS ≥ 20 mmHg ou de PAD ≥ 10 mmHg define hipotensão ortostática.</p>", h: 1 },
      { q: "Quais alterações do ECG são critérios maiores de alto risco na síncope?", a: "<ul><li>Isquemia aguda.</li><li>BAV Mobitz II ou BAV de 3º grau.</li><li>Bradicardia &lt; 40 bpm ou pausas &gt; 3 s.</li><li>FA com resposta ventricular &lt; 40 bpm.</li><li>Bloqueio de ramo ou distúrbio de condução intraventricular.</li><li>Ondas Q.</li><li>TV sustentada ou não sustentada.</li><li>Disfunção de marca-passo ou CDI.</li><li>Padrão Brugada tipo 1.</li><li>QT longo (&gt; 460 ms) ou curto (&lt; 340 ms).</li></ul>", h: 1 },
      { q: "Quais são os três estratos de probabilidade pré-teste no TEP e quais ferramentas os definem?", a: "<ul><li>Estratos: &lt; 15% (baixa), 15–50% (intermediária) e &gt; 50% (alta).</li><li>Ferramentas: Wells, Genebra revisado ou gestalt clínico.</li><li>Wells padrão: baixo &lt; 2, moderado 2–6, alto &gt; 6.</li><li>Wells modificado: TEP provável &gt; 4.</li></ul>", h: 1 },
      { q: "Quais são os 8 critérios PERC e quando podem ser aplicados?", a: "<ul><li>Critérios: idade &lt; 50 anos; FC &lt; 100 bpm; SatO₂ ≥ 95%; sem hemoptise; sem estrogênio; sem TVP/TEP prévio; sem edema unilateral de perna; sem cirurgia ou trauma com internação nas últimas 4 semanas.</li><li>Aplicação: só quando a probabilidade pré-teste for &lt; 15%. Com os 8 preenchidos, nenhum outro teste é necessário.</li></ul>", h: 1 },
      { q: "Quando o D-dímero ajustado e o algoritmo YEARS podem ser usados para excluir TEP?", a: "<ul><li><b>Ajuste por idade:</b> idade × 10 µg/L em pacientes &gt; 50 anos.</li><li><b>YEARS:</b> usa três itens (sinais de TVP, hemoptise, TEP como diagnóstico mais provável). Com 0 itens, o limiar é 1.000 µg/L; com ≥ 1 item, é 500 µg/L.</li><li><b>Condições para excluir:</b> D-dímero abaixo do limiar, probabilidade &lt; 50% e paciente não anticoagulado.</li></ul>", h: 1 },
      { q: "Quais são as categorias clínicas de TEP da AHA/ACC 2026?", a: "<ul><li><b>A:</b> subclínico (incidental, assintomático).</li><li><b>B:</b> sintomático com escore baixo (PESI ≤ 85, sPESI 0 ou Bova ≤ 4).</li><li><b>C:</b> sintomático com escore elevado. C1 tem VD e biomarcador normais; C2 tem VD <b>ou</b> biomarcador alterado; C3 tem VD <b>e</b> biomarcador alterados.</li><li><b>D:</b> falência cardiopulmonar incipiente. D1 é hipotensão transitória; D2 é choque normotenso.</li><li><b>E:</b> falência estabelecida. E1 é choque cardiogênico; E2 é choque refratário ou parada.</li><li><b>Modificador \"R\":</b> acrescentado quando há componente respiratório.</li></ul>", h: 1 },
      { q: "Qual o papel do ecocardiograma e da razão VD/VE na angio-TC no TEP?", a: "<ul><li>O eco <b>não</b> confirma nem exclui TEP, porque a sensibilidade é baixa. Ele serve para estratificar risco.</li><li>Na angio-TC, deve-se relatar a razão VD/VE numérica. VD/VE ≥ 1,0 tem sensibilidade de 85% e especificidade de 72% para disfunção de VD.</li><li>Achados de disfunção de VD no eco: VD/VE &gt; 0,9, TAPSE &lt; 1,7 cm e sinal de McConnell.</li></ul>", h: 1 },
      { q: "Como interpretar o painel da hepatite B: HBsAg, anti-HBc IgM, anti-HBc total e anti-HBs?", a: "<ul><li><b>HBsAg:</b> infecção atual. Se persiste por mais de 6 meses, define cronicidade.</li><li><b>Anti-HBc IgM:</b> infecção recente (também pode subir na reagudização).</li><li><b>Anti-HBc total:</b> contato prévio. Nunca aparece após vacinação.</li><li><b>Anti-HBs isolado:</b> vacinação.</li><li><b>Anti-HBs + anti-HBc:</b> infecção resolvida.</li><li><b>Janela imunológica:</b> apenas o anti-HBc IgM é positivo.</li></ul>", h: 1 },
      { q: "Quais são as fases da hepatite B crônica?", a: "<ul><li><b>Imunotolerante:</b> HBeAg+, DNA muito alto, ALT normal.</li><li><b>Imunoativa HBeAg+:</b> DNA ≥ 20.000 UI/mL, ALT elevada.</li><li><b>Imunoativa HBeAg−:</b> variante pré-core, DNA ≥ 2.000 UI/mL, ALT elevada.</li><li><b>Inativa:</b> HBeAg−, anti-HBe+, DNA &lt; 2.000 UI/mL, ALT normal.</li><li><b>Oculta:</b> HBsAg−, DNA presente no fígado.</li></ul>", h: 1 },
      { q: "Como se diagnostica hepatite C ativa e hepatite C aguda?", a: "<ul><li><b>Infecção ativa:</b> o anti-HCV indica apenas contato; quem confirma infecção ativa é o HCV-RNA.</li><li><b>Hepatite C aguda:</b> HCV-RNA detectável com anti-HCV que soroconverte em até 12 semanas, ou testes negativos documentados nos 6 meses anteriores.</li><li><b>Pista clínica:</b> ALT e RNA flutuam muito na fase aguda.</li></ul>", h: 1 },
      { q: "Qual exame confirma hepatite A e qual o padrão laboratorial típico?", a: "<ul><li><b>Confirmação:</b> IgM anti-HAV, positivo desde os sintomas e por 3–6 meses. O IgG isolado indica infecção passada ou vacinação.</li><li><b>Laboratório:</b> ALT frequentemente &gt; 1.000 U/L, maior que a AST; bilirrubina geralmente ≤ 10 mg/dL.</li><li><b>Transmissão:</b> o paciente é transmissor 2 semanas antes até 1 semana após a icterícia.</li></ul>", h: 1 },
      { q: "Qual é o melhor marcador de gravidade na hepatite aguda viral?", a: "<p>O tempo de protrombina (INR). INR &gt; 1,5, encefalopatia, icterícia profunda ou bilirrubina &gt; 10 mg/dL por mais de 4 semanas indicam forma grave, protraída ou risco de falência hepática.</p>", h: 1 },
      { q: "Quais são os critérios diagnósticos de pancreatite aguda?", a: "<p>São necessários 2 de 3:</p><ol><li>Dor abdominal característica (epigástrica, em faixa, irradiada para o dorso).</li><li>Lipase ou amilase ≥ 3× o limite superior (a lipase é preferida).</li><li>Imagem compatível.</li></ol><p>A TC <b>não</b> é rotina na admissão.</p>", h: 1 },
      { q: "Como a Classificação de Atlanta revisada define a gravidade da pancreatite?", a: "<ul><li><b>Leve:</b> sem falência orgânica e sem complicação local ou sistêmica.</li><li><b>Moderadamente grave:</b> falência orgânica transitória (&lt; 48 h) e/ou complicação local.</li><li><b>Grave:</b> falência orgânica persistente (&gt; 48 h).</li><li><b>Falência orgânica:</b> Marshall modificado ≥ 2 em qualquer sistema (respiratório, renal ou cardiovascular).</li></ul>", h: 1 },
      { q: "Quais são os componentes do BISAP e o que significa um escore ≥ 3?", a: "<ul><li><b>B:</b> BUN &gt; 25 mg/dL.</li><li><b>I:</b> alteração do nível de consciência (<i>impaired mental status</i>).</li><li><b>S:</b> SIRS (≥ 2 critérios).</li><li><b>A:</b> idade &gt; 60 anos.</li><li><b>P:</b> derrame pleural.</li></ul><p>Um ponto cada. BISAP ≥ 3 indica mortalidade &gt; 5% e necessidade de UTI. Para triagem inicial, a SIRS na admissão (e se persistir após 48 h) é a ferramenta mais simples.</p>", h: 1 },
      { q: "Quais são as indicações de TC na pancreatite aguda e quando fazê-la?", a: "<ul><li><b>Indicações:</b> diagnóstico incerto, ausência de melhora em 48–72 h, piora clínica ou suspeita de complicação.</li><li><b>Momento ideal para avaliar necrose:</b> 72–96 h. Antes disso, a TC subestima a necrose.</li><li><b>USG de abdome:</b> deve ser feita em <b>todos</b> os pacientes na admissão, para pesquisar litíase.</li></ul>", h: 1 },
      { q: "Quais são as coleções da pancreatite segundo Atlanta?", a: "<ul><li><b>Antes de 4 semanas:</b> coleção líquida peripancreática aguda (APFC) na forma edematosa; coleção necrótica aguda (ANC) na forma necrosante.</li><li><b>Após 4 semanas:</b> pseudocisto (encapsulado, sem sólido) ou necrose encapsulada (WON, encapsulada, com necrose sólida).</li><li><b>Gás na coleção:</b> sugere necrose infectada.</li></ul>", h: 1 },
      { q: "Como se faz o diagnóstico de pericardite aguda?", a: "<ul><li><b>Critérios:</b> dor torácica característica (pleurítica, melhora ao inclinar para frente), atrito pericárdico, ECG típico e derrame pericárdico. PCR/VHS e RM/TC apoiam.</li><li><b>Diagnóstico:</b> dor + 1 critério = possível; dor + ≥ 2 = definitivo.</li></ul>", h: 1 },
      { q: "Qual o ECG típico da pericardite e o que o diferencia do IAM?", a: "<p>Supra de ST difuso e côncavo, com infradesnivelamento de PR. Diferente do IAM, o supra não respeita um território coronariano e não há imagem em espelho (exceto aVR). Podem ocorrer arritmias supraventriculares.</p>", h: 1 },
      { q: "Quais são os achados de tamponamento cardíaco?", a: "<ul><li><b>Clínicos:</b> tríade de Beck (hipotensão, turgência jugular e bulhas abafadas), taquicardia e pulso paradoxal.</li><li><b>ECG:</b> alternância elétrica.</li><li><b>Radiografia:</b> silhueta cardíaca alargada.</li><li><b>Eco:</b> derrame com colapso diastólico de AD/VD e variação respiratória dos fluxos.</li><li><b>Gravidade do derrame ao eco:</b> &lt; 10 mm leve, 10–20 mm moderado, &gt; 20 mm grave.</li></ul>", h: 1 },
      { q: "Como diferenciar pericardite constritiva de IC direita convencional?", a: "<p>Na constrição há turgência jugular com sinal de Kussmaul, ascite, hepatomegalia e edema, mas FE preservada e pulmões limpos. O eco ou a RM mostra pericárdio espessado e interdependência ventricular. Pistas na história: pericardite prévia (tuberculose), cirurgia cardíaca ou radioterapia.</p>", h: 1 },
      { q: "Como se diagnostica e classifica a miocardite?", a: "<ul><li><b>Diagnóstico definido:</b> clínica + RM cardíaca (edema em T2 e realce tardio mesoepicárdico, multifocal e não isquêmico) ou biópsia endomiocárdica. Achados de apoio: troponina, ECG alterado, alteração segmentar e strain.</li><li><b>Fulminante:</b> instalação aguda com instabilidade que exige inotrópico ou suporte mecânico.</li><li><b>Complicada:</b> FE &lt; 50%, arritmia ventricular sustentada, BAV avançado, IC ou choque.</li></ul>", h: 1 },
      { q: "Quando indicar biópsia endomiocárdica na miocardite?", a: "<p>IC de início recente (&lt; 2 semanas) com apresentação grave (instabilidade, arritmia ventricular, BAV avançado) e casos refratários ao tratamento sem etiologia definida. Também na suspeita de formas que mudam a conduta (eosinofílica, células gigantes, autoimune).</p>", h: 1 },
      { q: "Quais são os componentes do Child-Pugh e o que ele classifica?", a: "<ul><li><b>Componentes:</b> bilirrubina, albumina, INR, ascite e encefalopatia.</li><li><b>Classes:</b> A (5–6 pontos), B (7–9) e C (10–15).</li><li><b>Uso:</b> classifica reserva hepática e prognóstico. Child ≥ 12 ou MELD ≥ 21 indicam sobrevida ≤ 6 meses. MELD orienta a prioridade de transplante.</li></ul>", h: 1 },
      { q: "Como a elastografia e as plaquetas ajudam a estimar fibrose e hipertensão portal (Baveno VII)?", a: "<ul><li><b>&lt; 10 kPa:</b> torna cirrose improvável.</li><li><b>&gt; 20–25 kPa:</b> sugere hipertensão portal clinicamente significativa (CSPH).</li><li><b>&lt; 20 kPa com plaquetas &gt; 150.000:</b> varizes de alto risco improváveis, dispensa a EDA de rastreio.</li><li><b>Rastreio não invasivo:</b> FIB-4 e APRI (APRI &gt; 2 é específico para cirrose).</li></ul>", h: 1 },
      { q: "Qual é o rastreamento obrigatório no cirrótico?", a: "<ul><li><b>Carcinoma hepatocelular:</b> USG hepática a cada 6 meses, com ou sem alfafetoproteína. A alfafetoproteína isolada não serve.</li><li><b>Varizes:</b> EDA ao diagnóstico, salvo critérios de Baveno VII favoráveis.</li></ul>", h: 1 },
      { q: "Como interpretar o GASA e a proteína do líquido ascítico?", a: "<ul><li><b>GASA = albumina sérica − albumina do líquido.</b></li><li><b>GASA ≥ 1,1 g/dL:</b> hipertensão portal (cirrose, IC, Budd-Chiari).</li><li><b>GASA &lt; 1,1 g/dL:</b> sem hipertensão portal (carcinomatose, TB peritoneal, nefrótica, pancreatite).</li><li><b>Proteína &lt; 1,5 g/dL:</b> alto risco de PBE.</li><li><b>Proteína ≥ 2,5 g/dL com GASA alto:</b> sugere ascite cardíaca.</li></ul>", h: 1 },
      { q: "Qual o critério de PBE e como diferenciar de peritonite secundária?", a: "<ul><li><b>PBE:</b> PMN ≥ 250/mm³ no líquido ascítico, independentemente da cultura. Em ascite hemorrágica, subtrair 1 PMN a cada 250 hemácias.</li><li><b>Peritonite secundária:</b> suspeitar se houver ≥ 2 de: proteína &gt; 1 g/dL, glicose &lt; 50 mg/dL, LDH acima do limite sérico; ou cultura polimicrobiana.</li><li><b>Bacterascite:</b> cultura + com PMN &lt; 250.</li></ul>", h: 1 },
      { q: "Quais são os critérios de síndrome hepatorrenal (SHR-AKI)?", a: "<ol><li>Cirrose com ascite.</li><li>Lesão renal aguda pelos critérios do ICA.</li><li>Sem resposta após 2 dias sem diurético e com albumina 1 g/kg.</li><li>Sem choque.</li><li>Sem nefrotóxicos.</li><li>Sem doença parenquimatosa: proteinúria &lt; 500 mg/dia, hematúria &lt; 50 hemácias/campo e USG normal.</li></ol>", h: 1 },
      { q: "Como se classifica a encefalopatia hepática (West Haven)?", a: "<ul><li><b>Grau 1 (encoberta):</b> déficit de atenção e alteração do sono.</li><li><b>Grau 2 (manifesta):</b> letargia, desorientação temporal e asterixis.</li><li><b>Grau 3:</b> sonolência ou estupor e desorientação importante.</li><li><b>Grau 4:</b> coma.</li></ul><p>O diagnóstico é clínico, sem necessidade de amônia. Sempre buscar o precipitante: infecção, sangramento, constipação, distúrbio eletrolítico ou sedativos.</p>", h: 1 },
      { q: "Como se define doença renal crônica (KDIGO 2024)?", a: "<ul><li><b>Definição:</b> alteração de estrutura ou função renal por <b>mais de 3 meses</b>, com implicação para a saúde.</li><li><b>Critérios:</b> TFG &lt; 60 <b>ou</b> marcador de lesão (RAC ≥ 30 mg/g, sedimento alterado, distúrbio tubular, alteração histológica ou de imagem, transplante).</li><li><b>Atenção:</b> G1–G2 sem marcador de lesão <b>não</b> é DRC.</li></ul>", h: 1 },
      { q: "Como se faz a classificação CGA da DRC?", a: "<ul><li><b>C:</b> causa.</li><li><b>G:</b> TFG. G1 ≥ 90; G2 60–89; G3a 45–59; G3b 30–44; G4 15–29; G5 &lt; 15.</li><li><b>A:</b> albuminúria (RAC). A1 &lt; 30; A2 30–300; A3 &gt; 300 mg/g.</li></ul>", h: 1 },
      { q: "Como estimar o risco de falência renal na DRC e quando encaminhar?", a: "<ul><li><b>Ferramenta:</b> KFRE (idade, sexo, TFG e RAC) em G3–G5.</li><li><b>Encaminhar ao nefrologista:</b> risco ≥ 3–5% em 5 anos, TFG &lt; 30, queda sustentada &gt; 20%, RAC &gt; 700 mg/g ou ≥ 300 com hematúria, cilindros hemáticos, HAS refratária ou K persistentemente alterado.</li><li><b>Planejar terapia renal substitutiva:</b> risco &gt; 40% em 2 anos.</li></ul>", h: 1 },
      { q: "Qual a vantagem da cistatina C e quando usá-la?", a: "<p>Estima a TFG sem depender da massa muscular. É útil quando a creatinina é pouco confiável (sarcopenia, amputação, obesidade, dieta, fármacos) e para confirmar G3a. A equação combinada creatinina + cistatina C é a mais acurada. Quando disponível, define a categoria G.</p>", h: 1 },
      { q: "Como classificar a gravidade da hipercalemia e excluir pseudo-hipercalemia?", a: "<ul><li><b>Gravidade:</b> moderada se K 6,0–6,4; grave se K ≥ 6,5 (ação imediata, com ECG e monitorização).</li><li><b>Pseudo-hipercalemia:</b> garrote apertado, abrir e fechar a mão, hemólise, plaquetose ou leucocitose. Repetir em plasma com heparina.</li><li><b>Revisar fármacos:</b> IECA, BRA, antagonista mineralocorticoide, trimetoprima, AINE.</li></ul>", h: 1 },
      { q: "Como se define e investiga a anemia na DRC?", a: "<ul><li><b>Definição:</b> Hb &lt; 13 g/dL (homens) ou &lt; 12 g/dL (mulheres).</li><li><b>Investigação inicial:</b> hemograma, reticulócitos, ferritina e saturação de transferrina.</li><li><b>Deficiência de ferro:</b> TSAT &lt; 20% com ferritina &lt; 100 (não dialítico) ou &lt; 200 (hemodiálise).</li><li><b>Ferritina &lt; 45 ou VCM &lt; 80:</b> investigar sangramento.</li><li><b>Anemia da DRC:</b> é diagnóstico de exclusão (normocítica e hipoproliferativa).</li></ul>", h: 1 },
      { q: "Qual é o padrão laboratorial do DMO-DRC (distúrbio mineral e ósseo) e por que o PTH sobe?", a: "<p>A queda de néfrons reduz a excreção de fosfato, o que aumenta o FGF23. O FGF23 reduz o calcitriol, o que reduz a absorção de cálcio e eleva o PTH (hiperparatireoidismo secundário). Laboratório: fósforo e PTH altos, cálcio baixo ou normal, calcitriol baixo.</p>", h: 1 },
      { q: "Quais são os critérios diagnósticos de hipoparatireoidismo?", a: "<ul><li><b>Critério:</b> hipocalcemia (corrigida pela albumina) com PTH baixo ou inapropriadamente normal (&lt; 20 pg/mL), em ≥ 2 ocasiões com ≥ 2 semanas de intervalo, com função renal normal.</li><li><b>Antes de interpretar:</b> corrigir o magnésio. Fósforo alto corrobora.</li><li><b>Pós-cirúrgico permanente:</b> hipocalcemia &gt; 6–12 meses após a cirurgia.</li></ul>", h: 1 },
      { q: "Qual é o passo a passo da investigação da hipocalcemia?", a: "<ol><li>Confirmar se é real: repetir; usar cálcio iônico ou corrigir (Ca + 0,8 × [4 − albumina]).</li><li>Dosar PTH na mesma amostra.</li><li>Dosar Mg, fósforo, 25(OH)D e creatinina.</li></ol><table><tr><th>Padrão</th><th>Interpretação</th></tr><tr><td>PTH baixo + P alto</td><td>Hipoparatireoidismo</td></tr><tr><td>PTH alto + P alto</td><td>Pseudo-hipoparatireoidismo ou DRC</td></tr><tr><td>PTH alto + P baixo</td><td>Deficiência de vitamina D</td></tr></table>", h: 1 },
      { q: "Quais são os sinais de Chvostek e Trousseau e qual o valor de cada um?", a: "<ul><li><b>Chvostek:</b> percussão do nervo facial causa contração perilabial. É pouco específico (positivo em 10–25% dos normocalcêmicos).</li><li><b>Trousseau:</b> manguito 20 mmHg acima da PAS por 3 minutos causa \"mão de parteiro\". É mais específico (1–4% em normais).</li></ul>", h: 1 },
      { q: "Como reconhecer o pseudo-hipoparatireoidismo tipo 1A?", a: "<ul><li><b>Laboratório:</b> hipocalcemia e hiperfosfatemia com PTH <b>alto</b> (resistência ao PTH), função renal normal.</li><li><b>Fenótipo (osteodistrofia hereditária de Albright):</b> face arredondada, baixa estatura, braquidactilia do 4º e 5º dedos, obesidade e ossificações subcutâneas.</li><li><b>Outras resistências:</b> TSH e gonadotrofinas.</li><li><b>Genética:</b> mutação inativadora do GNAS herdada da mãe.</li></ul>", h: 1 },
      { q: "Quando suspeitar de histoplasmose disseminada no paciente com HIV?", a: "<p>CD4 ≤ 150 com residência atual ou prévia em área endêmica (ou exposição a excretas de aves e morcegos), com:</p><ul><li>febre e perda de peso;</li><li>hepatoesplenomegalia e linfadenopatia;</li><li>pancitopenia;</li><li>lesões de pele ou mucosa;</li><li>infiltrado micronodular difuso;</li><li>LDH e ferritina muito altas.</li></ul>", h: 1 },
      { q: "Quais exames diagnosticam histoplasmose disseminada e qual o mais sensível?", a: "<ul><li><b>Mais sensível:</b> antígeno de Histoplasma na urina (cerca de 97% no HIV avançado) e no soro.</li><li><b>Junto com ele:</b> hemoculturas por lise-centrifugação.</li><li><b>Confirmação:</b> cultura (até 6 semanas) ou histopatologia (GMS/PAS) de medula, pele, linfonodo ou fígado.</li><li><b>Limitações:</b> anticorpos podem ser negativos no imunossuprimido. Antígeno negativo não exclui.</li></ul>", h: 1 },
      { q: "Quais são os critérios de gravidade da histoplasmose disseminada que definem a droga inicial?", a: "<ul><li><b>Grave:</b> necessidade de internação, sepse, febre alta, instabilidade, insuficiência orgânica, pancitopenia, fungemia ou imunossupressão grave. Começa com anfotericina.</li><li><b>Leve a moderada:</b> foco único, sem SNC e sem fungemia. Pode começar com itraconazol.</li><li><b>Preditores de falha do itraconazol:</b> febre &gt; 39,5 °C, Karnofsky &lt; 60, fosfatase alcalina &gt; 5× e albumina &lt; 3.</li></ul>", h: 1 },
      { q: "Qual é a investigação inicial do sintomático respiratório para tuberculose?", a: "<p>Tosse ≥ 3 semanas: teste rápido molecular (TRM-TB) no escarro, que dá resultado em cerca de 2 h, tem sensibilidade de cerca de 90% e detecta resistência à rifampicina. Pedir cultura com teste de sensibilidade em todos os casos (padrão-ouro). A baciloscopia exige 2 amostras. O TRM não serve para controle de tratamento.</p>", h: 1 },
      { q: "Como diagnosticar tuberculose pleural?", a: "<p>Exsudato com predomínio de linfócitos e ADA &gt; 40 U/L (sensibilidade de cerca de 93% e especificidade de cerca de 97%). A baciloscopia do líquido costuma ser negativa (forma paucibacilar). A biópsia pleural mostra granuloma caseoso em 70–80%.</p>", h: 1 },
      { q: "Quais são os pontos de corte da prova tuberculínica para tratar infecção latente (ILTB)?", a: "<ul><li><b>≥ 5 mm (ou IGRA +):</b> PVHIV, contatos de TB bacilífera, imunossuprimidos (anti-TNF, prednisona ≥ 15 mg/dia por &gt; 1 mês, pré-transplante), radiografia com sequela não tratada.</li><li><b>≥ 10 mm (ou IGRA +):</b> silicose, conversão recente, profissionais de saúde, populações vulneráveis, diálise, diabetes insulinodependente, neoplasias.</li><li><b>Antes de tratar:</b> sempre excluir TB ativa.</li></ul>", h: 1 },
      { q: "Qual o LCR típico da TB meningoencefálica e como ela se apresenta?", a: "<ul><li><b>LCR:</b> proteínas altas (100–500 mg/dL), glicose baixa (&lt; 40 mg/dL ou &lt; 50% da sérica) e celularidade moderada com predomínio de linfócitos.</li><li><b>Fases:</b> prodrômica, meníngea (sinais meníngeos e pares cranianos, sobretudo o VI) e paralítica.</li></ul>", h: 1 },
      { q: "Quais são os critérios ecocardiográficos de estenose mitral grave e o que é o escore de Wilkins-Block?", a: "<ul><li><b>EM grave:</b> área valvar &lt; 1,5 cm², gradiente médio ≥ 10 mmHg e PSAP ≥ 50 mmHg.</li><li><b>Wilkins-Block:</b> pontua mobilidade, espessamento subvalvar, espessura dos folhetos e calcificação (1–4 cada).</li><li><b>Interpretação:</b> ≤ 8 (com calcificação ≤ 2) é anatomia favorável à valvuloplastia por balão; &gt; 10 é desfavorável.</li></ul>", h: 1 },
      { q: "Quais são os critérios de estenose aórtica grave?", a: "<ul><li><b>Eco:</b> área valvar ≤ 1,0 cm² (indexada ≤ 0,6 cm²/m²), gradiente médio ≥ 40 mmHg e velocidade máxima ≥ 4,0 m/s.</li><li><b>Exame físico:</b> pulso <i>parvus et tardus</i>, B2 hipofonética e sopro com pico telessistólico.</li><li><b>Baixo fluxo/baixo gradiente com FE baixa:</b> eco com dobutamina.</li><li><b>Escore de cálcio:</b> &gt; 1.300 AU em mulheres e &gt; 2.000 AU em homens.</li></ul>", h: 1 },
      { q: "Quais são os critérios de insuficiência mitral primária grave?", a: "<p>Eco com vena contracta ≥ 0,7 cm, área efetiva do orifício regurgitante ≥ 0,40 cm², volume regurgitante ≥ 60 mL, fração regurgitante ≥ 50% e jato ≥ 40% do AE. Exame físico: sopro sistólico regurgitativo ≥ 3+/6+ e ictus desviado.</p>", h: 1 },
      { q: "Quais são os critérios de insuficiência aórtica grave?", a: "<ul><li><b>Eco:</b> vena contracta &gt; 0,6 cm, área efetiva do orifício regurgitante ≥ 0,30 cm², volume regurgitante ≥ 60 mL e fração regurgitante ≥ 50%.</li><li><b>Exame físico:</b> sopro diastólico aspirativo, Austin-Flint, pulso de Corrigan, divergência pressórica e sinais periféricos (Musset, Quincke, Traube, Duroziez).</li></ul>", h: 1 },
      { q: "Quais são os critérios diagnósticos de diabetes (ADA 2026)?", a: "<table><tr><th>Exame</th><th>Diabetes</th><th>Pré-diabetes</th></tr><tr><td>HbA1c</td><td>≥ 6,5%</td><td>5,7–6,4%</td></tr><tr><td>Glicemia de jejum</td><td>≥ 126 mg/dL</td><td>100–125 mg/dL</td></tr><tr><td>TOTG 75 g (2 h)</td><td>≥ 200 mg/dL</td><td>140–199 mg/dL</td></tr><tr><td>Glicemia aleatória</td><td>≥ 200 mg/dL com sintomas</td><td>—</td></tr></table><p>Sem hiperglicemia inequívoca, são necessários 2 resultados alterados (podem ser 2 testes diferentes na mesma amostra).</p>", h: 1 },
      { q: "Quando a HbA1c não serve para diagnosticar diabetes?", a: "<p>Hemoglobinopatias (anemia falciforme), gestação, hemodiálise, perda sanguínea ou transfusão recente, eritropoetina, alguns antirretrovirais, deficiência de G6PD, hemólise, ferropenia e cirrose. Nessas situações, usar a glicemia plasmática.</p>", h: 1 },

      { q: "Quais pistas sugerem diabetes tipo 1 no adulto e como confirmar?", a: "<ul><li><b>Pistas:</b> idade &lt; 35 anos, IMC &lt; 25, perda de peso, cetoacidose e glicemia &gt; 360 mg/dL à apresentação.</li><li><b>Confirmação:</b> autoanticorpos, começando pelo anti-GAD (depois IA-2 e ZnT8).</li><li><b>Se negativos:</b> considerar MODY ou dosar peptídeo C (medir antes de suspender a insulina).</li></ul>", h: 1 },

/* -------- Sons (Web Audio API, sem arquivos) -------- */
let audioCtx = null;
let masterGain = null;
const MASTER_VOL = 0.45; // volume geral do site
function getAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = MASTER_VOL;
      masterGain.connect(audioCtx.destination);
    } catch {}
  }
  return audioCtx;
}
function playTone(freqs, duration = 0.2, type = 'sine', gainStart = 0.15) {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  freqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f.freq, now + (f.at || 0));
    if (f.slideTo) osc.frequency.exponentialRampToValueAtTime(f.slideTo, now + (f.at || 0) + duration);
    gain.gain.setValueAtTime(0, now + (f.at || 0));
    gain.gain.linearRampToValueAtTime(gainStart, now + (f.at || 0) + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (f.at || 0) + duration);
    osc.connect(gain).connect(masterGain);
    osc.start(now + (f.at || 0));
    osc.stop(now + (f.at || 0) + duration + 0.02);
  });
}
function makeNoiseBurst(ctx, at, duration, freqStart, freqEnd, peakGain, filterType = 'bandpass', Q = 3) {
  const bufSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.setValueAtTime(freqStart, at);
  filter.frequency.exponentialRampToValueAtTime(freqEnd, at + duration);
  filter.Q.value = Q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(peakGain, at + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, at + duration);
  src.connect(filter).connect(g).connect(masterGain);
  src.start(at);
  src.stop(at + duration + 0.02);
}
function soundOk() {
  // acorde ascendente: C5, E5, G5 (523, 659, 784)
  playTone([
    { freq: 523.25, at: 0 },
    { freq: 659.25, at: 0.08 },
    { freq: 783.99, at: 0.16 }
  ], 0.35, 'triangle', 0.14);
}
function soundErr() {
  // descendente grave
  playTone([
    { freq: 220, slideTo: 110, at: 0 }
  ], 0.35, 'sawtooth', 0.12);
}
function soundEnd() {
  playTone([
    { freq: 523.25, at: 0 },
    { freq: 659.25, at: 0.12 },
    { freq: 783.99, at: 0.24 },
    { freq: 1046.50, at: 0.36 }
  ], 0.4, 'triangle', 0.12);
}
function soundFlip() {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Swoosh: ruído bandpass varrendo 2000 → 500 Hz
  makeNoiseBurst(ctx, now, 0.18, 2000, 500, 0.22, 'bandpass', 3);
  // Estalo curto no final (carta pousando)
  const clickAt = now + 0.12;
  const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.04), ctx.sampleRate);
  const cd = clickBuf.getChannelData(0);
  for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / cd.length);
  const click = ctx.createBufferSource();
  click.buffer = clickBuf;
  const clickHp = ctx.createBiquadFilter();
  clickHp.type = 'highpass';
  clickHp.frequency.value = 1500;
  const clickGain = ctx.createGain();
  clickGain.gain.setValueAtTime(0.28, clickAt);
  clickGain.gain.exponentialRampToValueAtTime(0.001, clickAt + 0.05);
  click.connect(clickHp).connect(clickGain).connect(masterGain);
  click.start(clickAt);
  click.stop(clickAt + 0.05);
}
function soundSlide(direction = 'right') {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Whoosh mais suave e curto que o flip — sem estalo
  // direção altera o "pitch" do filtro (esquerda = pitch mais alto)
  const startF = direction === 'left' ? 2400 : 1800;
  const endF   = direction === 'left' ? 700  : 400;
  makeNoiseBurst(ctx, now, 0.22, startF, endF, 0.18, 'bandpass', 2);
}
function soundShuffle() {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Riffle: 7 estalos curtos com variação (som de baralho embaralhando)
  const N = 7;
  for (let i = 0; i < N; i++) {
    const at = now + i * 0.055 + (Math.random() * 0.015);
    // pequeno swoosh
    makeNoiseBurst(ctx, at, 0.06, 2600 + Math.random() * 1500, 900, 0.14, 'bandpass', 4);
    // estalo curto
    const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.025), ctx.sampleRate);
    const cd = clickBuf.getChannelData(0);
    for (let j = 0; j < cd.length; j++) cd[j] = (Math.random() * 2 - 1) * (1 - j / cd.length);
    const click = ctx.createBufferSource();
    click.buffer = clickBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2500 + Math.random() * 1500;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14 + Math.random() * 0.06, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.035);
    click.connect(hp).connect(g).connect(masterGain);
    click.start(at + 0.02);
    click.stop(at + 0.05);
  }
}

const PROG_PREFIX = "ac2_";

/* -------- Cards errados: lista e revisão -------- */
function errKey(id) { return PROG_PREFIX + id + "_erros"; }
function loadErros(id) {
  try { const a = JSON.parse(localStorage.getItem(errKey(id)) || "[]"); return Array.isArray(a) ? a : []; } catch { return []; }
}
function saveErros(id, arr) {
  try { localStorage.setItem(errKey(id), JSON.stringify(arr)); } catch (e) {}
}
function registrarErro(cardIdx, kind) {
  const deck = state.currentDeck; if (!deck) return;
  const set = new Set(loadErros(deck.id));
  if (kind === 'err') set.add(cardIdx); else set.delete(cardIdx);
  saveErros(deck.id, [...set].filter(i => i < deck.cards.length).sort((a, b) => a - b));
}
function answerHtml(card) { return card.h ? card.a : escapeHtml(card.a); }

function showErros() {
  state.view = 'erros';
  const deck = state.currentDeck;
  const erros = loadErros(deck.id).filter(i => i < deck.cards.length);
  $main.innerHTML = `
    <div class="err-view">
      <button class="btn" onclick="closeErros()">← Voltar</button>
      <h2>Cards que você errou</h2>
      <div class="err-sub">${escapeHtml(deck.name)} · ${erros.length} ${erros.length === 1 ? 'card' : 'cards'}. Um card sai da lista quando você acerta ele de novo.</div>
      ${erros.length ? `
      <div class="err-actions">
        <button class="btn primary" onclick="startReviewErros()">Revisar em modo flashcard</button>
        <button class="btn" onclick="clearErros()">Limpar lista</button>
      </div>
      <div class="err-list">
        ${erros.map((i, k) => `
          <details class="err-item">
            <summary><span class="err-n">${k + 1}</span><span>${escapeHtml(deck.cards[i].q)}</span></summary>
            <div class="err-a">${answerHtml(deck.cards[i])}</div>
          </details>`).join('')}
      </div>` : `<div class="err-empty">Nenhum card errado neste tema por enquanto.</div>`}
    </div>`;
}
function closeErros() { state.view = null; render(); }
function clearErros() {
  if (!confirm("Limpar a lista de cards errados deste tema?")) return;
  saveErros(state.currentDeck.id, []);
  showErros();
}
function startReviewErros(lista) {
  const deck = state.currentDeck;
  const erros = (lista || loadErros(deck.id)).filter(i => i < deck.cards.length);
  if (!erros.length) { showErros(); return; }
  state.view = null;
  state.mode = 'erros';
  state.order = erros.slice();
  state.index = 0;
  state.results = {};
  state.finished = false;
  state.flipped = false;
  state.enterDir = 'up';
  soundShuffle();
  render();
}
function exitReview() {
  state.mode = 'normal';
  selectDeck(state.currentDeck);
}

function saveProgress() {
  if (!state.currentDeck || state.mode === 'erros') return;
  localStorage.setItem("ac2_" + state.currentDeck.id, JSON.stringify({
    index: state.index,
    order: state.order,
    results: state.results,
    finished: state.finished
  }));
}

function loadProgress(deckId) {
  try {
    const raw = localStorage.getItem("ac2_" + deckId);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return {
      index: p.index || 0,
      order: p.order || null,
      results: p.results || {},
      finished: !!p.finished
    };
  } catch { return null; }
}

function renderTabs() {
  $tabs.innerHTML = "";
  DECKS.forEach((deck, i) => {
    if (deck.rev && !(DECKS[i - 1] && DECKS[i - 1].rev)) {
      const lbl = document.createElement("div");
      lbl.className = "tabs-label rev-label";
      lbl.textContent = "Revisão final";
      $tabs.appendChild(lbl);
    }
    const btn = document.createElement("button");
    btn.className = "tab" + (deck.rev ? " rev" : "") + (state.currentDeck && state.currentDeck.id === deck.id ? " active" : "");
    btn.innerHTML = '<span>' + escapeHtml(deck.name) + '</span><span class="count">' + deck.cards.length + '</span>';
    btn.onclick = () => selectDeck(deck);
    $tabs.appendChild(btn);
  });
}

function selectDeck(deck) {
  state.currentDeck = deck;
  state.mode = 'normal';
  state.view = null;
  document.documentElement.classList.toggle('theme-red', !!deck.rev);
  state.flipped = false;
  state.enterDir = 'up';
  const saved = loadProgress(deck.id);
  if (saved && saved.order && saved.order.length === deck.cards.length) {
    state.index = saved.index;
    state.order = saved.order;
    state.results = saved.results;
    state.finished = saved.finished;
  } else {
    state.index = 0;
    state.order = deck.cards.map((_, i) => i);
    state.results = {};
    state.finished = false;
  }
  renderTabs();
  render();
}

function shuffle() {
  soundShuffle();
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.index = 0;
  state.flipped = false;
  state.results = {};
  state.finished = false;
  state.enterDir = 'up';
  saveProgress();
  render();
}

function resetDeck() {
  if (!confirm("Reiniciar progresso deste tema?")) return;
  state.index = 0;
  state.order = state.currentDeck.cards.map((_, i) => i);
  state.results = {};
  state.finished = false;
  state.flipped = false;
  saveProgress();
  render();
}

function animateExit(exitClass, cb) {
  const wrap = document.querySelector('.card-anim');
  if (!wrap || state.animating) { cb(); return; }
  state.animating = true;
  wrap.classList.remove('enter-right','enter-left','enter-up');
  wrap.classList.add(exitClass);
  setTimeout(() => {
    state.animating = false;
    cb();
  }, 320);
}

function next() {
  if (state.finished || state.animating) return;
  if (state.index < state.order.length - 1) {
    soundSlide('left');
    animateExit('exit-left', () => {
      state.index++;
      state.flipped = false;
      state.enterDir = 'right';
      saveProgress();
      render();
    });
  }
}

function prev() {
  if (state.animating) return;
  if (state.finished) {
    soundSlide('right');
    state.finished = false;
    state.index = state.order.length - 1;
    state.flipped = false;
    state.enterDir = 'left';
    saveProgress();
    render();
    return;
  }
  if (state.index > 0) {
    soundSlide('right');
    animateExit('exit-right', () => {
      state.index--;
      state.flipped = false;
      state.enterDir = 'left';
      saveProgress();
      render();
    });
  }
}

function flip() {
  if (state.animating) return;
  const cardEl = document.querySelector('.card');
  if (!cardEl) return;
  if (cardEl.classList.contains('blinking')) return;

  const wasFlipped = state.flipped;
  state.flipped = !wasFlipped;
  saveProgress();
  soundFlip();

  cardEl.classList.add('blinking');

  // Troca a face no meio (quando o card está invisível)
  setTimeout(() => {
    if (wasFlipped) cardEl.classList.remove('flipped');
    else cardEl.classList.add('flipped');
  }, 190);

  setTimeout(() => {
    cardEl.classList.remove('blinking');
  }, 410);
}

function mark(kind) {
  if (state.finished || state.animating) return;
  const cardIdx = state.order[state.index];
  state.results[cardIdx] = kind;
  registrarErro(cardIdx, kind);

  // som
  if (kind === 'ok') soundOk(); else soundErr();

  // botão pulsa
  const keyBtn = document.querySelector(`.key.${kind === 'ok' ? 'ok' : 'err'}`);
  if (keyBtn) { keyBtn.classList.add('pressed'); setTimeout(() => keyBtn.classList.remove('pressed'), 400); }

  // flash overlay
  const container = document.querySelector('.card-container');
  if (container) {
    const flash = document.createElement('div');
    flash.className = 'flash-overlay ' + kind;
    container.appendChild(flash);
    setTimeout(() => flash.remove(), 600);
  }

  animateExit(kind === 'ok' ? 'exit-up' : 'exit-down', () => {
    state.flipped = false;
    if (state.index < state.order.length - 1) {
      state.index++;
      state.enterDir = 'up';
    } else {
      state.finished = true;
      soundEnd();
    }
    saveProgress();
    render();
  });
}

function countResults() {
  let correct = 0, wrong = 0;
  Object.values(state.results).forEach(v => {
    if (v === 'ok') correct++;
    else if (v === 'err') wrong++;
  });
  return { correct, wrong };
}

function classify(pct) {
  if (pct >= 90) return { key: 'excelente', label: 'Excelente' };
  if (pct >= 75) return { key: 'otimo', label: 'Ótimo' };
  if (pct >= 60) return { key: 'regular', label: 'Regular' };
  return { key: 'melhorar', label: 'Precisa Melhorar' };
}

function render() {
  const deck = state.currentDeck;
  if (!deck) { renderEmpty(); return; }
  if (state.view === 'erros') { showErros(); return; }
  if (state.finished) { renderEnd(); return; }
  renderDeck();
}

function renderDeck() {
  const deck = state.currentDeck;
  const total = state.order.length;
  const nErros = loadErros(deck.id).length;
  const revisando = state.mode === 'erros';
  const cardIdx = state.order[state.index];
  const card = deck.cards[cardIdx];
  const progress = ((state.index + 1) / total) * 100;
  const atFirst = state.index === 0;

  $main.innerHTML = `
    <div class="toolbar">
      <div>
        <div class="deck-title">${escapeHtml(deck.name)}${revisando ? '<span class="review-tag">Revisando erros</span>' : ''}</div>
        <div class="deck-progress-num"><span class="curr">${state.index + 1}</span> de ${total}</div>
      </div>
      <div class="actions">
        ${revisando ? `<button class="btn" onclick="exitReview()">Sair da revisão</button>` : `
        ${nErros ? `<button class="btn err-btn" onclick="showErros()">Errados<b>${nErros}</b></button>` : ''}
        <button class="btn" onclick="shuffle()">Embaralhar</button>
        <button class="btn" onclick="resetDeck()">Reiniciar</button>`}
      </div>
    </div>

    <div class="progress-bar"><div class="fill" style="width:${progress}%"></div></div>

    <div class="card-container">
      <div class="card-anim ${state.enterDir ? 'enter-' + state.enterDir : ''}">
        <div class="card ${state.flipped ? 'flipped' : ''}" onclick="flip()">
          <div class="face front">
            <div class="label">Pergunta</div>
            <div class="content">${escapeHtml(card.q)}</div>
            <div class="hint">clique ou espaço</div>
          </div>
          <div class="face back">
            <div class="label">Resposta</div>
            <div class="content${card.h ? ' rich' : ''}">${card.h ? card.a : escapeHtml(card.a)}</div>
            <div class="hint">clique ou espaço</div>
          </div>
        </div>
      </div>
    </div>

    <div class="keymap">
      <button class="key ${atFirst ? 'disabled' : ''}" onclick="prev()" ${atFirst ? 'disabled' : ''}>
        <span class="icon">←</span><span>Anterior</span>
      </button>
      <button class="key err" onclick="mark('err')">
        <span class="icon">↓</span><span>Errei</span>
      </button>
      <button class="key ok" onclick="mark('ok')">
        <span class="icon">↑</span><span>Acertei</span>
      </button>
      <button class="key" onclick="next()">
        <span class="icon">→</span><span>Próximo</span>
      </button>
    </div>
  `;
  // Clear entry direction after render so flipping doesn't retrigger animation
  state.enterDir = null;
}

function renderEnd() {
  const deck = state.currentDeck;
  const total = state.order.length;
  const revisando = state.mode === 'erros';
  const erradosRodada = state.order.filter(i => state.results[i] === 'err');
  const { correct, wrong } = countResults();
  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  const cls = classify(pct);

  // donut math
  const r = 100;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  const colorFor = {
    excelente: 'var(--ok)',
    otimo: 'var(--accent)',
    regular: 'var(--warn)',
    melhorar: 'var(--err)'
  }[cls.key];

  $main.innerHTML = `
    <div class="end-screen">
      <h2>${revisando ? 'Revisão dos Erros Concluída' : 'Sessão Concluída'}</h2>
      <div class="subtitle">${escapeHtml(deck.name)} · ${total} flashcards${revisando ? ' revisados' : ''}</div>

      <div class="donut">
        <svg viewBox="0 0 240 240">
          <circle class="track" cx="120" cy="120" r="${r}"></circle>
          <circle class="fill-arc" cx="120" cy="120" r="${r}"
                  stroke="${colorFor}"
                  stroke-dasharray="${circ}"
                  stroke-dashoffset="${circ}"
                  id="arc"></circle>
        </svg>
        <div class="center">
          <div class="pct">${pct}%</div>
          <div class="pct-label">Acertos</div>
        </div>
      </div>

      <div class="badge ${cls.key}">${cls.label}</div>

      <div class="end-stats">
        <div class="end-stat correct">
          <div class="val">${correct}</div>
          <div class="lbl">Acertos</div>
        </div>
        <div class="end-stat wrong">
          <div class="val">${wrong}</div>
          <div class="lbl">Erros</div>
        </div>
        <div class="end-stat">
          <div class="val">${answered}/${total}</div>
          <div class="lbl">Respondidos</div>
        </div>
      </div>

      ${erradosRodada.length ? `
      <div class="end-errors">
        <div class="end-errors-title">${revisando ? 'Ainda errou' : 'Você errou'} ${erradosRodada.length} ${erradosRodada.length === 1 ? 'card' : 'cards'}</div>
        <div class="err-list">
          ${erradosRodada.map((i, k) => `
            <details class="err-item">
              <summary><span class="err-n">${k + 1}</span><span>${escapeHtml(deck.cards[i].q)}</span></summary>
              <div class="err-a">${answerHtml(deck.cards[i])}</div>
            </details>`).join('')}
        </div>
      </div>` : ''}

      <div class="end-actions">
        ${erradosRodada.length ? `<button class="btn primary" onclick="startReviewErros([${erradosRodada.join(',')}])">${erradosRodada.length === 1 ? 'Revisar o card que errei' : 'Revisar os ' + erradosRodada.length + ' que errei'}</button>` : ''}
        ${revisando ? `<button class="btn" onclick="exitReview()">Voltar ao tema completo</button>` : `
        <button class="btn" onclick="prev()">Voltar ao último</button>
        <button class="btn ${erradosRodada.length ? '' : 'primary'}" onclick="resetDeck()">Recomeçar</button>
        <button class="btn" onclick="shuffle()">Embaralhar</button>
        ${loadErros(deck.id).length ? `<button class="btn err-btn" onclick="showErros()">Todos os errados<b>${loadErros(deck.id).length}</b></button>` : ''}`}
      </div>
    </div>
  `;

  // Animate donut fill
  requestAnimationFrame(() => {
    const arc = document.getElementById('arc');
    if (arc) arc.style.strokeDashoffset = offset;
  });
}

function renderEmpty() {
  $main.innerHTML = `
    <div class="empty">
      <h2>Selecione um tema</h2>
      <p>Escolha um tema na barra lateral para começar.</p>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document.addEventListener("keydown", (e) => {
  if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = e.target; const tag = (t && t.tagName || '').toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && !(t && t.isContentEditable)) {
      toggleSidebar(); return;
    }
  }
  if (!state.currentDeck) return;
  if (state.view === 'erros') return;
  if (state.finished) {
    if (e.key === "ArrowLeft") prev();
    return;
  }
  if (e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowUp") { e.preventDefault(); mark('ok'); }
  else if (e.key === "ArrowDown") { e.preventDefault(); mark('err'); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});

renderTabs();
if (DECKS.length > 0) selectDeck(DECKS[0]);
</script>

<script src="assets/efeitos.js"></script>
</body>
</html>
