      { q: "Quais achados de imagem sugerem cirrose e hipertensão portal?", a: "USG: fígado de contornos irregulares/nodulares, ecotextura grosseira e heterogênea, hipertrofia do lobo caudado e atrofia do lobo direito, esplenomegalia (>13 cm). Sinais de hipertensão portal: veia porta >13 mm, fluxo portal hepatofugal ao Doppler, recanalização da veia umbilical, ascite. TC/RM: mesmos achados + melhor detecção de CHC (wash-in arterial + wash-out portal). Limitação: USG pode ser normal na cirrose compensada precoce (sensibilidade ~85%)." },
      { q: "Qual o rastreamento de varizes recomendado e quando se pode dispensar a EDA?", a: "EDA no diagnóstico de cirrose. Se sem varizes e causa não tratada: repetir em 2–3 anos; se varizes de pequeno calibre: em 1–2 anos. Pelo critério Baveno VII, se elastografia >20–25 kPa + plaquetas <150.000 (indicando CSPH), pode-se iniciar BBNS sem EDA prévia. Se a causa de base for tratada com sucesso (ex.: SVR na hepatite C), a regressão de varizes é possível e o intervalo de rastreamento pode ser estendido." },
      { q: "Qual o critério diagnóstico de PBE e por que a cultura é frequentemente negativa?", a: "Critério: ≥250 PMN/mm³ no líquido ascítico, independentemente da cultura. A cultura é negativa em até 40% dos casos ('bacterascite cultura-negativa') porque a concentração bacteriana é baixa. A inoculação em frascos de hemocultura à beira-leito aumenta a sensibilidade. Patógenos mais comuns: E. coli e Klebsiella (~70%), seguidos por Streptococcus e Enterococcus." },
      { q: "Por que a albumina IV reduz a mortalidade na PBE? Cite o estudo.", a: "A PBE causa vasodilatação esplâncnica adicional → queda do volume arterial efetivo → risco de SHR. A albumina (1,5 g/kg no dia 1 + 1 g/kg no dia 3) atua como expansor plasmático oncótico, restaurando parcialmente o volume circulante efetivo e prevenindo a SHR. Em RCT com 126 pacientes, a albumina reduziu a mortalidade hospitalar de 29% para 10% e a incidência de SHR de 33% para 10%." },
      { q: "Diferencie SHR-AKI (antigo tipo 1) de SHR-NAKI (antigo tipo 2).", a: "SHR-AKI: deterioração aguda (↑creatinina ≥0,3 mg/dL em 48h ou ≥50% em 7 dias) que não responde a expansão com albumina por 2 dias. Mortalidade >80% sem tratamento. Requer terlipressina + albumina urgente. SHR-NAKI: disfunção renal crônica, mais lenta e estável, geralmente associada a ascite refratária. Prognóstico reservado mas menos fulminante. Ambos são funcionais — rins histologicamente normais." },
      { q: "Quais são os precipitantes mais comuns de encefalopatia hepática e por que a alcalose metabólica a precipita?", a: "Precipitantes: infecção (incluindo PBE), hemorragia GI (hemoglobina digerida é substrato para amoniagênese), constipação, sedativos/opioides, distúrbios eletrolíticos, excesso de diuréticos, TIPS, e desidratação. A alcalose metabólica precipita EH porque converte NH4+ (ionizada, não atravessa BHE) em NH3 (não ionizada, atravessa livremente a BHE), aumentando a captação cerebral de amônia." },
      { q: "O que são ortodeóxia e platipneia, e em que complicação da cirrose ocorrem?", a: "Ocorrem na síndrome hepatopulmonar (SHP). Ortodeóxia: piora da oxigenação ao sentar (oposto da ortopneia cardíaca). Platipneia: dispneia ao sentar. Explicação: a vasodilatação intrapulmonar predomina nas bases; ao sentar, a gravidade aumenta o fluxo para as bases vasodilatadas, piorando o shunt e a oxigenação. Diagnóstico: ecocardiograma com microbolhas. Tratamento: transplante hepático (único curativo)." },
      { q: "Como é classificada a ascite na cirrose e qual a abordagem terapêutica por grau?", a: "Grau 1: detectável apenas por imagem — observação + restrição de sódio (2 g/dia). Grau 2: moderada, distensão simétrica — restrição de sódio + espironolactona 100 mg/dia (titular até 400 mg) ± furosemida 40 mg/dia (titular até 160 mg), mantendo proporção 100:40. Grau 3: tensa, desconforto — paracentese de grande volume + albumina (6–8 g/L removida) seguida de diuréticos. Refratária: falha de diuréticos em dose máxima — opções: paracenteses repetidas, TIPS, ou transplante." },
      { q: "O que define ascite refratária e quais as opções terapêuticas?", a: "Definição: ascite que não responde a diuréticos em dose máxima (espironolactona 400 mg + furosemida 160 mg) ou que recidiva rapidamente após paracentese, ou quando os diuréticos causam efeitos adversos intoleráveis. Sobrevida mediana ~6 meses. Opções: (1) paracenteses de grande volume repetidas + albumina — paliativo; (2) TIPS — melhora controle da ascite em ~75%, mas pode piorar EH e não melhora sobrevida global; (3) transplante hepático — único tratamento definitivo." },
      { q: "Quais são os critérios para profilaxia primária e secundária de PBE?", a: "Primária: (1) durante hemorragia varicosa aguda — ceftriaxona IV por 7 dias (todo cirrótico com sangramento GI); (2) proteína no líquido ascítico <1,5 g/dL + pelo menos um de: Child-Pugh ≥9, bilirrubina >3, creatinina >1,2 ou Na <130 — norfloxacino 400 mg/dia ou SMX-TMP 800/160 mg/dia. Secundária: após primeiro episódio de PBE — norfloxacino 400 mg/dia ou SMX-TMP indefinidamente (recidiva em ~70% sem profilaxia em 1 ano)." },
      { q: "Qual o manejo inicial da hemorragia varicosa aguda?", a: "Tríade simultânea: (1) Estabilização — reposição volêmica cautelosa (alvo Hb 7–8 g/dL; transfusão excessiva piora a hipertensão portal); (2) Vasoconstritor esplâncnico — octreotide ou terlipressina por 2–5 dias para reduzir o fluxo portal; (3) EDA em até 12h — ligadura elástica como primeira escolha. Antibioticoprofilaxia obrigatória (ceftriaxona) por 7 dias — infecção precipita ressangramento e morte. Se refratário: TIPS de resgate. Mortalidade em 30 dias: ~15–20%." },
      { q: "Diferencie a profilaxia primária e secundária de sangramento varicoso.", a: "Primária (nunca sangrou): BBNS (carvedilol 6,25–12,5 mg/dia preferido) OU ligadura elástica para varizes de médio/grande calibre. Pelo Baveno VII, se CSPH documentada, iniciar BBNS mesmo sem EDA. Secundária (já sangrou): BBNS + ligadura elástica combinados — a associação é superior a qualquer um isolado. Se refratário: TIPS. A escolha entre BBNS e ligadura na primária depende de preferência do paciente e contraindicações." },
      { q: "Descreva os graus da encefalopatia hepática pela classificação de West Haven.", a: "EHM (mínima): sem alteração clínica, detectável apenas por testes psicométricos — afeta até 80% dos cirróticos, compromete direção veicular. Grau 1: alteração do ciclo sono-vigília, déficit de atenção, euforia ou ansiedade. Grau 2: letargia, desorientação temporal, asterixis (flapping). Grau 3: sonolência, confusão, desorientação grosseira, comportamento bizarro. Grau 4: coma. Graus 2–4 são clinicamente evidentes (overt HE); EHM e grau 1 são covert HE." },
      { q: "Quais os critérios de rastreamento de CHC e quando o padrão de imagem dispensa biópsia?", a: "Rastreamento: USG hepática ± alfafetoproteína a cada 6 meses em todo cirrótico. Se nódulo >1 cm: TC ou RM com protocolo multifásico. O padrão wash-in arterial + wash-out portal é diagnóstico de CHC em nódulo >1 cm em fígado cirrótico, sem necessidade de biópsia (critérios LI-RADS/AASLD). Nódulos <1 cm: reavaliar em 3 meses. Em obesos com USG de baixa qualidade, considerar TC ou RM alternadas para rastreamento." },
      { q: "Qual a evidência do PREDESCI para uso de BBNS na prevenção de descompensação? Cite as limitações.", a: "O PREDESCI (2019) randomizou 201 pacientes com cirrose compensada e CSPH (HVPG ≥10 mmHg) para BBNS vs. placebo. HR 0,51 (IC 95% 0,26-0,97) para descompensação ou morte — taxa absoluta 16% vs. 27%, NNT ~9. Limitações: tamanho amostral modesto (201), IC tangenciando 1,0 (significância limítrofe), desfecho composto (descompensação + morte) agrupando eventos de gravidade distinta. É o único RCT nesse cenário." },
      { q: "Por que a simvastatina + rifaximina falhou na cirrose descompensada (LIVERHOPE)? O que isso ensina?", a: "O LIVERHOPE testou simvastatina (40 mg) + rifaximina (1200 mg) em 237 pacientes Child B/C — sem benefício em prevenir descompensação adicional ou morte. A simvastatina age no componente funcional da hipertensão portal (melhora função endotelial sinusoidal via NO). A falha sugere que, após o limiar de descompensação, o dano estrutural irreversível e a cascata neuro-humoral já desencadeada superam o componente funcional. Confirmação mecanística do 'ponto de não retorno'." },
      { q: "Por que AINEs são contraindicados na cirrose? E qual o analgésico de escolha?", a: "Na cirrose, as prostaglandinas (PGE2, prostaciclina) são vasodilatadores renais cruciais — compensam a vasoconstrição renal mediada pelo SRAA e simpático. AINEs bloqueiam a COX → removem essa proteção → insuficiência renal aguda + retenção de sódio (piora ascite) + risco de sangramento GI. Isso inclui COX-2 seletivos. O paracetamol (≤2 g/dia) é o analgésico de escolha — seguro em dose ajustada porque seu risco é hepatotoxicidade (glutationa), não renal ou GI." },
      { q: "Qual a dose de carvedilol na profilaxia e quais são os limites para seu uso?", a: "Dose: 6,25 mg/dia VO, podendo ser titulada até 12,5 mg/dia. Limites: suspender se PAS <90 mmHg ou FC <55 bpm. Na cirrose descompensada avançada com PAS muito baixa, os BBNS podem ser deletérios ('window hypothesis'). O carvedilol é preferido ao propranolol (Grau 2C) pelo triplo bloqueio (β1+β2+α1) e maior redução do HVPG. Estudo de base de dados (>26.000 pacientes) mostrou RR 0,80 para morte com carvedilol vs. propranolol." },
      { q: "Por que NÃO se deve restringir proteínas na encefalopatia hepática?", a: "A restrição proteica está abandonada — piora a sarcopenia (presente em ~60% dos cirróticos) sem benefício na EH. A sarcopenia é fator prognóstico independente (dobra a mortalidade em lista de transplante). Recomenda-se 1,2-1,5 g/kg/dia de proteína. A refeição noturna (late evening snack, ~200 kcal) encurta o jejum e reduz o catabolismo muscular. Proteínas vegetais e BCAA podem ser preferidas por menor amoniagênese." },
      { q: "Qual o impacto do tratamento etiológico da hepatite C na cirrose e o que é recompensação?", a: "DAAs atingem cura (SVR) em >95% dos cirróticos compensados. Resultados: regressão parcial de fibrose (queda da elastografia), redução do HVPG, redução do risco de descompensação e CHC (mas não eliminação — rastreamento deve continuar). Na cirrose descompensada, DAAs com ribavirina; evitar inibidores de protease em Child B/C. A hepatite C é o exemplo mais robusto de recompensação pós-tratamento etiológico. Regimes sem inibidores de protease para Child B/C pela hepatotoxicidade." },
      { q: "Quais as condutas etiológicas para hepatopatia alcoólica e MASLD?", a: "Álcool: abstinência completa é a intervenção mais impactante — pode reverter fibrose significativa. Adjuvantes: programas de reabilitação, baclofen (único testado em cirróticos). A 'regra dos 6 meses' de abstinência pré-transplante está sendo revisada em favor de avaliação psicossocial individualizada. MASLD: perda de peso ≥10% pode reverter esteatohepatite e fibrose. Exercício aeróbico melhora esteatose mesmo sem perda de peso. Cirurgia bariátrica considerada em Child A selecionados." },
      { q: "Qual a lógica da proporção 100:40 entre espironolactona e furosemida na ascite?", a: "O hiperaldosteronismo secundário é o motor principal da retenção de sódio na cirrose (SRAA ativado) — por isso a espironolactona (antagonista de aldosterona) é o diurético de primeira linha. A furosemida é adjuvante. A proporção 100:40 (espironolactona:furosemida em mg) mantém equilíbrio de potássio (espironolactona poupa K+, furosemida desperdiça K+). Meta: perda ponderal ~0,5 kg/dia sem edema ou ~1 kg/dia com edema. Monitorizar eletrólitos e creatinina a cada 1–2 semanas durante titulação." },
      { q: "Qual o protocolo de tratamento e profilaxia da encefalopatia hepática com lactulose e rifaximina?", a: "Tratamento agudo: lactulose 15–45 mL VO 2–4×/dia, titular para 2–3 evacuações pastosas/dia (acidifica o lúmen colônico, convertendo NH3 em NH4+ não absorvível). Se EH grau 3–4: via sonda ou enema. Profilaxia de recorrência: lactulose + rifaximina 550 mg 2×/dia. A combinação reduz recorrência de EH em ~50% comparada a lactulose isolada. Sempre investigar e tratar precipitantes (infecção, hemorragia, constipação, sedativos, distúrbios eletrolíticos)." },
      { q: "Qual o mecanismo e as limitações da terlipressina no tratamento da SHR-AKI?", a: "Mecanismo: análogo de vasopressina → vasoconstrição esplâncnica → melhora enchimento arterial efetivo → desativa parcialmente SRAA/simpático → melhora perfusão renal. Usada com albumina IV. Limitações: (1) ponte para transplante, não definitivo — recidiva frequente; (2) efeitos adversos sérios: isquemia periférica/mesentérica, arritmias, hiponatremia — requer monitorização contínua; (3) contraindicada em doença coronariana/vascular periférica significativa; (4) resposta parcial em ~40–50%." },
      { q: "Por que a vacinação é parte integral do manejo da cirrose? Quais esquemas são especiais?", a: "Cirróticos são imunocomprometidos funcionalmente (disfunção reticuloendotelial, deficiência de complemento, linfopenia). Esquemas especiais: hepatite B — dose dupla (40 μg) com verificação de anti-HBs (até 50% de não resposta com dose padrão). Hepatite A — risco de fulminante se infecção em fígado cirrótico. Herpes-zóster — Shingrix (recombinante) a partir de 19 anos; vacina viva contraindicada. A resposta vacinal é 30–50% menor em Child B/C. Pneumococo: PCV20 dose única." },
      { q: "Quais os riscos dos IBPs na cirrose e quando são justificados?", a: "Riscos: (1) maior incidência de PBE — supressão ácida facilita translocação bacteriana e altera microbiota; (2) maior risco de encefalopatia hepática — possivelmente por alteração da microbiota e aumento da amoniagênese. Indicações justificadas: úlcera documentada, DRGE erosiva, profilaxia pós-ligadura varicosa (curto prazo). O uso crônico sem indicação clara deve ser desprescrito. Armadilha comum: IBPs são amplamente prescritos mas potencialmente prejudiciais no cirrótico." },
      { q: "Cite os escores prognósticos da cirrose e a sobrevida por classe de Child-Pugh.", a: "Child-Pugh: A (5-6 pts) = 100% em 1 ano / 85% em 2 anos; B (7-9 pts) = 80% / 60%; C (10-15 pts) = 45% / 35%. Variáveis: bilirrubina, albumina, INR, ascite, encefalopatia. MELD: fórmula com bilirrubina, creatinina e INR — prediz mortalidade em 90 dias; MELD ≥21 = sobrevida mediana ≤6 meses. MELD 3.0 incorpora sódio, albumina e sexo (corrige disparidade para mulheres)." },
      { q: "Quais são as indicações para referência a centro de transplante hepático?", a: "MELD ≥15 (risco de mortalidade em lista justifica o risco cirúrgico), primeira descompensação (ascite, EH, sangramento varicoso — mesmo com MELD <15), CHC dentro dos critérios de Milão (nódulo único ≤5 cm ou até 3 nódulos ≤3 cm, sem invasão vascular), síndrome hepatopulmonar (PaO2 <80 mmHg), hipertensão portopulmonar (PAP média >35 mmHg), prurido intratável na colestase, EH recorrente refratária. A referência deve ser precoce." },
      { q: "Qual a fórmula do MELD e a mortalidade associada a cada faixa de pontuação?", a: "MELD = 3,78 × ln(bilirrubina) + 11,2 × ln(INR) + 9,57 × ln(creatinina) + 6,43. Escala 6–40 pontos. Mortalidade em 90 dias: MELD <10 = ~2%; 10–19 = ~6%; 20–29 = ~20%; 30–39 = ~50%; ≥40 = ~70%. É o sistema de alocação de órgãos na maioria dos países. O MELD ≥15 marca o ponto em que a mortalidade em lista justifica o risco cirúrgico do transplante." },
      { q: "O que o MELD 3.0 acrescenta ao MELD-Na e por que incorporou o sexo biológico?", a: "O MELD 3.0 (adotado nos EUA em 2022) incorpora sódio (hiponatremia dilucional = preditor independente de mortalidade), albumina (melhora discriminação) e sexo feminino (+1,33 pontos). A correção por sexo existe porque a creatinina é fisiologicamente mais baixa em mulheres (menor massa muscular), resultando em MELD subestimado para a mesma gravidade de doença. Isso gerava disparidade histórica na alocação de órgãos — mulheres recebiam menos transplantes apesar de doença igualmente grave." },
      { q: "Quais são os marcos prognósticos que separam os estágios evolutivos da cirrose?", a: "Compensada sem CSPH: sobrevida mediana >12 anos. Compensada com CSPH: taxa de descompensação ~5–7%/ano. Primeira descompensação: sobrevida mediana ~2 anos — divisão prognóstica central. MELD ≥21 ou Child ≥12: sobrevida ≤6 meses sem transplante. Ascite refratária: mediana ~6 meses. Hemorragia varicosa em descompensado: mortalidade 30 dias ~15–20%. A descompensação é o marcador mais importante, mais que qualquer escore isolado." },
      { q: "Quais sinais de alarme devem mudar a conduta no acompanhamento do cirrótico?", a: "(1) Primeiro episódio de ascite → referir a centro de transplante; (2) Ascite refratária → TIPS vs transplante; (3) EH recorrente (≥2 em 6 meses) → otimizar lactulose + rifaximina, investigar precipitantes; (4) MELD subindo >3 pontos em 3 meses → acelerar transplante; (5) Hiponatremia progressiva (Na <130 e caindo) → prognóstico muito reservado, urgência de transplante; (6) Lesão focal na USG → protocolo CHC com TC/RM multifásica; (7) Trombose de veia porta → avaliar anticoagulação caso a caso." },
      { q: "Qual o esquema de monitorização recomendado para o paciente com cirrose?", a: "USG hepática ± AFP: cada 6 meses (CHC). EDA: no diagnóstico, repetir 1–3 anos conforme achado. Laboratório (hemograma, hepatograma, função renal, coagulograma, Na): cada 3–6 meses na compensada, 1–3 meses na descompensada. Elastografia: anual. MELD: cada 3–6 meses. Avaliação nutricional: cada consulta (sarcopenia dobra mortalidade em lista). Densitometria óssea: basal e periódica (osteodistrofia hepática, especialmente em colestase crônica)." },
      { q: "Quais são as contraindicações absolutas ao transplante hepático?", a: "Sepse ativa não controlada, neoplasia extrahepática ativa, doença cardiopulmonar avançada irreversível, falta de suporte social/aderência, uso ativo de substâncias ilícitas, CHC além dos critérios de Milão (com exceções por downstaging). A hepatopatia alcoólica é a segunda indicação mais comum; a regra de 6 meses de abstinência está sendo revisada. Sobrevida pós-transplante: ~85% em 1 ano e ~70% em 5 anos — uma das cirurgias de transplante mais bem-sucedidas." },
      { q: "O INR está elevado em um cirrótico que precisa de paracentese. Deve-se corrigir com plasma fresco?", a: "NÃO para procedimentos de baixo risco (paracentese, toracocentese). O INR na cirrose não reflete risco hemorrágico porque há 'rebalanceamento hemostático' — déficit simultâneo de fatores pró-coagulantes E anticoagulantes (proteína C, S, antitrombina III). A correção com PFC é ineficaz (o fígado não sustenta os fatores infundidos) e potencialmente deletéria (sobrecarga volêmica). Testes viscoelásticos (TEG/ROTEM) avaliam melhor a hemostasia na cirrose." },
      { q: "Um colega afirma que o estudo de >26.000 pacientes comprova que carvedilol é superior ao propranolol. Que argumento você usaria?", a: "Trata-se de estudo observacional (banco de dados), não RCT. Embora tenha tamanho amostral substancial (RR 0,80 para morte, IC 0,69-0,92), existe risco de viés de indicação: pacientes que receberam carvedilol podem diferir sistematicamente dos que receberam propranolol (confundimento residual). Esse tipo de evidência é complementar, não substitutivo, de um RCT head-to-head — que não existe para essa comparação. A preferência pelo carvedilol é mecanisticamente sólida mas não tem evidência nível 1." },
      { q: "A amônia sérica de um paciente com EH grau 2 normalizou. Isso garante resolução da encefalopatia?", a: "NÃO. A amônia sérica tem baixa correlação com a gravidade clínica da EH — porque: (1) é apenas uma das neurotoxinas envolvidas (outras: manganês, mercaptanos, ácidos graxos de cadeia curta, falsos neurotransmissores); (2) o nível sérico não reflete a concentração cerebral; (3) técnica de coleta influencia o resultado. A normalização não confirma resolução, assim como amônia elevada não confirma EH ativa. Avaliação deve ser clínica (estado mental, asterixis, capacidade funcional)." },
      { q: "Os artigos do UpToDate são revisões sistemáticas? Qual o viés potencial?", a: "Não — são revisões narrativas de especialistas, com curadoria editorial de alta qualidade, mas sujeitas ao viés de seleção: o autor escolhe quais estudos citar e quais omitir. Recomendações graduadas seguem GRADE quando presentes, mas muitas são sem graduação formal. Diferentemente de uma revisão sistemática (critérios pré-definidos de inclusão/exclusão, busca exaustiva), a síntese depende da interpretação individual do revisor. Conflitos de interesse dos autores com a indústria farmacêutica (declarados) podem influenciar a ênfase dada a certas intervenções." },
      { q: "Explique a diferença entre desfecho substituto e desfecho clínico com exemplo da hepatologia.", a: "Desfecho substituto (surrogate): biomarcador usado como proxy — ex.: redução do HVPG com carvedilol. Desfecho clínico (hard endpoint): o que importa para o paciente — descompensação, morte, qualidade de vida. O PREDESCI é valioso porque mediu desfecho clínico (descompensação ou morte), não apenas substituto. Sempre questionar: o benefício no proxy se traduz em benefício clínico real? Redução do HVPG é biologicamente plausível, mas não garantida — e a maioria dos dados sobre carvedilol vem de desfechos substitutos." },
      { q: "A recomendação Baveno VII de iniciar BBNS sem EDA é baseada em que nível de evidência?", a: "Consenso de especialistas, não RCT de desfechos clínicos. Usa elastografia >20–25 kPa + plaquetas <150.000 como substitutos da medida direta do HVPG e da visualização endoscópica. É mecanisticamente lógica e praticamente conveniente (evita EDA), mas a validação prospectiva com desfechos duros (sangramento, morte) é limitada. Ilustra a tensão entre praticidade clínica e rigor de evidência — frequente em consensos. O clínico deve estar ciente de que está seguindo opinião de especialistas, não dados de RCT." },
      { q: "O que a falha do LIVERHOPE ensina sobre o desenho de ensaios clínicos em hepatologia?", a: "Lições: (1) A janela terapêutica importa — intervenções eficazes na compensada podem falhar na descompensada. (2) Mecanismo plausível não garante eficácia clínica. (3) 'Estudo negativo ≠ estudo inútil' — é confirmação mecanística do ponto de não retorno. (4) Tamanho amostral de 237 pacientes é modesto para desfechos compostos. (5) A maioria dos vieses estruturais da hepatologia envolve dados de populações ocidentais e conflitos de interesse extensos com a indústria (DAAs, terlipressina, agentes para MASLD). Flashcards elaborados a partir de: Goldberg E, Chopra S. Cirrhosis in adults. UpToDate 2025/2026." },
    ]
  },
  {
    id: "tuberculose",
    name: "Tuberculose",
    cards: [
      { q: "Qual é o mecanismo de transmissão da TB e por que partículas > 5 μm não causam infecção?", a: "A TB é transmitida por via aérea, através dos núcleos de Wells (1-5 μm), que contêm 1-3 bacilos e alcançam os alvéolos. Partículas maiores que 5 μm ficam retidas nas vias aéreas superiores (nariz, traqueia) pelo mecanismo mucociliar e não atingem o parênquima pulmonar onde a infecção se estabelece." },
      { q: "Quantas pessoas um paciente bacilífero infecta por ano e após quanto tempo de tratamento a transmissão diminui significativamente?", a: "10-15 pessoas/ano. A transmissão reduz-se significativamente após 15 dias de tratamento adequado, embora possa persistir enquanto houver baciloscopia positiva." },
      { q: "Qual a diferença entre o risco de progressão ILTB→TB em imunocompetentes e em PVHIV?", a: "Imunocompetentes: 10% ao longo da vida (5% nos primeiros 2 anos + 5% tardio). PVHIV: 10% ao ano — o HIV é o maior fator de risco isolado, transformando o risco de uma vida inteira em um risco anual." },
      { q: "Quais são as populações vulneráveis para TB no Brasil e suas razões de risco em relação à população geral?", a: "Pessoas em situação de rua (56×), PVHIV (28×), pessoas privadas de liberdade (28×), indígenas (3×). Essas razões justificam a busca ativa priorizada nessas populações. Fisiopatologia e mecanismos" },
      { q: "Quais são as duas características biológicas do M. tuberculosis que determinam as dificuldades terapêuticas?", a: "(1) Parede celular rica em lipídios (ácidos micólicos) → resistência natural à maioria dos antibióticos, alvo de isoniazida e etambutol. (2) Crescimento lento (tempo de duplicação 12-20h) → tratamento de meses, não dias; cultura demora 14-30 dias em meio sólido." },
      { q: "Por que a PT/PPD e o IGRA demoram 2-10 semanas para positivar após a infecção?", a: "Porque medem a resposta imune adaptativa (Th1) ao M. tuberculosis, que leva 2-10 semanas para se desenvolver após a primoinfecção — é a \"janela imunológica\". Por isso, contatos recentes com PT negativa devem ser retestados em 8 semanas." },
      { q: "Cite as três populações bacilares, seus ambientes, e qual fármaco é mais eficaz contra cada uma.", a: "(A) Cavitária/extracelular — pH neutro, crescimento rápido — isoniazida (melhor bactericida). (B) Caseosa/granuloma — pH ácido, crescimento intermitente — rifampicina Tuberculose — Flashcards | p. 2 (melhor esterilizante). (C) Intramacrofágica — pH ácido intracelular, crescimento lento — pirazinamida (ativa exclusivamente em pH ácido)." },
      { q: "Por que a pirazinamida é usada apenas nos 2 primeiros meses do tratamento?", a: "Porque a pirazinamida só é ativa em pH ácido (meio intracelular e granuloma). Nos primeiros meses há máxima inflamação e acidificação do meio — é quando as populações B e C são mais acessíveis. Após a fase intensiva, com redução da carga bacilar e da inflamação, a pirazinamida perde eficácia relativa, e a atividade esterilizante passa a depender predominantemente da rifampicina." },
      { q: "Explique por que a associação de fármacos previne resistência, usando a proporção de mutantes naturais.", a: "Uma cavidade com 10⁸ bacilos conterá ~1 mutante resistente a R (proporção 1:10⁷-10⁸) e ~100-1.000 resistentes a H (1:10⁵-10⁶). Em monoterapia com H, os mutantes resistentes seriam selecionados. Com R+H+E, a probabilidade de resistência simultânea é 1:10⁷ × 1:10⁵ × 1:10⁵ = 1:10¹⁷ — virtualmente zero em qualquer população bacilar viável." },
      { q: "Quais são os três objetivos terapêuticos do tratamento da TB e qual fase do esquema atende cada um?", a: "(1) Atividade bactericida precoce (fase intensiva): reduzir população A → negativação do escarro. (2) Prevenção de resistência (fase intensiva): 4 fármacos cobrem mutantes naturais. (3) Atividade esterilizante (manutenção): eliminar populações B e C → prevenir recidiva. A rifampicina é essencial nas duas fases." },
      { q: "Por que a rifampicina é considerada o fármaco mais importante do esquema, apesar de a isoniazida ter maior atividade bactericida?", a: "Porque a rifampicina é o melhor esterilizante — elimina as populações B e C responsáveis por recidiva. Regimes sem rifampicina têm taxas de recidiva muito maiores e necessitam de tratamentos mais longos (12-18 meses). A isoniazida mata mais bacilos na fase inicial, mas a rifampicina é quem garante a cura definitiva. Diagnóstico" },
      { q: "Compare sensibilidade, tempo de resultado e informação adicional entre baciloscopia e TRM-TB.", a: "Baciloscopia: sensibilidade 60-80%, resultado em 24-48h, não detecta resistência. TRM-TB (GeneXpert): sensibilidade ~90% em escarro de adultos, resultado em 2 horas, detecta resistência à rifampicina (sens. 95%). O TRM-TB é preferencial como teste inicial, mas não substitui a cultura para teste de sensibilidade completo." },
      { q: "Por que o TRM-TB não serve para controle de tratamento?", a: "Porque o TRM-TB detecta DNA de M. tuberculosis por PCR, incluindo DNA de bacilos mortos. Pode permanecer positivo por semanas a meses após o início do tratamento eficaz, sem significar falência. Para controle, usa-se baciloscopia (detecta bacilos álcool-ácido resistentes íntegros) e cultura (detecta bacilos viáveis)." },
      { q: "Qual exame tem a maior acurácia para diagnóstico de TB pleural e por quê?", a: "A biópsia pleural combinada com cultura do fragmento (sensibilidade > 90%). O ADA > 40 U/L no líquido pleural tem sensibilidade de 93% e especificidade de 97%, sendo o marcador bioquímico mais útil. A baciloscopia do líquido pleural é praticamente inútil (sensibilidade ~5%)." },
      { q: "Qual a principal diferença prática entre PT/PPD e IGRA que define a escolha entre eles?", a: "A PT tem reação cruzada com BCG (falso-positivos em vacinados), enquanto o IGRA usa antígenos ESAT-6/CFP-10 ausentes no BCG (sem reação cruzada). Em vacinados com BCG (maioria da população brasileira), um IGRA positivo é mais confiável. Entretanto, a PT tem ampla disponibilidade no SUS, enquanto o IGRA é limitado." },
      { q: "Em PVHIV com CD4 < 200, quais características clínicas e radiológicas dificultam o diagnóstico de TB?", a: "A imunossupressão grave causa apresentação atípica: ausência de Tuberculose — Flashcards | p. 3 cavitação ao Rx (sem formação adequada de granuloma), escarro paucibacilar (baciloscopia frequentemente negativa), predomínio de formas extrapulmonares, Rx normal em até 10%. O TRM-TB e a cultura ganham importância ainda maior." },
      { q: "Quais são os achados típicos do LCR na TB meningoencefálica?", a: "Proteínas elevadas (100-500 mg/dL), glicose baixa (< 40 mg/dL ou < 50% da glicemia), pleocitose linfocítica (100-500 células). Baciloscopia do LCR positiva em apenas 10-15%, cultura em 50-75%, TRM-TB ~60%. O par craniano VI é o mais frequentemente acometido." },
      { q: "Cite três diagnósticos diferenciais de TB pulmonar pós-primária e a pista para distingui-los.", a: "(1) Pneumonia comunitária: responde a antibióticos em 48-72h; TB não responde. (2) Câncer de pulmão: nódulo solitário sem sintomas constitucionais; TC e biópsia definem. (3) Paracoccidioidomicose: lesões mucocutâneas associadas, Rx em \"asa de borboleta\", microscopia com leveduras multigemulantes. Tratamento — esquemas e condições especiais" },
      { q: "Qual a posologia do Esquema Básico adulto (> 50 kg) na fase intensiva e na fase de manutenção?", a: "Fase intensiva (2 meses): RHZE — R 600mg + H 300mg + Z 1.600mg + E 1.100mg, dose fixa combinada, diária. Fase de manutenção (4 meses): RH — R 600mg + H 300mg, dose fixa combinada, diária." },
      { q: "Quais são os critérios para usar o esquema encurtado de 4 meses (SHINE) em crianças?", a: "(1) Idade 3 meses a 16 anos. (2) TB pulmonar não grave: sem cavitação, sem doença bilateral extensa, sem TB miliar, sem formas extrapulmonares graves. (3) Em adolescentes 10-16 anos: adicionalmente, baciloscopia/TRM-TB negativo ou não realizado. Se qualquer critério não for atendido, manter esquema convencional de 6 meses." },
      { q: "Por que a TB meningoencefálica é tratada por 12 meses e não 6?", a: "Dois motivos mecanísticos: (1) a barreira hematoencefálica limita a penetração de fármacos no SNC, reduzindo as concentrações esterilizantes; (2) os bacilos no SNC estão predominantemente em populações B e C (intramacrofágicas), com metabolismo lento, exigindo maior tempo de exposição à rifampicina para esterilização." },
      { q: "Qual a ordem de reintrodução de fármacos após hepatotoxicidade grave durante o Esquema Básico?", a: "Após normalização do hepatograma: RE (3-7 dias) → RE+H (3-7 dias) → RE+HZ. Se intolerância ao reintroduzir Z: manter REH por 9 meses. Se intolerância a H: substituir por levofloxacino. A lógica é reintroduzir primeiro os menos hepatotóxicos (R e E), depois H, e por último Z (o principal hepatotóxico)." },
      { q: "Explique por que a rifampicina reduz o efeito de hipoglicemiantes orais no paciente diabético.", a: "A rifampicina é potente indutora do CYP450 (especialmente CYP3A4). Sulfonilureias e meglitinidas são metabolizadas por essa via. A indução enzimática acelera o metabolismo desses fármacos, reduzindo seus níveis séricos e comprometendo o controle glicêmico. Conduta: monitorar glicemia frequentemente e considerar insulinoterapia durante o tratamento da TB." },
      { q: "Qual a indicação de rifabutina no tratamento de TB em PVHIV e qual sua principal limitação?", a: "Indicada quando é necessário manter IP (inibidores de protease) ou dolutegravir no esquema ARV, pois a rifabutina tem menor indução do CYP450 que a rifampicina. Esquema: 2Rfb HZE / 4Rfb H. Principal limitação: a rifabutina não permite formulação em dose fixa combinada, resultando em mais comprimidos e menor adesão." },
      { q: "Quando iniciar TARV em paciente com TB meningoencefálica e por quê?", a: "Somente 2 meses após o início do tratamento da TB. Motivo: o TARV precoce não demonstrou benefício em mortalidade nessa localização (Török et al., 2011) e AUMENTA reações adversas (SIR com edema Tuberculose — Flashcards | p. 4 cerebral, hipertensão intracraniana). Na TB meningoencefálica, o risco de SIR no SNC é potencialmente fatal." },
      { q: "Qual a diferença entre o manejo da SIR leve-moderada e grave?", a: "Leve-moderada: manter TARV + tratamento da TB + AINEs/sintomáticos. Grave (risco de vida): acrescentar corticosteroide (prednisona 1 mg/kg/dia por 2-4 semanas com desmame). Em NENHUM caso suspender TARV ou tratamento da TB — a suspensão piora o prognóstico de ambas as condições. Tratamento da ILTB" },
      { q: "Compare os quatro esquemas de tratamento da ILTB em termos de duração, número de doses e principal vantagem de cada um.", a: "6H: 6 meses/180 doses — mais estudado e disponível. 9H: 9 meses/270 doses — maior proteção (~90% vs ~69% do 6H). 3HP: 3 meses/12 doses semanais — melhor adesão, eficácia comparável ao 9H. 4R: 4 meses/120 doses — menor hepatotoxicidade. A escolha depende do perfil de adesão, risco de hepatotoxicidade e uso concomitante de ARV." },
      { q: "Por que o esquema 4R é contraindicado em PVHIV usando inibidores de protease ou dolutegravir?", a: "Porque a rifampicina (R) induz intensamente o CYP3A4, reduzindo os níveis séricos de IP em até 90% e de DTG em ~50%, comprometendo a supressão viral e favorecendo resistência do HIV. Nesses casos, usa-se isoniazida (6H ou 9H) ou 3HP (verificar interações da rifapentina)." },
      { q: "Descreva o fluxograma de quimioprofilaxia primária em recém-nascidos coabitantes de caso de TB bacilífera.", a: "(1) NÃO vacinar BCG ao nascer. (2) Iniciar H (5-10 mg/kg) ou R (10 mg/kg) por 3 meses. (3) Realizar PT após os 3 meses. (4a) Se PT ≥ 5mm: completar tratamento de ILTB (H: + 3 meses; R: + 1 mês) e NÃO vacinar BCG. (4b) Se PT < 5mm: suspender e vacinar BCG." },
      { q: "Qual o critério de abandono do tratamento de ILTB com isoniazida e com rifampicina?", a: "Isoniazida: sem medicação por ≥ 3 meses consecutivos. Rifampicina: sem medicação por ≥ 2 meses consecutivos. A diferença reflete a menor duração total do esquema com R (4 meses vs. 6-9 meses com H). Reações adversas e interações" },
      { q: "Qual a explicação mecanística para a artralgia e hiperuricemia causadas pela pirazinamida?", a: "A pirazinamida (e seu metabólito, o ácido pirazinóico) bloqueia a secreção tubular renal de ácido úrico → hiperuricemia → artralgia/gota. É a mesma via afetada pelo ácido láctico no exercício intenso. Conduta: AINEs, dieta, alopurinol se gota aguda. Não é necessário suspender Z por artralgia isolada." },
      { q: "Cite três fármacos cujos níveis séricos são significativamente reduzidos pela rifampicina e a consequência clínica de cada interação.", a: "(1) IP do HIV: ↓ até 90% → supressão viral inadequada → resistência do HIV. (2) Warfarina: ↓ efeito anticoagulante → risco tromboembólico; monitorar INR e aumentar dose. (3) Contraceptivos orais: ↓ eficácia → gestação não planejada; usar método de barreira adicional." },
      { q: "Qual o fármaco anti-TB que causa surdez fetal irreversível e em que situação clínica esse risco é particularmente relevante?", a: "Estreptomicina (e amicacina) — aminoglicosídeos que causam lesão irreversível do VIII par craniano no feto. Relevante na gestação: esses fármacos são classificados como categoria D (contraindicados). O Esquema Básico (RHZE) é seguro na gestação. Tuberculose — Flashcards | p. 5" },
      { q: "Diferencie reação adversa menor e maior ao Esquema Básico com um exemplo de cada e a conduta.", a: "Menor: náuseas/vômitos (principalmente por R e Z) — manter esquema, tomar após refeição, usar antieméticos. Maior: hepatotoxicidade (TGO/TGP ≥ 3× LSN com sintomas) — suspender TODOS os fármacos, investigar, reintroduzir sequencialmente após normalização. Reações menores ocorrem em ~20-30% dos pacientes; maiores em 3-8%." },
      { q: "Qual o risco da neurite óptica causada por etambutol e por que esse fármaco não é usado em crianças < 10 anos?", a: "O etambutol causa neurite óptica dose-dependente (perda de acuidade visual e discriminação de cores, geralmente reversível se detectada precocemente). Em crianças < 10 anos, a monitorização visual fidedigna é difícil (exame de acuidade visual e discriminação de cores requer cooperação), tornando a detecção precoce impossível — daí a exclusão do E no esquema pediátrico. Seguimento e vigilância" },
      { q: "O que significa uma baciloscopia positiva ao 2º mês de tratamento e qual a conduta?", a: "Pode significar: (1) bacilos mortos ainda sendo eliminados (baciloscopia detecta BAAR íntegros, não necessariamente viáveis) — mais comum; ou (2) falência terapêutica (resistência, má absorção, adesão irregular). Conduta: solicitar CULTURA + TS (padrão-ouro para viabilidade), intensificar supervisão de adesão (TDO), e avaliar necessidade de ajuste terapêutico conforme resultado." },
      { q: "Por que o TDO reduz o abandono de ~17% para ~5% e qual sua importância mecanística na prevenção de resistência?", a: "O TDO garante que o paciente tome a medicação conforme prescrito, eliminando o principal fator de abandono (melhora clínica leva o paciente a se sentir \"curado\" antes do fim do tratamento). Mecanisticamente, a interrupção precoce elimina a população A (bactericida), mas preserva as populações B e C (persistentes) — que podem reativar com mutantes selecionados pela exposição subótima aos fármacos." },
      { q: "Cite os critérios de encerramento como cura no tratamento da TB.", a: "(1) Completar o esquema terapêutico (todas as doses dentro do prazo). (2) Pelo menos duas baciloscopias negativas — uma durante o acompanhamento e outra ao final. (3) Melhora clínica e radiológica. Na prática, o critério mais importante é a completude do tratamento, pois pacientes paucibacilares podem não ter baciloscopia para positivar. Raciocínio crítico e armadilhas" },
      { q: "Qual a principal limitação do estudo SHINE para a aplicação do esquema de 4 meses em adolescentes brasileiros?", a: "O SHINE incluiu poucos adolescentes (maioria < 5 anos) e, nessa faixa, exigiu baciloscopia/TRM-TB negativo para inclusão. A aplicação em adolescentes 10-16 anos é restrita a casos com baciloscopia negativa, sem cavitação. Adolescentes com baciloscopia positiva ou cavitação mantêm esquema de 6 meses — a evidência de não-inferioridade não se aplica a esses pacientes." },
      { q: "Por que a silicose aumenta o risco de TB em 30 vezes e qual a implicação clínica?", a: "O quartzo (SiO₂) inalado é fagocitado por macrófagos alveolares e causa sua morte por lise lisossômica. Isso libera enzimas proteolíticas que perpetuam a inflamação e comprometem a capacidade microbicida — exatamente a defesa que contém o M. tuberculosis no granuloma. Implicação: todo silicótico deve ser rastreado para ILTB (PT ou IGRA), e o limiar para tratamento é mais baixo (PT ≥ 10mm)." },
      { q: "Se um paciente com TB pleural tem baciloscopia de escarro negativa, isso exclui TB?", a: "Não. A TB pleural é tipicamente paucibacilar — a baciloscopia do líquido pleural é positiva em apenas ~5% e a do escarro pode ser negativa mesmo com TB pulmonar concomitante. O Tuberculose — Flashcards | p. 6 diagnóstico depende de ADA > 40 U/L (sens. 93%, esp. 97%) e/ou biópsia pleural (granuloma caseoso 70-80%). Solicitar cultura do líquido pleural e do fragmento de biópsia." },
      { q: "Por que desfechos substitutos (como negativação da baciloscopia ao 2º mês) podem ser enganosos como preditores de cura?", a: "A negativação da baciloscopia ao 2º mês reflete a eliminação da população A (cavitária), mas NÃO informa sobre as populações B e C (persistentes). Um paciente pode negativar rapidamente e ainda ter bacilos dormentes/persistentes que causarão recidiva se o tratamento for encurtado. A cura depende da atividade esterilizante (R + Z), que age sobre populações não detectáveis pela baciloscopia." },
      { q: "Qual o paradoxo clínico da SIR e como diferenciá-la de falência terapêutica?", a: "Na SIR, o paciente PIORA (febre, linfadenomegalia, infiltrado pulmonar) apesar de estar recebendo tratamento eficaz — é a recuperação imune pelo TARV que gera resposta inflamatória exagerada. Na falência, a piora se acompanha de baciloscopia persistentemente positiva e/ou resistência detectada no TS. A chave é a cultura: na SIR, a cultura é negativa ou mostra queda de UFC; na falência, permanece positiva." },
      { q: "Cite dois vieses estruturais do campo de pesquisa em TB que afetam a interpretação das evidências.", a: "(1) Viés de generalização: a maioria dos RCTs é conduzida em países de alta carga (Índia, África subsaariana) com perfil epidemiológico diferente do Brasil (ex.: prevalência de HIV, acesso a diagnóstico, cepas circulantes). (2) Subrepresentação de populações vulneráveis nos ensaios: pessoas em situação de rua, usuários de drogas e privados de liberdade — justamente os mais afetados — são pouco incluídos em RCTs, limitando a extrapolação dos resultados. Conceitos integrativos" },
      { q: "Explique por que tratar a ILTB é essencial para o controle epidemiológico da TB, usando o conceito de \"reservatório\".", a: "Os ~1,8 bilhão de infectados mundialmente constituem o \"reservatório\" de onde emergem os ~10 milhões de casos anuais. Tratar apenas os doentes (TB ativa) interrompe a transmissão imediata, mas não esvazia o reservatório — 90% dos infectados podem reativar décadas depois. Sem tratamento da ILTB, novos casos continuam surgindo independentemente de quanto se trate os doentes." },
      { q: "Construa a cadeia lógica: mecanismo de ação da pirazinamida → pH ácido → população-alvo → fase do tratamento → objetivo terapêutico.", a: "Pirazinamida é um pró-fármaco convertido em ácido pirazinóico pela enzima pirazinamidase → ativa apenas em pH ácido (intracelular e caseo) → age principalmente sobre populações B (caseosa) e C (intramacrofágica), que estão em meio ácido → usada na fase intensiva (primeiros 2 meses), quando a inflamação é máxima e o meio é mais acidificado → objetivo: atividade esterilizante (matar bacilos persistentes e prevenir recidiva)." },
      { q: "Por que o esquema 2RHZE/4RH usa 4 fármacos na fase intensiva e apenas 2 na manutenção?", a: "Na fase intensiva, a carga bacilar é máxima (10⁷-10⁹ na população A) → o risco de seleção de mutantes resistentes é alto → necessidade de 4 fármacos para cobrir todos os mutantes naturais. Na fase de manutenção, a carga já foi drasticamente reduzida (negativação do escarro) → a probabilidade de resistência com apenas R+H é baixa → e Z e E já cumpriram seus papéis (Z como esterilizante nos 2 primeiros meses; E como protetor contra resistência)." },
      { q: "Qual a diferença entre recidiva, reinfecção e falência no contexto da TB, e por que a distinção importa?", a: "Recidiva: TB que retorna após tratamento completo e cura, por reativação de bacilos persistentes (falha esterilizante). Reinfecção: nova infecção por exposição a um novo caso, com cepa potencialmente diferente. Falência: tratamento em curso sem melhora (baciloscopia positiva ao 4º-5º mês, ou positiva por 2 meses consecutivos após negativação). A distinção importa porque: recidiva e reinfecção repetem o Esquema Básico (se sensível); falência Tuberculose — Flashcards | p. 7 sugere resistência → encaminhar para esquema especial." },
      { q: "Monte o raciocínio para decidir entre PT ≥ 5mm e PT ≥ 10mm como ponto de corte para tratar ILTB.", a: "O corte mais baixo (≥ 5mm) é usado em grupos com maior risco de progressão (PVHIV, contatos, imunossuprimidos) — o benefício do tratamento é maior e supera os riscos. O corte ≥ 10mm é para grupos com risco intermediário (profissionais de saúde, silicóticos, diabéticos) — o benefício existe, mas o risco de hepatotoxicidade do tratamento precisa ser ponderado. A lógica é: quanto maior o risco de adoecimento, menor o corte para tratar." },
      { q: "Qual a relação entre a indução do CYP450 pela rifampicina e o conceito de ajuste terapêutico na coinfecção TB-HIV?", a: "A rifampicina induz intensamente o CYP3A4, acelerando o metabolismo de IP (~90% de redução) e DTG (~50%). Se os níveis de ARV caírem abaixo do limiar terapêutico, o HIV replica com supressão parcial → seleção de mutantes resistentes. Soluções: (1) usar EFV (menos afetado); (2) usar rifabutina (menor indução); (3) duplicar a dose de DTG (50mg 2×/dia com R). A interação é bidirecional: a escolha do ARV é constrangida pelo anti-TB e vice-versa." },
      { q: "Por que a meta de examinar ≥ 90% dos contatos é tão importante para o controle da TB?", a: "Porque os contatos recentes de caso bacilífero são a população com maior probabilidade de estar infectada (30-50% dos contatos domiciliares) e maior risco de progressão (nos primeiros 2 anos). Identificá-los e tratar a ILTB antes que adoeçam é a ação preventiva com maior impacto — cada caso prevenido interrompe uma futura cadeia de transmissão." },
      { q: "Qual a importância clínica da fórmula de Cockcroft-Gault no manejo da TB em nefropatas?", a: "A fórmula estima o clearance de creatinina: [(140 - idade) × peso] / [72 × creatinina sérica] (× 0,85 em mulheres). Se ClCr < 30 mL/min, fármacos de excreção renal (etambutol, pirazinamida, aminoglicosídeos) precisam de ajuste de dose e frequência (geralmente 3×/semana em vez de diária). Toda medicação deve ser tomada APÓS a diálise para evitar remoção do fármaco." },
      { q: "Explique o racional da corticoterapia adjuvante na TB meningoencefálica.", a: "A mortalidade na TB meningoencefálica é de 20-50%, em grande parte por edema cerebral e processo inflamatório meníngeo intenso. Os corticoides (dexametasona ou prednisona) reduzem essa inflamação, diminuem o edema cerebral e a hipertensão intracraniana. Meta-análise de Prasad et al. demonstrou redução de mortalidade em ~25% com corticoterapia adjuvante — uma das poucas indicações de corticoide com benefício comprovado em doença infecciosa." },
      { q: "Um colega afirma que o esquema de 4 meses (SHINE) pode ser usado em qualquer criança com TB. Construa o contra-argumento.", a: "O SHINE demonstrou não-inferioridade apenas em TB pulmonar NÃO GRAVE (sem cavitação, sem bilateral extensa, sem miliar, sem extrapulmonar grave) e em crianças HIV-negativas ou estáveis em TARV. Crianças com TB grave, cavitação, formas extrapulmonares (meningoencefálica, osteoarticular, miliar) ou imunossupressão descontrolada NÃO foram incluídas no estudo — não há evidência de que 4 meses seja suficiente nesses cenários, onde a carga bacilar é maior e/ou a penetração dos fármacos é limitada." },
      { q: "Qual a diferença entre a classificação de segurança na gestação \"A\" (rifampicina) e \"B\" (pirazinamida)?", a: "Categoria A: estudos controlados em humanas demonstraram ausência de risco fetal — a rifampicina tem dados extensos de segurança em gestantes. Categoria B: estudos em animais não mostraram risco, mas não há estudos controlados em humanas — a pirazinamida é \"presumivelmente segura\" por extrapolação de dados animais. Apesar da diferença, ambas são consideradas seguras para uso na gestação." },
      { q: "Por que o abandono precoce do tratamento (aos 2-3 meses) é mecanisticamente diferente do abandono tardio (aos 5 meses)?", a: "Abandono aos 2-3 meses: a fase intensiva pode ter eliminado a população A (bactericida), mas as populações B e C estão intactas → alto Tuberculose — Flashcards | p. 8 risco de recidiva em meses a anos, possivelmente com resistência adquirida. Abandono aos 5 meses: a fase intensiva FOI completada e grande parte da manutenção também → as populações B e C foram parcialmente eliminadas → o risco de recidiva existe, mas é menor. Em ambos, o paciente retorna ao Esquema Básico." },
      { q: "Qual a implicação prática de saber que a cultura em MGIT dá resultado em 5-12 dias vs. 14-30 dias em Löwenstein-Jensen?", a: "O MGIT (sistema automatizado em meio líquido) detecta crescimento bacilar por fluorescência 2-3× mais rápido que o LJ. Na prática, isso permite: (1) confirmação diagnóstica mais rápida em casos paucibacilares; (2) resultado de teste de sensibilidade mais precoce para orientar ajuste terapêutico; (3) menor tempo de espera em casos suspeitos de resistência. O MGIT é preferível quando disponível, mas é mais caro e menos acessível na rede básica." },
      { q: "Diferencie \"conversão\" de \"viragem\" da PT e explique por que a viragem indica tratamento de ILTB.", a: "Conversão e viragem são usados de forma intercambiável para descrever a mudança de PT negativa para positiva (aumento ≥ 10mm em relação à PT anterior), indicando infecção recente pelo M. tuberculosis. Isso importa porque os primeiros 2 anos após a infecção são o período de maior risco de progressão para TB ativa (5% de risco) — o tratamento de ILTB nesse momento tem o maior benefício preventivo." },
      { q: "Por que a doença renal crônica em diálise confere risco 10-25× maior de TB?", a: "A uremia crônica causa disfunção imune abrangente: redução da ativação de linfócitos T, comprometimento da fagocitose macrofágica, diminuição de citocinas Th1 (IFN-γ, TNF-α), e desnutrição crônica. A diálise adiciona exposição frequente a ambiente hospitalar e procedimentos invasivos. Implicação clínica: rastrear ILTB em todo paciente em diálise e tratar com limiar baixo (PT ≥ 10mm)." },
      { q: "Qual a importância da dose fixa combinada (DFC) no esquema 2RHZE/4RH e o que se perde quando se usa rifabutina?", a: "A DFC reúne 2-4 fármacos em um único comprimido calibrado por faixa de peso. Vantagens: simplifica a prescrição, reduz erro de dose, impede monoterapia acidental (se o paciente decidir tomar \"apenas um comprimido\") e melhora a adesão. Com rifabutina, não existe DFC — o paciente precisa tomar cada fármaco separadamente, aumentando o número de comprimidos e o risco de erro e abandono." },
    ]
  },
  {
    id: "pancreatite",
    name: "Pancreatite Aguda",
    cards: [
      { q: "Quais são os três critérios diagnósticos da pancreatite aguda e quantos são necessários?", a: "Dois de três: (1) dor abdominal característica (epigástrica, intensa, irradiada para dorso); (2) lipase ou amilase ≥ 3× o limite superior da normalidade; (3) achados característicos em exame de imagem (TC, RM ou USG). A imagem NÃO é necessária para o diagnóstico quando os dois primeiros critérios estão presentes." },
      { q: "Por que a lipase é preferível à amilase no diagnóstico de PA?", a: "Porque tem: (1) maior sensibilidade (82-100% vs. 67-83%); (2) maior especificidade (sensibilidade a fontes extra-pancreáticas é menor); (3) elevação mais prolongada (8-14 dias vs. 3-5 dias para amilase), reduzindo falsos-negativos em apresentações tardias. A amilase pode normalizar antes da avaliação, levando a diagnóstico perdido." },
      { q: "Por que a magnitude da elevação da lipase NÃO se correlaciona com a gravidade da PA?", a: "Porque a lipase reflete a quantidade de enzima liberada para a corrente sanguínea, que depende do tamanho do pâncreas, da permeabilidade ductal e do clearance renal — não da extensão da inflamação/necrose. Uma PA leve edematosa pode ter lipase > 10.000, enquanto uma PA necrosante grave pode ter lipase apenas 3-4× o normal. A gravidade é determinada pela resposta inflamatória sistêmica (SIRS) e pela falência orgânica (Marshall), não pelas enzimas." },
      { q: "Qual é o mecanismo central da fisiopatologia da PA?", a: "Ativação prematura intrapancreática do tripsinogênio em tripsina, dentro das células acinares. A tripsina ativa outras pró-enzimas (elastase, fosfolipase A2, quimiotripsina) em cascata, causando autodigestão do parênquima pancreático. O gatilho varia por etiologia: obstrução ductal (biliar), toxicidade direta (álcool, hipertrigliceridemia), mas o mecanismo final comum é o mesmo. Pancreatite Aguda — Flashcards | Página 3" },
      { q: "Como a fisiopatologia da PA explica por que nenhuma terapia farmacológica dirigida funcionou?", a: "Porque a cascata inflamatória é redundante e autossustentada: após a ativação inicial da tripsina, múltiplas vias amplificam o dano (NF-κB, TNF-α, IL-1, IL-6, PAF, espécies reativas de oxigênio) simultaneamente. Bloquear uma via isolada (anti-TNF, lexipafant anti-PAF, gabexato anti-protease, somatostatina anti-secretora) não interrompe as demais. Todos falharam em RCTs. A terapia permanece, portanto, de suporte." },
      { q: "Qual é a tríade de Charcot e quando ela indica CPRE urgente na PA?", a: "Dor no hipocôndrio direito + febre + icterícia. Quando presente no contexto de PA biliar, indica colangite concomitante e é indicação de CPRE urgente (< 24h). Sem colangite, a CPRE NÃO é indicada rotineiramente — deve-se confirmar a persistência do cálculo com CPRM ou EUS antes." },
      { q: "Qual é o significado do sinal de Grey Turner e do sinal de Cullen na PA?", a: "Equimose nos flancos (Grey Turner) e periumbilical (Cullen) indicam hemorragia retroperitoneal dissecando os planos fasciais. São sinais tardios (surgem em 1-2% dos casos, geralmente após 48-72h) e, quando presentes, indicam PA grave com necrose hemorrágica. Não são patognomônicos de PA — podem ocorrer em qualquer hemorragia retroperitoneal." },
      { q: "Qual é o valor preditivo de ALT > 3× o limite superior da normalidade na PA?", a: "VPP de ~95% para etiologia biliar. É a pista laboratorial mais útil para identificar causa biliar. Entretanto, o VPN é baixo — ALT normal não exclui etiologia biliar (o cálculo pode ter migrado antes da coleta). Deve-se solicitar USG abdominal em todo paciente com PA, independentemente do ALT. SEÇÃO: CLASSIFICAÇÃO E GRAVIDADE Pancreatite Aguda — Flashcards | Página 4" },
      { q: "Qual é a diferença entre PA edematosa intersticial e PA necrosante na classificação de Atlanta?", a: "A PA edematosa intersticial (85% dos casos) apresenta inflamação difusa do pâncreas COM realce ao contraste na TC (pâncreas viável), sem áreas de necrose. A PA necrosante (15%) apresenta áreas SEM realce (necrose do parênquima e/ou gordura peripancreática). A necrose pode ser estéril ou infectada — esta distinção determina o manejo subsequente." },
      { q: "Explique a diferença entre falência orgânica transitória e persistente e por que essa distinção é crucial.", a: "Transitória: falência orgânica (Marshall ≥ 2) que se resolve em < 48h. Classifica como PA moderadamente grave, mortalidade ~5%. Persistente: falência orgânica > 48h. Classifica como PA grave, mortalidade ~35%. A distinção é crucial porque determina nível de cuidado (enfermaria vs. UTI), intensidade de monitorização, e expectativa prognóstica. Um paciente com SIRS e Marshall = 2 que normaliza em 24h tem prognóstico fundamentalmente diferente de um que mantém Marshall ≥ 2 por > 48h." },
      { q: "Quais são os quatro tipos de coleções líquidas na classificação de Atlanta revisada e como diferenciá-los?", a: "Antes de 4 semanas: (1) APFC (Acute Peripancreatic Fluid Collection) — na PA edematosa, sem parede, homogênea; (2) ANC (Acute Necrotic Collection) — na PA necrosante, sem parede, heterogênea com debris. Após 4 semanas: (3) Pseudocisto — APFC que se encapsulou, parede definida, conteúdo líquido homogêneo; (4) WON (Walled-Off Necrosis) — ANC que se encapsulou, parede definida, conteúdo heterogêneo com material sólido. A distinção é clínica: pseudocisto pode ser drenado com stent; WON frequentemente requer necrosectomia endoscópica." },
      { q: "O que é o escore de Marshall modificado e como se define falência orgânica?", a: "Escore que avalia três sistemas: respiratório (PaO₂/FiO₂), renal (creatinina) e cardiovascular (PAS). Cada sistema é pontuado de 0 a 4. Falência orgânica = escore ≥ 2 em qualquer sistema. Valores para escore 2: PaO₂/FiO₂ ≤ 300, creatinina 1,9-3,6 mg/dL, PAS < 90 não responsiva a fluidos. Deve ser calculado seriadamente a cada 24-48h nas primeiras 72h. Pancreatite Aguda — Flashcards | Página 5" },
      { q: "O que é o BISAP e quais são seus 5 componentes?", a: "Bedside Index for Severity in Acute Pancreatitis. B = BUN > 25 mg/dL; I = Impaired mental status (alteração da consciência); S = SIRS (≥ 2 critérios); A = Age > 60 anos; P = Pleural effusion (derrame pleural na imagem). Cada item = 1 ponto. BISAP ≥ 3 prediz mortalidade > 5%. Vantagem: simples, disponível nas primeiras 24h." },
      { q: "Por que a SIRS é considerada o melhor instrumento de triagem inicial na PA?", a: "Porque combina: (1) disponibilidade imediata (dados vitais + hemograma); (2) alta sensibilidade (~85% para PA grave); (3) pode ser repetida a cada avaliação; (4) a persistência de SIRS em 48h é um dos melhores preditores de falência orgânica. SIRS presente na admissão + SIRS persistente em 48h → risco alto de PA grave. Não exige cálculos complexos como APACHE II ou Ranson." },
      { q: "Quais são as limitações do CTSI/Balthazar como preditor de gravidade?", a: "Três limitações principais: (1) TC precoce (< 72h) pode subestimar a necrose — o timing ideal é 72-96h; (2) avalia morfologia local, não gravidade sistêmica — um paciente pode ter CTSI alto (necrose extensa) sem falência orgânica, ou CTSI baixo com falência orgânica grave; (3) exige TC com contraste, que pode ser contraindicada em pacientes com LRA (nefrotoxicidade do contraste)." },
      { q: "Qual é o papel da hemoconcentração (hematócrito) na predição de gravidade da PA?", a: "Hematócrito elevado na admissão (> 44%) ou que não diminui em 24h sugere hemoconcentração por terceiro espaçamento e prediz PA necrosante. Entretanto, sensibilidade limitada (~60%) — pacientes com hemorragia retroperitoneal podem ter Ht falsamente baixo. ACG 2024: Ht e BUN elevados na admissão são 'bandeiras vermelhas' que indicam necessidade de monitorização intensiva e ressuscitação agressiva inicial. Devem ser interpretados junto com SIRS, não isoladamente. SEÇÃO: TRATAMENTO Pancreatite Aguda — Flashcards | Página 6" },
      { q: "Por que o Ringer Lactato é preferido ao SF 0,9% na ressuscitação volêmica da PA?", a: "Dois motivos: (1) o lactato do RL tem efeito anti-inflamatório (inibição de NF-κB em estudos experimentais); (2) o SF 0,9% causa acidose hiperclorêmica que pode agravar a inflamação sistêmica. Três RCTs demonstraram superioridade do RL (recomendação ACG condicional, evidência baixa). Contraindicação ao RL: hipercalcemia (o RL contém cálcio e pode piorar PA por hipercalcemia)." },
      { q: "Descreva o resultado do estudo de de-Madeira (NEJM 2022) e sua importância prática.", a: "RCT multicêntrico com 249 pacientes comparando ressuscitação agressiva (bolus 20 mL/kg + 3 mL/kg/h) vs. moderada (bolus 10 mL/kg se hipovolemia + 1,5 mL/kg/h). Resultado: sem diferença em PA moderada/grave, mas aumento de sobrecarga hídrica com ressuscitação agressiva. Interrompido por futilidade. Importância: mudou o paradigma — antes, ressuscitação agressiva era dogma; agora, moderada e goal-directed (guiada por débito urinário, BUN, Ht) é o padrão." },
      { q: "O mito da morfina e o esfíncter de Oddi — explique por que é um mito.", a: "O conceito de que a morfina causa espasmo do esfíncter de Oddi e piora a PA é baseado em estudos manométricos antigos com metodologia questionável. Nunca foi confirmado em estudos clínicos — nenhum RCT demonstrou piora da PA com morfina. A meperidina, historicamente preferida por 'não causar espasmo', não tem vantagem demonstrada e possui metabólito neurotóxico (normeperidina → convulsões). ACG e UpToDate consideram morfina aceitável quando outros opioides indisponíveis." },
      { q: "Qual é a evidência para alimentação oral precoce na PA leve?", a: "Recomendação ACG forte, qualidade moderada. Não é necessário esperar normalização de enzimas ou resolução completa da dor. RCTs demonstram que dieta sólida hipolipídica é tão bem tolerada quanto dieta líquida clara, com menor tempo de internação. A dieta líquida clara não tem justificativa fisiológica — é uma tradição sem base em evidência. Pancreatite Aguda — Flashcards | Página 7" },
      { q: "Resuma a evidência de nutrição enteral vs. parenteral na PA grave.", a: "Metanálise de 8 RCTs: nutrição enteral reduz mortalidade (RR 0,50; IC 95%: 0,28-0,91) e falência de múltiplos órgãos (RR 0,55; IC 95%: 0,37-0,81). Mecanismo: preservação da barreira intestinal → menor translocação bacteriana → menor infecção de necrose. Via nasogástrica é equivalente à nasojejunal (RCTs sem diferença). NPT reservada para impossibilidade de via enteral." },
      { q: "O estudo PYTHON (NEJM 2014) mostrou que nutrição enteral precoce por sonda não é melhor que alimentação oral sob demanda. Isso contradiz a superioridade da enteral sobre parenteral?", a: "Não. O PYTHON comparou sonda enteral precoce vs. alimentação ORAL sob demanda (não vs. parenteral). Mostrou que, em pacientes que conseguem comer por via oral, a sonda precoce não adiciona benefício. A superioridade da enteral sobre PARENTERAL persiste robusta. A mensagem integrada é: tente via oral primeiro; se o paciente não tolera via oral, use nutrição enteral por sonda (não parenteral)." },
      { q: "Por que o estudo PROPATRIA com probióticos é um 'paradoxo terapêutico'?", a: "Probióticos eram biologicamente plausíveis para reforçar a barreira intestinal na PA grave. O RCT PROPATRIA (Lancet 2008) mostrou resultado oposto: AUMENTO de mortalidade no grupo probióticos (16% vs. 6%, p=0,01). Mecanismo provável: introdução de grandes quantidades de bactérias em epitélio intestinal isquêmico promoveu fermentação excessiva e agravou isquemia mesentérica. Lição: não se pode extrapolar de fisiologia para benefício clínico sem RCTs." },
      { q: "Por que antibióticos profiláticos não funcionam na PA, mesmo com necrose?", a: "Três razões mecanísticas: (1) a infecção da necrose ocorre por translocação bacteriana intestinal, não por bacteremia hematogênica — antibióticos sistêmicos não previnem a translocação; (2) o tecido necrótico é desvascularizado, então antibióticos sistêmicos não atingem concentração adequada nele; (3) profilaxia seleciona flora resistente (especialmente fungos), piorando potencialmente o quadro infeccioso tardio. Evidência: 11 RCTs e 10 metanálises negativas. Pancreatite Aguda — Flashcards | Página 8" },
      { q: "Quais antibióticos penetram tecido pancreático necrótico e qual é a primeira escolha?", a: "Carbapenêmicos (meropenem 1g IV 8/8h ou imipenem 500mg IV 6/6h) têm excelente penetração pancreática e são a primeira escolha para necrose infectada. Alternativas: piperacilina-tazobactam (boa penetração), cefepime + metronidazol (penetração moderada), quinolona + metronidazol (para alérgicos a β-lactâmicos). O metronidazol é adicionado para cobertura anaeróbia quando não incluída no esquema principal." },
      { q: "Quando a CPRE é indicada de urgência na PA biliar e qual é a evidência?", a: "CPRE urgente (< 24h) SOMENTE com colangite concomitante. Metanálise de 7 RCTs: redução significativa de mortalidade quando há colangite (RR 0,20). Sem colangite, CPRE precoce NÃO reduz mortalidade nem complicações. Colangite definida pela tríade de Charcot (dor, febre, icterícia) ou critérios de Tóquio. Regra: sem colangite, não se apresse para CPRE — confirme a indicação com CPRM/EUS." },
      { q: "Qual é o NNT para colecistectomia na mesma internação na PA leve biliar?", a: "NNT = 5. Sem colecistectomia, 18% dos pacientes são readmitidos por evento biliar recorrente. A colecistectomia na mesma internação (após resolução da PA leve) reduz recorrência de forma substancial (RR 0,28). O risco cirúrgico é baixo na PA leve resolvida. Na PA necrosante, a colecistectomia é diferida (intervalar) em 6-8 semanas." },
      { q: "O que é a abordagem step-up e qual estudo a fundamenta?", a: "Abordagem escalonada para necrose infectada: Passo 1 = drenagem percutânea ou endoscópica; Passo 2 = necrosectomia minimamente invasiva se drenagem insuficiente. O estudo PANTER (NEJM 2010, 88 pacientes) demonstrou: step-up vs. necrosectomia aberta reduziu nova falência orgânica de 40% para 12% (p=0,002), e complicações maiores/morte de 69% para 40% (p=0,006). ~50% dos pacientes resolvem apenas com drenagem, sem necessidade de necrosectomia. Pancreatite Aguda — Flashcards | Página 9" },
      { q: "Por que adiar a intervenção ≥ 4 semanas na necrose infectada, quando possível?", a: "Racional: aguardar a encapsulação da necrose (transformação de ANC em WON) torna a drenagem mais segura e eficaz. A parede fibrosa do WON facilita a abordagem transmural endoscópica e reduz o risco de sangramento e perfuração. RCT com 104 pacientes confirmou que postergar a drenagem reduz complicações. Enquanto se aguarda, o paciente é mantido com antibióticos penetrantes e suporte nutricional. SEÇÃO: COMPLICAÇÕES" },
      { q: "Diferencie a mortalidade bimodal da PA grave: o que mata na primeira e na segunda onda?", a: "Primeira onda (semanas 1-2): mortes por falência orgânica sistêmica (SDRA, choque distributivo, LRA) — foco no suporte intensivo (UTI, ventilação, vasopressores). Segunda onda (após semana 2): mortes por complicações infecciosas (necrose infectada, sepse) — foco na prevenção de infecção (nutrição enteral para proteger a barreira intestinal), vigilância clínica para deterioração secundária, e manejo step-up quando indicado." },
      { q: "O que é a síndrome do ducto pancreático desconectado e quando suspeitar?", a: "Ocorre quando necrose transversal do corpo do pâncreas interrompe completamente o ducto pancreático principal. A cauda permanece viável mas sem comunicação ductal com o duodeno. Consequência: fístula pancreática persistente e coleções recorrentes. Suspeitar quando: coleções ou fístulas não respondem ao tratamento convencional, especialmente após necrose na região do corpo/istmo. Ocorre em até 40-50% das necroses significativas. Manejo: stent endoscópico transluminal de longa permanência ou pancreatectomia distal. Pancreatite Aguda — Flashcards | Página 10" },
      { q: "Qual é a complicação vascular mais perigosa da PA e como se apresenta?", a: "Pseudoaneurisma arterial (artéria esplênica, gastroduodenal ou pancreatoduodenal) — causado por erosão da parede arterial pela inflamação/necrose. Risco de ruptura com hemorragia maciça. Sinal clássico: hemossucus pancreaticus (sangramento pelo ducto pancreático → hematêmese ou melena). Tratamento: embolização angiográfica urgente. Todo sangramento sentinela em contexto de PA deve levantar suspeita." },
      { q: "Como a trombose da veia esplênica pode causar hipertensão portal segmentar?", a: "A trombose da veia esplênica obstrui o retorno venoso do baço, causando hipertensão portal esquerda (segmentar). O sangue do baço é desviado para varizes de fundo gástrico (via veias gástricas curtas), que podem sangrar. Diferença da hipertensão portal global (cirrose): varizes de fundo gástrico isoladas, sem varizes esofágicas extensas, sem ascite. Tratamento definitivo: esplenectomia (se sangramento); não responde a TIPS ou terapia endoscópica de varizes esofágicas." },
      { q: "O que é a síndrome compartimental abdominal na PA e como é diagnosticada?", a: "PIA (pressão intra-abdominal) > 20 mmHg associada a nova falência orgânica. Causada por edema retroperitoneal, ascite inflamatória e íleo. Diagnóstico: medida da pressão intravesical (sonda de Foley). Manejo: (1) medidas clínicas (descompressão NG, bloqueio neuromuscular, restrição de fluidos); (2) paracentese descompressiva; (3) laparostomia (último recurso, mortalidade elevada)." },
      { q: "O que é a 'abordagem step-up' para necrose infectada e por que substituiu a necrosectomia aberta?", a: "Sequência: drenagem percutânea ou endoscópica → necrosectomia minimamente invasiva (VARD ou endoscópica transluminal) → necrosectomia aberta (só se fracasso das anteriores). RCT PANTER: step-up reduziu complicações graves e falência orgânica nova comparado à necrosectomia aberta direta (mortalidade similar ~19%). Racional: 35-64% dos pacientes resolvem apenas com drenagem, evitando cirurgia. O estudo TENSION (2021) mostrou equivalência entre step-up endoscópico e cirúrgico. Pancreatite Aguda — Flashcards | Página 11" },
      { q: "O que são pseudocistos pancreáticos e quando devem ser drenados?", a: "Coleções encapsuladas por parede de tecido fibroso/granulação (sem epitélio verdadeiro), que surgem ≥ 4 semanas após PA edematosa. Diferem do WON por não conterem material sólido necrótico. Indicação de drenagem: sintomáticos (dor, compressão gástrica/duodenal, obstrução biliar), infectados, ou em crescimento progressivo. Tamanho isolado não é indicação. Via preferida: drenagem endoscópica transmural (cistogastrostomia) guiada por EUS. A maioria dos pseudocistos < 6 cm resolve espontaneamente. SEÇÃO: SEGUIMENTO E DESFECHOS" },
      { q: "Quais são as taxas de sequelas a longo prazo após PA?", a: "Recorrência ~22% (varia por etiologia); progressão para pancreatite crônica ~10% (especialmente etiologia alcoólica + tabagismo); diabetes (pré-diabetes ou DM) 54% em 4 anos; insuficiência exócrina 35% em ≥ 1 mês. Essas taxas justificam acompanhamento longitudinal estruturado, não apenas 'alta e esquece'." },
      { q: "O que é o diabetes tipo 3c (pancreatogênico) e como difere do DM2?", a: "Diabetes causado por destruição de ilhotas de Langerhans pela inflamação/necrose pancreática. Difere do DM2 em: (1) deficiência tanto de insulina (células beta) quanto de glucagon (células alfa) → hipoglicemia brittle (episódios frequentes e imprevisíveis); (2) não há resistência insulínica significativa; (3) doses de insulina necessárias são menores que no DM2; (4) requer monitorização glicêmica mais intensiva. Frequentemente classificado erroneamente como DM2." },
      { q: "Como diagnosticar e tratar insuficiência exócrina pós-PA?", a: "Diagnóstico: elastase fecal < 200 μg/g (moderada) ou < 100 μg/g (grave). Sintomas: esteatorreia (fezes gordurosas), perda ponderal, deficiência de vitaminas lipossolúveis (A, D, E, K). Tratamento: reposição de enzimas pancreáticas (25.000-50.000 UI de lipase por refeição). Monitorizar: peso, esteatorreia, dosagem de vitaminas lipossolúveis e densitometria óssea (deficiência de vitamina D). Pancreatite Aguda — Flashcards | Página 12" },
      { q: "Qual é o impacto do tabagismo na história natural pós-PA?", a: "Fator de risco independente para progressão de PA para pancreatite crônica (OR 2,8; IC 95%: 1,8-4,2). Mecanismo: estresse oxidativo direto sobre células acinares e potencialização do efeito tóxico do álcool. A cessação do tabagismo na internação (usando intervenção breve + TRN ou vareniclina) é tão importante quanto a cessação do álcool na prevenção da recorrência e progressão." },
      { q: "Quando e como monitorizar risco cardiovascular após PA?", a: "PA é fator de risco independente para eventos cardiovasculares (HR 1,3-1,5 em estudos de coorte). A inflamação sistêmica pode acelerar aterosclerose e promover disfunção endotelial. Recomenda-se: avaliação de perfil lipídico e glicêmico na alta e após 3-6 meses; controle rigoroso de fatores de risco tradicionais (HAS, DM, dislipidemia); considerar rastreamento cardiovascular ativo em pacientes com PA grave ou recorrente." },
      { q: "Qual é o seguimento mínimo recomendado após primeiro episódio de PA e quais exames solicitar?", a: "Reavaliação em 2-4 semanas pós-alta: clínica (sintomas, peso, função GI), laboratorial (lipase, glicemia, HbA1c, perfil lipídico, vitaminas lipossolúveis se suspeita de insuficiência exócrina). Em 3-6 meses: elastase fecal (se sintomas de insuficiência exócrina), glicemia/HbA1c (rastreamento de DM3c), TC ou CPRM (se complicações locais pendentes). Seguimento por ≥ 12 meses para PA grave; seguimento vitalício se etiologia alcoólica ou PA recorrente. SEÇÃO: RACIOCÍNIO CRÍTICO E EVIDÊNCIA Pancreatite Aguda — Flashcards | Página 13" },
      { q: "O sistema GRADE separa duas dimensões — quais são e por que podem divergir?", a: "Qualidade da evidência (alta, moderada, baixa, muito baixa) e força da recomendação (forte ou condicional). Podem divergir porque: uma recomendação pode ser FORTE mesmo com evidência BAIXA quando os benefícios potenciais são tão grandes e os riscos da alternativa tão claros que a decisão é inequívoca apesar da incerteza. Exemplo: nutrição enteral > parenteral na PA grave (recomendação forte, evidência baixa — RR morte 0,50)." },
      { q: "A interrupção precoce do estudo de de-Madeira por 'futilidade' é o mesmo que interrupção por 'dano'?", a: "Não. Futilidade significa que a análise interim mostrou improbabilidade de encontrar benefício significativo se o estudo continuasse — não que a intervenção causasse dano. Dano levaria à interrupção por segurança. A distinção importa: o estudo não provou que ressuscitação agressiva é perigosa, apenas que não é melhor que moderada. Na prática, isso é suficiente para mudar a conduta, mas a nuance metodológica importa para a leitura crítica." },
      { q: "O que é um desfecho substituto e por que isso importa na PA?", a: "Desfecho substituto (surrogate endpoint) é um marcador biológico usado como proxy de um desfecho clínico real. Na PA: redução de enzimas pancreáticas, redução de tamanho de coleção na TC, melhora de escores de gravidade são desfechos substitutos. Desfechos clínicos (mortalidade, falência orgânica, infecção, tempo de internação) são os que realmente importam. Exemplo: um tratamento pode reduzir a lipase sem reduzir mortalidade — isso não é benefício clínico real." },
      { q: "Quais são os principais vieses estruturais do campo da pancreatite aguda?", a: "Viés de seleção (maioria dos RCTs inclui PA leve, sub-representando PA grave); viés de centro (maioria dos RCTs de necrosectomia vem de centros holandeses de alta expertise, com reprodutibilidade incerta em hospitais menores); heterogeneidade de desfechos (diferentes estudos usam desfechos primários distintos, dificultando comparações); e viés de publicação (atenuado pelo incomum corpus de estudos negativos publicados neste campo). Pancreatite Aguda — Flashcards | Página 14" },
      { q: "Cite três lacunas de evidência importantes na PA onde faltam RCTs adequados.", a: "(1) Timing ótimo de ressuscitação em subgrupos (obesos, cardiopatas, idosos); (2) duração ideal de antibióticos na necrose infectada (prática guiada por resposta clínica, sem RCT definindo duração); (3) manejo da hipertrigliceridemia aguda (insulina vs. plasmaférese — sem RCTs comparativos, evidência limitada a séries de casos)." },
      { q: "'Um colega lê o estudo PYTHON e conclui que nutrição enteral não funciona na PA.' Que argumento você usaria para corrigi-lo?", a: "O PYTHON comparou sonda enteral precoce vs. via ORAL sob demanda — NÃO vs. nutrição parenteral. O resultado (sem diferença) mostra que a sonda não é superior à via oral, não que a nutrição enteral não funcione. A evidência de superioridade da nutrição enteral sobre PARENTERAL é robusta (metanálise: RR morte 0,50, RR MOF 0,55). A mensagem é: tente via oral; se impossível, use enteral por sonda em vez de parenteral. SEÇÃO: SITUAÇÕES ESPECIAIS" },
      { q: "Quais as peculiaridades do manejo da PA na gestante?", a: "Etiologia mais comum: biliar (70%). USG é exame de escolha (evitar TC no 1° trimestre). CPRM sem gadolínio é alternativa segura. CPRE pode ser realizada com segurança em qualquer trimestre (com blindagem e fluoroscopia minimizada). Colecistectomia laparoscópica: ideal no 2° trimestre. PA por hipertrigliceridemia: insulina IV é a terapia de escolha. Posicionamento em decúbito lateral esquerdo após 20 semanas. Mortalidade fetal significativa (10-20%) justifica manejo agressivo." },
      { q: "Por que a obesidade é fator de risco para PA mais grave?", a: "Três mecanismos: (1) maior volume de gordura peripancreática = mais substrato para saponificação e necrose lipomatosa; (2) tecido adiposo como órgão pró-inflamatório (adipocinas amplificam a resposta inflamatória sistêmica); (3) maior dificuldade técnica em procedimentos intervencionistas. Ressuscitação deve ser baseada em peso ideal (não real). IMC > 40 por si só é indicação de monitorização intensiva. Pancreatite Aguda — Flashcards | Página 15" },
      { q: "Qual é a melhor conduta na PA por hipertrigliceridemia com TG > 1.000 mg/dL?", a: "Insulina IV (0,1-0,3 UI/kg/h) é a terapia de primeira linha — ativa a lipoproteína lipase, acelerando o clearance de triglicerídeos. Monitorizar glicemia a cada hora. Heparina IV também ativa LPL, mas tem efeito rebote após suspensão. Plasmaférese é reservada para TG refratário ou PA grave. Coletar TG na admissão — valores caem rapidamente com jejum e fluidos." },
      { q: "Como diferenciar febre inflamatória (SIRS) de febre infecciosa (necrose infectada)?", a: "Febre inflamatória: presente desde o início, diminui progressivamente. Febre infecciosa: aparece ou piora após melhora inicial ('deterioração secundária'), geralmente dias 7-21. Pistas de infecção: procalcitonina > 3,8 ng/mL (sensibilidade ~90%), gás na coleção na TC (patognomônico, presente em 30-40%), bacteremia em hemocultura, falência orgânica nova. Na dúvida: iniciar carbapenêmico e reavaliar em 72h." },
    ]
  },
];

  const hidden = document.body.classList.toggle('sidebar-hidden');
  try { localStorage.setItem('sidebarHidden', hidden ? '1' : '0'); } catch (e) {}
}

const state = {
  currentDeck: null,
  index: 0,
  flipped: false,
  order: [],
  results: {},   // { cardIdx: 'ok' | 'err' }
  finished: false,
  animating: false,
  enterDir: null  // 'right'|'left'|'up' for entering card animation
};

const $tabs = document.getElementById("tabs");
