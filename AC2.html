  {
    id: "cirrose",
    name: "Cirrose Hepática",
    cards: [
      { q: "Quais são as cinco principais etiologias de cirrose e como investigá-las inicialmente?", a: "1) Hepatite C — anti-HCV + HCV-RNA. 2) Hepatopatia alcoólica — história clínica detalhada + AST/ALT >2 + GGT elevada. 3) MASLD/NASH — síndrome metabólica, exclusão de outras causas. 4) Hepatite B — HBsAg + anti-HBc. 5) Hepatite autoimune — FAN, anti-músculo liso, IgG elevada. A etiologia é determinada em 85–90% dos casos; os 10–15% restantes são classificados como 'criptogênica' (muitos provavelmente NASH burn-out)." },
      { q: "O que é cirrose 'criptogênica' e qual a etiologia mais provável por trás dela?", a: "Cirrose criptogênica designa os 10–15% de casos sem etiologia definida após investigação completa. A maioria representa MASLD/NASH em fase avançada ('burn-out'): esses pacientes têm perfil metabólico de NASH, e a esteatose desaparece com a progressão da fibrose, apagando o marcador histológico mais óbvio." },
      { q: "Qual a principal causa de morte em pacientes com cirrose e como a mortalidade se relaciona com o MELD?", a: "As principais causas de morte são infecções (incluindo PBE, pneumonia, ITU), hemorragia varicosa e insuficiência hepática progressiva. Em compensados, o CHC emerge como causa importante. A mortalidade em 90 dias é diretamente proporcional ao MELD: <10 = ~2%; 10–19 = ~6%; 20–29 = ~20%; 30–39 = ~50%; ≥40 = ~70%. A transição compensada → descompensada é o marco prognóstico central, com sobrevida caindo de >12 anos para ~2 anos." },
      { q: "Qual é a célula-chave da fibrogênese hepática e qual é seu mecanismo de ativação?", a: "A célula estrelada hepática (célula de Ito). Normalmente quiescente e armazenadora de vitamina A, ela é ativada por citocinas pró-inflamatórias (TGF-β, PDGF, TNF-α) liberadas por hepatócitos lesados e células de Kupffer. Ao se ativar, transdiferencia-se em miofibroblasto e passa a secretar colágeno tipos I e III no espaço de Disse, causando capilarização dos sinusoides." },
      { q: "Explique o 'paradoxo do NO' na cirrose e sua implicação farmacológica.", a: "Na cirrose, há déficit de óxido nítrico (NO) intra-hepático (causando vasoconstrição sinusoidal) e excesso de NO na circulação esplâncnica (causando vasodilatação). Isso explica por que: (1) betabloqueadores não seletivos funcionam — reduzem o fluxo esplâncnico via bloqueio β2; (2) vasodilatadores sistêmicos pioram o quadro — exacerbam a vasodilatação esplâncnica; (3) o carvedilol (β + α1) é superior — a vasodilatação intra-hepática via bloqueio α1 corrige parcialmente o déficit local de NO." },
      { q: "Quais são os dois componentes da hipertensão portal na cirrose e qual é o alvo farmacológico?", a: "Componente estrutural (~70%): distorção arquitetural por fibrose e nódulos regenerativos — pouco modificável farmacologicamente, responde ao tratamento da causa de base. Componente funcional (~30%): vasoconstrição intra-hepática por disfunção endotelial + vasodilatação esplâncnica — é o alvo dos betabloqueadores não seletivos." },
      { q: "Por que a transição de cirrose compensada para descompensada é considerada um 'ponto de não retorno'?", a: "Porque a descompensação reflete o momento em que os mecanismos compensatórios (ativação do SRAA, sistema nervoso simpático, vasopressina) se tornam maladaptativos — a vasodilatação esplâncnica é tão intensa que a retenção de sódio/água (ascite), vasoconstrição renal (SHR) e shunting portossistêmico (EH) se instalam. A sobrevida cai de >12 anos para ~2 anos. A recompensação sustentada é rara sem tratamento etiológico eficaz." },
      { q: "Qual o mecanismo pelo qual a amônia causa encefalopatia hepática?", a: "A amônia intestinal (produzida pelo metabolismo bacteriano e pela glutaminase) deveria ser convertida em ureia pelo ciclo da ureia hepático. Na cirrose, a massa hepatocelular reduzida e o shunting portossistêmico desviam a amônia do fígado. No cérebro, astrócitos metabolizam amônia em glutamina (via glutamina sintetase), causando edema astrocitário osmótico e disfunção da neurotransmissão. A amônia sérica, contudo, correlaciona-se mal com a gravidade clínica." },
      { q: "Explique o mecanismo da ascite na cirrose em uma cascata de eventos.", a: "Fibrose → hipertensão portal → vasodilatação esplâncnica (excesso de NO) → diminuição do volume arterial efetivo → ativação do SRAA e vasopressina → retenção ávida de sódio e água → hipoalbuminemia (insuficiência sintética) reduz a pressão oncótica → pressão hidrostática elevada nos capilares esplâncnicos + produção de linfa excedendo capacidade do ducto torácico → acúmulo de líquido peritoneal. O GASA ≥1,1 g/dL confirma o mecanismo de hipertensão portal." },
      { q: "O que é a capilarização dos sinusoides e qual sua consequência funcional?", a: "Os sinusoides hepáticos normalmente são fenestrados (sem membrana basal contínua), permitindo troca livre entre o sangue e os hepatócitos através do espaço de Disse. Na fibrose, o depósito de colágeno pela célula estrelada ativada cria uma membrana basal contínua (capilarização). Consequências: (1) redução da troca de substâncias sangue-hepatócito (contribui para insuficiência hepatocelular); (2) aumento da resistência ao fluxo portal (contribui para hipertensão portal); (3) perda da regulação do tônus sinusoidal." },
      { q: "Descreva a circulação hiperdinâmica da cirrose e o conceito de underfilling arterial.", a: "Hipertensão portal → vasodilatação esplâncnica (excesso de NO) → queda da resistência vascular sistêmica → queda da PA efetiva → ativação barorreceptora → aumento do débito cardíaco (circulação hiperdinâmica compensatória) + ativação do SRAA, simpático e vasopressina → retenção de sódio/água + vasoconstrição renal. É um estado de underfilling arterial relativo: o volume total plasmático está expandido, mas o volume arterial efetivo está criticamente reduzido. Isso explica o paradoxo de retenção hídrica com hiponatremia dilucional." },
      { q: "O que é recompensação hepática, em que cenários ela é possível e quais são suas limitações?", a: "Recompensação é a reversão sustentada do estado descompensado para compensado. Documentada especialmente após: cura da hepatite C com DAAs, abstinência sustentada na hepatopatia alcoólica, controle da hepatite autoimune, e emagrecimento ≥10% na MASLD. Limitações: critérios formais ainda não são universalmente aceitos; é mais provável quando o componente inflamatório/funcional da doença predomina sobre a distorção vascular estrutural irreversível; e mesmo recompensados mantêm risco de CHC (rastreamento deve continuar)." },
      { q: "Quais são os três achados clínicos com maior razão de verossimilhança positiva (LR+) para cirrose?", a: "1. Ascite: LR+ 7,2 — o achado clínico isolado mais preditivo. 2. Plaquetas <160.000/μL: LR+ 6,3 — melhor marcador laboratorial (sequestro esplênico + diminuição de trombopoetina). 3. Spider angiomata (angiomas aracneiformes): LR+ 4,3 — mediados por hiperestrogenismo relativo. Nenhum sinal isolado confirma ou exclui cirrose; a combinação de achados tem valor substancialmente maior." },
      { q: "Por que a relação AST/ALT >1 é sugestiva de cirrose, especialmente na etiologia alcoólica?", a: "Três razões: (1) a ALT é mais dependente de piridoxina (B6), frequentemente deficiente no etilismo → produção de ALT reduzida; (2) a AST tem fração mitocondrial liberada na necrose hepatocitária profunda da cirrose; (3) a depuração hepática da AST diminui com a fibrose. Relação AST/ALT >2 é especialmente sugestiva de etiologia alcoólica. Importante: aminotransferases NORMAIS não excluem cirrose — até 30% dos compensados têm transaminases na faixa de referência." },
      { q: "Qual o valor da elastografia hepática no diagnóstico e manejo da cirrose? Cite os pontos de corte.", a: "A elastografia mede a rigidez hepática em kPa. Valores >12-15 kPa: cirrose provável. Valores >20-25 kPa: hipertensão portal clinicamente significativa provável (CSPH). Pelo critério Baveno VII, se elastografia >20-25 kPa + plaquetas <150.000, pode-se iniciar betabloqueadores sem EDA prévia. Limitações: obesidade extrema, ascite volumosa e congestão hepática superestimam os valores." },
      { q: "Em que cenários a biópsia hepática ainda é necessária na era dos métodos não invasivos?", a: "Em ~10-15% dos casos: dúvida diagnóstica após investigação não invasiva, etiologia inconclusiva após exames séricos completos, necessidade de estadiamento histológico preciso (especialmente se impactar decisão terapêutica), e suspeita de doença hepática concomitante (ex.: sobreposição MASLD + autoimune). A biópsia tem sensibilidade/especificidade de 80-100% (variabilidade por erro de amostragem — representa ~1/50.000 do parênquima)." },
      { q: "O que são o APRI e o FIB-4, e quais seus pontos de corte para predição de fibrose avançada?", a: "São índices não invasivos calculados a partir de exames de rotina. APRI = (AST/LSN) × 100 / plaquetas (×10⁹/L): >2,0 sugere cirrose (especificidade ~90%); <0,5 torna cirrose improvável. FIB-4 = (idade × AST) / (plaquetas × √ALT): >3,25 sugere fibrose avançada; <1,45 praticamente exclui. Limitações: zona cinzenta intermediária em 30–40% dos pacientes, e perdem acurácia em hepatite aguda ou transaminases muito elevadas." },
      { q: "Qual o painel de investigação etiológica inicial para um paciente com cirrose recém-diagnosticada?", a: "Obrigatórios: anti-HCV + HBsAg + anti-HBc (hepatites virais); história de álcool detalhada; perfil metabólico (glicemia, lipídios, IMC — MASLD); FAN + anti-músculo liso + IgG (hepatite autoimune); ferritina + saturação de transferrina (hemocromatose); ceruloplasmina (Wilson, se <40 anos). Complementares conforme suspeita: alfa-1 antitripsina, anticorpos antimitocôndria (CBP), p-ANCA (CEP). A etiologia é encontrada em 85–90% dos casos." },
      { q: "Quais achados de imagem sugerem cirrose e hipertensão portal?", a: "USG: fígado de contornos irregulares/nodulares, ecotextura grosseira e heterogênea, hipertrofia do lobo caudado e atrofia do lobo direito, esplenomegalia (>13 cm). Sinais de hipertensão portal: veia porta >13 mm, fluxo portal hepatofugal ao Doppler, recanalização da veia umbilical, ascite. TC/RM: mesmos achados + melhor detecção de CHC (wash-in arterial + wash-out portal). Limitação: USG pode ser normal na cirrose compensada precoce (sensibilidade ~85%)." },
      { q: "Qual o rastreamento de varizes recomendado e quando se pode dispensar a EDA?", a: "EDA no diagnóstico de cirrose. Se sem varizes e causa não tratada: repetir em 2–3 anos; se varizes de pequeno calibre: em 1–2 anos. Pelo critério Baveno VII, se elastografia >20–25 kPa + plaquetas <150.000 (indicando CSPH), pode-se iniciar BBNS sem EDA prévia. Se a causa de base for tratada com sucesso (ex.: SVR na hepatite C), a regressão de varizes é possível e o intervalo de rastreamento pode ser estendido." },
      { q: "Qual o critério diagnóstico de PBE e por que a cultura é frequentemente negativa?", a: "Critério: ≥250 PMN/mm³ no líquido ascítico, independentemente da cultura. A cultura é negativa em até 40% dos casos ('bacterascite cultura-negativa') porque a concentração bacteriana é baixa. A inoculação em frascos de hemocultura à beira-leito aumenta a sensibilidade. Patógenos mais comuns: E. coli e Klebsiella (~70%), seguidos por Streptococcus e Enterococcus." },
      { q: "Por que a albumina IV reduz a mortalidade na PBE?", a: "A PBE causa vasodilatação esplâncnica adicional → queda do volume arterial efetivo → risco de SHR. A albumina (1,5 g/kg no dia 1 + 1 g/kg no dia 3) atua como expansor plasmático oncótico, restaurando o volume circulante efetivo e prevenindo a SHR. Reduz a incidência de SHR e a mortalidade hospitalar." },
      { q: "Diferencie SHR-AKI (antigo tipo 1) de SHR-NAKI (antigo tipo 2).", a: "SHR-AKI: deterioração aguda (↑creatinina ≥0,3 mg/dL em 48h ou ≥50% em 7 dias) que não responde a expansão com albumina por 2 dias. Mortalidade >80% sem tratamento. Requer terlipressina + albumina urgente. SHR-NAKI: disfunção renal crônica, mais lenta e estável, geralmente associada a ascite refratária. Prognóstico reservado mas menos fulminante. Ambos são funcionais — rins histologicamente normais." },
      { q: "Quais são os precipitantes mais comuns de encefalopatia hepática e por que a alcalose metabólica a precipita?", a: "Precipitantes: infecção (incluindo PBE), hemorragia GI (hemoglobina digerida é substrato para amoniagênese), constipação, sedativos/opioides, distúrbios eletrolíticos, excesso de diuréticos, TIPS, e desidratação. A alcalose metabólica precipita EH porque converte NH4+ (ionizada, não atravessa BHE) em NH3 (não ionizada, atravessa livremente a BHE), aumentando a captação cerebral de amônia." },
      { q: "O que são ortodeóxia e platipneia, e em que complicação da cirrose ocorrem?", a: "Ocorrem na síndrome hepatopulmonar (SHP). Ortodeóxia: piora da oxigenação ao sentar (oposto da ortopneia cardíaca). Platipneia: dispneia ao sentar. Explicação: a vasodilatação intrapulmonar predomina nas bases; ao sentar, a gravidade aumenta o fluxo para as bases vasodilatadas, piorando o shunt e a oxigenação. Diagnóstico: ecocardiograma com microbolhas. Tratamento: transplante hepático (único curativo)." },
      { q: "Como é classificada a ascite na cirrose e qual a abordagem terapêutica por grau?", a: "Grau 1: detectável apenas por imagem — observação + restrição de sódio (2 g/dia). Grau 2: moderada, distensão simétrica — restrição de sódio + espironolactona 100 mg/dia (titular até 400 mg) ± furosemida 40 mg/dia (titular até 160 mg), mantendo proporção 100:40. Grau 3: tensa, desconforto — paracentese de grande volume + albumina (6–8 g/L removida) seguida de diuréticos. Refratária: falha de diuréticos em dose máxima — opções: paracenteses repetidas, TIPS, ou transplante." },
      { q: "O que define ascite refratária e quais as opções terapêuticas?", a: "Definição: ascite que não responde a diuréticos em dose máxima (espironolactona 400 mg + furosemida 160 mg) ou que recidiva rapidamente após paracentese, ou quando os diuréticos causam efeitos adversos intoleráveis. Sobrevida mediana ~6 meses. Opções: (1) paracenteses de grande volume repetidas + albumina — paliativo; (2) TIPS — melhora controle da ascite em ~75%, mas pode piorar EH e não melhora sobrevida global; (3) transplante hepático — único tratamento definitivo." },
      { q: "Quais são os critérios para profilaxia primária e secundária de PBE?", a: "Primária: (1) durante hemorragia varicosa aguda — ceftriaxona IV por 7 dias (todo cirrótico com sangramento GI); (2) proteína no líquido ascítico <1,5 g/dL + pelo menos um de: Child-Pugh ≥9, bilirrubina >3, creatinina >1,2 ou Na <130 — norfloxacino 400 mg/dia ou SMX-TMP 800/160 mg/dia. Secundária: após primeiro episódio de PBE — norfloxacino 400 mg/dia ou SMX-TMP indefinidamente (recidiva em ~70% sem profilaxia em 1 ano)." },
      { q: "Qual o manejo inicial da hemorragia varicosa aguda?", a: "Tríade simultânea: (1) Estabilização — reposição volêmica cautelosa (alvo Hb 7–8 g/dL; transfusão excessiva piora a hipertensão portal); (2) Vasoconstritor esplâncnico — octreotide ou terlipressina por 2–5 dias para reduzir o fluxo portal; (3) EDA em até 12h — ligadura elástica como primeira escolha. Antibioticoprofilaxia obrigatória (ceftriaxona) por 7 dias — infecção precipita ressangramento e morte. Se refratário: TIPS de resgate. Mortalidade em 30 dias: ~15–20%." },
      { q: "Diferencie a profilaxia primária e secundária de sangramento varicoso.", a: "Primária (nunca sangrou): BBNS (carvedilol 6,25–12,5 mg/dia preferido) OU ligadura elástica para varizes de médio/grande calibre. Pelo Baveno VII, se CSPH documentada, iniciar BBNS mesmo sem EDA. Secundária (já sangrou): BBNS + ligadura elástica combinados — a associação é superior a qualquer um isolado. Se refratário: TIPS. A escolha entre BBNS e ligadura na primária depende de preferência do paciente e contraindicações." },
      { q: "Descreva os graus da encefalopatia hepática pela classificação de West Haven.", a: "EHM (mínima): sem alteração clínica, detectável apenas por testes psicométricos — afeta até 80% dos cirróticos, compromete direção veicular. Grau 1: alteração do ciclo sono-vigília, déficit de atenção, euforia ou ansiedade. Grau 2: letargia, desorientação temporal, asterixis (flapping). Grau 3: sonolência, confusão, desorientação grosseira, comportamento bizarro. Grau 4: coma. Graus 2–4 são clinicamente evidentes (overt HE); EHM e grau 1 são covert HE." },
      { q: "Quais os critérios de rastreamento de CHC e quando o padrão de imagem dispensa biópsia?", a: "Rastreamento: USG hepática ± alfafetoproteína a cada 6 meses em todo cirrótico. Se nódulo >1 cm: TC ou RM com protocolo multifásico. O padrão wash-in arterial + wash-out portal é diagnóstico de CHC em nódulo >1 cm em fígado cirrótico, sem necessidade de biópsia (critérios LI-RADS/AASLD). Nódulos <1 cm: reavaliar em 3 meses. Em obesos com USG de baixa qualidade, considerar TC ou RM alternadas para rastreamento." },
      { q: "Por que AINEs são contraindicados na cirrose? E qual o analgésico de escolha?", a: "Na cirrose, as prostaglandinas (PGE2, prostaciclina) são vasodilatadores renais cruciais — compensam a vasoconstrição renal mediada pelo SRAA e simpático. AINEs bloqueiam a COX → removem essa proteção → insuficiência renal aguda + retenção de sódio (piora ascite) + risco de sangramento GI. Isso inclui COX-2 seletivos. O paracetamol (≤2 g/dia) é o analgésico de escolha — seguro em dose ajustada porque seu risco é hepatotoxicidade (glutationa), não renal ou GI." },
      { q: "Qual a dose de carvedilol na profilaxia e quais são os limites para seu uso?", a: "Dose: 6,25 mg/dia VO, podendo ser titulada até 12,5 mg/dia. Limites: suspender se PAS <90 mmHg ou FC <55 bpm. Na cirrose descompensada avançada com PAS muito baixa, os BBNS podem ser deletérios ('window hypothesis'). O carvedilol é preferido ao propranolol pelo triplo bloqueio (β1+β2+α1) e maior redução do HVPG." },
      { q: "Por que NÃO se deve restringir proteínas na encefalopatia hepática?", a: "A restrição proteica está abandonada — piora a sarcopenia (presente em ~60% dos cirróticos) sem benefício na EH. A sarcopenia é fator prognóstico independente (dobra a mortalidade em lista de transplante). Recomenda-se 1,2-1,5 g/kg/dia de proteína. A refeição noturna (late evening snack, ~200 kcal) encurta o jejum e reduz o catabolismo muscular. Proteínas vegetais e BCAA podem ser preferidas por menor amoniagênese." },
      { q: "Qual o impacto do tratamento etiológico da hepatite C na cirrose e o que é recompensação?", a: "DAAs atingem cura (SVR) em >95% dos cirróticos compensados. Resultados: regressão parcial de fibrose (queda da elastografia), redução do HVPG, redução do risco de descompensação e CHC (mas não eliminação — rastreamento deve continuar). Na cirrose descompensada, DAAs com ribavirina; evitar inibidores de protease em Child B/C. A hepatite C é o exemplo mais robusto de recompensação pós-tratamento etiológico. Regimes sem inibidores de protease para Child B/C pela hepatotoxicidade." },
      { q: "Quais as condutas etiológicas para hepatopatia alcoólica e MASLD?", a: "Álcool: abstinência completa é a intervenção mais impactante — pode reverter fibrose significativa. Adjuvantes: programas de reabilitação, baclofen (único testado em cirróticos). A 'regra dos 6 meses' de abstinência pré-transplante está sendo revisada em favor de avaliação psicossocial individualizada. MASLD: perda de peso ≥10% pode reverter esteatohepatite e fibrose. Exercício aeróbico melhora esteatose mesmo sem perda de peso. Cirurgia bariátrica considerada em Child A selecionados." },
      { q: "Qual a lógica da proporção 100:40 entre espironolactona e furosemida na ascite?", a: "O hiperaldosteronismo secundário é o motor principal da retenção de sódio na cirrose (SRAA ativado) — por isso a espironolactona (antagonista de aldosterona) é o diurético de primeira linha. A furosemida é adjuvante. A proporção 100:40 (espironolactona:furosemida em mg) mantém equilíbrio de potássio (espironolactona poupa K+, furosemida desperdiça K+). Meta: perda ponderal ~0,5 kg/dia sem edema ou ~1 kg/dia com edema. Monitorizar eletrólitos e creatinina a cada 1–2 semanas durante titulação." },
      { q: "Qual o protocolo de tratamento e profilaxia da encefalopatia hepática com lactulose e rifaximina?", a: "Tratamento agudo: lactulose 15–45 mL VO 2–4×/dia, titular para 2–3 evacuações pastosas/dia (acidifica o lúmen colônico, convertendo NH3 em NH4+ não absorvível). Se EH grau 3–4: via sonda ou enema. Profilaxia de recorrência: lactulose + rifaximina 550 mg 2×/dia. A combinação reduz recorrência de EH em ~50% comparada a lactulose isolada. Sempre investigar e tratar precipitantes (infecção, hemorragia, constipação, sedativos, distúrbios eletrolíticos)." },
      { q: "Qual o mecanismo e as limitações da terlipressina no tratamento da SHR-AKI?", a: "Mecanismo: análogo de vasopressina → vasoconstrição esplâncnica → melhora enchimento arterial efetivo → desativa parcialmente SRAA/simpático → melhora perfusão renal. Usada com albumina IV. Limitações: (1) ponte para transplante, não definitivo — recidiva frequente; (2) efeitos adversos sérios: isquemia periférica/mesentérica, arritmias, hiponatremia — requer monitorização contínua; (3) contraindicada em doença coronariana/vascular periférica significativa; (4) resposta parcial em ~40–50%." },
      { q: "Por que a vacinação é parte integral do manejo da cirrose? Quais esquemas são especiais?", a: "Cirróticos são imunocomprometidos funcionalmente (disfunção reticuloendotelial, deficiência de complemento, linfopenia). Esquemas especiais: hepatite B — dose dupla (40 μg) com verificação de anti-HBs (até 50% de não resposta com dose padrão). Hepatite A — risco de fulminante se infecção em fígado cirrótico. Herpes-zóster — Shingrix (recombinante) a partir de 19 anos; vacina viva contraindicada. A resposta vacinal é 30–50% menor em Child B/C. Pneumococo: PCV20 dose única." },
      { q: "Quais os riscos dos IBPs na cirrose e quando são justificados?", a: "Riscos: (1) maior incidência de PBE — supressão ácida facilita translocação bacteriana e altera microbiota; (2) maior risco de encefalopatia hepática — possivelmente por alteração da microbiota e aumento da amoniagênese. Indicações justificadas: úlcera documentada, DRGE erosiva, profilaxia pós-ligadura varicosa (curto prazo). O uso crônico sem indicação clara deve ser desprescrito. Armadilha comum: IBPs são amplamente prescritos mas potencialmente prejudiciais no cirrótico." },
      { q: "Cite os escores prognósticos da cirrose e a sobrevida por classe de Child-Pugh.", a: "Child-Pugh: A (5-6 pts) = 100% em 1 ano / 85% em 2 anos; B (7-9 pts) = 80% / 60%; C (10-15 pts) = 45% / 35%. Variáveis: bilirrubina, albumina, INR, ascite, encefalopatia. MELD: fórmula com bilirrubina, creatinina e INR — prediz mortalidade em 90 dias; MELD ≥21 = sobrevida mediana ≤6 meses. MELD 3.0 incorpora sódio, albumina e sexo (corrige disparidade para mulheres)." },
      { q: "Quais são as indicações para referência a centro de transplante hepático?", a: "MELD ≥15 (risco de mortalidade em lista justifica o risco cirúrgico), primeira descompensação (ascite, EH, sangramento varicoso — mesmo com MELD <15), CHC dentro dos critérios de Milão (nódulo único ≤5 cm ou até 3 nódulos ≤3 cm, sem invasão vascular), síndrome hepatopulmonar (PaO2 <80 mmHg), hipertensão portopulmonar (PAP média >35 mmHg), prurido intratável na colestase, EH recorrente refratária. A referência deve ser precoce." },
      { q: "Qual a fórmula do MELD e a mortalidade associada a cada faixa de pontuação?", a: "MELD = 3,78 × ln(bilirrubina) + 11,2 × ln(INR) + 9,57 × ln(creatinina) + 6,43. Escala 6–40 pontos. Mortalidade em 90 dias: MELD <10 = ~2%; 10–19 = ~6%; 20–29 = ~20%; 30–39 = ~50%; ≥40 = ~70%. É o sistema de alocação de órgãos na maioria dos países. O MELD ≥15 marca o ponto em que a mortalidade em lista justifica o risco cirúrgico do transplante." },
      { q: "O que o MELD 3.0 acrescenta ao MELD-Na e por que incorporou o sexo biológico?", a: "O MELD 3.0 (adotado nos EUA em 2022) incorpora sódio (hiponatremia dilucional = preditor independente de mortalidade), albumina (melhora discriminação) e sexo feminino (+1,33 pontos). A correção por sexo existe porque a creatinina é fisiologicamente mais baixa em mulheres (menor massa muscular), resultando em MELD subestimado para a mesma gravidade de doença. Isso gerava disparidade histórica na alocação de órgãos — mulheres recebiam menos transplantes apesar de doença igualmente grave." },
      { q: "Quais são os marcos prognósticos que separam os estágios evolutivos da cirrose?", a: "Compensada sem CSPH: sobrevida mediana >12 anos. Compensada com CSPH: taxa de descompensação ~5–7%/ano. Primeira descompensação: sobrevida mediana ~2 anos — divisão prognóstica central. MELD ≥21 ou Child ≥12: sobrevida ≤6 meses sem transplante. Ascite refratária: mediana ~6 meses. Hemorragia varicosa em descompensado: mortalidade 30 dias ~15–20%. A descompensação é o marcador mais importante, mais que qualquer escore isolado." },
      { q: "Quais sinais de alarme devem mudar a conduta no acompanhamento do cirrótico?", a: "(1) Primeiro episódio de ascite → referir a centro de transplante; (2) Ascite refratária → TIPS vs transplante; (3) EH recorrente (≥2 em 6 meses) → otimizar lactulose + rifaximina, investigar precipitantes; (4) MELD subindo >3 pontos em 3 meses → acelerar transplante; (5) Hiponatremia progressiva (Na <130 e caindo) → prognóstico muito reservado, urgência de transplante; (6) Lesão focal na USG → protocolo CHC com TC/RM multifásica; (7) Trombose de veia porta → avaliar anticoagulação caso a caso." },
      { q: "Qual o esquema de monitorização recomendado para o paciente com cirrose?", a: "USG hepática ± AFP: cada 6 meses (CHC). EDA: no diagnóstico, repetir 1–3 anos conforme achado. Laboratório (hemograma, hepatograma, função renal, coagulograma, Na): cada 3–6 meses na compensada, 1–3 meses na descompensada. Elastografia: anual. MELD: cada 3–6 meses. Avaliação nutricional: cada consulta (sarcopenia dobra mortalidade em lista). Densitometria óssea: basal e periódica (osteodistrofia hepática, especialmente em colestase crônica)." },
      { q: "Quais são as contraindicações absolutas ao transplante hepático?", a: "Sepse ativa não controlada, neoplasia extrahepática ativa, doença cardiopulmonar avançada irreversível, falta de suporte social/aderência, uso ativo de substâncias ilícitas, CHC além dos critérios de Milão (com exceções por downstaging). A hepatopatia alcoólica é a segunda indicação mais comum; a regra de 6 meses de abstinência está sendo revisada. Sobrevida pós-transplante: ~85% em 1 ano e ~70% em 5 anos — uma das cirurgias de transplante mais bem-sucedidas." },
      { q: "O INR está elevado em um cirrótico que precisa de paracentese. Deve-se corrigir com plasma fresco?", a: "NÃO para procedimentos de baixo risco (paracentese, toracocentese). O INR na cirrose não reflete risco hemorrágico porque há 'rebalanceamento hemostático' — déficit simultâneo de fatores pró-coagulantes E anticoagulantes (proteína C, S, antitrombina III). A correção com PFC é ineficaz (o fígado não sustenta os fatores infundidos) e potencialmente deletéria (sobrecarga volêmica). Testes viscoelásticos (TEG/ROTEM) avaliam melhor a hemostasia na cirrose." },
      { q: "A amônia sérica de um paciente com EH grau 2 normalizou. Isso garante resolução da encefalopatia?", a: "NÃO. A amônia sérica tem baixa correlação com a gravidade clínica da EH — porque: (1) é apenas uma das neurotoxinas envolvidas (outras: manganês, mercaptanos, ácidos graxos de cadeia curta, falsos neurotransmissores); (2) o nível sérico não reflete a concentração cerebral; (3) técnica de coleta influencia o resultado. A normalização não confirma resolução, assim como amônia elevada não confirma EH ativa. Avaliação deve ser clínica (estado mental, asterixis, capacidade funcional)." }
    ]

  {
    id: "tuberculose",
    name: "Tuberculose",
    cards: [
      { q: "Qual é o mecanismo de transmissão da TB e por que partículas > 5 μm não causam infecção?", a: "A TB é transmitida por via aérea, através dos núcleos de Wells (1-5 μm), que contêm 1-3 bacilos e alcançam os alvéolos. Partículas maiores que 5 μm ficam retidas nas vias aéreas superiores (nariz, traqueia) pelo mecanismo mucociliar e não atingem o parênquima pulmonar onde a infecção se estabelece." },
      { q: "Quantas pessoas um paciente bacilífero infecta por ano e após quanto tempo de tratamento a transmissão diminui significativamente?", a: "10-15 pessoas/ano. A transmissão reduz-se significativamente após 15 dias de tratamento adequado, embora possa persistir enquanto houver baciloscopia positiva." },
      { q: "Qual a diferença entre o risco de progressão ILTB→TB em imunocompetentes e em PVHIV?", a: "Imunocompetentes: 10% ao longo da vida (5% nos primeiros 2 anos + 5% tardio). PVHIV: 10% ao ano — o HIV é o maior fator de risco isolado, transformando o risco de uma vida inteira em um risco anual." },
      { q: "Quais são as populações vulneráveis para TB no Brasil e suas razões de risco em relação à população geral?", a: "Pessoas em situação de rua (56×), PVHIV (28×), pessoas privadas de liberdade (28×), indígenas (3×). Essas razões justificam a busca ativa priorizada nessas populações. Fisiopatologia e mecanismos" },
      { q: "Quais são as duas características biológicas do M. tuberculosis que determinam as dificuldades terapêuticas?", a: "(1) Parede celular rica em lipídios (ácidos micólicos) → resistência natural à maioria dos antibióticos, alvo de isoniazida e etambutol. (2) Crescimento lento (tempo de duplicação 12-20h) → tratamento de meses, não dias; cultura demora 14-30 dias em meio sólido." },
      { q: "Por que a PT/PPD e o IGRA demoram 2-10 semanas para positivar após a infecção?", a: "Porque medem a resposta imune adaptativa (Th1) ao M. tuberculosis, que leva 2-10 semanas para se desenvolver após a primoinfecção — é a \"janela imunológica\". Por isso, contatos recentes com PT negativa devem ser retestados em 8 semanas." },
      { q: "Cite as três populações bacilares, seus ambientes, e qual fármaco é mais eficaz contra cada uma.", a: "(A) Cavitária/extracelular — pH neutro, crescimento rápido — isoniazida (melhor bactericida). (B) Caseosa/granuloma — pH ácido, crescimento intermitente — rifampicina (melhor esterilizante). (C) Intramacrofágica — pH ácido intracelular, crescimento lento — pirazinamida (ativa exclusivamente em pH ácido)." },
      { q: "Por que a pirazinamida é usada apenas nos 2 primeiros meses do tratamento?", a: "Porque a pirazinamida só é ativa em pH ácido (meio intracelular e granuloma). Nos primeiros meses há máxima inflamação e acidificação do meio — é quando as populações B e C são mais acessíveis. Após a fase intensiva, com redução da carga bacilar e da inflamação, a pirazinamida perde eficácia relativa, e a atividade esterilizante passa a depender predominantemente da rifampicina." },
      { q: "Explique por que a associação de fármacos previne resistência, usando a proporção de mutantes naturais.", a: "Uma cavidade com 10⁸ bacilos conterá ~1 mutante resistente a R (proporção 1:10⁷-10⁸) e ~100-1.000 resistentes a H (1:10⁵-10⁶). Em monoterapia com H, os mutantes resistentes seriam selecionados. Com R+H+E, a probabilidade de resistência simultânea é 1:10⁷ × 1:10⁵ × 1:10⁵ = 1:10¹⁷ — virtualmente zero em qualquer população bacilar viável." },
      { q: "Quais são os três objetivos terapêuticos do tratamento da TB e qual fase do esquema atende cada um?", a: "(1) Atividade bactericida precoce (fase intensiva): reduzir população A → negativação do escarro. (2) Prevenção de resistência (fase intensiva): 4 fármacos cobrem mutantes naturais. (3) Atividade esterilizante (manutenção): eliminar populações B e C → prevenir recidiva. A rifampicina é essencial nas duas fases." },
      { q: "Por que a rifampicina é considerada o fármaco mais importante do esquema, apesar de a isoniazida ter maior atividade bactericida?", a: "Porque a rifampicina é o melhor esterilizante — elimina as populações B e C responsáveis por recidiva. Regimes sem rifampicina têm taxas de recidiva muito maiores e necessitam de tratamentos mais longos (12-18 meses). A isoniazida mata mais bacilos na fase inicial, mas a rifampicina é quem garante a cura definitiva. Diagnóstico" },
      { q: "Compare sensibilidade, tempo de resultado e informação adicional entre baciloscopia e TRM-TB.", a: "Baciloscopia: sensibilidade 60-80%, resultado em 24-48h, não detecta resistência. TRM-TB (GeneXpert): sensibilidade ~90% em escarro de adultos, resultado em 2 horas, detecta resistência à rifampicina (sens. 95%). O TRM-TB é preferencial como teste inicial, mas não substitui a cultura para teste de sensibilidade completo." },
      { q: "Por que o TRM-TB não serve para controle de tratamento?", a: "Porque o TRM-TB detecta DNA de M. tuberculosis por PCR, incluindo DNA de bacilos mortos. Pode permanecer positivo por semanas a meses após o início do tratamento eficaz, sem significar falência. Para controle, usa-se baciloscopia (detecta bacilos álcool-ácido resistentes íntegros) e cultura (detecta bacilos viáveis)." },
      { q: "Qual exame tem a maior acurácia para diagnóstico de TB pleural e por quê?", a: "A biópsia pleural combinada com cultura do fragmento (sensibilidade > 90%). O ADA > 40 U/L no líquido pleural tem sensibilidade de 93% e especificidade de 97%, sendo o marcador bioquímico mais útil. A baciloscopia do líquido pleural é praticamente inútil (sensibilidade ~5%)." },
      { q: "Qual a principal diferença prática entre PT/PPD e IGRA que define a escolha entre eles?", a: "A PT tem reação cruzada com BCG (falso-positivos em vacinados), enquanto o IGRA usa antígenos ESAT-6/CFP-10 ausentes no BCG (sem reação cruzada). Em vacinados com BCG (maioria da população brasileira), um IGRA positivo é mais confiável. Entretanto, a PT tem ampla disponibilidade no SUS, enquanto o IGRA é limitado." },
      { q: "Em PVHIV com CD4 < 200, quais características clínicas e radiológicas dificultam o diagnóstico de TB?", a: "A imunossupressão grave causa apresentação atípica: ausência de cavitação ao Rx (sem formação adequada de granuloma), escarro paucibacilar (baciloscopia frequentemente negativa), predomínio de formas extrapulmonares, Rx normal em até 10%. O TRM-TB e a cultura ganham importância ainda maior." },
      { q: "Quais são os achados típicos do LCR na TB meningoencefálica?", a: "Proteínas elevadas (100-500 mg/dL), glicose baixa (< 40 mg/dL ou < 50% da glicemia), pleocitose linfocítica (100-500 células). Baciloscopia do LCR positiva em apenas 10-15%, cultura em 50-75%, TRM-TB ~60%. O par craniano VI é o mais frequentemente acometido." },
      { q: "Cite três diagnósticos diferenciais de TB pulmonar pós-primária e a pista para distingui-los.", a: "(1) Pneumonia comunitária: responde a antibióticos em 48-72h; TB não responde. (2) Câncer de pulmão: nódulo solitário sem sintomas constitucionais; TC e biópsia definem. (3) Paracoccidioidomicose: lesões mucocutâneas associadas, Rx em \"asa de borboleta\", microscopia com leveduras multigemulantes. Tratamento — esquemas e condições especiais" },
      { q: "Qual a posologia do Esquema Básico adulto (> 50 kg) na fase intensiva e na fase de manutenção?", a: "Fase intensiva (2 meses): RHZE — R 600mg + H 300mg + Z 1.600mg + E 1.100mg, dose fixa combinada, diária. Fase de manutenção (4 meses): RH — R 600mg + H 300mg, dose fixa combinada, diária." },
      { q: "Quais são os critérios para usar o esquema encurtado de 4 meses (SHINE) em crianças?", a: "(1) Idade 3 meses a 16 anos. (2) TB pulmonar não grave: sem cavitação, sem doença bilateral extensa, sem TB miliar, sem formas extrapulmonares graves. (3) Em adolescentes 10-16 anos: adicionalmente, baciloscopia/TRM-TB negativo ou não realizado. Se qualquer critério não for atendido, manter esquema convencional de 6 meses." },
      { q: "Por que a TB meningoencefálica é tratada por 12 meses e não 6?", a: "Dois motivos mecanísticos: (1) a barreira hematoencefálica limita a penetração de fármacos no SNC, reduzindo as concentrações esterilizantes; (2) os bacilos no SNC estão predominantemente em populações B e C (intramacrofágicas), com metabolismo lento, exigindo maior tempo de exposição à rifampicina para esterilização." },
      { q: "Qual a ordem de reintrodução de fármacos após hepatotoxicidade grave durante o Esquema Básico?", a: "Após normalização do hepatograma: RE (3-7 dias) → RE+H (3-7 dias) → RE+HZ. Se intolerância ao reintroduzir Z: manter REH por 9 meses. Se intolerância a H: substituir por levofloxacino. A lógica é reintroduzir primeiro os menos hepatotóxicos (R e E), depois H, e por último Z (o principal hepatotóxico)." },
      { q: "Explique por que a rifampicina reduz o efeito de hipoglicemiantes orais no paciente diabético.", a: "A rifampicina é potente indutora do CYP450 (especialmente CYP3A4). Sulfonilureias e meglitinidas são metabolizadas por essa via. A indução enzimática acelera o metabolismo desses fármacos, reduzindo seus níveis séricos e comprometendo o controle glicêmico. Conduta: monitorar glicemia frequentemente e considerar insulinoterapia durante o tratamento da TB." },
      { q: "Qual a indicação de rifabutina no tratamento de TB em PVHIV e qual sua principal limitação?", a: "Indicada quando é necessário manter IP (inibidores de protease) ou dolutegravir no esquema ARV, pois a rifabutina tem menor indução do CYP450 que a rifampicina. Esquema: 2Rfb HZE / 4Rfb H. Principal limitação: a rifabutina não permite formulação em dose fixa combinada, resultando em mais comprimidos e menor adesão." },
      { q: "Quando iniciar TARV em paciente com TB meningoencefálica e por quê?", a: "Somente 2 meses após o início do tratamento da TB. Motivo: o TARV precoce não demonstrou benefício em mortalidade nessa localização e AUMENTA reações adversas (SIR com edema cerebral, hipertensão intracraniana). Na TB meningoencefálica, o risco de SIR no SNC é potencialmente fatal." },
      { q: "Qual a diferença entre o manejo da SIR leve-moderada e grave?", a: "Leve-moderada: manter TARV + tratamento da TB + AINEs/sintomáticos. Grave (risco de vida): acrescentar corticosteroide (prednisona 1 mg/kg/dia por 2-4 semanas com desmame). Em NENHUM caso suspender TARV ou tratamento da TB — a suspensão piora o prognóstico de ambas as condições." },
      { q: "Compare os quatro esquemas de tratamento da ILTB em termos de duração, número de doses e principal vantagem de cada um.", a: "6H: 6 meses/180 doses — mais estudado e disponível. 9H: 9 meses/270 doses — maior proteção (~90% vs ~69% do 6H). 3HP: 3 meses/12 doses semanais — melhor adesão, eficácia comparável ao 9H. 4R: 4 meses/120 doses — menor hepatotoxicidade. A escolha depende do perfil de adesão, risco de hepatotoxicidade e uso concomitante de ARV." },
      { q: "Por que o esquema 4R é contraindicado em PVHIV usando inibidores de protease ou dolutegravir?", a: "Porque a rifampicina (R) induz intensamente o CYP3A4, reduzindo os níveis séricos de IP em até 90% e de DTG em ~50%, comprometendo a supressão viral e favorecendo resistência do HIV. Nesses casos, usa-se isoniazida (6H ou 9H) ou 3HP (verificar interações da rifapentina)." },
      { q: "Descreva o fluxograma de quimioprofilaxia primária em recém-nascidos coabitantes de caso de TB bacilífera.", a: "(1) NÃO vacinar BCG ao nascer. (2) Iniciar H (5-10 mg/kg) ou R (10 mg/kg) por 3 meses. (3) Realizar PT após os 3 meses. (4a) Se PT ≥ 5mm: completar tratamento de ILTB (H: + 3 meses; R: + 1 mês) e NÃO vacinar BCG. (4b) Se PT < 5mm: suspender e vacinar BCG." },
      { q: "Qual o critério de abandono do tratamento de ILTB com isoniazida e com rifampicina?", a: "Isoniazida: sem medicação por ≥ 3 meses consecutivos. Rifampicina: sem medicação por ≥ 2 meses consecutivos. A diferença reflete a menor duração total do esquema com R (4 meses vs. 6-9 meses com H). Reações adversas e interações" },
      { q: "Qual a explicação mecanística para a artralgia e hiperuricemia causadas pela pirazinamida?", a: "A pirazinamida (e seu metabólito, o ácido pirazinóico) bloqueia a secreção tubular renal de ácido úrico → hiperuricemia → artralgia/gota. É a mesma via afetada pelo ácido láctico no exercício intenso. Conduta: AINEs, dieta, alopurinol se gota aguda. Não é necessário suspender Z por artralgia isolada." },
      { q: "Cite três fármacos cujos níveis séricos são significativamente reduzidos pela rifampicina e a consequência clínica de cada interação.", a: "(1) IP do HIV: ↓ até 90% → supressão viral inadequada → resistência do HIV. (2) Warfarina: ↓ efeito anticoagulante → risco tromboembólico; monitorar INR e aumentar dose. (3) Contraceptivos orais: ↓ eficácia → gestação não planejada; usar método de barreira adicional." },
      { q: "Qual o fármaco anti-TB que causa surdez fetal irreversível e em que situação clínica esse risco é particularmente relevante?", a: "Estreptomicina (e amicacina) — aminoglicosídeos que causam lesão irreversível do VIII par craniano no feto. Relevante na gestação: esses fármacos são classificados como categoria D (contraindicados). O Esquema Básico (RHZE) é seguro na gestação." },
      { q: "Diferencie reação adversa menor e maior ao Esquema Básico com um exemplo de cada e a conduta.", a: "Menor: náuseas/vômitos (principalmente por R e Z) — manter esquema, tomar após refeição, usar antieméticos. Maior: hepatotoxicidade (TGO/TGP ≥ 3× LSN com sintomas) — suspender TODOS os fármacos, investigar, reintroduzir sequencialmente após normalização. Reações menores ocorrem em ~20-30% dos pacientes; maiores em 3-8%." },
      { q: "Qual o risco da neurite óptica causada por etambutol e por que esse fármaco não é usado em crianças < 10 anos?", a: "O etambutol causa neurite óptica dose-dependente (perda de acuidade visual e discriminação de cores, geralmente reversível se detectada precocemente). Em crianças < 10 anos, a monitorização visual fidedigna é difícil (exame de acuidade visual e discriminação de cores requer cooperação), tornando a detecção precoce impossível — daí a exclusão do E no esquema pediátrico. Seguimento e vigilância" },
      { q: "O que significa uma baciloscopia positiva ao 2º mês de tratamento e qual a conduta?", a: "Pode significar: (1) bacilos mortos ainda sendo eliminados (baciloscopia detecta BAAR íntegros, não necessariamente viáveis) — mais comum; ou (2) falência terapêutica (resistência, má absorção, adesão irregular). Conduta: solicitar CULTURA + TS (padrão-ouro para viabilidade), intensificar supervisão de adesão (TDO), e avaliar necessidade de ajuste terapêutico conforme resultado." },
      { q: "Por que o TDO reduz o abandono de ~17% para ~5% e qual sua importância mecanística na prevenção de resistência?", a: "O TDO garante que o paciente tome a medicação conforme prescrito, eliminando o principal fator de abandono (melhora clínica leva o paciente a se sentir \"curado\" antes do fim do tratamento). Mecanisticamente, a interrupção precoce elimina a população A (bactericida), mas preserva as populações B e C (persistentes) — que podem reativar com mutantes selecionados pela exposição subótima aos fármacos." },
      { q: "Cite os critérios de encerramento como cura no tratamento da TB.", a: "(1) Completar o esquema terapêutico (todas as doses dentro do prazo). (2) Pelo menos duas baciloscopias negativas — uma durante o acompanhamento e outra ao final. (3) Melhora clínica e radiológica. Na prática, o critério mais importante é a completude do tratamento, pois pacientes paucibacilares podem não ter baciloscopia para positivar. Raciocínio crítico e armadilhas" },
      { q: "Em quais adolescentes pode-se usar o esquema de 4 meses para TB?", a: "Apenas de 10-16 anos com TB pulmonar não grave, baciloscopia/TRM negativo e sem cavitação. Adolescentes com baciloscopia positiva ou cavitação mantêm o esquema de 6 meses." },
      { q: "Por que a silicose aumenta o risco de TB em 30 vezes e qual a implicação clínica?", a: "O quartzo (SiO₂) inalado é fagocitado por macrófagos alveolares e causa sua morte por lise lisossômica. Isso libera enzimas proteolíticas que perpetuam a inflamação e comprometem a capacidade microbicida — exatamente a defesa que contém o M. tuberculosis no granuloma. Implicação: todo silicótico deve ser rastreado para ILTB (PT ou IGRA), e o limiar para tratamento é mais baixo (PT ≥ 10mm)." },
      { q: "Se um paciente com TB pleural tem baciloscopia de escarro negativa, isso exclui TB?", a: "Não. A TB pleural é tipicamente paucibacilar — a baciloscopia do líquido pleural é positiva em apenas ~5% e a do escarro pode ser negativa mesmo com TB pulmonar concomitante. O diagnóstico depende de ADA > 40 U/L (sens. 93%, esp. 97%) e/ou biópsia pleural (granuloma caseoso 70-80%). Solicitar cultura do líquido pleural e do fragmento de biópsia." },
      { q: "Por que a negativação da baciloscopia no 2º mês não garante a cura da TB?", a: "A negativação da baciloscopia ao 2º mês reflete a eliminação da população A (cavitária), mas NÃO informa sobre as populações B e C (persistentes). Um paciente pode negativar rapidamente e ainda ter bacilos dormentes/persistentes que causarão recidiva se o tratamento for encurtado. A cura depende da atividade esterilizante (R + Z), que age sobre populações não detectáveis pela baciloscopia." },
      { q: "Qual o paradoxo clínico da SIR e como diferenciá-la de falência terapêutica?", a: "Na SIR, o paciente PIORA (febre, linfadenomegalia, infiltrado pulmonar) apesar de estar recebendo tratamento eficaz — é a recuperação imune pelo TARV que gera resposta inflamatória exagerada. Na falência, a piora se acompanha de baciloscopia persistentemente positiva e/ou resistência detectada no TS. A chave é a cultura: na SIR, a cultura é negativa ou mostra queda de UFC; na falência, permanece positiva." },
      { q: "Explique por que tratar a ILTB é essencial para o controle epidemiológico da TB, usando o conceito de \"reservatório\".", a: "Os ~1,8 bilhão de infectados mundialmente constituem o \"reservatório\" de onde emergem os ~10 milhões de casos anuais. Tratar apenas os doentes (TB ativa) interrompe a transmissão imediata, mas não esvazia o reservatório — 90% dos infectados podem reativar décadas depois. Sem tratamento da ILTB, novos casos continuam surgindo independentemente de quanto se trate os doentes." },
      { q: "Construa a cadeia lógica: mecanismo de ação da pirazinamida → pH ácido → população-alvo → fase do tratamento → objetivo terapêutico.", a: "Pirazinamida é um pró-fármaco convertido em ácido pirazinóico pela enzima pirazinamidase → ativa apenas em pH ácido (intracelular e caseo) → age principalmente sobre populações B (caseosa) e C (intramacrofágica), que estão em meio ácido → usada na fase intensiva (primeiros 2 meses), quando a inflamação é máxima e o meio é mais acidificado → objetivo: atividade esterilizante (matar bacilos persistentes e prevenir recidiva)." },
      { q: "Por que o esquema 2RHZE/4RH usa 4 fármacos na fase intensiva e apenas 2 na manutenção?", a: "Na fase intensiva, a carga bacilar é máxima (10⁷-10⁹ na população A) → o risco de seleção de mutantes resistentes é alto → necessidade de 4 fármacos para cobrir todos os mutantes naturais. Na fase de manutenção, a carga já foi drasticamente reduzida (negativação do escarro) → a probabilidade de resistência com apenas R+H é baixa → e Z e E já cumpriram seus papéis (Z como esterilizante nos 2 primeiros meses; E como protetor contra resistência)." },
      { q: "Qual a diferença entre recidiva, reinfecção e falência no contexto da TB, e por que a distinção importa?", a: "Recidiva: TB que retorna após tratamento completo e cura, por reativação de bacilos persistentes (falha esterilizante). Reinfecção: nova infecção por exposição a um novo caso, com cepa potencialmente diferente. Falência: tratamento em curso sem melhora (baciloscopia positiva ao 4º-5º mês, ou positiva por 2 meses consecutivos após negativação). A distinção importa porque: recidiva e reinfecção repetem o Esquema Básico (se sensível); falência sugere resistência → encaminhar para esquema especial." },
      { q: "Monte o raciocínio para decidir entre PT ≥ 5mm e PT ≥ 10mm como ponto de corte para tratar ILTB.", a: "O corte mais baixo (≥ 5mm) é usado em grupos com maior risco de progressão (PVHIV, contatos, imunossuprimidos) — o benefício do tratamento é maior e supera os riscos. O corte ≥ 10mm é para grupos com risco intermediário (profissionais de saúde, silicóticos, diabéticos) — o benefício existe, mas o risco de hepatotoxicidade do tratamento precisa ser ponderado. A lógica é: quanto maior o risco de adoecimento, menor o corte para tratar." },
      { q: "Qual a relação entre a indução do CYP450 pela rifampicina e o conceito de ajuste terapêutico na coinfecção TB-HIV?", a: "A rifampicina induz intensamente o CYP3A4, acelerando o metabolismo de IP (~90% de redução) e DTG (~50%). Se os níveis de ARV caírem abaixo do limiar terapêutico, o HIV replica com supressão parcial → seleção de mutantes resistentes. Soluções: (1) usar EFV (menos afetado); (2) usar rifabutina (menor indução); (3) duplicar a dose de DTG (50mg 2×/dia com R). A interação é bidirecional: a escolha do ARV é constrangida pelo anti-TB e vice-versa." },
      { q: "Por que a meta de examinar ≥ 90% dos contatos é tão importante para o controle da TB?", a: "Porque os contatos recentes de caso bacilífero são a população com maior probabilidade de estar infectada (30-50% dos contatos domiciliares) e maior risco de progressão (nos primeiros 2 anos). Identificá-los e tratar a ILTB antes que adoeçam é a ação preventiva com maior impacto — cada caso prevenido interrompe uma futura cadeia de transmissão." },
      { q: "Qual a importância clínica da fórmula de Cockcroft-Gault no manejo da TB em nefropatas?", a: "A fórmula estima o clearance de creatinina: [(140 - idade) × peso] / [72 × creatinina sérica] (× 0,85 em mulheres). Se ClCr < 30 mL/min, fármacos de excreção renal (etambutol, pirazinamida, aminoglicosídeos) precisam de ajuste de dose e frequência (geralmente 3×/semana em vez de diária). Toda medicação deve ser tomada APÓS a diálise para evitar remoção do fármaco." },
      { q: "Explique o racional da corticoterapia adjuvante na TB meningoencefálica.", a: "A mortalidade na TB meningoencefálica é de 20-50%, em grande parte por edema cerebral e processo inflamatório meníngeo intenso. Os corticoides (dexametasona ou prednisona) reduzem essa inflamação, diminuem o edema cerebral e a hipertensão intracraniana. uma das poucas indicações de corticoide com benefício comprovado em doença infecciosa." },
      { q: "Em quais crianças com TB NÃO se pode usar o esquema de 4 meses?", a: "Nas com TB grave: cavitação, doença bilateral extensa, miliar, formas extrapulmonares graves (meningoencefálica, osteoarticular) ou imunossupressão descontrolada. O esquema de 4 meses vale só para TB pulmonar não grave em crianças HIV-negativas ou estáveis em TARV." },
      { q: "Qual a diferença entre a classificação de segurança na gestação \"A\" (rifampicina) e \"B\" (pirazinamida)?", a: "Categoria A: estudos controlados em humanas demonstraram ausência de risco fetal — a rifampicina tem dados extensos de segurança em gestantes. Categoria B: estudos em animais não mostraram risco, mas não há estudos controlados em humanas — a pirazinamida é \"presumivelmente segura\" por extrapolação de dados animais. Apesar da diferença, ambas são consideradas seguras para uso na gestação." },
      { q: "Por que o abandono precoce do tratamento (aos 2-3 meses) é mecanisticamente diferente do abandono tardio (aos 5 meses)?", a: "Abandono aos 2-3 meses: a fase intensiva pode ter eliminado a população A (bactericida), mas as populações B e C estão intactas → alto risco de recidiva em meses a anos, possivelmente com resistência adquirida. Abandono aos 5 meses: a fase intensiva FOI completada e grande parte da manutenção também → as populações B e C foram parcialmente eliminadas → o risco de recidiva existe, mas é menor. Em ambos, o paciente retorna ao Esquema Básico." },
      { q: "Qual a implicação prática de saber que a cultura em MGIT dá resultado em 5-12 dias vs. 14-30 dias em Löwenstein-Jensen?", a: "O MGIT (sistema automatizado em meio líquido) detecta crescimento bacilar por fluorescência 2-3× mais rápido que o LJ. Na prática, isso permite: (1) confirmação diagnóstica mais rápida em casos paucibacilares; (2) resultado de teste de sensibilidade mais precoce para orientar ajuste terapêutico; (3) menor tempo de espera em casos suspeitos de resistência. O MGIT é preferível quando disponível, mas é mais caro e menos acessível na rede básica." },
      { q: "Diferencie \"conversão\" de \"viragem\" da PT e explique por que a viragem indica tratamento de ILTB.", a: "Conversão e viragem são usados de forma intercambiável para descrever a mudança de PT negativa para positiva (aumento ≥ 10mm em relação à PT anterior), indicando infecção recente pelo M. tuberculosis. Isso importa porque os primeiros 2 anos após a infecção são o período de maior risco de progressão para TB ativa (5% de risco) — o tratamento de ILTB nesse momento tem o maior benefício preventivo." },
      { q: "Por que a doença renal crônica em diálise confere risco 10-25× maior de TB?", a: "A uremia crônica causa disfunção imune abrangente: redução da ativação de linfócitos T, comprometimento da fagocitose macrofágica, diminuição de citocinas Th1 (IFN-γ, TNF-α), e desnutrição crônica. A diálise adiciona exposição frequente a ambiente hospitalar e procedimentos invasivos. Implicação clínica: rastrear ILTB em todo paciente em diálise e tratar com limiar baixo (PT ≥ 10mm)." },
      { q: "Qual a importância da dose fixa combinada (DFC) no esquema 2RHZE/4RH e o que se perde quando se usa rifabutina?", a: "A DFC reúne 2-4 fármacos em um único comprimido calibrado por faixa de peso. Vantagens: simplifica a prescrição, reduz erro de dose, impede monoterapia acidental (se o paciente decidir tomar \"apenas um comprimido\") e melhora a adesão. Com rifabutina, não existe DFC — o paciente precisa tomar cada fármaco separadamente, aumentando o número de comprimidos e o risco de erro e abandono." }
    ]
