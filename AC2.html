<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC2 - Flashcards</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-2: #0a0a0f;
    --panel: #0f1420;
    --panel-2: #1a2333;
    --border: #1e2a44;
    --border-hover: #2d4166;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-3: #1d4ed8;
    --accent-glow: rgba(59,130,246,.35);
    --text: #f8fafc;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #10b981;
    --ok-glow: rgba(16,185,129,.3);
    --err: #ef4444;
    --err-glow: rgba(239,68,68,.3);
    --warn: #f59e0b;
    --shadow: 0 20px 50px rgba(0,0,0,.6);
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(29,78,216,.06) 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
    display: flex;
  }

  /* Sidebar */
  aside.sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: linear-gradient(180deg, rgba(15,20,32,.6), rgba(0,0,0,.9));
    border-right: 1px solid var(--border);
    padding: 60px 20px 24px;
    display: flex; flex-direction: column;
    position: sticky; top: 0;
    backdrop-filter: blur(10px);
    transition: margin-left .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden aside.sidebar { margin-left: calc(var(--sidebar-w) * -1); }
  main { transition: max-width .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden main { max-width: 100vw; }
  body.no-transition aside.sidebar,
  body.no-transition main { transition: none !important; }

  .sidebar-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 100;
    width: 36px; height: 36px;
    padding: 0;
    background: rgba(15,20,32,.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .sidebar-toggle:hover {
    color: var(--accent-2);
    border-color: var(--accent);
    background: rgba(59,130,246,.15);
  }
  .sidebar-toggle svg { transition: transform .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden .sidebar-toggle svg { transform: rotate(180deg); }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted-2);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .5px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    margin-bottom: 20px;
    align-self: flex-start;
    transition: all .2s;
  }
  .back-link:hover { color: var(--accent-2); background: var(--panel); border-color: var(--border); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-2px); }

  .brand {
    text-align: center;
    padding-bottom: 24px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 52px;
    letter-spacing: 4px;
    font-weight: 700;
    background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .brand .sub {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 500;
  }

  .tabs {
    display: flex; flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
  }
  .tabs-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px 8px;
    font-weight: 600;
  }
  .tab {
    background: transparent;
    color: var(--muted-2);
    border: 1px solid transparent;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    display: flex; align-items: center; justify-content: space-between;
    font-family: inherit;
    transition: all .2s cubic-bezier(.4,.2,.2,1);
    position: relative;
  }
  .tab:hover { background: var(--panel); color: var(--text); border-color: var(--border); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .tab.active::before {
    content: ''; position: absolute; left: -20px; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 24px;
    background: var(--accent-2);
    border-radius: 0 3px 3px 0;
  }
  .tab .count {
    background: rgba(255,255,255,.1);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .tab.active .count { background: rgba(255,255,255,.2); }

  /* Main */
  main {
    flex: 1;
    padding: 40px 48px;
    max-width: calc(100vw - var(--sidebar-w));
    display: flex; flex-direction: column;
  }
  .empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--muted-2);
    margin: auto;
  }
  .empty h2 { color: var(--text); font-weight: 600; font-size: 22px; margin-bottom: 8px; }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 24px;
  }
  .deck-title {
    font-size: 18px; font-weight: 700; color: var(--text);
    letter-spacing: .3px;
  }
  .deck-progress-num {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--muted-2); font-size: 14px; font-weight: 500;
  }
  .deck-progress-num .curr { color: var(--accent-2); font-weight: 700; font-size: 16px; }

  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: all .15s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--border-hover); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px var(--accent-glow); }

  .progress-bar {
    height: 4px; background: var(--panel);
    border-radius: 999px; overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
    transition: width .3s ease;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .card-container {
    perspective: 1600px;
    margin: 0 auto; width: 100%; max-width: 780px;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .card-anim {
    width: 100%;
    position: relative;
    will-change: transform, opacity;
  }
  .card-anim.enter-right { animation: enterRight .45s cubic-bezier(.34,1.2,.64,1) both; }
  .card-anim.enter-left  { animation: enterLeft  .45s cubic-bezier(.34,1.2,.64,1) both; }
  .card-anim.enter-up    { animation: enterUp    .5s  cubic-bezier(.34,1.2,.64,1) both; }
  .card-anim.exit-left   { animation: exitLeft   .35s cubic-bezier(.4,.15,.6,1) forwards; }
  .card-anim.exit-right  { animation: exitRight  .35s cubic-bezier(.4,.15,.6,1) forwards; }
  .card-anim.exit-up     { animation: exitUp     .4s  cubic-bezier(.4,.15,.6,1) forwards; }
  .card-anim.exit-down   { animation: exitDown   .4s  cubic-bezier(.4,.15,.6,1) forwards; }

  @keyframes enterRight {
    from { transform: translateX(60%) scale(.92); opacity: 0; }
    to   { transform: translateX(0)   scale(1);   opacity: 1; }
  }
  @keyframes enterLeft {
    from { transform: translateX(-60%) scale(.92); opacity: 0; }
    to   { transform: translateX(0)    scale(1);   opacity: 1; }
  }
  @keyframes enterUp {
    from { transform: translateY(30px) scale(.95); opacity: 0; }
    to   { transform: translateY(0)    scale(1);   opacity: 1; }
  }
  @keyframes exitLeft {
    to { transform: translateX(-70%) rotate(-4deg) scale(.9); opacity: 0; }
  }
  @keyframes exitRight {
    to { transform: translateX(70%) rotate(4deg) scale(.9); opacity: 0; }
  }
  @keyframes exitUp {
    to { transform: translateY(-100%) scale(.85); opacity: 0; }
  }
  @keyframes exitDown {
    to { transform: translateY(100%) scale(.85); opacity: 0; }
  }

  /* Flash overlay for correct/wrong */
  .flash-overlay {
    position: absolute; inset: -20px;
    border-radius: 24px;
    pointer-events: none;
    opacity: 0;
  }
  .flash-overlay.ok  { animation: flashOk  .55s ease-out forwards; }
  .flash-overlay.err { animation: flashErr .55s ease-out forwards; }
  @keyframes flashOk {
    0%   { opacity: 0; box-shadow: 0 0 0 0 rgba(16,185,129,0), inset 0 0 0 0 rgba(16,185,129,0); }
    30%  { opacity: 1; box-shadow: 0 0 80px 20px rgba(16,185,129,.6), inset 0 0 60px 0 rgba(16,185,129,.3); }
    100% { opacity: 0; box-shadow: 0 0 120px 40px rgba(16,185,129,0), inset 0 0 100px 0 rgba(16,185,129,0); }
  }
  @keyframes flashErr {
    0%   { opacity: 0; box-shadow: 0 0 0 0 rgba(239,68,68,0), inset 0 0 0 0 rgba(239,68,68,0); }
    30%  { opacity: 1; box-shadow: 0 0 80px 20px rgba(239,68,68,.6), inset 0 0 60px 0 rgba(239,68,68,.3); }
    100% { opacity: 0; box-shadow: 0 0 120px 40px rgba(239,68,68,0), inset 0 0 100px 0 rgba(239,68,68,0); }
  }

  .card {
    position: relative;
    width: 100%; min-height: 380px;
    cursor: pointer;
    will-change: transform, opacity, filter;
    transition: box-shadow .25s;
  }
  .card > .face {
    opacity: 0;
    pointer-events: none;
    transition: none;
  }
  .card > .front { opacity: 1; pointer-events: auto; }
  .card.flipped > .front { opacity: 0; pointer-events: none; }
  .card.flipped > .back  { opacity: 1; pointer-events: auto; }

  .card.blinking { animation: cardBlink .4s cubic-bezier(.55,.05,.45,1); }
  @keyframes cardBlink {
    0%   { opacity: 1; transform: scale(1);    filter: blur(0);   }
    45%  { opacity: 0; transform: scale(.88);  filter: blur(6px); }
    55%  { opacity: 0; transform: scale(.88);  filter: blur(6px); }
    100% { opacity: 1; transform: scale(1);    filter: blur(0);   }
  }

  .card:not(.blinking):hover { transform: translateY(-3px); }
  .card:not(.blinking):not(.flipped):hover .face.front { box-shadow: 0 24px 60px rgba(0,0,0,.7), 0 0 30px rgba(59,130,246,.25); }
  .card:not(.blinking).flipped:hover .face.back { box-shadow: 0 24px 60px rgba(0,0,0,.7), 0 0 40px var(--accent-glow); }
  .card .face {
    position: absolute; inset: 0;
    padding: 40px 44px;
    border-radius: 20px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .card .front {
    background: linear-gradient(145deg, #0f1420 0%, #0a0e18 100%);
  }
  .card .back {
    background: linear-gradient(145deg, #1d4ed8 0%, #1e40af 60%, #172554 100%);
    border-color: var(--accent);
    box-shadow: 0 20px 50px rgba(0,0,0,.6), 0 0 40px var(--accent-glow);
  }
  .card .label {
    position: absolute; top: 20px; left: 24px;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 3px; color: var(--muted-2);
    font-weight: 700;
  }
  .card .back .label { color: rgba(255,255,255,.7); }
  .card .content {
    font-size: clamp(17px, 2.1vw, 21px);
    line-height: 1.6;
    max-height: 100%; overflow-y: auto;
    padding: 24px 8px;
    font-weight: 400;
  }
  .card .hint {
    position: absolute; bottom: 16px; right: 24px;
    font-size: 10px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .card .back .hint { color: rgba(255,255,255,.5); }

  /* Directional hints below card */
  .keymap {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 780px;
    margin: 24px auto 0;
  }
  .key {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    color: var(--muted-2);
    font-size: 12px;
    font-weight: 500;
  }
  .key:hover { background: var(--panel-2); color: var(--text); border-color: var(--border-hover); transform: translateY(-2px); }
  .key:active { transform: translateY(0) scale(.96); }
  .key.pressed { animation: keyPress .35s ease-out; }
  @keyframes keyPress {
    0%   { transform: scale(1); }
    40%  { transform: scale(.92); box-shadow: 0 0 0 4px currentColor; }
    100% { transform: scale(1); }
  }
  .key .icon {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700; line-height: 1;
    color: var(--text);
    transition: transform .2s;
  }
  .key:hover .icon { transform: scale(1.1); }
  .key.err:hover { border-color: var(--err); color: var(--err); box-shadow: 0 8px 20px var(--err-glow); }
  .key.err:hover .icon { color: var(--err); transform: scale(1.15) translateY(2px); }
  .key.ok:hover { border-color: var(--ok); color: var(--ok); box-shadow: 0 8px 20px var(--ok-glow); }
  .key.ok:hover .icon { color: var(--ok); transform: scale(1.15) translateY(-2px); }
  .key.disabled { opacity: .35; cursor: not-allowed; }
  .key.disabled:hover { transform: none; background: var(--panel); }

  /* End screen */
  .end-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: auto; text-align: center;
    max-width: 560px;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .end-screen h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px; font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -.5px;
    animation: slideDown .6s .1s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen .subtitle {
    color: var(--muted-2); font-size: 15px;
    margin-bottom: 40px;
    animation: slideDown .6s .2s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen .donut { animation: scaleIn .7s .35s cubic-bezier(.34,1.4,.64,1) both; }
  .end-screen .badge { animation: bounceIn .6s .8s cubic-bezier(.34,1.6,.64,1) both; }
  .end-screen .end-stat:nth-child(1) { animation: slideUp .5s 1.0s cubic-bezier(.34,1.2,.64,1) both; }
  .end-screen .end-stat:nth-child(2) { animation: slideUp .5s 1.1s cubic-bezier(.34,1.2,.64,1) both; }
  .end-screen .end-stat:nth-child(3) { animation: slideUp .5s 1.2s cubic-bezier(.34,1.2,.64,1) both; }
  .end-screen .end-actions { animation: slideUp .5s 1.35s cubic-bezier(.34,1.2,.64,1) both; }

  @keyframes slideDown  { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp    { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes scaleIn    { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes bounceIn {
    0%   { opacity: 0; transform: scale(.3); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  .donut .pct { animation: pulseGlow 2.5s ease-in-out infinite; }
  @keyframes pulseGlow {
    0%,100% { filter: drop-shadow(0 0 8px var(--accent-glow)); }
    50%     { filter: drop-shadow(0 0 20px var(--accent-glow)); }
  }
  .donut {
    width: 240px; height: 240px;
    margin-bottom: 32px; position: relative;
  }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .track { fill: none; stroke: var(--panel); stroke-width: 14; }
  .donut .fill-arc {
    fill: none;
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,.2,.2,1);
  }
  .donut .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut .pct {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 56px; font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .donut .pct-label {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; font-weight: 600;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 32px;
  }
  .badge.excelente { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid var(--ok); }
  .badge.otimo { background: rgba(59,130,246,.15); color: var(--accent-2); border: 1px solid var(--accent); }
  .badge.regular { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid var(--warn); }
  .badge.melhorar { background: rgba(239,68,68,.15); color: var(--err); border: 1px solid var(--err); }

  .end-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 100%; max-width: 480px;
    margin-bottom: 32px;
  }
  .end-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
  }
  .end-stat .val {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; font-weight: 700;
    line-height: 1;
  }
  .end-stat.correct .val { color: var(--ok); }
  .end-stat.wrong .val { color: var(--err); }
  .end-stat .lbl {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 8px; font-weight: 600;
  }
  .end-actions { display: flex; gap: 12px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  /* Responsive */
  @media (max-width: 900px) {
    body { flex-direction: column; }
    aside.sidebar { width: 100%; min-height: auto; position: relative; padding: 60px 20px 20px; }
    body.sidebar-hidden aside.sidebar { margin-left: 0; display: none; }
    .brand h1 { font-size: 40px; }
    .brand { padding-bottom: 16px; margin-bottom: 16px; }
    .tabs { flex-direction: row; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
    .tabs-label { display: none; }
    .tab { flex-shrink: 0; }
    .tab.active::before { display: none; }
    main { padding: 24px 16px; max-width: 100%; }
    .card .face { padding: 24px; }
    .keymap { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<script>
  try { if (localStorage.getItem('sidebarHidden') === '1') { document.body.classList.add('sidebar-hidden','no-transition'); requestAnimationFrame(() => document.body.classList.remove('no-transition')); } } catch (e) {}
</script>

<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Alternar barra lateral" title="Alternar barra lateral (B)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <line x1="9" y1="4" x2="9" y2="20"/>
  </svg>

      { q: "Qual o primeiro marcador a positivar na hepatite C aguda?", a: "HCV-RNA (poucos dias a 8 semanas após exposição). Em acidentes perfurocortantes, PCR negativo em 2 semanas teve VPN de 100%." },
      { q: "Definição de hepatite fulminante?", a: "Lesão hepática aguda grave com encefalopatia + INR ≥1,5. HAV: <1% (mais em >50 anos). HBV aguda: 0,1-0,5%." },
      { q: "Superinfecção HAV sobre HCV crônico: qual o risco?", a: "Em 17 pacientes com HCV que adquiriram HAV, 7 (41%) desenvolveram falência hepática fulminante e 6 morreram. Justifica vacinação anti-HAV em hepatopatia crônica." },
      { q: "Quais as três formas atípicas da hepatite A?", a: "1) Colestática (<5%, bilirrubina >10, dura >3 meses, ultrassom para excluir obstrução, sem corticoide, colestiramina se prurido); 2) Recidivante (até 10%, IgM persiste, HAV nas fezes = infectante); 3) Autoimune desencadeada." },
      { q: "Manifestações extra-hepáticas da hepatite A?", a: "Exantema e artralgia em 10-15%. Raras: vasculite leucocitoclástica, artrite, glomerulonefrite, crioglobulinemia, neurite óptica, mielite transversa, aplasia pura da série vermelha." },

      { q: "Por que não se trata a maioria das hepatites B agudas?", a: "Fulminante <1%, cronificação <5% em adultos imunocompetentes. Tratar todos exporia >95% a fármaco sem indicação. Tratamento é apenas de suporte na maioria." },
      { q: "Indicações de antiviral na hepatite B aguda?", a: "1) Grave (INR >1,5); 2) Protraída (bilirrubina >10 mg/dL por >4 semanas); 3) Fulminante; 4) Imunocomprometidos, coinfecção C/D, hepatopatia prévia, idosos." },

      { q: "Por que APRI e FIB-4 falsamente elevam na hepatite C aguda?", a: "Ambos usam AST/ALT no numerador. Na hepatite aguda as transaminases estão em milhares, elevando o escore sem que exista mais colágeno no fígado. Elastografia também sobe falsamente." },

      { q: "Como suspeitar de doença de Wilson vs hepatite viral?", a: "Jovem, AST/ALT >2, transaminases <2000, hemólise Coombs-negativa, ceruloplasmina e cobre alterados, anéis de Kayser-Fleischer." },

      { q: "Definição de reagudização (flare) da hepatite B crônica?", a: "Elevações intermitentes de aminotransferase a >10× LSN e >2× o valor de base." },

      { q: "Sobrevida na cirrose por HBV?", a: "Compensada: 85% em 5 anos. Descompensada: 55-70% em 1 ano; 14-35% em 5 anos." },

      { q: "Fatores associados a maior clareamento espontâneo do HCV?", a: "Infecção sintomática, idade jovem na aquisição, sexo feminino, genótipo 1, polimorfismos IFN-lambda 4, HBV crônico/resolvido. Coinfecção HIV → persistência." },
      { q: "Quando ocorre a maior parte do clareamento espontâneo do HCV?", a: "88% dentro de 12 semanas (último caso em 14 semanas). Estudo InC3: 25% clarearam em 1 ano; 34%, 67% e 83% em 3, 6 e 12 meses." },
      { q: "Quando pensar em superinfecção HBV+HDV?", a: "Curso mais grave e maior risco de fulminante. HDV sempre exige HBV para replicar. Superinfecção HDV em portador de HBV: suprime replicação do HBV e acelera progressão para cirrose." },
      { q: "Regra prática das coinfecções em hepatites virais?", a: "Todo HBV → investigar HDV, HCV, HIV. Todo HCV → dosar HBsAg e anti-HBc antes de DAA. Todo hepatopata crônico → vacinar contra HAV (testar anti-HAV antes em país de alta prevalência)." },

      { q: "Argumentos para tratar hepatite C aguda cedo?", a: "1) Risco de perda de seguimento; 2) Transmissão contínua em quem mantém risco; 3) Potencial de HCV aguda grave. Recomenda-se tratamento imediato à documentação de viremia." },

      { q: "Por que a carga trombótica angiográfica não é usada para estratificar?", a: "Classe 3 (Sem benefício, B-NR). Meta-análise de 19 estudos: sem correlação — na verdade, maior mortalidade com índice de obstrução MENOR (OR 2,24). O que mata é a resposta do VD, não o volume de coágulo." },

      { q: "Quais os 4 instrumentos de probabilidade pré-teste aceitos?", a: "Wells (padrão e modificado), PERC, Genebra revisado, Gestalt clínico. Todos validados para os estratos <15%, 15-50%, >50%." },
      { q: "Componentes do Wells para TEP?", a: "Sinais de TVP (3), TEP mais provável (3), FC>100 (1,5), imobilização/cirurgia ≤4 sem (1,5), TVP/TEP prévio (1,5), hemoptise (1), câncer (1). Padrão: baixo <2, moderado 2-6, alto >6. Modificado: improvável ≤4, provável >4." },
      { q: "Quando aplicar o PERC?", a: "Somente quando a probabilidade pré-teste (gestalt) já é <15% (ex: Wells<2). Com todos os 8 critérios cumpridos, TEP está excluído sem nenhum outro teste." },
      { q: "Quais os 8 critérios do PERC?", a: "Idade <50, FC<100, SatO₂≥95%, sem hemoptise, sem estrogênio, sem TVP/TEP prévio, sem edema unilateral, sem cirurgia/trauma com hospitalização em 4 sem." },
      { q: "Quando um TEP é considerado improvável pelo D-dímero?", a: "3 critérios simultâneos: (1) D-dímero abaixo do limiar; (2) probabilidade pré-teste baixa ou intermediária (<50%); (3) paciente NÃO anticoagulado." },
      { q: "Como aplicar o D-dímero ajustado à idade?", a: "Limiar = idade × 10 µg/L em pacientes >50 anos. Aplicável a probabilidade baixa/intermediária. Taxa de falha 0,3% em 3 meses." },
      { q: "Como funciona o algoritmo YEARS?", a: "3 itens: sinais de TVP, hemoptise, TEP é o diagnóstico mais provável. 0 itens → limiar 1000 µg/L; ≥1 item → limiar 500 µg/L (ou ajustado à idade). Só validado em não anticoagulados." },
      { q: "YEARS adaptado à gestação?", a: "Limiar 1000 µg/L nas de menor risco. Falha 0-0,21% em 3 meses. Evita ~65% das angio-TC no 1º trimestre. Gestante com sintomas em MMII + USG compressão + → tratar sem angio-TC." },
      { q: "Qual exame de imagem é preferido para TEP?", a: "Angio-TC de tórax (CTPA) — Classe 1, B-R. Detecta TEP periférico, avalia VD, dá diagnósticos alternativos. V/Q em quem não pode fazer CTPA." },
      { q: "Quando NÃO fazer angio-TC?", a: "Quando probabilidade é baixa e D-dímero negativo/ajustado exclui TEP. Ou quando o algoritmo (YEARS, PERC) resolve o caso." },
      { q: "Ecocardiograma é usado para diagnosticar TEP?", a: "NÃO. Classe 3 (Sem benefício). A maioria dos TEP não tem disfunção de VD; sinais têm baixa sensibilidade. O eco estratifica risco, não faz diagnóstico." },
      { q: "Ultrassonografia venosa após CTPA negativa?", a: "NÃO é útil. Classe 3 (Sem benefício, B-NR). Não identifica mais TEP." },
      { q: "O que deve ser relatado na CTPA para categorizar?", a: "Razão VD/VE numérica, medida por diâmetro interno em corte axial ou reformatação de 4 câmaras. Corte VD/VE ≥1,0: sens 85%, esp 72%." },
      { q: "Parâmetros ecocardiográficos definidores de disfunção de VD?", a: "VD/VE >0,9; diâmetro diastólico basal do VD ≥41 mm; TAPSE <1,7 cm; TDI S' <9,5 cm/s; velocidade de regurgitação tricúspide ≥2,9 m/s sugere HP." },
      { q: "O que é o sinal de McConnell?", a: "Hipocinesia da parede livre do VD com preservação do ápice ao ecocardiograma. Sugere sobrecarga aguda do VD." },
      { q: "Componentes do PESI?", a: "Idade em anos (pontos), sexo M (10), câncer (30), IC (10), DPOC (10), FC≥110 (20), PAS<100 (30), FR≥30 (20), Tº<36 (20), estado mental alterado (60), SatO₂<90% (20). Soma idade + pontos. Classe I ≤65, V ≥126." },
      { q: "Componentes do sPESI?", a: "Idade >80, câncer, doença cardiopulmonar crônica, PAS<100, FC≥110, SatO₂<90%. 1 ponto cada. 0 = baixo risco de mortalidade em 30 dias; ≥1 = alto risco." },
      { q: "Como usar os escores de risco na prática?", a: "PESI/sPESI/Hestia identificam quem tem BAIXO risco (bom VPN) — autorizam manejo ambulatorial. Escore alto NÃO autoriza sozinho terapia avançada." },
      { q: "Quais critérios Hestia impedem manejo ambulatorial?", a: "Qualquer 'sim' a: instabilidade, necessidade de trombólise/embolectomia, sangramento ativo/alto risco, O₂ >24h, TEP durante anticoagulação, dor exigindo analgésico IV >24h, razão social para internar, ClCr<30, disfunção hepática grave, gestante, TIH." },
      { q: "Biomarcadores a medir na Categoria C?", a: "Ao menos um: troponina OU BNP (Classe 1, B-NR). Troponina positiva OR 4,33 para mortalidade geral. BNP OR 6,57 mortalidade curto prazo." },
      { q: "Quando dosar lactato no TEP?", a: "Categorias C a E em ambiente agudo (Classe 1, B-NR). Elevado associa-se a OR 5,13 para mortalidade geral. Detecta hipoperfusão subclínica." },
      { q: "PAM abaixo de qual valor sugere necessidade de escalonar na C3?", a: "PAM <80 mmHg. Corte ótimo por análise ROC: 81,5 mmHg (sens 77,5%, esp 95%, VPN 97,7%)." },
      { q: "Qual a base do tratamento do TEP agudo?", a: "Anticoagulação. Todo o resto (filtro, trombólise, cateter, ECMO) é decidido sobre fatores de risco individuais medidos por biomarcadores, imagem de VD e hemodinâmica." },
      { q: "Quando iniciar anticoagulação empírica antes da imagem?", a: "Suspeita de TEP em Categoria C2 ou superior com baixo risco de sangramento, se imagem estiver atrasada/indisponível (Classe 2a, C-EO)." },
      { q: "HBPM ou HNF para anticoagulação parenteral inicial?", a: "HBPM é recomendada sobre HNF nas Categorias C1-E1 (Classe 1, B-R). Menos recorrência, menos sangramento maior, farmacocinética previsível, dispensa monitorização, menos TIH." },
      { q: "DOAC ou AVK para anticoagulação oral?", a: "DOAC é recomendado sobre AVK, salvo contraindicação (Classe 1, B-R). Menos sangramento maior (especialmente hemorragia intracraniana), menos sangramento fatal, menor mortalidade." },
      { q: "Quando NÃO usar DOAC (usar AVK)?", a: "SAF trombótica estabelecida (triplo-positivo ou trombose arterial) — Classe 1, A. Contraindicação a DOAC na fase estendida sem câncer. Gestação (usar HBPM/HNF). Amamentação (usar HBPM/HNF/varfarina)." },
      { q: "Anticoagulação na gestação?", a: "HBPM ou HNF (Classe 1, C-LD). Não atravessam placenta. HBPM é preferida (previsível, meia-vida maior, menos osteoporose e TIH). DOAC e varfarina são Classe 3: Dano (aborto, anomalias)." },
      { q: "DOAC em hepatopatia crônica por Child-Pugh?", a: "A: DOAC razoável (2a, C-LD). B: DOAC pode ser razoável (2b, C-LD). C: DOAC NÃO recomendado (3: Sem benefício)." },
      { q: "DOAC em DRC?", a: "Estágio 2-3 (TFGe 30-89): DOAC recomendado sobre AVK (1, A). Estágio 4-5/HD: apenas apixabana com dados (2b, B-NR). Depuração renal: dabigatrana 80%, edoxabana 50%, rivaroxabana 33%, apixabana 27%." },
      { q: "Posologia da apixabana no TEP?", a: "Iniciação: 10 mg VO 12/12h por 7 dias. Fase inicial/estendida: 5 mg VO 12/12h. Meia dose na estendida: 2,5 mg VO 12/12h. Fase inicial: 3-6 meses." },
      { q: "Posologia da rivaroxabana no TEP?", a: "Iniciação: 15 mg VO 12/12h por 21 dias. Manutenção: 20 mg VO 1x/dia. Meia dose estendida: 10 mg VO 1x/dia. 15/20 mg exigem alimento." },
      { q: "Edoxabana e dabigatrana têm particularidade no início?", a: "Ambas exigem ≥5 dias de anticoagulação parenteral antes de iniciar." },
      { q: "Alvo do INR ao usar varfarina no TEP?", a: "INR ≥2 antes de suspender a sobreposição com o anticoagulante parenteral." },
      { q: "Quando NÃO monitorar anti-Xa em HBPM?", a: "Maioria dos pacientes em dose por peso. Classe 3 (Sem benefício, A) — não indicada monitorização de rotina para reduzir recorrência ou sangramento." },
      { q: "Quando monitorar anti-Xa e como?", a: "Medir PICO 3-5h após dose, com ≥3 doses (estado estável). Razoável em ClCr<30 (2a, C-LD). Não estabelecido em gestação, IMC>40 e UTI." },
      { q: "Vasopressor de escolha no choque por TEP?", a: "Noradrenalina (Classe 1, C-LD). ≤15 µg/min: aumenta RVS sem elevar RVP. >15 µg/min: pode elevar RVP → adicionar 2º vasopressor (vasopressina, fenilefrina) em vez de escalar." },
      { q: "Volume no TEP com falência de VD?", a: "≤500 mL apenas nas Categorias D1-2 (2b, C-LD). VD é pré-carga dependente MAS já está dilatado. Grandes volumes pioram (estudos animais). Pequenos bolus em normotenso com baixo débito." },
      { q: "Papel da dobutamina no TEP?", a: "Adjuvante à noradrenalina em E1-2 quando débito permanece baixo apesar de vasopressor. Pode ser inicial no choque normotenso (D2). Aumenta IC à custa de queda da RVS." },
      { q: "Óxido nítrico inalado no TEP?", a: "Considerar nas Categorias C2-E (2b, B-R). RCT não atingiu desfecho primário; post-hoc mostrou melhora de VD em 24h. Vasodilatadores sistêmicos NÃO são recomendados (hipotensão)." },
      { q: "Sedação profunda + VM no TEP: qual a classe?", a: "Classe 3: Dano (C-LD) nas Categorias C-E. Reduz tônus adrenérgico, pré-carga do VD, aumenta pós-carga. 19-28% precisaram de RCP pós-indução em séries. Reservar para hipoxemia refratária ou proteção de via aérea." },
      { q: "HFNC vs cateter convencional no TEP com hipoxemia?", a: "HFNC (cateter nasal alto fluxo aquecido) pode ser benéfico (Classe 2a, C-LD). Melhora oxigenação e trabalho respiratório." },
      { q: "Quando instituir VA-ECMO no TEP?", a: "Categoria E2 (choque refratário) — Classe 2a, B-NR. Reduz pré-carga do VD, entrega sangue oxigenado, permite recuperação do VD ou intervenção subsequente." },
      { q: "Anticoagulação em VA-ECMO no TEP?", a: "Continuar anticoagulação sistêmica parenteral na ausência de sangramento (Classe 1, B-NR). Complicações hemorrágicas > trombóticas em ECMO." },
      { q: "Filtro de VCI: quando indicar?", a: "Paciente sem poder receber anticoagulação (2a, B-R). Recuperável é preferido ao permanente (1, B-R). Retirar assim que anticoagulação seja tolerada. NUNCA de rotina em paciente anticoagulado (Classe 3: Dano)." },
      { q: "Prazo para retirar filtro recuperável?", a: "FDA recomenda 29-54 dias após colocação. Retiradas mais difíceis após 50 dias, falhas frequentes após 90 dias. Tempo médio de permanência: 85 dias (sucesso) vs 145 dias (falha)." },
      { q: "Trombólise sistêmica: NNT e NNH?", a: "NNT 59 para evitar 1 morte (OR 0,53) e NNH 78 para causar 1 hemorragia intracraniana (OR 4,6). Meta-análise 16 ensaios, 2115 pacientes." },
      { q: "Dose padrão de alteplase sistêmica no TEP?", a: "100 mg IV em 2 horas. Dose baixa (2b): regimes 25-50 mg. Estreptoquinase e uroquinase saíram da prática (infusões longas). Tenecteplase não é aprovada pelo FDA." },
      { q: "Trombólise sistêmica na Categoria E1-2?", a: "Classe 2a, C-LD (razoável). O cenário em que mais faz sentido mecanisticamente é o menos estudado (difícil randomizar)." },
      { q: "Trombólise sistêmica na Categoria A1-C2?", a: "Classe 3: Dano (B-R). Base: PEITHO — sangramento extracraniano 6,3% vs 1,2%, AVC 2,4% vs 0,2% (10/12 hemorrágicos)." },
      { q: "Quando considerar terapia avançada em D1-D2?", a: "Trombólise sistêmica, CDL, trombectomia mecânica (Classe 2b) — 'pode ser considerada'. Cirurgia: incerto (2b)." },
      { q: "PERT: quando ativar?", a: "Equipe de resposta ao TEP nas Categorias C-E (Classe 1, B-NR). Reduz tempo até anticoagulação terapêutica e uso de filtro. Efeito sobre mortalidade é misto." },
      { q: "Alta hospitalar precoce: em quais Categorias?", a: "A (não precisa internar) e B selecionadas (Classe 2a, B-R). Precisa: baixo risco por Hestia/PESI/sPESI, acesso ao anticoagulante, seguimento rápido. HOME-PE: 38% tratados em casa, taxa composta 1,1-1,3%." },
      { q: "Deve-se estabilizar E antes de transferir?", a: "SIM. Transferir instável antes de estabilizar é Classe 3: Dano (C-EO). Trombólise sistêmica não deve ser retardada pela transferência." },
      { q: "Deambulação precoce vs repouso no leito?", a: "Encorajar deambulação precoce (Classe 2a, A). Meta-análise 3048 pacientes: menor incidência de novo TEP, menor mortalidade, reduz estase venosa." },
      { q: "Recorrência sob anticoagulação: qual a conduta?", a: "1) Documentar por imagem; 2) Investigar não adesão, dose subterapêutica, interações, absorção, condições associadas (câncer, SAF); 3) Trocar de classe é razoável (2a, C-EO); dose reduzida → voltar à plena; câncer sob HBPM → escalonar 20-25%." },
      { q: "3 categorias de fatores de risco de recorrência (Tabela 9)?", a: "1) Maior reversível (cirurgia ≥30 min, hospitalização ≥72h, cesariana, fratura MMII, trauma com imobilidade); 2) Menor reversível (cirurgia <30 min, hospitalização <72h, estrogênio, gestação); 3) Persistente (câncer ativo, autoimune, DII, imobilidade crônica)." },
      { q: "Duração de anticoagulação por fator?", a: "Maior reversível: suspender após 3-6 meses (1, B-NR). Sem fator identificável: estender (1, A) — recorrência 30-40% em 10 anos. Persistente: estender (1, C-LD). Menor reversível: decisão compartilhada." },
      { q: "Fase estendida: qual dose de DOAC?", a: "Meia dose recomendada de apixabana ou rivaroxabana (Classe 1, A). Ensaio RENOVE: recorrência similar (2,2% vs 1,8%), sangramento menor (9,9% vs 15,2%)." },
      { q: "Fase estendida em câncer: qual anticoagulante?", a: "DOAC OU HBPM, ambos preferidos ao AVK (Classe 1, A). HBPM: menos recorrência que varfarina, sangramento semelhante. DOAC não inferior à HBPM." },
      { q: "Rastreio de câncer após TEP não provocado?", a: "História e exame + rastreio apropriado à idade conforme diretrizes nacionais (Classe 1, A). Câncer é diagnosticado em 4-10% no 1º ano. TC/PET-CT de rotina NÃO é recomendado (3: Sem benefício)." },
      { q: "Quando testar trombofilia?", a: "Sem fator maior reversível OU <55 anos, se o resultado mudar manejo ou informar risco familiar (Classe 2b, C-LD). NÃO na fase aguda (consumo de fatores + interferência do anticoagulante). Aconselhamento genético prévio." },
      { q: "Rastreio de CTEPD: quando?", a: "Perguntar sobre sintomas e limitação funcional em toda consulta por pelo menos 1 ano (Classe 1, C-LD). Se dispneia/limitação após ≥3 meses de anticoagulação: avaliação diagnóstica (Classe 1, B-NR)." },
      { q: "Prevalência de CTEPH após TEP agudo?", a: "~3% (2,3-4%). CTEPD sem hipertensão pulmonar é ao menos igualmente prevalente. Até 50% dos pacientes têm dispneia/limitação persistente após 3 meses." },
      { q: "Exames iniciais na investigação de CTEPD?", a: "TTE + cintilografia de perfusão V/Q (Classe 2a, B-NR). TTE isolado é insuficiente: 1/3 dos CTEPH tem TTE normal. VPN da V/Q planar para excluir CTEPD é ~100%." },
      { q: "CPET no rastreio de CTEPD?", a: "Razoável para excluir (2a, B-NR). Padrão-ouro. Achados: VO₂ pico reduzido, pulso de O₂ comprometido, VE/VCO₂ aumentado (ineficiência ventilatória por espaço morto)." },
      { q: "Manter anticoagulação durante investigação de CTEPD?", a: "SIM (Classe 1, B-NR), salvo contraindicação por alto risco de sangramento. Vale mesmo em fator provocador aparentemente transitório." },
      { q: "CTEPD sem HP com sintomas persistentes: qual conduta?", a: "Reabilitação pulmonar (Classe 1, B-R). RCT com 211 pacientes: 8 semanas de exercício supervisionado melhorou capacidade e QV. CTEPH: encaminhar a centro especializado para BPA e/ou PTE." },
      { q: "Meias de compressão em viagens longas após TEP?", a: "≥5 horas: Classe 2a, B-R. Cochrane com 2918 participantes: redução significativa de TVP assintomática." },
      { q: "Aspirina no TEP: quando?", a: "Fase estendida APENAS quando há contraindicação ou recusa a qualquer anticoagulante (Classe 2a, B-R). É inferior ao anticoagulante. Dose: 100 mg 1x/dia." }
    ]
  },
  {
    id: "cirrose-complicacoes",
    name: "Complicações da Cirrose",
    cards: [
      { q: "Quais são as quatro etapas da cascata fisiopatológica da formação de ascite na cirrose?", a: "1) Hipertensão portal com vasodilatação esplâncnica (excesso de NO esplâncnico); 2) Subpreenchimento arterial efetivo (hipovolemia relativa); 3) Ativação do SRAA, SNS e ADH → retenção de sódio/água; 4) Pressão hidrostática sinusoidal + retenção hidrossalina excedem drenagem linfática → líquido acumula na cavidade peritoneal." },
      { q: "Por que a vasodilatação esplâncnica coexiste com vasoconstrição renal no paciente cirrótico?", a: "O excesso de NO e vasodilatadores na circulação esplâncnica causa vasodilatação, enquanto o subpreenchimento arterial resultante ativa sistemas vasoconstritores (SRAA, SNS, vasopressina) que agem preferencialmente na arteríola aferente renal. É o 'paradoxo do NO': excesso esplâncnico e deficiência intra-hepática." },
      { q: "O que é o GASA, como se calcula e qual o valor de corte para hipertensão portal?", a: "GASA = albumina sérica − albumina do líquido ascítico. GASA ≥ 1,1 g/dL indica hipertensão portal com acurácia de ~97%. Substitui a antiga classificação transudato/exsudato." },
      { q: "Quando a paracentese diagnóstica é obrigatória no paciente cirrótico?", a: "Em toda ascite de início recente, em toda admissão hospitalar de cirrótico com ascite, e em qualquer deterioração clínica. É procedimento seguro mesmo com coagulopatia — a coagulopatia da cirrose é 'rebalanceada' e não há necessidade de correção prévia." },
      { q: "Proteína total do líquido ascítico < 1,5 g/dL indica qual risco clínico?", a: "Alto risco de PBE (baixa capacidade de opsonização). É indicação de profilaxia primária com norfloxacino quando associada a outros critérios (Child-Pugh ≥ 9, bilirrubina ≥ 3, creatinina ≥ 1,2, Na ≤ 130). Ascite — Tratamento" },
      { q: "Qual a dose inicial e máxima de espironolactona e furosemida no manejo da ascite grau 2? Qual a proporção entre elas?", a: "Espironolactona: 100 mg/dia → máx 400 mg/dia. Furosemida: 40 mg/dia → máx 160 mg/dia. Proporção 100:40 (espironolactona:furosemida) para manter normocalemia." },
      { q: "Na paracentese de grande volume, quando e como se deve repor albumina?", a: "Se retirada > 5 litros: repor albumina 6-8 g por litro removido. A reposição previne a disfunção circulatória pós-paracentese (DCPP), que se manifesta ~6 dias após com ativação do SRAA, hiponatremia, IRA e risco de morte. Albumina é superior a outros expansores." },
      { q: "Qual a meta de perda de peso diária no tratamento da ascite com diuréticos?", a: "0,5 kg/dia sem edema periférico; 1 kg/dia com edema periférico." },
      { q: "Quais medicamentos devem ser suspensos em pacientes com ascite e por quê?", a: "AINEs (agravam retenção de sódio e podem precipitar SHR-AKI) e IECA/BRA (risco de hipotensão grave e IRA). Ambos são contraindicados na cirrose com ascite." },
      { q: "Quais são os dois tipos de ascite refratária e qual a diferença entre eles?", a: "Resistente a diuréticos: sem resposta à dose máxima (espironolactona 400 mg + furosemida 160 mg) com restrição de sódio adequada. Intratável por diuréticos: impossibilidade de usar doses eficazes por efeitos adversos (EH, hipercalemia, hiponatremia, IRA)." },
      { q: "TIPS vs PGV seriada na ascite refratária: qual é superior e quais são as contraindicações à TIPS?", a: "TIPS é superior em sobrevida livre de transplante (RCTs e metanálises). Contraindicações: EH recorrente/crônica, IC direita, MELD > 18-20, bilirrubina > 5 mg/dL. Complicação principal: EH (30-50%). Usar stents revestidos (PTFE). Peritonite Bacteriana Espontânea" },
      { q: "Qual é o mecanismo central da PBE e quais três fatores convergem?", a: "Translocação bacteriana: bactérias intestinais atravessam a mucosa para linfonodos mesentéricos e alcançam o líquido ascítico. Fatores: 1) Disbiose + aumento da permeabilidade intestinal; 2) Deficiência imunológica (sistema reticuloendotelial, complemento, opsonização reduzidos); 3) Líquido ascítico com baixa atividade antimicrobiana (proteína < 1,5 g/dL)." },
      { q: "Qual o critério diagnóstico de PBE e por que a cultura isolada é insuficiente?", a: "PMN ≥ 250/mm³ no líquido ascítico — independente da cultura. A cultura é positiva em apenas 40-60% dos casos (mesmo inoculada em frasco de hemocultura à beira do leito). Aguardar cultura atrasaria o tratamento." },
      { q: "Como diferenciar PBE de peritonite bacteriana secundária?", a: "Suspeitar de secundária se 2 de 3: proteína > 1 g/dL, glicose < 50 mg/dL, LDH elevada (> limite superior do soro). Na secundária, a flora é polimicrobiana/anaeróbia. Solicitar TC e avaliar intervenção cirúrgica." },
      { q: "Qual o esquema de albumina na PBE e qual evidência o sustenta?", a: "Albumina 1,5 g/kg no dia 1 + 1,0 g/kg no dia 3. Sort et al. (1999, RCT, n=126): redução de IRA de 33% para 10% e mortalidade de 29% para 10%. NNT ~5 para mortalidade. Particularmente importante se bilirrubina > 4 mg/dL ou creatinina > 1 mg/dL." },
      { q: "Quais são as três indicações de profilaxia primária de PBE?", a: "1) Hemorragia digestiva aguda (ceftriaxona 1 g/dia IV, 7 dias); 2) Proteína do LA < 1,5 g/dL + disfunção hepática (norfloxacino 400 mg/dia VO contínuo); 3) Profilaxia secundária após primeiro episódio (norfloxacino 400 mg/dia ou ciprofloxacino 500 mg/dia — contínuo até resolução da ascite, transplante ou óbito)." },
      { q: "Qual a taxa de recidiva de PBE sem profilaxia secundária?", a: "43-69% em 1 ano. Por isso a profilaxia secundária é obrigatória e contínua. Lesão Renal Aguda e SHR" },
      { q: "Quais são os critérios ICA-AKI para definição de AKI no cirrótico?", a: "Aumento da creatinina sérica ≥ 0,3 mg/dL em 48h OU aumento ≥ 50% em relação ao basal (menor valor nos últimos 3 meses). Estadiamento: AKI-1 (≥ 0,3 mg/dL ou 1,5-1,9× basal), AKI-2 (2,0-2,9× basal), AKI-3 (≥ 3× basal ou Cr ≥ 4,0 com aumento agudo ≥ 0,3, ou diálise)." },
      { q: "Quais são as três principais etiologias de AKI no cirrótico e suas proporções?", a: "Pré-renal (40-50%): hipovolemia, diuréticos, sangramento, infecção. NTA (30%): sepse, nefrotóxicos (aminoglicosídeos, AINEs, contraste). SHR-AKI (15-20%): diagnóstico de exclusão, vasoconstrição renal funcional sem lesão estrutural." },
      { q: "Por que a SHR-AKI é chamada de 'diagnóstico de exclusão' e qual é o teste terapêutico obrigatório?", a: "Porque requer: 1) Excluir hipovolemia (testar com albumina 1 g/kg/dia por 2 dias + suspender diuréticos); 2) Excluir choque; 3) Excluir nefrotóxicos; 4) Excluir doença parenquimatosa renal. Se a creatinina não melhora em 48h com albumina, e as outras causas foram afastadas, é SHR-AKI." },
      { q: "Quais são as três opções de vasoconstritores para SHR-AKI, com doses?", a: "1) Terlipressina 1 mg IV 4-6h (até 12 mg/dia) + albumina 20-40 g/dia — primeira linha, resposta completa ~30-40%. 2) Norepinefrina 0,5-3 mg/h IV contínua — requer UTI, eficácia similar em RCTs menores. 3) Midodrina 7,5-12,5 mg 8/8h VO + octreotide 100-200 μg 8/8h SC — alternativa oral, menos eficaz, ponte para transplante." },
      { q: "O que o estudo CONFIRM demonstrou sobre a terlipressina na SHR-AKI?", a: "RCT com n=300: terlipressina reverteu SHR-AKI em 32% vs 17% com placebo (p=0,006), ambos com albumina. Porém houve mais eventos adversos graves, incluindo insuficiência respiratória. A seleção cuidadosa do paciente é crucial." },
      { q: "Em quais situações a diálise está indicada na SHR-AKI?", a: "Apenas como ponte para transplante em: hipercalemia refratária, sobrecarga volêmica, acidose metabólica grave. Não há benefício em pacientes não candidatos a transplante. Encefalopatia Hepática — Classificação e Fisiopatologia" },
      { q: "Qual a diferença entre EH covert e overt segundo os critérios de West Haven?", a: "Covert: mínima (alterações apenas em testes psicométricos) + grau 1 (déficit de atenção, alteração sono-vigília). Overt: grau 2 (letargia, desorientação temporal, asterixis) + grau 3 (estupor, confusão acentuada) + grau 4 (coma). A distinção é clinicamente fundamental: covert tem prevalência de 20-80% e impacta direção e quedas." },
      { q: "Descreva os quatro mecanismos da fisiopatologia da encefalopatia hepática.", a: "1) Amônia + astrócitos: glutamina sintetase converte NH₃+glutamato em glutamina → edema astrocitário osmótico. 2) Neuroinflamação: citocinas (TNF-α, IL-6, IL-1β) ativam micróglia e amplificam neurotoxicidade da amônia. 3) Estresse oxidativo: amônia induz ROS nos astrócitos. 4) Alteração de neurotransmissão: aumento do tônus GABAérgico + benzodiazepínicos endógenos. Isso explica por que infecção (segundo hit) é o precipitante mais potente." },
      { q: "Por que a dosagem sérica de amônia tem valor diagnóstico limitado na EH?", a: "Pode estar normal na EH manifesta (falso-negativo) e elevada sem EH (falso-positivo). A correlação entre nível sérico e grau de EH é fraca. EASL 2022: nível normal levanta dúvida sobre o diagnóstico, mas nível elevado não o confirma. Não deve ser critério isolado de tratamento." },
      { q: "Qual o papel da alcalose metabólica (por diuréticos) na precipitação de EH?", a: "A alcalose converte NH₄⁺ (ionizado, não difusível) em NH₃ (não ionizado, difusível). O NH₃ cruza mais facilmente a barreira hematoencefálica, aumentando a neurotoxicidade. A hipocalemia associada potencia a amoniogênese renal. Encefalopatia Hepática — Diagnóstico e Tratamento" },
      { q: "O que é o Animal Naming Test (ANT) e para que é usado?", a: "Teste de triagem para EH covert: paciente nomeia o máximo de animais em 1 minuto. Ponto de corte: < 15 animais sugere EH covert. É simples, rápido e recomendado pela EASL como ferramenta de consultório." },
      { q: "Qual a dose e a meta terapêutica da lactulose na EH?", a: "25-45 mL VO 2-3×/dia. Meta: 2-3 evacuações pastosas/dia. Mecanismos: reduz pH colônico (NH₃→NH₄⁺ não absorvível), efeito osmótico/laxativo, alteração da microbiota. Enema (300 mL em 700 mL de SF) para pacientes em estupor/coma. Evitar superdosagem → desidratação e hipernatremia que pioram a EH." },
      { q: "Qual evidência sustenta o uso de rifaximina na profilaxia secundária de EH?", a: "Bass et al. (2010, RCT, n=299): rifaximina 550 mg 12/12h + lactulose reduziu recorrência de EH overt em 6 meses de 46% para 22% (HR 0,42; IC 95% 0,28-0,64). NNT = 4. Redução de hospitalizações de 23% para 14%. Absorção sistêmica < 1%." },
      { q: "Por que a restrição proteica na EH é um erro e qual a recomendação nutricional atual?", a: "A restrição proteica piora a sarcopenia, e o músculo é sítio extrahepático do metabolismo da amônia — perder massa muscular agrava a EH. Dois RCTs mostraram que dieta normoproteica é segura e superior. EASL 2022: 1,2-1,5 g/kg/dia de proteína, distribuída ao longo do dia, com lanche noturno (late evening snack) de 50 g de carboidrato complexo para prevenir catabolismo noturno." },
      { q: "EH pós-TIPS: qual a frequência, prognóstico e manejo?", a: "Ocorre em 30-50% pós-TIPS. Habitualmente autolimitada nas primeiras 4-6 semanas. Tratar com lactulose + rifaximina. Se refratária: considerar redução do diâmetro do stent." },
      { q: "O que são mielopatia hepática e parkinsonismo hepático?", a: "Mielopatia hepática: paraparesia espástica progressiva por desmielinização do trato corticoespinhal. Rara, irreversível, não responde a lactulose/rifaximina — só transplante. Parkinsonismo hepático: deposição de manganês nos gânglios da base (hipersinal T1 na RM). Não responde a levodopa. Pode melhorar parcialmente pós-transplante. Hipertensão Portal — Conceitos e Avaliação" },
      { q: "Quais são os valores de HVPG e seus significados clínicos?", a: "Normal: 1-5 mmHg. ≥ 6: hipertensão portal. ≥ 10: CSPH (limiar para varizes e descompensação). ≥ 12: risco de hemorragia varicosa. ≥ 16: risco adicional de descompensação e mortalidade. ≥ 20: risco de falha de controle de sangramento. HVPG é o padrão-ouro, mas invasivo (cateterismo de veia hepática)." },
      { q: "Explique a Regra dos Cinco do Baveno VII para elastografia hepática.", a: "LSM < 10 kPa: exclui cACLD. 10-15: sugere cACLD, confirmar com segundo método. 15-20: confirma cACLD, sugere CSPH mas não confirma. 20-25: alta probabilidade de CSPH. ≥ 25: confirma CSPH (suficiente para dispensar endoscopia de rastreio). Limitações: menos confiável em obesidade, pós-prandial, colestase, congestão hepática." },
      { q: "Quando é possível dispensar a endoscopia de rastreio de varizes segundo o Baveno VII?", a: "LSM < 20 kPa E plaquetas > 150.000/μL → baixo risco de varizes de alto risco → pode dispensar endoscopia. VPN > 98% (validado em >30 estudos). Esses pacientes devem ser reavaliados anualmente com LSM + plaquetas. Se LSM ≥ 20 OU plaquetas ≤ 150.000 → EDA indicada." },
      { q: "O que é o conceito de cACLD e por que substitui 'cirrose compensada'?", a: "cACLD = compensated advanced chronic liver disease. Inclui fibrose avançada (F3-F4), não apenas cirrose estabelecida. É o estágio onde a estratificação de risco baseada em avaliação não invasiva da CSPH faz sentido clínico, permitindo intervenção precoce. Betabloqueadores Não Seletivos" },
      { q: "Quais são os três mecanismos pelos quais o carvedilol reduz a pressão portal?", a: "1) Bloqueio β1 cardíaco: reduz débito cardíaco → menor fluxo portal. 2) Bloqueio β2 esplâncnico: vasoconstrição esplâncnica → menor influxo portal. 3) Bloqueio α1 (exclusivo do carvedilol): vasodilatação intra-hepática → reduz resistência → redução adicional de 10-15% no HVPG. Por isso o carvedilol é preferido pelo Baveno VII." },
      { q: "O que o estudo PREDESCI demonstrou e quais suas limitações?", a: "RCT, n=201: BBNS (carvedilol ou propranolol) vs placebo em cirrose compensada com CSPH (HVPG ≥ 10). BBNS reduziram primeira descompensação (HR 0,51; IC 95% 0,26-0,97), especialmente ascite. Limitações: n modesto, follow-up mediano de 37 meses, seleção por HVPG (invasivo), não desenhado para mortalidade." },
      { q: "Quando suspender BBNS na ascite refratária?", a: "Não suspender automaticamente. Suspender/reduzir se: PAS < 90 mmHg, Na < 125 mEq/L, ou SHR-AKI. O carvedilol pode ser reduzido a 6,25 mg/dia antes de considerar suspensão. A 'hipótese da janela terapêutica' sugere cautela na doença muito avançada, mas Baveno VII e AASLD 2024 recomendam manter quando possível." },
      { q: "Qual a posologia do carvedilol, propranolol e nadolol na profilaxia varicosa?", a: "Carvedilol: 6,25 mg/dia → 12,5 mg/dia (não titula por FC). Propranolol: 20 mg 12/12h → 40-160 mg 12/12h (meta FC 55-60 bpm). Nadolol: 40 mg/dia → 40-240 mg/dia (dose única diária possível). Hemorragia Varicosa" },
      { q: "Quais são os cinco pilares simultâneos do manejo da hemorragia varicosa aguda?", a: "1) Ressuscitação: meta Hb 7-8 g/dL (transfusão restritiva), evitar cristaloides em excesso. 2) Drogas vasoativas: terlipressina/octreotide/somatostatina — iniciar NA ADMISSÃO, antes da endoscopia. 3) Antibioticoprofilaxia: ceftriaxona 1 g/dia IV 7 dias. 4) Endoscopia dentro de 12h: ligadura elástica para varizes esofágicas. 5) TIPS pré-emptiva ou de resgate para pacientes de alto risco." },
      { q: "Por que a meta transfusional na HVA é restritiva (Hb 7-8 g/dL)?", a: "Hiper-transfusão aumenta a pressão portal (por expansão volêmica e aumento do fluxo esplâncnico), podendo agravar o sangramento. A estratégia restritiva é paradoxalmente mais segura." },
      { q: "O que é a TIPS pré-emptiva e quais pacientes se beneficiam?", a: "TIPS colocada nas primeiras 72h (idealmente 24h) em pacientes de alto risco: Child-Pugh C (10-13 pontos) ou Child-Pugh B com sangramento ativo na endoscopia. Garcia-Pagán et al. (RCT, n=63): mortalidade de 33% → 14% em 1 ano. Usar stents revestidos. Endossada pelo Baveno VII e AASLD 2024." },
      { q: "Por que BBNS + ligadura elástica são combinados na profilaxia SECUNDÁRIA mas não na PRIMÁRIA?", a: "Na profilaxia primária, a combinação não mostrou benefício adicional e tem mais efeitos adversos. Na profilaxia secundária, o risco de re-sangramento é alto (~60% em 1-2 anos) e a combinação é superior a qualquer intervenção isolada." },
      { q: "Qual o papel da antibioticoprofilaxia na HVA e qual o NNT?", a: "Ceftriaxona 1 g/dia IV por 7 dias (preferida em Child B/C). Reduz infecções e mortalidade. NNT para prevenir infecção: ~4. Deve ser iniciada na admissão, antes da endoscopia. Alternativa para Child A: norfloxacino 400 mg 12/12h VO. Varizes Gástricas e PHG" },
      { q: "Descreva a classificação de Sarin para varizes gástricas e o manejo de cada tipo.", a: "GOV1: extensão de VE pela pequena curvatura → tratar como varizes esofágicas (LEV). GOV2: extensão para fundo gástrico → cianoacrilato ou TIPS. IGV1: isoladas no fundo → cianoacrilato ou TIPS (preferida). IGV2: isoladas em outro local → individualizar. Varizes fúndicas (GOV2, IGV1) sangram com maior frequência e gravidade." },
      { q: "Classifique a PHG, diferencie de gastrite e explique o manejo por gravidade.", a: "PHG é congestão mucosa gástrica pela HP, sem componente inflamatório (diferente de gastrite). Leve: padrão em mosaico → monitorar Hb. Grave: red spots difusos → anemia ferropriva frequente → BBNS + ferro. Sangramento agudo (raro): drogas vasoativas + BBNS, não LEV (lesão difusa). PHG pode agravar-se após erradicação de varizes por LEV (redistribuição de fluxo portal). Hiponatremia" },
      { q: "Por que a hiponatremia do cirrótico é dilucional e por que a reposição de sódio não funciona?", a: "É causada pelo excesso de água livre (secreção não osmótica de ADH/vasopressina em resposta ao subpreenchimento arterial). O sódio corporal total está na verdade aumentado (retido pelos rins). Repor sódio com SF piora a ascite sem corrigir a diluição." },
      { q: "Qual o manejo da hiponatremia por gravidade no cirrótico?", a: "Leve (126-135 mEq/L): monitorar, evitar exacerbantes. Moderada (120-125): restrição hídrica 1-1,5 L/dia, ajustar diuréticos. Grave (<120) ou sintomática: restrição hídrica + considerar salina hipertônica 3% com cautela (risco de mielinólise se correção > 8-10 mEq/L/24h) ± vaptans." },
      { q: "Por que os vaptans são exemplo clássico de desfecho substituto vs clínico?", a: "Tolvaptan corrige o Na sérico em RCTs (SALT-1/SALT-2), mas SEM impacto demonstrado em mortalidade, transplante ou hospitalizações. Além disso, risco de hepatotoxicidade com uso > 30 dias. Uso restrito a ponte para transplante em hiponatremia grave sintomática. Hidrotórax Hepático" },
      { q: "Qual o mecanismo do hidrotórax hepático e por que predomina à direita?", a: "Passagem de líquido ascítico para o espaço pleural por microdefeitos no diafragma (fenestrações), facilitada pela pressão abdominal positiva e intratorácica negativa. Predomina à direita (~85%) porque o hemidiafragma direito é mais delgado e adjacente ao fígado." },
      { q: "Por que é contraindicado colocar dreno de tórax no hidrotórax hepático?", a: "Risco de infecção, perda proteica contínua e fistulização (comunicação persistente). O manejo espelha o da ascite: restrição de sódio + diuréticos, toracocentese terapêutica para alívio sintomático, TIPS para refratários, transplante como tratamento definitivo." },
      { q: "O que é o EBE e como se diagnostica e trata?", a: "EBE = empiema bacteriano espontâneo. Infecção do líquido pleural sem pneumonia. Diagnóstico: PMN > 250/mm³ ou cultura positiva no líquido pleural. Tratamento: mesmo da PBE (cefalosporina 3ª geração ± albumina). Recompensação e TVP" },
      { q: "Quais são os critérios de recompensação do Baveno VII?", a: "Todos por ≥ 12 meses: 1) Remoção sustentada do fator etiológico (RVS para HCV, supressão viral HBV, abstinência alcoólica, controle peso na MASLD). 2) Ausência de ascite, EH ou re-sangramento sem tratamento farmacológico. 3) Melhora sustentada da função hepática (albumina, bilirrubina, INR). A descompensação não é necessariamente irreversível." },
      { q: "TVP no cirrótico: quando anticoagular?", a: "TVP aguda com oclusão > 50% ou extensão para VMS → HBPM seguida de warfarina ou DOAC. TVP parcial < 50% assintomática → monitorização com USG doppler 3-6 meses (anticoagulação se candidato a transplante). A anticoagulação é segura: cirróticos anticoagulados NÃO têm mais sangramento varicoso. Raciocínio Crítico sobre a Evidência" },
      { q: "Por que muitas recomendações em hepatologia são baseadas em evidência de qualidade limitada?", a: "A maioria das doenças hepáticas crônicas não atrai interesse da indústria para grandes RCTs. A albumina não tem 'dono comercial'. O PREDESCI teve n=201. A TIPS pré-emptiva baseia-se em n=63. O Baveno VII usa validações retrospectivas com baixa taxa de eventos. A exceção são antivirais de HCV e, mais recentemente, terlipressina." },
      { q: "Qual limitação do estudo de Sort et al. sobre albumina na PBE e por que isso não invalida a recomendação?", a: "Apenas 126 pacientes, não cego. Porém: magnitude do efeito foi grande (NNT ~5 para mortalidade), plausibilidade biológica é forte, e estudos com cristaloides/amidos não reproduziram o benefício. A falta de cegamento é limitação real, mas o efeito não é sutil." },
      { q: "A rifaximina na profilaxia de EH baseia-se em quantos RCTs pivotais? Isso é uma limitação?", a: "Essencialmente um único RCT (Bass et al., 2010, n=299). Sim, a base é estreita para uma recomendação tão difundida. O estudo é robusto (HR 0,42, NNT 4), mas a ausência de confirmação por segundo RCT grande é uma limitação reconhecida." },
      { q: "Cite três lacunas importantes de evidência na hepatologia atual.", a: "1) Nenhum RCT compara carvedilol vs propranolol na profilaxia primária de HVA. 2) O papel dos BBNS na ascite refratária não tem RCT definitivo. 3) Os critérios de recompensação do Baveno VII aguardam validação prospectiva. Outras: DOACs na cirrose, manejo da EH covert com desfechos duros. Conceitos Integrativos" },
      { q: "Por que a infecção é o precipitante mais potente tanto da EH quanto da SHR-AKI?", a: "Na EH: citocinas pró-inflamatórias da translocação bacteriana ativam micróglia e amplificam a neurotoxicidade da amônia (modelo dos 'dois hits'). Na SHR-AKI: inflamação sistêmica agrava vasoconstrição renal e causa dano tubular direto. Ambos compartilham a translocação bacteriana como gatilho comum." },
      { q: "Como a sarcopenia piora a EH e como isso muda a conduta nutricional?", a: "O músculo esquelético é o principal sítio extrahepático de metabolismo da amônia (via glutamina sintetase). Perda de massa muscular reduz a capacidade de clearance de amônia. Por isso, restrição proteica é deletéria: piora sarcopenia → piora EH. Recomendação: 1,2-1,5 g/kg/dia + lanche noturno." },
      { q: "Qual é a relação entre a cascata fisiopatológica da ascite, a SHR-AKI e a hiponatremia?", a: "Mesma cascata em gravidade crescente. Vasodilatação esplâncnica → subpreenchimento arterial → ativação SRAA/SNS/ADH. SRAA causa retenção de sódio → ascite. Vasopressina causa retenção de água → hiponatremia dilucional. Vasoconstrição renal extrema → SHR-AKI. Cada complicação é uma etapa mais avançada da mesma descompensação hemodinâmica." },
      { q: "Por que o lanche noturno (late evening snack) é recomendado na cirrose?", a: "A cirrose causa resistência à insulina e depleção de glicogênio hepático. O jejum noturno resulta em catabolismo proteico acelerado (o organismo degrada aminoácidos para gliconeogênese). O lanche de 50 g de carboidrato complexo fornece substrato e previne catabolismo, protegendo contra sarcopenia e potencialmente reduzindo a amoniogênese." },
      { q: "Compare a indicação de TIPS na ascite refratária, HVA refratária e hidrotórax refratário.", a: "Ascite refratária: TIPS é superior a PGV seriada em sobrevida (metanálises de RCTs). HVA refratária: TIPS de resgate (falha de controle endoscópico) ou pré-emptiva (alto risco, 72h). Hidrotórax refratário: indicação semelhante à ascite refratária. Todas compartilham a mesma lógica: reduzir pressão portal. Contraindicações são as mesmas para todas." },
      { q: "Por que a coagulopatia da cirrose não contraindica procedimentos como paracentese?", a: "A coagulopatia da cirrose é 'rebalanceada': há deficiência simultânea de fatores pró-coagulantes (produzidos pelo fígado) e anticoagulantes (proteína C, S, antitrombina — também hepáticos). O INR e plaquetas refletem apenas os pró-coagulantes. Na prática, o equilíbrio hemostático é mantido. Complicações hemorrágicas significativas na paracentese são raras." },
      { q: "Como a translocação bacteriana conecta mecanisticamente PBE, EH e SHR?", a: "Bactérias intestinais atravessam mucosa comprometida (pela HP) → linfonodos mesentéricos → circulação. Na PBE: bactérias colonizam líquido ascítico com baixa opsonização. Na EH: LPS e citocinas ativam micróglia (neuroinflamação). Na SHR: inflamação sistêmica agrava vasoconstrição renal e dano tubular. A profilaxia de PBE (norfloxacino) pode indiretamente proteger contra EH e SHR. SHR e Lesão Renal" },
      { q: "Qual é a diferença entre SHR-AKI e SHR-NAKI, e por que essa distinção importa?", a: "SHR-AKI: elevação aguda da creatinina ≥0,3 mg/dL em 48h ou ≥50% em 7 dias — é a forma clássica, com mortalidade alta sem tratamento. SHR-NAKI: doença renal crônica (TFG <60 mL/min por >3 meses) ou doença renal aguda (alterações que não preenchem critérios de AKI). A distinção importa porque SHR-NAKI carece de RCTs próprios, o tratamento é extrapolado da SHR-AKI, e o prognóstico é diferente. ACLF" },
      { q: "O que define ACLF segundo os critérios EASL-CLIF e quais órgãos são avaliados?", a: "ACLF (Acute-on-Chronic Liver Failure) = descompensação aguda em cirrótico com falência de órgãos e mortalidade ≥15% em 28 dias. O CLIF-C OF Score avalia 6 sistemas: fígado (bilirrubina), rim (creatinina), cérebro (grau de EH), coagulação (INR), circulação (PAM/vasopressores) e respiração (PaO₂/FiO₂ ou SpO₂/FiO₂). Cada sistema pontua 1-3; falência = pontuação 3." },
      { q: "Como se classificam os graus de ACLF e qual a mortalidade de cada um?", a: "ACLF-1: falência renal isolada OU falência de 1 órgão não renal + disfunção renal (Cr 1,5-1,9) ou cerebral (EH I-II). Mortalidade 28 dias: 22%. ACLF-2: falência de 2 órgãos. Mortalidade: 32%. ACLF-3: falência de ≥3 órgãos. Mortalidade: 73-78%. ACLF-3 com ≥4 falências em 3-7 dias: mortalidade >90%, sendo considerado critério de futilidade terapêutica." },
      { q: "Quais são os principais precipitantes do ACLF e por que ~40% não têm fator identificável?", a: "Infecções bacterianas (30-40%) são o precipitante mais comum; hepatite alcoólica aguda (~25%) é o segundo. Reativação de HBV é relevante em áreas endêmicas. Cerca de 40% não têm precipitante identificável, o que sugere que a própria progressão da doença hepática e translocação bacteriana subclínica podem deflagrar a cascata inflamatória (ativação imune inata → tempestade de citocinas → falência de órgãos). Infecções na Cirrose" },
      { q: "Além da PBE, quais outras infecções bacterianas são frequentes no cirrótico e por que a apresentação pode ser atípica?", a: "ITU (25-35% das infecções), pneumonia (15-25%), celulite/infecções de partes moles (10-15%) e bacteremia espontânea. A apresentação é atípica porque a imunodisfunção associada à cirrose (CAID) suprime a resposta inflamatória: pode haver infecção grave sem febre, leucocitose ou dor localizada. Piora de ascite, encefalopatia ou função renal devem sempre levantar suspeita de infecção oculta. Hiponatremia" },
      { q: "Qual o protocolo de correção da hiponatremia grave no cirrótico e por que o limite é mais restrito?", a: "Na hiponatremia sintomática grave (Na <120-125 mEq/L com sintomas neurológicos): salina hipertônica 3%, com limite de correção de 8 mEq/L em 24h (mais conservador que os 10-12 mEq/L em não cirróticos). Cirróticos têm maior risco de síndrome de desmielinização osmótica (SDO) por desnutrição e hipocalemia coexistente. Se ultrapassar o limite: DDAVP 2-4 µg IV + soro glicosado 5% como resgate. Nutrição e Sarcopenia" },
      { q: "Quais são os mecanismos que levam à sarcopenia na cirrose e qual o papel do jejum noturno acelerado?", a: "5 mecanismos: 1) Hipermetabolismo basal (30% dos cirróticos). 2) Catabolismo proteico aumentado (proteólise muscular para gliconeogênese). 3) Hiperamonemia: amônia captada pelo músculo via glutamina sintetase ativa mTOR negativamente → inibe síntese proteica. 4) Jejum noturno acelerado: depleção de glicogênio hepático faz o cirrótico 'pular' do pós-absortivo para o jejum verdadeiro em ~6h (vs. 12-14h em sadios). 5) Restrição iatrogênica de proteínas." },
      { q: "Quais são as recomendações nutricionais quantitativas para o paciente cirrótico?", a: "Energia: 25-35 kcal/kg/dia (usar peso seco). Proteínas: 1,2-1,5 g/kg/dia (nunca restringir, mesmo na EH — restrição piora sarcopenia e a própria EH). BCAA: 0,25 g/kg/dia (suplementação indicada quando intolerância à proteína convencional ou EH refratária). Lanche noturno (late evening snack): ~50 g de carboidrato complexo para prevenir catabolismo noturno. Refeições: fracionar em 4-7/dia, evitar jejum >6h. Seguimento e Manutenção" },
      { q: "Quais são os sinais de alarme que indicam descompensação iminente no cirrótico ambulatorial?", a: "8 sinais: 1) Ganho de peso >2 kg/semana (ascite). 2) Confusão ou inversão do ciclo sono-vigília (EH). 3) Hematêmese/melena (HDA varicosa). 4) Oligúria + Cr subindo. 5) Na sérico <125 mEq/L. 6) Febre ou calafrios (infecção). 7) Icterícia rapidamente progressiva. 8) Dispneia nova (hidrotórax ou cardiomiopatia). Qualquer sinal exige avaliação hospitalar urgente." },
      { q: "Quais são os critérios de referência para transplante hepático no paciente cirrótico?", a: "9 critérios principais: 1) MELD-Na ≥15. 2) Primeira descompensação (ascite, EH ou HVA). 3) Ascite refratária. 4) SHR-AKI. 5) EH recorrente (≥2 episódios em 6 meses). 6) HVA com falha de profilaxia secundária. 7) PBE (sobrevida 1 ano ~30-50% sem transplante). 8) ACLF grau ≥2. 9) Hiponatremia crônica <130 mEq/L. A referência deve ser precoce — o tempo em lista é frequentemente >6 meses." },
    ]
  },
  {
    id: "cirrose",
    name: "Cirrose Hepática",
    cards: [
      { q: "Quais são as cinco principais etiologias de cirrose e como investigá-las inicialmente?", a: "1) Hepatite C — anti-HCV + HCV-RNA. 2) Hepatopatia alcoólica — história clínica detalhada + AST/ALT >2 + GGT elevada. 3) MASLD/NASH — síndrome metabólica, exclusão de outras causas. 4) Hepatite B — HBsAg + anti-HBc. 5) Hepatite autoimune — FAN, anti-músculo liso, IgG elevada. A etiologia é determinada em 85–90% dos casos; os 10–15% restantes são classificados como 'criptogênica' (muitos provavelmente NASH burn-out)." },
      { q: "O que é cirrose 'criptogênica' e qual a etiologia mais provável por trás dela?", a: "Cirrose criptogênica designa os 10–15% de casos sem etiologia definida após investigação completa. Evidência atual sugere que a maioria representa MASLD em fase avançada (burn-out NASH): esses pacientes têm perfil metabólico similar ao NASH, e em séries de explantes hepáticos, NASH oculta foi identificada em 30–70% dos casos 'criptogênicos'. A esteatose desaparece com a progressão da fibrose, apagando o marcador histológico mais óbvio." },
      { q: "Qual a principal causa de morte em pacientes com cirrose e como a mortalidade se relaciona com o MELD?", a: "As principais causas de morte são infecções (incluindo PBE, pneumonia, ITU), hemorragia varicosa e insuficiência hepática progressiva. Em compensados, o CHC emerge como causa importante. A mortalidade em 90 dias é diretamente proporcional ao MELD: <10 = ~2%; 10–19 = ~6%; 20–29 = ~20%; 30–39 = ~50%; ≥40 = ~70%. A transição compensada → descompensada é o marco prognóstico central, com sobrevida caindo de >12 anos para ~2 anos." },
      { q: "Qual é a célula-chave da fibrogênese hepática e qual é seu mecanismo de ativação?", a: "A célula estrelada hepática (célula de Ito). Normalmente quiescente e armazenadora de vitamina A, ela é ativada por citocinas pró-inflamatórias (TGF-β, PDGF, TNF-α) liberadas por hepatócitos lesados e células de Kupffer. Ao se ativar, transdiferencia-se em miofibroblasto e passa a secretar colágeno tipos I e III no espaço de Disse, causando capilarização dos sinusoides." },
      { q: "Explique o 'paradoxo do NO' na cirrose e sua implicação farmacológica.", a: "Na cirrose, há déficit de óxido nítrico (NO) intra-hepático (causando vasoconstrição sinusoidal) e excesso de NO na circulação esplâncnica (causando vasodilatação). Isso explica por que: (1) betabloqueadores não seletivos funcionam — reduzem o fluxo esplâncnico via bloqueio β2; (2) vasodilatadores sistêmicos pioram o quadro — exacerbam a vasodilatação esplâncnica; (3) o carvedilol (β + α1) é superior — a vasodilatação intra-hepática via bloqueio α1 corrige parcialmente o déficit local de NO." },
      { q: "Quais são os dois componentes da hipertensão portal na cirrose e qual é o alvo farmacológico?", a: "Componente estrutural (~70%): distorção arquitetural por fibrose e nódulos regenerativos — pouco modificável farmacologicamente, responde ao tratamento da causa de base. Componente funcional (~30%): vasoconstrição intra-hepática por disfunção endotelial + vasodilatação esplâncnica — é o alvo dos betabloqueadores não seletivos." },
      { q: "Por que a transição de cirrose compensada para descompensada é considerada um 'ponto de não retorno'?", a: "Porque a descompensação reflete o momento em que os mecanismos compensatórios (ativação do SRAA, sistema nervoso simpático, vasopressina) se tornam maladaptativos — a vasodilatação esplâncnica é tão intensa que a retenção de sódio/água (ascite), vasoconstrição renal (SHR) e shunting portossistêmico (EH) se instalam. A sobrevida cai de >12 anos para ~2 anos. A recompensação sustentada é rara sem tratamento etiológico eficaz." },
      { q: "Qual o mecanismo pelo qual a amônia causa encefalopatia hepática?", a: "A amônia intestinal (produzida pelo metabolismo bacteriano e pela glutaminase) deveria ser convertida em ureia pelo ciclo da ureia hepático. Na cirrose, a massa hepatocelular reduzida e o shunting portossistêmico desviam a amônia do fígado. No cérebro, astrócitos metabolizam amônia em glutamina (via glutamina sintetase), causando edema astrocitário osmótico e disfunção da neurotransmissão. A amônia sérica, contudo, correlaciona-se mal com a gravidade clínica." },
      { q: "Explique o mecanismo da ascite na cirrose em uma cascata de eventos.", a: "Fibrose → hipertensão portal → vasodilatação esplâncnica (excesso de NO) → diminuição do volume arterial efetivo → ativação do SRAA e vasopressina → retenção ávida de sódio e água → hipoalbuminemia (insuficiência sintética) reduz a pressão oncótica → pressão hidrostática elevada nos capilares esplâncnicos + produção de linfa excedendo capacidade do ducto torácico → acúmulo de líquido peritoneal. O GASA ≥1,1 g/dL confirma o mecanismo de hipertensão portal." },
      { q: "O que é a capilarização dos sinusoides e qual sua consequência funcional?", a: "Os sinusoides hepáticos normalmente são fenestrados (sem membrana basal contínua), permitindo troca livre entre o sangue e os hepatócitos através do espaço de Disse. Na fibrose, o depósito de colágeno pela célula estrelada ativada cria uma membrana basal contínua (capilarização). Consequências: (1) redução da troca de substâncias sangue-hepatócito (contribui para insuficiência hepatocelular); (2) aumento da resistência ao fluxo portal (contribui para hipertensão portal); (3) perda da regulação do tônus sinusoidal." },
      { q: "Descreva a circulação hiperdinâmica da cirrose e o conceito de underfilling arterial.", a: "Hipertensão portal → vasodilatação esplâncnica (excesso de NO) → queda da resistência vascular sistêmica → queda da PA efetiva → ativação barorreceptora → aumento do débito cardíaco (circulação hiperdinâmica compensatória) + ativação do SRAA, simpático e vasopressina → retenção de sódio/água + vasoconstrição renal. É um estado de underfilling arterial relativo: o volume total plasmático está expandido, mas o volume arterial efetivo está criticamente reduzido. Isso explica o paradoxo de retenção hídrica com hiponatremia dilucional." },
      { q: "O que é recompensação hepática, em que cenários ela é possível e quais são suas limitações?", a: "Recompensação é a reversão sustentada do estado descompensado para compensado. Documentada especialmente após: cura da hepatite C com DAAs, abstinência sustentada na hepatopatia alcoólica, controle da hepatite autoimune, e emagrecimento ≥10% na MASLD. Limitações: critérios formais ainda não são universalmente aceitos; é mais provável quando o componente inflamatório/funcional da doença predomina sobre a distorção vascular estrutural irreversível; e mesmo recompensados mantêm risco de CHC (rastreamento deve continuar)." },
      { q: "Quais são os três achados clínicos com maior razão de verossimilhança positiva (LR+) para cirrose?", a: "1. Ascite: LR+ 7,2 — o achado clínico isolado mais preditivo. 2. Plaquetas <160.000/μL: LR+ 6,3 — melhor marcador laboratorial (sequestro esplênico + diminuição de trombopoetina). 3. Spider angiomata (angiomas aracneiformes): LR+ 4,3 — mediados por hiperestrogenismo relativo. Nenhum sinal isolado confirma ou exclui cirrose; a combinação de achados tem valor substancialmente maior." },
      { q: "Por que a relação AST/ALT >1 é sugestiva de cirrose, especialmente na etiologia alcoólica?", a: "Três razões: (1) a ALT é mais dependente de piridoxina (B6), frequentemente deficiente no etilismo → produção de ALT reduzida; (2) a AST tem fração mitocondrial liberada na necrose hepatocitária profunda da cirrose; (3) a depuração hepática da AST diminui com a fibrose. Relação AST/ALT >2 é especialmente sugestiva de etiologia alcoólica. Importante: aminotransferases NORMAIS não excluem cirrose — até 30% dos compensados têm transaminases na faixa de referência." },
      { q: "Qual o valor da elastografia hepática no diagnóstico e manejo da cirrose? Cite os pontos de corte.", a: "A elastografia mede a rigidez hepática em kPa. Valores >12-15 kPa: cirrose provável (AUROC >0,90). Valores >20-25 kPa: hipertensão portal clinicamente significativa provável (CSPH). Pelo critério Baveno VII, se elastografia >20-25 kPa + plaquetas <150.000, pode-se iniciar betabloqueadores sem EDA prévia. Limitações: obesidade extrema, ascite volumosa e congestão hepática superestimam os valores." },
      { q: "Em que cenários a biópsia hepática ainda é necessária na era dos métodos não invasivos?", a: "Em ~10-15% dos casos: dúvida diagnóstica após investigação não invasiva, etiologia inconclusiva após exames séricos completos, necessidade de estadiamento histológico preciso (especialmente se impactar decisão terapêutica), e suspeita de doença hepática concomitante (ex.: sobreposição MASLD + autoimune). A biópsia tem sensibilidade/especificidade de 80-100% (variabilidade por erro de amostragem — representa ~1/50.000 do parênquima)." },
      { q: "O que são o APRI e o FIB-4, e quais seus pontos de corte para predição de fibrose avançada?", a: "São índices não invasivos calculados a partir de exames de rotina. APRI = (AST/LSN) × 100 / plaquetas (×10⁹/L): >2,0 sugere cirrose (especificidade ~90%); <0,5 torna cirrose improvável. FIB-4 = (idade × AST) / (plaquetas × √ALT): >3,25 sugere fibrose avançada; <1,45 praticamente exclui. Limitações: zona cinzenta intermediária em 30–40% dos pacientes, e perdem acurácia em hepatite aguda ou transaminases muito elevadas." },
      { q: "Qual o painel de investigação etiológica inicial para um paciente com cirrose recém-diagnosticada?", a: "Obrigatórios: anti-HCV + HBsAg + anti-HBc (hepatites virais); história de álcool detalhada; perfil metabólico (glicemia, lipídios, IMC — MASLD); FAN + anti-músculo liso + IgG (hepatite autoimune); ferritina + saturação de transferrina (hemocromatose); ceruloplasmina (Wilson, se <40 anos). Complementares conforme suspeita: alfa-1 antitripsina, anticorpos antimitocôndria (CBP), p-ANCA (CEP). A etiologia é encontrada em 85–90% dos casos." },
