  {
    id: "pancreatite",
    name: "Pancreatite Aguda",
    cards: [
      { q: "Quais são os três critérios diagnósticos da pancreatite aguda e quantos são necessários?", a: "Dois de três: (1) dor abdominal característica (epigástrica, intensa, irradiada para dorso); (2) lipase ou amilase ≥ 3× o limite superior da normalidade; (3) achados característicos em exame de imagem (TC, RM ou USG). A imagem NÃO é necessária para o diagnóstico quando os dois primeiros critérios estão presentes." },
      { q: "Por que a lipase é preferível à amilase no diagnóstico de PA?", a: "Porque tem: (1) maior sensibilidade (82-100% vs. 67-83%); (2) maior especificidade (sensibilidade a fontes extra-pancreáticas é menor); (3) elevação mais prolongada (8-14 dias vs. 3-5 dias para amilase), reduzindo falsos-negativos em apresentações tardias. A amilase pode normalizar antes da avaliação, levando a diagnóstico perdido." },
      { q: "Por que a magnitude da elevação da lipase NÃO se correlaciona com a gravidade da PA?", a: "Porque a lipase reflete a quantidade de enzima liberada para a corrente sanguínea, que depende do tamanho do pâncreas, da permeabilidade ductal e do clearance renal — não da extensão da inflamação/necrose. Uma PA leve edematosa pode ter lipase > 10.000, enquanto uma PA necrosante grave pode ter lipase apenas 3-4× o normal. A gravidade é determinada pela resposta inflamatória sistêmica (SIRS) e pela falência orgânica (Marshall), não pelas enzimas." },
      { q: "Qual é o mecanismo central da fisiopatologia da PA?", a: "Ativação prematura intrapancreática do tripsinogênio em tripsina, dentro das células acinares. A tripsina ativa outras pró-enzimas (elastase, fosfolipase A2, quimiotripsina) em cascata, causando autodigestão do parênquima pancreático. O gatilho varia por etiologia: obstrução ductal (biliar), toxicidade direta (álcool, hipertrigliceridemia), mas o mecanismo final comum é o mesmo." },
      { q: "Como a fisiopatologia da PA explica por que nenhuma terapia farmacológica dirigida funcionou?", a: "Porque a cascata inflamatória é redundante e autossustentada: após a ativação inicial da tripsina, múltiplas vias amplificam o dano (NF-κB, TNF-α, IL-1, IL-6, PAF, espécies reativas de oxigênio) simultaneamente. Bloquear uma via isolada (anti-TNF, lexipafant anti-PAF, gabexato anti-protease, somatostatina anti-secretora) não interrompe as demais. Todos falharam. A terapia permanece, portanto, de suporte." },
      { q: "Qual é a tríade de Charcot e quando ela indica CPRE urgente na PA?", a: "Dor no hipocôndrio direito + febre + icterícia. Quando presente no contexto de PA biliar, indica colangite concomitante e é indicação de CPRE urgente (< 24h). Sem colangite, a CPRE NÃO é indicada rotineiramente — deve-se confirmar a persistência do cálculo com CPRM ou EUS antes." },
      { q: "Qual é o significado do sinal de Grey Turner e do sinal de Cullen na PA?", a: "Equimose nos flancos (Grey Turner) e periumbilical (Cullen) indicam hemorragia retroperitoneal dissecando os planos fasciais. São sinais tardios (surgem em 1-2% dos casos, geralmente após 48-72h) e, quando presentes, indicam PA grave com necrose hemorrágica. Não são patognomônicos de PA — podem ocorrer em qualquer hemorragia retroperitoneal." },
      { q: "Qual é o valor preditivo de ALT > 3× o limite superior da normalidade na PA?", a: "VPP de ~95% para etiologia biliar. É a pista laboratorial mais útil para identificar causa biliar. Entretanto, o VPN é baixo — ALT normal não exclui etiologia biliar (o cálculo pode ter migrado antes da coleta). Deve-se solicitar USG abdominal em todo paciente com PA, independentemente do ALT." },
      { q: "Qual é a diferença entre PA edematosa intersticial e PA necrosante na classificação de Atlanta?", a: "A PA edematosa intersticial (85% dos casos) apresenta inflamação difusa do pâncreas COM realce ao contraste na TC (pâncreas viável), sem áreas de necrose. A PA necrosante (15%) apresenta áreas SEM realce (necrose do parênquima e/ou gordura peripancreática). A necrose pode ser estéril ou infectada — esta distinção determina o manejo subsequente." },
      { q: "Explique a diferença entre falência orgânica transitória e persistente e por que essa distinção é crucial.", a: "Transitória: falência orgânica (Marshall ≥ 2) que se resolve em < 48h. Classifica como PA moderadamente grave, mortalidade ~5%. Persistente: falência orgânica > 48h. Classifica como PA grave, mortalidade ~35%. A distinção é crucial porque determina nível de cuidado (enfermaria vs. UTI), intensidade de monitorização, e expectativa prognóstica. Um paciente com SIRS e Marshall = 2 que normaliza em 24h tem prognóstico fundamentalmente diferente de um que mantém Marshall ≥ 2 por > 48h." },
      { q: "Quais são os quatro tipos de coleções líquidas na classificação de Atlanta revisada e como diferenciá-los?", a: "Antes de 4 semanas: (1) APFC (Acute Peripancreatic Fluid Collection) — na PA edematosa, sem parede, homogênea; (2) ANC (Acute Necrotic Collection) — na PA necrosante, sem parede, heterogênea com debris. Após 4 semanas: (3) Pseudocisto — APFC que se encapsulou, parede definida, conteúdo líquido homogêneo; (4) WON (Walled-Off Necrosis) — ANC que se encapsulou, parede definida, conteúdo heterogêneo com material sólido. A distinção é clínica: pseudocisto pode ser drenado com stent; WON frequentemente requer necrosectomia endoscópica." },
      { q: "O que é o escore de Marshall modificado e como se define falência orgânica?", a: "Escore que avalia três sistemas: respiratório (PaO₂/FiO₂), renal (creatinina) e cardiovascular (PAS). Cada sistema é pontuado de 0 a 4. Falência orgânica = escore ≥ 2 em qualquer sistema. Valores para escore 2: PaO₂/FiO₂ ≤ 300, creatinina 1,9-3,6 mg/dL, PAS < 90 não responsiva a fluidos. Deve ser calculado seriadamente a cada 24-48h nas primeiras 72h." },
      { q: "O que é o BISAP e quais são seus 5 componentes?", a: "Bedside Index for Severity in Acute Pancreatitis. B = BUN > 25 mg/dL; I = Impaired mental status (alteração da consciência); S = SIRS (≥ 2 critérios); A = Age > 60 anos; P = Pleural effusion (derrame pleural na imagem). Cada item = 1 ponto. BISAP ≥ 3 prediz mortalidade > 5%. Vantagem: simples, disponível nas primeiras 24h." },
      { q: "Por que a SIRS é considerada o melhor instrumento de triagem inicial na PA?", a: "Porque combina: (1) disponibilidade imediata (dados vitais + hemograma); (2) alta sensibilidade (~85% para PA grave); (3) pode ser repetida a cada avaliação; (4) a persistência de SIRS em 48h é um dos melhores preditores de falência orgânica. SIRS presente na admissão + SIRS persistente em 48h → risco alto de PA grave. Não exige cálculos complexos como APACHE II ou Ranson." },
      { q: "Quais são as limitações do CTSI/Balthazar como preditor de gravidade?", a: "Três limitações principais: (1) TC precoce (< 72h) pode subestimar a necrose — o timing ideal é 72-96h; (2) avalia morfologia local, não gravidade sistêmica — um paciente pode ter CTSI alto (necrose extensa) sem falência orgânica, ou CTSI baixo com falência orgânica grave; (3) exige TC com contraste, que pode ser contraindicada em pacientes com LRA (nefrotoxicidade do contraste)." },
      { q: "Qual é o papel da hemoconcentração (hematócrito) na predição de gravidade da PA?", a: "Hematócrito elevado na admissão (> 44%) ou que não diminui em 24h sugere hemoconcentração por terceiro espaçamento e prediz PA necrosante. Entretanto, sensibilidade limitada (~60%) — pacientes com hemorragia retroperitoneal podem ter Ht falsamente baixo. ACG 2024: Ht e BUN elevados na admissão são 'bandeiras vermelhas' que indicam necessidade de monitorização intensiva e ressuscitação agressiva inicial. Devem ser interpretados junto com SIRS, não isoladamente." },
      { q: "Por que o Ringer Lactato é preferido ao SF 0,9% na ressuscitação volêmica da PA?", a: "Dois motivos: (1) o lactato do RL tem efeito anti-inflamatório (inibição de NF-κB); (2) o SF 0,9% causa acidose hiperclorêmica que pode agravar a inflamação sistêmica. Contraindicação ao RL: hipercalcemia (o RL contém cálcio e pode piorar PA por hipercalcemia)." },
      { q: "Ressuscitação volêmica na PA: agressiva ou moderada?", a: "Moderada e guiada por metas (débito urinário, BUN, Ht): bolus de 10 mL/kg se hipovolemia + 1,5 mL/kg/h. A ressuscitação agressiva não melhora a evolução e aumenta a sobrecarga hídrica." },
      { q: "O mito da morfina e o esfíncter de Oddi — explique por que é um mito.", a: "A ideia de que a morfina causa espasmo do esfíncter de Oddi e piora a PA nunca se confirmou clinicamente. A meperidina não tem vantagem e tem metabólito neurotóxico (normeperidina → convulsões). Morfina e outros opioides são aceitáveis para analgesia na PA." },
      { q: "Quando realimentar o paciente com PA leve?", a: "Precocemente, por via oral, sem esperar normalizar enzimas ou a dor resolver completamente. Dieta sólida hipolipídica é tão bem tolerada quanto a líquida clara e reduz o tempo de internação." },
      { q: "Na PA grave, nutrição enteral ou parenteral?", a: "Enteral: reduz mortalidade, falência de múltiplos órgãos e infecção da necrose, por preservar a barreira intestinal (menos translocação bacteriana). Via nasogástrica é equivalente à nasojejunal. Parenteral só se a via enteral for impossível." },
      { q: "Probióticos na PA grave?", a: "Contraindicados: aumentam a mortalidade (provável piora da isquemia mesentérica por fermentação bacteriana em epitélio isquêmico)." },
      { q: "Por que antibióticos profiláticos não funcionam na PA, mesmo com necrose?", a: "Três razões mecanísticas: (1) a infecção da necrose ocorre por translocação bacteriana intestinal, não por bacteremia hematogênica — antibióticos sistêmicos não previnem a translocação; (2) o tecido necrótico é desvascularizado, então antibióticos sistêmicos não atingem concentração adequada nele; (3) profilaxia seleciona flora resistente (especialmente fungos), piorando potencialmente o quadro infeccioso tardio." },
      { q: "Quais antibióticos penetram tecido pancreático necrótico e qual é a primeira escolha?", a: "Carbapenêmicos (meropenem 1g IV 8/8h ou imipenem 500mg IV 6/6h) têm excelente penetração pancreática e são a primeira escolha para necrose infectada. Alternativas: piperacilina-tazobactam (boa penetração), cefepime + metronidazol (penetração moderada), quinolona + metronidazol (para alérgicos a β-lactâmicos). O metronidazol é adicionado para cobertura anaeróbia quando não incluída no esquema principal." },
      { q: "Quando a CPRE é indicada de urgência na PA biliar?", a: "Só com colangite concomitante (< 24h) — nesse caso reduz mortalidade. Sem colangite, CPRE precoce não reduz mortalidade nem complicações: confirme a indicação com CPRM/EUS." },
      { q: "Quando fazer a colecistectomia na PA biliar leve?", a: "Na mesma internação, após a resolução do quadro: sem ela, cerca de 1 em cada 5 pacientes é readmitido por novo evento biliar. Na PA necrosante, colecistectomia diferida (6-8 semanas)." },
      { q: "O que é a abordagem step-up na necrose infectada?", a: "Passo 1: drenagem percutânea ou endoscópica; passo 2: necrosectomia minimamente invasiva se a drenagem for insuficiente. Comparada à necrosectomia aberta, reduz falência orgânica nova e complicações graves, e ~50% dos pacientes resolvem só com drenagem." },
      { q: "Por que adiar a intervenção ≥ 4 semanas na necrose infectada, quando possível?", a: "Racional: aguardar a encapsulação da necrose (transformação de ANC em WON) torna a drenagem mais segura e eficaz. A parede fibrosa do WON facilita a abordagem transmural endoscópica e reduz o risco de sangramento e perfuração. Enquanto se aguarda, o paciente é mantido com antibióticos penetrantes e suporte nutricional." },
      { q: "Diferencie a mortalidade bimodal da PA grave: o que mata na primeira e na segunda onda?", a: "Primeira onda (semanas 1-2): mortes por falência orgânica sistêmica (SDRA, choque distributivo, LRA) — foco no suporte intensivo (UTI, ventilação, vasopressores). Segunda onda (após semana 2): mortes por complicações infecciosas (necrose infectada, sepse) — foco na prevenção de infecção (nutrição enteral para proteger a barreira intestinal), vigilância clínica para deterioração secundária, e manejo step-up quando indicado." },
      { q: "O que é a síndrome do ducto pancreático desconectado e quando suspeitar?", a: "Ocorre quando necrose transversal do corpo do pâncreas interrompe completamente o ducto pancreático principal. A cauda permanece viável mas sem comunicação ductal com o duodeno. Consequência: fístula pancreática persistente e coleções recorrentes. Suspeitar quando: coleções ou fístulas não respondem ao tratamento convencional, especialmente após necrose na região do corpo/istmo. Ocorre em até 40-50% das necroses significativas. Manejo: stent endoscópico transluminal de longa permanência ou pancreatectomia distal." },
      { q: "Qual é a complicação vascular mais perigosa da PA e como se apresenta?", a: "Pseudoaneurisma arterial (artéria esplênica, gastroduodenal ou pancreatoduodenal) — causado por erosão da parede arterial pela inflamação/necrose. Risco de ruptura com hemorragia maciça. Sinal clássico: hemossucus pancreaticus (sangramento pelo ducto pancreático → hematêmese ou melena). Tratamento: embolização angiográfica urgente. Todo sangramento sentinela em contexto de PA deve levantar suspeita." },
      { q: "Como a trombose da veia esplênica pode causar hipertensão portal segmentar?", a: "A trombose da veia esplênica obstrui o retorno venoso do baço, causando hipertensão portal esquerda (segmentar). O sangue do baço é desviado para varizes de fundo gástrico (via veias gástricas curtas), que podem sangrar. Diferença da hipertensão portal global (cirrose): varizes de fundo gástrico isoladas, sem varizes esofágicas extensas, sem ascite. Tratamento definitivo: esplenectomia (se sangramento); não responde a TIPS ou terapia endoscópica de varizes esofágicas." },
      { q: "O que é a síndrome compartimental abdominal na PA e como é diagnosticada?", a: "PIA (pressão intra-abdominal) > 20 mmHg associada a nova falência orgânica. Causada por edema retroperitoneal, ascite inflamatória e íleo. Diagnóstico: medida da pressão intravesical (sonda de Foley). Manejo: (1) medidas clínicas (descompressão NG, bloqueio neuromuscular, restrição de fluidos); (2) paracentese descompressiva; (3) laparostomia (último recurso, mortalidade elevada)." },
      { q: "O que é a 'abordagem step-up' para necrose infectada e por que substituiu a necrosectomia aberta?", a: "Sequência: drenagem percutânea ou endoscópica → necrosectomia minimamente invasiva (VARD ou endoscópica transluminal) → necrosectomia aberta só se as anteriores falharem. Reduz complicações graves e falência orgânica nova em relação à necrosectomia aberta direta; 35-64% resolvem só com drenagem. Step-up endoscópico e cirúrgico são equivalentes." },
      { q: "O que são pseudocistos pancreáticos e quando devem ser drenados?", a: "Coleções encapsuladas por parede de tecido fibroso/granulação (sem epitélio verdadeiro), que surgem ≥ 4 semanas após PA edematosa. Diferem do WON por não conterem material sólido necrótico. Indicação de drenagem: sintomáticos (dor, compressão gástrica/duodenal, obstrução biliar), infectados, ou em crescimento progressivo. Tamanho isolado não é indicação. Via preferida: drenagem endoscópica transmural (cistogastrostomia) guiada por EUS. A maioria dos pseudocistos < 6 cm resolve espontaneamente." },
      { q: "Quais são as taxas de sequelas a longo prazo após PA?", a: "Recorrência ~22% (varia por etiologia); progressão para pancreatite crônica ~10% (especialmente etiologia alcoólica + tabagismo); diabetes (pré-diabetes ou DM) 54% em 4 anos; insuficiência exócrina 35% em ≥ 1 mês. Essas taxas justificam acompanhamento longitudinal estruturado, não apenas 'alta e esquece'." },
      { q: "O que é o diabetes tipo 3c (pancreatogênico) e como difere do DM2?", a: "Diabetes causado por destruição de ilhotas de Langerhans pela inflamação/necrose pancreática. Difere do DM2 em: (1) deficiência tanto de insulina (células beta) quanto de glucagon (células alfa) → hipoglicemia brittle (episódios frequentes e imprevisíveis); (2) não há resistência insulínica significativa; (3) doses de insulina necessárias são menores que no DM2; (4) requer monitorização glicêmica mais intensiva. Frequentemente classificado erroneamente como DM2." },
      { q: "Como diagnosticar e tratar insuficiência exócrina pós-PA?", a: "Diagnóstico: elastase fecal < 200 μg/g (moderada) ou < 100 μg/g (grave). Sintomas: esteatorreia (fezes gordurosas), perda ponderal, deficiência de vitaminas lipossolúveis (A, D, E, K). Tratamento: reposição de enzimas pancreáticas (25.000-50.000 UI de lipase por refeição). Monitorizar: peso, esteatorreia, dosagem de vitaminas lipossolúveis e densitometria óssea (deficiência de vitamina D)." },
      { q: "Qual é o impacto do tabagismo na história natural pós-PA?", a: "Fator de risco independente para progressão de PA para pancreatite crônica. Mecanismo: estresse oxidativo direto sobre células acinares e potencialização do efeito tóxico do álcool. A cessação do tabagismo na internação (usando intervenção breve + TRN ou vareniclina) é tão importante quanto a cessação do álcool na prevenção da recorrência e progressão." },
      { q: "Quando e como monitorizar risco cardiovascular após PA?", a: "PA é fator de risco independente para eventos cardiovasculares. A inflamação sistêmica pode acelerar aterosclerose e promover disfunção endotelial. Recomenda-se: avaliação de perfil lipídico e glicêmico na alta e após 3-6 meses; controle rigoroso de fatores de risco tradicionais (HAS, DM, dislipidemia); considerar rastreamento cardiovascular ativo em pacientes com PA grave ou recorrente." },
      { q: "Qual é o seguimento mínimo recomendado após primeiro episódio de PA e quais exames solicitar?", a: "Reavaliação em 2-4 semanas pós-alta: clínica (sintomas, peso, função GI), laboratorial (lipase, glicemia, HbA1c, perfil lipídico, vitaminas lipossolúveis se suspeita de insuficiência exócrina). Em 3-6 meses: elastase fecal (se sintomas de insuficiência exócrina), glicemia/HbA1c (rastreamento de DM3c), TC ou CPRM (se complicações locais pendentes). Seguimento por ≥ 12 meses para PA grave; seguimento vitalício se etiologia alcoólica ou PA recorrente." },
      { q: "Quais as peculiaridades do manejo da PA na gestante?", a: "Etiologia mais comum: biliar (70%). USG é exame de escolha (evitar TC no 1° trimestre). CPRM sem gadolínio é alternativa segura. CPRE pode ser realizada com segurança em qualquer trimestre (com blindagem e fluoroscopia minimizada). Colecistectomia laparoscópica: ideal no 2° trimestre. PA por hipertrigliceridemia: insulina IV é a terapia de escolha. Posicionamento em decúbito lateral esquerdo após 20 semanas. Mortalidade fetal significativa (10-20%) justifica manejo agressivo." },
      { q: "Por que a obesidade é fator de risco para PA mais grave?", a: "Três mecanismos: (1) maior volume de gordura peripancreática = mais substrato para saponificação e necrose lipomatosa; (2) tecido adiposo como órgão pró-inflamatório (adipocinas amplificam a resposta inflamatória sistêmica); (3) maior dificuldade técnica em procedimentos intervencionistas. Ressuscitação deve ser baseada em peso ideal (não real). IMC > 40 por si só é indicação de monitorização intensiva." },
      { q: "Qual é a melhor conduta na PA por hipertrigliceridemia com TG > 1.000 mg/dL?", a: "Insulina IV (0,1-0,3 UI/kg/h) é a terapia de primeira linha — ativa a lipoproteína lipase, acelerando o clearance de triglicerídeos. Monitorizar glicemia a cada hora. Heparina IV também ativa LPL, mas tem efeito rebote após suspensão. Plasmaférese é reservada para TG refratário ou PA grave. Coletar TG na admissão — valores caem rapidamente com jejum e fluidos." },
      { q: "Como diferenciar febre inflamatória (SIRS) de febre infecciosa (necrose infectada)?", a: "Febre inflamatória: presente desde o início, diminui progressivamente. Febre infecciosa: aparece ou piora após melhora inicial ('deterioração secundária'), geralmente dias 7-21. Pistas de infecção: procalcitonina > 3,8 ng/mL (sensibilidade ~90%), gás na coleção na TC (patognomônico, presente em 30-40%), bacteremia em hemocultura, falência orgânica nova. Na dúvida: iniciar carbapenêmico e reavaliar em 72h." }
    ]
  },
  {
    id: "drc",
    name: "Doença Renal Crônica (KDIGO 2024)",
    cards: [
      { q: "Qual é a definição de DRC?", a: "Anormalidade de estrutura ou função renal presente por > 3 meses, com implicações para a saúde: TFG < 60 ml/min/1,73 m² e/ou ≥ 1 marcador de lesão renal." },
      { q: "Quais são os marcadores de lesão renal que definem DRC?", a: "Albuminúria (RAC ≥ 30 mg/g), alterações do sedimento, hematúria persistente, distúrbios eletrolíticos por tubulopatia, alterações histológicas, alterações estruturais em imagem e transplante renal prévio." },
      { q: "Um paciente com TFG 75, RAC 10 mg/g, urina e rins normais tem DRC G2?", a: "Não. G1 e G2 só são DRC se houver marcador de lesão. Sem ele, não há DRC." },
      { q: "O que significa a sigla CGA?", a: "Causa, categoria de G (TFG, G1–G5) e categoria de Albuminúria (A1–A3). O estadiamento usa só TFG e albuminúria; a causa orienta o tratamento." },
      { q: "Quais os limites das categorias G3a, G3b e G4?", a: "G3a 45–59; G3b 30–44; G4 15–29 ml/min/1,73 m² (G5 < 15)." },
      { q: "Quais os limites das categorias de albuminúria?", a: "A1 < 30 mg/g; A2 30–300 mg/g; A3 > 300 mg/g (em mg/mmol: < 3; 3–30; > 30)." },
      { q: "Por que o limite de cronicidade é 3 meses?", a: "É arbitrário, mas separa a DRC da IRA/DRA (≤ 3 meses), que têm causas, prazos de tratamento e prognóstico diferentes." },
      { q: "Por que a diretriz exige sempre TFG e albuminúria?", a: "As duas predizem desfechos de forma independente e multiplicativa; com só uma, perde-se metade da informação prognóstica (ex.: G2 com RAC 300–999 tem mais risco relativo de falência renal que G3a com RAC < 10)." },
      { q: "Quem deve ser testado para DRC, com prioridade?", a: "Pessoas com HAS, diabetes e DCV (incluindo IC); depois IRA/DRA prévia, história familiar, doenças sistêmicas, uso de nefrotóxicos, exposições ocupacionais." },
      { q: "Quando iniciar o rastreio de DRC no DM2 e no DM1?", a: "DM2 desde o diagnóstico; DM1 5 anos após o diagnóstico; depois anualmente." },
      { q: "Como provar a cronicidade sem esperar 3 meses?", a: "TFG/albuminúria/sedimento prévios alterados, rins reduzidos com afilamento cortical, fibrose e atrofia na biópsia, ou doença de base que causa DRC." },
      { q: "Deve-se esperar 3 meses para começar o tratamento?", a: "Não. Se a DRC é provável pelo contexto, iniciar já na primeira apresentação; esperar atrasa o cuidado e muitos não retornam." },
      { q: "Achado incidental de RAC elevada em pessoa sem fator de risco: conduta?", a: "Repetir para confirmar antes de rotular — a probabilidade pré-teste é baixa e há variabilidade biológica e analítica." },
      { q: "Qual é a proporção de pessoas com DRC que carrega variante genética patogênica plausível?", a: "> 10%, mesmo sem história familiar." },
      { q: "A biópsia renal é segura na DRC e qual a principal complicação?", a: "Sim, quando indicada (guiada por US). A complicação mais comum é o hematoma perirrenal (cerca de 16%)." },
      { q: "Qual o teste inicial para avaliar a TFG?", a: "Creatinina sérica + equação validada (eGFRcr), a mesma em toda a região e sem coeficiente de raça — nunca a creatinina isolada." },
      { q: "Quando usar a eGFRcr-cys?", a: "Para diagnóstico/estadiamento quando a cistatina C está disponível, e quando a eGFRcr é menos acurada e a TFG muda a conduta." },
      { q: "Por que a combinação creatinina + cistatina C é mais acurada?", a: "Os determinantes não-TFG das duas são diferentes (creatinina: músculo, dieta, secreção; cistatina: adiposidade, tabagismo, tireoide, corticoide, inflamação), então os erros se cancelam parcialmente." },
      { q: "Quais os três determinantes não-TFG da creatinina?", a: "Geração (massa muscular e dieta), secreção tubular e eliminação extrarrenal." },
      { q: "Qual o efeito de uma refeição com carne cozida sobre a creatinina e como evitar?", a: "Eleva a creatinina em ~0,23 mg/dl (~20 ml/min a menos na eGFR); coletar ≥ 12 h sem carne ou peixe cozidos." },
      { q: "Qual a acurácia (P30) da eGFRcr-cys e o que isso significa?", a: "~90%: 90% das estimativas ficam a ±30% da TFG medida — 1 em 10 ainda erra ≥ 30%." },
      { q: "Quando medir a TFG com marcador exógeno?", a: "Quando a eGFRcr-cys é duvidosa (catabolismo, câncer de alta renovação, cirrose/IC avançadas, corticoide em dose alta, fragilidade extrema) ou a decisão exige precisão máxima (doação renal, quimioterápicos de índice estreito)." },
      { q: "Idoso sarcopênico: quais os dois erros de laboratório esperados?", a: "eGFRcr superestima a TFG (risco de superdosagem) e a RAC sai falsamente alta (creatinina urinária baixa no denominador)." },
      { q: "Qual equação de TFG é razoável na América do Sul segundo a diretriz?", a: "CKD-EPI, até haver equação regional, por ter incluído participantes negros e hispânicos no desenvolvimento." },
      { q: "Qual o exame preferido para albuminúria e em que amostra?", a: "RAC em primeira urina da manhã, jato médio." },
      { q: "Quatro fatores que elevam falsamente a RAC?", a: "Exercício, infecção urinária sintomática, menstruação e hematúria (também baixo peso, sexo feminino e IRA, por menor creatinina urinária)." },
      { q: "RAC ≥ 30 mg/g em amostra aleatória: próximo passo?", a: "Confirmar em primeira urina da manhã; fita positiva deve ser quantificada (RAC/RPC)." },
      { q: "Com que frequência dosar TFG e RAC na DRC?", a: "Pelo menos 1×/ano; mais em maior risco (até ≥ 4×/ano em G5 ou G4 A3), quando o resultado mudar a conduta." },
      { q: "Que variação da eGFR justifica investigar?", a: "> 20% em geral; > 30% após iniciar terapia hemodinamicamente ativa (IECA/BRA, ARM, iSGLT2, anti-hipertensivos)." },
      { q: "Que variação da RAC justifica investigar?", a: "Dobrar (confirmado). Reduções de até 50% podem ser só flutuação natural do exame." },
      { q: "Quais as variáveis da KFRE de 4 variáveis e em quem usar?", a: "Idade, sexo, eGFR e RAC; em G3–G5. Não é válida em G1–G2." },
      { q: "Quais os três limiares de risco da KFRE e as ações?", a: "≥ 3–5% em 5 anos → nefrologia; > 10% em 2 anos → cuidado multiprofissional; > 40% em 2 anos → preparo de acesso, transplante e educação sobre TRS." },
      { q: "Por que usar risco absoluto e não só o estágio?", a: "Dentro da mesma célula do mapa de calor, o risco de falência renal varia até ~4.000% entre indivíduos; e o benefício absoluto do tratamento é maior em quem tem mais risco." },
      { q: "Cite quatro critérios de encaminhamento ao nefrologista.", a: "TFG < 30; queda sustentada > 20%; RAC > 700 mg/g ou ≥ 300 com hematúria; cilindros hemáticos/> 20 hemácias por campo; HAS refratária a ≥ 4 drogas; K persistentemente alterado; causa incerta ou hereditária; KFRE > 3–5%/5 anos." },
      { q: "Quais os quatro pilares de primeira linha na DRC?", a: "iSGLT2, IECA/BRA na dose máxima tolerada (se albuminúria/HAS), estatina e meta de PA, sobre a base de estilo de vida." },
      { q: "Qual a meta de PA na DRC com HAS?", a: "PAS < 120 mmHg em medida padronizada, se tolerada; menos intensiva em frágeis, quedas, hipotensão postural e expectativa de vida curta." },
      { q: "A meta de PAS < 120 reduz falência renal?", a: "Não de forma relevante. O benefício da meta intensiva é cardiovascular (menos eventos CV)." },
      { q: "Qual a ingestão proteica recomendada em G3–G5 e o que evitar?", a: "0,8 g/kg/dia; evitar > 1,3 g/kg/dia em quem tem risco de progressão." },
      { q: "Quando considerar dieta muito hipoproteica e como?", a: "Alto risco de falência renal, paciente motivado e metabolicamente estável: 0,3–0,4 g/kg/dia + aminoácidos essenciais ou cetoanálogos (até 0,6 g/kg/dia), sob supervisão." },
      { q: "Qual a meta de sódio e em quem não restringir?", a: "< 2 g de sódio/dia (< 5 g de sal); não restringir em nefropatias perdedoras de sal." },
      { q: "Atividade física recomendada na DRC?", a: "Moderada, ≥ 150 min/semana cumulativos, ou o compatível com a tolerância; evitar sedentarismo." },
      { q: "Indicações de IECA/BRA por albuminúria e diabetes?", a: "Com DM e A2–A3: indicados. Sem DM: indicados em A3 e sugeridos em A2. A1: só por outra indicação (HAS, ICFEr). Valem mesmo sem HAS." },
      { q: "Qual dose de IECA/BRA usar?", a: "A maior dose aprovada que o paciente tolerar." },
      { q: "Quando checar exames após iniciar IECA/BRA e qual elevação da creatinina é aceitável?", a: "PA, creatinina e K em 2–4 semanas; manter se a creatinina subir até 30% em 4 semanas." },
      { q: "Creatinina sobe 45% após iniciar IECA. O que investigar?", a: "Causas de IRA: hipovolemia, AINE/diuréticos e estenose de artéria renal." },
      { q: "Deve-se suspender IECA/BRA quando a TFG cai abaixo de 30?", a: "Não. Suspender não traz benefício; manter adia a necessidade de TRS." },
      { q: "O que nunca combinar?", a: "IECA + BRA + inibidor direto de renina em qualquer combinação." },
      { q: "Indicações principais de iSGLT2 na DRC?", a: "TFG ≥ 20 com DM2, ou com RAC ≥ 200 mg/g, ou com insuficiência cardíaca (qualquer albuminúria)." },
      { q: "E com TFG 20–45 e RAC < 200 mg/g?", a: "Sugere-se iSGLT2 também." },
      { q: "Se a TFG cair abaixo de 20 durante o uso, o que fazer?", a: "Manter até intolerância ou início de TRS." },
      { q: "Quais os benefícios do iSGLT2 na DRC?", a: "Reduz progressão renal (~1/3), IRA, morte CV/hospitalização por IC e, em menor grau, eventos CV maiores — com e sem diabetes." },
      { q: "Por que o benefício líquido é maior em quem não tem diabetes?", a: "Porque não há excesso de cetoacidose nem amputação fora do diabetes (no DM2: ~1 de cada por 1.000 pacientes-ano)." },
      { q: "A queda inicial da TFG com iSGLT2 indica suspender?", a: "Não — é hemodinâmica e reversível; não é preciso nem recoletar exames após iniciar." },
      { q: "Quando suspender iSGLT2 temporariamente?", a: "Jejum prolongado, doença aguda grave e cirurgia (3–4 dias antes de cirurgia eletiva) — risco de cetose." },
      { q: "Critérios para finerenona?", a: "DM2, TFG > 25, K normal e albuminúria > 30 mg/g apesar de IECA/BRA em dose máxima; pode somar a iSGLT2." },
      { q: "Dose inicial de finerenona e monitorização?", a: "10 mg/dia (TFG 25–59) ou 20 mg/dia (TFG ≥ 60) se K ≤ 4,8; K em 1 mês e a cada 4 meses; suspender se K > 5,5 e reiniciar com K ≤ 5,0." },
      { q: "Qual o principal benefício cardiovascular da finerenona?", a: "Redução de hospitalização por IC; sem efeito em AVC." },
      { q: "Quando usar AR-GLP-1 na DRC e quais dispensam ajuste?", a: "DM2 sem meta glicêmica com metformina + iSGLT2 (ou que não os tolera); liraglutida, semaglutida injetável, dulaglutida." },
      { q: "Indicações de estatina na DRC?", a: "≥ 50 anos com DRC sem diálise; 18–49 anos se DAC, DM, AVC isquêmico ou risco coronariano em 10 anos > 10%." },
      { q: "Quais regimes de estatina são seguros e intensivos na DRC?", a: "Atorvastatina 20 mg, rosuvastatina 10 mg, sinvastatina 20 mg + ezetimiba 10 mg, 1×/dia." },
      { q: "Por que começar estatina cedo na DRC?", a: "Porque o benefício por redução de LDL diminui à medida que a TFG cai, e é pequeno em diálise." },
      { q: "AAS na DRC: prevenção primária ou secundária?", a: "Secundária (75–100 mg/dia). Na primária, o sangramento anula o benefício — sem recomendação." },
      { q: "Anticoagulante preferido na FA com DRC G1–G4?", a: "DOAC em vez de varfarina, com ajuste de dose pela depuração de creatinina." },
      { q: "Por que quase todo paciente com DRC e FA deve ser considerado para anticoagulação?", a: "~95% com TFG < 60 têm CHA₂DS₂-VASc ≥ 2, e mesmo com escore 0–1 a taxa de tromboembolismo é 2,9%/ano vs. 0,2% sem DRC." },
      { q: "Qual o limiar de bicarbonato a evitar na DRC?", a: "Evitar < 18 mmol/l. Corrigir acima disso não mostrou reduzir a falência renal." },
      { q: "Hipercalemia: conduta por gravidade?", a: "≥ 6,5: ação imediata com ECG; 6,0–6,4: hospital se doente/IRA, repetir em 24 h se resultado inesperado em pessoa bem." },
      { q: "Ordem de condutas na hipercalemia não emergencial?", a: "1) corrigir fatores (drogas, dieta, constipação); 2) diurético, bicarbonato, quelante; 3) por último reduzir iSRAA/ARM — e reiniciar." },
      { q: "Por que não proibir frutas e vegetais na DRC?", a: "O K vegetal é menos absorvido (50–60%) e esses alimentos protegem na DRC inicial; os vilões são processados (~90% de absorção), carnes, sucos e sal de KCl." },
      { q: "Qual quelante de potássio tem ação mais rápida e qual o risco grave do poliestirenossulfonato?", a: "Ciclossilicato de zircônio sódico (< 1 h); poliestirenossulfonato pode causar necrose/perfuração intestinal." },
      { q: "Tratar hiperuricemia assintomática para proteger o rim?", a: "Não: tratar hiperuricemia assintomática não protege o rim." },
      { q: "Tratamento da crise de gota na DRC?", a: "Colchicina em dose baixa (1,2 mg + 0,6 mg após 1 h) ou glicocorticoide (ex.: prednisolona 30 mg/dia por 3–5 dias) — não AINE." },
      { q: "Por que preferir alopurinol ao febuxostato em quem tem DCV?", a: "Porque o febuxostato se associa a maior mortalidade total e cardiovascular em pacientes com doença CV." },

      { q: "Reposição IV de Mg na hipocalcemia com hipomagnesemia?", a: "Sulfato de Mg 2 g (16 mEq) em 10–20 min, depois 1 g/h enquanto Mg < 1 mg/dL; metade da dose na insuficiência renal." },

      { q: "Esquema crônico padrão do HPT?", a: "Carbonato de Ca às refeições (1–2 g/dia de Ca elementar) + calcitriol 0,25–2 µg/dia em 2–3 tomadas + D₃ para 25(OH)D > 30; dieta pobre em P e Na." },

      { q: "Quais são os 5 passos da abordagem das valvopatias na diretriz SBC 2020?", a: "1) Gravidade anatômica; 2) Etiologia; 3) Sintomas; 4) Fatores prognósticos (em assintomáticos); 5) Tipo de intervenção (Heart Team). O raciocínio é sequencial: só se avança ao próximo passo se o anterior indicar necessidade." },
      { q: "Qual a faixa de risco pelo STS score para classificar risco cirúrgico?", a: "Baixo risco: < 4%; risco intermediário: 4-8%; alto risco: > 8%. O EuroSCORE II classifica como baixo < 4% e alto > 4%. Em caso de discrepância, usa-se o de maior risco." },
      { q: "Por que a avaliação de fragilidade é importante na decisão cirúrgica em valvopatias?", a: "Fragilidade prediz mortalidade, tempo de internação e declínio funcional pós-intervenção. Não é contemplada nos escores STS e EuroSCORE II, exigindo avaliação individualizada com instrumentos objetivos (status funcional, nutricional, cognitivo)." },
      { q: "Qual o mecanismo fisiopatológico central da EM reumática?", a: "Fusão comissural + espessamento de folhetos + calcificação + encurtamento de cordas → obstrução diastólica ao fluxo AE→VE → aumento do gradiente transmitral → aumento da pressão no AE → congestão pulmonar → HP (passiva depois reativa) → dilatação do AE → FA → IC direita." },
      { q: "Por que a VBMP não se aplica à estenose mitral degenerativa (MAC)?", a: "A VBMP requer fusão comissural para ser efetiva (separa as comissuras fundidas). Na MAC, não há fusão comissural — o mecanismo é calcificação do anel mitral restringindo a mobilidade dos folhetos. A abertura por balão não resolve esse tipo de obstrução." },
      { q: "Quais são os critérios ecocardiográficos de EM grave?", a: "AVM < 1,5 cm²; gradiente diastólico médio ≥ 10 mmHg; PSAP em repouso ≥ 50 mmHg; PSAP ao esforço ≥ 60 mmHg." },
      { q: "Descreva o escore de Wilkins-Block e como ele orienta a decisão terapêutica.", a: "Avalia 4 parâmetros (mobilidade dos folhetos, espessamento subvalvar, espessura dos folhetos, calcificação), pontuando cada um de 1 a 4 (total 4-16). Escore ≤ 8 com calcificação ≤ 2 → anatomia favorável para VBMP. Escore > 10 → anatomia desfavorável → cirurgia." },
      { q: "Quais são as contraindicações da VBMP?", a: "Trombo em AE; IM moderada ou grave; evento embólico recente. Também: MAC (ausência de fusão comissural) e Wilkins > 10 (anatomia desfavorável)." },
      { q: "Quando a SBC indica VBMP na estenose mitral assintomática?", a: "Em assintomáticos com fatores prognósticos (hipertensão pulmonar, FA) e anatomia favorável — a SBC é a diretriz mais agressiva em indicar intervenção precoce nesse grupo." },
      { q: "O que é valve-in-MAC e quais suas limitações?", a: "Implante transcateter de prótese no anel mitral calcificado. Mortalidade de até 25% em 30 dias e 54% em 12 meses. Tecnologia em fase de validação — indicação IIb C* (SBC). Pacientes com MAC e comorbidades graves devem ser mantidos em tratamento clínico otimizado." },
      { q: "Por que a dispneia na EM piora com taquicardia?", a: "Porque o enchimento ventricular depende do tempo diastólico. Taquicardia encurta a diástole → menor tempo para o sangue cruzar a valva estenosada → aumento do gradiente transmitral → aumento da pressão no AE → congestão pulmonar. Isso é a base do uso de BB/BCC na EM." },
      { q: "Na IM primária crônica, por que uma FEVE de 60% já pode indicar disfunção?", a: "Na IM, o VE ejeta parte do volume para o AE (câmara de baixa pressão), reduzindo a pós-carga efetiva. Isso deveria resultar em FEVE supra-normal (> 65-70%). Uma FEVE 'normal' de 60% já pode significar disfunção contrátil inicial. Por isso, a cirurgia é indicada com FEVE ≤ 60% (não 55%)." },
      { q: "Quais são os critérios ecocardiográficos de IM primária grave?", a: "Área do jato ≥ 40% do AE; fração regurgitante ≥ 50%; volume regurgitante ≥ 60 mL/bat; vena contracta ≥ 0,7 cm; EROA ≥ 0,40 cm²." },
      { q: "Qual é o tratamento de escolha na IM primária e por quê?", a: "Reparo valvar mitral (plastia), especialmente no prolapso de P2. Vantagens: preserva geometria ventricular e aparato subvalvar, evita anticoagulação permanente. Na etiologia reumática, os resultados do reparo são menos favoráveis — avaliar individualmente." },
      { q: "Quais fatores prognósticos indicam intervenção na IM primária assintomática?", a: "FEVE ≤ 60% ou declínio progressivo; DVSD ≥ 40 mm; PSAP em repouso ≥ 50 mmHg ou ≥ 60 mmHg ao exercício; volume de AE ≥ 60 mL/m²; FA de início recente (< 1 ano). O volume de AE ≥ 60 mL/m² é contribuição da SBC, sem destaque equivalente na AHA/ESC." },
      { q: "Quando indicar reparo percutâneo (MitraClip/PASCAL) na IM primária?", a: "Pacientes de alto risco cirúrgico ou com contraindicação à cirurgia, IM degenerativa por prolapso, anatomia favorável. Decisão obrigatória do Heart Team." },
      { q: "Qual a diferença fundamental entre IM primária e secundária?", a: "Primária: patologia na valva (folhetos, cordas, anel). Secundária: folhetos e cordas normais — a regurgitação resulta de alterações ventriculares (disfunção/dilatação do VE desloca papilares, causando tethering dos folhetos)." },
      { q: "Por que os limiares de gravidade ecocardiográficos na IM secundária são menores que na primária?", a: "Porque um VE já disfuncionante tolera menos a sobrecarga adicional de volume. EROA ≥ 0,20 cm² na IM secundária já pode ser considerada grave (vs. ≥ 0,40 cm² na primária), pois volumes regurgitantes menores se associam a pior prognóstico quando o VE já está comprometido." },
      { q: "Em qual IM secundária o reparo percutâneo (MitraClip) traz benefício?", a: "Na IM 'desproporcional' — grave em relação ao grau de dilatação do VE. Quando o VE está muito dilatado e a IM é proporcional (reflexo da dilatação), corrigir a IM sem tratar a causa não melhora o desfecho." },
      { q: "Qual o princípio fundamental do tratamento da IM secundária?", a: "A correção da IM secundária isoladamente, sem tratar a doença de base, tem resultados insatisfatórios. Otimizar tratamento clínico da IC (IECA/BRA, BB, diurético, CRT se indicado) é pré-requisito antes de considerar intervenção valvar." },
      { q: "Quais critérios favorecem o reparo percutâneo na IM secundária?", a: "FEVE ≥ 20%, DVSD < 70 mm, sintomático CF ≥ III apesar de terapia otimizada, alto risco/contraindicação cirúrgica. SBC: IIa B. Fundamental: critérios de proporcionalidade (COAPT) — IM desproporcional à dilatação do VE." },
      { q: "Explique a cascata fisiopatológica da EAo e como ela gera a tríade clássica.", a: "Obstrução ao fluxo de saída → ↑ pós-carga → hipertrofia concêntrica (Lei de Laplace). Consequências: 1) Disfunção diastólica → ↑ pressão de enchimento → DISPNEIA; 2) ↑ demanda O₂ + compressão microvascular → isquemia subendocárdica → ANGINA; 3) Incapacidade de ↑ fluxo ao esforço + vasodilatação → SÍNCOPE." },
      { q: "Quais são os critérios ecocardiográficos de EAo grave?", a: "AVA ≤ 1,0 cm²; AVA indexada ≤ 0,6 cm²/m²; gradiente médio ≥ 40 mmHg; Vmáx jato aórtico ≥ 4,0 m/s; razão de fluxo VSVE/VAo < 0,25." },
      { q: "O que é EAo baixo fluxo/baixo gradiente e como diferenciá-la de pseudo-EAo?", a: "AVA ≤ 1,0 cm² + FEVE < 50% + gradiente médio < 40 mmHg. Eco de estresse com dobutamina: com reserva contrátil → se AVA permanece < 1,0 cm² = EAo verdadeira. Sem reserva contrátil → escore de cálcio na TC (> 2.000 AU homens, > 1.300 AU mulheres confirma EAo grave)." },
      { q: "O que é a EAo paradoxal?", a: "AVA ≤ 1,0 cm² + FEVE > 50% + gradiente < 40 mmHg. A FEVE é preservada mas o fluxo transvalvar é baixo. Confirmar com: AVA indexada ≤ 0,6 cm²/m²; escore de cálcio elevado; PAS ≤ 140 mmHg; volume de ejeção indexado < 35 mL/m²." },
      { q: "Por que angina na EAo nem sempre significa doença coronariana?", a: "Até 50% dos pacientes com EAo grave e angina não têm DAC obstrutiva. A angina resulta do desequilíbrio oferta/demanda de O₂ no miocárdio hipertrofiado (↑ demanda + compressão microvascular + ↓ reserva coronariana), não necessariamente de obstrução epicárdica." },
      { q: "Qual a sobrevida média sem intervenção para cada sintoma da tríade da EAo?", a: "Dispneia: 5 anos; angina: 3 anos; síncope: 2 anos. Morte súbita em assintomáticos é rara (< 1%/ano), fundamentando vigilância sem intervenção precoce." },
      { q: "Quando indicar TAVI vs. cirurgia na EAo grave?", a: "Inoperável/risco proibitivo → TAVI (I A). Alto risco → TAVI (I A). Risco intermediário → Heart Team (I A SBC, IIa B AHA). Baixo risco > 70 anos → TAVI pode ser considerada (I A SBC). Baixo risco < 70 anos → EVITAR TAVI (IIb C SBC) — dados de durabilidade insuficientes." },
      { q: "Por que a SBC recomenda evitar TAVI em pacientes < 70 anos de baixo risco?", a: "Porque a durabilidade das próteses transcateter além de 7-8 anos é desconhecida, e um paciente de 60 anos precisa de 20 anos ou mais de durabilidade. Nesses pacientes, a cirurgia é preferida." },
      { q: "Quais fatores prognósticos indicam intervenção na EAo assintomática?", a: "FEVE < 50% (I B); TE positivo — queda ou ↑ < 20 mmHg PA, arritmia ventricular, ST ↓ ≥ 2mm (IIa B); EAo 'muito grave' — AVA < 0,7 cm², Vmáx > 5,0 m/s, gradiente > 60 mmHg (IIa C). TE é CONTRAINDICADO em sintomáticos e em disfunção de VE." },
      { q: "Qual o papel da VAB na EAo?", a: "Ponte terapêutica em instabilidade hemodinâmica antes de TAVI/cirurgia, ou paliativa quando ambos são contraindicados. Não é tratamento definitivo — reestenose é a regra. IIa C (SBC), IIb C (AHA, ESC)." },
      { q: "Qual o tipo de sobrecarga ventricular na IAo crônica e por que difere das outras valvopatias?", a: "Sobrecarga COMBINADA de volume (regurgitação diastólica → hipertrofia excêntrica) e pressão (volume de ejeção total aumentado → ↑ PAS → hipertrofia concêntrica). Resultado: hipertrofia mista com ventrículos de grandes volumes. Isso difere da EM (pós-carga normal) e da EAo (sobrecarga de pressão pura)." },
      { q: "Por que a SBC adota limiares diferentes de diâmetro ventricular para IAo reumática vs. não-reumática?", a: "Pacientes com IAo reumática são jovens e toleram ventrículos muito dilatados antes de perder função. Por isso a SBC usa DVDF > 75 mm e DVSD > 55 mm na reumática; na não reumática, DVDF > 70 mm e DVSD > 50 mm (iguais a AHA/ESC)." },
      { q: "Quais são os sinais periféricos clássicos da IAo e qual seu mecanismo?", a: "Pulso de Corrigan (martelo d'água), sinal de Musset (oscilação cefálica), Hill (PA sistólica MMII > MMSS ≥ 20mmHg), Quincke (pulsação no leito ungueal), Traube (pistol shot nas femorais), Duroziez (sopro femoral). Mecanismo: grande divergência PAS/PAD por volume de ejeção aumentado + regurgitação diastólica → pressão de pulso alargada." },
      { q: "Quando indicar cirurgia na IAo crônica assintomática?", a: "FEVE < 50% (I B). Diâmetros aumentados (IIa B): não-reumáticos DVDF > 70mm ou DVSD > 50mm; reumáticos DVDF > 75mm ou DVSD > 55mm. DVSD indexado > 25 mm/m² também é critério." },
      { q: "A TAVI tem papel no tratamento da IAo crônica?", a: "Papel muito limitado. SBC: IIb C* — apenas em sintomáticos com expectativa de vida > 1 ano e contraindicação/risco proibitivo para cirurgia. AHA e ESC não incluem recomendação para TAVI na IAo. Requer discussão do Heart Team." },
      { q: "Por que a angina na IAo pode ser noturna?", a: "A bradicardia do sono aumenta o tempo diastólico, aumentando o volume regurgitante e diminuindo a pressão diastólica aórtica. Resultado: maior sobrecarga de volume + menor perfusão coronariana diastólica → isquemia subendocárdica. A angina noturna na IAo é consequência direta do mecanismo regurgitante diastólico." },
      { q: "Em qual valvopatia os DOACs são CONTRAINDICADOS quando há FA?", a: "Na estenose mitral moderada a grave com FA: DOACs são contraindicados — usar varfarina, sem exceção." },
      { q: "Por que os DOACs são contraindicados em próteses mecânicas?", a: "Porque a dabigatrana causou excesso de tromboembolismo e sangramento em próteses mecânicas. Varfarina é obrigatória em TODAS as próteses mecânicas." },
      { q: "Qual o esquema de anticoagulação pós-TAVI em ritmo sinusal?", a: "AAS + clopidogrel por 3-6 meses. NÃO usar rivaroxabana profilática pós-TAVI em ritmo sinusal (aumenta trombose e sangramento)." },
      { q: "Qual o alvo de INR para varfarina em prótese mecânica mitral vs. aórtica?", a: "Prótese mecânica mitral: INR alvo 2,5-3,5. Prótese mecânica aórtica: INR alvo 2,0-3,0. A posição mitral exige alvo mais alto pelo maior risco trombótico (fluxo mais lento) e pela área de contato com o sangue." },
      { q: "Em quais valvopatias os DOACs PODEM ser considerados para FA?", a: "Valvopatias não estenóticas mitrais (IM, EAo, IAo) com FA: DOACs podem ser usados. Mas EM + FA e prótese mecânica + FA = varfarina obrigatória." },
      { q: "O que é TTR e qual seu valor ideal na terapia com varfarina?", a: "TTR = Time in Therapeutic Range (tempo no alvo terapêutico). Ideal > 65%. Mede a qualidade do controle anticoagulante. TTR < 65% se associa a maior risco de tromboembolismo e sangramento. Se TTR consistentemente baixo, considerar centro de anticoagulação." },
      { q: "O que o fracasso do MITRA-FR ensina sobre mecanismo da IM secundária?", a: "Confirma que a IM secundária é mais um marcador de doença ventricular avançada do que uma causa independente de mau prognóstico (quando proporcional à dilatação). Corrigir o sintoma (IM) sem tratar a causa (VE doente) não melhora desfecho — é uma confirmação mecanística, não um 'fracasso' terapêutico." },
      { q: "Como a Lei de Laplace explica a hipertrofia concêntrica na EAo?", a: "Estresse parietal = (Pressão × Raio) / (2 × Espessura). Na EAo, a pressão intraventricular aumenta (pós-carga elevada). Para normalizar o estresse, o VE aumenta a espessura da parede (hipertrofia concêntrica, com adição de sarcômeros em paralelo), mantendo o raio constante." },
      { q: "Qual o papel do BNP/NT-proBNP na avaliação de valvopatias?", a: "Marcador de estresse parietal ventricular. Útil como preditor prognóstico em assintomáticos (especialmente EAo). BNP elevado em assintomático com EAo grave sugere disfunção subclínica e pode favorecer intervenção precoce (mencionado pela ESC como critério adicional). A diretriz SBC não o incorpora formalmente como critério de decisão." },
      { q: "O que é a classificação funcional de Carpentier e como se aplica à IM?", a: "Tipo I: mobilidade normal dos folhetos (dilatação anular); Tipo II: excesso de mobilidade (prolapso, rotura de cordas); Tipo III: mobilidade restrita — IIIa: orgânica (reumática, retração) ou IIIb: funcional (tethering). IM primária = tipos I, II, IIIa. IM secundária = tipo IIIb." },
      { q: "Qual a diferença entre HP passiva e reativa na EM?", a: "HP passiva: transmissão retrógrada da pressão do AE para as veias pulmonares → artérias pulmonares (gradiente transpulmonar normal). HP reativa: vasoconstrição arteriolar pulmonar em resposta à congestão crônica → aumento desproporcional da pressão na artéria pulmonar (gradiente transpulmonar elevado). A reativa é parcialmente irreversível." },
      { q: "Qual a importância da profilaxia de febre reumática no contexto das valvopatias?", a: "A febre reumática é a principal causa de valvopatias em pacientes jovens no Brasil. A profilaxia secundária com penicilina benzatina (1.200.000 UI IM a cada 21 dias) previne novos surtos e progressão da cardiopatia reumática. Duração: até 40 anos ou 10 anos após último surto (com cardiopatia) — o que for maior." },
      { q: "O que é a IM desproporcional (conceito do COAPT)?", a: "IM secundária cujo EROA é grande (≥ 0,30 cm²) em relação ao volume diastólico final do VE (< 96 mL/m²). Indica que a IM contribui significativamente para o quadro clínico além do que seria esperado pela dilatação ventricular isolada. Esses pacientes se beneficiam do reparo percutâneo." },
      { q: "Quais parâmetros de RM cardíaca são úteis como fatores prognósticos na IAo?", a: "Realce tardio com gadolínio (fibrose miocárdica — marcador de disfunção irreversível); fração regurgitante > 33%; volume diastólico final > 246 mL. A RM é especialmente útil quando há discordância clínico-ecocardiográfica e para avaliar diâmetros ventriculares em janelas ecocardiográficas limitadas." },
      { q: "Qual a duração da anticoagulação com varfarina após implante de bioprótese?", a: "3-6 meses (IIb — SBC), depois transição para AAS ou nada (se ritmo sinusal). A razão é que o endotelização da bioprótese leva tempo, com risco trombótico concentrado nos primeiros meses. Após esse período, sem FA, anticoagulação não é mais necessária." },
      { q: "Qual o racional farmacológico do controle de frequência na EM?", a: "O gradiente transmitral na EM é frequência-dependente: taquicardia encurta a diástole → menos tempo de enchimento → maior gradiente → mais congestão. BB e BCC diminuem a FC, prolongando o tempo diastólico e reduzindo o gradiente. Ivabradina é alternativa em ritmo sinusal quando BB/BCC não são tolerados." },
      { q: "Por que IECA/BRA não são indicados de rotina na IM primária assintomática?", a: "Na IM primária com VE compensado, a redução da pós-carga com IECA/BRA poderia mascarar a progressão da doença ao melhorar os parâmetros hemodinâmicos, atrasando a indicação cirúrgica. São indicados apenas na IC descompensada ou na IM secundária como parte do tratamento da doença de base." },
      { q: "Qual a diferença de posologia da apixabana na dose reduzida?", a: "Dose usual: 5 mg 2×/dia. Dose reduzida: 2,5 mg 2×/dia se ≥ 2 de 3 critérios: idade ≥ 80 anos, peso ≤ 60 kg, creatinina ≥ 1,5 mg/dL. Contraindicada se ClCr < 15 mL/min." },
      { q: "Por que a edoxabana é contraindicada em ClCr > 95 mL/min?", a: "Em ClCr elevado, a eliminação renal da edoxabana é maior, resultando em níveis séricos subterapêuticos e menor eficácia antitrombótica. Dose usual: 60 mg 1×/dia (30 mg se indicado)." },
      { q: "Onde a SBC diverge significativamente da AHA na indicação de TAVI?", a: "SBC recomenda TAVI para baixo risco > 70 anos como I A (AHA não tem essa indicação separada). SBC explicita IIb C para < 70 anos. AHA é mais conservadora em expandir TAVI para baixo risco. Para risco intermediário: SBC I A vs. AHA IIa B." },
      { q: "Onde a ESC diverge da SBC no limiar de DVSD para indicar cirurgia na IM primária?", a: "ESC usa DVSD ≥ 45 mm (mais conservadora). SBC e AHA usam DVSD ≥ 40 mm. A diferença de 5 mm pode significar adiar a cirurgia na prática, com risco de fibrose irreversível no intervalo. Isso exemplifica como limiares de diferentes diretrizes geram condutas diferentes." },
      { q: "Qual a particularidade brasileira mais importante na diretriz de IAo?", a: "A SBC é a única diretriz que distingue limiares de DVDF e DVSD conforme etiologia: reumáticos toleram diâmetros maiores antes de disfunção irreversível (DVDF > 75mm vs. > 70mm)." }
    ]
  },

      { q: "Qual a proporção de pericardites com miocardite concomitante?", a: "Cerca de 15% (perimiocardite se miocardite domina; miopericardite se pericardite domina). [3.4]" },

      { q: "Qual é o eixo molecular central da pericardite recorrente?", a: "Inflamassoma NLRP3 → caspase-1 → IL-1β, com IL-1α como alarmina; alça autoinflamatória que se retroalimenta via IL-1R. [3.2]" },
      { q: "Em que degrau da cascata age a colchicina? E o AINE?", a: "Colchicina: impede a agregação do inflamassoma (a montante da IL-1β). AINE/AAS: inibem a COX (prostaglandinas). [3.2]" },
      { q: "Diferença entre anakinra e rilonacepte?", a: "Anakinra antagoniza o receptor de IL-1; rilonacepte é \"armadilha\" que captura IL-1α e IL-1β. [3.2]" },
      { q: "Fenótipo inflamatório vs não inflamatório: frequência e marcas?", a: "Inflamatório 80–90%: PCR alta, febre, leucocitose neutrofílica, derrames, LGE pericárdico. Não inflamatório 10–20%: PCR baixa, associado a autoimunidade. [3.2]" },
      { q: "Por que tamponamento depende mais da velocidade do que do volume?", a: "Curva pressão–volume em \"J\": acúmulo lento dá tempo ao pericárdio de ganhar complacência; acúmulo rápido estoura a reserva. [3.1]" },
      { q: "Que evento tecidual o T2 prolongado representa na RMC? E o LGE?", a: "T2: edema (atividade aguda). LGE: necrose/fibrose (lesão estabelecida). [3.3]" },
      { q: "Por que o e' medial é normal ou alto na constrição e baixo na restrição?", a: "Na constrição o miocárdio é sadio (relaxamento preservado); na restrição a doença é do próprio miocárdio. [3.5]" },
      { q: "Volume normal de líquido pericárdico?", a: "20–50 mL de ultrafiltrado. Derrame = > 50 mL. [3.1, 6.3]" },
      { q: "Quais as três apresentações clássicas da miocardite?", a: "Dor torácica, arritmia (incluindo síncope e morte súbita) e IC/choque cardiogênico. [4.1]" },
      { q: "⚠ Sintomas gastrointestinais numa suspeita de miocardite podem significar o quê?", a: "Baixo débito — manifestação hemodinâmica de IC. [4.1]" },
      { q: "Defina os estágios A, B, C e D da miocardite.", a: "A: em risco, sem doença. B: assintomático com evidência (histologia, RMC ou hs-cTn + suporte). C: sintomático com essa evidência. D: C + instabilidade hemodinâmica (inotrópico, vasopressor, SCT) ou elétrica com intervenção. [4.2]" },
      { q: "O paciente pode descer de estágio na miocardite?", a: "Sim — ao contrário da IC. C que mantém inflamação vira B; C recuperado volta a A. [4.2]" },
      { q: "Que fração dos atletas jovens com miocardite na RMC pós-COVID-19 era assintomática?", a: "Cerca de três quartos. [4.2]" },
      { q: "Classificação da pericardite por duração?", a: "Aguda < 4–6 semanas; incessante > 4–6 semanas sem remissão (< 3 meses); recorrente após 4–6 semanas livres; crônica > 3 meses. [4.3]" },
      { q: "Frequências de atrito, ECG típico e derrame na pericardite?", a: "Atrito < 1/3; ECG (supra difuso/infra de PR) até 60%; derrame até 60%. [4.3]" },
      { q: "Sinais de mau prognóstico na pericardite aguda?", a: "Febre alta, curso subagudo, derrame grande/tamponamento, falha de AINE, miocardite concomitante. [4.3]" },
      { q: "⚠ Que pericardite é frequentemente subdiagnosticada?", a: "Pós-procedimento ou pós-cirurgia cardíaca (confundida com dor esperada). [4.3]" },
      { q: "BAV numa miocardite sugere quais etiologias?", a: "Sarcoidose, células gigantes, doença de Lyme. [3.3]" },

      { q: "⚠ Troponina normal exclui miocardite?", a: "Não. Já houve fulminante e células gigantes com troponina normal; não há estratégia de exclusão por hs-cTn validada. [5.1]" },
      { q: "Critérios de Lake Louise 2018?", a: "≥ 1 critério T2 (mapa T2 ou T2 ponderado) + ≥ 1 critério T1 (T1 elevado, LGE não isquêmico ou ECV aumentado). [5.1]" },
      { q: "Sensibilidade e melhor momento da RMC na miocardite?", a: "> 85%; 1ª–2ª semana após os sintomas. [5.1]" },
      { q: "Padrão de LGE típico de miocardite?", a: "Mesocárdico e/ou subepicárdico, paredes lateral e inferior. [5.1]" },
      { q: "LGE subendocárdico difuso além de um território com trombo no VE sugere?", a: "Miocardite eosinofílica (após excluir DAC multiarterial). [5.1]" },
      { q: "O que significa a presença de realce tardio (LGE) na RMC da miocardite?", a: "Pior prognóstico: o LGE se associa a risco muito maior de morte por todas as causas e de morte cardíaca. [5.1]" },
      { q: "Em quem a BEM está indicada?", a: "B em uso de ICI; C com disfunção do VE, IC, arritmia grave (BAV alto grau, EV multifocais, TV/FV), eosinofilia periférica ou incerteza sem RMC; maioria dos D. [5.1]" },
      { q: "Em quem a BEM NÃO está indicada?", a: "B não relacionado a ICI; C de baixo risco (FEVE normal, LGE ausente/mínimo, estável). [5.1]" },
      { q: "Técnica que aumenta o rendimento da BEM?", a: "Precoce (2–4 semanas), ≥ 3 fragmentos de 1–2 mm, guiada por voltagem (sensibilidade 83%), formol + material congelado/RNAlater para PCR viral. [5.1]" },
      { q: "Taxa de complicações da BEM?", a: "Maiores < 1% em centros experientes; menores 5–6%. [5.1]" },
      { q: "Critério imuno-histoquímico (OMS/ESC) de miocardite?", a: "≥ 14 leucócitos/mm² (até 4 monócitos/mm²) com ≥ 7 linfócitos T CD3+/mm². [5.1]" },
      { q: "O que é miocardite \"borderline\" de Dallas?", a: "Infiltrado inflamatório sem necrose de miócitos. [5.1]" },
      { q: "Critérios diagnósticos de pericardite do ACC 2025?", a: "Dor pleurítica obrigatória + achados (atrito, ECG, PCR/VHS, derrame novo/em piora, inflamação na RMC): 0 improvável, 1 possível, ≥ 2 definida. [5.2]" },
      { q: "⚠ Divergência ACC × ESC no diagnóstico de pericardite?", a: "ACC exige dor; ESC aceita apresentação atípica sem dor (ex.: idoso) com sinais objetivos. [5.2]" },
      { q: "Quando a RMC é recomendada na pericardite?", a: "Recomendada na recorrente/incessante; razoável na aguda (complicada/duvidosa); útil antes de escalar terapia e na suspeita de constrição. [5.2]" },
      { q: "Combinações LGE/T2-STIR na RMC pericárdica?", a: "LGE+/T2+: aguda ou surto; LGE+/T2−: subaguda/crônica; LGE−/T2−: resolução ou calcificada terminal. [5.2]" },
      { q: "Como se gradua LGE pericárdico grave?", a: "≥ 50% da circunferência em 3 cortes E espessura > 3 mm. [5.2]" },

      { q: "História natural da miocardite comprovada por biópsia?", a: "~50% resolve em 2–4 semanas; ~25% disfunção persistente; 12–25% morte ou progressão a CMD terminal/transplante. [6.1]" },

      { q: "Recorrência da pericardite após 1º episódio e após 1ª recorrência?", a: "15–30% e até 50%. [6.2]" },
      { q: "Tamanhos de derrame no eco?", a: "Pequeno < 1 cm; moderado 1,0–1,9; grande 2,0–2,5; muito grande > 2,5 cm. [6.3]" },
      { q: "Sinal ecocardiográfico mais específico e mais sensível de tamponamento?", a: "Mais específico: colapso diastólico do VD. Mais sensível (triagem): VCI > 2,1 cm sem variação respiratória. [6.4]" },
      { q: "Variação respiratória de influxo no tamponamento?", a: "Mitral > 30%; tricúspide > 60%. [6.4]" },
      { q: "O que define pericardite efusivo-constritiva?", a: "Constrição que persiste após drenar o derrame (PAD não cai após pericardiocentese). [6.5]" },
      { q: "Achados ecocardiográficos de constrição?", a: "Septal shift, E predominante, e' medial > 8 cm/s, annulus reversus, VCI pletórica, reversão expiratória hepática ≥ 0,8, variação E mitral > 25%/tricúspide > 40%. [6.5]" },
      { q: "⚠ Espessura pericárdica normal exclui constrição?", a: "Não — é normal em 18% dos casos. [6.5]" },
