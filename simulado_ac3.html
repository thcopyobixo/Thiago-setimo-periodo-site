<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado AC3 · Sétimo Período</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #0f1420;
    --panel-2: #1a2333;
    --border: #1e2a44;
    --border-hover: #2d4166;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-3: #1d4ed8;
    --accent-glow: rgba(59,130,246,.35);
    --text: #f8fafc;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #10b981;
    --ok-glow: rgba(16,185,129,.3);
    --err: #ef4444;
    --err-glow: rgba(239,68,68,.3);
    --warn: #f59e0b;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(29,78,216,.06) 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
  }
  [hidden] { display: none !important; }

  aside.sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    background: linear-gradient(180deg, rgba(15,20,32,.6), rgba(0,0,0,.9));
    border-right: 1px solid var(--border);
    padding: 60px 20px 24px;
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0;
    overflow-y: auto;
    z-index: 50;
    backdrop-filter: blur(10px);
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden aside.sidebar { transform: translateX(-100%); }
  main {
    margin-left: var(--sidebar-w);
    transition: margin-left .35s cubic-bezier(.4,.2,.2,1);
    min-height: 100vh;
    padding: 48px 60px 80px;
  }
  body.sidebar-hidden main { margin-left: 0; }
  body.no-transition aside.sidebar,
  body.no-transition main { transition: none !important; }

  .sidebar-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 100;
    width: 36px; height: 36px;
    padding: 0;
    background: rgba(15,20,32,.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .sidebar-toggle:hover {
    color: var(--accent-2); border-color: var(--accent);
    background: rgba(59,130,246,.15);
  }
  .sidebar-toggle svg { transition: transform .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden .sidebar-toggle svg { transform: rotate(180deg); }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted-2); text-decoration: none;
    font-size: 12px; font-weight: 500; letter-spacing: .5px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid transparent;
    align-self: flex-start;
    transition: all .2s;
  }
  .back-link:hover { color: var(--accent-2); background: var(--panel); border-color: var(--border); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-2px); }

  .brand {
    text-align: center;
    padding: 20px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    margin: 0; font-family: 'Unbounded', sans-serif;
    font-size: 30px; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .brand .sub {
    color: var(--muted); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
    margin-top: 8px; font-weight: 500;
  }

  /* Overview of questions in sidebar */
  .q-list-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .q-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 0 4px 20px;
  }
  .q-cell {
    width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 12px; font-weight: 600;
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all .15s;
  }
  .q-cell:hover { border-color: var(--border-hover); color: var(--text); }
  .q-cell.current { background: linear-gradient(135deg, var(--accent-3), var(--accent)); color:#fff; border-color: transparent; box-shadow: 0 4px 12px var(--accent-glow); }
  .q-cell.correct { background: rgba(16,185,129,.15); color: var(--ok); border-color: var(--ok); }
  .q-cell.wrong { background: rgba(239,68,68,.15); color: var(--err); border-color: var(--err); }
  .q-cell.current.correct { background: var(--ok); color: #fff; box-shadow: 0 4px 12px var(--ok-glow); }
  .q-cell.current.wrong { background: var(--err); color: #fff; box-shadow: 0 4px 12px var(--err-glow); }

  /* Main content */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .crumb {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent-2);
    font-weight: 600;
  }
  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    font-family: inherit;
    transition: all .15s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--border-hover); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .progress-bar {
    height: 4px; background: var(--panel);
    border-radius: 999px; overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
    transition: width .3s ease;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .question-card {
    max-width: 820px;
    margin: 0 auto;
    animation: fadeUp .35s cubic-bezier(.34,1.2,.64,1) both;
  }
  .q-number {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.35);
    border-radius: 999px;
    font-family: 'Unbounded', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .q-enun {
    font-size: 17px;
    line-height: 1.7;
    color: #e2e8f0;
    margin-bottom: 28px;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 24px 28px;
    border-radius: 14px;
  }

  .alts { display: flex; flex-direction: column; gap: 10px; }
  .alt {
    display: flex; gap: 14px; align-items: flex-start;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    text-align: left;
    font-family: inherit;
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    width: 100%;
  }
  .alt:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(59,130,246,.15);
  }
  .alt:disabled { cursor: default; }
  .alt-key {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-2);
    transition: all .2s;
  }
  .alt:hover:not(:disabled) .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt-text { flex: 1; }
  .alt.selected { border-color: var(--accent); background: rgba(59,130,246,.08); }
  .alt.selected .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt.correct-alt {
    border-color: var(--ok);
    background: rgba(16,185,129,.1);
    box-shadow: 0 0 0 1px var(--ok), 0 8px 20px var(--ok-glow);
  }
  .alt.correct-alt .alt-key { background: var(--ok); color: #fff; border-color: transparent; }
  .alt.wrong-alt {
    border-color: var(--err);
    background: rgba(239,68,68,.08);
    box-shadow: 0 0 0 1px var(--err);
  }
  .alt.wrong-alt .alt-key { background: var(--err); color: #fff; border-color: transparent; }
  .alt-badge {
    margin-left: 8px;
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    letter-spacing: 1px; text-transform: uppercase;
    font-family: 'Unbounded', sans-serif;
  }
  .alt.correct-alt .alt-badge {
    background: var(--ok); color: #fff;
  }
  .alt.wrong-alt .alt-badge {
    background: var(--err); color: #fff;
  }

  .confirm-wrap {
    margin-top: 24px;
    display: flex; justify-content: center;
  }
  .btn-confirm {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff;
    border: 1px solid transparent;
    padding: 14px 32px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .3px;
    box-shadow: 0 10px 24px var(--accent-glow);
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    min-width: 260px;
  }
  .btn-confirm:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px var(--accent-glow);
  }
  .btn-confirm:active:not(:disabled) { transform: translateY(0); }
  .btn-confirm:disabled {
    background: var(--panel);
    color: var(--muted);
    border-color: var(--border);
    box-shadow: none;
    cursor: not-allowed;
  }

  .feedback-panel {
    margin-top: 24px;
    animation: slideDown .4s cubic-bezier(.34,1.2,.64,1) both;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .feedback-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-radius: 12px;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .5px;
  }
  .feedback-header.correct {
    background: rgba(16,185,129,.12);
    border: 1px solid var(--ok);
    color: var(--ok);
  }
  .feedback-header.wrong {
    background: rgba(239,68,68,.12);
    border: 1px solid var(--err);
    color: var(--err);
  }

  .gabarito-toggle {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .2s;
  }
  .gabarito-toggle:hover { border-color: var(--accent); color: var(--accent-2); }
  .gabarito-toggle svg { transition: transform .3s; }
  .gabarito-toggle.open svg { transform: rotate(90deg); }

  .gabarito-body {
    margin-top: 14px;
    padding: 20px 24px;
    background: linear-gradient(145deg, rgba(59,130,246,.06), rgba(59,130,246,.02));
    border: 1px solid rgba(59,130,246,.25);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    line-height: 1.7;
    font-size: 14.5px;
    color: #dbeafe;
    animation: slideDown .3s cubic-bezier(.34,1.2,.64,1) both;
  }
  .gabarito-body .gab-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-2);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .gabarito-body .gab-text p { margin: 0 0 10px; }
  .gabarito-body .gab-text ul { margin: 0 0 10px; padding-left: 20px; }
  .gabarito-body .gab-text li { margin: 4px 0; }
  .gabarito-body .gab-text > :last-child { margin-bottom: 0; }
  .gabarito-body .gab-text strong { color: #fff; }
  .gabarito-body .gab-answer {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--ok); margin-bottom: 10px;
  }

  .nav-buttons {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 32px;
    max-width: 820px; margin-left: auto; margin-right: auto;
  }
  .nav-btn {
    flex: 1;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .2s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--border-hover); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .nav-btn.primary:hover:not(:disabled) { transform: translateY(-2px); }

  /* End screen */
  .end-screen {
    max-width: 640px; margin: 0 auto; text-align: center;
    padding-top: 40px;
    animation: fadeUp .5s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 34px; font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -.5px;
  }
  .end-screen .subtitle {
    color: var(--muted-2); font-size: 15px;
    margin-bottom: 40px;
  }
  .donut {
    width: 240px; height: 240px;
    margin: 0 auto 32px; position: relative;
  }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .track { fill: none; stroke: var(--panel); stroke-width: 14; }
  .donut .fill-arc {
    fill: none; stroke-width: 14; stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,.2,.2,1);
  }
  .donut .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut .pct {
    font-family: 'Unbounded', sans-serif;
    font-size: 56px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .donut .pct-label {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; font-weight: 600;
  }
  .badge {
    display: inline-flex; padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Unbounded', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 32px;
  }
  .badge.excelente { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid var(--ok); }
  .badge.otimo { background: rgba(59,130,246,.15); color: var(--accent-2); border: 1px solid var(--accent); }
  .badge.regular { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid var(--warn); }
  .badge.melhorar { background: rgba(239,68,68,.15); color: var(--err); border: 1px solid var(--err); }
  .end-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 32px;
  }
  .end-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
  }
  .end-stat .val {
    font-family: 'Unbounded', sans-serif;
    font-size: 28px; font-weight: 700; line-height: 1;
  }
  .end-stat.correct .val { color: var(--ok); }
  .end-stat.wrong .val { color: var(--err); }
  .end-stat .lbl {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 8px; font-weight: 600;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  @media (max-width: 900px) {
    aside.sidebar {
      width: 100%; height: auto;
      position: relative; top: auto; left: auto;
      padding: 60px 20px 20px;
      transform: none;
    }
    body.sidebar-hidden aside.sidebar { transform: none; display: none; }
    .brand h1 { font-size: 26px; }
    main { padding: 24px 16px 60px; margin-left: 0; }
    body.sidebar-hidden main { margin-left: 0; }
    .q-grid { grid-template-columns: repeat(10, 1fr); }
  }

  /* ==== Abas: Simulado geral / Provas por matéria ==== */
  .mode-switch {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin: 0 0 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(15, 20, 32, .7);
  }
  .mode-switch a {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 9px 6px 8px;
    border-radius: 9px;
    color: var(--muted-2);
    text-decoration: none;
    font-family: 'Unbounded', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .5px;
    text-align: center;
    line-height: 1.2;
    transition: color .25s, background .25s, box-shadow .25s, transform .15s;
  }
  .mode-switch a small {
    font-family: 'Albert Sans', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: .7;
  }
  .mode-switch a:hover { color: var(--text); background: rgba(59, 130, 246, .1); }
  .mode-switch a:active { transform: scale(.97); }
  .mode-switch a.active {
    color: #fff;
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    box-shadow: 0 6px 18px var(--accent-glow);
  }

  /* ==== Lista das provas na barra lateral ==== */
  .tabs-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .tabs { display: flex; flex-direction: column; gap: 3px; margin-bottom: 22px; }
  .tab {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: all .2s cubic-bezier(.4, .2, .2, 1);
  }
  .tab:hover { background: var(--panel); color: var(--text); border-color: var(--border); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .tab-num {
    flex: none;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 11px;
    padding: 2px 7px; border-radius: 6px;
    background: rgba(255, 255, 255, .06);
    color: var(--muted-2);
  }
  .tab.active .tab-num { background: rgba(255, 255, 255, .2); color: #fff; }
  .tab-name { flex: 1; min-width: 0; }
  .prova-kind {
    display: inline-block;
    font-style: normal;
    font-size: 9px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 1px 6px; margin-left: 2px;
    border-radius: 999px;

   "D": "Propiltiouracil"
  },
  "correta": "D",
  "explicacao": "Alternativa D — No 1º trimestre prefere-se o PTU, porque o metimazol se associa a malformações (aplasia cútis). Iodo radioativo é contraindicado na gestação."
 }
];

const SIMS = {
  1: { q: SIM1, key: 'simuladoAC3', nome: 'Simulado 1' },
  2: { q: SIM2, key: 'simuladoAC3_s2', nome: 'Simulado 2' }
};
const SIM_ID = new URLSearchParams(location.search).get('s') === '2' ? 2 : 1;
const QUESTIONS = SIMS[SIM_ID].q;
const STORE_KEY = SIMS[SIM_ID].key;
document.querySelectorAll('.mode-switch a[data-sim]').forEach(a => a.classList.toggle('active', a.dataset.sim === String(SIM_ID)));
document.querySelector('.brand .sub').textContent = 'AC 3 · ' + SIMS[SIM_ID].nome;
document.title = SIMS[SIM_ID].nome + ' AC3 · Sétimo Período';

const TAGS = {"1": {"1": ["IAM com supra de ST", "Fibrinólise"], "2": ["Diarreia crônica", "Sinais de alarme"], "3": ["IAM com supra de ST", "ECG: IAM anterior"], "4": ["Stevens-Johnson / NET", "Diagnóstico"], "5": ["Bradicardias", "Bradicardia instável"], "6": ["DAC crônica", "ANOCA/INOCA"], "7": ["Bronquiectasia", "Etiologia"], "8": ["Doença de Addison", "Diagnóstico"], "9": ["C. difficile", "CDI fulminante"], "10": ["Diarreia aguda", "Toxina pré-formada"], "11": ["Fibrilação atrial", "FA instável"], "12": ["Doença de Addison", "Etiologia"], "13": ["SCA sem supra de ST", "Wellens"], "14": ["IAM com supra de ST", "IAM posterior"], "15": ["Tireoide", "Hipertireoidismo por amiodarona"], "16": ["IAM com supra de ST", "BRE e Sgarbossa"], "17": ["C. difficile", "Tratamento do episódio"], "18": ["Obesidade", "Classificação e fármacos"], "19": ["SCA sem supra de ST", "Estratificação invasiva"], "20": ["Diarreia aguda", "Conduta sem gravidade"], "21": ["Tireoide", "Doença de Graves"], "22": ["Stevens-Johnson / NET", "Complicações"], "23": ["Diarreia aguda", "Disenteria e antibiótico"], "24": ["SCA sem supra de ST", "Troponina e rule-out"], "25": ["Fibrilação atrial", "Dose de ACOD"], "26": ["Fibrilação atrial", "Anticoagulação e HAS-BLED"], "27": ["Ventilação mecânica", "VNI"], "28": ["SCA sem supra de ST", "ECG: infra difuso com supra em aVR"], "29": ["IAM com supra de ST", "Complicações mecânicas"], "30": ["Stevens-Johnson / NET", "Conduta inicial"], "31": ["Bradicardias", "Causas extrínsecas"], "32": ["SCA sem supra de ST", "Prescrição inicial"], "33": ["Diarreia aguda", "Hidratação venosa"], "34": ["Diarreia crônica", "Síndrome do intestino irritável"], "35": ["C. difficile", "Recorrência"], "36": ["IAM com supra de ST", "Angioplastia de resgate"], "37": ["Bronquiectasia", "Diagnóstico"], "38": ["Diarreia crônica", "Colite microscópica"], "39": ["Tireoide", "Hipotireoidismo"], "40": ["Bradicardias", "Intoxicações"], "41": ["DAC crônica", "Prevenção secundária"], "42": ["Obesidade", "Fármacos e risco CV"], "43": ["Doença de Addison", "Crise adrenal"], "44": ["Doença de Addison", "Interpretação do cortisol"], "45": ["Bradicardias", "BAV de 2º grau"], "46": ["Fibrilação atrial", "Cardioversão e anticoagulação"], "47": ["Ventilação mecânica", "Ventilação protetora"], "48": ["DAC crônica", "Indicação de cateterismo"], "49": ["Fibrilação atrial", "Controle de ritmo"], "50": ["DAC crônica", "Investigação"]}, "2": {"1": ["IAM com supra de ST", "Choque cardiogênico"], "2": ["C. difficile", "Diagnóstico"], "3": ["Diarreia crônica", "Síndrome carcinoide"], "4": ["Bronquiectasia", "Pseudomonas"], "5": ["SCA sem supra de ST", "Nitrato"], "6": ["Bronquiectasia", "Exacerbação"], "7": ["SCA sem supra de ST", "Anticoagulação na DRC"], "8": ["IAM com supra de ST", "Bradiarritmias no IAM"], "9": ["Fibrilação atrial", "Controle de frequência"], "10": ["Bradicardias", "BAV total"], "11": ["Diarreia aguda", "Reidratação oral"], "12": ["Doença de Addison", "Diagnóstico"], "13": ["SCA sem supra de ST", "Nefropatia por contraste"], "14": ["Diarreia crônica", "Doença celíaca"], "15": ["C. difficile", "Recorrência"], "16": ["Fibrilação atrial", "CHA₂DS₂-VA"], "17": ["C. difficile", "Precauções"], "18": ["Fibrilação atrial", "FA valvar"], "19": ["Diarreia aguda", "STEC"], "20": ["Fibrilação atrial", "Sangramento com ACOD"], "21": ["Stevens-Johnson / NET", "Diagnóstico diferencial"], "22": ["Diarreia aguda", "Amebíase"], "23": ["Ventilação mecânica", "VNI"], "24": ["Doença de Addison", "Reposição hormonal"], "25": ["IAM com supra de ST", "Fibrinólise no idoso"], "26": ["Diarreia aguda", "Listeria na gestação"], "27": ["DAC crônica", "Tratamento antianginoso"], "28": ["Obesidade", "Fenótipo e fármacos"], "29": ["IAM com supra de ST", "Contraindicações à fibrinólise"], "30": ["DAC crônica", "Revascularização"], "31": ["Bradicardias", "BAV de 2º grau"], "32": ["Tireoide", "Tireoidite subaguda"], "33": ["DAC crônica", "Investigação"], "34": ["Bradicardias", "Coração transplantado"], "35": ["Stevens-Johnson / NET", "Diagnóstico diferencial"], "36": ["Doença de Addison", "Reposição hormonal"], "37": ["SCA sem supra de ST", "Terapia antitrombótica com ACO"], "38": ["SCA sem supra de ST", "Wellens"], "39": ["Ventilação mecânica", "Desmame"], "40": ["IAM com supra de ST", "Complicações mecânicas"], "41": ["Fibrilação atrial", "Pill-in-the-pocket"], "42": ["Stevens-Johnson / NET", "Tratamento"], "43": ["Tireoide", "Adenoma tóxico"], "44": ["Diarreia crônica", "Diarreia por ácidos biliares"], "45": ["Doença de Addison", "Ajuste em doença intercorrente"], "46": ["IAM com supra de ST", "ECG: T hiperagudas"], "47": ["IAM com supra de ST", "Infarto de VD"], "48": ["Obesidade", "Metas de perda de peso"], "49": ["DAC crônica", "Paciente assintomático"], "50": ["Tireoide", "Graves na gestação"]}};
QUESTIONS.forEach(q => { const t = (TAGS[SIM_ID] || {})[q.n]; if (t) { q.tema = t[0]; q.sub = t[1]; } });

const state = {
  index: 0,
  answers: {},   // { n: 'A'|'B'|'C'|'D' }  — respostas confirmadas
  pending: {},   // { n: 'A'|'B'|'C'|'D' }  — selecao antes de confirmar
  showGabarito: {},
  finished: false
};

const $main = document.getElementById('quiz');
const $grid = document.getElementById('qGrid');

/* Persistencia */
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    Object.assign(state, s);
  } catch (e) {}
}
loadState();

function toggleSidebar() {
  const hidden = document.body.classList.toggle('sidebar-hidden');
  try { localStorage.setItem('sidebarHidden', hidden ? '1' : '0'); } catch (e) {}
}
document.addEventListener('keydown', (e) => {
  if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = e.target; const tag = (t && t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
    toggleSidebar();
  }
});

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function renderGrid() {
  $grid.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const cell = document.createElement('button');
    cell.className = 'q-cell';
    cell.textContent = String(q.n).padStart(2,'0');
    if (i === state.index) cell.classList.add('current');
    const a = state.answers[q.n];
    if (a) {
      if (a === q.correta) cell.classList.add('correct');
      else cell.classList.add('wrong');
    }
    cell.onclick = () => { state.index = i; state.finished = false; saveState(); render(); };
    $grid.appendChild(cell);
  });
}

function selectAlt(n, key) {
  if (state.answers[n]) return; // ja confirmada
  state.pending[n] = key;
  saveState();
  render();
}

function confirmAnswer(n) {
  const sel = state.pending[n];
  if (!sel || state.answers[n]) return;
  state.answers[n] = sel;
  delete state.pending[n];
  saveState();
  render();
}

function toggleGab(n) {
  state.showGabarito[n] = !state.showGabarito[n];
  saveState();
  render();
}

function next() {
  if (state.index < QUESTIONS.length - 1) {
    state.index++;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  } else {
    state.finished = true;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}
function prev() {
  if (state.finished) {
    state.finished = false;
    saveState(); render();
    return;
  }
  if (state.index > 0) {
    state.index--;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function resetQuiz() {
  if (!confirm('Reiniciar simulado? Suas respostas serão apagadas.')) return;
  state.index = 0;
  state.answers = {};
  state.showGabarito = {};
  state.finished = false;
  saveState();
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function classify(pct) {
  if (pct >= 90) return { key: 'excelente', label: 'Excelente' };
  if (pct >= 75) return { key: 'otimo', label: 'Ótimo' };
  if (pct >= 60) return { key: 'regular', label: 'Regular' };
  return { key: 'melhorar', label: 'Precisa Melhorar' };
}

function render() {
  renderGrid();
  if (state.finished) { renderEnd(); return; }
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[state.index];
  const answered = !!state.answers[q.n];
  const userAns = state.answers[q.n];
  const pending = state.pending[q.n];
  const correct = userAns === q.correta;
  const progress = ((state.index + 1) / QUESTIONS.length) * 100;
  const gabOpen = !!state.showGabarito[q.n];

  const alts = ['A','B','C','D'].map(k => {
    let cls = 'alt';
    let badge = '';
    if (answered) {
      if (k === q.correta) { cls += ' correct-alt'; badge = '<span class="alt-badge">Correta</span>'; }
      else if (k === userAns) { cls += ' wrong-alt'; badge = '<span class="alt-badge">Sua resposta</span>'; }
    } else if (pending === k) {
      cls += ' selected';
    }
    const disabled = answered ? 'disabled' : '';
    return '<button class="'+cls+'" '+disabled+' onclick="selectAlt('+q.n+', \''+k+'\')">' +
      '<div class="alt-key">'+k+'</div>' +
      '<div class="alt-text">'+esc(q.alternativas[k])+' '+badge+'</div>' +
      '</button>';
  }).join('');

  // Botão de confirmar (só antes de responder)
  let confirmBtn = '';
  if (!answered) {
    const disabled = pending ? '' : 'disabled';
    confirmBtn = '<div class="confirm-wrap">' +
      '<button class="btn-confirm" '+disabled+' onclick="confirmAnswer('+q.n+')">' +
        (pending ? 'Confirmar resposta ('+pending+')' : 'Selecione uma alternativa para responder') +
      '</button>' +
    '</div>';
  }

  let feedback = '';
  if (answered) {
    const iconOk = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="20 6 9 17 4 12"/></svg>';
    const iconErr = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    const headerCls = correct ? 'correct' : 'wrong';
    const headerTxt = correct
      ? 'Você acertou!'
      : 'Você errou — a resposta correta é ' + q.correta;
    const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>';
    feedback = '<div class="feedback-panel">' +
      '<div class="feedback-header '+headerCls+'">' +
        (correct ? iconOk : iconErr) +
        '<span>'+headerTxt+'</span>' +
      '</div>' +
      '<button class="gabarito-toggle '+(gabOpen?'open':'')+'" onclick="toggleGab('+q.n+')">' +
        chevron +
        '<span>'+(gabOpen ? 'Ocultar gabarito comentado' : 'Ver gabarito comentado')+'</span>' +
      '</button>' +
      (gabOpen ? (
        '<div class="gabarito-body">' +
          '<div class="gab-title">Gabarito Comentado</div>' +
          '<div class="gab-answer">Resposta: '+q.correta+'</div>' +
          '<div class="gab-text">'+(q.explicacaoHtml || esc(q.explicacao))+'</div>' +
        '</div>'
      ) : '') +
      '</div>';
  }

  const answeredCount = Object.keys(state.answers).length;

  $main.innerHTML =
    '<div class="toolbar">' +
      '<div class="crumb">Questão '+q.n+' de '+QUESTIONS.length+' · Respondidas: '+answeredCount+'</div>' +
      '<div class="actions">' +
        '<button class="btn" onclick="resetQuiz()">Reiniciar</button>' +
      '</div>' +
    '</div>' +
    '<div class="progress-bar"><div class="fill" style="width:'+progress+'%"></div></div>' +
    '<div class="question-card">' +
      '<div class="q-number">Questão '+String(q.n).padStart(2,'0')+'</div>' +
      '<div class="q-enun">'+esc(q.enunciado)+'</div>' +
      (q.imgs ? '<figure class="q-fig">'+q.imgs.map(s => '<img src="'+s+'" alt="Imagem da questão" onclick="zoomImg(this.src)">').join('')+(q.cap ? '<figcaption>'+esc(q.cap)+' <span>· toque para ampliar</span></figcaption>' : '')+'</figure>' : '') +
      '<div class="alts">'+alts+'</div>' +
      confirmBtn +
      feedback +
    '</div>' +
    '<div class="nav-buttons">' +
      '<button class="nav-btn" onclick="prev()" '+(state.index===0?'disabled':'')+'>← Anterior</button>' +
      '<button class="nav-btn primary" onclick="next()">'+(state.index===QUESTIONS.length-1?'Ver resultado':'Próxima →')+'</button>' +
    '</div>';
}

function zoomImg(src) {
  const o = document.createElement('div'); o.className = 'img-zoom';
  o.innerHTML = '<img src="'+src+'" alt="Imagem ampliada">';
  o.onclick = () => o.remove(); document.body.appendChild(o);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.img-zoom').forEach(o => o.remove()); });

/* Relatório: voltar a uma questão errada */
function relGoTo(i) { state.index = i; state.finished = false; saveState(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function renderEnd() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach(q => {
    const a = state.answers[q.n];
    if (!a) return;
    if (a === q.correta) correct++;
    else wrong++;
  });
  const total = QUESTIONS.length;
  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  const cls = classify(pct);

  const r = 100;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct/100);
  const colorFor = {
    excelente: 'var(--ok)',
    otimo: 'var(--accent)',
    regular: 'var(--warn)',
    melhorar: 'var(--err)'
  }[cls.key];

  $main.innerHTML =
    '<div class="end-screen">' +
      '<h2>Simulado Concluído</h2>' +
      '<div class="subtitle">'+SIMS[SIM_ID].nome+' · '+QUESTIONS.length+' questões · AC 3 · 7º Período</div>' +
      '<div class="donut">' +
        '<svg viewBox="0 0 240 240">' +
          '<circle class="track" cx="120" cy="120" r="'+r+'"></circle>' +
          '<circle class="fill-arc" cx="120" cy="120" r="'+r+'"' +
            ' stroke="'+colorFor+'"' +
            ' stroke-dasharray="'+circ+'"' +
            ' stroke-dashoffset="'+circ+'"' +
            ' id="arc"></circle>' +
        '</svg>' +
        '<div class="center">' +
          '<div class="pct">'+pct+'%</div>' +
          '<div class="pct-label">Acertos</div>' +
        '</div>' +
      '</div>' +
      '<div class="badge '+cls.key+'">'+cls.label+'</div>' +
      '<div class="end-stats">' +
        '<div class="end-stat correct"><div class="val">'+correct+'</div><div class="lbl">Acertos</div></div>' +
        '<div class="end-stat wrong"><div class="val">'+wrong+'</div><div class="lbl">Erros</div></div>' +
        '<div class="end-stat"><div class="val">'+answered+'/'+total+'</div><div class="lbl">Respondidas</div></div>' +
      '</div>' +
      Relatorio.html(QUESTIONS, state.answers) +
      '<div class="nav-buttons">' +
        '<button class="nav-btn" onclick="prev()">← Ver questões</button>' +
        '<button class="nav-btn primary" onclick="resetQuiz()">Recomeçar simulado</button>' +
      '</div>' +
    '</div>';

  requestAnimationFrame(() => {
    const arc = document.getElementById('arc');
    if (arc) arc.style.strokeDashoffset = offset;
  });
}

render();
</script>
<script src="assets/relatorio.js"></script>

</body>
