<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC1 - Flashcards</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --bg-2: #0a0a0f;
    --panel: #0f1420;
    --panel-2: #1a2333;
    --border: #1e2a44;
    --border-hover: #2d4166;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-3: #1d4ed8;
    --accent-glow: rgba(59,130,246,.35);
    --text: #f8fafc;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #10b981;
    --ok-glow: rgba(16,185,129,.3);
    --err: #ef4444;
    --err-glow: rgba(239,68,68,.3);
    --warn: #f59e0b;
    --shadow: 0 20px 50px rgba(0,0,0,.6);
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(29,78,216,.06) 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
    display: flex;
  }

  /* Sidebar */
  aside.sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: linear-gradient(180deg, rgba(15,20,32,.6), rgba(0,0,0,.9));
    border-right: 1px solid var(--border);
    padding: 60px 20px 24px;
    display: flex; flex-direction: column;
    position: sticky; top: 0;
    backdrop-filter: blur(10px);
    transition: margin-left .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden aside.sidebar { margin-left: calc(var(--sidebar-w) * -1); }
  main { transition: max-width .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden main { max-width: 100vw; }
  body.no-transition aside.sidebar,
  body.no-transition main { transition: none !important; }

  .sidebar-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 100;
    width: 36px; height: 36px;
    padding: 0;
    background: rgba(15,20,32,.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .sidebar-toggle:hover {
    color: var(--accent-2);
    border-color: var(--accent);
    background: rgba(59,130,246,.15);
  }
  .sidebar-toggle svg { transition: transform .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden .sidebar-toggle svg { transform: rotate(180deg); }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted-2);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .5px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    margin-bottom: 20px;
    align-self: flex-start;
    transition: all .2s;
  }
  .back-link:hover { color: var(--accent-2); background: var(--panel); border-color: var(--border); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-2px); }

  .brand {
    text-align: center;
    padding-bottom: 24px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 52px;
    letter-spacing: 4px;
    font-weight: 700;
    background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .brand .sub {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 500;
  }

  .tabs {
    display: flex; flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
  }
  .tabs-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px 8px;
    font-weight: 600;
  }
  .tab {
    background: transparent;
    color: var(--muted-2);
    border: 1px solid transparent;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    display: flex; align-items: center; justify-content: space-between;
    font-family: inherit;
    transition: all .2s cubic-bezier(.4,.2,.2,1);
    position: relative;
  }
  .tab:hover { background: var(--panel); color: var(--text); border-color: var(--border); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .tab.active::before {
    content: ''; position: absolute; left: -20px; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 24px;
    background: var(--accent-2);
    border-radius: 0 3px 3px 0;
  }
  .tab .count {
    background: rgba(255,255,255,.1);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .tab.active .count { background: rgba(255,255,255,.2); }

  /* Main */
  main {
    flex: 1;
    padding: 40px 48px;
    max-width: calc(100vw - var(--sidebar-w));
    display: flex; flex-direction: column;
  }
  .empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--muted-2);
    margin: auto;
  }
  .empty h2 { color: var(--text); font-weight: 600; font-size: 22px; margin-bottom: 8px; }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 24px;
  }
  .deck-title {
    font-size: 18px; font-weight: 700; color: var(--text);
    letter-spacing: .3px;
  }
  .deck-progress-num {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--muted-2); font-size: 14px; font-weight: 500;
  }
  .deck-progress-num .curr { color: var(--accent-2); font-weight: 700; font-size: 16px; }

  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: all .15s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--border-hover); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px var(--accent-glow); }

  .progress-bar {
    height: 4px; background: var(--panel);
    border-radius: 999px; overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
    transition: width .3s ease;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .card-container {
    perspective: 1600px;
    margin: 0 auto; width: 100%; max-width: 780px;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .card-anim {
    width: 100%;
    position: relative;
    will-change: transform, opacity;
  }
  .card-anim.enter-right { animation: enterRight .45s cubic-bezier(.34,1.2,.64,1) both; }
  .card-anim.enter-left  { animation: enterLeft  .45s cubic-bezier(.34,1.2,.64,1) both; }
  .card-anim.enter-up    { animation: enterUp    .5s  cubic-bezier(.34,1.2,.64,1) both; }
  .card-anim.exit-left   { animation: exitLeft   .35s cubic-bezier(.4,.15,.6,1) forwards; }
  .card-anim.exit-right  { animation: exitRight  .35s cubic-bezier(.4,.15,.6,1) forwards; }
  .card-anim.exit-up     { animation: exitUp     .4s  cubic-bezier(.4,.15,.6,1) forwards; }
  .card-anim.exit-down   { animation: exitDown   .4s  cubic-bezier(.4,.15,.6,1) forwards; }

  @keyframes enterRight {
    from { transform: translateX(60%) scale(.92); opacity: 0; }
    to   { transform: translateX(0)   scale(1);   opacity: 1; }
  }
  @keyframes enterLeft {
    from { transform: translateX(-60%) scale(.92); opacity: 0; }
    to   { transform: translateX(0)    scale(1);   opacity: 1; }
  }
  @keyframes enterUp {
    from { transform: translateY(30px) scale(.95); opacity: 0; }
    to   { transform: translateY(0)    scale(1);   opacity: 1; }
  }
  @keyframes exitLeft {
    to { transform: translateX(-70%) rotate(-4deg) scale(.9); opacity: 0; }
  }
  @keyframes exitRight {
    to { transform: translateX(70%) rotate(4deg) scale(.9); opacity: 0; }
  }
  @keyframes exitUp {
    to { transform: translateY(-100%) scale(.85); opacity: 0; }
  }
  @keyframes exitDown {
    to { transform: translateY(100%) scale(.85); opacity: 0; }
  }

  /* Flash overlay for correct/wrong */
  .flash-overlay {
    position: absolute; inset: -20px;
    border-radius: 24px;
    pointer-events: none;
    opacity: 0;
  }
  .flash-overlay.ok  { animation: flashOk  .55s ease-out forwards; }
  .flash-overlay.err { animation: flashErr .55s ease-out forwards; }
  @keyframes flashOk {
    0%   { opacity: 0; box-shadow: 0 0 0 0 rgba(16,185,129,0), inset 0 0 0 0 rgba(16,185,129,0); }
    30%  { opacity: 1; box-shadow: 0 0 80px 20px rgba(16,185,129,.6), inset 0 0 60px 0 rgba(16,185,129,.3); }
    100% { opacity: 0; box-shadow: 0 0 120px 40px rgba(16,185,129,0), inset 0 0 100px 0 rgba(16,185,129,0); }
  }
  @keyframes flashErr {
    0%   { opacity: 0; box-shadow: 0 0 0 0 rgba(239,68,68,0), inset 0 0 0 0 rgba(239,68,68,0); }
    30%  { opacity: 1; box-shadow: 0 0 80px 20px rgba(239,68,68,.6), inset 0 0 60px 0 rgba(239,68,68,.3); }
    100% { opacity: 0; box-shadow: 0 0 120px 40px rgba(239,68,68,0), inset 0 0 100px 0 rgba(239,68,68,0); }
  }

  .card {
    position: relative;
    width: 100%; min-height: 380px;
    cursor: pointer;
    will-change: transform, opacity, filter;
    transition: box-shadow .25s;
  }
  .card > .face {
    opacity: 0;
    pointer-events: none;
    transition: none;
  }
  .card > .front { opacity: 1; pointer-events: auto; }
  .card.flipped > .front { opacity: 0; pointer-events: none; }
  .card.flipped > .back  { opacity: 1; pointer-events: auto; }

  .card.blinking { animation: cardBlink .4s cubic-bezier(.55,.05,.45,1); }
  @keyframes cardBlink {
    0%   { opacity: 1; transform: scale(1);    filter: blur(0);   }
    45%  { opacity: 0; transform: scale(.88);  filter: blur(6px); }
    55%  { opacity: 0; transform: scale(.88);  filter: blur(6px); }
    100% { opacity: 1; transform: scale(1);    filter: blur(0);   }
  }

  .card:not(.blinking):hover { transform: translateY(-3px); }
  .card:not(.blinking):not(.flipped):hover .face.front { box-shadow: 0 24px 60px rgba(0,0,0,.7), 0 0 30px rgba(59,130,246,.25); }
  .card:not(.blinking).flipped:hover .face.back { box-shadow: 0 24px 60px rgba(0,0,0,.7), 0 0 40px var(--accent-glow); }
  .card .face {
    position: absolute; inset: 0;
    padding: 40px 44px;
    border-radius: 20px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .card .front {
    background: linear-gradient(145deg, #0f1420 0%, #0a0e18 100%);
  }
  .card .back {
    background: linear-gradient(145deg, #1d4ed8 0%, #1e40af 60%, #172554 100%);
    border-color: var(--accent);
    box-shadow: 0 20px 50px rgba(0,0,0,.6), 0 0 40px var(--accent-glow);
  }
  .card .label {
    position: absolute; top: 20px; left: 24px;
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 3px; color: var(--muted-2);
    font-weight: 700;
  }
  .card .back .label { color: rgba(255,255,255,.7); }
  .card .content {
    font-size: clamp(17px, 2.1vw, 21px);
    line-height: 1.6;
    max-height: 100%; overflow-y: auto;
    padding: 24px 8px;
    font-weight: 400;
  }
  .card .hint {
    position: absolute; bottom: 16px; right: 24px;
    font-size: 10px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .card .back .hint { color: rgba(255,255,255,.5); }

  /* Directional hints below card */
  .keymap {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 780px;
    margin: 24px auto 0;
  }
  .key {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    color: var(--muted-2);
    font-size: 12px;
    font-weight: 500;
  }
  .key:hover { background: var(--panel-2); color: var(--text); border-color: var(--border-hover); transform: translateY(-2px); }
  .key:active { transform: translateY(0) scale(.96); }
  .key.pressed { animation: keyPress .35s ease-out; }
  @keyframes keyPress {
    0%   { transform: scale(1); }
    40%  { transform: scale(.92); box-shadow: 0 0 0 4px currentColor; }
    100% { transform: scale(1); }
  }
  .key .icon {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700; line-height: 1;
    color: var(--text);
    transition: transform .2s;
  }
  .key:hover .icon { transform: scale(1.1); }
  .key.err:hover { border-color: var(--err); color: var(--err); box-shadow: 0 8px 20px var(--err-glow); }
  .key.err:hover .icon { color: var(--err); transform: scale(1.15) translateY(2px); }
  .key.ok:hover { border-color: var(--ok); color: var(--ok); box-shadow: 0 8px 20px var(--ok-glow); }
  .key.ok:hover .icon { color: var(--ok); transform: scale(1.15) translateY(-2px); }
  .key.disabled { opacity: .35; cursor: not-allowed; }
  .key.disabled:hover { transform: none; background: var(--panel); }

  /* End screen */
  .end-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: auto; text-align: center;
    max-width: 560px;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .end-screen h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px; font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -.5px;
    animation: slideDown .6s .1s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen .subtitle {
    color: var(--muted-2); font-size: 15px;
    margin-bottom: 40px;
    animation: slideDown .6s .2s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen .donut { animation: scaleIn .7s .35s cubic-bezier(.34,1.4,.64,1) both; }
  .end-screen .badge { animation: bounceIn .6s .8s cubic-bezier(.34,1.6,.64,1) both; }
  .end-screen .end-stat:nth-child(1) { animation: slideUp .5s 1.0s cubic-bezier(.34,1.2,.64,1) both; }
  .end-screen .end-stat:nth-child(2) { animation: slideUp .5s 1.1s cubic-bezier(.34,1.2,.64,1) both; }
  .end-screen .end-stat:nth-child(3) { animation: slideUp .5s 1.2s cubic-bezier(.34,1.2,.64,1) both; }
  .end-screen .end-actions { animation: slideUp .5s 1.35s cubic-bezier(.34,1.2,.64,1) both; }

  @keyframes slideDown  { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp    { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes scaleIn    { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes bounceIn {
    0%   { opacity: 0; transform: scale(.3); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  .donut .pct { animation: pulseGlow 2.5s ease-in-out infinite; }
  @keyframes pulseGlow {
    0%,100% { filter: drop-shadow(0 0 8px var(--accent-glow)); }
    50%     { filter: drop-shadow(0 0 20px var(--accent-glow)); }
  }
  .donut {
    width: 240px; height: 240px;
    margin-bottom: 32px; position: relative;
  }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .track { fill: none; stroke: var(--panel); stroke-width: 14; }
  .donut .fill-arc {
    fill: none;
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,.2,.2,1);
  }
  .donut .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut .pct {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 56px; font-weight: 700;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .donut .pct-label {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; font-weight: 600;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 32px;
  }
  .badge.excelente { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid var(--ok); }
  .badge.otimo { background: rgba(59,130,246,.15); color: var(--accent-2); border: 1px solid var(--accent); }
  .badge.regular { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid var(--warn); }
  .badge.melhorar { background: rgba(239,68,68,.15); color: var(--err); border: 1px solid var(--err); }

  .end-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 100%; max-width: 480px;
    margin-bottom: 32px;
  }
  .end-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
  }
  .end-stat .val {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; font-weight: 700;
    line-height: 1;
  }
  .end-stat.correct .val { color: var(--ok); }
  .end-stat.wrong .val { color: var(--err); }
  .end-stat .lbl {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 8px; font-weight: 600;
  }
  .end-actions { display: flex; gap: 12px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  /* Responsive */
  @media (max-width: 900px) {
    body { flex-direction: column; }
    aside.sidebar { width: 100%; min-height: auto; position: relative; padding: 60px 20px 20px; }
    body.sidebar-hidden aside.sidebar { margin-left: 0; display: none; }
    .brand h1 { font-size: 40px; }
    .brand { padding-bottom: 16px; margin-bottom: 16px; }
    .tabs { flex-direction: row; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
    .tabs-label { display: none; }
    .tab { flex-shrink: 0; }
    .tab.active::before { display: none; }
    main { padding: 24px 16px; max-width: 100%; }
    .card .face { padding: 24px; }
    .keymap { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<script>
  try { if (localStorage.getItem('sidebarHidden') === '1') { document.body.classList.add('sidebar-hidden','no-transition'); requestAnimationFrame(() => document.body.classList.remove('no-transition')); } } catch (e) {}
</script>

<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Alternar barra lateral" title="Alternar barra lateral (B)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <line x1="9" y1="4" x2="9" y2="20"/>
  </svg>

      { q: "Qual a classificacao da PA na DBHA-2025?", a: "PA normal: <120 e <80. Pre-hipertensao: 120-139 e/ou 80-89. HA estagio 1: 140-159 e/ou 90-99. HA estagio 2: 160-179 e/ou 100-109. HA estagio 3: >=180 e/ou >=110. HA sistolica isolada: >=140 e <90." },
      { q: "Qual a equacao basica que sustenta toda a farmacologia anti-hipertensiva?", a: "PA = Debito Cardiaco x Resistencia Vascular Periferica. Como DC depende de volemia, contratilidade e frequencia, e a RVP depende do tonus e estrutura arteriolar, existem 4 grandes sistemas e uma classe farmacologica para cada um." },
      { q: "O que e a curva de natriurese pressorica e por que ela e fundamental na HA?", a: "E a relacao entre PA e excrecao renal de sodio (mecanismo de Guyton). E o unico mecanismo com ganho infinito para definir o nivel pressorico de equilibrio a longo prazo. Na HA primaria, a curva esta deslocada para a direita - e preciso PA mais alta para excretar a mesma carga de sodio." },
      { q: "Por que nenhum esquema anti-hipertensivo e eficaz sem diuretico em casos graves?", a: "Se a curva de natriurese esta deslocada a direita, vasodilatar sem natriuresar leva a retencao compensatoria de sodio e perda de efeito - o fenomeno da 'pseudotolerancia' a vasodilatadores. O diuretico desloca a propria curva, permitindo que o rim excrete sodio a PA menor." },
      { q: "Quais sao os quatro fenotipos de PA e quais sao clinicamente perigosos?", a: "1) Normotensao verdadeira. 2) HA sustentada. 3) HA do avental branco (HAB): PA elevada no consultorio, normal fora - risco intermediario. 4) HA mascarada (HM): PA normal no consultorio, elevada fora - risco equivalente a HA sustentada, e o mais perigoso por ser invisivel ao metodo padrao." },
      { q: "Quando suspeitar de hipertensao mascarada?", a: "Em pre-hipertensos, tabagistas, etilistas, trabalhadores em turnos, portadores de apneia do sono, diabeticos, portadores de lesao de orgao-alvo inexplicada por PA de consultorio aparentemente controlada. Entre tratados, a HM nao controlada atinge 40-48%." },
      { q: "Quais os limiares de PA para cada metodo de medida?", a: "Consultorio: >=140/90. MAPA vigilia: >=135/85. MAPA sono: >=120/70. MAPA media 24h: >=130/80. MRPA: >=130/80. Os metodos fora do consultorio usam valores mais baixos, refletindo a ausencia da reacao de alerta." },
      { q: "Como e a tecnica correta de medida da PA em consultorio?", a: "Repouso de 5 min, paciente sentado, pernas descruzadas, braço apoiado na altura do coracao, manguito adequado ao braco, bexiga vazia, sem falar. Tres medidas com intervalo de 1 minuto, considerando a media das duas ultimas (a primeira e descartada por reacao de alerta)." },
      { q: "Como funciona a estratificacao de risco na DBHA-2025?", a: "Etapa 1: se ha doenca CV manifesta, DM, DRC, hipercolesterolemia familiar ou LOA, ja e alto risco sem escore. Etapa 2: so para quem nao tem nenhuma dessas, aplica-se o PREVENT; risco >=20% em 10 anos define alto risco. Agravantes (escore de calcio, BNP, Lp(a)) podem reclassificar limítrofes." },
      { q: "Quais sao as classes de base do tratamento anti-hipertensivo (octeto)?", a: "Base: tiazidico/similar + IECA ou BRA + BCC. 4o andar: espironolactona. Acima: BB e alfa-2-agonistas. Topo: alfa-1-bloqueadores e vasodilatadores diretos. A base tem demonstracao de reducao de desfechos duros em ECRs de grande porte." },
      { q: "Por que o betabloqueador nao e mais primeira linha na HA nao complicada?", a: "Metanalises (LIFE, ASCOT-BPLA) mostraram protecao inferior contra AVC. O mecanismo: BB reduzem PA braquial tanto quanto outras classes, mas reduzem menos a PA aortica central - e a pressao central que o cerebro 'enxerga'. E um caso raro em que o desfecho substituto (PA braquial) enganou." },
      { q: "Em quais situacoes o BB permanece de primeira linha?", a: "DAC/pos-IAM, ICFEr, FA com necessidade de controle de frequencia, mulheres planejando engravidar, enxaqueca, tremor essencial e HA associada a hiperatividade simpatica (FC > 80 bpm, apneia do sono)." },
      { q: "Quando a monoterapia ainda e indicada na DBHA-2025?", a: "Em 5 situacoes: PA 130-139/80-89 com alto risco CV; idosos >=80 anos; individuos frageis; HA estagio 1 com risco CV baixo (a criterio medico); hipotensao ortostatica sintomatica." },
      { q: "Qual o mecanismo do edema maleolar por anlodipino e por que diuretico nao resolve?", a: "A vasodilatacao e pre-capilar seletiva: arteríola dilata, venula nao, e a pressao hidrostatica capilar sobe. Nao ha retencao de sodio nem hipervolemia. Diuretico nao resolve e depleta o paciente. IECA/BRA, que dilatam tambem o lado venoso, reduzem o edema." },
      { q: "Quais os farmacos preferenciais na HA com DRC?", a: "IECA ou BRA em dose maxima tolerada se albuminuria (reduzem pressao intraglomerular). iSGLT2 (restaura feedback tubuloglomerular). Finerenona (ARM nao esteroidal, antifibrotico, em DM2+DRC). NUNCA IECA + BRA juntos (ONTARGET: mais hipercalemia e IRA, sem beneficio)." },
      { q: "Qual a conducao da elevacao de creatinina apos inicio de IECA/BRA?", a: "Elevacao ate 30% nas primeiras 2-4 semanas e hemodinamica, esperada e renoprotetora a longo prazo (reducao da pressao intraglomerular por vasodilatacao da arteríola eferente). Investigar (estenose bilateral, hipovolemia, AINE) apenas se >30%, hipercalemia significativa ou deplecao." },
      { q: "Quais as medidas nao medicamentosas quantificadas da DBHA-2025?", a: "Reducao de Na <2g/dia: 2-8 mmHg. Dieta DASH: 8-14 mmHg (maior efeito isolado). Potassio >=3,5g/dia: 4-5 mmHg. Perda peso: ~1 mmHg/kg. Exercicio aerobico >=150 min/sem: 5-8 mmHg. Exercicio isometrico de preensao: 4-8 mmHg. Restricao de alcool: 2-4 mmHg." },
      { q: "Quanto a reducao de 10 mmHg na PAS reduz desfechos?", a: "AVC ~33% (prevencao primaria) e ~27% (secundaria), eventos de DAC ~17%, hospitalizacao por IC ~50% em idosos, evolucao de DRC ~42% e mortalidade total ~17%. O efeito e maior sobre AVC e IC (mais pressao-dependentes) que sobre DAC." },
      { q: "Qual a classificacao da HA na gestacao e o que e pre-eclampsia?", a: "HA cronica: PA >=140/90 antes de 20 semanas. HA gestacional: PA >=140/90 apos 20 semanas sem proteinuria. Pre-eclampsia: PA >=140/90 apos 20 semanas + proteinuria (>=300mg/24h ou RPC >=0,3) ou disfuncao de orgao-alvo (a proteinuria nao e mais obrigatoria)." },
      { q: "Quais farmacos sao permitidos e proibidos na HA da gestacao?", a: "Permitidos: metildopa, nifedipino de liberacao prolongada, hidralazina oral. Proibidos: IECA, BRA e inibidores de renina (fetotoxicidade), ARM (efeito antiandrogênico), atenolol (restricao de crescimento fetal). Diureticos evitados (contraem volume plasmatico)." },
      { q: "Qual o papel do AAS na prevencao de pre-eclampsia?", a: "AAS 100-150 mg/dia a noite, de 12-16 ate 36 semanas, em gestantes de alto risco. Reduz pre-eclampsia em ~60% (ASPRE). Funciona apenas se iniciado antes de 16 semanas porque atua na fase de placentacao. Apos instalacao da disfuncao endotelial, nao funciona - a janela e mecanisticamente determinada." },
      { q: "Qual o papel do sulfato de magnesio na eclampsia?", a: "Previne e trata a convulsao por antagonismo NMDA e vasodilatacao cerebral. NAO e anti-hipertensivo. E um erro classico prescrevê-lo para baixar PA. O tratamento definitivo da eclampsia e o parto, pois a origem e a placenta." },
      { q: "Qual a abordagem da HA no idoso segundo a DBHA-2025?", a: "O status funcional substitui a idade cronologica como variavel de decisao. Idoso de 85 anos robusto (fragilidade 1-3): meta <130/80. Idoso de 72 anos moderadamente fragil (cat 6): individualizar. Medir PA em pe sempre (hipotensao ortostatica). Atentar para pseudo-hipertensao (manobra de Osler)." },
      { q: "O que o ensaio HYVET demonstrou e qual sua limitacao?", a: "HYVET (n=3.845, >=80 anos, indapamida +/- perindopril): reducao de mortalidade total de 21% e IC de 64%. POREM, incluiu apenas idosos hígidos, ambulatoriais, sem demencia. A media de PAS atingida foi ~144, nao <130. NAO prova que meta <130/80 seja segura no idoso fragil." },
      { q: "Qual a fisiopatologia da HA sistolica isolada do idoso?", a: "E expressao de rigidez arterial avancada: fragmentacao de elastina e deposicao de colageno fazem a onda de reflexao retornar na sistole (nao na diastole), elevando a PAS e reduzindo a PAD. NAO e HA leve - tem alto risco. Pressao de pulso alargada (>60 mmHg) e marcador independente de risco." },
      { q: "O que e inercia terapeutica e qual sua frequencia?", a: "E a falha do medico em intensificar o tratamento diante de PA fora da meta. A conduta permanece inalterada em mais de metade das consultas com PA descontrolada. Antidoto: PA fora da meta exige acao registrada - aumentar dose, acrescentar classe, ou documentar por escrito por que nao." },
      { q: "Qual a prevalencia de nao adesao e como avalia-la objetivamente?", a: "Cerca de 50% dos hipertensos abandonam tratamento no 1o ano. Perguntar ao paciente nao funciona (desejabilidade social). Estrategias objetivas: contagem de comprimidos, verificacao de retiradas na farmacia, presenca de efeitos previsiveis (bradicardia com BB, hipocalemia com tiazidico) e dosagem urinaria/serica." },
      { q: "O que sao anticoncepcionais hormonais combinados e qual seu efeito na PA?", a: "AHCO elevam a PA por estimulo estrogenico a sintese hepatica de angiotensinogenio (substrato do SRAA). RR de HA ~1,47. Efeito dose-dependente do estrogênio e reversivel apos suspensao. AHCO sao contraindicados em HA nao controlada. Medir PA antes de prescrever e a cada 6 meses." },
      { q: "Quais as indicacoes de IECA/BRA e qual a principal contraindicacao compartilhada?", a: "Indicacoes: ICFEr, pos-IAM, DRC proteinurica, DM com albuminuria. Contraindicacao compartilhada: gestacao (fetotoxicidade). Outros cuidados: tosse com IECA (~10-20%), angioedema (mais em negros), hipercalemia, nunca associar IECA + BRA." },
      { q: "Qual o papel dos iSGLT2 na HA com DRC/DM?", a: "Os iSGLT2 restauram o feedback tubuloglomerular via macula densa, produzindo vasoconstricao da arteríola aferente e reducao da pressao intraglomerular. Tem ECRs de desfecho CV e renal (EMPEROR-Preserved, DELIVER). Foram integrados na DBHA-2025 para DRC e IC." },
      { q: "Quando a HA na crianca e mais provavelmente secundaria?", a: "Quanto mais jovem a crianca e mais grave a HA, maior a probabilidade de causa secundaria - especialmente doenca parenquimatosa renal, coarctacao de aorta e HA renovascular. Em lactentes e pre-escolares com HA, a investigacao de secundaria e obrigatoria." },
      { q: "O que e a hipotese da curva J e em quem ela e mais relevante?", a: "E a hipotese de que reducao excessiva da PAD pode causar isquemia. E mais robusta para PAD que PAS e mais plausivel em pacientes com DAC obstrutiva, pois a perfusao coronariana e diastolica. Em DAC, evitar PAD <60-70 mmHg. Em todos os demais, reducao ate <130/80 e benefica." },
      { q: "Por que a cessacao do tabagismo tem pouco efeito sobre a PA mas grande efeito no risco CV?", a: "E o exemplo mais didatico de dissociacao entre desfecho substituto e desfecho clinico em sentido favoravel. Parar de fumar reduz pouquissimo a PA mas reduz enormemente o risco CV. Se julgasse a intervencao pelo proxy (PA), a descartaria erroneamente." },
      { q: "Quais os sinais de alarme para investigar HA secundaria?", a: "Inicio abrupto de HA, HA grave em jovem (<30 anos), piora subita em paciente controlado, hipocalemia espontanea (hiperaldosteronismo primario), sopro abdominal ou creatinina >30% apos IECA/BRA (HA renovascular), crises adrenergicas (feocromocitoma), ronco e sonolencia diurna (apneia do sono)." },
      { q: "O que a pre-eclampsia previa significa para o risco cardiovascular futuro da mulher?", a: "Mulheres com pre-eclampsia previa tem risco 2-4x maior de HA cronica, DAC, AVC e DRC ao longo da vida. A gestacao funciona como teste de estresse CV natural, revelando disfuncao endotelial latente. Historia obstetrica deve constar da anamnese CV de toda mulher. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]

  {
    id: "hta-11-12",
    name: "Hipertensão Arterial (Caps 11-12)",
    cards: [
      { q: "Qual a unica pergunta que separa emergencia hipertensiva de tudo o mais?", a: "'Existe lesao de orgao-alvo AGUDA, NOVA, PROGRESSIVA ou EM PIORA?' SIM = emergencia (internacao, farmaco IV titulavel). NAO = nao e emergencia (tratar causa, ajuste oral, reavaliacao em 7 dias). O valor da PA nao entra na pergunta: PA 240 sem LOA nao e emergencia; PA 170 com EAP e." },
      { q: "O que e a pseudocrise hipertensiva e qual a conduta?", a: "Elevacao da PA secundaria a fator desencadeante: dor, ansiedade, panico, retencao urinaria, abstinencia, cefaleia primaria. A conduta e tratar a causa (analgesia, ansiolitico, sondagem vesical, repouso), NAO a PA. Anti-hipertensivo e erro terapeutico. A PA normaliza quando o gatilho e removido." },
      { q: "O que e a curva de autorregulacao cerebral e como ela muda no hipertenso?", a: "O cerebro mantem fluxo constante (~50 mL/100g/min) entre PAM 60-150 mmHg (normotenso). No hipertenso cronico, a hipertrofia arteriolar desloca todo o platô para a direita. Isso significa que uma PA 'normal' pode ser isquemica para o hipertenso cronico levado rapidamente de 220/120 para 130/80." },
      { q: "Quais as tres regras derivadas da curva de autorregulacao para o tratamento da crise?", a: "1) Reduzir no maximo 20-25% da PA na primeira hora. 2) Uma PA 'normal' pode ser isquemica no hipertenso cronico. 3) Nifedipino sublingual de liberacao imediata e proibido (queda abrupta, imprevisivel e nao titulavel - ha relatos de AVC, IAM e obito)." },
      { q: "Qual a meta geral de reducao na emergencia hipertensiva?", a: "Reducao de 20-25% na 1a hora; 160/100-110 mmHg em 2-6 horas; valores proximos do normal em 24-48 horas. Excecoes (reducao mais rapida): disseccao de aorta, edema agudo de pulmao e crises adrenergicas." },
      { q: "Por que muitos pacientes em emergencia hipertensiva estao hipovolemicos?", a: "A natriurese pressorica: a PA elevada forca excrecao de sodio e agua. Administrar diuretico de rotina agrava a deplecao, ativa mais o SRAA e piora a crise. Furosemida so esta indicada se houver congestao pulmonar (EAP) ou hipervolemia documentada." },
      { q: "Quais os farmacos IV disponiveis no Brasil para emergencia hipertensiva?", a: "Nitroprussiato de sodio (0,25-10 mcg/kg/min), nitroglicerina (5-200 mcg/min), metoprolol (5 mg IV a cada 10 min ate 20 mg), esmolol (500 mcg/kg bolus + 25-50 mcg/kg/min), hidralazina (5-10 mg IV a cada 20-30 min) e furosemida (20-60 mg IV apenas se congestao)." },
      { q: "Qual a dose e o mecanismo do nitroprussiato de sodio?", a: "Dose: 0,25-10 mcg/kg/min em infusao continua. Mecanismo: doador de NO, vasodilatador arterial e venoso. Inicio imediato, duracao 1-2 min. Cuidados: intoxicacao por cianeto/tiocianato (risco maior em IRA, hepatopatia, infusao >24-48h), pode aumentar pressao intracraniana." },
      { q: "Qual a conduta na disseccao aguda de aorta e por que a ordem dos farmacos importa?", a: "Meta: PAS 100-120 mmHg e FC <60 bpm em ~20 min. Sequencia OBRIGATORIA: betabloqueador PRIMEIRO (esmolol ou metoprolol), DEPOIS vasodilatador. Vasodilatador isolado causa taquicardia reflexa que aumenta a dP/dt e pode propagar a disseccao. Inverter a ordem e potencialmente fatal." },
      { q: "Qual a conduta pressorica no AVC isquemico sem trombólise?", a: "So tratar se PA > 220/120 mmHg. Reduzir ~15% nas primeiras 24h. A penumbra isquemica perdeu autorregulacao e depende passivamente da pressão de perfusao. Baixar a PA converte penumbra recuperavel em infarto. A hipertensao e uma resposta adaptativa nesse contexto." },
      { q: "Qual a conduta pressorica no AVC isquemico COM trombólise?", a: "PA > 185/110 antes do trombolítico; > 180/105 nas 24h seguintes. Meta: < 185/110 antes e < 180/105 depois. Equilibrio entre manter perfusao da penumbra e reduzir risco de transformacao hemorragica induzida pelo trombolitico." },
      { q: "Qual a conduta na eclampsia/pre-eclampsia grave?", a: "Hidralazina IV ou nifedipino VO + sulfato de magnesio. Meta: PAS 140-150 e PAD 90-100 mmHg. Evitar quedas abruptas (comprometem perfusao placentaria). O MgSO4 previne convulsao por antagonismo NMDA, NAO e anti-hipertensivo. O tratamento definitivo e o parto." },
      { q: "Por que BB isolado e contraindicado nas crises adrenergicas (feocromocitoma, cocaina)?", a: "As catecolaminas estimulam alfa-1 (vasoconstriccao) e beta-2 (vasodilatacao). O BB bloqueia beta-2 e deixa alfa-1 sem oposicao, produzindo vasoconstricao paradoxal e crise mais grave. Sequencia correta: alfa-bloqueio PRIMEIRO (fentolamina ou NPS), BB so depois. Na cocaina, benzodiazepínico e a primeira medida." },
      { q: "Qual a conduta no edema agudo de pulmao hipertensivo?", a: "Nitroglicerina IV (ou NPS) + furosemida IV + VNI. Reducao rapida e agressiva. Aqui a pos-carga elevada e a causa da falencia ventricular; reduzi-la restaura o debito. E uma das poucas emergencias em que diuretico esta indicado - porque ha congestao real." },
      { q: "O que e a encefalopatia hipertensiva e como diferencia-la de AVC?", a: "Hiperperfusao por ultrapassagem do limite superior da autorregulacao, com quebra da barreira hematoencefalica e edema vasogenico. E diagnostico de EXCLUSAO - e e reversível: se o quadro neurologico NAO melhora com a queda da PA, o diagnostico esta errado (provavelmente AVC)." },
      { q: "Qual a definicao de HA resistente (HAR) na DBHA-2025?", a: "PA >=130/80 mmHg com 3 classes de anti-hipertensivos em doses otimizadas, obrigatoriamente incluindo um diuretico (idealmente tiazidico ou similar), apos exclusao de pseudorresistencia. A mudanca de meta de 140/90 para 130/80 aumentou automaticamente a prevalencia de HAR." },
      { q: "Qual a definicao de HA refrataria (HARf)?", a: "PA >=130/80 mmHg com >=5 classes, obrigatoriamente incluindo antagonista do receptor mineralocorticoide (espironolactona) e diuretico de longa duracao. Na pratica, HARf e definida pela falha da espironolactona." },
      { q: "Qual a diferenca mecanistica entre HAR e HARf?", a: "HAR: mecanismo dominante e ativacao do SRAA com hiperaldosteronismo (retencao de sodio/expansao de volume) - responde a espironolactona. HARf: mecanismo dominante e hiperatividade simpatica - espironolactona ja falhou; responde a simpatolíticos, BB e alfa-bloqueadores." },
      { q: "Quais sao as 5 causas de pseudorresistencia?", a: "1) Tecnica de medida inadequada (manguito pequeno, sem repouso). 2) Efeito do avental branco (30-40% da HAR aparente). 3) Baixa adesao (>50% abandonam no 1o ano). 4) Esquema inadequado (doses submaximas, HCTZ em vez de clortalidona). 5) Substancias interferentes (AINEs, ACO, descongestionantes, alcool)." },
      { q: "Por que e impossivel diagnosticar HAR sem MAPA ou MRPA?", a: "O efeito do avental branco responde por 30-40% da HAR aparente. Nenhuma caracteristica clinica identifica confiavelmente quem o tem. Sem medida fora do consultorio, nao e possivel distinguir HAR verdadeira de pseudo-resistencia por efeito do avental branco." },
      { q: "Por que trocar HCTZ por clortalidona e a intervencao de melhor custo-beneficio na HAR?", a: "A HCTZ tem meia-vida curta (6-15h), nao cobre 24h e e menos potente. A clortalidona tem meia-vida de 40-60h e efeito anti-hipertensivo superior. O ensaio CLICK demonstrou que a clortalidona e eficaz mesmo na DRC estagio 4 (TFG 15-30), desmontando o dogma de que tiazidicos nao funcionam com TFG baixa." },
      { q: "Quais os cuidados com espironolactona na HAR?", a: "Dosar K+ e creatinina antes, em 7-14 dias e depois mensalmente por 3 meses. Nao iniciar se K+ >5,0 ou TFGe <30. Iniciar com 12,5-25 mg/dia. Orientar sobre substitutos de sal ricos em KCl. Ginecomastia em ~10% dos homens (efeito antiandrogênico); alternativas: eplerenona ou amilorida." },
      { q: "Quais os farmacos de 5a e 6a linha na HARf?", a: "BB vasodilatadores (carvedilol, nebivolol); simpatolíticos de acao central (clonidina 0,1-0,3 mg 2-3x/dia - atencao a hipertensao rebote na suspensao abrupta); alfa-1-bloqueador (doxazosina 1-16 mg/dia, iniciar a noite); vasodilatadores diretos (hidralazina 25-100 mg 2-3x/dia, sempre com BB e diuretico)." },
      { q: "Qual a causa secundaria mais prevalente na HAR e como rastrear?", a: "Apneia obstrutiva do sono: 60-80% dos HAR. Pistas: ronco, apneias presenciadas, sonolencia diurna, obesidade, pescoco largo, padrao non-dipper/riser na MAPA. Rastreio: questionarios (STOP-Bang, Berlim) + polissonografia." },
      { q: "Qual a prevalencia do hiperaldosteronismo primario (HAP) na HAR?", a: "~20% dos HAR - muito mais frequente do que se supunha. A maioria e normocalemica. Esperar hipocalemia para rastrear e usar achado de alta especificidade e baixissima sensibilidade como triagem. Rastreio: relacao aldosterona/renina (RAR), colhida pela manha, sentado, com K+ corrigido." },
      { q: "O que a trajetoria dos ensaios de denervacao simpatica renal (DSR) ensina?", a: "SYMPLICITY HTN-1/2 (abertos): reducoes espetaculares de 25-30 mmHg. SYMPLICITY HTN-3 (com controle sham): NEGATIVO - resultados anteriores eram efeito placebo + regressao a media + melhora de adesao. Ensaios de 2a geracao (RADIANCE, SPYRAL): positivos mas modestos (4-8 mmHg), sem desfecho duro." },
      { q: "Qual a conduta apos a alta de uma emergencia hipertensiva?", a: "Esquema oral de 3 classes com diuretico; educacao estruturada; consulta agendada antes da alta. Reavaliacao obrigatoria em 7 dias (PA, adesao, funcao renal, eletrolitos). Ma adesao e a principal causa de EH; alta sem consulta marcada e o preditor mais forte de reinternacao." },
      { q: "Como fazer a transicao de farmaco IV para oral na emergencia hipertensiva?", a: "Iniciar o esquema oral AINDA durante a infusao, com sobreposicao. Suspender o IV apenas apos a via oral estar em efeito. Interromper o IV sem cobertura oral produz efeito rebote, sobretudo com nitroprussiato e clonidina." },
      { q: "O que e a hipertensao maligna?", a: "Definida por necrose fibrinoide arteriolar com retinopatia grau III-IV de Keith-Wagener-Barker (hemorragias, exsudatos, papiledema) +/- injuria renal e anemia hemolitica microangiopatica. E o desfecho histologico da alca de retroalimentacao da emergencia hipertensiva." },
      { q: "Por que o nifedipino sublingual e proibido na crise hipertensiva?", a: "Produz queda abrupta, de magnitude imprevisivel e nao titulavel - exatamente o oposto do que a fisiologia exige. Ha relatos de AVC, IAM e obito. A alternativa nao e outro farmaco sublingual: e farmaco IV titulavel na emergencia ou via oral com tempo na urgencia." },
      { q: "O que o padrao non-dipper/riser na MAPA indica na HAR?", a: "PA noturna que nao cai >=10% (non-dipper) ou sobe (riser) e marcador independente de risco e pista de apneia obstrutiva do sono. Na HAR, a ausencia de descenso noturno sugere que o mecanismo nocivo persiste durante o sono, apontando para apneia, DRC ou disautonomia." },
      { q: "Quais sao as indicacoes do esmolol e por que ele e preferido na disseccao?", a: "Esmolol: BB beta-1-seletivo de acao ultrarrapida (meia-vida ~9 min). Dose: 500 mcg/kg bolus + 25-50 mcg/kg/min (max 300). Preferido na disseccao por ser desligavel rapidamente se houver hipotensao excessiva. Tambem indicado na HA perioperatoria grave." },
      { q: "Qual a meta pressorica no AVC hemorragico?", a: "PAS 130-140 mmHg (reducao suave e sustentada). Objetivo: reduzir expansao do hematoma nas primeiras horas. INTERACT-2 e ATACH-2 mostraram seguranca e beneficio funcional modesto; ATACH-2 sugeriu que reducao muito agressiva associa-se a mais eventos renais adversos." },
      { q: "Qual a conduta no feocromocitoma/paraganglioma e quais as pistas clinicas?", a: "Pistas: triade classica (cefaleia + sudorese + palpitacoes em paroxismos), PA muito labil, hipotensao ortostatica paradoxal. Rastreio: metanefrinas fracionadas plasmaticas ou urinarias de 24h. Tratamento: alfa-bloqueio PRIMEIRO, BB somente apos alfa-bloqueio adequado." },
      { q: "Quais as indicacoes especificas da nitroglicerina IV?", a: "Sindrome coronariana aguda e edema agudo de pulmao. Dose: 5-200 mcg/min. Predominio venoso em doses baixas (reduz pre-carga e melhora perfusao subendocardica). Contraindicada com inibidores de PDE-5 e em IAM de VD. Taquifilaxia em 24-48h." },
      { q: "Qual o circulo vicioso da emergencia hipertensiva?", a: "Elevacao da PA -> estresse de cisalhamento endotelial -> necrose fibrinoide arteriolar -> isquemia tecidual e ativacao plaquetaria -> ativacao do SRAA (isquemia renal) -> mais elevacao da PA. Simultaneamente, a natriurese pressorica causa hipovolemia, ativando mais o SRAA. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
