      { q: "Qual a conduta para biópsia de úlceras gástricas e duodenais na EDA?", a: "Úlceras duodenais: biópsia de rotina NÃO recomendada (risco de malignidade muito baixo). Úlceras gástricas: biopsiar na EDA inicial (mínimo 4 biópsias, 4 quadrantes), pois 0,8-4,3% das úlceras aparentemente benignas abrigam malignidade." },
      { q: "Por que um teste negativo para H. pylori durante sangramento ativo NÃO é confiável?", a: "O sangramento GI ativo reduz a sensibilidade de biópsia, teste respiratório e antígeno fecal para H. pylori (sangue modifica o microambiente gástrico e dilui a presença bacteriana). Neste cenário, resultado negativo não exclui infecção — sorologia pode ser alternativa." },
      { q: "Compare as taxas de cicatrização endoscópica entre IBP e ARH2 na DUP.", a: "Metanálise de 106 RCTs (n=17.331): IBP 90% vs ARH2 80% (OR 2,52). Para úlceras duodenais: 92% vs 82%. Para úlceras gástricas: 86% vs 74%. A combinação IBP + ARH2 NÃO melhora cicatrização." },
      { q: "Compare IBP vs PCAB (vonoprazana) no tratamento da DUP.", a: "RCTs de comparação direta mostram eficácia semelhante: cicatrização UD vonoprazana ~95,5% vs lansoprazol ~98,3%; UG ~93,5% vs ~93,8%. Porém vonoprazana tem maior risco de EA graves em metanálise em rede, custo elevado e aprovação limitada (Japão para DUP; EUA apenas para erradicação de H. pylori)." },
      { q: "Quais as doses de IBP para DUP não complicada, complicada e erradicação de H. pylori?", a: "Não complicada: omeprazol 20mg 1x/dia (4-8 sem). Erradicação de H. pylori: omeprazol 20mg 2x/dia (14 dias). Complicada: omeprazol 40mg 2x/dia inicialmente → 1x/dia após 4 semanas. Manutenção: 20mg 1x/dia." },
      { q: "Quais são os esquemas de primeira linha para erradicação do H. pylori?", a: "Terapia tripla com claritromicina (IBP dose alta 2x/dia + amoxicilina 1g 2x/dia + claritromicina 500mg 2x/dia, 14 dias) — se resistência local a claritromicina <15%. Terapia concomitante sem bismuto (adicionar metronidazol 500mg 2x/dia à tripla). Terapia quádrupla com bismuto (IBP + bismuto 120-300mg 4x/dia + metronidazol 250-500mg 4x/dia + tetraciclina 500mg 4x/dia, 14 dias)." },
      { q: "Por que o IBP deve ser em dose alta 2x/dia nos esquemas de erradicação do H. pylori?", a: "O H. pylori é sensível a antibióticos apenas em fase de replicação ativa, que ocorre em pH gástrico >6. Abaixo desse pH, a bactéria entra em quiescência e torna-se fenotipicamente resistente. IBP dose alta eleva o pH acima de 6 por tempo suficiente para os antibióticos agirem." },
      { q: "Quando o esquema de erradicação com terapia tripla com claritromicina NÃO deve ser utilizado?", a: "Quando a resistência local à claritromicina é >15% (taxa de erradicação cai para <70%), ou quando o paciente tem uso prévio de macrolídeos (seleciona resistência). Nestes casos, preferir terapia concomitante ou quádrupla com bismuto." },
      { q: "Quais os esquemas de resgate (2ª linha) para erradicação de H. pylori?", a: "Terapia tripla com levofloxacino (IBP + amoxicilina 1g 2x/dia + levofloxacino 500mg 1x/dia, 14 dias). Quádrupla com bismuto (se não usada na 1ª linha). Dupla com vonoprazana (vonoprazana 20mg 2x/dia + amoxicilina 1g 3x/dia, 14 dias)." },
      { q: "Como deve ser feita a confirmação de erradicação do H. pylori?", a: "Obrigatória em TODO paciente com DUP. Realizar ≥4 semanas após o fim dos antibióticos E ≥2 semanas após suspensão do IBP (evitar falso-negativo). Métodos: teste respiratório da ureia ou antígeno fecal. Sorologia NÃO serve (anticorpos permanecem positivos por meses-anos)." },
      { q: "Qual a importância da erradicação do H. pylori na prevenção de recorrência da DUP?", a: "Metanálise de 24 RCTs (n=2.102): remissão em 12 meses de 97% (UG) e 98% (UD) com erradicação bem-sucedida vs 61% (UG) e 65% (UD) com infecção persistente. NNT ≈ 3 — a intervenção mais custo-efetiva na DUP." },
      { q: "Na úlcera duodenal não complicada H. pylori-positiva, é necessário IBP adicional após o regime de erradicação?", a: "NÃO na maioria dos pacientes. O regime de erradicação de 14 dias (que já inclui IBP dose alta) é suficiente para cicatrizar a maioria das úlceras H. pylori-positivas. IBP adicional só é necessário se sintomas persistirem." },
      { q: "Qual a particularidade da resistência ao metronidazol no tratamento do H. pylori?", a: "Resistência é comum (20-40% em muitas regiões), mas PARCIALMENTE superável com doses mais altas e maior duração. O bismuto também ajuda a superar resistência ao metronidazol no esquema quádruplo." },
      { q: "Por que o bismuto é considerado vantajoso nos esquemas de erradicação?", a: "Tem mecanismo multifatorial: efeito bactericida direto (disrupta parede celular e enzimas do H. pylori), citoproteção da mucosa (↑ muco, ↑ PGE2) e, crucialmente, NÃO desenvolve resistência. EA benigno: escurecimento de língua e fezes (não confundir com melena)." },
      { q: "Qual a resistência global da amoxicilina ao H. pylori e por que ela é pilar dos regimes?", a: "Resistência primária <2% globalmente, a mais baixa entre os antibióticos usados. Age como bactericida inibindo a síntese de parede celular (PBP). Requer pH >5,5 para atividade ótima, justificando o IBP em dose alta." },
      { q: "Qual a duração do tratamento com IBP conforme etiologia e tipo de úlcera?", a: "H. pylori (+) não complicada: 14 dias (regime de erradicação, sem IBP adicional). AINEs não complicada: 4-8 semanas de IBP 1x/dia. Idiopática: UD 4 sem, UG 8 sem. Complicada: UD 4-8 sem, UG 8-12 sem (IBP dose alta 2x/dia inicialmente)." },
      { q: "Quando está indicada a endoscopia de controle na DUP?", a: "Úlceras duodenais: NÃO rotineiramente (baixo risco de malignidade). Úlceras gástricas: em 8-12 semanas se sintomas persistentes, etiologia incerta, úlcera gigante (>2cm), biópsias inadequadas, aspecto suspeito, úlcera hemorrágica ou fatores de risco para câncer gástrico." },
      { q: "O que define uma úlcera refratária e quais são os diagnósticos diferenciais?", a: "Úlcera comprovada endoscopicamente >5mm que não cicatriza após 8-12 semanas de IBP (~5-10% dos casos). Diferenciais: falso-negativo de H. pylori, uso oculto de AINEs, gastrinoma (Zollinger-Ellison), malignidade gástrica, doença de Crohn, isquemia, infecções virais (CMV, HSV)." },
      { q: "Quais as indicações de IBP de manutenção a longo prazo na DUP?", a: "Úlcera gigante (>2cm) com idade >50 ou comorbidades; DUP idiopática recidivante (H. pylori-neg/AINE-neg); falha na erradicação após múltiplos ciclos; >2 recorrências/ano; uso contínuo de AINEs com fatores de risco (>65 anos, úlcera prévia, AINEs dose alta, ISRSs/aspirina/corticoides concomitantes)." },
      { q: "Quais fatores emergentes estão associados a DUP/sangramento GI?", a: "COVID-19: DUP é a causa mais comum de sangramento GI associado (mortalidade geral 19,1%). Inibidores de checkpoint imunológico: causam gastrite grave e úlceras que podem NÃO responder a IBP, necessitando corticosteroides. Apneia do sono: 2x risco de sangramento GI." },
      { q: "Qual a relação entre glicocorticoides e úlcera péptica?", a: "Ambulatoriais: NÃO foram fator de risco independente para úlcera em doses ≤35mg/dia por 2 meses. Hospitalizados: aumentaram risco de sangramento/perfuração GI (2,9% vs 2%; OR 1,43). GCs potencializam o risco quando combinados com AINEs. A diferença reflete confusão por indicação e gravidade." },
      { q: "Qual o mecanismo, posologia e limitações do misoprostol na DUP?", a: "Análogo de PGE1 — ↑ muco, bicarbonato e fluxo sanguíneo mucoso. Posologia: 200 mcg VO 4x/dia (prevenção). Limitações: diarreia dose-dependente, dor abdominal, CONTRAINDICADO na gravidez (abortifaciente). Inferior a IBP na prevenção de úlceras por AINEs." },
      { q: "Por que os AINEs causam úlceras mesmo quando administrados por via parenteral ou retal?", a: "Porque o principal mecanismo é sistêmico (inibição de COX-1 → ↓ prostaglandinas protetoras em toda a mucosa), não apenas o efeito tópico local. AINEs parenterais ou retais causam úlceras gástricas tanto quanto os orais." },
      { q: "Qual a relação sinérgica entre H. pylori e AINEs na DUP?", a: "São fatores de risco independentes e sinérgicos. H. pylori potencializa o dano mucoso dos AINEs e vice-versa. Implicação terapêutica direta: em pacientes com DUP por AINEs, testar e erradicar H. pylori TAMBÉM é necessário." },
      { q: "Por que a normalização de somatostatina e gastrina após erradicação do H. pylori explica o sucesso da prevenção de recorrência?", a: "A erradicação restaura o eixo regulatório da secreção ácida: somatostatina volta ao normal → gastrina normaliza → secreção ácida reduz. Isso ocorre dentro de ~1 ano após a erradicação, eliminando o ambiente hiperacídico que promovia a úlcera." },
      { q: "Qual a segurança dos IBPs na gravidez?", a: "IBP pode ser iniciado na gestante com DUP. Estudo de coorte com ~2,7 milhões de gestações NÃO encontrou aumento significativo de malformações congênitas com uso de IBP no primeiro trimestre. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "eeo",
    name: "Esofagite Eosinofílica",
    cards: [
      { q: "Por que a EoE é considerada uma doença de barreira epitelial e não apenas de infiltrado eosinofílico?", a: "A ACG enquadra a EoE como iniciada quando alérgenos penetram uma barreira esofágica com defeitos intrínsecos ou adquiridos. O eosinófilo é 'um dos vários' efetores patogênicos. Agentes que depletam eosinófilos quase completamente (benralizumabe, lirentelimabe) melhoram histologia mas NÃO sintomas, sugerindo que mastócitos, células T, basófilos e fibroblastos sustentam a doença." },
      { q: "Quais são os três mecanismos anti-inflamatórios dos IBPs na EoE além da supressão ácida?", a: "(1) Redução da expressão de eotaxina-3 (via IL-4/STAT6); (2) Melhora da função de barreira epitelial esofágica; (3) Manutenção da homeostase transcricional do epitélio esofágico. A eficácia é independente da presença de exposição ácida patológica na pHmetria." },
      { q: "Quais fatores estão associados a NÃO resposta ao IBP na EoE?", a: "Rinite alérgica concomitante, metabolização rápida por CYP2C19 (contornável com escalonamento de dose) e polimorfismos do gene STAT6." },
      { q: "Quais fatores estão associados a NÃO resposta a corticoide tópico na EoE?", a: "Polimorfismo do gene TGF-β e fenótipo de 'esôfago extremamente estreito' (calibre muito reduzido). Pacientes com esse fenótipo têm cerca de 1/3 das chances de responder ao esteroide. Faz sentido: esôfago já extensamente remodelado por fibrose tem menos tecido inflamatório ativo para o corticoide tratar." },
      { q: "Quais são os três critérios diagnósticos da EoE segundo a ACG 2025?", a: "(1) Sintomas de disfunção esofágica; (2) ≥15 eos/hpf em biópsia esofágica; (3) Avaliação para descartar causas não-EoE de eosinofilia esofágica. Importante: NÃO é mais necessário demonstrar falha terapêutica de IBP." },
      { q: "Por que o conceito de PPI-REE (eosinofilia esofágica IBP-responsiva) foi abolido?", a: "Estudos mostraram que, antes do tratamento, pacientes que respondem a IBP são clínica, endoscópica, histológica, imunológica e molecularmente SEMELHANTES a pacientes com EoE que não respondem a IBP. A resposta ao IBP identifica uma resposta terapêutica, não uma doença diferente. O IBP foi reclassificado como tratamento, não critério diagnóstico." },
      { q: "O que significa o acrônimo IMPACT na avaliação da EoE?", a: "I = Imbibe fluids (beber muito líquido para 'empurrar' comida); M = Modify foods (cortar em pedaços pequenos/amassar); P = Prolong meal times; A = Avoid hard textures; C = Chew excessively; T = Turn away tablets/pills (disfagia a comprimidos — às vezes a única pista, reflete estreitamento funcional do lúmen)." },
      { q: "Qual o protocolo de biópsias recomendado pela ACG para EoE?", a: "Mínimo de 6 biópsias, de ≥2 sítios (proximal/médio e distal), com alvo preferencial nos achados endoscópicos de EoE (sulcos/exsudatos). Sensibilidade com ≥6 biópsias aproxima-se de 100%. Na impactação alimentar, biópsia deve ser feita na endoscopia de urgência (após retirar o bolo)." },
      { q: "Por que a contagem de eosinófilos deve ser quantificada e não apenas reportada como ≥15 eos/hpf?", a: "Um paciente que vai de 200 para 150 eos/hpf e outro que vai de 200 para 20 eos/hpf estariam ambos '>15', mas têm respostas anti-inflamatórias completamente diferentes. O limiar binário compromete o acompanhamento longitudinal — é preciso reportar o número real em cada endoscopia." },
      { q: "Qual a escala EREFS e seus componentes na EoE?", a: "Escala 0-9 com 5 componentes: Edema 0-1, Rings (anéis) 0-3, Exsudato 0-2, Furrows (sulcos) 0-2, Stricture (estenose) 0-1. Permite comparar evolução ao longo do tempo. O sinal do 'tug/pull' (resistência à tração na biópsia) é achado tátil sugestivo de fibrose subjacente." },
      { q: "Qual a dose de IBP recomendada na EoE e quais as taxas de remissão por esquema posológico?", a: "Dose 'alta' = dobro da dose de refluxo (ex.: omeprazol 20mg 2x/dia ou 40mg 1x/dia). Coorte retrospectiva (305 pacientes): remissão histológica com dose 2x/dia de 53-54% vs 1x/dia de apenas 10-12%. Estratégia de indução: dose dobrada, dividida." },
      { q: "Compare budesonida suspensão oral (BOS) vs budesonida comprimido orodispersível (BOT) na EoE.", a: "BOS 2mg 2x/dia (FDA 2024): eficácia histológica 62%, candidíase 3,8%. BOT 1mg 2x/dia (EMA 2018): eficácia histológica 95%, candidíase 23,7%. Diferença de candidíase expressiva entre formulações. Não há superioridade demonstrada entre budesonida e fluticasona (71% vs 64% em RCT direto)." },
      { q: "Qual o risco de insuficiência adrenal com corticoides tópicos deglutidos na EoE?", a: "Incomum em ensaios de indução (≤5%), mas revisão sistemática incluindo estudos observacionais de longa exposição encontrou taxa geral de 15,8%. Recomenda-se monitorização de função adrenal em uso contínuo de longo prazo, especialmente se uso concomitante de múltiplas formulações de corticoide (nasal + esofágico)." },
      { q: "Quais são as taxas de eficácia das dietas de eliminação na EoE segundo a ACG?", a: "1FED (só leite): 35-45%. 2FED (leite + trigo): 40-45%. 4FED (leite, trigo, ovo, soja): 40-50%. 6FED (+ castanhas/amendoim, frutos do mar): 40-70%. Dieta elementar: >90% (se aderente). Dieta guiada por teste alérgico: NÃO recomendada." },
      { q: "Qual a abordagem step-up de dieta recomendada pela ACG e por que é preferida?", a: "Começar com 1FED ou 2FED (menos restritivo) e escalar para 4FED/6FED se não houver resposta. RCTs mostraram resposta histológica semelhante (1FED vs 6FED: 34% vs 40%, p=0,58). A lógica 'começar simples, escalar se necessário' reduz o número de endoscopias necessárias (~20% mais eficiente) sem perda relevante de eficácia." },
      { q: "Por que testes alérgicos baseados em IgE NÃO são recomendados na EoE, mas IgG4 é promissor?", a: "A EoE é uma doença Th2/não-IgE-mediada. Testes baseados em IgE (prick test, IgE sérica) testam o mecanismo errado. Já IgG4 específica para alimento parece ter alguma correlação com gatilhos reais — acurácia de 53-75% em subestudo. Há RCT em andamento testando painel de 18 alimentos por IgG4." },
      { q: "Qual o posicionamento do dupilumabe na EoE segundo a ACG 2025?", a: "Recomendação condicional (qualidade moderada) para ≥12 anos não respondedores a IBP: 300mg SC semanal (≥40kg). Estudo pivotal (321 pacientes): 60% remissão histológica (≤6 eos/hpf) vs 5% placebo. A força é condicional pelo custo e porque a população estudada era grave/refratária (~5 anos de doença, 40% com dilatação prévia)." },
      { q: "Qual o posicionamento do dupilumabe para crianças de 1-11 anos na EoE?", a: "Recomendação condicional (qualidade baixa). Dose: 100-300mg SC quinzenal, por peso. Estudo com 102 crianças: remissão histológica 68% (dose maior) e 58% (dose menor) vs 3% placebo. Qualidade baixa por ser estudo único, sem melhora significativa em desfechos reportados pelo paciente/cuidador." },
      { q: "O que os resultados do omalizumabe ensinam sobre a fisiopatologia da EoE?", a: "RCT placebo-controlado não mostrou diferença em nenhum desfecho, apesar de reduzir IgE. Isso CONFIRMA empiricamente que a EoE NÃO é mediada por IgE — mesmo racional pelo qual testes alérgicos IgE-based falham. A 'falha terapêutica' é na verdade uma confirmação mecanística útil." },
      { q: "O que o paradoxo dos agentes depletores de eosinófilos ensina sobre desfechos substitutos?", a: "Benralizumabe e lirentelimabe causam depleção quase completa de eosinófilos (excelente resposta histológica) mas NÃO melhoram sintomas proporcionalmente. Isso demonstra que desfecho substituto (biomarcador) que responde ao tratamento NÃO garante benefício clínico — o eosinófilo pode não ser o motor principal em todos os pacientes." },
      { q: "Por que montelucaste e cromolina são recomendados CONTRA uso na EoE?", a: "Montelucaste: único RCT cego não mostrou diferença em resposta sintomática. Cromolina: pequeno RCT (n=16) sem redução de eosinofilia ou sintomas. Ambos com recomendação condicional contra — evidência escassa mas suficiente para desaconselhar uso fora de pesquisa." },
      { q: "Qual a meta de diâmetro na dilatação endoscópica da EoE e qual a abordagem recomendada?", a: "Meta: ≥16mm. Abordagem 'start low, go slow': iniciar com dilatador menor, reavaliar, progredir gradualmente. Endpoint: aparecimento de efeito de dilatação (disrupção mucosa) OU atingir diâmetro-alvo. Segurança: melhora clínica em 95%, hospitalização <1%, perfuração <0,5%." },
      { q: "Por que a endoscopia convencional é pouco sensível para detectar estenose na EoE?", a: "Estudo com esofagograma: sensibilidade da endoscopia para esôfago estreitado de apenas 14,7% (mesmo ≤15mm, sensibilidade de só 25%). 71% dos pacientes sem estreitamento aparente à endoscopia tiveram resposta à dilatação — havia estenose funcional não detectada visualmente." },
      { q: "O que é o EndoFLIP e qual sua utilidade na EoE?", a: "EndoFLIP (impedance planimetry) mede a complacência da parede esofágica sob pressão controlada. Detecta redução de distensibilidade (rigidez/fibrose subclínica) não visível macroscopicamente. A 'estenose' na EoE é em parte funcional/mecânica e pode preceder a mudança estrutural visível." },
      { q: "Quando considerar dilatação empírica na EoE, mesmo com esôfago endoscopicamente normal?", a: "Quando o paciente mantém disfagia apesar de remissão histológica confirmada. Reconhece a insensibilidade endoscópica para estenoses funcionais. Sempre associar terapia anti-inflamatória — dilatação não trata a doença de base." },
      { q: "O que os ensaios de retirada randomizada (randomized withdrawal trials) demonstraram sobre manutenção na EoE?", a: "BOT (comprimido orodispersível): 75%/73,5% mantêm remissão vs 4,4% placebo em 48 semanas. Tempo até recidiva: >350 dias com tratamento vs 87 dias placebo. Budesonida nebulizada: 35,7% vs 0% em 50 semanas. Esses estudos provam que, ao parar o tratamento, a doença recidiva." },
      { q: "O que é 'remissão profunda' na EoE e qual sua frequência?", a: "Conceito emprestado da DII: resposta completa e simultânea em sintomas + endoscopia + histologia. Em coorte suíça de 351 pacientes, apenas 9,4% atingiram remissão profunda, e mesmo esses recaíram em mediana de 22 semanas após suspensão. A meta realista é controle sustentado, não 'cura'." },
      { q: "Por que a EoE nunca 'sai de moda' terapeuticamente, ao contrário de outras doenças atópicas?", a: "Ao contrário de alergia alimentar, asma ou eczema da infância, pacientes com EoE NÃO 'crescem e saem' da doença. A EoE parece ser um passo final e irreversível da 'marcha atópica', justificando manutenção indefinida." },
      { q: "Qual o timing de reavaliação endoscópica após início do tratamento da EoE?", a: "IBP, corticoide tópico e dieta de eliminação: 8-12 semanas. Dupilumabe: 12-24 semanas." },
      { q: "O que é o 'gap in care' na EoE e qual seu impacto?", a: "Pacientes com intervalo de 2 anos ou mais sem consulta/endoscopia têm risco aumentado de progressão para fibroestenose, e o risco cresce com intervalos maiores. A interrupção do tratamento associou-se a maior progressão de estenose, inclusive durante a pandemia de COVID-19 (cancelamentos de endoscopia)." },
      { q: "O que são 'diet holidays' na EoE e qual seu racional?", a: "Pausas planejadas na dieta de eliminação (viagens, feriados, eventos sociais) com 'ponte' de terapia medicamentosa durante o período, retomando a dieta depois. Racional: dietas restritivas rígidas por tempo indefinido têm baixa sustentabilidade psicossocial — metade dos pacientes que identificam gatilhos não consegue manter a dieta." },
      { q: "Quais são as considerações pediátricas específicas na EoE segundo a ACG?", a: "Até 16,5% das crianças têm distúrbio alimentar significativo e 93,9% desenvolvem comportamentos alimentares mal-adaptativos. Comportamentos alimentares alterados PERSISTEM mesmo em remissão. Crescimento, habilidades alimentares e estado nutricional são metas formais de tratamento. Sequência: primeiro remissão, depois terapia de alimentação." },
      { q: "Por que o esofagograma ganha relevância na avaliação pediátrica da EoE?", a: "A endoscopia tem baixa sensibilidade para estreitamento verdadeiro, e crianças têm dificuldade de relatar sintomas com precisão. Em crianças, 55% das estenoses vistas ao esofagograma NÃO foram detectadas endoscopicamente. Pode-se usar comprimido revestido de bário para detectar estreitamentos sutis." },
      { q: "Na EoE, por que a recomendação de IBP é condicional enquanto a de corticoide tópico é forte?", a: "IBP: qualidade baixa (NÃO há RCT vs placebo — apenas comparações IBP vs corticoide), força condicional. Corticoide tópico: qualidade moderada (RCTs fase 3 vs placebo), força forte. A diferença reflete a base de evidência, não necessariamente a eficácia clínica." },
      { q: "Por que o dupilumabe tem recomendação condicional apesar de qualidade de evidência moderada?", a: "Porque força de recomendação não é só qualidade de evidência — também pesa custo (elevado), generalização (população do estudo era grave/refratária, ~5 anos de doença, 40% com dilatação prévia) e factibilidade. Recomendação condicional significa 'sugerimos', não 'recomendamos'." },
      { q: "Qual o algoritmo integrado de tratamento da EoE segundo a ACG 2025?", a: "Diagnóstico → avaliar inflamação E fibroestenose em PARALELO → tratamento compartilhado (IBP ou corticoide tópico OU dieta step-up 1FED/2FED) → reavaliação 8-12 sem (sintomas+EREFS+eosinófilos quantificados) → resposta: manter com possível redução de dose → não resposta a fármaco: dupilumabe → não resposta a dieta: escalar ou trocar para fármaco → estenose: dilatação + anti-inflamatório → manutenção indefinida." },
      { q: "Qual a diferença conceitual entre os algoritmos ACG e FBG no manejo da EoE?", a: "A ACG modela inflamação e fibroestenose como avaliações PARALELAS desde o início (não sequenciais). Reflete que a via inflamatória e a fibrótica precisam de vigilância simultânea e independente — um paciente pode estar em remissão histológica mas ter estenose residual (fibrose já estabelecida que anti-inflamatório não reverte). Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "febre-reum",
    name: "Febre Reumática Aguda",
    cards: [
      { q: "Qual o mecanismo central da febre reumática aguda (FRA)?", a: "Mimetismo molecular: proteínas de superfície do Streptococcus pyogenes (proteína M e N-acetil-glicosamina) compartilham epítopos com miosina cardíaca, laminina da membrana basal endotelial valvar, proteínas sinoviais e proteínas neuronais dos gânglios da base. A resposta imune contra o StrepA reage cruzadamente com tecidos do hospedeiro." },
      { q: "Qual o percentual de indivíduos expostos ao StrepA que desenvolvem FRA e por quê?", a: "Apenas 3-6%, mesmo em surtos epidêmicos. A suscetibilidade é determinada geneticamente pela associação com alelos HLA (especialmente HLA-DR7 e DR53). A reação é mediada predominantemente por linfócitos T CD4+ autorreativos que reconhecem peptídeos próprios apresentados por moléculas HLA classe II." },
      { q: "Por que a artrite da FRA resolve sem sequelas mas a cardite pode causar dano valvar crônico?", a: "A artrite é mediada por imunocomplexos circulantes (transitória, responde a AINEs). A cardite envolve infiltrado celular T direto no endocárdio valvar com formação de granulomas (nódulos de Aschoff) — inflamação refratária a anti-inflamatórios convencionais, levando a dano progressivo e irreversível." },
      { q: "Por que a coreia de Sydenham tem período de latência mais longo (2-6 meses) que a artrite (1-6 semanas)?", a: "Reflete o tempo necessário para que anticorpos antineuronais atinjam concentração suficiente para causar disfunção dopaminérgica nos gânglios da base e/ou maturação de resposta autoimune mediada por células no SNC. Por isso, cultura e ASLO podem já estar negativos no momento da coreia." },
      { q: "Por que anti-inflamatórios NÃO previnem dano valvar na FRA?", a: "A cardite envolve infiltrado de linfócitos T CD4+ autorreativos e granulomas (nódulos de Aschoff), refratários a AINEs e corticosteroides. Múltiplos estudos falharam em demonstrar benefício. A ÚNICA estratégia eficaz contra a DCR é a prevenção: primária (tratar faringite) e secundária (profilaxia antibiótica crônica)." },
      { q: "Quais são os critérios maiores de Jones para populações de BAIXO risco e de MODERADO/ALTO risco?", a: "Baixo risco: poliartrite, cardite (clínica/subclínica), coreia, eritema marginado, nódulos subcutâneos. Moderado/alto risco: adicionam monoartrite e poliartralgia como critérios maiores (além dos mesmos do baixo risco)." },
      { q: "Quais são os critérios menores de Jones para populações de BAIXO vs MODERADO/ALTO risco?", a: "Baixo risco: poliartralgia, febre ≥38,5°C, VHS ≥60 mm/h e/ou PCR ≥3 mg/dL, PR prolongado. Moderado/alto risco: monoartralgia (em vez de poliartralgia), febre ≥38°C, VHS ≥30 mm/h e/ou PCR ≥3 mg/dL, PR prolongado. Limiares mais baixos para favorecer sensibilidade." },
      { q: "Quais são as regras diagnósticas para primeiro episódio e recorrência de FRA?", a: "Primeiro episódio: 2 maiores OU 1 maior + 2 menores + evidência de infecção por StrepA. Recorrência (com ou sem DCR prévia): 2 maiores, OU 1 maior + 2 menores, OU 3 menores + evidência de infecção por StrepA." },
      { q: "Quais são as duas exceções diagnósticas reconhecidas nos Critérios de Jones?", a: "(1) Coreia como manifestação isolada: dispensa evidência sorológica de infecção recente (a infecção ocorreu meses antes). (2) Cardite indolente isolada: procura atendimento meses após infecção. Ambas exigem ecocardiograma e exclusão de outras causas." },
      { q: "Por que o Brasil é classificado como população de moderado/alto risco para FRA?", a: "Porque atende aos critérios: incidência de FRA >2/100.000 crianças em idade escolar/ano OU prevalência de DCR >1/1.000 na população geral. Isso permite diagnóstico com critérios mais sensíveis (monoartrite como critério maior, febre ≥38°C, VHS ≥30mm/h)." },
      { q: "Quais as características da artrite da FRA e por que a resposta aos AINEs é diagnosticamente importante?", a: "Poliartrite migratória de grandes articulações (joelhos, tornozelos, cotovelos), MMII primeiro, cada articulação inflamada por 1-2 dias a 1 semana. Resposta dramática a AINEs em <48h — é tão característica que sua ausência deve QUESTIONAR o diagnóstico. Resolve em ~4 semanas sem sequelas." },
      { q: "Por que se recomenda retardar AINEs quando há suspeita de FRA com monoartrite isolada?", a: "AINEs precoces mascaram o padrão migratório (imunocomplexos são rapidamente neutralizados). Recomenda-se usar apenas paracetamol temporariamente para permitir que o padrão migratório se manifeste, facilitando o diagnóstico." },
      { q: "Quais são os achados auscultatórios clássicos da cardite reumática?", a: "Regurgitação mitral: sopro pansistólico no ápice irradiando para axila esquerda (forma mais comum). Sopro de Carey Coombs: mesodiastólico curto no ápice (funcional da inflamação, não estenose orgânica). Regurgitação aórtica: diastólico precoce na base (sentado inclinado, expiração forçada)." },
      { q: "Quais os sinais semiológicos clássicos da coreia de Sydenham?", a: "Sinal do aperto de mão ('milk maid's grip'): pressão de preensão aumenta e diminui caprichosamente. Língua em 'saco de vermes': fasciculações e incapacidade de manter protrusão sustentada. Movimentos exacerbados por estresse e propósito, desaparecem com sono. Pode ser unilateral (hemicoreia)." },
      { q: "O que é a cardite subclínica e qual sua importância?", a: "Cardite detectada apenas por ecocardiografia/Doppler, sem achados auscultatórios. É frequentemente subdiagnosticada. Ecocardiografia portátil tem acurácia ~90% para DCR. TODOS os pacientes devem realizar ecocardiograma + ECG, mesmo sem sinais clínicos de cardite." },
      { q: "Descreva o eritema marginado da FRA e suas características.", a: "Rash evanescente, rosado, NÃO pruriginoso, em tronco (poupa face). Estende-se centrifugamente com retorno da pele central à aparência normal (anéis). Lesões aparecem/desaparecem em horas. Banho quente torna mais evidente. Ocorre mais comumente COM cardite aguda. Raro (<5%)." },
      { q: "Descreva os nódulos subcutâneos da FRA e como diferenciá-los dos da artrite reumatoide.", a: "Firmes, indolores, poucos mm a 2cm, sobre proeminências ósseas/tendões (cotovelos mais frequentes). Diferem dos reumatoides: menores, mais comumente sobre o olécrano (3-4cm distalmente nos reumatoides), pele suprajacente NÃO inflamada. Associados a cardite grave. Número médio: 3-4, persistem 1-2 semanas." },
      { q: "Qual a importância do intervalo PR prolongado como critério menor na FRA?", a: "Merece cautela: até 1/3 das crianças com faringite estreptocócica NÃO complicada apresentam PR prolongado, limitando sua especificidade. BAV de 1º grau é a alteração mais comum, mas BAV de 2º e 3º graus também podem ocorrer." },
      { q: "Como confirmar infecção estreptocócica precedente na FRA?", a: "ASLO: eleva-se 1 semana após infecção, pico em 3-5 semanas (sensibilidade isolada ~73%). Anti-DNAse B: sensibilidade combinada com ASLO >95%. Aumento do título entre fase aguda e convalescente (≥2 semanas) é a melhor evidência. Cultura ou teste rápido de antígeno são menos sensíveis (infecção pode já estar eliminada)." },
      { q: "Por que complemento sérico normal na FRA não contradiz a mediação por imunocomplexos?", a: "Na FRA, imunocomplexos depositam-se na sinóvia de forma localizada e transitória, insuficiente para consumo sistêmico de complemento. Diferente da GNPE, onde há deposição massiva nos glomérulos com consumo significativo de C3/C4. Complemento normal favorece FRA; hipocomplementemia sugere GNPE." },
      { q: "Qual o esquema de erradicação do StrepA na FRA e qual sua dupla função?", a: "Penicilina G benzatina: ≤27kg: 600.000 UI IM dose única; >27kg: 1.200.000 UI IM dose única. Alternativa oral: amoxicilina 50mg/kg/dia dividida em 2-3 doses, 10 dias. A penicilina G benzatina IM serve dupla função: erradica StrepA E funciona como primeira dose da profilaxia secundária." },
      { q: "Quais os AINEs de primeira linha para artrite da FRA e suas posologias?", a: "Naproxeno (1ª linha): crianças 10-20 mg/kg/dia em 2 doses (máx 1000 mg/dia); adultos 250-500 mg 2x/dia (máx 1250 mg/dia). Ibuprofeno: dose habitual (alternativa para crianças menores). Aspirina é alternativa histórica (50-100 mg/kg/dia em 4-5 doses), mas evitada pelo risco de Síndrome de Reye." },
      { q: "O que é o fenômeno de rebote na artrite da FRA?", a: "Recorrência de artrite ao reduzir a dose do anti-inflamatório. Reflete inflamação RESIDUAL, NÃO novo episódio de FRA — requer prolongamento do tratamento, não re-investigação diagnóstica. Resolução em 90% dos casos em 12 semanas." },
      { q: "Qual o tratamento da coreia de Sydenham?", a: "Geralmente autolimitada. Leve: observação + ambiente calmo. Moderada-grave: valproato de sódio ou carbamazepina (modulação GABAérgica/dopaminérgica). Refratária: corticosteroides. Sempre iniciar profilaxia antibiótica secundária. Encaminhar a neurologista infantil." },
      { q: "Qual o manejo da cardite na FRA e por que corticosteroides NÃO previnem dano valvar?", a: "Leve-moderada: AINEs. Grave (IC): prednisona 1-2 mg/kg/dia (máx 80mg), com redução gradual em 2-3 semanas. Cirurgia se refratária. Corticosteroides NÃO previnem dano valvar porque a infiltração de linfócitos T e granulomas no endocárdio é refratária a imunossupressão convencional." },
      { q: "Como monitorar a resolução do episódio agudo de FRA?", a: "PCR 2x/semana inicialmente → após normalização, a cada 1-2 semanas. PCR normaliza em ~3 semanas, VHS em ~5 semanas. AINEs mantidos até normalização de AMBOS. Aumento de PCR durante redução do anti-inflamatório = rebote → prolongar tratamento." },
      { q: "Qual o esquema de profilaxia secundária da FRA e suas alternativas?", a: "1ª escolha: Penicilina G benzatina IM a cada 21-28 dias (≤27kg: 600.000 UI; >27kg: 1.200.000 UI). Alternativas: Penicilina V oral 250mg 2x/dia; Azitromicina 6mg/kg/dia (máx 250mg) VO 1x/dia (se alergia a penicilina confirmada)." },
      { q: "Qual a duração da profilaxia secundária na FRA conforme a categoria?", a: "FRA sem cardite: 5 anos ou até 21 anos (o que for mais longo). Cardite SEM sequela valvar: 10 anos ou até 21 anos. Cardite COM sequela valvar: 10 anos ou até 40 anos. DCR grave: possivelmente por toda a vida." },
      { q: "Por que a penicilina G benzatina IM é preferida sobre a oral na profilaxia secundária?", a: "ECR com 405 crianças: recorrência de infecção estreptocócica de 7% com IM vs 20% com oral vs 24% com sulfadiazina nos primeiros 2 anos. Recorrência de FRA: 0% vs 4,8% vs 2,7%. A via IM tem maior eficácia E melhor adesão que a oral." },
      { q: "Quando usar profilaxia ORAL em vez de IM na FRA?", a: "Em pacientes com DCR grave sintomática (estenose mitral/aórtica, NYHA III/IV, FE <50%). Dados observacionais sugerem que mortes horas após injeção de penicilina G benzatina — atribuídas a 'anafilaxia' — eram na verdade colapso cardiovascular por reação vasovagal em coração gravemente comprometido." },
      { q: "Qual a conduta na faringite de escape (breakthrough) durante profilaxia com penicilina?", a: "Duas ações simultâneas: (1) Tratar o episódio agudo com agente alternativo (clindamicina) e retomar penicilina depois; (2) Encurtar intervalo de profilaxia de 28 para 21 dias (escape sugere intervalo insuficiente para manter níveis protetores de penicilina)." },
      { q: "Quais são os principais fatores de risco para recorrência de FRA?", a: "Falha na adesão à profilaxia secundária (principal fator), maior número de episódios prévios, menor intervalo desde o último episódio, maior exposição a StrepA (crianças, aglomeração), idade mais jovem, presença de cardite prévia (alto risco de cardite recorrente com dano cumulativo)." },
      { q: "Como diferenciar artrite reativa pós-estreptocócica (ARPE) da artrite da FRA?", a: "ARPE: latência mais curta (1-2 semanas vs 2-4 semanas), resposta POBRE aos AINEs (vs dramática na FRA), sem cardite, com tenossinovite. Entidade controversa — pode ser forme fruste da FRA. Diretrizes recomendam profilaxia secundária e seguimento ecocardiográfico por 12-24 meses." },
      { q: "O que é a artropatia de Jaccoud e quando ocorre?", a: "Complicação rara associada a episódios recorrentes de FRA. Artropatia crônica benigna com frouxidão e alongamento de estruturas periarticulares em mãos e/ou pés. As deformidades são indolores, 'corrigíveis' à manipulação e NÃO associadas a inflamação ativa." },
      { q: "Qual a principal sequela tardia da FRA e como se manifesta?", a: "Doença cardíaca reumática (DCR): surge 10-20 anos após o episódio inicial. Valva mitral mais acometida. Regurgitação mitral é o achado mais comum, podendo progredir para estenose mitral por fibrose e calcificação. Principal causa de doença valvar adquirida no mundo. Sopro em ~50% dos que tiveram cardite." },
      { q: "Qual a evidência de que a prevenção primária tem limitações na FRA?", a: "Pelo menos 1/3 dos episódios de FRA ocorre após infecção SUBCLÍNICA (sem faringite documentada). Em estudo prospectivo, 30% dos pacientes no primeiro episódio já apresentavam DCR não diagnosticada. Isso reforça que a profilaxia secundária é o pilar mais importante." },
      { q: "Por que um RCT comparando penicilina G benzatina vs placebo na FRA seria eticamente inaceitável?", a: "A evidência existente (mesmo histórica, décadas de 1950-60) demonstrou benefício tão consistente e de grande magnitude que expor pacientes a placebo significaria submetê-los a risco conhecido de dano valvar progressivo. Exemplifica o conceito de 'recomendação forte com evidência de qualidade moderada' no GRADE. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
];

function toggleSidebar() {
  const hidden = document.body.classList.toggle('sidebar-hidden');
  try { localStorage.setItem('sidebarHidden', hidden ? '1' : '0'); } catch (e) {}
}

const state = {
  currentDeck: null,
  index: 0,
  flipped: false,
  order: [],
  results: {},   // { cardIdx: 'ok' | 'err' }
  finished: false,
  animating: false,
  enterDir: null  // 'right'|'left'|'up' for entering card animation
};

const $tabs = document.getElementById("tabs");
const $main = document.getElementById("main");

/* -------- Sons (Web Audio API, sem arquivos) -------- */
let audioCtx = null;
let masterGain = null;
const MASTER_VOL = 0.45; // volume geral do site
function getAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = MASTER_VOL;
      masterGain.connect(audioCtx.destination);
    } catch {}
  }
  return audioCtx;
}
function playTone(freqs, duration = 0.2, type = 'sine', gainStart = 0.15) {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  freqs.forEach((f, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f.freq, now + (f.at || 0));
    if (f.slideTo) osc.frequency.exponentialRampToValueAtTime(f.slideTo, now + (f.at || 0) + duration);
    gain.gain.setValueAtTime(0, now + (f.at || 0));
    gain.gain.linearRampToValueAtTime(gainStart, now + (f.at || 0) + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (f.at || 0) + duration);
    osc.connect(gain).connect(masterGain);
    osc.start(now + (f.at || 0));
    osc.stop(now + (f.at || 0) + duration + 0.02);
  });
}
function makeNoiseBurst(ctx, at, duration, freqStart, freqEnd, peakGain, filterType = 'bandpass', Q = 3) {
  const bufSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.setValueAtTime(freqStart, at);
  filter.frequency.exponentialRampToValueAtTime(freqEnd, at + duration);
  filter.Q.value = Q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(peakGain, at + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, at + duration);
  src.connect(filter).connect(g).connect(masterGain);
  src.start(at);
  src.stop(at + duration + 0.02);
}
function soundOk() {
  // acorde ascendente: C5, E5, G5 (523, 659, 784)
  playTone([
    { freq: 523.25, at: 0 },
    { freq: 659.25, at: 0.08 },
    { freq: 783.99, at: 0.16 }
  ], 0.35, 'triangle', 0.14);
}
function soundErr() {
  // descendente grave
  playTone([
    { freq: 220, slideTo: 110, at: 0 }
  ], 0.35, 'sawtooth', 0.12);
}
function soundEnd() {
  playTone([
    { freq: 523.25, at: 0 },
    { freq: 659.25, at: 0.12 },
    { freq: 783.99, at: 0.24 },
    { freq: 1046.50, at: 0.36 }
  ], 0.4, 'triangle', 0.12);
}
function soundFlip() {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Swoosh: ruído bandpass varrendo 2000 → 500 Hz
  makeNoiseBurst(ctx, now, 0.18, 2000, 500, 0.22, 'bandpass', 3);
  // Estalo curto no final (carta pousando)
  const clickAt = now + 0.12;
  const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.04), ctx.sampleRate);
  const cd = clickBuf.getChannelData(0);
  for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / cd.length);
  const click = ctx.createBufferSource();
  click.buffer = clickBuf;
  const clickHp = ctx.createBiquadFilter();
  clickHp.type = 'highpass';
  clickHp.frequency.value = 1500;
  const clickGain = ctx.createGain();
  clickGain.gain.setValueAtTime(0.28, clickAt);
  clickGain.gain.exponentialRampToValueAtTime(0.001, clickAt + 0.05);
  click.connect(clickHp).connect(clickGain).connect(masterGain);
  click.start(clickAt);
  click.stop(clickAt + 0.05);
}
function soundSlide(direction = 'right') {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Whoosh mais suave e curto que o flip — sem estalo
  // direção altera o "pitch" do filtro (esquerda = pitch mais alto)
  const startF = direction === 'left' ? 2400 : 1800;
  const endF   = direction === 'left' ? 700  : 400;
  makeNoiseBurst(ctx, now, 0.22, startF, endF, 0.18, 'bandpass', 2);
}
function soundShuffle() {
  const ctx = getAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  // Riffle: 7 estalos curtos com variação (som de baralho embaralhando)
  const N = 7;
  for (let i = 0; i < N; i++) {
    const at = now + i * 0.055 + (Math.random() * 0.015);
    // pequeno swoosh
    makeNoiseBurst(ctx, at, 0.06, 2600 + Math.random() * 1500, 900, 0.14, 'bandpass', 4);
    // estalo curto
    const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.025), ctx.sampleRate);
    const cd = clickBuf.getChannelData(0);
    for (let j = 0; j < cd.length; j++) cd[j] = (Math.random() * 2 - 1) * (1 - j / cd.length);
    const click = ctx.createBufferSource();
    click.buffer = clickBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2500 + Math.random() * 1500;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.14 + Math.random() * 0.06, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, at + 0.035);
    click.connect(hp).connect(g).connect(masterGain);
    click.start(at + 0.02);
    click.stop(at + 0.05);
  }
}

function saveProgress() {
  if (!state.currentDeck) return;
  localStorage.setItem("ac2_" + state.currentDeck.id, JSON.stringify({
    index: state.index,
    order: state.order,
    results: state.results,
    finished: state.finished
  }));
}

function loadProgress(deckId) {
  try {
    const raw = localStorage.getItem("ac2_" + deckId);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return {
      index: p.index || 0,
      order: p.order || null,
      results: p.results || {},
      finished: !!p.finished
    };
  } catch { return null; }
}

function renderTabs() {
  $tabs.innerHTML = "";
  DECKS.forEach(deck => {
    const btn = document.createElement("button");
    btn.className = "tab" + (state.currentDeck && state.currentDeck.id === deck.id ? " active" : "");
    btn.innerHTML = '<span>' + escapeHtml(deck.name) + '</span><span class="count">' + deck.cards.length + '</span>';
    btn.onclick = () => selectDeck(deck);
    $tabs.appendChild(btn);
  });
}

function selectDeck(deck) {
  state.currentDeck = deck;
  state.flipped = false;
  state.enterDir = 'up';
  const saved = loadProgress(deck.id);
  if (saved && saved.order && saved.order.length === deck.cards.length) {
    state.index = saved.index;
    state.order = saved.order;
    state.results = saved.results;
    state.finished = saved.finished;
  } else {
    state.index = 0;
    state.order = deck.cards.map((_, i) => i);
    state.results = {};
    state.finished = false;
  }
  renderTabs();
  render();
}

function shuffle() {
  soundShuffle();
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.index = 0;
  state.flipped = false;
  state.results = {};
  state.finished = false;
  state.enterDir = 'up';
  saveProgress();
  render();
}

function resetDeck() {
  if (!confirm("Reiniciar progresso deste tema?")) return;
  state.index = 0;
  state.order = state.currentDeck.cards.map((_, i) => i);
  state.results = {};
  state.finished = false;
  state.flipped = false;
  saveProgress();
  render();
}

function animateExit(exitClass, cb) {
  const wrap = document.querySelector('.card-anim');
  if (!wrap || state.animating) { cb(); return; }
  state.animating = true;
  wrap.classList.remove('enter-right','enter-left','enter-up');
  wrap.classList.add(exitClass);
  setTimeout(() => {
    state.animating = false;
    cb();
  }, 320);
}

function next() {
  if (state.finished || state.animating) return;
  if (state.index < state.order.length - 1) {
    soundSlide('left');
    animateExit('exit-left', () => {
      state.index++;
      state.flipped = false;
      state.enterDir = 'right';
      saveProgress();
      render();
    });
  }
}

function prev() {
  if (state.animating) return;
  if (state.finished) {
    soundSlide('right');
    state.finished = false;
    state.index = state.order.length - 1;
    state.flipped = false;
    state.enterDir = 'left';
    saveProgress();
    render();
    return;
  }
  if (state.index > 0) {
    soundSlide('right');
    animateExit('exit-right', () => {
      state.index--;
      state.flipped = false;
      state.enterDir = 'left';
      saveProgress();
      render();
    });
  }
}

function flip() {
  if (state.animating) return;
  const cardEl = document.querySelector('.card');
  if (!cardEl) return;
  if (cardEl.classList.contains('blinking')) return;

  const wasFlipped = state.flipped;
  state.flipped = !wasFlipped;
  saveProgress();
  soundFlip();

  cardEl.classList.add('blinking');

  // Troca a face no meio (quando o card está invisível)
  setTimeout(() => {
    if (wasFlipped) cardEl.classList.remove('flipped');
    else cardEl.classList.add('flipped');
  }, 190);

  setTimeout(() => {
    cardEl.classList.remove('blinking');
  }, 410);
}

function mark(kind) {
  if (state.finished || state.animating) return;
  const cardIdx = state.order[state.index];
  state.results[cardIdx] = kind;

  // som
  if (kind === 'ok') soundOk(); else soundErr();

  // botão pulsa
  const keyBtn = document.querySelector(`.key.${kind === 'ok' ? 'ok' : 'err'}`);
  if (keyBtn) { keyBtn.classList.add('pressed'); setTimeout(() => keyBtn.classList.remove('pressed'), 400); }

  // flash overlay
  const container = document.querySelector('.card-container');
  if (container) {
    const flash = document.createElement('div');
    flash.className = 'flash-overlay ' + kind;
    container.appendChild(flash);
    setTimeout(() => flash.remove(), 600);
  }

  animateExit(kind === 'ok' ? 'exit-up' : 'exit-down', () => {
    state.flipped = false;
    if (state.index < state.order.length - 1) {
      state.index++;
      state.enterDir = 'up';
    } else {
      state.finished = true;
      soundEnd();
    }
    saveProgress();
    render();
  });
}

function countResults() {
  let correct = 0, wrong = 0;
  Object.values(state.results).forEach(v => {
    if (v === 'ok') correct++;
    else if (v === 'err') wrong++;
  });
  return { correct, wrong };
}

function classify(pct) {
  if (pct >= 90) return { key: 'excelente', label: 'Excelente' };
  if (pct >= 75) return { key: 'otimo', label: 'Ótimo' };
  if (pct >= 60) return { key: 'regular', label: 'Regular' };
  return { key: 'melhorar', label: 'Precisa Melhorar' };
}

function render() {
  const deck = state.currentDeck;
  if (!deck) { renderEmpty(); return; }
  if (state.finished) { renderEnd(); return; }
  renderDeck();
}

function renderDeck() {
  const deck = state.currentDeck;
  const total = deck.cards.length;
  const cardIdx = state.order[state.index];
  const card = deck.cards[cardIdx];
  const progress = ((state.index + 1) / total) * 100;
  const atFirst = state.index === 0;

  $main.innerHTML = `
    <div class="toolbar">
      <div>
        <div class="deck-title">${escapeHtml(deck.name)}</div>
        <div class="deck-progress-num"><span class="curr">${state.index + 1}</span> de ${total}</div>
      </div>
      <div class="actions">
        <button class="btn" onclick="shuffle()">Embaralhar</button>
        <button class="btn" onclick="resetDeck()">Reiniciar</button>
      </div>
    </div>

    <div class="progress-bar"><div class="fill" style="width:${progress}%"></div></div>

    <div class="card-container">
      <div class="card-anim ${state.enterDir ? 'enter-' + state.enterDir : ''}">
        <div class="card ${state.flipped ? 'flipped' : ''}" onclick="flip()">
          <div class="face front">
            <div class="label">Pergunta</div>
            <div class="content">${escapeHtml(card.q)}</div>
            <div class="hint">clique ou espaço</div>
          </div>
          <div class="face back">
            <div class="label">Resposta</div>
            <div class="content">${escapeHtml(card.a)}</div>
            <div class="hint">clique ou espaço</div>
          </div>
        </div>
      </div>
    </div>

    <div class="keymap">
      <button class="key ${atFirst ? 'disabled' : ''}" onclick="prev()" ${atFirst ? 'disabled' : ''}>
        <span class="icon">←</span><span>Anterior</span>
      </button>
      <button class="key err" onclick="mark('err')">
        <span class="icon">↓</span><span>Errei</span>
      </button>
      <button class="key ok" onclick="mark('ok')">
        <span class="icon">↑</span><span>Acertei</span>
      </button>
      <button class="key" onclick="next()">
        <span class="icon">→</span><span>Próximo</span>
      </button>
    </div>
  `;
  // Clear entry direction after render so flipping doesn't retrigger animation
  state.enterDir = null;
}

function renderEnd() {
  const deck = state.currentDeck;
  const total = deck.cards.length;
  const { correct, wrong } = countResults();
  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  const cls = classify(pct);

  // donut math
  const r = 100;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  const colorFor = {
    excelente: 'var(--ok)',
    otimo: 'var(--accent)',
    regular: 'var(--warn)',
    melhorar: 'var(--err)'
  }[cls.key];

  $main.innerHTML = `
    <div class="end-screen">
      <h2>Sessão Concluída</h2>
      <div class="subtitle">${escapeHtml(deck.name)} · ${total} flashcards</div>

      <div class="donut">
        <svg viewBox="0 0 240 240">
          <circle class="track" cx="120" cy="120" r="${r}"></circle>
          <circle class="fill-arc" cx="120" cy="120" r="${r}"
                  stroke="${colorFor}"
                  stroke-dasharray="${circ}"
                  stroke-dashoffset="${circ}"
                  id="arc"></circle>
        </svg>
        <div class="center">
          <div class="pct">${pct}%</div>
          <div class="pct-label">Acertos</div>
        </div>
      </div>

      <div class="badge ${cls.key}">${cls.label}</div>

      <div class="end-stats">
        <div class="end-stat correct">
          <div class="val">${correct}</div>
          <div class="lbl">Acertos</div>
        </div>
        <div class="end-stat wrong">
          <div class="val">${wrong}</div>
          <div class="lbl">Erros</div>
        </div>
        <div class="end-stat">
          <div class="val">${answered}/${total}</div>
          <div class="lbl">Respondidos</div>
        </div>
      </div>

      <div class="end-actions">
        <button class="btn" onclick="prev()">Voltar ao último</button>
        <button class="btn primary" onclick="resetDeck()">Recomeçar</button>
        <button class="btn" onclick="shuffle()">Embaralhar</button>
      </div>
    </div>
  `;

  // Animate donut fill
  requestAnimationFrame(() => {
    const arc = document.getElementById('arc');
    if (arc) arc.style.strokeDashoffset = offset;
  });
}

function renderEmpty() {
  $main.innerHTML = `
    <div class="empty">
      <h2>Selecione um tema</h2>
      <p>Escolha um tema na barra lateral para começar.</p>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document.addEventListener("keydown", (e) => {
  if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = e.target; const tag = (t && t.tagName || '').toLowerCase();
    if (tag !== 'input' && tag !== 'textarea' && !(t && t.isContentEditable)) {
      toggleSidebar(); return;
    }
  }
  if (!state.currentDeck) return;
  if (state.finished) {
    if (e.key === "ArrowLeft") prev();
    return;
  }
  if (e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowUp") { e.preventDefault(); mark('ok'); }
  else if (e.key === "ArrowDown") { e.preventDefault(); mark('err'); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});

renderTabs();
if (DECKS.length > 0) selectDeck(DECKS[0]);
</script>

</body>
</html>
