  {
    id: "hptp",
    name: "Hiperparatireoidismo Primário",
    cards: [
      { q: "Como funciona o circuito normal de retroalimentação negativa do cálcio?", a: "O receptor sensor de cálcio (CaSR) nas células principais da paratireoide detecta Ca²+ extracelular. Cálcio alto → CaSR ativado → inibe secreção de PTH, transcrição do gene do PTH e proliferação celular. Cálcio baixo → CaSR menos ativado → liberação de PTH." },
      { q: "Quais são os três braços de ação do PTH na defesa contra hipocalcemia?", a: "(1) Osso: aumenta reabsorção óssea (ativação de osteoclastos via RANKL). (2) Rim: aumenta reabsorção tubular de cálcio, reduz reabsorção de fosfato (efeito fosfatúrico → fósforo baixo-normal) e estimula 1-alfa-hidroxilase (→ calcitriol). (3) Intestino: indiretamente via calcitriol, aumenta absorção intestinal de cálcio." },
      { q: "Qual o mecanismo molecular do HPTP?", a: "Crescimento clonal desregulado do tecido paratireoideo (adenoma na maioria) com redução da expressão do CaSR. O 'set-point' de cálcio necessário para inibir PTH é deslocado para cima — é preciso cálcio mais alto que o normal para suprimir o PTH. O eixo funciona, mas 'recalibrado' em patamar hipercalcêmico." },
      { q: "Quais as etiologias do HPTP em ordem de frequência?", a: "Adenoma único benigno: ~85%. Doença multiglandular (hiperplasia ou adenomas múltiplos): ~15%. Carcinoma de paratireoide: <1%. Doença multiglandular deve levantar suspeita de base genética (MEN) ou HPTP associado a lítio." },
      { q: "Por que o fósforo sérico tende a estar baixo-normal no HPTP?", a: "O PTH em excesso reduz a reabsorção tubular de fosfato (efeito fosfatúrico direto). Além disso, o PTH estimula a 1-alfa-hidroxilase renal, aumentando calcitriol, que por sua vez aumenta a absorção intestinal de cálcio. Ambos os mecanismos contribuem para hipercalcemia + hipofosfatemia relativa." },
      { q: "Quais os critérios diagnósticos para HPTP hipercalcêmico e normocalcêmico?", a: "Hipercalcêmico: cálcio elevado (ajustado por albumina) + PTH elevado ou inapropriadamente normal, em 2 medidas com ≥2 semanas de intervalo. Normocalcêmico: cálcio normal (total ajustado E ionizado) + PTH elevado, em 2 medidas com 3-6 meses de intervalo, após excluir causas secundárias." },
      { q: "Por que um PTH 'normal' NÃO descarta HPTP em paciente hipercalcêmico?", a: "Porque o PTH DEVERIA estar suprimido diante da hipercalcemia e não está. É a INADEQUAÇÃO da resposta (PTH inapropriadamente normal para o nível de cálcio), não apenas o valor absoluto, que define a doença. O sistema de retroalimentação negativa está 'recalibrado'." },
      { q: "Como corrigir o cálcio sérico pela albumina e quando o cálcio ionizado é preferível?", a: "Correção: +0,8 mg/dL de cálcio para cada 1 g/dL de albumina abaixo de 4 g/dL. O cálcio ionizado dispensa correção e é mais confiável, especialmente quando cálcio total normal mas PTH elevado (HPTP normocalcêmico)." },
      { q: "Como diferenciar HPTP da hipercalcemia hipocalciúrica familiar (FHH)?", a: "FHH: mutação inativadora do CaSR, pacientes jovens, hipercalcemia desde sempre, história familiar. Relação clearance Ca/Cr <0,01 favorece FHH (70-80% dos casos), mas até 20% dos HPTP também têm essa relação, e ~40% ficam na 'zona cinzenta' (0,01-0,02). Teste NÃO é definitivo — genética indicada se suspeita persiste." },
      { q: "Quais causas devem ser excluídas antes de diagnosticar HPTP normocalcêmico?", a: "Todas as causas de hiperparatireoidismo SECUNDÁRIO (PTH alto + cálcio normal/baixo): deficiência de vitamina D, doença renal crônica estágios 3-5, má absorção de cálcio, uso de bisfosfonato ou denosumabe. Se cálcio estiver baixo, HPTP normocalcêmico é descartado por definição." },
      { q: "Quais são os fenótipos clínicos do HPTP?", a: "Sintomático: complicações ósseas/renais evidentes. Assintomático COM envolvimento de órgão-alvo: achado incidental, mas avaliação revela dano subclínico (DMO baixa, cálculo renal silencioso). Assintomático SEM envolvimento: avaliação normal. Normocalcêmico: pode ou não ter envolvimento de órgão-alvo." },
      { q: "Qual a avaliação completa do paciente com HPTP?", a: "Bioquímico: cálcio ajustado (±ionizado), fósforo, PTH intacto, 25(OH)D, creatinina. Esquelético: DXA em 3 sítios (coluna, quadril, terço distal do rádio) + avaliação de fratura vertebral + TBS. Renal: TFG/clearance de creatinina, calciúria 24h, imagem para nefrolitíase/nefrocalcinose. Genético: se <30 anos, doença multiglandular ou HF." },
      { q: "Por que o terço distal do rádio deve ser incluído na DXA do HPTP?", a: "É sítio predominantemente CORTICAL, e o PTH em excesso lesa preferencialmente osso cortical. A coluna lombar (trabecular) costuma estar relativamente preservada. DXA 'padrão' (coluna+quadril) sem rádio pode SUBESTIMAR a doença óssea no HPTP." },
      { q: "Quais são os critérios de indicação cirúrgica no HPTP assintomático (2022)?", a: "Basta UM: (1) Cálcio >1 mg/dL acima do LSN; (2) Fratura por VFA/Rx ou T-score ≤-2,5 em qualquer sítio; (3) TFG/clearance <60 mL/min ou nefrocalcinose/nefrolitíase ou hipercalciúria (>250 mg/dia mulheres; >300 mg/dia homens); (4) Idade <50 anos (critério suficiente isoladamente)." },
      { q: "Por que a idade <50 anos é critério cirúrgico ISOLADO no HPTP, mesmo sem envolvimento de órgão-alvo?", a: "Pacientes mais jovens têm maior tempo de exposição cumulativa ao excesso de PTH e maior probabilidade de progressão da doença se não operados. O painel considera esse grupo mais propenso a sofrer consequências negativas com o seguimento conservador." },
      { q: "Qual a taxa de cura da paratireoidectomia e qual a tendência histórica dos critérios cirúrgicos?", a: "Cura bioquímica em 97,8% dos casos com cirurgião experiente. A tendência desde 1990 é de LIBERALIZAÇÃO dos critérios (limiares mais sensíveis) — menor calciúria já basta (de >400 para >250/300 mg/dia), refletindo que intervir mais cedo previne dano cumulativo e que a cirurgia é segura." },
      { q: "Qual o papel da imagem pré-operatória no HPTP?", a: "NÃO serve para diagnosticar HPTP (diagnóstico é bioquímico). Serve APENAS para localizar a(s) glândula(s) doente(s), permitindo paratireoidectomia seletiva (minimamente invasiva). Métodos: USG cervical, cintilografia com sestamibi-Tc99m, TC 4D. Doença multiglandular (MEN1/MEN2) CONTRAINDICA cirurgia seletiva — exige exploração bilateral." },
      { q: "Por que sintomas neuropsiquiátricos e cardiovasculares NÃO são indicação cirúrgica isolada no HPTP?", a: "Apesar de associações na literatura, RCT prospectivo de 10 anos NÃO confirmou associação causal consistente entre HPTP e depressão/pior qualidade de vida, nem reversibilidade após cirurgia. Hipertensão e hipertrofia ventricular não têm base fisiopatológica clara nem melhora consistente pós-PTX." },
      { q: "Qual a lógica do manejo farmacológico do HPTP e por que nenhum fármaco isolado resolve os dois problemas?", a: "Cinacalcete (calcimimético): 'engana' o CaSR → reduz PTH e cálcio, mas NÃO melhora DMO (sem ação no remodelamento ósseo). Alendronato/denosumabe (antirreabsortivos): bloqueiam osteoclastos → melhoram DMO, mas NÃO corrigem hipersecreção de PTH/hipercalcemia. Para AMBOS os objetivos: combinar cinacalcete + antirreabsortivo." },
      { q: "A restrição de cálcio na dieta é recomendada no HPTP?", a: "NÃO. Ao contrário do que muitos praticam, restringir cálcio pode ESTIMULAR ainda mais a secreção de PTH sem necessariamente baixar a calcemia. Seguir recomendações nutricionais padrão (800-1200 mg/dia conforme idade e sexo)." },
      { q: "Qual a meta de vitamina D no HPTP e é seguro repor?", a: "Meta: 25(OH)D > 30 ng/mL. Reposição é SEGURA mesmo no HPTP (metanálises mostram que NÃO piora hipercalcemia) e reduz o PTH em média 33%." },
      { q: "Quais as particularidades do manejo do HPTP na gravidez?", a: "Diagnóstico difícil (fadiga/náusea/constipação se confundem com gestação). Cálcio total cai (hemodiluição), mas ionizado NÃO muda. Bisfosfonatos e denosumabe são CONTRAINDICADOS. Cirurgia se indicada: 1ª metade do 2º trimestre. Imagem: apenas USG (evitar radiação). RN: monitorar para hipocalcemia neonatal (supressão da paratireoide fetal)." },
      { q: "Qual o protocolo de monitorização do paciente com HPTP que NÃO opera?", a: "Cálcio + 25(OH)D: anual. DXA (3 sítios): a cada 1-2 anos. Clearance de creatinina: anual. Imagem renal/calciúria: se clinicamente indicado. Reconsiderar cirurgia se: cálcio consistentemente >1 mg/dL acima do LSN, nova fratura, novo cálculo, T-score ≤-2,5 ou queda significativa da função renal." },
      { q: "Quais os critérios para reconsiderar cirurgia durante o seguimento conservador do HPTP?", a: "Cálcio consistentemente >1 mg/dL acima do LSN; nova fratura de baixo impacto; novo cálculo renal; queda significativa de DMO a T-score ≤-2,5; queda significativa da função renal." },
      { q: "Como o lítio pode mimetizar HPTP e qual a conduta?", a: "O lítio inibe a inibição do CaSR sobre a secreção de PTH e pode reduzir excreção renal de cálcio, elevando cálcio e PTH. Conduta: retirar a droga e reavaliar em meses. Se a hipercalcemia PERSISTIR, o diagnóstico de HPTP se confirma." },
      { q: "Qual a logica mecanistica da combinacao cinacalcete + antirreabsortivo no HPTP?", a: "Cinacalcete atua no CaSR, suprimindo secrecao de PTH e reduzindo calcemia, mas sem efeito sobre DMO. Antirreabsortivos (bisfosfonato, denosumabe) bloqueiam reabsorcao osteoclastica, melhorando DMO mas sem corrigir hipercalcemia. A combinacao resolve os DOIS problemas: calcio E osso." },
      { q: "Qual a recomendacao sobre suplementacao de calcio no HPTP e por que?", a: "NAO se deve restringir calcio da dieta — restricao pode estimular ainda mais a secrecao de PTH sem necessariamente baixar a calcemia. Seguir recomendacoes nutricionais padrao: 800 a 1200 mg/dia conforme idade e sexo." },
      { q: "Qual a meta de vitamina D no HPTP e a reposicao e segura?", a: "Meta: manter 25(OH)D >30 ng/mL. A reposicao e segura (nao piora hipercalcemia, segundo metanalises) e reduz o PTH em media 33%. Deficiencia de vitamina D deve ser excluida antes de diagnosticar HPTP normocalcemico." },
      { q: "Quais os limiares de calciuria que sao criterio cirurgico no HPTP (2022)?", a: ">250 mg/dia em mulheres e >300 mg/dia em homens. Essa mudanca em 2022 (antes era >400 mg/dia) reflete a tendencia historica de liberalizacao dos criterios, com limiares mais sensiveis." },
      { q: "Qual a zona cinzenta da relacao Ca/Cr Cl na diferenciacao entre HPTP e FHH?", a: "Ca/Cr Cl <0,01 favorece FHH (presente em 70-80% dos casos de FHH). Porem, ~20% dos HPTP tambem tem Ca/Cr Cl <0,01. A zona cinzenta (0,01-0,02) abrange ~40% dos casos e nao e definitiva. Quando a suspeita persiste, investigacao genetica e indicada." },
      { q: "Como diferenciar PTHrP (hipercalcemia da malignidade) de PTH no laboratorio?", a: "Os ensaios de PTH e PTHrP nao tem reacao cruzada. A hipercalcemia da malignidade e mediada por PTHrP (nao por PTH), entao o PTH estara suprimido. Secrecao ectopica de PTH verdadeiro e extremamente rara." },
      { q: "O que o HR-pQCT revelou sobre o acometimento osseo trabecular no HPTP?", a: "O HR-pQCT (tomografia periferica quantitativa de alta resolucao) mostrou que o compartimento trabecular TAMBEM e afetado no HPTP, corrigindo a antiga ideia de que o HPTP 'poupava' o osso trabecular. A perda preferencial e cortical, mas nao exclusiva." },
      { q: "Quais as causas que devem ser excluidas antes de diagnosticar HPTP normocalcemico?", a: "Causas de hiperparatireoidismo secundario: deficiencia de vitamina D, doenca renal cronica estagios 3-5, ma absorcao de calcio, uso de bisfosfonato ou denosumabe. Se o calcio estiver baixo, ja se descarta HPTP normocalcemico por definicao." },
      { q: "Quais sao os achados gastrointestinais classicos do HPTP sintomatico grave?", a: "Dor abdominal, constipacao, ulcera peptica e pancreatite. Porem, ficam restritos a forma sintomatica grave ou a contextos especificos como MEN1 com sindrome de Zollinger-Ellison. Nao justificam indicacao cirurgica isoladamente." },
      { q: "Qual a frequencia dos diferentes graus de gravidade da cirurgia no HPTP?", a: "A paratireoidectomia atinge cura bioquimica em 97,8% dos casos nas maos de cirurgiao experiente. A doenca multiglandular (MEN1/MEN2) contraindica cirurgia seletiva e exige exploracao bilateral." },
      { q: "O que acontece com o recem-nascido de mae com HPTP e por que?", a: "O recem-nascido deve ser monitorado para hipocalcemia neonatal. Mecanismo: a hipercalcemia materna cruza a placenta, suprimindo a paratireoide fetal durante a vida intrauterina. Ao nascer, sem o aporte materno de calcio, o neonato nao consegue secretar PTH adequadamente." },
      { q: "Quais os metodos de imagem pre-operatoria no HPTP e quando usar cada um?", a: "Ultrassonografia cervical de alta resolucao, cintilografia com sestamibi-Tc99m e TC 4D contrastada. Servem APENAS para localizar a(s) glandula(s) doente(s), nunca para diagnostico (que e bioquimico). Permitem paratireoidectomia seletiva minimamente invasiva." },
      { q: "Quais farmacos sao contraindicados no HPTP durante a gravidez?", a: "Bisfosfonatos e denosumabe sao contraindicados (atravessam placenta / efeitos sobre ossificacao fetal em modelo animal). Se cirurgia for indicada, deve ser na 1a metade do 2o trimestre. Imagem pre-operatoria limitada a ultrassonografia (evitar radiacao/contraste)." },
      { q: "Qual a evolucao historica do criterio de calciuria para indicacao cirurgica no HPTP?", a: "1990-2002: >400 mg/dia. 2008: removida. 2013: reintroduzida (>400 mg/dia). 2022: >250 mg/dia (mulheres) / >300 mg/dia (homens). Essa tendencia de liberalizacao reflete que intervir mais cedo previne dano cumulativo e a cirurgia e segura." },
      { q: "Por que manifestacoes neurocognitivas e cardiovasculares NAO sao criterio cirurgico no HPTP?", a: "Apesar de associacao na literatura cirurgica (depressao, HAS, hipertrofia VE, HOMA-IR), um ECR prospectivo de 10 anos nao confirmou associacao causal consistente nem reversibilidade apos PTX. Nao rastrear rotineiramente e nao usar isoladamente como indicacao cirurgica." },
      { q: "Qual a definicao precisa de 'assintomatico com envolvimento de orgao-alvo' no HPTP?", a: "Paciente com achado incidental de HPTP cuja avaliacao revela dano subclinico (DMO baixa, calculo renal silencioso), mas que NAO procurou o medico por causa de manifestacao clinica evidente. Encontrar calculo ou DMO baixa nao o torna 'sintomatico'." },
      { q: "Qual o efeito do litio sobre o metabolismo do calcio e como pode mimetizar HPTP?", a: "O litio inibe a inibicao do CaSR sobre a secrecao de PTH e pode reduzir a excrecao renal de calcio. Pode elevar tanto calcio quanto PTH, mimetizando HPTP. Conduta: retirar o litio e reavaliar em meses; se hipercalcemia persistir, confirma-se HPTP." },
      { q: "Quais os criterios para reconsiderar cirurgia durante seguimento conservador do HPTP?", a: "Calcio consistentemente >1 mg/dL acima do LSN, nova fratura de baixo impacto, novo calculo renal, queda significativa de DMO a T-score <= -2,5, ou queda significativa da funcao renal." },
      { q: "Qual a frequencia da monitorizacao para paciente com HPTP que nao opera?", a: "Calcio + 25(OH)D: anual. DXA (3 sitios): a cada 1-2 anos (menos frequente se DMO normal). Clearance de creatinina: anual (preferivel a TFG estimada). Imagem renal/calciuria 24h: se clinicamente indicado." },
      { q: "Por que o TBS (Trabecular Bone Score) e relevante na avaliacao do HPTP?", a: "O TBS e uma analise da textura da imagem DXA da coluna lombar que avalia a microarquitetura trabecular. Como o HPTP tambem afeta o trabecular (revelado por HR-pQCT), o TBS complementa a DXA convencional na avaliacao esqueletica." },
      { q: "Qual a fisiologia normal do calcio e PTH na gravidez que dificulta o diagnostico de HPTP?", a: "Na gravidez normal: calcio total cai (hemodiluicao/queda de albumina), mas calcio ionizado nao muda; PTH cai no 1o trimestre e sobe gradualmente ate o parto. Sintomas de HPTP (fadiga, nausea, constipacao) confundem-se com sintomas da propria gestacao." },
      { q: "Qual a importancia do clearance de creatinina vs TFG estimada no seguimento do HPTP?", a: "O clearance de creatinina e PREFERIVEL a TFG estimada no seguimento do HPTP. E usado anualmente para monitorar funcao renal. TFG <60 mL/min e criterio cirurgico, entao a acuracia da medida e clinicamente relevante." },
      { q: "O que significa o conceito de 'set-point deslocado' no HPTP?", a: "O set-point de calcio necessario para inibir a secrecao de PTH fica deslocado para cima devido a reducao da expressao do CaSR nas celulas paratireoideas. E preciso um calcio serico mais alto que o normal para suprimir o PTH. O eixo funciona, mas recalibrado em patamar hipercalcemico. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "ic",
    name: "Insuficiência Cardíaca",
    cards: [
      { q: "Qual a definição de insuficiência cardíaca?", a: "Síndrome clínica caracterizada por sintomas e sinais de sobrecarga volêmica e anormalidades da função ou estrutura cardíaca. Não é uma doença específica, mas uma síndrome resultante de um grupo heterogêneo de condições subjacentes." },
      { q: "Qual a mortalidade histórica da IC em 5 anos?", a: "Ultrapassa 50%, tornando o diagnóstico precoce e a terapia farmacológica otimizada as ferramentas mais impactantes para mudar a trajetória da doença." },
      { q: "Quais são os três sistemas compensatórios ativados na IC que perpetuam a doença a longo prazo?", a: "1) Sistema Renina-Angiotensina-Aldosterona (SRAA); 2) Sistema Nervoso Simpático (SNS); 3) Sistema dos Peptídeos Natriuréticos. Os dois primeiros são deletérios cronicamente; o terceiro é contra-regulatório protetor." },
      { q: "Como a angiotensina II contribui para a progressão da IC?", a: "Causa vasoconstrição intensa (aumento da pós-carga), estimula a liberação de aldosterona (retenção de Na e água, aumentando a pré-carga), e promove hipertrofia e fibrose miocárdica diretamente." },
      { q: "Quais os efeitos deletérios da aldosterona na IC?", a: "Retenção hidrossalina, fibrose miocárdica e vascular, depleção de potássio e magnésio (substrato arrítmico), e disfunção endotelial." },
      { q: "Por que os betabloqueadores, paradoxalmente, melhoram a função cardíaca na ICFEr?", a: "Cronicamente, protegem o miocárdio da toxicidade catecolaminérgica sustentada (necrose de miócitos, apoptose, fibrose), permitem upregulation dos receptores beta-1 dessensibilizados, reduzem consumo de O2 e risco arrítmico. O benefício leva semanas a meses para se manifestar." },
      { q: "Qual o mecanismo do sacubitril-valsartana (ARNI)?", a: "O sacubitril inibe a neprilisina, impedindo a degradação dos peptídeos natriuréticos (BNP, ANP) e potencializando vasodilatação, natriurese e inibição do remodelamento. A valsartana bloqueia o receptor AT1 da angiotensina II. É dupla modulação: suprime o eixo deletério e amplifica o protetor." },
      { q: "Quais são os cortes de FEVE para classificação da IC?", a: "ICFEr (HFrEF): FEVE <=40%. ICFEi (HFmrEF): FEVE 41-49%. ICFEp (HFpEF): FEVE >=50%." },
      { q: "Qual a diferença entre a classificação NYHA e os estágios ACCF/AHA na IC?", a: "A NYHA é funcional e flutua (pode melhorar com tratamento). Os estágios ACCF/AHA (A a D) são progressivos e irreversíveis — uma vez no estágio C, o paciente não retorna ao B, mesmo assintomático com tratamento." },
      { q: "Qual a sensibilidade e especificidade da dispneia para IC?", a: "Sensibilidade de 89% mas baixa especificidade de 51%. Nenhum sintoma isolado diagnostica ou exclui IC de forma confiável." },
      { q: "Qual a importância da B3 (terceira bulha) no diagnóstico de IC?", a: "Sensibilidade baixíssima (4-11%) mas especificidade de 99%. Se detectada, é quase certo que há pressões de enchimento elevadas. Porém, a variabilidade interobservador é enorme." },
      { q: "Qual o valor preditivo negativo do ECG normal para disfunção sistólica do VE?", a: "98%. Um ECG normal torna a disfunção sistólica do VE improvável. O ECG tem sensibilidade de 89% mas especificidade de 56% para ICFEr." },
      { q: "Quais os valores de BNP e NT-proBNP que ajudam a excluir IC no contexto agudo?", a: "No contexto agudo (ICAD): BNP <100 pg/mL e NT-proBNP <300 pg/mL ajudam a excluir IC. Na IC crônica compensada: BNP <35 pg/mL e NT-proBNP <125 pg/mL." },
      { q: "Por que em pacientes usando ARNI o NT-proBNP é o biomarcador preferencial?", a: "O sacubitril inibe a neprilisina, que degrada o BNP. Portanto, pacientes em ARNI têm elevação farmacológica do BNP que não reflete piora clínica. O NT-proBNP não é degradado pela neprilisina e não é afetado." },
      { q: "Por que a obesidade pode dificultar o diagnóstico de IC via peptídeos natriuréticos?", a: "A obesidade reduz os níveis de BNP/NT-proBNP (possivelmente pelo maior clearance pelo tecido adiposo), tornando o teste menos sensível. Pacientes obesos com ICFEp podem ter valores normais." },
      { q: "Quais os critérios diagnósticos de IC?", a: "Requer: (1) sintomas ou sinais característicos de IC, e (2) evidência objetiva de anormalidade estrutural ou funcional cardíaca em repouso ou ao exercício. Os sintomas devem ser razoavelmente atribuíveis à anormalidade cardíaca identificada." },
      { q: "O que significa o mnemônico CHAMPIT no diagnóstico diferencial de IC descompensada?", a: "Etiologias críticas de descompensação: Síndrome Coronariana Aguda, Emergência Hipertensiva, Arritmias, causas Mecânicas (rotura valvar, TEP, tamponamento), embolia Pulmonar, Infecção e Tamponamento." },
      { q: "Quais são os quatro pilares da terapia farmacológica de 1a linha na ICFEr?", a: "1) ARNI (sacubitril-valsartana) — preferido — ou IECA/BRA; 2) Betabloqueador (carvedilol, metoprolol succinato, bisoprolol); 3) Antagonista de mineralocorticoide (eplerenona ou espironolactona); 4) Inibidor de SGLT2 (dapagliflozina ou empagliflozina)." },
      { q: "Qual a redução estimada de mortalidade com a terapia quádrupla na ICFEr?", a: "Uma metanálise de rede estimou HR 0,39 (IC 95%: 0,31-0,49) para mortalidade por todas as causas, ou seja, redução de 61% versus placebo." },
      { q: "Qual o cuidado na transição de IECA para sacubitril-valsartana?", a: "Suspender o IECA e aguardar pelo menos 36 horas (washout) antes de iniciar sacubitril-valsartana, pelo risco de angioedema por dupla inibição de bradicinina. De BRA para ARNI não há necessidade de washout. Nunca usar IECA + ARNI simultaneamente." },
      { q: "Quais as doses iniciais e alvo de carvedilol na ICFEr?", a: "Dose inicial: 3,125 mg 2x/dia. Dose-alvo: <=85 kg: 25 mg 2x/dia; >85 kg: 50 mg 2x/dia. Tem bloqueio alfa-1 + beta, com maior efeito sobre PA, preferível se HAS associada." },
      { q: "Quais as doses iniciais e alvo de metoprolol succinato na ICFEr?", a: "Dose inicial: 12,5-25 mg 1x/dia. Dose-alvo: 200 mg 1x/dia. Beta-1 seletivo, menor efeito sobre PA." },
      { q: "Quais as doses iniciais e alvo de bisoprolol na ICFEr?", a: "Dose inicial: 1,25 mg 1x/dia. Dose-alvo: 10 mg 1x/dia. Beta-1 seletivo." },
      { q: "Quais os resultados do estudo RALES com espironolactona?", a: "1.663 pacientes, NYHA III-IV, FEVE <=35%. Espironolactona 25-50 mg vs placebo: redução de 30% na mortalidade total (RR 0,70; IC 95%: 0,60-0,82), redução de 35% na hospitalização por IC. Benefício evidente aos 3 meses." },
      { q: "Por que a eplerenona é preferida sobre a espironolactona como ARM na ICFEr?", a: "Menor risco de efeitos endócrinos: ginecomastia, mastalgia e impotência em homens ocorrem em 10% com espironolactona versus 1% com eplerenona." },
      { q: "Quais os critérios para iniciar ARM na ICFEr?", a: "K+ <5,0 mEq/L e TFGe >=30 mL/min/1,73 m2. Monitoramento rigoroso de K+ é obrigatório. Hipercalemia grave (K+ >6 mEq/L) ocorreu em 2-5,5% nos ensaios clínicos." },
      { q: "Quais os resultados do DAPA-HF com dapagliflozina?", a: "4.744 pacientes ICFEr: dapagliflozina 10 mg vs placebo. Desfecho composto (piora de IC ou morte CV) reduzido: 16,3% vs 21,2% (HR 0,74). Mortalidade total: 11,6% vs 13,9% (HR 0,83). O benefício é independente da presença de diabetes." },
      { q: "Quais os mecanismos de benefício dos inibidores de SGLT2 na IC?", a: "Além da natriurese osmótica: melhora da energética miocárdica (aumento de corpos cetônicos como substrato), redução de fibrose e inflamação, e efeitos hemodinâmicos favoráveis (redução de pré e pós-carga sem taquicardia reflexa)." },
      { q: "Qual a abordagem moderna para sequência de introdução dos 4 pilares na ICFEr?", a: "A tendência favorece iniciar todos os quatro pilares em 2-3 meses, priorizando a adição de novos agentes antes de maximizar a dose de cada um individualmente. A adição de um novo agente pode ter maior impacto na mortalidade do que alcançar a dose-alvo de um único." },
      { q: "O que o estudo TRED-HF mostrou sobre a retirada de terapia após recuperação da FEVE?", a: "51 pacientes com FEVE recuperada (de <40% para >=50%) randomizados para retirada ou manutenção: 44% do grupo retirada tiveram recidiva em 6 meses vs 0% na manutenção. A terapia deve ser mantida indefinidamente mesmo com FEVE normalizada." },
      { q: "Qual a conduta diante de hipercalemia (K+ 5,5-6,0 mEq/L) em paciente usando ARM?", a: "Reduzir dose (espironolactona de 50 para 25 mg/dia ou de 25 para 12,5 mg/dia). Se K+ >6,0 mEq/L ou piora de função renal: suspender ARM e manejar hipercalemia. Revisar dieta, suspender suplementos de K+ e AINEs." },
      { q: "Qual a conduta se houver piora de IC durante titulação de betabloqueador?", a: "Tratar com aumento de diurético antes de considerar redução do betabloqueador. Não suspender BB abruptamente. Orientar paciente sobre pesagem diária — ganho >1-1,5 kg em 3+ dias sugere retenção hídrica." },
      { q: "Quando suspender SGLT2i antes de cirurgias e por quê?", a: "Suspender 3 dias antes de cirurgias pela possibilidade de cetoacidose euglicêmica. Dose fixa (sem titulação). Cautela se eGFR <20 mL/min/1,73 m2." },
      { q: "Qual a conduta diante de angioedema por IECA?", a: "Suspender definitivamente. Contraindicação absoluta para reintrodução de IECA. Trocar para BRA (risco de angioedema com BRA não confirmado como significativo)." },
      { q: "O que significa ortopneia na IC e quais sua sensibilidade e especificidade?", a: "Dispneia ao deitar, causada por redistribuição de volume para o tórax em decúbito. Sensibilidade de 44% e especificidade de 89% — mais específica que a dispneia isolada." },
      { q: "Qual a sensibilidade e especificidade da radiografia de tórax para IC?", a: "Sensibilidade 68%, especificidade 83%. Não confirma nem exclui IC isoladamente. O edema pulmonar tem baixa sensibilidade (6-27%) mas alta especificidade (>98%)." },
      { q: "Quais achados radiográficos sugerem ICAD?", a: "Cefalização de vasos, linhas B de Kerley, edema pulmonar (intersticial ou alveolar peri-hilar), derrame pleural e cardiomegalia (relação cardiotorácica >50%)." },
      { q: "O que é bendopneia e qual seu mecanismo?", a: "Dispneia ao inclinar-se para frente. Mecanismo: compressão abdominal eleva o retorno venoso em coração não complacente, aumentando as pressões de enchimento. Sensibilidade e especificidade não estabelecidas." },
      { q: "No ultrassom pulmonar, o que indica síndrome intersticial pulmonar?", a: "Presença de múltiplas linhas B (>=3 por espaço intercostal) bilateralmente sugere síndrome intersticial pulmonar, compatível com congestão." },
      { q: "Para quais pacientes se aplica a terapia quádrupla da ICFEr?", a: "Pacientes com ICFEr (FEVE <=40%) nas classes NYHA II a III (estágio C). Os ensaios pivotais incluíram predominantemente NYHA II-III. NYHA IV e estágio D são abordagens distintas." },
      { q: "Por que a IC compensada pode ter exame físico normal?", a: "A adaptação crônica às pressões elevadas reduz a percepção sintomática. Pacientes com IC crônica compensada frequentemente têm exame físico normal. A ausência de achados ao exame não exclui IC." },
      { q: "Qual o papel do POCUS na avaliação da IC?", a: "Permite avaliação qualitativa da função sistólica do VE, presença de derrame pericárdico, dilatação da VCI e, na ultrassonografia pulmonar, identificação de linhas B (edema intersticial). Adjunto quando ecocardiografia formal indisponível." },
      { q: "O que o ecocardiograma permite avaliar na IC?", a: "Medir a FEVE (classificando o tipo de IC), avaliar disfunção diastólica, identificar valvopatias, detectar hipertensão pulmonar e avaliar a função do VD. É o exame-chave no diagnóstico de IC." },
      { q: "Quais condições causam IC e devem elevar a suspeita clínica?", a: "Obesidade, idade avançada, FA, doença coronariana, IAM recente, HAS de longa data, doença valvar, cardiomiopatias, quimioterapia com antraciclinas, uso de cocaína/álcool/metanfetamina, infecção viral recente em jovem, e história familiar de IC." },
      { q: "Qual a conduta diante de hipotensão sintomática em paciente com ICFEr em uso de ARNI e BB?", a: "Verificar euvolemia (reduzir diurético se não congesto). Suspender outros hipotensores não essenciais. Reduzir dose dos agentes apenas se sinais de hipoperfusão. Tolerar PA baixa assintomática." },
      { q: "Qual a conduta diante de ginecomastia por espironolactona?", a: "Trocar para eplerenona, que apresenta apenas 1% de efeitos endócrinos vs 10% com espironolactona." },
      { q: "Quais as diferenças entre os resultados do DAPA-HF e do EMPEROR-Reduced?", a: "DAPA-HF demonstrou redução significativa de mortalidade total e CV. EMPEROR-Reduced não atingiu significância para mortalidade isoladamente (HR 0,92; IC 0,75-1,12 para morte CV). A metanálise pooled dos dois mostrou reduções significativas (HR 0,87). A diferença pode refletir poder estatístico, não diferença real de efeito. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "ira",
    name: "Injúria Renal Aguda (IRA)",
    cards: [
      { q: "Qual a incidência de IRA em pacientes hospitalizados e em UTI?", a: "5-10% de todos os internados e até 50-70% dos pacientes em UTI. Desses, 10-20% necessitarão de suporte renal artificial. A mortalidade intra-hospitalar permanece entre 20-50%." },
      { q: "O que é o 'triple whammy' na IRA pré-renal?", a: "Combinação de diuréticos + inibidores do SRAA + AINEs. AINEs impedem a vasodilatação da aferente (prostaglandinas); IECA/BRA impedem a vasoconstricção da eferente (angiotensina II); diuréticos reduzem volume intravascular. Resultado: aumento de 60% no risco de IRA." },
      { q: "Por que estados hipervolêmicos (ICC, cirrose, síndrome nefrótica) podem causar IRA pré-renal?", a: "Apesar da hipervolemia total, há redução do volume arterial efetivo, causando queda da perfusão renal pelo mesmo mecanismo. Esses pacientes NÃO devem receber expansão volêmica agressiva." },
      { q: "Quais células tubulares são mais vulneráveis à NTA isquêmica e por quê?", a: "Células do segmento S3 do túbulo proximal e do ramo ascendente espesso da alça de Henle, por terem alta demanda metabólica e residirem em regiões de baixa PO2 (medula renal)." },
      { q: "Quais os critérios KDIGO para IRA estágio 1?", a: "Creatinina: aumento >=0,3 mg/dL em 48h OU 1,5-1,9x o basal em 7 dias. Diurese: <0,5 mL/kg/h por 6-12h. Conduta: remover nefrotóxicos, reavaliar volemia, ajustar antibióticos." },
      { q: "Quais os critérios KDIGO para IRA estágio 3?", a: "Creatinina: >=3x o basal OU Crs >=4 mg/dL OU início de SRA. Diurese: <0,3 mL/kg/h por >=24h OU anúria >=12h. Alta probabilidade de necessidade de suporte renal; acionar nefrologia imediatamente." },
      { q: "Quais os valores de FENa e FEUreia que diferenciam IRA pré-renal de NTA?", a: "IRA pré-renal: FENa <1%, FEUreia <35%, Na urinário <20, osmolaridade >500 mOsm/L. NTA: FENa >3%, FEUreia >35%, Na urinário >40, osmolaridade ~300 mOsm/L. Porém, na sepse a FENa pode ser <1% mesmo com NTA." },
      { q: "Por que a FEUreia é mais confiável que a FENa em pacientes usando diuréticos?", a: "Diuréticos elevam a FENa falsamente (inibem reabsorção de sódio), tornando-a inútil para diferenciar IRA pré-renal de NTA. A FEUreia é menos afetada por diuréticos." },
      { q: "Qual a peculiaridade mecanística da IRA na leptospirose?", a: "Caracteristicamente não oligúrica e com hipocalemia — oposto da maioria das IRAs. O dano tubular proximal é tão intenso que impede reabsorção de Na e água (poliúria) e causa perda de K. FENa elevada. Achado histológico: nefrite intersticial aguda, não NTA." },
      { q: "Qual o tratamento da leptospirose com IRA?", a: "Penicilina 1,5 milhão UI EV 6/6h (primeira linha). Alternativas: ampicilina, ceftriaxona. Profilaxia pós-exposição: doxiciclina 200 mg VO 1x/semana. Estudos sugerem benefício de diálise precoce e diária." },
      { q: "Quais as fases do manejo volêmico na IRA (mnemônico SOSD)?", a: "S-Salvação: expansão ~30 mL/kg de SF + vasopressores se hipotensão. O-Otimização: bolus de 100-200 mL com avaliação de resposta (POCUS). S-Estabilização: interromper ressuscitação, evitar BH excessivo. D-Descalonamento: negativar BH com diuréticos ou diálise." },
      { q: "Qual o limite de balanço hídrico cumulativo a ser evitado na IRA?", a: "BH >8-10% do peso corporal deve ser evitado. Um estudo brasileiro mostrou que cada 100 mL de aumento no BH aumenta em 4% a razão de chance de IRA, precedendo a elevação da creatinina em 4 dias." },
      { q: "Como funciona o teste de estresse da furosemida e qual sua acurácia?", a: "Furosemida 1 mg/kg IV (ou 1,5 mg/kg se uso prévio). Resposta <200 mL em 2h prediz progressão para estágio 3 com sensibilidade de 84% e especificidade de 87%. Superou NGAL, KIM-1 e NephroCheck na predição de necessidade de diálise." },
      { q: "Por que a creatinina normal não exclui IRA grave no paciente séptico?", a: "Na sepse, a metabolização da creatinina está alterada e a hiper-hidratação dilui os solutos. A creatinina só se eleva quando ~50% da função renal já está perdida. Anúria por >=12h preenche critério KDIGO estágio 3 independente da creatinina." },
      { q: "Como prevenir nefrotoxicidade por aminoglicosídeos?", a: "Dose única diária (reduz acúmulo tubular via megalina). Monitorar nível sérico. Evitar associação com vancomicina. Maior risco com oligúria e DRC prévia." },
      { q: "Como prevenir nefrotoxicidade por anfotericina B?", a: "Formulação lipossômica. Expansão com 1L SF 0,9% pré-infusão. Dose <0,5 mg/kg/dia. Dose cumulativa >4g causa dano tubular irreversível. Causa hipocalemia característica e acidose tubular tipo 1." },
      { q: "Qual o protocolo de prevenção de nefrotoxicidade por cisplatina em dose >100 mg/m2?", a: "Hidratação com SF 0,9% (100 mL/h 2h pré e pós). Reposição de Mg (hipomagnesemia em ~100% após 6 ciclos). Considerar manitol. Medir creatinina no D5. IRA não oligúrica em 20-30%. Pico Crs D5-D10." },
      { q: "Qual a prevenção de nefrotoxicidade por contraste iodado?", a: "Em pacientes de alto risco: expansão com SF 0,9% (3 mL/kg na hora pré-exame, 1,5 mL/kg/h nas 6h pós). Contraste hipo/isosmolar no menor volume. Suspender AINEs, aminoglicosídeos e metformina (reiniciar após 48h). NÃO há benefício com hemodiálise pós-exposição." },
      { q: "Quais os mecanismos da IRA na rabdomiólise?", a: "A mioglobina causa: (1) obstrução tubular por cilindros (especialmente em pH ácido); (2) toxicidade direta por radicais livres de ferro; (3) vasoconstricção renal. Adicionalmente, sequestro de líquido pelo músculo lesado causa depleção volêmica." },
      { q: "Qual o tratamento da IRA na rabdomiólise?", a: "Expansão volêmica precoce e agressiva (débito urinário 200-300 mL/h). Alcalinização com bicarbonato é controversa — só considerar se pH <7,5, bicarbonato <30 e sem hipocalcemia (meta: pH urinário >6,5). Manitol e diuréticos NÃO demonstraram benefício." },
      { q: "O que é a SHR-AKI e quais seus critérios?", a: "Síndrome Hepatorrenal-AKI: IRA funcional em cirrose avançada, sem lesão estrutural renal. Critérios: aumento de creatinina >=0,3 mg/dL em 48h ou >=50% em 7 dias. Mecanismo: vasodilatação esplâncnica extrema com vasoconstricção renal intensa." },
      { q: "Qual o tratamento de primeira escolha da SHR-AKI?", a: "Terlipressina + albumina. Terlipressina: bolus 0,5-1 mg IV 4-6/6h ou infusão contínua 2 mg/dia. Albumina: 1 g/kg D1 (máx 100g), depois 20-40 g/dia. Reversão em 20-35%. Infusão contínua reduz efeitos adversos (isquemia cardíaca, intestinal)." },
      { q: "Por que a terlipressina funciona na SHR-AKI?", a: "Análogo da vasopressina que age nos receptores V1 esplâncnicos, causando vasoconstricção esplâncnica seletiva. Redistribui sangue do leito esplâncnico para circulação sistêmica, aumentando volume arterial efetivo e perfusão renal. Preditores de resposta: bilirrubina <10, aumento de PAM >=5 mmHg em 72h." },
      { q: "Quais as indicações clássicas de suporte renal artificial na IRA?", a: "Hipervolemia refratária, hipercalemia refratária, acidose metabólica refratária, sinais de uremia (sangramentos, encefalopatia). NÃO há benefício em iniciar diálise precocemente (STARRT-AKI, AKIKI)." },
      { q: "O que os estudos STARRT-AKI e AKIKI mostraram sobre diálise precoce vs tardia?", a: "Diálise precoce NÃO reduz mortalidade e aumenta infecção de cateter. No AKIKI, 49% do grupo tardio nunca precisou dialisar. Porém, diálise muito tardia (>72h de oligúria ou ureia >240 no AKIKI-2) também é prejudicial. O momento ideal é guiado pela trajetória clínica." },
      { q: "Quando preferir métodos contínuos (CVVH/CVVHD/CVVHDF) sobre hemodiálise intermitente na IRA?", a: "Em instabilidade hemodinâmica, edema cerebral (IH, disnatremias, doença neurocrítica), SDRA com PaO2/FiO2 <200. Dose efluente: 30-35 mL/kg/h (para dose efetiva 20-25). Fluxo sangue: 100-200 mL/min." },
      { q: "Qual a anticoagulação preferencial nos métodos contínuos de diálise?", a: "Citrato regional é a opção preferencial nos métodos contínuos. Heparina não fracionada ou HBPM nos intermitentes. Na diálise peritoneal, heparina nas bolsas (500-1000 UI/L)." },
      { q: "Quais são as drogas mais frequentemente causadoras de IRA e qual a proporção?", a: "Drogas são a 2a causa mais frequente de IRA, respondendo por 25% dos casos em hospitalizados e até 60% em idosos. A maioria das nefrotoxicidades envolve o túbulo proximal (maior atividade de transporte ativo e acúmulo intracelular)." },
      { q: "Qual a conduta com inibidores de checkpoint imunológico que causam IRA?", a: "NIA imunomediada em 2-17% dos pacientes, ocorrendo 3-12 meses após início. Corticoide: prednisona 0,5-1 mg/kg se IRA G2; pulso se G3-G4. Biópsia se sem resposta." },
      { q: "Quais os efeitos adversos e cuidados com vancomicina na IRA?", a: "Acúmulo intracelular no túbulo proximal com estresse oxidativo. Elevação de Crs entre D4-D17. Dose >4 g/dia e >14 dias aumentam risco. Monitorar nível sérico a cada 48h em críticos (vale 15-20 mcg/mL). Hidratar com SF 0,9%." },
      { q: "Qual o melhor preditor clínico de recuperação da função renal após IRA?", a: "A diurese é o melhor preditor clínico. Responsividade a furosemida (>200 mL em 2h) indica lesão tubular limitada e chance de recuperação alta. Biomarcadores e keGFR são promissores mas sem validação robusta." },
      { q: "Qual o seguimento recomendado pós-IRA grave?", a: "Acompanhamento nefrológico, avaliação periódica de função renal e microalbuminúria, IECA/BRA e iSGLT2 como potenciais agentes de nefroproteção, evitar nefrotóxicos desnecessários. A IRA confere risco permanente de DRC e mortalidade cardiovascular." },
      { q: "Qual a diferença entre nefropatia associada ao contraste e nefropatia induzida por contraste?", a: "Associada: qualquer IRA em 48h após exposição ao contraste (pode ou não ser causal). Induzida: certeza de causalidade. A primeira terminologia é mais adequada na maioria dos casos, pois é difícil excluir causas concomitantes." },
      { q: "Quais os achados no sedimento urinário que sugerem NTA?", a: "Cilindros granulosos pigmentados e células epiteliais. Fita urinária positiva para sangue sem hemácias na microscopia sugere pigmentos (mioglobina/hemoglobina). Cilindros hialinos sugerem IRA pré-renal." },
      { q: "Quando indicar transplante combinado fígado-rim na SHR?", a: "Se TFG <25 mL/min/1,73 m2 ou necessidade de SRA por >6 semanas. O conceito de safety-net (OPTN 2018) prioriza transplante renal para pacientes com TFG <20 entre 30-365 dias após transplante hepático isolado." },
      { q: "Qual o biomarcador de IRA aprovado pelo FDA e qual sua utilidade?", a: "O [TIMP-2]x[IGFBP-7] (NephroCheck), AUROC de 0,80 para predição de IRA em 12h. Porém, nos estudos de implementação, reduziu incidência de IRA mas NÃO reduziu mortalidade ou necessidade de diálise — dissociação entre desfecho substituto e desfecho clínico." },
      { q: "Quais cuidados com metotrexato em dose alta (>1000 mg/m2) para prevenção de IRA?", a: "Alcalinização urinária (pH >7), hidratação 3L/24h, resgate com ácido folínico. Precipitação intratubular favorecida por pH ácido. IRA em 1,5-3%, que potencializa toxicidade sistêmica por acúmulo." },
      { q: "Qual a diferença mecanística entre a hipocalemia da anfotericina B e da leptospirose?", a: "Anfotericina B: forma poros nas membranas tubulares distais (interação com ergosterol/colesterol), causando vazamento de K e Mg. Gera acidose tubular tipo 1. Leptospirose: dano tubular PROXIMAL com falha de reabsorção de Na, levando a aumento de aporte distal e secreção compensatória de K." },
      { q: "Qual a IRA mais comum e qual a causa mais comum de IRA intrínseca?", a: "IRA pré-renal corresponde a ~21% dos casos. NTA (necrose tubular aguda) é a IRA intrínseca mais comum, correspondendo a 45% de todos os casos de IRA. A sepse é a principal causa de IRA no Brasil e no mundo." },
      { q: "Qual a taxa de ultrafiltracao efetiva recomendada na diálise contínua?", a: "Entre 1,01-1,75 mL/kg/h. Valores fora dessa faixa associam-se com maior mortalidade em estudos observacionais. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]

  {
    id: "litiase",
    name: "Litíase Renal",
    cards: [
      { q: "Qual a prevalência da litíase renal nos EUA e qual o risco de recorrência?", a: "Afeta quase 1 em cada 11 pessoas ao longo da vida, com prevalência subindo ~70% em três décadas. Pelo menos metade dos pacientes recorre em 10 anos após o primeiro episódio." },
      { q: "Quais doenças sistêmicas estão associadas à litíase renal?", a: "Obesidade, hipertensão arterial e diabetes mellitus. A causalidade não está estabelecida, mas a associação é robusta. Reforça tratar o paciente litiásico como metabólico, não apenas urológico." },
      { q: "Quais exames compõem a triagem inicial de todo paciente com nefrolitíase?", a: "História médica e dietética detalhada, bioquímica sérica (eletrólitos, cálcio, creatinina, ácido úrico) e urinálise (EAS). Urocultura se EAS sugerir ITU." },
      { q: "Quando solicitar PTH intacto no paciente com litíase renal?", a: "Quando há suspeita de hiperparatireoidismo primário, ou seja, cálcio sérico alto ou normal-alto. Hipercalciúria por excesso de PTH é via clássica de litogênese." },
      { q: "Quem deve realizar avaliação metabólica com urina de 24h na litíase renal?", a: "Formadores recorrentes de cálculo e formadores de primeiro episódio de alto risco ou interessados (Grau B). Preferir 2 coletas em dieta habitual. Parâmetros: volume, pH, cálcio, oxalato, ácido úrico, citrato, sódio, potássio, creatinina." },
      { q: "Qual a meta de volume urinário para prevenção de litíase renal?", a: ">=2,5 litros/dia. Volume urinário é o principal determinante da concentração dos fatores litogênicos. É a única medida universal, válida para todos os tipos de cálculo." },
      { q: "Por que o cálcio dietético (alimentar) reduz o risco de cálculo, enquanto suplementos de cálcio podem aumentar?", a: "O cálcio ingerido junto às refeições se liga ao oxalato no lúmen intestinal, formando complexo insolúvel eliminado nas fezes, reduzindo a oxalatúria. Suplementos tomados fora das refeições não fazem essa quelação e apenas aumentam a calciúria." },
      { q: "Qual a ingesta recomendada de cálcio dietético para pacientes com litíase?", a: "1000-1200 mg/dia (normal, não restrito). Um RCT mostrou 51% menos recorrência com dieta normocalcêmica (1200 mg/dia) + restrição de Na e proteína animal vs dieta hipocalcêmica (400 mg/dia)." },
      { q: "Por que restringir sódio na litíase cálcica?", a: "Sódio e cálcio competem pelo mesmo transportador de reabsorção no túbulo proximal. Mais sódio filtrado = menos reabsorção tubular de cálcio = mais calciúria. Meta: <=100 mEq/dia (2300 mg)." },
      { q: "Qual a indicação de tiazídicos na litíase renal e qual o mecanismo?", a: "Indicados quando há hipercalciúria e cálculos cálcicos recorrentes (Grau B). Aumentam a reabsorção tubular distal de cálcio, reduzindo a calciúria. Doses: HCTZ 25 mg 2x/dia ou 50 mg/dia, clortalidona 25 mg/dia, indapamida 2,5 mg/dia." },
      { q: "Qual o principal efeito colateral dos tiazídicos na litíase e como manejar?", a: "Hipocalemia e depleção de potássio. Suplementar com citrato ou cloreto de potássio, ou associar amilorida/espironolactona. Evitar triantereno — associado à formação de cálculo do próprio composto. Manter restrição de sódio para potencializar o efeito." },
      { q: "Qual o mecanismo do citrato de potássio na prevenção de litíase cálcica?", a: "Citrato quela cálcio livre na urina, formando complexo solúvel, inibindo nucleação e crescimento de cristais de oxalato e fosfato de cálcio. Preferir citrato de potássio sobre citrato de sódio (a carga de sódio pode aumentar a calciúria)." },
      { q: "Qual a indicação de alopurinol na litíase renal?", a: "Indicado para cálculo de oxalato de cálcio recorrente + hiperuricosúria (>800 mg/dia) + calciúria NORMAL (Grau B). Cristais de ácido úrico servem de núcleo para heteronucleação de cristais de oxalato de cálcio. Não é necessário ter hiperuricemia sérica." },
      { q: "Qual o erro conceitual mais comum sobre cálculos de ácido úrico?", a: "Assumir que cálculo de ácido úrico = hiperuricosúria. A maioria dos pacientes tem uricosúria normal — o fator de risco dominante é o pH urinário cronicamente baixo (ácido), não a quantidade de ácido úrico excretada." },
      { q: "Qual o tratamento de primeira linha para cálculos de ácido úrico?", a: "Alcalinização com citrato de potássio, meta de pH urinário 6,0. Alopurinol NÃO é primeira linha (diferente do cálculo de oxalato de cálcio com hiperuricosúria). Reduzir ácido úrico não resolve se a urina continuar ácida." },
      { q: "Qual a fisiopatologia da cistinúria e quais os degraus terapêuticos?", a: "Erro inato do transporte tubular de aminoácidos dibásicos (COLA: cistina, ornitina, lisina, arginina). Degrau 1: hidratação >=4L/dia + restrição de Na e proteína. Degrau 2: alcalinização com citrato de potássio (pH alvo 7,0). Degrau 3: tiopronina (preferida sobre D-penicilamina)." },
      { q: "Por que a meta de pH urinário é diferente entre cistina (7,0) e ácido úrico (6,0)?", a: "A cistina é ainda menos solúvel em pH ácido que o ácido úrico, exigindo pH mais alto para manter a solubilidade." },
      { q: "Como se formam os cálculos de estruvita e qual o tratamento?", a: "Formados por ITU com organismo produtor de urease (ex: Proteus), que hidrolisa ureia em amônia, alcalinizando a urina e precipitando fosfato de amônio-magnésio. Tratamento: remoção cirúrgica completa. AHA (inibidor de urease) apenas como último recurso." },
      { q: "Por que o ácido acetohidroxâmico (AHA) é reservado como último recurso nos cálculos de estruvita?", a: "Perfil extenso de efeitos adversos: anemia hemolítica, eventos tromboembólicos e sintomas neurológicos. Reservado apenas para cálculo residual/recorrente após esgotadas as opções cirúrgicas." },
      { q: "Como diferenciar hiperoxalúria dietética de hiperoxalúria entérica?", a: "Dietética: consumo excessivo de alimentos ricos em oxalato, tratar com restrição de oxalato + cálcio normal. Entérica: má absorção intestinal (DII, bypass gástrico); saponificação de ácidos graxos sequestra cálcio, deixando oxalato livre para absorção. Pode necessitar de suplemento de cálcio junto às refeições." },
      { q: "Quando suspeitar de hiperoxalúria primária?", a: "Quando excreção de oxalato >75 mg/dia em adultos SEM doença intestinal. Essa diferenciação é a chave — distingue da hiperoxalúria entérica." },
      { q: "Qual a nefrocalcinose e o que ela implica?", a: "Calcificação do parênquima renal (não apenas cálculos na via excretora). É achado de alarme que implica doença metabólica sistêmica: acidose tubular renal tipo 1, hiperparatireoidismo primário, hiperoxalúria primária, ou rim em esponja medular." },
      { q: "Qual o protocolo de seguimento (follow-up) na litíase renal?", a: "Urina de 24h dentro de 6 meses do início do tratamento, depois anual. Bioquímica sérica periódica em quem usa fármacos. Imagem (Rx, USG ou TC dose baixa) anual em pacientes estáveis. Repetir análise do cálculo se não houver resposta ao tratamento." },
      { q: "Quais efeitos adversos monitorar por classe farmacológica na litíase?", a: "Tiazídicos: hipocalemia, intolerância à glicose. Alopurinol/tiopronina: elevação de enzimas hepáticas. AHA/tiopronina: anemia e alterações hematológicas. Citrato de potássio: hipercalemia." },
      { q: "Quais bebidas são associadas a menor risco de litíase?", a: "Café, chá, vinho, suco de laranja e álcool (dados observacionais). Bebidas açucaradas são associadas a maior risco." },
      { q: "Qual a orientação dietética para cálculo cálcico com hipocitratúria?", a: "Aumentar frutas e vegetais (fontes de citrato) e limitar proteína animal não-láctea. Dietas ricas em proteína animal causam acidose metabólica que aumenta a reabsorção renal de citrato, reduzindo sua excreção urinária." },
      { q: "Por que a vitamina C pode ser problemática na litíase renal?", a: "O ácido ascórbico é metabolizado parcialmente a oxalato, podendo elevar a oxalatúria e aumentar o risco de cálculos de oxalato de cálcio." },
      { q: "Por que não se deve fazer teste de sobrecarga de cálcio rotineiramente na litíase?", a: "O fast and calcium load test para diferenciar subtipos de hipercalciúria (absortiva vs renal) não deve ser feito rotineiramente (Grau C) porque não muda a conduta clínica, apesar de ser fisiologicamente interessante." },
      { q: "Quando a análise da composição do cálculo é obrigatória?", a: "Sempre que disponível, pelo menos uma vez. Cálculos de ácido úrico, cistina ou estruvita indicam anormalidades metabólicas ou genéticas específicas e mudam diretamente a conduta preventiva." },
      { q: "Qual a meta de volume urinário para pacientes com cistinúria?", a: ">=4 litros/dia (maior que os demais formadores), com objetivo de manter concentração urinária de cistina <250 mg/L, abaixo do limiar de solubilidade." },
      { q: "Qual o mecanismo da tiopronina no tratamento da cistinúria?", a: "Forma dissulfeto misto com a cistina, muito mais solúvel que a cistina-cistina homodimérica original. Preferida sobre D-penicilamina por melhor perfil de efeitos adversos." },
      { q: "Qual o papel do alopurinol no cálculo de ácido úrico puro?", a: "Alopurinol NÃO é primeira linha para cálculo de ácido úrico. O problema é o pH baixo, não a quantidade de ácido úrico. Mesmo pequenas quantidades cristalizam em pH baixo. A primeira linha é alcalinização com citrato de potássio." },
      { q: "Se nenhuma anormalidade metabólica é identificada e a litíase persiste, qual a conduta farmacológica?", a: "Tiazídico e/ou citrato de potássio permanecem a base do tratamento (Grau B). Na ausência de qualquer anormalidade identificável, citrato de potássio é preferido como primeira linha, pelo perfil de efeitos colaterais mais favorável." },
      { q: "Qual a reducao de recorrencia demonstrada no RCT com dieta normocalcemica na litiase renal?", a: "Um RCT de 5 anos mostrou 51% menos recorrencia com dieta normocalcemica (1200 mg/dia de calcio) + restricao de sodio e proteina animal, comparada a dieta hipocalcemica (400 mg/dia). Demonstra que calcio dietetico protege, nao prejudica." },
      { q: "Qual a meta de sodio na dieta para prevencao de litiase renal e qual o mecanismo?", a: "Meta: <= 100 mEq/dia (2300 mg). Mecanismo: sodio e calcio competem pelo mesmo transportador de reabsorcao no tubulo proximal renal. Mais sodio filtrado = menos reabsorcao tubular de calcio = mais calciuria. Restricao de sodio potencializa efeito hipocalciurico dos tiazidicos." },
      { q: "Quais as doses hipocalciuricas dos tiazidicos na litiase renal?", a: "Hidroclorotiazida 25 mg 2x/dia (ou 50 mg 1x/dia), clortalidona 25 mg 1x/dia, ou indapamida 2,5 mg 1x/dia. Indicados quando ha hipercalciuria e calculos calcicos recorrentes. Sempre manter restricao de sodio concomitante." },
      { q: "Por que o triantereno e contraindicado na litiase renal?", a: "Triantereno esta associado a formacao de calculos do proprio composto (calculos de triantereno). Outros poupadores de potassio como amilorida e espironolactona podem ser usados para manejar hipocalemia induzida por tiazidicos." },
      { q: "O que e o mnemonico COLA na cistinuria?", a: "COLA representa os 4 aminoacidos dibasicos cujo transporte tubular esta defeituoso na cistinuria: Cistina, Ornitina, Lisina e Arginina. E um erro inato do transporte tubular que leva a excrecao excessiva de cistina, pouco soluvel na urina." },
      { q: "Qual o mecanismo de saponificacao na hiperoxaluria enterica?", a: "Na ma absorcao intestinal, acidos graxos livres em excesso 'sequestram' o calcio luminal por saponificacao (formacao de saboes de calcio). O calcio que deveria se ligar ao oxalato fica indisponivel, deixando o oxalato livre para ser absorvido em excesso, causando hiperoxaluria." },
      { q: "Qual a diferenca entre hiperoxaluria enterica e dietetica na abordagem terapeutica?", a: "Dietetica: reduzir alimentos ricos em oxalato + manter calcio normal da dieta. Enterica (DII, bypass gastrico): restricao de oxalato MAIS calcio dietético mais alto, inclusive suplementar junto as refeicoes para maximizar quelacao intestinal de oxalato. A logica se INVERTE parcialmente." },
      { q: "Quando suspeitar de hiperoxaluria primaria?", a: "Quando excrecao de oxalato >75 mg/dia em adultos SEM doenca intestinal. O 'sem doenca intestinal' e a chave para diferenciar da hiperoxaluria enterica. E uma doenca genetica rara que exige investigacao especifica." },
      { q: "Qual o protocolo de coleta de urina de 24h na litiase renal?", a: "1 a 2 coletas em dieta habitual (nao restrita — capturar padrao real). Duas coletas preferidas (maior confiabilidade). Parametros minimos: volume total, pH, calcio, oxalato, acido urico, citrato, sodio, potassio, creatinina. Adicionar cistina se calculo de cistina ou suspeita de cistinuria." },
      { q: "Qual a meta de volume urinario para pacientes com cistinuria e por que e diferente?", a: "Meta: >= 4 litros/dia (versus >= 2,5 L/dia para os demais). Objetivo: manter concentracao urinaria de cistina <250 mg/L, abaixo do limiar de solubilidade. A cistina e muito pouco soluvel e requer diluicao ainda maior." },
      { q: "Qual o mecanismo da tiopronina no tratamento da cistinuria?", a: "Tiopronina (alfa-mercaptopropionilglicina) forma dissulfeto misto com a cistina, criando um complexo muito mais soluvel que a cistina-cistina homodimerica original. E preferida sobre D-penicilamina por melhor perfil de efeitos adversos." },
      { q: "Qual o papel do alopurinol no calculo de acido urico PURO vs calculo de oxalato de calcio?", a: "No calculo de acido urico puro: alopurinol NAO e primeira linha (o problema e pH baixo, nao excesso de acido urico). No calculo de oxalato de calcio com hiperuricosuria: alopurinol E indicado (cristais de acido urico servem como nucleo para heteronucleacao do oxalato de calcio)." },
      { q: "Por que citrato de potassio e preferido sobre citrato de sodio na hipocitraturia?", a: "A carga de sodio do citrato de sodio pode aumentar a calciuria (sodio e calcio competem pelo mesmo transportador tubular), anulando o beneficio. O citrato de potassio nao tem esse efeito e ainda corrige a hipocalemia que pode acompanhar o uso de tiazidicos." },
      { q: "Qual o mecanismo pelo qual a restricao de sodio reduz a excrecao de cistina?", a: "Sodio e cistina compartilham mecanismos de cotransporte no tubulo renal. A restricao de sodio reduz diretamente a excrecao de cistina por esse mecanismo compartilhado, alem de reduzir calciuria." },
      { q: "Quais as bebidas associadas a menor risco de litiase renal?", a: "Cafe, cha, vinho, suco de laranja e alcool sao associados a menor risco (dados observacionais, nao RCT). Bebidas acucaradas sao associadas a MAIOR risco. O principal mecanismo protetor e o aumento do volume urinario." },
      { q: "Qual o protocolo de seguimento com urina de 24h na litiase renal?", a: "Primeira coleta: dentro de 6 meses do inicio do tratamento (avaliar resposta inicial). Depois: anual ou mais frequente conforme atividade da doenca. Bioquimica serica periodica para quem usa farmacos (detectar efeitos adversos)." },
      { q: "Quais os efeitos adversos a monitorar por classe farmacologica na litiase (Grau A)?", a: "Tiazidicos: hipocalemia e intolerancia a glicose. Alopurinol/tiopronina: elevacao de enzimas hepaticas. AHA/tiopronina: anemia e alteracoes hematologicas. Citrato de potassio: hipercalemia. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]

  {
    id: "nefrite",
    name: "Nefrite Intersticial Aguda",
    cards: [
      { q: "Qual a premissa fisiopatológica fundamental da NIA?", a: "A NIA não é toxicidade, é hipersensibilidade. É uma resposta imune mediada por linfócitos T, não humoral. Isso explica a ausência de relação dose-resposta, a latência de ~10 dias, a aceleração na reexposição (3-5 dias) e as manifestações sistêmicas de hipersensibilidade." },
      { q: "Qual a proporção de NIA entre as biópsias renais realizadas por IRA?", a: "13 a 19% das biópsias por IRA. A NIA é a única causa frequente de IRA intrínseca potencialmente reversível apenas retirando algo (o fármaco causador), mas torna-se irreversível se o diagnóstico demorar." },
      { q: "Qual a principal causa de NIA e em que proporção?", a: "Fármacos respondem por 70-75% dos casos. Antibióticos são responsáveis por 30-50% desse subgrupo. É a única categoria em que a intervenção terapêutica (retirada) é gratuita, imediata e disponível em qualquer serviço." },
      { q: "Qual a frequência da tríade clássica rash + febre + eosinofilia na NIA?", a: "A tríade completa está presente em apenas 10-11% dos pacientes. Individualmente: rash 15-22%, febre 27-36%, eosinofilia 23-35%. Usar a ausência dessa tríade para descartar NIA elimina ~90% dos pacientes com a doença." },
      { q: "Por que a TFG cai na NIA se o glomérulo é histologicamente normal?", a: "Três mecanismos: (1) Compressão mecânica: edema e infiltrado intersticial dentro da cápsula inextensível elevam pressão na cápsula de Bowman; (2) Obstrução tubular: cilindros leucocitários obstruem lúmens; (3) Retroalimentação tubuloglomerular: mácula densa detecta carga distal aumentada de NaCl e promove vasoconstricção aferente." },
      { q: "Por que a NIA é reversível?", a: "Porque o dano dominante é funcional (edema, compressão, vasoconstricção), não estrutural — a arquitetura renal está intacta. Remover o antígeno desfaz tudo em dias a semanas. A irreversibilidade ocorre apenas quando o infiltrado é substituído por fibrose (colágeno)." },
      { q: "O que é a eosinofilúria e por que deve ser abandonada como exame?", a: "Eosinófilos >1% dos leucócitos urinários (coloração de Hansel). Em estudo com 566 pacientes: sensibilidade 30,8%, especificidade 68,2%, LR+ 0,97, LR- 1,01. O teste positivo deixa a probabilidade de NIA exatamente onde estava antes (LR ~1,0). Não tem conteúdo informacional e pode causar dano por atrasar a retirada do fármaco." },
      { q: "Quais são as três rotas para um fármaco se tornar antígeno renal na NIA?", a: "(1) Hapteno: fármaco/metabólito liga-se covalentemente a proteína tubular; (2) Mimetismo molecular: fármaco compartilha epítopo com proteína tubular; (3) Antígeno plantado: fármaco deposita-se na MBT sem ligação covalente. A resposta é mediada por linfócitos T CD4+." },
      { q: "Qual a conduta inicial mais importante na NIA?", a: "Suspender o fármaco suspeito. É a única medida disponível em qualquer cenário, de custo negativo e sem efeito adverso. Se múltiplos suspeitos: retirada sequencial se IRA leve (preserva informação); simultânea se IRA grave (prioriza velocidade)." },
      { q: "Qual o fenótipo típico da NIA por AINE?", a: "Latência longa (meses a >1 ano), manifestações alérgicas raras, eosinofilia menos frequente, proteinúria mais alta (pode ser nefrótica por lesão mínima associada), e NÃO responde a corticoide. A hipótese é que a latência longa faz o paciente chegar com fibrose já estabelecida." },
      { q: "Por que a NIA por AINE pode cursar com síndrome nefrótica?", a: "O AINE pode produzir simultaneamente NIA e podocitopatia (doença por lesão mínima). Mecanismo: bloqueada a ciclo-oxigenase, o ácido araquidônico é desviado para a via da lipoxigenase, aumentando leucotrienos quimiotáticos e tóxicos ao podócito." },
      { q: "Qual o esquema de corticoide na NIA?", a: "Prednisona 1 mg/kg/dia por 2 semanas plenas. Desmame: reduzir 10 mg a cada 3-5 dias até 10 mg/dia, depois desmame lento. Duração total: 4-12 semanas. Em iminência de diálise: considerar pulso de metilprednisolona 500-1000 mg IV/dia por 3 dias antes da prednisona oral." },
      { q: "Quando indicar biópsia renal na NIA?", a: "Quando não há fármaco reconhecidamente causador; quando o paciente é candidato a corticoide (para medir fibrose e excluir outros diagnósticos); quando não houve melhora após ~2 semanas da retirada; IR avançada de início recente (<3 meses); proteinúria elevada ou diagnóstico incerto." },
      { q: "Qual o achado histológico de maior peso prognóstico na biópsia da NIA?", a: "Fibrose intersticial >50% na biópsia inicial associou-se a má recuperação (melhora <25% da TFG em 6 meses) com OR 8,7 (IC 95%: 2,7-27,4). É o achado que mais influencia a decisão de manter ou suspender imunossupressão." },
      { q: "Como a NIA por inibidores de checkpoint (ICI) se diferencia mecanisticamente?", a: "O ICI não é o antígeno — é o removedor do freio imunológico. Bloqueia CTLA-4 ou PD-1/PD-L1, desfazendo tolerância periférica e permitindo expansão de clones T anérgicos contra haptenos de outros fármacos (como IBPs). Uso concomitante de IBP é fator de risco independente." },
      { q: "Qual a medida de prevenção primária sugerida para NIA por inibidores de checkpoint?", a: "Revisar e suspender IBPs desnecessários antes de iniciar imunoterapia. O IBP fornece o antígeno e o ICI remove a tolerância a ele. NIA por ICI não é contraindicação definitiva à reintrodução do ICI — recorrência em apenas 23%." },
      { q: "Qual a proteinúria típica na NIA e por que é baixa?", a: "Média 0,9 g/dia, mediana 0,70 g/dia. É baixa porque a barreira de filtração glomerular está intacta — a proteinúria é tubular (falha de reabsorção proximal de proteínas de baixo peso molecular), não glomerular. Faixa nefrótica é rara (<1%) e sugere AINE ou doença glomerular concomitante." },
      { q: "Por que a proscrição na NIA é da classe inteira do fármaco e não apenas do fármaco específico?", a: "Porque a resposta imune é contra o epítopo, não contra o fármaco. Há reação cruzada dentro de classes químicas (ex: quem fez NIA por cefalosporina deve evitar cefalosporinas E penicilinas — epítopo betalactâmico compartilhado). O mesmo vale para sulfas." },
      { q: "Qual a conduta quando o paciente com NIA não melhora após 3-4 semanas de corticoide?", a: "1) Reabrir o diagnóstico (biopsiar se não feito). 2) Verificar se o antígeno realmente saiu (revisar toda prescrição incluindo tópicos). 3) Verificar histologia: infiltrado ativo justifica estender para 8-12 semanas; fibrose dominante sem infiltrado → desmamar. NÃO escalar imunossupressão automaticamente." },
      { q: "Qual a alternativa ao corticoide na NIA refratária?", a: "Micofenolato de mofetila 1-2 g/dia VO (início 1 g/dia dividido 12/12h, titular até 2 g/dia). Indicado em NIA por biópsia com falha de resposta ao corticoide ou impossibilidade de retirá-lo sem recidiva (GRADE 2C). Base de evidência: série de 8 pacientes." },
      { q: "Qual a armadilha da profilaxia com SMX-TMP em paciente com NIA em uso de corticoide?", a: "SMX-TMP é causa clássica de NIA e pode causar segunda NIA interpretada como falha do corticoide. Além disso, trimetoprima eleva creatinina por inibição da secreção tubular (pseudoelevação) e causa hipercalemia por bloqueio do canal epitelial de sódio. Preferir atovaquona ou pentamidina inalatória." },
      { q: "Qual a conduta se não houver melhora após 5-7 dias de corticoide empírico sem biópsia?", a: "Biopsiar para excluir outro diagnóstico ou fibrose grave. Se houver contraindicação à biópsia, reavaliar: ausência de melhora pode significar diagnóstico errado, antígeno ainda presente ou doença já fibrótica." },
      { q: "Quais os preditores de recuperação improvável na NIA?", a: "Três, que no fundo são o mesmo preditor (tempo): (1) IR prolongada >3 semanas; (2) NIA por AINE; (3) Achados histológicos de cronicidade — granulomas, fibrose intersticial e atrofia tubular." },
      { q: "Por que a creatinina de pico não prediz o desfecho final na NIA?", a: "O pico mede o componente reversível (edema, compressão, vasoconstricção). O desfecho depende do componente irreversível (fibrose). São variáveis distintas. Consequência: creatinina muito alta não é motivo para desistir de tratar, e creatinina moderada em doença longa não é motivo para relaxar." },
      { q: "Qual o diferencial principal da NIA que pode ser confundido com ela e como distinguir?", a: "Ateroembolismo de colesterol: reproduz leucocitúria, eosinofilúria, eosinofilia e lesão de pele. Distinguir pela morfologia cutânea (livedo reticular e infartos digitais vs rash maculopapular) e história de procedimento endovascular recente." },
      { q: "Qual a NIA por IBPs e por que é subdiagnosticada?", a: "IBPs produzem NIA insidiosa, sem sinais alérgicos, em pacientes frequentemente idosos. Como são prescritos sem indicação formal e raramente revisados, o quadro tende a ser detectado tarde ou atribuído a progressão de doença de base." },
      { q: "Quais os números de prognóstico da NIA?", a: "Necessidade de diálise aguda: ~40% (superestimado pelo viés de espectro). Permanência em diálise crônica: ~10%. Elevação persistente da creatinina: até 40%. Creatinina final <1,2 mg/dL: 49%. A 'recuperação' raramente significa retorno ao basal." },
      { q: "Qual o fenótipo típico da NIA por rifampicina?", a: "Latência pode ser de 1 dia; regime intermitente é fator de risco. Frequentemente com febre, anemia hemolítica e trombocitopenia associadas — é a NIA mais 'imunológica' de todas. Reintrodução é contraindicada." },
      { q: "Quais as características da doença por IgG4 como causa de NIA?", a: "Infiltrado rico em plasmócitos IgG4+, fibrose estoriforme (em roda de carroça), depósitos imunes na MBT. 79-96% têm envolvimento extrarrenal (pâncreas, fígado, glândulas salivares). IgG4 sérica elevada em ~80%, complemento baixo em ~60%. Perguntar sobre olho seco, aumento de parótidas e pancreatite prévia." },
      { q: "O que a NIA por diuréticos tem de particularmente traiçoeiro?", a: "A IRA causada pelo diurético (NIA) é facilmente atribuída à depleção de volume que o próprio diurético causa. São duas explicações concorrentes no mesmo paciente, dificultando o diagnóstico." },
      { q: "Qual a FENa na NIA e como se diferencia da NTA?", a: "FENa >1% na NIA, assim como na NTA. Porém, na NTA reflete perda difusa da reabsorção por necrose; na NIA, reflete disfunção tubular por infiltrado e edema — potencialmente reversível. Índices urinários descrevem função, não histologia." },
      { q: "Quando a latência entre exposição e NIA se encurta para 3-5 dias?", a: "Na reexposição ao antígeno, pela memória imunológica. Na primeira exposição a mediana é ~10 dias (tempo necessário para processamento antigênico e expansão clonal de linfócitos T)." },
      { q: "Por que a imunofluorescência da biópsia é tipicamente negativa na NIA medicamentosa?", a: "Porque a doença é mediada por linfócitos T (resposta celular), não humoral (anticorpos). A presença de depósitos imunes deve fazer pensar em outra coisa: doença por IgG4, anticorpo anti-MBT, ou lúpus." },
      { q: "Qual o protocolo de monitorização após episódio de NIA?", a: "Após retirada sem corticoide: creatinina a cada 24-48h por 3-7 dias. Em corticoide: creatinina, glicemia, PA, K a cada 3-7 dias. Após alta: 3, 6, 12 meses e depois anual se DRC residual. Estadiar DRC e instituir nefroproteção." },
      { q: "Quando suspeitar de NIA infecciosa em vez de medicamentosa?", a: "Na ausência de fármaco causador identificável, investigar: Rx de tórax (sarcoidose, TB), cálcio e ECA (sarcoidose), QuantiFERON/PPD (TB), ANCA (vasculite), FAN/anti-DNA (lúpus), C3/C4, subclasses de IgG, anti-Ro/La (Sjögren)." },
      { q: "Por que se diz que ajustar dose para função renal NÃO protege contra NIA?", a: "São dois eixos ortogonais de nefrotoxicidade. Toxicidade dose-dependente (aminoglicosídeo, cisplatina): ajuste de dose protege. NIA (hipersensibilidade): dose-independente, ocorre em dose terapêutica correta em minoria idiossincrática. 'A dose estava correta' não exclui NIA." },
      { q: "Que exames investigar quando a biópsia da NIA mostra granulomas?", a: "Sarcoidose (50% das biópsias com granuloma renal em uma revisão), fármacos (18%), micobactérias (13%). A distribuição depende do local — em regiões de recursos escassos, infecção predomina. Solicitar cálcio, ECA, QuantiFERON/PPD, Rx tórax." },
      { q: "Por que a NIA provavelmente está subdiagnosticada?", a: "A proporção real de NIA medicamentosa é provavelmente maior que 70-75% porque a biópsia é evitada nos casos óbvios com melhora rápida após retirada. Idosos frágeis frequentemente recebem tratamento empírico sem biópsia. Além disso, AINEs e IBPs produzem NIA silenciosa." },
      { q: "Qual a indicação e dose de micofenolato de mofetila na NIA?", a: "NIA por biópsia com falha de resposta ao corticoide ou impossibilidade de retirá-lo sem recidiva (GRADE 2C). Início: 1 g/dia VO (500 mg 12/12h), titular até 2 g/dia. Monitorar hemograma semanal no 1o mês, quinzenal no 2o-3o, depois mensal. Teratogênico — contracepção obrigatória. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
