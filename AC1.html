  {
    id: "tetano",
    name: "Tétano",
    cards: [
      { q: "Qual o agente etiológico do tétano e quais toxinas ele produz?", a: "Clostridium tetani, bacilo anaeróbio. Produz tetanolisina (papel pouco claro; possivelmente lesa tecido e favorece ambiente anaeróbio) e tetanospasmina (neurotoxina responsável por todas as manifestações clínicas — inibe liberação de GABA e glicina na membrana pré-sináptica por várias semanas)." },
      { q: "Qual o mecanismo central da tetanospasmina?", a: "Inibe a liberação de neurotransmissores inibitórios (GABA e glicina) na membrana pré-sináptica. Remove o 'freio' inibitório do sistema motor, fazendo com que qualquer estímulo aferente gere contração simultânea e sustentada de músculos agonistas e antagonistas." },
      { q: "Por que o tétano causa espasmo e não paralisia?", a: "Porque a tetanospasmina bloqueia a inibição, não a excitação. O sistema motor normalmente tem equilíbrio entre excitação e inibição. Ao remover o freio inibitório (GABA/glicina), qualquer estímulo gera contração descontrolada de agonistas E antagonistas simultaneamente." },
      { q: "O que é a disautonomia do tétano e quando ocorre?", a: "Surge tipicamente na 2a semana: hipertensão lábil, taquicardia, arritmias, vasoconstrição periférica, sudorese, febre, e por vezes hipotensão e bradicardia paradoxais. Mecanismo: perda do controle inibitório sobre neurônios simpáticos pré-ganglionares com liberação maciça de catecolaminas (até 10x o basal)." },
      { q: "Qual o grau de recomendação para tratamento do tétano moderado/grave em UTI?", a: "1B (recomendação forte com evidência de RCTs com limitações). Independente da faixa etária. Tétano leve: preferencialmente UTI (2C), especialmente se houver fator de risco de mau prognóstico." },
      { q: "Qual a imunoterapia passiva de escolha no tétano e por que?", a: "IGATH (imunoglobulina antitetânica humana) é preferida (1C) sobre SAT (soro antitetânico equino). IGATH: mais segura, sem risco de anafilaxia ou doença do soro, meia-vida mais longa (21-30 dias). Dose única IM profunda: 500-5.000 UI de IGATH ou 20.000-30.000 UI de SAT." },
      { q: "Por que é necessário vacinar o paciente com tétano mesmo durante a doença ativa?", a: "Porque a doença NÃO confere imunidade natural. A quantidade de toxina necessária para causar doença é muito menor que a necessária para estimular resposta imune protetora. Vacinação (imunização ativa) simultânea à imunoglobulina (1C)." },
      { q: "Por que se desaconselha imunoglobulina intratecal no tétano?", a: "O racional (neutralizar toxina já ligada no SNC) é plausível, mas sugere-se não aplicar (2C). Estudos mostraram benefício em desfechos secundários (menor duração de espasmos) mas sem impacto em mortalidade, e sem benefício nos casos graves." },
      { q: "Qual a recomendação para debridamento do foco no tétano?", a: "Debridamento do foco (1D): recomendação forte, mas baseada em opinião de especialista. Realizar 1-6 horas APÓS a imunoglobulina (2D), para permitir que a antitoxina neutralize a toxina antes da manipulação, evitando liberação de mais toxina." },
      { q: "Por que o metronidazol é preferido sobre a penicilina no tétano?", a: "A benzilpenicilina produz inibição não competitiva, voltagem-dependente, dos receptores GABA-A — potencialmente reforçando o mesmo mecanismo da tetanospasmina (bloqueio GABAérgico). O metronidazol não tem esse efeito, tem excelente biodisponibilidade oral/retal e ação bactericida contra anaeróbios." },
      { q: "Qual o antibiótico de primeira linha no tétano e qual o grau de evidência?", a: "Metronidazol ou penicilina, sem evidência de superioridade (2B), embora dados favoreçam levemente o metronidazol pelo racional farmacológico. Outros antimicrobianos apenas na presença de contraindicação (2D)." },
      { q: "Por que se recomenda traqueostomia precoce no tétano moderado/grave?", a: "Sugere-se nas primeiras 24h após IOT (2D). O tubo orotraqueal é estímulo mecânico que precipita espasmos (laríngeos ou generalizados) num sistema desinibido. A traqueostomia remove esse estímulo e facilita suporte ventilatório prolongado, evitando aumento desnecessário de relaxantes musculares." },
      { q: "Qual o relaxante muscular de primeira linha no tétano e qual o mecanismo?", a: "Diazepam (2D), agonista GABAérgico que compensa farmacologicamente o déficit de inibição GABAérgica causado pela tetanospasmina. Doses podem ser elevadas: 1-10 mg/kg/dia. Uso contínuo mais estável que bolus." },
      { q: "Por que betabloqueadores puros são perigosos no tétano?", a: "Associados a morte súbita. O bloqueio beta desmascara atividade alfa-adrenérgica não contraposta, levando a vasoconstricção intensa e colapso cardiovascular. Exceção parcial: labetalol (misto alfa/beta) e esmolol (meia-vida ultracurta) podem ser mais seguros." },
      { q: "Qual o papel do sulfato de magnésio no tétano?", a: "Adjuvante para espasmos e disautonomia (2B — o grau mais alto entre as recomendações farmacológicas do tétano). Ataque: 40 mg/kg + infusão 2g/h por 7 dias. Não reduziu necessidade de suporte ventilatório (desfecho primário neutro), mas reduziu necessidade de benzodiazepínicos e BNM." },
      { q: "Qual o tratamento de primeira linha da disautonomia do tétano?", a: "Opioides (morfina ou fentanil) em infusão contínua (2D). Racional: a tetanospasmina pode inibir liberação de encefalinas endógenas (opioides naturais), e a reposição farmacológica compensa esse déficit. Terapia adjuvante conforme necessidade." },
      { q: "Qual o papel dos agonistas alfa-2 (clonidina, dexmedetomidina) no tétano?", a: "Reduzem tônus simpático central, com bom perfil de segurança. Potencializam o efeito dos opioides na disautonomia. Uso relatado em séries de caso e pequeno estudo prospectivo." },
      { q: "Quando indicar bloqueadores neuromusculares no tétano?", a: "Última linha (2D): tétano grave, sob ventilação mecânica, refratário a outros relaxantes. SEMPRE precedidos de sedação e analgesia adequadas (nunca bloqueio sem sedação). Limitar tempo ao mínimo necessário — uso prolongado causa atrofia, fraqueza pós-UTI, TVP." },
      { q: "Qual a utilidade da CPK no manejo do tétano?", a: "Dois propósitos distintos: (1) Para ajustar relaxamento muscular: dosar diariamente (2D), pois a oscilação reflete contração inadequadamente controlada. (2) Para prevenir IRA por rabdomiólise: sugere-se NÃO dosar com esse objetivo (2C) — a CPK no tétano costuma ser moderada e não se correlacionou com IRA." },
      { q: "Qual a estratégia ventilatória no tétano?", a: "Ventilação assistido-controlada (volume ou pressão, sem superioridade entre elas, 2D). Ventilação protetora (VC 6-8 mL/kg peso predito + PEEP). Relaxamento muscular adequado é pré-requisito — espasmos alteram dinamicamente a mecânica respiratória." },
      { q: "Por que se deve aumentar sedação antes de fisioterapia no tétano?", a: "Qualquer manipulação é estímulo que pode desencadear espasmo num sistema desinibido (princípio central da doença). O profissional precisa 'proteger' o paciente farmacologicamente antes de intervir fisicamente (2D)." },
      { q: "Quais são as formas clínicas do tétano?", a: "Localizado (leve): poucos grupos musculares. Generalizado: toda a musculatura esquelética — forma mais comum e potencialmente grave. A classificação de gravidade na admissão tem valor prognóstico direto." },
      { q: "O que a diretriz da AMIB recomenda sobre classificação de gravidade no tétano?", a: "Cada serviço deve adotar uma classificação de gravidade (2D) baseada em período de incubação, período de progressão, intensidade de contratura/espasmos e resposta a relaxantes. Formas mais graves = mais complicações respiratórias, infecciosas e cardiovasculares." },
      { q: "Qual a hipótese adicional sobre o mecanismo da hipertensão no tétano?", a: "Além da liberação maciça de catecolaminas, propõe-se que a tetanospasmina (peptidase zinco-dependente) pode ter ação similar à enzima conversora de angiotensina, contribuindo para hipertensão por via bioquímica adicional. Isso fundamenta a cogitação experimental de inibidores da ECA." },
      { q: "Por que um betabloqueador beta-1 seletivo de ação ultracurta (esmolol) seria teoricamente mais seguro no tétano?", a: "Porque sua meia-vida ultracurta permite reversão rápida em caso de colapso cardiovascular. Diferente de betabloqueadores não seletivos de ação prolongada, que desmascaram o efeito alfa de forma sustentada e irreversível no curto prazo." },
      { q: "Por que a doença do tétano não confere imunidade e qual a implicação prática?", a: "A quantidade de toxina necessária para causar doença é muito menor que a necessária para estimular resposta imune protetora. Implicação: vacinação é obrigatória simultaneamente à imunoglobulina, mesmo durante a doença ativa." },
      { q: "Quais os riscos do SAT (soro antitetânico equino)?", a: "Reações de hipersensibilidade (prurido, urticária até anafilaxia) e doença do soro (reação tardia 5-21 dias: febre, urticária, artralgia, adenomegalia, comprometimento neurológico ou renal). Por isso a IGATH (humana) é preferida." },
      { q: "Qual o papel do baclofeno no tétano?", a: "Agonista GABAérgico que inibe liberação pré-sináptica de acetilcolina. Não atravessa barreira hematoencefálica por via sistêmica — forma mais eficaz é intratecal (indisponível no Brasil). Via oral (até 60 mg/dia) limitada à fase de convalescência. Alternativa ao diazepam (2D)." },
      { q: "Qual a relação entre qualidade da assistência e mortalidade no tétano?", a: "Estudos mostram que não é o ambiente físico da UTI que salva vidas, mas a qualidade da assistência. Um estudo brasileiro mostrou queda de mortalidade de 36,5% para 18% após melhoria de protocolo, mesmo com mais complicações registradas — viés de vigilância que aumenta detecção." },
      { q: "Qual a conduta com analgossedação no tétano grave?", a: "Opioides + agonistas alfa-2 centrais (clonidina/dexmedetomidina) e/ou propofol (2D). Sem evidência de superioridade entre esquemas. A experiência é de relatos de caso e séries pequenas." },
      { q: "Qual a lógica terapêutica integrada do tétano em sequência?", a: "1) Neutralizar toxina livre: IGATH/SAT. 2) Remover fonte: debridamento (1-6h após imunoglobulina). 3) Erradicar bactéria: metronidazol. 4) Controlar espasmo: diazepam + BNM se refratário. 5) Via aérea: traqueostomia precoce. 6) Disautonomia: opioides + alfa-2 agonistas. 7) Adjuvante: MgSO4. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]

  {
    id: "asma",
    name: "Asma",
    cards: [
      { q: "Qual a definicao de asma e suas tres caracteristicas fundamentais?", a: "Doenca heterogenea com inflamacao cronica das vias aereas. Tres caracteristicas: 1) Sintomas respiratorios (sibilos, tosse, dispneia, opressao toracica). 2) Variacao de intensidade ao longo do tempo. 3) Limitacao no fluxo aereo de forma reversivel." },
      { q: "Quais sao os 5 fenotipos da asma?", a: "1) Alergica: mais comum, inicio na infancia, IgE elevada, prick test positivo. 2) Nao alergica: escarro paucigranulocítico ou neutrofilico, resistente a CI. 3) Inicio na vida adulta: mulheres ~40 anos, maiores doses de CI. 4) Com limitacao persistente: remodelamento, sem reversibilidade. 5) Relacionada a obesidade: sintomas exuberantes, inflamacao nao eosinofilica." },
      { q: "Qual o criterio espirometrico para diagnostico de asma?", a: "Prova broncodilatadora positiva: aumento do VEF1 em 200 mL E 12% do valor pre-broncodilatador. Alternativas: aumento de VEF1 >=7% do previsto apos BD; variacao de VEF1 >=20% no teste de broncoprovocacao com metacolina ou >=15% com hiperventilacao/manitol/salina hipertonica." },
      { q: "O que fazer quando a espirometria e normal em paciente ja em uso de CI?", a: "Duas estrategias: 1) Comparar espirometrias pre e pos-inicio do CI - aumento de VEF1 200 mL E 12% apos 4 semanas confirma diagnostico. 2) Step down: reduzir CI 25-50% ao longo de 3 meses e repetir espirometria (so se paciente controlado e sem fatores de risco para exacerbacao)." },
      { q: "Qual o papel e o ponto de corte do FeNO?", a: "O FeNO e marcador nao invasivo de inflamacao tipo 2. Ponto de corte: >50 ppb em adultos (alta especificidade). Limitacao: pode causar diagnostico excessivo em adultos com sintomas atipicos e baixa alergia. Nao e necessario para diagnostico, mas apoia quando espirometria e inconclusiva." },
      { q: "Qual o papel do teste de broncoprovocacao com metacolina?", a: "Avalia hiperresponsividade bronquica. Alta sensibilidade mas baixa especificidade. Alto valor preditivo negativo: teste normal praticamente exclui asma. Util em sintomas atipicos ou baixa probabilidade pre-teste. Boa correlacao com gravidade da asma." },
      { q: "Quais sao os dois endotipos da asma e suas diferencas?", a: "T2-alto: eosinofilos >150/mcL, FeNO >20 ppb, IgE elevada, excelente resposta a CI, candidatos a biologicos. T2-baixo: biomarcadores T2 ausentes, fenótipo nao alergico, pode ter predominio de neutrofilos, associado a obesidade/tabagismo, menor resposta a CI, requer abordagens alternativas." },
      { q: "Quais os objetivos do tratamento da asma e como avaliar o controle?", a: "Objetivos: controlar sintomas (diurnos <2x/sem, sem despertar noturno, sem limitar atividades) e minimizar riscos futuros (exacerbacao, declinio funcional, efeitos adversos). Questionario ACT: 20-25 = controlada (manter tratamento); <20 = rever tratamento." },
      { q: "O que e a estrategia MART e em qual step e usada?", a: "MART (Maintenance And Reliever Therapy): o mesmo dispositivo de ICS-formoterol em dose baixa e usado tanto para manutencao quanto para alivio. Usada a partir do step 3 (asma moderada). Vantagem: formoterol oferece alivio imediato + efeito anti-inflamatorio do CI em cada inalacao." },
      { q: "Quais os steps de tratamento da asma e suas indicacoes?", a: "Step 1 (leve): sintomas <2x/mes, ICS-formoterol SOS. Step 2 (leve): >2 episodios/mes mas <4-5x/sem, ICS-formoterol baixa dose SOS. Step 3 (moderada): maioria dos dias ou despertar >=1x/sem, MART com ICS-formoterol dose baixa. Step 4 (grave): maioria dos dias e despertar >1x/sem + queda funcional, ICS dose moderada + LABA diario." },
      { q: "Qual o medicamento de alivio preferencial em todos os steps?", a: "Formoterol + CI (ICS-formoterol) e o alivio preferencial em todos os steps. Oferece alivio imediato (formoterol e LABA de acao rapida) + efeito anti-inflamatorio do CI em cada inalacao. A via alternativa usa SABA como alivio, mas ICS-formoterol e preferencial." },
      { q: "Quais medicamentos inalatorios estao disponiveis no SUS?", a: "Farmacia Basica: ICS (Beclometasona 200 ou 250 mcg) + SABA (Salbutamol spray 100 mcg). Farmacia Cidada: ICS (Budesonida 200 mcg) + Formoterol (6 mcg)." },
      { q: "Quais sao os fatores de risco para exacerbacao da asma?", a: "Medicamentos (ma aderencia), morbidades (atopia, obesidade, DRGE, gravidez), exposicao a alergenios/irritantes, funcao pulmonar reduzida (VEF1 <60%), marcadores inflamatorios T2 elevados, e historia de exacerbacao no ultimo ano." },
      { q: "Qual a relacao entre obstrucao variavel e o exame fisico na asma?", a: "O exame fisico pode ser completamente normal fora dos periodos de exacerbacao. Sibilos sao caracteristicos mas NAO patognomônicos. A confirmacao diagnostica com espirometria e essencial para evitar diagnosticos e tratamento em excesso e identificar diferenciais." },
      { q: "Quais as diferencas entre asma alergica, eosinofilica nao alergica e nao eosinofilica?", a: "Alergica: Th2, IgE especifica, atopia presente, inicio precoce, excelente resposta a CI. Eosinofilica nao alergica: via imune inata, sem IgE/atopia, inicio tardio, pode ter intolerancia a AINEs. Nao eosinofilica: Th1/neutrofilica, sem atopia, associada a tabagismo/obesidade, menor resposta a CI." },
      { q: "Quais os biomarcadores uteis na avaliacao da asma?", a: "Testes cutaneos (sensibilizacao alergica), eosinofilos no sangue (inflamacao eosinofilica), IgE total (atopia), IgE especificas, FeNO (inflamacao T2), periostina serica (T2 sofisticado), eosinofilos no escarro induzido (padrao-ouro para inflamacao eosinofilica)." },
      { q: "Quais sintomas sugerem alta probabilidade de asma?", a: "Variacao temporal (piores a noite/inicio da manha), gatilhos identificaveis (virus, aeroalergenios, mudanca de temperatura, tabagismo), reversibilidade espontanea ou com BD, e associacao de mais de um sintoma (sibilos + dispneia + tosse + opressao toracica)." },
      { q: "Quais caracteristicas sugerem baixa probabilidade de asma e devem levantar diferenciais?", a: "Tosse como sintoma isolado, expectoracao abundante, dispneia com lipotimia/cefaleia/parestesias, dor toracica, dispneia induzida por exercicio associada a estridor. Em adultos, considerar asma ocupacional (ate 20% dos casos) e DPOC." },
      { q: "Qual a diferenca espirometrica fundamental entre asma e DPOC?", a: "Na asma, a limitacao ao fluxo aereo e variavel e reversivel (prova BD fortemente positiva). Na DPOC, a obstrucao e persistente e nao totalmente reversivel (VEF1/CVF pos-BD <0,7 mantido). Variacao na intensidade dos sintomas e capacidade de difusao do CO aumentada sugerem asma." },
      { q: "Quais os fatores de risco para obstrucao fixa do fluxo aereo na asma?", a: "Prematuridade, baixo peso ao nascer, tabagismo, VEF1 baixo inicialmente e eosinofilia periferica. Pacientes com asma nao controlada por longos periodos podem nao apresentar reversibilidade devido ao remodelamento das vias aereas." },
      { q: "Qual o papel dos corticoides inalatorios na asma e quando considerar biologicos?", a: "CI sao a base do tratamento em todos os steps. No T2-alto (eosinofilos >150, FeNO >20, IgE elevada), ha excelente resposta. Biologicos sao candidatos quando ha asma grave nao controlada com step 4 otimizado, especialmente no endotipo T2-alto." },
      { q: "Qual o tratamento nao farmacologico da asma?", a: "Cessar tabagismo, controle ambiental (reduzir exposicao a alergenios e irritantes), exercicio fisico regular e educacao estruturada do paciente sobre a doenca e uso correto dos dispositivos inalatorios." },
      { q: "Qual o percentual de remissao total em 5 anos na asma de inicio na vida adulta?", a: "Ate 16% desses pacientes apresentam remissao total da doenca em cinco anos. A asma de inicio na vida adulta acomete tipicamente mulheres acima de 40 anos e pode ter relacao com polipos nasais." },
      { q: "O que e asma ocupacional e qual sua prevalencia entre adultos com asma?", a: "Asma ocupacional e aquela desencadeada ou agravada pela exposicao a agentes no ambiente de trabalho. Pode representar ate 20% das causas de asma em adultos. O principal tratamento e afastar o paciente da atividade envolvida na exposicao." },
      { q: "Qual o fenomeno que diferencia asma e DPOC na espirometria em relacao a capacidade de difusao?", a: "Na asma, a capacidade de difusao do monoxido de carbono (DLCO) esta aumentada ou normal, enquanto na DPOC esta reduzida (pela destruicao do leito capilar alveolar no enfisema). Variacao na intensidade dos sintomas e prova broncodilatadora fortemente positiva tambem sugerem asma." },
      { q: "Quais as duas estrategias para confirmar asma em paciente ja em uso de corticoide inalatorio com PBD negativa?", a: "1) Comparar espirometrias pre e pos inicio do CI — aumento do VEF1 de 200ml E 12% apos 4 semanas confirma asma. 2) Step down: reduzir dose do CI em 25-50% ao longo de 3 meses (paciente com bom controle e sem fatores de risco para exacerbacao) e repetir espirometria." },
      { q: "Qual a relacao entre sibilos e exame fisico na asma?", a: "O exame fisico pode ser completamente normal fora dos periodos de exacerbacao. Sibilos sao caracteristicos mas nao patognomonicos de asma — podem ocorrer em IC, TEP, DPOC e obstrucao de vias aereas superiores." },
      { q: "O que e a prova broncodilatadora positiva em termos numericos?", a: "VEF1 que aumenta em 200 mL E 12% do valor pre-broncodilatador. Ambos os criterios (absoluto E relativo) devem ser atendidos simultaneamente. Uma alternativa e melhora de >= 7% do VEF1 previsto apos broncodilatador." },
      { q: "Quais os biomarcadores que definem asma tipo T2 alto?", a: "Eosinofilos no sangue >150 celulas, eosinofilos no escarro >2%, FeNO >20 ppb, IgE especifico elevado e RAST positivo. Esses pacientes tem excelente resposta aos corticoides inalatorios e sao candidatos a terapia biologica." },
      { q: "Quais as caracteristicas da asma tipo T2 baixo?", a: "Biomarcadores T2 ausentes ou baixos, fenotipo frequentemente nao alergico, pode ter predominio de neutrofilos, associada a obesidade e tabagismo. Sao menos responsivos a corticoides e requerem abordagens alternativas." },
      { q: "Quais sao os scores do ACT (Asthma Control Test) e suas interpretacoes?", a: "20-25 pontos: asma controlada — manter tratamento. <20 pontos: rever o tratamento (considerar step up). <10 pontos: emergencia — procurar atendimento imediato." },
      { q: "Qual a indicacao do step 1 da asma e qual o esquema terapeutico?", a: "Step 1: sintomas menos de 2 vezes ao mes. Usa-se ICS-formoterol em baixa dose quando necessario (sob demanda), ou ICS + SABA como via alternativa. Os steps 1 e 2 sao iguais na via preferencial com formoterol." },
      { q: "Qual a indicacao do step 2 da asma?", a: "Step 2: mais de 2 episodios sintomaticos ao mes, porem menos de 4 a 5 vezes por semana. Na via preferencial: ICS-formoterol em baixa dose sob demanda (identico ao step 1). Alternativa: ICS em baixa dose diario + SABA de resgate." },
      { q: "Qual a indicacao e o esquema do step 3 (asma moderada)?", a: "Step 3: sintomas na maioria dos dias ou despertar noturno pelo menos 1x/semana. Na via preferencial: estrategia MART (ICS-formoterol em dose baixa para manutencao E alivio). Alternativa: ICS em dose baixa + LABA de manutencao." },
      { q: "Qual a indicacao e o esquema do step 4 (asma grave)?", a: "Step 4: sintomas na maioria dos dias + despertar noturno >1x/semana + comprometimento de funcao pulmonar. Esquema: ICS em dose moderada + LABA diario. Todos os steps devem ter formoterol + CI como medicamento de alivio." },
      { q: "Quais medicamentos inalatorios estao disponiveis no SUS (Farmacia Basica e Farmacia Cidada)?", a: "Farmacia Basica: ICS (Beclometasona 200 ou 250 mcg) + SABA (Salbutamol spray 100 mcg). Farmacia Cidada: ICS (Budesonida 200 mcg) + Formoterol (6 mcg)." },
      { q: "Quais sao as interleucinas envolvidas na asma alergica e eosinofilica nao alergica?", a: "Asma alergica (T2 alto, mediada por IgE): IL-4, IL-5, IL-13. Asma eosinofilica nao alergica: principalmente IL-5 (via resposta imune inata, independente de IgE). Asma nao eosinofilica: perfil inflamatorio mais completo, via Th1 com predominio neutrofilico." },
      { q: "Qual o valor preditivo negativo do teste de broncoprovocacao com metacolina?", a: "O teste de broncoprovocacao com metacolina tem alto valor preditivo negativo: um teste normal praticamente exclui asma. Tem alta sensibilidade mas baixa especificidade. Util em sintomas atipicos ou baixa probabilidade pre-teste." },
      { q: "Quais sao os fatores de risco para obstrucao fixa ao fluxo aereo na asma?", a: "Prematuridade, baixo peso ao nascer, tabagismo, VEF1 baixo inicialmente e eosinofilia periferica. Pacientes com asma nao controlada por longos periodos podem desenvolver remodelamento das vias aereas com perda da reversibilidade." },
      { q: "Quais os criterios para variacao no teste de broncoprovocacao que confirmam asma?", a: "Variacao no VEF1 de 20% ou mais durante teste com metacolina, ou queda de 15% ou mais com hiperventilacao, manitol ou salina hipertonica. O teste documenta a hiperresponsividade bronquica." },
      { q: "Quais os diagnosticos diferenciais da asma por faixa etaria?", a: "12 a 39 anos: tosse cronica, bronquiectasias, fibrose cistica, deficiencia de alfa-1 antitripsina, corpo estranho. >40 anos: tosse medicamentosa (IECA), bronquiectasias, DPOC, IC, TEP, obstrucao de via aerea." },
      { q: "Qual o papel da periostina serica como biomarcador na asma?", a: "A periostina serica e um marcador mais sofisticado de inflamacao tipo 2 das vias aereas. Junto com eosinofilos no escarro induzido (padrao-ouro para inflamacao eosinofilica), complementa a avaliacao do fenotipo inflamatorio para guiar terapia biologica." },
      { q: "Qual a relacao entre asma e obesidade?", a: "A asma relacionada a obesidade geralmente apresenta sintomas respiratorios exuberantes, inflamacao nao eosinofilica e maior resistencia ao uso de corticoide inalatorio. Obesidade tambem e fator de risco para exacerbacoes." },
      { q: "O que significa o principio 'Revisar - Avaliar - Ajustar' no tratamento da asma?", a: "O tratamento da asma e personalizado e ajustado em ciclos durante o acompanhamento: Revisar (verificar adesao, tecnica inalatoria, comorbidades), Avaliar (controle de sintomas via ACT e fatores de risco), Ajustar (step up ou step down conforme necessidade)." },
      { q: "Quais sao os fatores de risco para exacerbacao da asma?", a: "Medicamentos (ma aderencia), morbidades (atopia, obesidade, DRGE, gravidez), exposicoes ambientais/ocupacionais, funcao pulmonar (VEF1 <60% do previsto) e marcadores inflamatorios de Th2 elevados." },
      { q: "Qual a diferenca entre asma alergica e nao alergica quanto a resposta ao corticoide inalatorio?", a: "Asma alergica: resposta excelente aos corticoides inalatorios, com marcadores IgE positivos e eosinofilia. Asma nao alergica: escarro paucigranulocito ou neutrofilico, comumente mais resistentes ao corticoide inalatorio, requerendo abordagens alternativas." },
      { q: "Qual a importancia de diagnosticar asma ANTES do inicio do corticoide inalatorio?", a: "O CI pode reduzir ou mascarar os sintomas e normalizar a prova broncodilatadora, dificultando a confirmacao diagnostica. Porem, nao se deve atrasar o tratamento em paciente sintomatico. Historia familiar de asma e presenca de doencas atopicas favorecem o diagnostico." },
      { q: "Por que eosinofilos no escarro induzido sao considerados padrao-ouro?", a: "Eosinofilos no escarro induzido sao o padrao-ouro para avaliacao da inflamacao eosinofilica das vias aereas porque medem diretamente a inflamacao no local da doenca, ao contrario dos marcadores sanguineos que refletem inflamacao sistemica." },
      { q: "Quais as 4 caracteristicas de alta probabilidade de ser asma na historia clinica?", a: "1) Variacao temporal dos sintomas (piores a noite/inicio da manha). 2) Gatilhos identificaveis (infeccoes virais, alergenos, mudanca de temperatura). 3) Reversibilidade espontanea ou com broncodilatador. 4) Mais de um sintoma em associacao (sibilos + dispneia + tosse). Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "dpoc",
    name: "DPOC e Exacerbação",
    cards: [
      { q: "Qual a definicao de DPOC segundo o GOLD 2026?", a: "Condicao pulmonar heterogenea, comum, prevenivel e tratavel, caracterizada por sintomas respiratorios cronicos e limitacao persistente ao fluxo aereo, causada por anormalidades nas vias aereas e/ou alveolos, geralmente decorrentes da exposicao a gases e particulas nocivas." },
      { q: "Qual a classificacao etiologica da DPOC (G/D/C/P/I/A/U)?", a: "G-DPOC: deficiencia de alfa-1 antitripsina. D-DPOC: prematuridade/PIG. C-DPOC (cigarro): exposicao ao tabaco. P-DPOC (poluicao): poluicao ambiental/biomassa. I-DPOC: infeccao (TB, HIV). A-DPOC: asma na infancia. U-DPOC: causa nao identificada." },
      { q: "O que e a deficiencia de alfa-1 antitripsina e qual o padrao de enfisema?", a: "Doenca genetica (mutacao SERPINA-1) com reducao da antiprotease pulmonar. A AAT inibe a elastase; na sua ausencia, ha destruicao descontrolada do parenquima. Corresponde a 1-2% dos casos de DPOC, acomete jovens sem tabagismo significativo. Padrao: enfisema panacinar (panlobular), predominio em lobos inferiores." },
      { q: "Quais as diferencas entre bronquite cronica e enfisema (Blue Bloater vs Pink Puffer)?", a: "Bronquite cronica (Blue Bloater): tosse produtiva >3 meses/ano por 2 anos consecutivos, hiperplasia de glandulas mucosas, cianose, edema periferico. Fisiopatologia: obstrucao -> diminuicao ventilacao -> hipoxemia -> hipercapnia -> cor pulmonale. Enfisema (Pink Puffer): destruicao alveolar, hiperinsuflacao, torax em tonel, dispneia intensa." },
      { q: "Quais sao os tres tipos de enfisema e suas associacoes?", a: "Centrolobular (centroacinar): porcao central do acino, tabagismo, lobos superiores, mais comum na DPOC. Parasseptal: regiao periferica subpleural, associado a bolhas e pneumotorax espontaneo. Panlobular (panacinar): todo o acino, deficiencia de AAT, lobos inferiores." },
      { q: "Qual o criterio espirometrico para diagnostico de DPOC?", a: "Relacao VEF1/CVF pos-broncodilatador < 0,7 e diagnostica de obstrucao ao fluxo aereo nao totalmente reversivel. A espirometria e mandatoria para o diagnostico. Historia e exame fisico nao sao bons preditores de obstrucao espirometrica." },
      { q: "Como e classificada a gravidade da obstrucao na DPOC (GOLD)?", a: "Baseada no VEF1 pos-BD em % do predito: GOLD 1 (leve): VEF1 >=80%. GOLD 2 (moderada): 50-79%. GOLD 3 (grave): 30-49%. GOLD 4 (muito grave): <30%. A espirometria deve ser repetida anualmente." },
      { q: "Como e feita a avaliacao ABE na DPOC?", a: "Primeiro avaliar risco de exacerbacao: se >=1 hospitalizacao ou >=2 idas ao PS = categoria E. Se baixo risco, avaliar sintomas: mMRC >=2 ou CAT >=10 = categoria B; intensidade baixa = categoria A." },
      { q: "Quais os tratamentos nao farmacologicos/redutores de mortalidade na DPOC?", a: "Cessacao do tabagismo, vacinas, reabilitacao pulmonar, oxigenoterapia domiciliar, ventilacao nao invasiva e cirurgias (reducao de volume pulmonar, transplante)." },
      { q: "Quando considerar tripla terapia (ICS + LABA + LAMA) na DPOC?", a: "Para pacientes do grupo E com eosinofilos >300 celulas/mcL. Os ICS nao reduzem sintomas de DPOC, mas podem reduzir exacerbacoes. Ha relacao direta entre beneficio dos ICS e contagem de eosinofilos no sangue." },
      { q: "O que e uma exacerbacao da DPOC e qual sua frequencia?", a: "Evento agudo com piora dos sintomas respiratorios habituais (aumento de dispneia, tosse e/ou producao de secrecao) em <14 dias (media 7-10 dias). Pode ter taquipneia e taquicardia. Ocorrem 2-3 exacerbacoes/ano, mortalidade intra-hospitalar ~10%, metade reinterna em 6 meses." },
      { q: "Quais os criterios de gravidade da exacerbacao da DPOC (Criterios de Roma)?", a: "Avalia-se: dispneia (EVA >=5), FR (>=24), FC (>=95), SpO2 (<92% ou mudanca >3%) e PCR (>=10). Leve: <3 criterios. Moderada: >=3 dos 5 criterios. Grave: adicionalmente gasometria com hipoxemia (PaO2 <=60) e/ou hipercapnia com acidose (PaCO2 >45 e pH <7,35)." },
      { q: "Quais os pilares farmacologicos do tratamento da exacerbacao da DPOC?", a: "1) Broncodilatadores: SABA +/- SAMA (terapia inicial). 2) Corticosteroides sistemicos: Prednisolona 40 mg/dia por 5 dias VO (hospitalizados: metilprednisolona 0,5-1 mg/kg a cada 6-8h IV). 3) Antibioticos orais: quando >=2 de 3 criterios (aumento de dispneia, volume de escarro e escarro purulento)." },
      { q: "Quais as indicacoes de VNI na exacerbacao da DPOC?", a: "Primeira escolha para ventilacao na exacerbacao, especialmente na falha respiratoria hipercapnica. Indicacoes (pelo menos uma): acidose respiratoria (PaCO2 >=45 e pH <=7,35), dispneia grave, ou hipoxemia persistente apesar de oxigenoterapia suplementar. Reduz necessidade de intubacao e mortalidade." },
      { q: "Por que oxigenio em alto fluxo e perigoso na DPOC?", a: "Risco de reter CO2 (narcose por CO2). O objetivo e manter SpO2 em niveis seguros com oxigenio de baixo fluxo, sem deprimir a ventilacao. Pacientes com DPOC grave dependem parcialmente da hipoxemia como estimulo ventilatorio." },
      { q: "Quais os gatilhos mais comuns de exacerbacao da DPOC?", a: "Infeccoes virais (mais comum), infeccoes bacterianas, poluicao ambiental, poluicao ocupacional, tabagismo e temperaturas extremas (calor ou frio excessivo)." },
      { q: "Qual o principal fator de risco para exacerbacoes repetidas da DPOC?", a: "Historia previa de exacerbacao nos ultimos 12 meses e o principal fator de risco. Outros: maior idade, maior gravidade (menor VEF1, baixa PaO2), maior inflamacao, carga bacteriana, hipersecrecao bronquica e comorbidades (cardiovascular, miopatia, ansiedade-depressao, DRGE)." },
      { q: "Quando indicar antibioticos na exacerbacao da DPOC?", a: "Quando houver pelo menos 2 de 3 criterios: aumento da dispneia, aumento do volume do escarro e escarro purulento. Tambem se houver necessidade de ventilacao mecanica. Duracao: ambulatorial <=5 dias; hospitalar 5-7 dias." },
      { q: "Qual o papel da canula nasal de alto fluxo (CNAF) na DPOC?", a: "Fornece oxigenio aquecido e umidificado ate 60 L/min. Reduz FR, esforco respiratorio e hipercapnia, oferecendo PEEP moderada. Indicacoes: hipoxemia persistente, intolerancia ou contraindicacao a VNI, desmame de O2 e prevencao de reintubacao." },
      { q: "Quando indicar hospitalizacao na exacerbacao da DPOC?", a: "Sinais de insuficiencia respiratoria aguda (aumento de FR, uso de musculatura acessoria), falha na resposta ao tratamento inicial, comorbidades graves ou falta de suporte domiciliar. UTI: hipoxemia persistente, hipercapnia severa, alteracao do estado mental, necessidade de VM ou instabilidade hemodinamica. 80% sao manejados ambulatorialmente." },
      { q: "Quais os diagnosticos diferenciais de exacerbacao da DPOC?", a: "Mais frequentes: bronquite aguda, IC descompensada, IAM, arritmias, TEP e pneumonia. Menos frequentes: pneumotorax. O primeiro contato deve focar na confirmacao e na identificacao de riscos imediatos." },
      { q: "Qual o principal sintoma da DPOC e quando considerar o diagnostico?", a: "Dispneia progressiva e o principal sintoma. Considerar DPOC quando ha: dispneia progressiva (pior com esforco, persistente), sibilos recorrentes, tosse cronica, infeccoes respiratorias inferiores recorrentes e fatores de risco (tabagismo, biomassa, ocupacional, genetica)." },
      { q: "Qual a diferenca entre pacientes com DPOC fumantes e nao fumantes apos exacerbacao?", a: "Pacientes com DPOC que fumam NAO melhoram o VEF1 quando se recuperam. Ja pacientes com DPOC que nao fumam podem melhorar o VEF1 quando se recuperam da exacerbacao." },
      { q: "Por que metilxantinas (teofilina, aminofilina) nao sao recomendadas na DPOC?", a: "Nao sao recomendadas devido aos riscos de eventos adversos significativos, com margem terapeutica estreita e potencial de toxicidade. O beneficio nao justifica os riscos na pratica clinica atual." },
      { q: "Qual a definicao clinica de bronquite cronica?", a: "Presenca de tosse com expectoracao por mais de 3 meses ao ano, em 2 anos consecutivos, apos afastar outras causas. E a forma mais comum de DPOC, com hiperplasia de glandulas mucosas, excesso de muco e fibrose." },
      { q: "Quais condicoes clinicas devem ser diferenciadas da DPOC?", a: "Asma (reversibilidade, variacao dos sintomas), ICC (dispneia, edema, congestao), bronquiectasias (expectoracao abundante purulenta cronica) e tuberculose (tosse cronica, emagrecimento, sudorese noturna, historia epidemiologica)." },
      { q: "Qual a fisiopatologia do enfisema e por que ocorre hiperinsuflacao?", a: "Destruicao dos septos alveolares e do leito capilar reduz a elasticidade pulmonar, dificultando a expulsao do ar e causando aprisionamento (hiperinsuflacao). O alargamento e permanente e anormal dos espacos aereos distais ao bronquiolo terminal, com destruicao das paredes alveolares sem fibrose obvia." },
      { q: "Por que a DPOC e subdiagnosticada?", a: "Queixas respiratorias inespecificas ou subvalorizadas, acesso limitado a espirometria, desigualdades no acesso a saude e baixa percepcao de risco pelos pacientes (adaptam atividades para minimizar dispneia). O GOLD 2026 reforça a busca ativa por casos." },
      { q: "Qual o papel da ventilacao mecanica invasiva na DPOC?", a: "Deve ser evitada ao maximo, reservada para falha total das medidas anteriores (VNI, CNAF, oxigenoterapia). A intubacao e VMI trazem riscos significativos nessa populacao, incluindo dificuldade de desmame. A VNI e a primeira escolha para suporte ventilatorio." },
      { q: "Quais sao os percentuais de VEF1 para a classificacao GOLD 1 a 4?", a: "GOLD 1 (leve): VEF1 >= 80% do previsto. GOLD 2 (moderada): 50-79%. GOLD 3 (grave): 30-49%. GOLD 4 (muito grave): <30% do previsto. Todos requerem VEF1/CVF pos-BD <0,7 para confirmar DPOC." },
      { q: "Qual a dose e duracao de corticosteroide sistemico na exacerbacao da DPOC?", a: "Ambulatorial: Prednisolona (ou Prednisona) 40 mg/dia VO por 5 dias. Hospitalar: Metilprednisolona 0,5 a 1 mg/kg a cada 6-8 horas IV. O uso pode ser guiado por eosinofilos sericos no paciente estavel, mas na exacerbacao grave e indicado para todos." },
      { q: "Qual o limiar de eosinofilos para considerar ICS na DPOC?", a: "Eosinofilos >300 celulas/mcL: considerar iniciar tripla terapia (ICS + LABA + LAMA), especialmente no grupo E. Os ICS nao tem papel na reducao de sintomas da DPOC, mas podem reduzir exacerbacoes. Ha relacao direta entre beneficio do ICS e contagem de eosinofilos." },
      { q: "Quais os criterios para classificar exacerbacao da DPOC como moderada (Criterios de Roma)?", a: "Pelo menos 3 de 5 criterios: 1) Dispneia EVA >= 5; 2) FR >= 24 irpm; 3) FC >= 95 bpm; 4) SpO2 <92% (ou variacao >3%); 5) PCR >= 10 mg/L. A exacerbacao grave adiciona gasometria com PaO2 <= 60 e/ou PaCO2 >45 com pH <7,35." },
      { q: "Quais os criterios gasometricos que definem exacerbacao grave da DPOC?", a: "Hipoxemia (PaO2 <= 60 mmHg) e/ou hipercapnia com acidose (PaCO2 >45 mmHg e pH <7,35). A presenca desses achados, alem dos criterios da forma moderada, classifica como grave e geralmente indica hospitalizacao." },
      { q: "Quais os indicadores para VNI na exacerbacao da DPOC?", a: "Pelo menos um dos seguintes: 1) Acidose respiratoria com PaCO2 >= 45 mmHg e pH <= 7,35; 2) Dispneia grave; 3) Hipoxemia persistente apesar da oxigenoterapia suplementar. A VNI e a primeira escolha para suporte ventilatorio." },
      { q: "Qual o mecanismo da retencao de CO2 por oxigenio em alto fluxo na DPOC?", a: "Na DPOC grave, o estimulo respiratorio depende parcialmente da hipoxemia (drive hipoxemico). Oferecer O2 em alto fluxo remove esse estimulo, causando hipoventilacao. Associado a efeito Haldane (O2 desloca CO2 da hemoglobina) e aumento do espaco morto por redistribuicao V/Q." },
      { q: "O que caracteriza o fenotipo Blue Bloater na DPOC?", a: "Blue Bloater e o fenotipo da bronquite cronica: cianose, edema periferico, tosse produtiva copiosa. Fisiopatologia: obstrucao diminui ventilacao, com aumento do DC e perfusao pulmonar como compensacao, levando a hipoxemia, hipercapnia e eventualmente vasoconstricao pulmonar/cor pulmonale." },
      { q: "O que caracteriza o fenotipo Pink Puffer na DPOC?", a: "Pink Puffer e o fenotipo do enfisema: dispneia intensa, torax em tonel, uso de musculatura acessoria. Fisiopatologia: destruicao dos septos pulmonares piora oxigenacao, com diminuicao do DC, hiperventilacao compensatoria e menor perfusao. Hipoxemia tecidual sem cianose pela hiperventilacao." },
      { q: "Quais os fatores de risco para exacerbacoes repetidas na DPOC?", a: "Maior idade, gravidade da DPOC (maior dispneia, menor VEF1, baixa PaO2), HISTORIA PREVIA DE EXACERBACAO (PRINCIPAL), maior inflamacao das vias aereas e sistemica, carga bacteriana na fase estavel, hipersecrecao bronquica cronica, e comorbidades (cardiovascular, miopatia, ansiedade-depressao, DRGE)." },
      { q: "Qual a definicao temporal da exacerbacao da DPOC?", a: "Evento agudo com piora dos sintomas respiratorios habituais em periodo inferior a 14 dias (media 7 a 10 dias). Inclui aumento da dispneia, tosse e/ou producao de secrecao. Pode ter taquipneia e taquicardia. Envolve aumento da inflamacao local e sistemica." },
      { q: "Qual a epidemiologia das exacerbacoes e mortalidade intra-hospitalar na DPOC?", a: "2 a 3 exacerbacoes por ano em media. Mortalidade intra-hospitalar de cerca de 10%. Metade dos pacientes reinterna dentro de 6 meses. As exacerbacoes tambem aumentam o risco cardiovascular." },
      { q: "Como e feita a avaliacao ABE na DPOC?", a: "Primeiro avalia-se risco de exacerbacoes: alto risco (>=1 hospitalizacao ou >=2 idas ao PS) = grupo E. Se risco baixo, avalia-se intensidade dos sintomas: mMRC >= 2 ou CAT >= 10 = grupo B; mMRC <2 e CAT <10 = grupo A." },
      { q: "Quais os 7 subtipos etiologicos da DPOC (classificacao G/D/C/P/I/A/U)?", a: "G-DPOC: genetica (deficiencia alfa-1 AT). D-DPOC: desenvolvimento (prematuridade, PIG). C-DPOC: cigarro (tabaco, cannabis, passivo). P-DPOC: poluicao (ambiental, biomassa). I-DPOC: infeccao (TB, HIV). A-DPOC: asma na infancia. U-DPOC: indefinido/nao identificado." },
      { q: "Por que o diagnostico de 'DPOC presumido' baseado apenas em dados clinicos e perigoso?", a: "Historia e exame fisico nao sao bons preditores de obstrucao ao fluxo aereo. Estudos mostram que muitos pacientes tratados para DPOC sem espirometria nao tem obstrucao quando realizam o exame. O diagnostico deve ser confirmado com espirometria (VEF1/CVF pos-BD <0,7)." },
      { q: "Quais as indicacoes clinicas para considerar DPOC e realizar espirometria?", a: "Dispneia progressiva (pior com esforco e persistente), sibilos recorrentes, tosse cronica (intermitente, pode nao ter secrecao), infeccoes respiratorias inferiores recorrentes e fatores de risco (tabagismo, biomassa, ocupacional, genetica). Secrecao excessiva sugere bronquiectasia." },
      { q: "Qual o enfisema parasseptal e por que e clinicamente importante?", a: "Enfisema parasseptal acomete a regiao periferica (subpleural) e esta associado a bolhas e risco de pneumotorax espontaneo. Diferencia-se do centrolobular (tabagismo, lobos superiores) e do panlobular (deficiencia de alfa-1 AT, lobos inferiores)." },
      { q: "Qual a frequencia e alvo da espirometria de seguimento na DPOC?", a: "A espirometria deve ser repetida anualmente para avaliar a progressao da obstrucao. Os valores utilizados sao VEF1 e CVF pos-broncodilatador. A relacao VEF1/CVF pos-BD <0,7 confirma obstrucao nao totalmente reversivel." },
      { q: "Quais sao os objetivos do tratamento da DPOC?", a: "Reduzir sintomas (alivio, melhorar tolerancia ao exercicio e estado geral) E reduzir riscos (prevenir progressao da doenca, evitar e tratar exacerbacoes, diminuir mortalidade)." },
      { q: "Quais as medidas nao farmacologicas que reduzem mortalidade na DPOC?", a: "Cessar tabagismo, vacinacao (influenza, pneumococica, COVID), reabilitacao pulmonar, oxigenoterapia domiciliar (para hipoxemia cronica), ventilacao nao invasiva (em pacientes selecionados) e cirurgias (reducao de volume pulmonar, transplante)." },
      { q: "Qual a primeira escolha de broncodilatador na exacerbacao aguda da DPOC?", a: "SABA (beta-2 agonista de curta duracao) com ou sem SAMA (anticolinergico de curta duracao) sao a terapia inicial e essencial. Sao as recomendacoes iniciais para manejo dos sintomas agudos na exacerbacao. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "dress",
    name: "DRESS",
    cards: [
      { q: "O que e a DRESS e qual sua premissa fisiopatologica unificadora?", a: "DRESS e uma reacao adversa medicamentosa com eosinofilia e sintomas sistemicos. Sua premissa unificadora e a cascata bifasica: a resposta de linfocitos T ao farmaco produz imunodeficiencia funcional, permitindo reativacao de herpesvirus latentes, que desencadeia uma segunda resposta T antiviral somada a primeira." },
      { q: "Qual a latencia tipica entre o inicio do farmaco e o inicio da DRESS?", a: "A latencia e de 2 a 8 semanas. No RegiSCAR, a latencia media foi de 28 +/- 17 dias para farmacos com causalidade provavel ou muito provavel. Farmacos tomados por menos de 2 semanas ou mais de 3 meses dificilmente sao os culpados." },
      { q: "Qual a incidencia estimada da DRESS e sua letalidade?", a: "A incidencia e estimada em 0,9 a 2 casos por 100.000 pacientes/ano. Para antiepilepticos de alto risco, e de 1:1.000 a 1:10.000 exposicoes. A letalidade varia de 2 a 10%, dependendo do desenho do estudo." },
      { q: "Quais sao os farmacos de ALTO RISCO para DRESS e qual percentual dos casos eles representam?", a: "Respondem por ~75% dos casos: alopurinol, antiepilepticos aromaticos (carbamazepina, fenitoina, lamotrigina, oxcarbazepina, fenobarbital), sulfonamidas (sulfassalazina, dapsona, SMX-TMP), vancomicina, minociclina, nevirapina, antituberculose e mexiletina. No RegiSCAR: antiepilepticos 36%, alopurinol 18%, sulfonamidas 12%." },
      { q: "Quais sao as duas rotas pelas quais um farmaco pequeno se torna antigeno na DRESS?", a: "Rota do hapteno: o farmaco liga-se covalentemente a uma proteina propria e o conjugado e apresentado como peptideo estranho. Rota p-i (pharmacological interaction): o farmaco liga-se de forma nao covalente diretamente a fenda do MHC ou ao TCR, sem processamento previo." },
      { q: "Quais sao os tres filtros que determinam quem desenvolve DRESS?", a: "1) Disponibilidade do farmaco (farmacocinetica) - ex: comprometimento renal aumenta risco com alopurinol. 2) Metabolismo (farmacogenetica das enzimas) - ex: acetiladores lentos e sulfonamidas. 3) Apresentacao (farmacogenetica do HLA) - o alelo HLA determina se o farmaco forma o complexo ternario farmaco-MHC-TCR." },
      { q: "Qual a relacao entre HLA-B*58:01 e alopurinol, e qual o valor preditivo do teste?", a: "HLA-B*58:01 esta associado a DRESS por alopurinol em chineses Han, europeus, tailandeses e coreanos. O valor preditivo negativo aproxima-se de 100%, mas o positivo varia de 1 a 50%. O alelo e necessario mas nao suficiente - os outros filtros precisam se alinhar." },
      { q: "Quais outros alelos HLA estao associados a DRESS e com quais farmacos?", a: "HLA-A*31:01 e carbamazepina (europeus, japoneses, chineses Han); HLA-A*32:01 e vancomicina (europeus); HLA-B*13:01 e dapsona/cotrimoxazol (tailandeses, chineses); HLA-B*53:01 e raltegravir (africanos, hispanicos)." },
      { q: "De onde vem a eosinofilia na DRESS? Qual o mecanismo?", a: "A resposta na DRESS tem inclinacao Th2 com aumento da expressao de IL-5. O efeito sinergico da IL-5 com a TARC (CCL17) produz eosinofilia periferica e tecidual. A IL-5 promove hematopoese eosinofilica e a TARC recruta celulas CCR4+ para os tecidos." },
      { q: "Qual o papel da reativacao viral na DRESS e quais virus estao envolvidos?", a: "A reativacao de Herpesviridae ocorre em ate 75% dos pacientes. HHV-6 e o mais comum (16-60%). Em ate 30% ha reativacoes sequenciais multiplas: HHV-6, depois EBV, depois HHV-7, depois CMV. A reativacao de CMV associa-se a desfechos piores." },
      { q: "Quais sao as manifestacoes cutaneas da DRESS e qual sua frequencia?", a: "Exantema maculopapular em 97% dos casos, com distribuicao simetrica em tronco e extremidades, acometendo >50% da SC em ~80%. Edema facial em 39-70% (achado caracteristico). Envolvimento mucoso em ate 50%, tipicamente leve (diferente da SJS/NET). Erupcao ausente em ate 3%." },
      { q: "Quais sao os achados laboratoriais mais frequentes na DRESS?", a: "Leucocitose (95%), eosinofilia >700/mcL (82-95%), neutrofilia (78%), monocitose (69%), febre >=38,5C (75-90%), linfadenopatia (54-65%), linfocitos atipicos (35-67%). Trombocitopenia em 25% e hemofagocitose em 5-24%." },
      { q: "Qual o orgao interno mais frequentemente acometido na DRESS e quais os padroes?", a: "O figado, em 53 a 90% dos casos. Padroes: colestatico (37%), hepatocelular (19%), misto (27%). Ate 50% tem enzimas >10x o LSN. E a principal causa de morte junto com o acometimento cardiaco. Insuficiencia hepatica aguda pode exigir transplante." },
      { q: "Qual a frequencia e a importancia do acometimento cardiaco na DRESS?", a: "Ocorre em 2 a 20% dos casos. Dois padroes histologicos: miocardite de hipersensibilidade (melhor prognostico) e miocardite eosinofilica necrosante aguda (mortalidade >50%). O acometimento pode surgir ate 371 dias apos a exposicao ao farmaco." },
      { q: "Qual a frequencia do acometimento renal na DRESS e qual o padrao histologico?", a: "NIA em 10-30%, LRA em ate 8%, dialise em ate 3%. A histologia e de nefrite tubulointersticial com edema e infiltrado de linfocitos, histiocitos, eosinofilos e plasmocitos. E mais comum na DRESS por alopurinol." },
      { q: "Quais sao os criterios de classificacao de gravidade da DRESS (leve, moderada, grave)?", a: "LEVE: sem envolvimento renal/pulmonar/cardiaco, transaminases <4x LSN. MODERADA: Hb 7-10, neutrofilos 500-1500, plaquetas 50-100 mil, creatinina >2,99 ou 1,5x LSN, enzimas 4-15x LSN. GRAVE: citopenias graves (Hb<7, neutro<500, plaq<50mil), hemofagocitose, eosinofilia >=1500, enzimas >15x LSN, envolvimento cardiaco/pulmonar/neurologico." },
      { q: "O que e o escore RegiSCAR e como ele e interpretado?", a: "E o sistema de pontuacao do Registro Europeu de Reacoes Adversas Cutaneas Graves. Pontua febre, linfonodos, eosinofilia, linfocitos atipicos, exantema, biopsia, envolvimento de orgaos, duracao e exclusao de outras causas. Score <2: excluida; 2-3: possivel; 4-5: provavel; >=6: definido." },
      { q: "Quais sao os 7 criterios japoneses de DIHS e como se diferem do RegiSCAR?", a: "1) Exantema >3 semanas apos farmaco; 2) Sintomas prolongados apos suspensao; 3) Febre >38C; 4) ALT >100; 5) Alteracoes leucocitarias; 6) Linfadenopatia; 7) Reativacao de HHV-6. DIHS tipico = 7/7, atipico = 5/7. A principal diferenca e que DIHS exige reativacao de HHV-6, enquanto o RegiSCAR nao a inclui." },
      { q: "Por que a biopsia cutanea nao confirma o diagnostico de DRESS?", a: "A histopatologia e heterogenea e inespecifica, mimetizando exantema morbiliforme simples. Infiltracao dermica de eosinofilos aparece em apenas 20-70% dos casos. No escore RegiSCAR, biopsia compativel vale 0 pontos - ela so pode tirar ponto se for incompativel." },
      { q: "Qual a medida terapeutica universal e esteio do tratamento da DRESS?", a: "A identificacao e retirada imediata do farmaco causador. E a unica medida considerada esteio do tratamento em TODOS os pacientes, qualquer gravidade. Deve-se evitar reintroducao por toda a vida e evitar farmacos de reacao cruzada." },
      { q: "Qual o tratamento da DRESS leve?", a: "Corticoide topico de alta ou muito alta potencia (grupos 1 e 2 da classificacao americana), aplicado 2-3 vezes/dia ate resolucao da erupcao (GRADE 2C). Pacientes tratados com topico tiveram menor incidencia de recaida, reativacao viral e sepse comparados aos tratados com corticoide sistemico." },
      { q: "Qual o tratamento da DRESS grave com corticoide sistemico?", a: "Prednisona ou equivalente 0,5 a 1 mg/kg/dia VO ate melhora clinica e normalizacao laboratorial, seguido de desmame lento em 8-12 semanas ou mais (GRADE 2C). Indicado para envolvimento hematologico, renal ou hepatico grave, ou de coracao, pulmao ou SNC." },
      { q: "Por que a pulsoterapia com metilprednisolona NAO e recomendada na DRESS?", a: "Em revisao sistematica de 299 casos japoneses, a pulsoterapia (250-500 mg/dia IV por 2-4 dias) associou-se a: OR 2,1 para reativacao de CMV, OR 4,4 para persistencia da doenca, OR 4,7 para mortalidade. E mecanisticamente coerente: mais imunossupressao leva a mais reativacao viral." },
      { q: "Qual o papel da ciclosporina no tratamento da DRESS e qual sua dose?", a: "E a segunda linha preferencial para DRESS refrataria a corticoide (GRADE 2C). Dose: 3-5 mg/kg/dia VO divididos em 2 tomadas por 7 dias, seguidos de desmame em 7-14 dias. CONTRAINDICADA se houver envolvimento renal ou DRC previa." },
      { q: "Quais sao as alternativas terapeuticas anedonticas para DRESS refrataria?", a: "Inibidores de JAK (tofacitinibe 10 mg/dia), anti-IL-5 (benralizumabe, mepolizumabe, reslizumabe) e ciclofosfamida como ultimo recurso. IGIV NAO e recomendada - estudo aberto em 6 adultos foi interrompido por excesso de eventos adversos em 5 pacientes." },
      { q: "Quando esta indicada a terapia antiviral na DRESS?", a: "O uso rotineiro NAO e recomendado. Ganciclovir ou valganciclovir sao justificados apenas com: PCR com alta carga viral de EBV/CMV/HHV-6 + evidencia de dano de orgao induzido pelo virus + suspeita de complicacao grave de causa viral. PCR positiva isolada nao e indicacao." },
      { q: "Por que antibioticos empiricos devem ser evitados na DRESS?", a: "A DRESS provoca polissensibilizacao a multiplos farmacos. Recidivas podem ser desencadeadas por farmacos estruturalmente diferentes do original. A amoxicilina aumenta a replicacao do HHV-6 in vitro e ha relatos de flare induzido por ela. O antibiotico prescrito para a febre da DRESS pode ser o gatilho da proxima onda." },
      { q: "Quais antiepilepticos sao seguros para uso em paciente com DRESS por carbamazepina?", a: "Agentes nao aromaticos: topiramato, gabapentina ou levetiracetam. O acido valproico e nao aromatico (sem reatividade cruzada), porem aumenta a replicacao de HHV-6 e CMV in vitro, devendo-se preferir as outras opcoes durante a fase aguda." },
      { q: "Qual o achado laboratorial de maior valor prognostico na DRESS?", a: "A reativacao de CMV detectada durante o curso da doenca associa-se a desfechos piores. Nenhum preditor prognostico claro de gravidade na apresentacao inicial foi determinado - Cacoub comparou os 9 casos fatais com os sobreviventes sem encontrar diferenca significativa." },
      { q: "Qual o desempenho do teste de transformacao linfocitaria (TTL) na identificacao do farmaco culpado?", a: "Sensibilidade de 73%, especificidade de 82%. RV+ ~4,1 e RV- ~0,33. E melhor executado na fase de recuperacao (meses depois da decisao clinica aguda). O teste de contato e invariavelmente negativo para alopurinol - neste caso, a causalidade se estabelece por cronologia e perfil de risco." },
      { q: "Qual o significado da hipogamaglobulinemia na DRESS?", a: "E descrita como sinal precoce da DRESS. Reflete a expansao de linfocitos T reguladores na fase aguda, com reducao de celulas B e imunoglobulinas circulantes. Essa janela de imunodeficiencia funcional e o que permite a reativacao de herpesvirus latentes (fase II da cascata bifasica)." },
      { q: "Por que a DRESS continua evoluindo apos a retirada do farmaco?", a: "Porque a doenca e uma cascata bifasica: a fase I (resposta T ao farmaco) cria uma janela de imunodeficiencia que permite a fase II (reativacao viral), gerando uma segunda resposta T antiviral. A fase II e autonoma - nao depende mais da presenca do farmaco. Isso explica tambem os flares tardios." },
      { q: "Qual a 'armadilha do ultimo farmaco' na DRESS?", a: "No RegiSCAR, a mediana foi de 5 farmacos por paciente no mes anterior. A tentacao e culpar o mais recente, mas frequentemente e o antibiotico prescrito para tratar a febre da propria DRESS. O culpado costuma ser o farmaco iniciado 2-8 semanas antes, nao o de ontem." },
      { q: "Por que a DRESS e frequentemente diagnosticada como infeccao?", a: "Tres caracteristicas conspiram: 1) Latencia longa (2-8 semanas) faz o medico descartar o farmaco. 2) Apresentacao sistemica inespecifica (febre, exantema, linfadenopatia) parece sepse ou virose. 3) A doenca continua evoluindo apos suspensao do farmaco, quebrando a intuicao de que retirar a causa resolve o efeito." },
      { q: "Quais sao as sequelas autoimunes tardias da DRESS?", a: "A DRESS pode levar a sequelas autoimunes anos depois, incluindo disfuncao tireoidiana e diabetes mellitus tipo 1. Isso e dedutivel da cascata bifasica: a ativacao imunologica sustentada e a polissensibilizacao podem gerar autoimunidade cronica." },
      { q: "Qual a reatividade cruzada entre antiepilepticos aromaticos na DRESS?", a: "A reatividade cruzada e bem documentada entre os aromaticos: carbamazepina, fenitoina, lamotrigina, oxcarbazepina e fenobarbital. Pacientes com DRESS por um deles devem evitar todos os outros e receber agentes nao aromaticos quando necessitarem de anticonvulsivante." },
      { q: "Qual a relacao entre DRESS e NIA (nefrite intersticial aguda)?", a: "A NIA ocorre em 10-30% dos casos de DRESS. A histologia renal da DRESS e literalmente a da NIA. A diferenca e que na DRESS a NIA e manifestacao renal de reacao sistemica. A triade classica da NIA (febre, exantema, eosinofilia), pouco sensivel para NIA isolada, e na DRESS a apresentacao-padrao." },
      { q: "Por que a disfuncao renal previa e fator de risco para DRESS por alopurinol?", a: "Porque a disfuncao renal reduz a depuracao do oxipurinol (metabolito ativo do alopurinol), aumentando a exposicao ao farmaco. A relacao e bidirecional: o rim e tanto fator de risco quanto orgao-alvo. Essa e a razao para nao prescrever alopurinol para hiperuricemia assintomatica." },
      { q: "Como a DRESS se diferencia da SJS/NET no envolvimento mucoso?", a: "Na DRESS, o envolvimento mucoso e tipicamente leve, sem descolamento, ocorrendo em ate 50% dos casos. Na SJS/NET, o envolvimento mucoso grave em multiplos sitios ocorre em mais de 90% dos casos. Essa diferenca e um criterio importante no diagnostico diferencial das SCAR." },
      { q: "Qual o significado da hemofagocitose na DRESS?", a: "Ocorre em 5-24% dos casos e e marcador de gravidade. A DRESS e um imitador importante de HLH (linfohistiocitose hemofagocitica). Classifica o caso como grave e indica corticoide sistemico." },
      { q: "Quais sao os cuidados de seguimento apos resolucao da DRESS?", a: "Monitorizar funcao de orgaos por meses (acometimento cardiaco pode surgir ate 371 dias depois). Realizar teste de contato 6 semanas a 6 meses apos resolucao. Rotular alergia em prontuario e fornecer cartao de alerta. Vigiar sequelas autoimunes tardias (tireoide, diabetes tipo 1)." },
      { q: "Por que se diz que as tres fontes principais sobre DRESS nao sao independentes entre si?", a: "O autor senior do artigo de Cacoub (Roujeau) e coautor de boa parte da literatura do RegiSCAR citada pelas outras fontes, e a editora de secao do UpToDate (Mockenhaupt) e autora do segundo artigo. Concordancia entre elas nao e validacao cruzada - e o mesmo grupo europeu falando tres vezes, limitacao estrutural de doencas raras." },
      { q: "Qual o acometimento pulmonar na DRESS e quando esta mais indicado o corticoide?", a: "Ocorre em ate 30% dos casos: pneumonite intersticial aguda, pneumonia intersticial linfocitica, pleurite, SDRA. TC mostra infiltrados intersticiais e derrames pleurais. Junto com o acometimento renal, e a situacao em que o consenso de especialistas mais claramente apoia o corticoide sistemico." },
      { q: "A eosinofilia pode estar ausente na DRESS?", a: "Sim. A eosinofilia >700/mcL ocorre em 82-95% dos casos, mas pode estar ausente em um subgrupo. Sua ausencia nao exclui o diagnostico. A DRESS e um processo dinamico: um paciente sem eosinofilia no dia 3 pode te-la em 3.000/mcL no dia 10." },
      { q: "Qual a evidencia sobre o rastreio genetico pre-alopurinol em Taiwan?", a: "Estudo taiwanes prospectivo com 2.926 pacientes: 571 (20%) HLA-B*58:01 positivos receberam alternativa. Nenhuma reacao cutanea grave nos negativos (7 esperados pela incidencia historica). E coorte com controle historico (nao ECR), mas a plausibilidade mecanistica e forte e o rastreio e barato. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "drge",
    name: "DRGE",
    cards: [
      { q: "O que é DRGE 'acionável' segundo o Consenso de Lyon 2.0?", a: "É a DRGE que requer evidência conclusiva de patologia relacionada ao refluxo na endoscopia e/ou monitoramento anormal do refluxo, na presença de sintomas compatíveis e incômodos. Justifica supressão ácida prolongada, escalonamento terapêutico ou intervenção cirúrgica." },
      { q: "Por que a resposta ao IBP não é considerada diagnóstica de DRGE pelo Lyon 2.0?", a: "Porque o efeito placebo do IBP é de 10-25%, e sintomas de pirose e dor torácica podem surgir de distúrbios motores (acalásia) ou distúrbios de interação intestino-cérebro (DGBI). A resposta ao IBP é um confundidor sistemático." },
      { q: "Quais são os três mecanismos principais pelos quais ocorrem episódios de refluxo gastroesofágico?", a: "(a) Relaxamentos transitórios do EEI (RTEEI) — predominante na DRGE não erosiva; (b) Hipotonia basal do EEI; (c) Disrupção anatômica da JEG (hérnia hiatal), que permite refluxo durante aumento de pressão abdominal e cria 'acid pocket'." },
      { q: "Por que a regurgitação responde pior ao IBP do que a pirose?", a: "A pirose é mediada pela ação do ácido sobre nociceptores esofágicos (tratável pelos IBPs). A regurgitação depende do volume de material refluído — os episódios de refluxo não cessam com IBP, apenas se tornam fracamente ácidos ou não ácidos. O mecanismo é volumétrico, não apenas ácido." },
      { q: "O que é o MNBI e qual seu valor no diagnóstico de DRGE?", a: "MNBI (Mean Nocturnal Baseline Impedance) é a impedância basal noturna média da mucosa esofágica. Mucosa íntegra = alta impedância (>2500 ohms); mucosa danificada = baixa impedância (<1500 ohms). Reflete dano crônico acumulado e é métrica adjuntiva do Lyon 2.0." },
      { q: "Quais são os dois mecanismos pelos quais o refluxo pode causar sintomas extraesofágicos?", a: "(a) Reflexo vagal esofagobrônquico — o refluxo ácido estimula terminações nervosas aferentes no esôfago distal que, via vago, desencadeiam broncoespasmo; (b) Microaspiração — o material refluído alcança as vias aéreas superiores causando dano direto." },
      { q: "O que é a dilatação dos espaços intercelulares (DIS) e qual sua correlação funcional?", a: "DIS é uma alteração ultraestrutural detectável por microscopia eletrônica que precede a erosão visível, causada pelo dano do refluxo ácido às junções intercelulares. Sua correlação funcional é a impedância basal da mucosa esofágica — mucosa danificada tem impedância <1500 ohms." },
      { q: "Por que o grau A de Los Angeles é considerado borderline/inconclusivo pelo Lyon 2.0?", a: "Porque erosões LA grau A são encontradas em 5-7,5% de voluntários saudáveis assintomáticos, têm concordância interobservador limitada (kappa 0,65) e AET médio não significativamente diferente da DRGE não erosiva." },
      { q: "Descreva os graus C e D da Classificação de Los Angeles.", a: "Grau C: erosões confluentes envolvendo <75% da circunferência esofágica. Grau D: erosões envolvendo >75% da circunferência. Ambos são conclusivos para DRGE em todos os consensos." },
      { q: "Por que a endoscopia na DRGE não comprovada deve ser feita OFF IBP?", a: "Os IBPs cicatrizam a mucosa em ~80% dos casos, reduzindo drasticamente a chance de encontrar esofagite significativa. A suspensão deve ser por 2-4 semanas (idealmente 4). Fazer endoscopia ON IBP pode levar a sub-diagnóstico — o paciente é erroneamente classificado como 'endoscopia normal'." },
      { q: "Quando a endoscopia deve ser feita ON IBP na DRGE?", a: "Na DRGE comprovada com sintomas refratários. Esofagite LA B, C ou D encontrada na vigência de IBP otimizado por 8 semanas constitui evidência de DRGE refratária, indicando controle insuficiente do refluxo ácido." },
      { q: "Qual a diferença entre DRGE não comprovada e DRGE comprovada segundo o Lyon 2.0?", a: "DRGE não comprovada: sem evidência conclusiva prévia — pergunta clínica: 'Este paciente TEM DRGE?' — testes OFF terapia. DRGE comprovada: evidência prévia de esofagite LA B-D, Barrett ou AET anormal — pergunta: 'Por que os sintomas PERSISTEM?' — testes ON terapia." },
      { q: "Qual a modalidade de teste preferida na DRGE não comprovada?", a: "pHmetria wireless prolongada (96h) off IBP, ou pH/pH-impedância off IBP. O teste OFF terapia permite medir a exposição ácida real, sem mascaramento pelos IBPs." },
      { q: "Qual a modalidade de teste indicada na DRGE comprovada com sintomas refratários?", a: "pH-impedância ON IBP otimizado. É a única modalidade que detecta refluxo não ácido persistente (fracamente ácido ou não ácido), que os IBPs não eliminam." },
      { q: "Quais os limiares de AET na pH-impedância off IBP para diagnóstico de DRGE?", a: "AET >6% = diagnóstico conclusivo de DRGE. AET 4-6% = borderline (necessita métricas adjuntivas). AET <4% = fisiológico (exceção: refluxo não ácido significativo)." },
      { q: "Na pHmetria wireless prolongada, quais resultados excluem DRGE?", a: "AET <4% em TODOS os dias + associação refluxo-sintoma negativa = exclui DRGE (100% de concordância no consenso)." },
      { q: "Quais métricas adjuntivas da pH-impedância auxiliam no diagnóstico de DRGE borderline?", a: "Episódios totais de refluxo (>80/dia = adjuntivo para DRGE; <40 = contra DRGE), MNBI (<1500 ohms = adjuntivo para DRGE; >2500 ohms = contra DRGE), e associação refluxo-sintoma (SAP/SI)." },
      { q: "Por que a pHmetria wireless de 96h é preferida sobre a de 24h na DRGE não comprovada?", a: "O AET varia significativamente dia a dia (até 20% dos controles saudáveis têm AET borderline em algum dos 4 dias). A monitorização de 96h permite identificar padrão dominante, com AUC prognóstica maior (0,63 vs 0,57) e odds 10x maiores de descontinuação de IBP se AET <4% em todos os 4 dias." },
      { q: "O que define DRGE refratária acionável na pH-impedância ON IBP?", a: "AET >4% + >80 episódios de refluxo. Essa combinação prediz 85% de satisfação após escalonamento (cirurgia/MSA), com benefício maior para regurgitação predominante (93%) vs. pirose predominante (60%)." },
      { q: "Como o Lyon 2.0 classifica a probabilidade de associação dos sintomas com refluxo?", a: "Alta: pirose, dor torácica esofágica, regurgitação. Intermediária: eructação excessiva, tosse crônica, sibilância/asma. Baixa: rouquidão, globus, náusea, dor abdominal, dispepsia (sem sintomas típicos)." },
      { q: "Qual a conduta para sintomas de baixa probabilidade de associação com refluxo segundo o Lyon 2.0?", a: "Investigação up-front primariamente para excluir refluxo como causa; NÃO iniciar IBP empírico. Rouquidão, globus, náusea e dor abdominal isolados (sem pirose/regurgitação) têm probabilidade muito baixa de relação com refluxo." },
      { q: "O que é a ruminação e como diferenciá-la da regurgitação da DRGE?", a: "Ruminação é um comportamento pós-prandial subconsciente que pode ser confundido com DRGE refratária. Tipicamente cessa quando o material regurgitado se torna ácido. É tratada com terapia comportamental, não com supressão ácida ou cirurgia antirrefluxo." },
      { q: "Quais são as doses padrão dos IBPs para tratamento de DRGE?", a: "Omeprazol 20mg, Lansoprazol 30mg, Pantoprazol 40mg, Rabeprazol 20mg, Esomeprazol 40mg. Dose plena para esofagite leve-moderada, dose dupla para grave, por 6-12 semanas." },
      { q: "Por que os IBPs são superiores aos bloqueadores H2 no tratamento da DRGE?", a: "A célula parietal secreta ácido por três vias (histamina-H2, acetilcolina-M3, gastrina-CCK-B), todas convergindo para a bomba H+/K+-ATPase. Os BH2 bloqueiam apenas uma das três vias, enquanto os IBPs inibem diretamente a via final comum. Cicatrização: IBP >80% vs BH2 ~50% em 8 semanas." },
      { q: "Quais medidas comportamentais têm melhor suporte de evidência na DRGE?", a: "Perda ponderal (associação consistente com redução de sintomas em estudos observacionais) e elevação da cabeceira da cama (15 cm, algum benefício em refluxo noturno). A restrição alimentar universal ('todos devem evitar café, cítricos, chocolate') foi substituída por abordagem individualizada." },
      { q: "Quais são as indicações de cirurgia antirrefluxo segundo a Diretriz Brasileira de 2003?", a: "(a) Falha do tratamento clínico com refluxo comprovado; (b) Necessidade de IBP de manutenção prolongado, especialmente em <40 anos; (c) Impossibilidade financeira de manter IBP a longo prazo. Preferencialmente fundoplicatura laparoscópica." },
      { q: "O que o estudo SHAM de Spechler (NEJM 2019) demonstrou sobre 'DRGE refratária'?", a: "De 366 pacientes com pirose refratária encaminhados para potencial cirurgia, apenas 21% (78 pacientes) tinham refluxo anormal na pH-impedância. Dos operados com refluxo comprovado, 67% melhoraram vs 28% com manejo clínico. Isso mostra que ~80% dos 'refratários' não tinham DRGE." },
      { q: "Por que os IBPs não corrigem o defeito de base da DRGE?", a: "Os IBPs apenas reduzem a acidez do material refluído, mas não corrigem nenhum defeito mecânico: não restauram o tônus do EEI, não reduzem a hérnia hiatal e não modificam os relaxamentos transitórios do EEI. A DRGE recidiva porque trata a consequência (acidez), não a causa (incompetência da barreira)." },
      { q: "Quais são as evidências conclusivas de DRGE reconhecidas por ambos os consensos (Lyon 2.0 e Diretriz Brasileira)?", a: "Esôfago de Barrett comprovado por biópsia e estenose péptica. Ambos são reconhecidos como evidência conclusiva de DRGE, eliminando a necessidade de monitoramento de refluxo adicional para confirmar o diagnóstico." },
      { q: "Qual o risco de adenocarcinoma no esôfago de Barrett?", a: "Estimado em 0,2-2,1% ao ano (nível B). Barrett longo tem maior risco que Barrett curto (<3 cm). Perfil típico: homem, branco, >40 anos." },
      { q: "Qual o seguimento endoscópico recomendado para esôfago de Barrett sem displasia?", a: "Biópsias seriadas a cada 24 meses sem displasia, a cada 6 meses com displasia de baixo grau, e intervenção para displasia de alto grau." },
      { q: "Por que a biópsia esofágica de rotina NÃO é recomendada pelo Lyon 2.0?", a: "A performance é sub-ótima para confirmar ou refutar DRGE. Só é indicada se houver suspeita de esofagite eosinofílica (disfagia, achados endoscópicos). O rendimento para EoE sem disfagia é de 0% e sem alterações endoscópicas de 1,9%." },
      { q: "Qual o papel da hérnia hiatal no diagnóstico de DRGE pelo Lyon 2.0?", a: "É considerada evidência adjuntiva (suporte ao diagnóstico), não diagnóstica isoladamente. Está associada a maior carga de refluxo, criando um reservatório ácido supradiafragmático ('acid pocket')." },
      { q: "Quais as estratégias de manutenção na DRGE segundo a gravidade?", a: "DRGE não erosiva com resposta completa: suspensão do IBP. DRGE erosiva leve (LA A) ou DRGE não erosiva com recidiva: IBP dose mínima eficaz. Esofagite moderada-grave (LA B-D) ou Barrett: IBP dose plena contínuo." },
      { q: "O que é a hipersecreção ácida de rebote após suspensão de IBP?", a: "Fenômeno mediado por hipergastrinemia crônica (resultante do uso prolongado de IBP) que causa sintomas transitórios de refluxo mesmo em pacientes sem DRGE, ao suspender o IBP. Reforça a dificuldade de descontinuação." },
      { q: "Quais as limitações importantes das métricas de impedância segundo o Lyon 2.0?", a: "Há diferenças significativas nos limiares normais entre os sistemas Diversatek (percentil 95 de AET: 2,8%; episódios: 55) e Laborie (percentil 95 de AET: 5,0%; episódios: 78), e variabilidade regional. Um paciente pode ser 'DRGE' num sistema e 'normal' em outro." },
      { q: "O que significa AET 4-6% com episódios de refluxo >80/dia e MNBI <1500 ohms na pH-impedância off IBP?", a: "Embora o AET primário seja borderline, duas métricas adjuntivas convergem para DRGE (episódios elevados + impedância basal baixa). Pelo algoritmo do Lyon 2.0, evidência borderline + métricas adjuntivas favoráveis consolida o diagnóstico de DRGE." },
      { q: "Qual a prevalência de refluxo em asmáticos segundo a Diretriz Brasileira de 2003 e por que isso é problemático?", a: "A diretriz cita 30-89%, faixa extremamente ampla que reflete heterogeneidade dos estudos. Meta-análises de RCTs (Zheng et al., BMJ Open 2021) demonstram benefício marginal e inconsistente de IBP na asma — associação epidemiológica não se traduz em benefício terapêutico." },
      { q: "Qual a concordância entre AET nos graus B e C da esofagite de Los Angeles nos estudos de validação?", a: "Rusu et al. (Gut 2021): AET médio grau B 8,23% vs grau C 9,95% (pHmetria wireless). Visaggi et al. (AJG 2023): AET grau B 6,0% vs grau C 8,7% (pH-impedância). Armstrong et al. (1996): AET B 13,7% vs C 11,7%. Resposta ao IBP similar (74% vs 70%)." },
      { q: "Por que a associação IBP + BH2 NÃO melhora a cicatrização esofágica na DRGE?", a: "Como os IBPs já inibem diretamente a via final comum (bomba H+/K+-ATPase), a via H2 já está relativamente suprimida. A exceção parcial é o BH2 noturno para 'acid breakthrough', mas estudos mostraram taquifilaxia com uso prolongado." },
      { q: "Qual a diferença conceitual entre os limiares diagnósticos do AET no Lyon 2.0?", a: "Limiares diagnósticos são convenções operacionais que refletem distribuições estatísticas em populações estudadas, não leis biológicas. Um paciente com AET 5,8% não é fundamentalmente diferente de outro com 6,2%. A zona borderline (4-6%) existe justamente para evitar sobre/subdiagnóstico." },
      { q: "A quais pacientes se indica pHmetria na DRGE com sintomas extraesofágicos isolados?", a: "A todos. O Lyon 2.0 contraindica o teste empírico com IBP para sintomas extraesofágicos isolados (rouquidão, globus, tosse crônica sem pirose). Esses pacientes devem ser investigados com testes objetivos (pH-impedância, pHmetria wireless) antes de iniciar terapia." },
      { q: "Qual a diferença entre hipersensibilidade ao refluxo e DRGE na pHmetria wireless?", a: "AET <4% em todos os dias + associação refluxo-sintoma POSITIVA = hipersensibilidade ao refluxo (considerar neuromoduladores). Na DRGE, o AET é >6% em ≥2 dias. A hipersensibilidade tem carga de refluxo fisiológica, mas o paciente é mais sensível aos episódios. Material gerado a partir dos resumos de estudo — AC1 Clínica Médica 2026/2" },
    ]
  },
  {
    id: "dup",
    name: "Doença Ulcerosa Péptica",
    cards: [
      { q: "O que define uma úlcera péptica histologicamente?", a: "É um defeito na mucosa gástrica ou duodenal que se estende através da muscular da mucosa até camadas mais profundas da parede. Desenvolve-se quando o equilíbrio entre fatores agressivos (ácido, pepsina, sais biliares) e fatores protetores (muco-bicarbonato, fluxo sanguíneo, prostaglandinas) é rompido." },
      { q: "Quais são os três níveis de defesa da mucosa gástrica?", a: "(1) Camada de muco-bicarbonato (gradiente de pH da superfície luminal ácida até a epitelial quase neutra); (2) Epitélio de superfície com junções apertadas e renovação celular rápida; (3) Fluxo sanguíneo da mucosa (fornece O2, nutrientes, bicarbonato e remove H+)." },
      { q: "Qual a cascata fisiopatológica da úlcera duodenal por H. pylori?", a: "Gastrite predominantemente antral → supressão de somatostatina nas células D antrais (por IL-1β, TNF-α) → desinibição de gastrina → hipergastrinemia → hipersecreção ácida → excesso ácido no duodeno → metaplasia gástrica duodenal → colonização por H. pylori → duodenite → úlcera." },
      { q: "Por que o H. pylori NÃO infecta a mucosa duodenal normal?", a: "O H. pylori tem tropismo pelo epitélio gástrico. Para colonizar o duodeno, é necessário que ocorra metaplasia gástrica duodenal (substituição do epitélio duodenal normal por epitélio de tipo gástrico), causada pelo excesso de ácido que chega ao duodeno." },
      { q: "Qual a diferença de desfecho clínico entre gastrite predominantemente antral e pangastrite por H. pylori?", a: "Gastrite antral (10-15% dos infectados): ↑ secreção ácida (↓ somatostatina → ↑ gastrina) → úlcera DUODENAL. Pangastrite (maioria): ↓ secreção ácida (atrofia de células parietais) → úlcera GÁSTRICA, atrofia, ↑ risco de câncer gástrico." },
      { q: "Como os AINEs causam lesão da mucosa gastroduodenal?", a: "Mecanismo duplo: (1) Efeito sistêmico (principal): inibição de COX-1 → ↓ PGE2/PGI2 → ↓ muco, bicarbonato, fluxo sanguíneo e ↑ secreção ácida; (2) Efeito tópico: lesão direta do epitélio por AINEs não ionizados em pH ácido. O efeito sistêmico é principal — AINEs parenterais/retais causam úlceras igualmente." },
      { q: "Por que tratar apenas o ácido (com IBP) é insuficiente na DUP a longo prazo?", a: "Porque a DUP recorre quando a causa subjacente persiste. Se o H. pylori não foi erradicado, a cascata gastrite → hipergastrinemia → hipersecreção ácida permanece ativa. Se os AINEs não foram suspensos, a inibição de prostaglandinas protetoras continua. A supressão ácida trata a consequência, não a causa." },
      { q: "Qual a incidência de DUP na população geral e em infectados por H. pylori?", a: "Incidência agrupada de DUP não complicada: ~1/1.000 pessoas-ano na população geral. Em infectados por H. pylori: ~1%/ano (6 a 10 vezes maior que em não infectados)." },
      { q: "Qual o risco de DUP associado ao uso de AINEs e qual a particularidade na anamnese?", a: "AINEs aumentam em 4x o risco de úlcera péptica (RR 4,4 para úlcera hemorrágica com álcool pesado). Dado crucial: até 40% dos pacientes NÃO relatam espontaneamente o uso de AINEs. Anamnese ativa e específica (incluindo AINEs de venda livre e aspirina) é obrigatória." },
      { q: "Qual o paradoxo epidemiológico da DUP em países ricos nas últimas décadas?", a: "A prevalência de H. pylori caiu (58% → 43%), mas úlceras por AINEs em idosos AUMENTARAM. Isso ocorre pelo envelhecimento populacional e maior uso crônico de aspirina/AINEs para doenças cardiovasculares e osteoarticulares." },
      { q: "O que é a DUP idiopática e qual sua taxa de recorrência?", a: "DUP H. pylori-negativa e AINE-negativa, cada vez mais prevalente (até 22% das úlceras em algumas séries). Taxa de recorrência de ~24%, a mais alta entre as etiologias, justamente por não haver causa tratável identificada." },
      { q: "Qual o percentual de úlceras pépticas assintomáticas e qual a implicação clínica?", a: "Aproximadamente 70% das úlceras são assintomáticas. Entre pacientes com úlceras hemorrágicas, 43-87% não tinham dispepsia prévia. Idosos e usuários de AINEs têm maior probabilidade de apresentação silenciosa." },
      { q: "Compare o padrão clássico de dor na úlcera duodenal vs. gástrica.", a: "UD: dor 2-5h após refeição (alimento neutraliza ácido → alívio inicial → depois estímulo ácido → dor), dor noturna (23h-2h), alívio com alimentação. UG: dor provocada pela alimentação, saciedade precoce, intolerância a gordura, náuseas, padrão noturno menos pronunciado." },
      { q: "Quais são as complicações da DUP e qual a mais comum?", a: "Hemorragia digestiva alta (mais comum), perfuração (2-10%), obstrução da saída gástrica, penetração em órgãos adjacentes e fistulização. Fatores de risco para hemorragia: idade >65, AINEs altas doses, anticoagulantes, aspirina, corticoides, úlcera complicada prévia." },
      { q: "Quais os achados da obstrução da saída gástrica na DUP e qual o distúrbio metabólico associado?", a: "Saciedade precoce, vômitos, distensão e perda de peso. Causada por úlceras no canal pilórico ou duodeno. Distúrbio metabólico: alcalose metabólica hipoclorêmica (pela perda de HCl nos vômitos)." },
      { q: "Como se apresenta a penetração de uma úlcera péptica e para onde ela mais frequentemente penetra?", a: "Dor que muda de padrão: mais intensa, localizada, com irradiação dorsal. Penetra mais frequentemente no pâncreas (úlceras posteriores). Apresenta hiperamilasemia leve e a dor não alivia com alimento/antiácido." },
      { q: "Qual a sensibilidade da EDA para DUP e quais características sugerem malignidade na úlcera gástrica?", a: "EDA: sensibilidade ~90%. Sugestivos de malignidade: massa ulcerada projetando-se para o lúmen, pregas nodulares/em clava ao redor da cratera, margens salientes/irregulares/espessadas. Úlceras benignas: bordas lisas, regulares, arredondadas, base plana com exsudato." },
