<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado AC2 · Sétimo Período</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #0f1420;
    --panel-2: #1a2333;
    --border: #1e2a44;
    --border-hover: #2d4166;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-3: #1d4ed8;
    --accent-glow: rgba(59,130,246,.35);
    --text: #f8fafc;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #10b981;
    --ok-glow: rgba(16,185,129,.3);
    --err: #ef4444;
    --err-glow: rgba(239,68,68,.3);
    --warn: #f59e0b;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(29,78,216,.06) 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
  }
  [hidden] { display: none !important; }

  aside.sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    background: linear-gradient(180deg, rgba(15,20,32,.6), rgba(0,0,0,.9));
    border-right: 1px solid var(--border);
    padding: 60px 20px 24px;
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0;
    overflow-y: auto;
    z-index: 50;
    backdrop-filter: blur(10px);
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden aside.sidebar { transform: translateX(-100%); }
  main {
    margin-left: var(--sidebar-w);
    transition: margin-left .35s cubic-bezier(.4,.2,.2,1);
    min-height: 100vh;
    padding: 48px 60px 80px;
  }
  body.sidebar-hidden main { margin-left: 0; }
  body.no-transition aside.sidebar,
  body.no-transition main { transition: none !important; }

  .sidebar-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 100;
    width: 36px; height: 36px;
    padding: 0;
    background: rgba(15,20,32,.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .sidebar-toggle:hover {
    color: var(--accent-2); border-color: var(--accent);
    background: rgba(59,130,246,.15);
  }
  .sidebar-toggle svg { transition: transform .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden .sidebar-toggle svg { transform: rotate(180deg); }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted-2); text-decoration: none;
    font-size: 12px; font-weight: 500; letter-spacing: .5px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid transparent;
    align-self: flex-start;
    transition: all .2s;
  }
  .back-link:hover { color: var(--accent-2); background: var(--panel); border-color: var(--border); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-2px); }

  .brand {
    text-align: center;
    padding: 20px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    margin: 0; font-family: 'Space Grotesk', sans-serif;
    font-size: 30px; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .brand .sub {
    color: var(--muted); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
    margin-top: 8px; font-weight: 500;
  }

  /* Overview of questions in sidebar */
  .q-list-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .q-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 0 4px 20px;
  }
  .q-cell {
    width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px; font-weight: 600;
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all .15s;
  }
  .q-cell:hover { border-color: var(--border-hover); color: var(--text); }
  .q-cell.current { background: linear-gradient(135deg, var(--accent-3), var(--accent)); color:#fff; border-color: transparent; box-shadow: 0 4px 12px var(--accent-glow); }
  .q-cell.correct { background: rgba(16,185,129,.15); color: var(--ok); border-color: var(--ok); }
  .q-cell.wrong { background: rgba(239,68,68,.15); color: var(--err); border-color: var(--err); }
  .q-cell.current.correct { background: var(--ok); color: #fff; box-shadow: 0 4px 12px var(--ok-glow); }
  .q-cell.current.wrong { background: var(--err); color: #fff; box-shadow: 0 4px 12px var(--err-glow); }

  /* Main content */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .crumb {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent-2);
    font-weight: 600;
  }
  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    font-family: inherit;
    transition: all .15s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--border-hover); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .progress-bar {
    height: 4px; background: var(--panel);
    border-radius: 999px; overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
    transition: width .3s ease;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .question-card {
    max-width: 820px;
    margin: 0 auto;
    animation: fadeUp .35s cubic-bezier(.34,1.2,.64,1) both;
  }
  .q-number {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.35);
    border-radius: 999px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .q-enun {
    font-size: 17px;
    line-height: 1.7;
    color: #e2e8f0;
    margin-bottom: 28px;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 24px 28px;
    border-radius: 14px;
  }

  .alts { display: flex; flex-direction: column; gap: 10px; }
  .alt {
    display: flex; gap: 14px; align-items: flex-start;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    text-align: left;
    font-family: inherit;
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    width: 100%;
  }
  .alt:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(59,130,246,.15);
  }
  .alt:disabled { cursor: default; }
  .alt-key {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-2);
    transition: all .2s;
  }
  .alt:hover:not(:disabled) .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt-text { flex: 1; }
  .alt.selected { border-color: var(--accent); background: rgba(59,130,246,.08); }
  .alt.selected .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt.correct-alt {
    border-color: var(--ok);
    background: rgba(16,185,129,.1);
    box-shadow: 0 0 0 1px var(--ok), 0 8px 20px var(--ok-glow);
  }
  .alt.correct-alt .alt-key { background: var(--ok); color: #fff; border-color: transparent; }
  .alt.wrong-alt {
    border-color: var(--err);
    background: rgba(239,68,68,.08);
    box-shadow: 0 0 0 1px var(--err);
  }
  .alt.wrong-alt .alt-key { background: var(--err); color: #fff; border-color: transparent; }
  .alt-badge {
    margin-left: 8px;
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    letter-spacing: 1px; text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
  }
  .alt.correct-alt .alt-badge {
    background: var(--ok); color: #fff;
  }
  .alt.wrong-alt .alt-badge {
    background: var(--err); color: #fff;
  }

  .confirm-wrap {
    margin-top: 24px;
    display: flex; justify-content: center;
  }
  .btn-confirm {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff;
    border: 1px solid transparent;
    padding: 14px 32px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .3px;
    box-shadow: 0 10px 24px var(--accent-glow);
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    min-width: 260px;
  }
  .btn-confirm:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px var(--accent-glow);
  }
  .btn-confirm:active:not(:disabled) { transform: translateY(0); }
  .btn-confirm:disabled {
    background: var(--panel);
    color: var(--muted);
    border-color: var(--border);
    box-shadow: none;
    cursor: not-allowed;
  }

  .feedback-panel {
    margin-top: 24px;
    animation: slideDown .4s cubic-bezier(.34,1.2,.64,1) both;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .feedback-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-radius: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .5px;
  }
  .feedback-header.correct {
    background: rgba(16,185,129,.12);
    border: 1px solid var(--ok);
    color: var(--ok);
  }
  .feedback-header.wrong {
    background: rgba(239,68,68,.12);
    border: 1px solid var(--err);
    color: var(--err);
  }

  .gabarito-toggle {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .2s;
  }
  .gabarito-toggle:hover { border-color: var(--accent); color: var(--accent-2); }
  .gabarito-toggle svg { transition: transform .3s; }
  .gabarito-toggle.open svg { transform: rotate(90deg); }

  .gabarito-body {
    margin-top: 14px;
    padding: 20px 24px;
    background: linear-gradient(145deg, rgba(59,130,246,.06), rgba(59,130,246,.02));
    border: 1px solid rgba(59,130,246,.25);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    line-height: 1.7;
    font-size: 14.5px;
    color: #dbeafe;
    animation: slideDown .3s cubic-bezier(.34,1.2,.64,1) both;
  }
  .gabarito-body .gab-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-2);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .gabarito-body .gab-answer {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--ok); margin-bottom: 10px;
  }

  .nav-buttons {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 32px;
    max-width: 820px; margin-left: auto; margin-right: auto;
  }
  .nav-btn {
    flex: 1;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .2s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--border-hover); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .nav-btn.primary:hover:not(:disabled) { transform: translateY(-2px); }

  /* End screen */
  .end-screen {
    max-width: 640px; margin: 0 auto; text-align: center;
    padding-top: 40px;
    animation: fadeUp .5s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px; font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -.5px;
  }
  .end-screen .subtitle {
    color: var(--muted-2); font-size: 15px;
    margin-bottom: 40px;
  }
  .donut {
    width: 240px; height: 240px;
    margin: 0 auto 32px; position: relative;
  }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .track { fill: none; stroke: var(--panel); stroke-width: 14; }
  .donut .fill-arc {
    fill: none; stroke-width: 14; stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,.2,.2,1);
  }
  .donut .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut .pct {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 56px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .donut .pct-label {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; font-weight: 600;
  }
  .badge {
    display: inline-flex; padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 32px;
  }
  .badge.excelente { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid var(--ok); }
  .badge.otimo { background: rgba(59,130,246,.15); color: var(--accent-2); border: 1px solid var(--accent); }
  .badge.regular { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid var(--warn); }
  .badge.melhorar { background: rgba(239,68,68,.15); color: var(--err); border: 1px solid var(--err); }
  .end-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 32px;
  }
  .end-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
  }
  .end-stat .val {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; font-weight: 700; line-height: 1;
  }
  .end-stat.correct .val { color: var(--ok); }
  .end-stat.wrong .val { color: var(--err); }
  .end-stat .lbl {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 8px; font-weight: 600;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  @media (max-width: 900px) {
    aside.sidebar {
      width: 100%; height: auto;
      position: relative; top: auto; left: auto;
      padding: 60px 20px 20px;
      transform: none;
    }
    body.sidebar-hidden aside.sidebar { transform: none; display: none; }
    .brand h1 { font-size: 26px; }
    main { padding: 24px 16px 60px; margin-left: 0; }
    body.sidebar-hidden main { margin-left: 0; }
    .q-grid { grid-template-columns: repeat(10, 1fr); }
  }
</style>
</head>
<body>
<script>
  try { if (localStorage.getItem('sidebarHidden') === '1') { document.body.classList.add('sidebar-hidden','no-transition'); requestAnimationFrame(() => document.body.classList.remove('no-transition')); } } catch (e) {}
</script>

<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Alternar barra lateral" title="Alternar barra lateral (B)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <line x1="9" y1="4" x2="9" y2="20"/>
  </svg>
</button>

<aside class="sidebar">
  <a href="index.html" class="back-link" title="Voltar ao Sétimo Período">

    <span>Sétimo Período</span>
  </a>
  <div class="brand">
    <h1>SIMULADO</h1>
    <div class="sub">AC 2 · 50 questões</div>
  </div>
  <div class="q-list-label">Navegação</div>
  <div class="q-grid" id="qGrid"></div>
</aside>

<main id="main">
  <div id="quiz"></div>
</main>

<script>
const QUESTIONS = [
  {
    n: 1,
    enunciado: "Mulher, 48 anos, assintomática, procura atendimento de rotina. IMC 31 kg/m2, circunferência abdominal 98 cm. Mãe com diabetes mellitus tipo 2. Exames laboratoriais: glicemia de jejum 118 mg/dL e hemoglobina glicada (HbA1c) 6,2%. Após repetição dos exames em nova amostra, os valores se confirmam. Com base nos critérios diagnósticos da ADA 2026, qual é o diagnóstico correto dessa paciente?",
    alternativas: {
      "A": "Diabetes mellitus tipo 2",
      "B": "Pré-diabetes",
      "C": "Resultado normal, sem necessidade de intervenção",
      "D": "Diabetes mellitus tipo MODY",
    },
    correta: "B",
    explicacao: "Alternativa B — Pré-diabetes. Os critérios da ADA 2026 definem pré-diabetes quando: glicemia de jejum entre 100–125 mg/dL (glicemia de jejum alterada), HbA1c entre 5,7–6,4%, ou TOTG 2h entre 140–199 mg/dL. A paciente apresenta glicemia de jejum 118 mg/dL e HbA1c 6,2%, ambos na faixa de pré-diabetes. Para diagnóstico de DM2, seriam necessários: glicemia de jejum ≥ 126 mg/dL, HbA1c ≥ 6,5%, TOTG ≥ 200 mg/dL ou glicemia aleatória ≥ 200 mg/dL com sintomas. A alternativa A está incorreta pois os valores estão abaixo dos pontos de corte para DM2. A alternativa C está incorreta pois os valores não são normais. A alternativa D está incorreta pois o MODY requer critérios clínicos específicos (história familiar autossômica dominante, diagnóstico em < 25 anos)."
  },
  {
    n: 2,
    enunciado: "Homem, 32 anos, profissional de saúde, procura atendimento após acidente com material biológico há 4 semanas. Assintomático. Exames do paciente-fonte: HBsAg positivo, HBeAg positivo. Exames do profissional acidentado: HBsAg negativo, anti-HBc total negativo, anti-HBs 285 mUI/mL. Qual é a interpretação correta do perfil sorológico do profissional acidentado?",
    alternativas: {
      "A": "Infecção aguda por hepatite B em fase inicial",

    explicacao: "Alternativa D — RHZE normal + piridoxina, estreptomicina CONTRAINDICADA. Na gestação, o tratamento da TB utiliza o esquema RHZE nas mesmas doses que para adultos não gestantes, associado a piridoxina (vitamina B6) 50 mg/dia para prevenir neuropatia periférica pela isoniazida. A estreptomicina é CONTRAINDICADA na gestação por risco de ototoxicidade fetal (surdez neurossensorial no recém-nascido). A alternativa A está incorreta pois o tratamento não deve ser adiado (risco materno-fetal da TB ativa supera os riscos do tratamento). A alternativa B está incorreta (o esquema completo com Z e E é utilizado). A alternativa C está incorreta pois estreptomicina é contraindicada."
  },
  {
    n: 49,
    enunciado: "Homem, 55 anos, com TEP maciço, Categoria D2 (choque normotenso: lactato 4,2 mmol/L, débito urinário 0,3 mL/kg/h, PA mantida a 95/60 mmHg com vasopressor). FC 125 bpm, SatO2 88% com cateter nasal de O2. Ecocardiograma: VD gravemente dilatado, septo interventricular retificado. Sobre o suporte hemodinâmico farmacológico no TEP agudo com choque, qual é o vasopressor de primeira escolha?",
    alternativas: {
      "A": "Noradrenalina",
      "B": "Dobutamina",
      "C": "Adrenalina",
      "D": "Vasopressina",
    },
    correta: "A",
    explicacao: "Alternativa A — Noradrenalina. A diretriz AHA/ACC 2026 estabelece noradrenalina como vasopressor de primeira escolha no TEP agudo com choque (Classe 1, NE C-LD). A noradrenalina (agonista α1 predominante com efeito β1 modesto) aumenta a RVS e restaura a pressão de perfusão coronariana do VD. Quando a dose ultrapassa 15 µg/min, deve-se associar um segundo vasopressor (vasopressina ou fenilefrina) em vez de escalonar, pois doses altas elevam a RVP. Volume deve ser cauteloso (≤ 500 mL) pois pode agravar a dilatação do VD. A alternativa B está incorreta pois dobutamina é adjuvante (aumenta IC à custa de queda da RVS). A alternativa C está incorreta pois adrenalina não é a primeira escolha. A alternativa D está incorreta pois vasopressina é agente de segunda linha."
  },
  {
    n: 50,
    enunciado: "Homem, 35 anos, imigrante, descobriu ser portador de hepatite B crônica em exame admissional. Assintomático. Exames: HBsAg positivo, HBeAg positivo, anti-HBe negativo, HBV-DNA 180.000.000 UI/mL, ALT 28 U/L (limite superior: 35 U/L para homens segundo critério revisado). Plaquetas 230.000/mm3, elastografia hepática 5,2 kPa (normal). Qual é a fase da história natural da hepatite B crônica em que se encontra este paciente?",
    alternativas: {
      "A": "Hepatite B crônica HBeAg-positiva (fase de atividade imune)",
      "B": "Infecção crônica HBeAg-negativa (portador inativo)",
      "C": "Infecção crônica HBeAg-positiva (fase de imunotolerância)",
      "D": "Hepatite B crônica HBeAg-negativa (fase de reativação)",
    },
    correta: "C",
    explicacao: "Alternativa C — Infecção crônica HBeAg-positiva (imunotolerância). A fase de infecção crônica HBeAg-positiva (antiga \"imunotolerância\") se caracteriza por: HBsAg positivo, HBeAg positivo, HBV-DNA muito elevado (tipicamente > 10I UI/mL), ALT normal ou minimamente elevada, e ausência de fibrose hepática significativa. É a fase inicial da hepatite B crônica adquirida perinatalmente. A alternativa A está incorreta pois a fase de atividade imune teria ALT elevada e menor carga viral. A alternativa B está incorreta pois na infecção HBeAg-negativa o HBeAg seria negativo e o anti-HBe positivo. A alternativa D está incorreta pois a reativação é HBeAg-negativa."
  }
];

const state = {
  index: 0,
  answers: {},   // { n: 'A'|'B'|'C'|'D' }  — respostas confirmadas
  pending: {},   // { n: 'A'|'B'|'C'|'D' }  — selecao antes de confirmar
  showGabarito: {},
  finished: false
};

const $main = document.getElementById('quiz');
const $grid = document.getElementById('qGrid');

/* Persistencia */
function saveState() {
  try { localStorage.setItem('simuladoAC2', JSON.stringify(state)); } catch (e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem('simuladoAC2');
    if (!raw) return;
    const s = JSON.parse(raw);
    Object.assign(state, s);
  } catch (e) {}
}
loadState();

function toggleSidebar() {
  const hidden = document.body.classList.toggle('sidebar-hidden');
  try { localStorage.setItem('sidebarHidden', hidden ? '1' : '0'); } catch (e) {}
}
document.addEventListener('keydown', (e) => {
  if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = e.target; const tag = (t && t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return;
    toggleSidebar();
  }
});

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function renderGrid() {
  $grid.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const cell = document.createElement('button');
    cell.className = 'q-cell';
    cell.textContent = String(q.n).padStart(2,'0');
    if (i === state.index) cell.classList.add('current');
    const a = state.answers[q.n];
    if (a) {
      if (a === q.correta) cell.classList.add('correct');
      else cell.classList.add('wrong');
    }
    cell.onclick = () => { state.index = i; state.finished = false; saveState(); render(); };
    $grid.appendChild(cell);
  });
}

function selectAlt(n, key) {
  if (state.answers[n]) return; // ja confirmada
  state.pending[n] = key;
  saveState();
  render();
}

function confirmAnswer(n) {
  const sel = state.pending[n];
  if (!sel || state.answers[n]) return;
  state.answers[n] = sel;
  delete state.pending[n];
  saveState();
  render();
}

function toggleGab(n) {
  state.showGabarito[n] = !state.showGabarito[n];
  saveState();
  render();
}

function next() {
  if (state.index < QUESTIONS.length - 1) {
    state.index++;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  } else {
    state.finished = true;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}
function prev() {
  if (state.finished) {
    state.finished = false;
    saveState(); render();
    return;
  }
  if (state.index > 0) {
    state.index--;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function resetQuiz() {
  if (!confirm('Reiniciar simulado? Suas respostas serão apagadas.')) return;
  state.index = 0;
  state.answers = {};
  state.showGabarito = {};
  state.finished = false;
  saveState();
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function classify(pct) {
  if (pct >= 90) return { key: 'excelente', label: 'Excelente' };
  if (pct >= 75) return { key: 'otimo', label: 'Ótimo' };
  if (pct >= 60) return { key: 'regular', label: 'Regular' };
  return { key: 'melhorar', label: 'Precisa Melhorar' };
}

function render() {
  renderGrid();
  if (state.finished) { renderEnd(); return; }
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[state.index];
  const answered = !!state.answers[q.n];
  const userAns = state.answers[q.n];
  const pending = state.pending[q.n];
  const correct = userAns === q.correta;
  const progress = ((state.index + 1) / QUESTIONS.length) * 100;
  const gabOpen = !!state.showGabarito[q.n];

  const alts = ['A','B','C','D'].map(k => {
    let cls = 'alt';
    let badge = '';
    if (answered) {
      if (k === q.correta) { cls += ' correct-alt'; badge = '<span class="alt-badge">Correta</span>'; }
      else if (k === userAns) { cls += ' wrong-alt'; badge = '<span class="alt-badge">Sua resposta</span>'; }
    } else if (pending === k) {
      cls += ' selected';
    }
    const disabled = answered ? 'disabled' : '';
    return '<button class="'+cls+'" '+disabled+' onclick="selectAlt('+q.n+', \''+k+'\')">' +
      '<div class="alt-key">'+k+'</div>' +
      '<div class="alt-text">'+esc(q.alternativas[k])+' '+badge+'</div>' +
      '</button>';
  }).join('');

  // Botão de confirmar (só antes de responder)
  let confirmBtn = '';
  if (!answered) {
    const disabled = pending ? '' : 'disabled';
    confirmBtn = '<div class="confirm-wrap">' +
      '<button class="btn-confirm" '+disabled+' onclick="confirmAnswer('+q.n+')">' +
        (pending ? 'Confirmar resposta ('+pending+')' : 'Selecione uma alternativa para responder') +
      '</button>' +
    '</div>';
  }

  let feedback = '';
  if (answered) {
    const iconOk = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="20 6 9 17 4 12"/></svg>';
    const iconErr = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    const headerCls = correct ? 'correct' : 'wrong';
    const headerTxt = correct
      ? 'Você acertou!'
      : 'Você errou — a resposta correta é ' + q.correta;
    const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>';
    feedback = '<div class="feedback-panel">' +
      '<div class="feedback-header '+headerCls+'">' +
        (correct ? iconOk : iconErr) +
        '<span>'+headerTxt+'</span>' +
      '</div>' +
      '<button class="gabarito-toggle '+(gabOpen?'open':'')+'" onclick="toggleGab('+q.n+')">' +
        chevron +
        '<span>'+(gabOpen ? 'Ocultar gabarito comentado' : 'Ver gabarito comentado')+'</span>' +
      '</button>' +
      (gabOpen ? (
        '<div class="gabarito-body">' +
          '<div class="gab-title">Gabarito Comentado</div>' +
          '<div class="gab-answer">Resposta: '+q.correta+'</div>' +
          '<div>'+esc(q.explicacao)+'</div>' +
        '</div>'
      ) : '') +
      '</div>';
  }

  const answeredCount = Object.keys(state.answers).length;

  $main.innerHTML =
    '<div class="toolbar">' +
      '<div class="crumb">Questão '+q.n+' de '+QUESTIONS.length+' · Respondidas: '+answeredCount+'</div>' +
      '<div class="actions">' +
        '<button class="btn" onclick="resetQuiz()">Reiniciar</button>' +
      '</div>' +
    '</div>' +
    '<div class="progress-bar"><div class="fill" style="width:'+progress+'%"></div></div>' +
    '<div class="question-card">' +
      '<div class="q-number">Questão '+String(q.n).padStart(2,'0')+'</div>' +
      '<div class="q-enun">'+esc(q.enunciado)+'</div>' +
      '<div class="alts">'+alts+'</div>' +
      confirmBtn +
      feedback +
    '</div>' +
    '<div class="nav-buttons">' +
      '<button class="nav-btn" onclick="prev()" '+(state.index===0?'disabled':'')+'>← Anterior</button>' +
      '<button class="nav-btn primary" onclick="next()">'+(state.index===QUESTIONS.length-1?'Ver resultado':'Próxima →')+'</button>' +
    '</div>';
}

function renderEnd() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach(q => {
    const a = state.answers[q.n];
    if (!a) return;
    if (a === q.correta) correct++;
    else wrong++;
  });
  const total = QUESTIONS.length;
  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  const cls = classify(pct);

  const r = 100;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct/100);
  const colorFor = {
    excelente: 'var(--ok)',
    otimo: 'var(--accent)',
    regular: 'var(--warn)',
    melhorar: 'var(--err)'
  }[cls.key];

  $main.innerHTML =
    '<div class="end-screen">' +
      '<h2>Simulado Concluído</h2>' +
      '<div class="subtitle">50 questões · AC 2 · 7º Período</div>' +
      '<div class="donut">' +
        '<svg viewBox="0 0 240 240">' +
          '<circle class="track" cx="120" cy="120" r="'+r+'"></circle>' +
          '<circle class="fill-arc" cx="120" cy="120" r="'+r+'"' +
            ' stroke="'+colorFor+'"' +
            ' stroke-dasharray="'+circ+'"' +
            ' stroke-dashoffset="'+circ+'"' +
            ' id="arc"></circle>' +
        '</svg>' +
        '<div class="center">' +
          '<div class="pct">'+pct+'%</div>' +
          '<div class="pct-label">Acertos</div>' +
        '</div>' +
      '</div>' +
      '<div class="badge '+cls.key+'">'+cls.label+'</div>' +
      '<div class="end-stats">' +
        '<div class="end-stat correct"><div class="val">'+correct+'</div><div class="lbl">Acertos</div></div>' +
        '<div class="end-stat wrong"><div class="val">'+wrong+'</div><div class="lbl">Erros</div></div>' +
        '<div class="end-stat"><div class="val">'+answered+'/'+total+'</div><div class="lbl">Respondidas</div></div>' +
      '</div>' +
      '<div class="nav-buttons">' +
        '<button class="nav-btn" onclick="prev()">← Ver questões</button>' +
        '<button class="nav-btn primary" onclick="resetQuiz()">Recomeçar simulado</button>' +
      '</div>' +
    '</div>';

  requestAnimationFrame(() => {
    const arc = document.getElementById('arc');
    if (arc) arc.style.strokeDashoffset = offset;
  });
}

render();
</script>
</body>
</html>
