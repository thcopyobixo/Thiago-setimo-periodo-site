<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado AC2 · Sétimo Período</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #0f1420;
    --panel-2: #1a2333;
    --border: #1e2a44;
    --border-hover: #2d4166;
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --accent-3: #1d4ed8;
    --accent-glow: rgba(59,130,246,.35);
    --text: #f8fafc;
    --muted: #64748b;
    --muted-2: #94a3b8;
    --ok: #10b981;
    --ok-glow: rgba(16,185,129,.3);
    --err: #ef4444;
    --err-glow: rgba(239,68,68,.3);
    --warn: #f59e0b;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11";
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(29,78,216,.06) 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
  }
  [hidden] { display: none !important; }

  aside.sidebar {
    width: var(--sidebar-w);
    height: 100vh;
    background: linear-gradient(180deg, rgba(15,20,32,.6), rgba(0,0,0,.9));
    border-right: 1px solid var(--border);
    padding: 60px 20px 24px;
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0;
    overflow-y: auto;
    z-index: 50;
    backdrop-filter: blur(10px);
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
  }
  body.sidebar-hidden aside.sidebar { transform: translateX(-100%); }
  main {
    margin-left: var(--sidebar-w);
    transition: margin-left .35s cubic-bezier(.4,.2,.2,1);
    min-height: 100vh;
    padding: 48px 60px 80px;
  }
  body.sidebar-hidden main { margin-left: 0; }
  body.no-transition aside.sidebar,
  body.no-transition main { transition: none !important; }

  .sidebar-toggle {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 100;
    width: 36px; height: 36px;
    padding: 0;
    background: rgba(15,20,32,.85);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(8px);
    font-family: inherit;
  }
  .sidebar-toggle:hover {
    color: var(--accent-2); border-color: var(--accent);
    background: rgba(59,130,246,.15);
  }
  .sidebar-toggle svg { transition: transform .35s cubic-bezier(.4,.2,.2,1); }
  body.sidebar-hidden .sidebar-toggle svg { transform: rotate(180deg); }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted-2); text-decoration: none;
    font-size: 12px; font-weight: 500; letter-spacing: .5px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid transparent;
    align-self: flex-start;
    transition: all .2s;
  }
  .back-link:hover { color: var(--accent-2); background: var(--panel); border-color: var(--border); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-2px); }

  .brand {
    text-align: center;
    padding: 20px 0;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    margin: 0; font-family: 'Unbounded', sans-serif;
    font-size: 30px; letter-spacing: 3px; font-weight: 700;
    background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .brand .sub {
    color: var(--muted); font-size: 10px;
    letter-spacing: 3px; text-transform: uppercase;
    margin-top: 8px; font-weight: 500;
  }

  /* Overview of questions in sidebar */
  .q-list-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .q-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 0 4px 20px;
  }
  .q-cell {
    width: 100%; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 12px; font-weight: 600;
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all .15s;
  }
  .q-cell:hover { border-color: var(--border-hover); color: var(--text); }
  .q-cell.current { background: linear-gradient(135deg, var(--accent-3), var(--accent)); color:#fff; border-color: transparent; box-shadow: 0 4px 12px var(--accent-glow); }
  .q-cell.correct { background: rgba(16,185,129,.15); color: var(--ok); border-color: var(--ok); }
  .q-cell.wrong { background: rgba(239,68,68,.15); color: var(--err); border-color: var(--err); }
  .q-cell.current.correct { background: var(--ok); color: #fff; box-shadow: 0 4px 12px var(--ok-glow); }
  .q-cell.current.wrong { background: var(--err); color: #fff; box-shadow: 0 4px 12px var(--err-glow); }

  /* Main content */
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .crumb {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent-2);
    font-weight: 600;
  }
  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    font-family: inherit;
    transition: all .15s;
  }
  .btn:hover { background: var(--panel-2); border-color: var(--border-hover); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent; font-weight: 600;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .progress-bar {
    height: 4px; background: var(--panel);
    border-radius: 999px; overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-3), var(--accent), var(--accent-2));
    transition: width .3s ease;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .question-card {
    max-width: 820px;
    margin: 0 auto;
    animation: fadeUp .35s cubic-bezier(.34,1.2,.64,1) both;
  }
  .q-number {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(59,130,246,.12);
    border: 1px solid rgba(59,130,246,.35);
    border-radius: 999px;
    font-family: 'Unbounded', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .q-enun {
    font-size: 17px;
    line-height: 1.7;
    color: #e2e8f0;
    margin-bottom: 28px;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 24px 28px;
    border-radius: 14px;
  }

  .alts { display: flex; flex-direction: column; gap: 10px; }
  .alt {
    display: flex; gap: 14px; align-items: flex-start;
    background: linear-gradient(145deg, #0f1420, #0a0e18);
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    text-align: left;
    font-family: inherit;
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    width: 100%;
  }
  .alt:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(59,130,246,.15);
  }
  .alt:disabled { cursor: default; }
  .alt-key {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-2);
    transition: all .2s;
  }
  .alt:hover:not(:disabled) .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt-text { flex: 1; }
  .alt.selected { border-color: var(--accent); background: rgba(59,130,246,.08); }
  .alt.selected .alt-key { background: var(--accent); color: #fff; border-color: transparent; }
  .alt.correct-alt {
    border-color: var(--ok);
    background: rgba(16,185,129,.1);
    box-shadow: 0 0 0 1px var(--ok), 0 8px 20px var(--ok-glow);
  }
  .alt.correct-alt .alt-key { background: var(--ok); color: #fff; border-color: transparent; }
  .alt.wrong-alt {
    border-color: var(--err);
    background: rgba(239,68,68,.08);
    box-shadow: 0 0 0 1px var(--err);
  }
  .alt.wrong-alt .alt-key { background: var(--err); color: #fff; border-color: transparent; }
  .alt-badge {
    margin-left: 8px;
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    letter-spacing: 1px; text-transform: uppercase;
    font-family: 'Unbounded', sans-serif;
  }
  .alt.correct-alt .alt-badge {
    background: var(--ok); color: #fff;
  }
  .alt.wrong-alt .alt-badge {
    background: var(--err); color: #fff;
  }

  .confirm-wrap {
    margin-top: 24px;
    display: flex; justify-content: center;
  }
  .btn-confirm {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff;
    border: 1px solid transparent;
    padding: 14px 32px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .3px;
    box-shadow: 0 10px 24px var(--accent-glow);
    transition: all .2s cubic-bezier(.34,1.2,.64,1);
    min-width: 260px;
  }
  .btn-confirm:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px var(--accent-glow);
  }
  .btn-confirm:active:not(:disabled) { transform: translateY(0); }
  .btn-confirm:disabled {
    background: var(--panel);
    color: var(--muted);
    border-color: var(--border);
    box-shadow: none;
    cursor: not-allowed;
  }

  .feedback-panel {
    margin-top: 24px;
    animation: slideDown .4s cubic-bezier(.34,1.2,.64,1) both;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .feedback-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-radius: 12px;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .5px;
  }
  .feedback-header.correct {
    background: rgba(16,185,129,.12);
    border: 1px solid var(--ok);
    color: var(--ok);
  }
  .feedback-header.wrong {
    background: rgba(239,68,68,.12);
    border: 1px solid var(--err);
    color: var(--err);
  }

  .gabarito-toggle {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .2s;
  }
  .gabarito-toggle:hover { border-color: var(--accent); color: var(--accent-2); }
  .gabarito-toggle svg { transition: transform .3s; }
  .gabarito-toggle.open svg { transform: rotate(90deg); }

  .gabarito-body {
    margin-top: 14px;
    padding: 20px 24px;
    background: linear-gradient(145deg, rgba(59,130,246,.06), rgba(59,130,246,.02));
    border: 1px solid rgba(59,130,246,.25);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    line-height: 1.7;
    font-size: 14.5px;
    color: #dbeafe;
    animation: slideDown .3s cubic-bezier(.34,1.2,.64,1) both;
  }
  .gabarito-body .gab-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-2);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .gabarito-body .gab-text p { margin: 0 0 10px; }
  .gabarito-body .gab-text ul { margin: 0 0 10px; padding-left: 20px; }
  .gabarito-body .gab-text li { margin: 4px 0; }
  .gabarito-body .gab-text > :last-child { margin-bottom: 0; }
  .gabarito-body .gab-text strong { color: #fff; }
  .gabarito-body .gab-answer {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px; font-weight: 700;
    color: var(--ok); margin-bottom: 10px;
  }

  .nav-buttons {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 32px;
    max-width: 820px; margin-left: auto; margin-right: auto;
  }
  .nav-btn {
    flex: 1;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .2s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--border-hover); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: .3; cursor: not-allowed; }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .nav-btn.primary:hover:not(:disabled) { transform: translateY(-2px); }

  /* End screen */
  .end-screen {
    max-width: 640px; margin: 0 auto; text-align: center;
    padding-top: 40px;
    animation: fadeUp .5s cubic-bezier(.34,1.2,.64,1) both;
  }
  .end-screen h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 34px; font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -.5px;
  }
  .end-screen .subtitle {
    color: var(--muted-2); font-size: 15px;
    margin-bottom: 40px;
  }
  .donut {
    width: 240px; height: 240px;
    margin: 0 auto 32px; position: relative;
  }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut .track { fill: none; stroke: var(--panel); stroke-width: 14; }
  .donut .fill-arc {
    fill: none; stroke-width: 14; stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,.2,.2,1);
  }
  .donut .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut .pct {
    font-family: 'Unbounded', sans-serif;
    font-size: 56px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .donut .pct-label {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; font-weight: 600;
  }
  .badge {
    display: inline-flex; padding: 12px 24px;
    border-radius: 999px;
    font-family: 'Unbounded', sans-serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 32px;
  }
  .badge.excelente { background: rgba(16,185,129,.15); color: var(--ok); border: 1px solid var(--ok); }
  .badge.otimo { background: rgba(59,130,246,.15); color: var(--accent-2); border: 1px solid var(--accent); }
  .badge.regular { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid var(--warn); }
  .badge.melhorar { background: rgba(239,68,68,.15); color: var(--err); border: 1px solid var(--err); }
  .end-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 32px;
  }
  .end-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
  }
  .end-stat .val {
    font-family: 'Unbounded', sans-serif;
    font-size: 28px; font-weight: 700; line-height: 1;
  }
  .end-stat.correct .val { color: var(--ok); }
  .end-stat.wrong .val { color: var(--err); }
  .end-stat .lbl {
    font-size: 11px; color: var(--muted-2);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 8px; font-weight: 600;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  @media (max-width: 900px) {
    aside.sidebar {
      width: 100%; height: auto;
      position: relative; top: auto; left: auto;
      padding: 60px 20px 20px;
      transform: none;
    }
    body.sidebar-hidden aside.sidebar { transform: none; display: none; }
    .brand h1 { font-size: 26px; }
    main { padding: 24px 16px 60px; margin-left: 0; }
    body.sidebar-hidden main { margin-left: 0; }
    .q-grid { grid-template-columns: repeat(10, 1fr); }
  }

  /* ==== Abas: Simulado geral / Provas por matéria ==== */
  .mode-switch {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin: 0 0 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(15, 20, 32, .7);
  }
  .mode-switch a {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 9px 6px 8px;
    border-radius: 9px;
    color: var(--muted-2);
    text-decoration: none;
    font-family: 'Unbounded', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .5px;
    text-align: center;
    line-height: 1.2;
    transition: color .25s, background .25s, box-shadow .25s, transform .15s;
  }
  .mode-switch a small {
    font-family: 'Albert Sans', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: .7;
  }
  .mode-switch a:hover { color: var(--text); background: rgba(59, 130, 246, .1); }
  .mode-switch a:active { transform: scale(.97); }
  .mode-switch a.active {
    color: #fff;
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    box-shadow: 0 6px 18px var(--accent-glow);
  }

  /* ==== Lista das provas na barra lateral ==== */
  .tabs-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 12px 10px; font-weight: 600;
  }
  .tabs { display: flex; flex-direction: column; gap: 3px; margin-bottom: 22px; }
  .tab {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    text-align: left;
    cursor: pointer;
    transition: all .2s cubic-bezier(.4, .2, .2, 1);
  }
  .tab:hover { background: var(--panel); color: var(--text); border-color: var(--border); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent-3), var(--accent));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px var(--accent-glow);
  }
  .tab-num {
    flex: none;
    font-family: 'Unbounded', sans-serif;
    font-weight: 700; font-size: 11px;
    padding: 2px 7px; border-radius: 6px;
    background: rgba(255, 255, 255, .06);
    color: var(--muted-2);
  }
  .tab.active .tab-num { background: rgba(255, 255, 255, .2); color: #fff; }
  .tab-name { flex: 1; min-width: 0; }
  .prova-kind {
    display: inline-block;
    font-style: normal;
    font-size: 9px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 1px 6px; margin-left: 2px;
    border-radius: 999px;

  "enunciado": "Homem de 34 anos, com HIV diagnosticado há 2 anos e sem terapia antirretroviral, tem CD4 de 45 células/µL. Há 6 semanas apresenta febre diária, perda de 8 kg, hepatoesplenomegalia e pápulas eritematosas disseminadas na pele. Exames: pancitopenia, LDH e ferritina muito elevadas, fosfatase alcalina 3 vezes o normal. TC de tórax: infiltrado micronodular difuso. Teste rápido molecular para tuberculose no escarro: não detectado. Viveu a infância em zona rural, onde limpava galinheiros.\n\nQual exame inicial é o mais sensível para a principal hipótese fúngica?",

  "correta": "C",
  "explicacaoHtml": "<p>O quadro é de histoplasmose disseminada: HIV com CD4 ≤ 150, febre, perda de peso, hepatoesplenomegalia, pancitopenia, lesões de pele, LDH e ferritina muito altas, infiltrado micronodular e exposição a excretas de aves. O exame inicial mais sensível é o antígeno de Histoplasma na urina (cerca de 97% no HIV avançado) e no soro, colhido junto com hemoculturas por lise-centrifugação. O tratamento grave não deve esperar a confirmação.</p><ul><li><strong>A — incorreta:</strong> os anticorpos podem ser negativos no imunossuprimido e demoram até 2 semanas.</li><li><strong>B — incorreta:</strong> o esfregaço de sangue periférico tem sensibilidade isolada menor que 10%.</li><li><strong>D — incorreta:</strong> o antígeno criptocócico é útil para criptococose, mas não confirma histoplasmose.</li></ul><p>Lembre que a tuberculose é o principal diferencial e pode coexistir: as duas devem ser investigadas.</p>"

  "alternativas": {

 {

  "alternativas": {

  "n": 23,
  "enunciado": "Homem de 52 anos, com cirrose por vírus C e ascite, teve aumento da creatinina de 1,0 para 2,4 mg/dL em 5 dias. Os diuréticos foram suspensos e ele recebeu albumina 1 g/kg/dia por 2 dias, sem melhora. PA 105 × 65 mmHg, sem choque. Não usou AINE, contraste nem aminoglicosídeo. Urina: proteinúria de 150 mg/dia, sem hematúria. Ultrassonografia renal normal.\n\nQual é o tratamento indicado?",
  "alternativas": {
   "A": "Hemodiálise imediata",
   "B": "Expansão com 2 litros de soro fisiológico",
   "C": "TIPS de urgência como primeira linha",
   "D": "Terlipressina associada à albumina"
  },
  "correta": "D",
  "explicacaoHtml": "<p>O paciente preenche os critérios de síndrome hepatorrenal com lesão renal aguda (SHR-AKI):</p><ul><li>cirrose com ascite;</li><li>AKI pelo critério do ICA;</li><li>ausência de resposta após 2 dias sem diurético e com albumina 1 g/kg;</li><li>ausência de choque;</li><li>ausência de nefrotóxicos;</li><li>ausência de doença parenquimatosa (proteinúria &lt; 500 mg/dia, sem hematúria, ultrassonografia normal).</li></ul><p>O tratamento de primeira linha é terlipressina associada à albumina (20–40 g/dia). Se não houver terlipressina, usa-se noradrenalina em UTI. O tratamento definitivo é o transplante hepático.</p><ul><li><strong>A — incorreta:</strong> a diálise fica restrita a ponte para transplante.</li><li><strong>B — incorreta:</strong> o soro fisiológico não reverte a vasodilatação esplâncnica e piora a ascite.</li><li><strong>C — incorreta:</strong> o TIPS não é primeira linha na SHR.</li></ul>"
 },
 {
  "n": 24,
  "enunciado": "Mulher de 50 anos, transplantada renal há 2 anos e em uso de tacrolimo e micofenolato, chega com febre alta, hipotensão que exige vasopressor, insuficiência respiratória, hepatoesplenomegalia e pancitopenia. Antígeno de Histoplasma na urina positivo. Não tem cefaleia nem alterações neurológicas, e o líquor é normal.\n\nQual é o tratamento inicial mais adequado?",
  "alternativas": {
   "A": "Anfotericina B lipossomal 3 mg/kg/dia por 1 a 2 semanas, seguida de itraconazol (ataque de 200 mg três vezes ao dia por 3 dias, depois 200 mg duas vezes ao dia), por pelo menos 12 meses no total, com redução da imunossupressão",
   "B": "Itraconazol oral 200 mg duas vezes ao dia, desde o início",
   "C": "Fluconazol 400 mg/dia por via oral",
   "D": "Anfotericina B lipossomal 5 mg/kg/dia por 4 a 6 semanas, por tratar-se de doença no SNC"
  },
  "correta": "A",
  "explicacaoHtml": "<p>A doença é grave (choque, insuficiência respiratória, pancitopenia, imunossupressão) e sem acometimento do SNC. A indução é feita com anfotericina B lipossomal 3 mg/kg/dia por 1–2 semanas. Quando o paciente estiver afebril, sem vasopressor e tolerando via oral, faz-se a transição para itraconazol (ataque de 200 mg 3 vezes ao dia por 3 dias, depois 200 mg 2 vezes ao dia). O tratamento total é de pelo menos 12 meses, e a imunossupressão deve ser reduzida ao mínimo.</p><ul><li><strong>B — incorreta:</strong> o itraconazol é fungistático e lento, adequado apenas para doença leve a moderada.</li><li><strong>C — incorreta:</strong> o fluconazol é o azol menos eficaz e seleciona resistência.</li><li><strong>D — incorreta:</strong> a dose de 5 mg/kg por 4–6 semanas é a do acometimento do SNC, que esta paciente não tem.</li></ul>"
 },
 {
  "n": 25,
  "enunciado": "Homem de 28 anos tem febre baixa vespertina, dor torácica ventilatório-dependente à esquerda e perda de 5 kg em 1 mês. A radiografia mostra derrame pleural moderado à esquerda. Toracocentese: líquido amarelo-citrino, exsudato, 2.800 células com 85% de linfócitos, glicose 75 mg/dL, adenosina deaminase (ADA) de 78 U/L, pH 7,35, bacterioscopia e pesquisa de BAAR negativas. HIV não reagente.\n\nQual é a conduta mais adequada?",
  "alternativas": {
   "A": "Drenagem torácica fechada por empiema",
   "B": "Aguardar o resultado da cultura para micobactéria (6 a 8 semanas) antes de tratar",
   "C": "Antibioticoterapia com ceftriaxona e azitromicina por pneumonia com derrame parapneumônico",
   "D": "Iniciar tratamento para tuberculose pleural com 2RHZE/4RH"
  },
  "correta": "D",
  "explicacaoHtml": "<p>Derrame pleural exsudativo com predomínio de linfócitos e ADA &gt; 40 U/L em adulto jovem, com sintomas constitucionais, tem alta acurácia para tuberculose pleural (sensibilidade de cerca de 93% e especificidade de cerca de 97%). Em área endêmica, isso permite iniciar o esquema básico 2RHZE/4RH. A baciloscopia do líquido costuma ser negativa, porque a forma é paucibacilar.</p><ul><li><strong>A — incorreta:</strong> não se trata de empiema (pH normal, glicose normal, predomínio linfocitário).</li><li><strong>B — incorreta:</strong> esperar a cultura atrasa o tratamento sem necessidade.</li><li><strong>C — incorreta:</strong> o derrame parapneumônico tem predomínio de neutrófilos.</li></ul>"
 },
 {
  "n": 26,
  "enunciado": "Mulher de 22 anos procura atendimento por cãibras e parestesias recorrentes. Exame: baixa estatura, face arredondada, obesidade e encurtamento do 4º e do 5º metacarpos. Exames: cálcio corrigido 7,6 mg/dL, fósforo 6,2 mg/dL, PTH 310 pg/mL (VR 15–65), magnésio 2,1 mg/dL, 25(OH)D 38 ng/mL, creatinina 0,7 mg/dL. TSH discretamente elevado.\n\nQual é o diagnóstico mais provável?",
  "alternativas": {
   "A": "Hipoparatireoidismo autoimune isolado",
   "B": "Pseudo-hipoparatireoidismo tipo 1A",
   "C": "Deficiência de vitamina D com hiperparatireoidismo secundário",
   "D": "Hipocalcemia autossômica dominante por mutação ativadora do CaSR"
  },
  "correta": "B",
  "explicacaoHtml": "<p>O padrão laboratorial é hipocalcemia com hiperfosfatemia e PTH elevado, com função renal e vitamina D normais. Isso indica resistência ao PTH, ou seja, pseudo-hipoparatireoidismo. O fenótipo de osteodistrofia hereditária de Albright (baixa estatura, face arredondada, obesidade e braquidactilia do 4º e 5º dedos), somado à resistência a outros hormônios (TSH elevado), caracteriza o tipo 1A, por mutação inativadora do GNAS herdada da mãe.</p><ul><li><strong>A — incorreta:</strong> no hipoparatireoidismo o PTH é baixo.</li><li><strong>C — incorreta:</strong> na deficiência de vitamina D o fósforo é baixo.</li><li><strong>D — incorreta:</strong> na hipocalcemia autossômica dominante o PTH é normal ou baixo.</li></ul>"
 },
 {
  "n": 27,
  "enunciado": "Homem de 81 anos, frágil e com doença pulmonar obstrutiva crônica moderada, tem angina aos esforços e um episódio de síncope ao subir escadas. Exame: sopro sistólico ejetivo rude em foco aórtico, irradiado para as carótidas, B2 hipofonética e pulso *parvus et tardus*. Ecocardiograma: velocidade máxima transvalvar de 4,6 m/s, gradiente médio de 48 mmHg, área valvar de 0,7 cm², FEVE de 60%. O risco cirúrgico estimado é alto.\n\nQual é a conduta mais adequada?",
  "alternativas": {
   "A": "Vasodilatador arterial (hidralazina) para reduzir a pós-carga",
   "B": "Valvuloplastia aórtica por balão como tratamento definitivo",
   "C": "Implante transcateter de válvula aórtica (TAVI) por via transfemoral, após avaliação pelo Heart Team",
   "D": "Observação clínica, já que a FEVE está preservada"
  },
  "correta": "C",
  "explicacaoHtml": "<p>A estenose aórtica é importante (velocidade máxima ≥ 4 m/s, gradiente médio ≥ 40 mmHg, área ≤ 1 cm²) e sintomática (angina e síncope), o que é indicação de intervenção, independentemente da FEVE. Como o paciente tem mais de 75 anos, é frágil e tem alto risco cirúrgico, o TAVI transfemoral é preferível, com decisão obrigatória do Heart Team.</p><ul><li><strong>A — incorreta:</strong> vasodilatadores são perigosos na estenose aórtica, porque o débito é fixo.</li><li><strong>B — incorreta:</strong> a valvuloplastia por balão serve apenas como ponte ou paliação.</li><li><strong>D — incorreta:</strong> após o início dos sintomas, a sobrevida sem intervenção é muito reduzida.</li></ul>"
 },
 {
  "n": 28,
  "enunciado": "Homem de 62 anos, com diabetes tipo 2 há 8 anos e insuficiência cardíaca com FEVE de 30% (NYHA II), usa metformina 2 g/dia, sacubitril-valsartana, bisoprolol e espironolactona. HbA1c de 7,2%, TFG estimada de 68 mL/min/1,73 m².\n\nQual é a melhor conduta para o diabetes, segundo a ADA 2026?",
  "alternativas": {
   "A": "Associar um inibidor de SGLT2 com benefício comprovado em insuficiência cardíaca, independentemente da HbA1c",
   "B": "Manter o esquema atual, pois a HbA1c está próxima da meta",
   "C": "Associar pioglitazona",
   "D": "Associar saxagliptina"
  },
  "correta": "A",
  "explicacaoHtml": "<p>Pela ADA 2026, em pacientes com DM2 e insuficiência cardíaca (com FE reduzida ou preservada), o iSGLT2 com benefício comprovado em IC está indicado com nível A, independentemente da HbA1c atual, da meta e do uso de metformina. O benefício cardiorrenal não depende da queda da glicemia.</p><ul><li><strong>B — incorreta:</strong> manter o esquema deixa de oferecer um benefício comprovado.</li><li><strong>C — incorreta:</strong> a pioglitazona causa retenção hídrica e é contraindicada na IC.</li><li><strong>D — incorreta:</strong> a saxagliptina se associou a aumento de hospitalização por IC.</li></ul>"
 },
 {
  "n": 29,
  "enunciado": "Mulher de 64 anos, com doença renal crônica G4 não dialítica, queixa-se de cansaço. Exames: Hb 9,0 g/dL, normocítica, ferritina 60 ng/mL, saturação de transferrina 14%, B12 e folato normais. Pesquisa de sangue oculto e endoscopias recentes sem sangramento.\n\nQual é a conduta inicial mais adequada para a anemia?",
  "alternativas": {
   "A": "Iniciar alfaepoetina com alvo de Hb acima de 13 g/dL",
   "B": "Transfundir concentrado de hemácias",
   "C": "Iniciar alfaepoetina imediatamente, sem repor ferro",
   "D": "Repor ferro (oral ou intravenoso) antes de considerar um agente estimulador da eritropoese"
  },
  "correta": "D",
  "explicacaoHtml": "<p>A anemia na DRC tem dois componentes: a deficiência de eritropoetina e a deficiência de ferro, absoluta ou funcional. Ferritina abaixo de 100 ng/mL com saturação de transferrina abaixo de 20% indica ferropenia. O ferro deve ser reposto primeiro e as causas reversíveis corrigidas, antes de pensar em agente estimulador da eritropoese. Quando o AEE for indicado, o alvo é Hb de cerca de 10–11,5 g/dL, e não acima de 13, faixa que aumenta AVC e eventos cardiovasculares.</p><ul><li><strong>A — incorreta:</strong> o alvo de Hb acima de 13 g/dL é perigoso.</li><li><strong>B — incorreta:</strong> a transfusão fica reservada a anemia aguda grave ou falha das outras terapias.</li><li><strong>C — incorreta:</strong> o AEE sem estoque de ferro não funciona.</li></ul>"
 },
 {
  "n": 30,
  "enunciado": "Homem de 50 anos está há 10 dias em uso de amoxicilina por sinusite e passa a ter febre baixa, exantema maculopapular e artralgia. A creatinina subiu de 0,9 para 2,8 mg/dL. Urina: leucocitúria estéril, cilindros leucocitários, hematúria discreta e eosinofilúria. Proteinúria de 0,6 g/24 h. PA 126/80 mmHg. Eosinofilia no hemograma.\n\nQual é o diagnóstico e a conduta?",
  "alternativas": {
   "A": "Necrose tubular aguda; hidratação vigorosa",
   "B": "Nefrite intersticial aguda induzida por fármaco; suspender a amoxicilina e considerar prednisona (cerca de 1 mg/kg/dia, com redução progressiva em 2 a 4 semanas) se não houver melhora rápida",
   "C": "Glomerulonefrite pós-estreptocócica; restrição de sal e diurético",
   "D": "Lesão renal aguda pré-renal; expansão com soro fisiológico"
  },
  "correta": "B",
  "explicacaoHtml": "<p>O quadro é de nefrite intersticial aguda induzida por fármaco:</p><ul><li>antibiótico betalactâmico como causa (os antibióticos, os IBPs e os AINEs respondem por 75–90% dos casos);</li><li>febre, rash, artralgia e eosinofilia (a tríade completa aparece em menos de 10% dos casos);</li><li>leucocitúria estéril, cilindros leucocitários e eosinofilúria;</li><li>proteinúria abaixo de 1 g/dia.</li></ul><p>O tratamento é suspender o medicamento. A prednisona (1 mg/kg/dia por 2 a 4 semanas, com redução progressiva) é considerada se não houver melhora rápida. A biópsia é o padrão-ouro diagnóstico.</p><ul><li><strong>A — incorreta:</strong> o sedimento da NTA tem cilindros granulosos, sem leucócitos.</li><li><strong>C — incorreta:</strong> a glomerulonefrite pós-estreptocócica cursa com hematúria dismórfica, edema e hipertensão.</li><li><strong>D — incorreta:</strong> os achados não correspondem a essa causa.</li></ul>"
 },
 {
  "n": 31,
  "enunciado": "Homem de 60 anos, com cirrose Child-Pugh B, é trazido pela família por desorientação temporal, sonolência e comportamento inadequado há 2 dias. Exame: *flapping* presente, sem sinais focais. Está há 5 dias sem evacuar. Sem febre, sem sangramento digestivo, eletrólitos normais. Paracentese sem sinais de PBE.\n\nQual é a conduta mais adequada?",
  "alternativas": {
   "A": "Restrição proteica rigorosa (menos de 0,5 g/kg/dia)",
   "B": "Rifaximina isolada como primeira linha",
   "C": "Tratar o fator precipitante e iniciar lactulose titulada para 2 a 3 evacuações pastosas por dia",
   "D": "Exigir dosagem de amônia sérica elevada antes de tratar"
  },
  "correta": "C",
  "explicacaoHtml": "<p>Desorientação temporal com *flapping* corresponde a encefalopatia hepática overt grau 2 de West Haven. O manejo tem dois pilares:</p><ul><li><strong>Identificar e tratar o precipitante:</strong> aqui, a constipação. Também devem ser investigados infecção, sangramento, distúrbios eletrolíticos e sedativos.</li><li><strong>Lactulose:</strong> primeira linha, titulada para 2–3 evacuações pastosas por dia.</li></ul><p>A rifaximina é associada à lactulose quando não há resposta ou como prevenção de recorrência.</p><ul><li><strong>A — incorreta:</strong> a restrição proteica é danosa e não deve ser feita (alvo de 1,2–1,5 g/kg/dia).</li><li><strong>B — incorreta:</strong> a rifaximina não é primeira linha isolada.</li><li><strong>D — incorreta:</strong> a amônia não é necessária para o diagnóstico, que é clínico.</li></ul>"
 },
 {
  "n": 32,
  "enunciado": "Homem de 29 anos, com testagem regular para ISTs, tinha anti-HCV não reagente há 3 meses. Agora apresenta fadiga e ALT de 900 U/L. Anti-HCV reagente e HCV-RNA detectável. HBsAg e anti-HIV não reagentes. Sem cirrose.\n\nQual é a conduta mais adequada?",
  "alternativas": {
   "A": "Aguardar 6 meses para observar o clareamento espontâneo e só tratar se o vírus persistir",
   "B": "Tratar já com sofosbuvir-velpatasvir por 12 semanas ou glecaprevir-pibrentasvir por 8 semanas",
   "C": "Interferon peguilado com ribavirina por 24 semanas",
   "D": "Tenofovir por 48 semanas"
  },
  "correta": "B",
  "explicacaoHtml": "<p>A hepatite C aguda está documentada (soroconversão em até 6 meses, com HCV-RNA detectável). A conduta atual é tratar durante a fase aguda, com os mesmos esquemas da infecção crônica: sofosbuvir-velpatasvir por 12 semanas ou glecaprevir-pibrentasvir por 8 semanas. O tratamento precoce interrompe a transmissão, sobretudo em populações de risco, e evita perder o seguimento do paciente.</p><ul><li><strong>A — incorreta:</strong> esperar o clareamento espontâneo era a conduta antiga.</li><li><strong>C — incorreta:</strong> o interferon está obsoleto.</li><li><strong>D — incorreta:</strong> o tenofovir trata o HBV, não o HCV.</li></ul>"
 },
 {
  "n": 33,
  "enunciado": "Homem de 48 anos tem há cerca de 1 ano dispneia progressiva, edema de membros inferiores e aumento do volume abdominal. Teve pericardite tuberculosa tratada há alguns anos. Exame: turgência jugular, sinal de Kussmaul, ascite, hepatomegalia e edema bilateral; ausculta pulmonar limpa. Ecocardiograma: pericárdio espessado, sinais de interdependência ventricular e FEVE preservada.\n\nQual é o diagnóstico e o tratamento definitivo?",
  "alternativas": {
   "A": "Insuficiência cardíaca com fração de ejeção reduzida; betabloqueador e IECA",
   "B": "Tamponamento cardíaco; pericardiocentese",
   "C": "Cirrose hepática descompensada; paracenteses de alívio",
   "D": "Pericardite constritiva crônica; pericardiectomia"
  },
  "correta": "D",
  "explicacaoHtml": "<p>O quadro é de insuficiência cardíaca direita predominante (turgência, Kussmaul, ascite, hepatomegalia) com pulmões limpos, FE preservada, pericárdio espessado e interdependência ventricular, após pericardite tuberculosa. Isso caracteriza pericardite constritiva crônica. A tuberculose é causa clássica de constrição, e o tratamento antituberculoso adequado reduz esse risco. Nos pacientes sintomáticos com doença estabelecida, o tratamento definitivo é a pericardiectomia.</p><ul><li><strong>A — incorreta:</strong> a FE é preservada.</li><li><strong>B — incorreta:</strong> não há grande derrame com colapso de câmaras.</li><li><strong>C — incorreta:</strong> a turgência jugular e o sinal de Kussmaul indicam causa cardíaca, não hepática.</li></ul>"
 },
 {
  "n": 34,
  "enunciado": "Mulher de 45 anos, previamente hígida, tem dor pleurítica à direita há 2 dias. Angiotomografia: TEP segmentar em lobo inferior direito, com relação VD/VE normal. Exame: PA 128/80 mmHg, FC 92 bpm, SatO₂ 96% em ar ambiente. sPESI = 0, critérios de Hestia todos negativos, sem risco hemorrágico, função renal normal. Tem boa rede de apoio e acesso a seguimento rápido.\n\nQual é a conduta mais adequada?",
  "alternativas": {
   "A": "Internação em UTI e trombólise sistêmica",
   "B": "Internação com heparina não fracionada intravenosa por 7 dias",
   "C": "Tratamento ambulatorial com anticoagulante oral direto (por exemplo, rivaroxabana 15 mg de 12/12 horas por 21 dias e depois 20 mg/dia)",
   "D": "Varfarina isolada, sem heparina, em regime ambulatorial"
  },
  "correta": "C",
  "explicacaoHtml": "<p>TEP sintomático com escore de gravidade baixo (sPESI 0, Hestia negativo) e VD normal corresponde à categoria B (B2, segmentar) da AHA/ACC 2026. A alta precoce e o tratamento ambulatorial são opções razoáveis quando há acesso ao anticoagulante e seguimento confiável. O DOAC é recomendado sobre a varfarina (classe 1), por menos sangramento maior e intracraniano. Rivaroxabana e apixabana dispensam heparina inicial, pois têm dose de ataque própria.</p><ul><li><strong>A — incorreta:</strong> trombólise está indicada só em instabilidade.</li><li><strong>B — incorreta:</strong> a HNF é inferior à HBPM e ao DOAC nesse cenário.</li><li><strong>D — incorreta:</strong> a varfarina exige ponte com heparina.</li></ul>"
 },
 {
  "n": 35,
  "enunciado": "João, 64 anos, 70 kg, tem diabetes tipo 2 e usa dapagliflozina/metformina 5/1.000 mg de 12/12 horas, glimepirida 6 mg pela manhã e pioglitazona 45 mg à noite. HbA1c de 7,9%. Glicemias capilares: antes do café 390 mg/dL, antes do almoço 160 mg/dL, após o almoço 192 mg/dL, antes do jantar 146 mg/dL.\n\nQual é a melhor estratégia?",
  "alternativas": {
   "A": "Insulinização plena basal-bolus com 0,5 UI/kg/dia, suspendendo todos os orais",
   "B": "Insulina regular 6 UI antes do café da manhã",
   "C": "Insulinização parcial com NPH 7 UI (0,1 UI/kg) ao deitar, mantendo os orais",
   "D": "Aumentar a glimepirida para 8 mg/dia"
  },
  "correta": "C",
  "explicacaoHtml": "<p>O paciente tem hiperglicemia predominantemente de jejum, com as demais glicemias quase na meta, apesar dos orais em dose plena. A estratégia é a insulinização parcial: insulina basal ao deitar (bedtime), com dose inicial de 0,1 UI/kg (70 × 0,1 = 7 UI de NPH), mantendo os orais. A insulina noturna controla a produção hepática de glicose e \"abaixa\" a glicemia de jejum.</p><ul><li><strong>A — incorreta:</strong> a insulinização plena não é necessária neste momento.</li><li><strong>B — incorreta:</strong> a insulina regular pela manhã não atua no jejum.</li><li><strong>D — incorreta:</strong> a glimepirida já está em dose alta e aumenta o risco de hipoglicemia.</li></ul><p>Ao associar insulina, vale rever a sulfonilureia, pelo risco de hipoglicemia.</p>"
 },
 {
  "n": 36,
  "enunciado": "Homem de 72 anos, hipertenso em uso de hidroclorotiazida e anlodipino, começou tansulosina há 2 semanas por hiperplasia prostática. Desde então tem tontura e escurecimento visual ao levantar da cama e, ontem, perdeu a consciência por poucos segundos logo após se levantar, com recuperação rápida. PA deitado após 5 minutos de repouso: 140/80 mmHg; após 3 minutos em pé: 112/70 mmHg, com reprodução dos sintomas. ECG normal.\n\nQual é o diagnóstico e a conduta inicial?",
  "alternativas": {
   "A": "Hipotensão ortostática induzida por fármacos; revisar e suspender ou reduzir os medicamentos hipotensores, com hidratação e medidas comportamentais",
   "B": "Síncope vasovagal; tilt test",
   "C": "Hipersensibilidade do seio carotídeo; marca-passo bicameral",
   "D": "Síncope arrítmica; Holter e estudo eletrofisiológico"
  },
  "correta": "A",
  "explicacaoHtml": "<p>A hipotensão ortostática se define por queda de 20 mmHg ou mais na PAS ou de 10 mmHg ou mais na PAD em até 3 minutos de pé. Este paciente teve queda de 28/10 mmHg, com sintomas e relação temporal clara com o início da tansulosina, em idoso que já usa diurético e vasodilatador. A conduta é:</p><ul><li>revisar e suspender ou reduzir os fármacos vasoativos;</li><li>hidratação adequada e sal;</li><li>levantar-se lentamente;</li><li>manobras de contrapressão;</li><li>meias compressivas;</li><li>cabeceira elevada.</li></ul><ul><li><strong>B — incorreta:</strong> tilt test e fludrocortisona/midodrina ficam para os casos persistentes.</li><li><strong>C e D — incorretas:</strong> não há elementos que sustentem essas causas.</li></ul>"
 },
 {
  "n": 37,
  "enunciado": "Homem de 40 anos, etilista, tem dor epigástrica intensa em faixa, irradiada para o dorso, com início há 12 horas, e vômitos. Exame: dor à palpação epigástrica, sem peritonite. Exames: lipase 5 vezes o limite superior, amilase normal. Hemodinamicamente estável.\n\nEm relação ao diagnóstico, é correto afirmar:",
  "alternativas": {

    const a = state.answers[q.n];
    if (a) {
      if (a === q.correta) cell.classList.add('correct');
      else cell.classList.add('wrong');
    }
    cell.onclick = () => { state.index = i; state.finished = false; saveState(); render(); };
    $grid.appendChild(cell);
  });
}

function selectAlt(n, key) {
  if (state.answers[n]) return; // ja confirmada
  state.pending[n] = key;
  saveState();
  render();
}

function confirmAnswer(n) {
  const sel = state.pending[n];
  if (!sel || state.answers[n]) return;
  state.answers[n] = sel;
  delete state.pending[n];
  saveState();
  render();
}

function toggleGab(n) {
  state.showGabarito[n] = !state.showGabarito[n];
  saveState();
  render();
}

function next() {
  if (state.index < QUESTIONS.length - 1) {
    state.index++;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  } else {
    state.finished = true;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}
function prev() {
  if (state.finished) {
    state.finished = false;
    saveState(); render();
    return;
  }
  if (state.index > 0) {
    state.index--;
    saveState();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function resetQuiz() {
  if (!confirm('Reiniciar simulado? Suas respostas serão apagadas.')) return;
  state.index = 0;
  state.answers = {};
  state.showGabarito = {};
  state.finished = false;
  saveState();
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function classify(pct) {
  if (pct >= 90) return { key: 'excelente', label: 'Excelente' };
  if (pct >= 75) return { key: 'otimo', label: 'Ótimo' };
  if (pct >= 60) return { key: 'regular', label: 'Regular' };
  return { key: 'melhorar', label: 'Precisa Melhorar' };
}

function render() {
  renderGrid();
  if (state.finished) { renderEnd(); return; }
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[state.index];
  const answered = !!state.answers[q.n];
  const userAns = state.answers[q.n];
  const pending = state.pending[q.n];
  const correct = userAns === q.correta;
  const progress = ((state.index + 1) / QUESTIONS.length) * 100;
  const gabOpen = !!state.showGabarito[q.n];

  const alts = ['A','B','C','D'].map(k => {
    let cls = 'alt';
    let badge = '';
    if (answered) {
      if (k === q.correta) { cls += ' correct-alt'; badge = '<span class="alt-badge">Correta</span>'; }
      else if (k === userAns) { cls += ' wrong-alt'; badge = '<span class="alt-badge">Sua resposta</span>'; }
    } else if (pending === k) {
      cls += ' selected';
    }
    const disabled = answered ? 'disabled' : '';
    return '<button class="'+cls+'" '+disabled+' onclick="selectAlt('+q.n+', \''+k+'\')">' +
      '<div class="alt-key">'+k+'</div>' +
      '<div class="alt-text">'+esc(q.alternativas[k])+' '+badge+'</div>' +
      '</button>';
  }).join('');

  // Botão de confirmar (só antes de responder)
  let confirmBtn = '';
  if (!answered) {
    const disabled = pending ? '' : 'disabled';
    confirmBtn = '<div class="confirm-wrap">' +
      '<button class="btn-confirm" '+disabled+' onclick="confirmAnswer('+q.n+')">' +
        (pending ? 'Confirmar resposta ('+pending+')' : 'Selecione uma alternativa para responder') +
      '</button>' +
    '</div>';
  }

  let feedback = '';
  if (answered) {
    const iconOk = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="20 6 9 17 4 12"/></svg>';
    const iconErr = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    const headerCls = correct ? 'correct' : 'wrong';
    const headerTxt = correct
      ? 'Você acertou!'
      : 'Você errou — a resposta correta é ' + q.correta;
    const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>';
    feedback = '<div class="feedback-panel">' +
      '<div class="feedback-header '+headerCls+'">' +
        (correct ? iconOk : iconErr) +
        '<span>'+headerTxt+'</span>' +
      '</div>' +
      '<button class="gabarito-toggle '+(gabOpen?'open':'')+'" onclick="toggleGab('+q.n+')">' +
        chevron +
        '<span>'+(gabOpen ? 'Ocultar gabarito comentado' : 'Ver gabarito comentado')+'</span>' +
      '</button>' +
      (gabOpen ? (
        '<div class="gabarito-body">' +
          '<div class="gab-title">Gabarito Comentado</div>' +
          '<div class="gab-answer">Resposta: '+q.correta+'</div>' +
          '<div class="gab-text">'+(q.explicacaoHtml || esc(q.explicacao))+'</div>' +
        '</div>'
      ) : '') +
      '</div>';
  }

  const answeredCount = Object.keys(state.answers).length;

  $main.innerHTML =
    '<div class="toolbar">' +
      '<div class="crumb">Questão '+q.n+' de '+QUESTIONS.length+' · Respondidas: '+answeredCount+'</div>' +
      '<div class="actions">' +
        '<button class="btn" onclick="resetQuiz()">Reiniciar</button>' +
      '</div>' +
    '</div>' +
    '<div class="progress-bar"><div class="fill" style="width:'+progress+'%"></div></div>' +
    '<div class="question-card">' +
      '<div class="q-number">Questão '+String(q.n).padStart(2,'0')+'</div>' +
      '<div class="q-enun">'+esc(q.enunciado)+'</div>' +
      '<div class="alts">'+alts+'</div>' +
      confirmBtn +
      feedback +
    '</div>' +
    '<div class="nav-buttons">' +
      '<button class="nav-btn" onclick="prev()" '+(state.index===0?'disabled':'')+'>← Anterior</button>' +
      '<button class="nav-btn primary" onclick="next()">'+(state.index===QUESTIONS.length-1?'Ver resultado':'Próxima →')+'</button>' +
    '</div>';
}

function renderEnd() {
  let correct = 0, wrong = 0;
  QUESTIONS.forEach(q => {
    const a = state.answers[q.n];
    if (!a) return;
    if (a === q.correta) correct++;
    else wrong++;
  });
  const total = QUESTIONS.length;
  const answered = correct + wrong;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  const cls = classify(pct);

  const r = 100;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct/100);
  const colorFor = {
    excelente: 'var(--ok)',
    otimo: 'var(--accent)',
    regular: 'var(--warn)',
    melhorar: 'var(--err)'
  }[cls.key];

  $main.innerHTML =
    '<div class="end-screen">' +
      '<h2>Simulado Concluído</h2>' +
      '<div class="subtitle">'+SIMS[SIM_ID].nome+' · '+QUESTIONS.length+' questões · AC 2 · 7º Período</div>' +
      '<div class="donut">' +
        '<svg viewBox="0 0 240 240">' +
          '<circle class="track" cx="120" cy="120" r="'+r+'"></circle>' +
          '<circle class="fill-arc" cx="120" cy="120" r="'+r+'"' +
            ' stroke="'+colorFor+'"' +
            ' stroke-dasharray="'+circ+'"' +
            ' stroke-dashoffset="'+circ+'"' +
            ' id="arc"></circle>' +
        '</svg>' +
        '<div class="center">' +
          '<div class="pct">'+pct+'%</div>' +
          '<div class="pct-label">Acertos</div>' +
        '</div>' +
      '</div>' +
      '<div class="badge '+cls.key+'">'+cls.label+'</div>' +
      '<div class="end-stats">' +
        '<div class="end-stat correct"><div class="val">'+correct+'</div><div class="lbl">Acertos</div></div>' +
        '<div class="end-stat wrong"><div class="val">'+wrong+'</div><div class="lbl">Erros</div></div>' +
        '<div class="end-stat"><div class="val">'+answered+'/'+total+'</div><div class="lbl">Respondidas</div></div>' +
      '</div>' +
      '<div class="nav-buttons">' +
        '<button class="nav-btn" onclick="prev()">← Ver questões</button>' +
        '<button class="nav-btn primary" onclick="resetQuiz()">Recomeçar simulado</button>' +
      '</div>' +
    '</div>';

  requestAnimationFrame(() => {
    const arc = document.getElementById('arc');
    if (arc) arc.style.strokeDashoffset = offset;
  });
}

render();
</script>
<script src="assets/efeitos.js"></script>
</body>
</html>
